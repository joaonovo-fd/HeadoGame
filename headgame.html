      ctx.lineWidth = Math.max(1, r * 0.8);
      ctx.beginPath();
      ctx.moveTo(tail.x, tail.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
  }

  // Impact flashes.
  for (const fx of game.arena.hitFx) {
    const fp = v3(fx.x, fx.y, fx.z);
    if (occludedFromCam(fp, cam)) continue;
    const p = project(fp, cam, view, basis);
    if (!p) continue;
    const a = clamp(fx.life / 0.3, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = "#fca5a5";
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(2, 26 * p.s) * (1.4 - a), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  return { basis, painted };
}

/**
 * A fighter, as a billboard: a shadow, a body, and the 2D game's own face.
 *
 * `self` is true for the fighter this viewport belongs to — their own body is
 * drawn but their head is skipped, because a third-person camera sitting behind
 * the head would otherwise fill the screen with the back of it.
 */
function drawFighterBillboard(f, cam, view, basis, self) {
  if (f.dead) return;
  /*
    Occlusion, tested against the CHEST rather than the feet: a fighter standing
    behind a waist-high crate should still be visible from the chest up, which is
    what the feet-only test got wrong. Their own body is exempt — the camera is
    right behind it, so a grazing crate must not blink the player out.
  */
  if (!self && occludedFromCam(v3(f.x, f.y + FIGHTER_H * 0.62, f.z), cam) &&
      occludedFromCam(v3(f.x, f.y + FIGHTER_H * 0.95, f.z), cam)) {
    return;
  }
  const feet = project(v3(f.x, f.y, f.z), cam, view, basis);
  const head = project(v3(f.x, f.y + FIGHTER_H, f.z), cam, view, basis);
  if (!feet || !head) return;

  // A ground shadow, which is what actually tells the player where a fighter is
  // standing — without it, a fighter and its position read as unrelated.
  const shR = Math.max(2, FIGHTER_R * feet.s);
  ctx.fillStyle = "rgba(0,0,0,0.34)";
  ctx.beginPath();
  ctx.ellipse(feet.x, feet.y, shR, shR * 0.38, 0, 0, Math.PI * 2);
  ctx.fill();

  // Jetpack exhaust, under the feet. Drawn before the body so the flame appears
  // to come out from beneath it.
  if (f.jetFx > 0) {
    const fl = Math.max(3, shR * 0.8);
    for (let i = 0; i < 3; i++) {
      const t = i / 3;
      ctx.globalAlpha = (1 - t) * 0.85;
      ctx.fillStyle = i === 0 ? "#fff7ed" : i === 1 ? "#fbbf24" : "#ef4444";
      ctx.beginPath();
      ctx.ellipse(feet.x, feet.y + fl * (0.5 + t * 1.4),
                  fl * (0.55 - t * 0.15), fl * (0.8 - t * 0.2), 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const hpx = Math.abs(feet.y - head.y);
  const bodyW = Math.max(3, FIGHTER_R * 1.35 * feet.s);
  const headR = Math.max(3, hpx * 0.26);

  // Torso.
  ctx.fillStyle = f.team.color;
  roundRect(feet.x - bodyW / 2, head.y + headR * 1.1, bodyW,
            Math.max(2, feet.y - head.y - headR * 1.1), Math.min(6, bodyW * 0.3));
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1;
  ctx.stroke();

  if (!self && headR > 4) {
    const look = lookForSeat(f.seat);
    const cy = head.y + headR;
    ctx.fillStyle = f.team.accent;
    ctx.beginPath();
    ctx.arc(feet.x, cy, headR, 0, Math.PI * 2);
    ctx.fill();
    // Reuse the 2D face and hat, so the same character appears in both modes.
    // "stunned" is the existing mood for being hit — the 2D game uses it for a
    // mine blast, and it reads exactly right for taking a round.
    drawFace(feet.x, cy, headR, 1, look.face, f.hurt > 0 ? "stunned" : "idle", f.team);
    drawHat(feet.x, cy, headR, 1, look.hat, f.team);

    // A floating health pip, so you can read how close an opponent is to death.
    const bw = Math.max(14, bodyW * 1.4), bh = 4;
    const by = cy - headR - 10;
    ctx.fillStyle = "rgba(6,12,22,0.75)";
    ctx.fillRect(feet.x - bw / 2, by, bw, bh);
    ctx.fillStyle = f.hp > 50 ? "#4ade80" : f.hp > 25 ? "#fbbf24" : "#ef4444";
    ctx.fillRect(feet.x - bw / 2, by, bw * (f.hp / HP_MAX), bh);
  }
}

/** Crosshair, health, ammo state and frags for one viewport. */
function drawArenaHUD(seat, view) {
  const A = game.arena;
  const f = A.fighters[seat];
  const cx = view.cx, cy = view.cy;

  // Crosshair: a gap in the middle so it never hides what it is aiming at.
  if (!f.dead) {
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 1.5;
    const g = 5, l = 9;
    ctx.beginPath();
    ctx.moveTo(cx - g - l, cy); ctx.lineTo(cx - g, cy);
    ctx.moveTo(cx + g, cy); ctx.lineTo(cx + g + l, cy);
    ctx.moveTo(cx, cy - g - l); ctx.lineTo(cx, cy - g);
    ctx.moveTo(cx, cy + g); ctx.lineTo(cx, cy + g + l);
    ctx.stroke();
    // Red while the shot is still cooling, so the rhythm of fire is visible.
    if (f.fireCD > 0) {
      ctx.fillStyle = "rgba(239,68,68,0.75)";
      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Health bar, bottom-left of this viewport.
  const bx = view.x + 16, by = view.y + view.h - 30;
  const bw = 170, bh = 14;
  ctx.fillStyle = "rgba(6,12,22,0.8)";
  roundRect(bx, by, bw, bh, 4);
  ctx.fill();
  const frac = clamp(f.hp / HP_MAX, 0, 1);
  ctx.fillStyle = frac > 0.5 ? "#4ade80" : frac > 0.25 ? "#fbbf24" : "#ef4444";
  roundRect(bx + 2, by + 2, (bw - 4) * frac, bh - 4, 3);
  ctx.fill();
  text(`${Math.max(0, Math.round(f.hp))}`, bx + bw / 2, by + bh / 2, 10,
       "#ffffff", "center", 900);

  // Superpower meter, directly above the health bar.
  if (game.rules.supers) {
    const def = superDef(f);
    const my = by - 9, mh = 5;
    ctx.fillStyle = "rgba(6,12,22,0.8)";
    ctx.fillRect(bx, my, bw, mh);
    const running = f.superT > 0;
    const frac = running ? clamp(f.superT / (def ? def.dur || 1 : 1), 0, 1)
                         : superFrac(f);
    const ready = superReady(f);
    ctx.fillStyle = running ? def.color
      : ready && Math.sin(performance.now() / 110) > 0 ? "#ffffff"
      : def ? def.color : "#7dd3fc";
    ctx.fillRect(bx, my, bw * frac, mh);
    if (ready) text(`${def ? def.label : "SUPER"} READY`, bx, my - 8, 9,
                    "#ffffff", "left", 900);
    else if (running) text(def.label, bx, my - 8, 9, def.color, "left", 900);
  }
  /*
    JETPACK fuel and WALL charges, stacked above the super meter. Both are
    spend-and-wait resources, so the player needs to see them at a glance or the
    abilities become guesswork.
  */
  if (game.rules.jetpack) {
    const jy = by - 26, jh = 4;
    ctx.fillStyle = "rgba(6,12,22,0.8)";
    ctx.fillRect(bx, jy, bw, jh);
    const frac = clamp(f.jet / A_JET_MAX, 0, 1);
    ctx.fillStyle = frac > 0.3 ? "#fbbf24" : "#ef4444";
    ctx.fillRect(bx, jy, bw * frac, jh);
    text("JET", bx - 6, jy + jh / 2, 8, "#fbbf24", "right", 800);
  }
  if (game.rules.walls3d) {
    // One pip per charge, filled if available — countable at a glance, which a
    // bar of two segments would not be.
    const wy = by - 40;
    for (let i = 0; i < A_WALL_CHARGES; i++) {
      const px = bx + i * 16;
      ctx.fillStyle = i < f.wallCharges ? "#a78bfa" : "rgba(167,139,250,0.22)";
      roundRect(px, wy, 12, 8, 2);
      ctx.fill();
    }
    text("WALL", bx - 6, wy + 4, 8, "#a78bfa", "right", 800);
  }
  // Carrying the ball, and how long is left before it slips.
  if (isCarrying(f)) {
    const frac = clamp(f.grabT / A_GRAB_T, 0, 1);
    text("HOLDING THE BALL", cx, cy + 62, 12, "#4ade80", "center", 900);
    const hw = 120;
    ctx.fillStyle = "rgba(6,12,22,0.75)";
    ctx.fillRect(cx - hw / 2, cy + 72, hw, 4);
    ctx.fillStyle = frac > 0.3 ? "#4ade80" : "#ef4444";
    ctx.fillRect(cx - hw / 2, cy + 72, hw * frac, 4);
    text("throw with KICK or GRAB", cx, cy + 88, 9, "#9fb4d0", "center", 700);
  } else if (game.arena.carriedBy >= 0) {
    text("opponent has the ball", cx, cy + 62, 10, "#fbbf24", "center", 800);
  }

  // Dash cooldown, as a small pip beside the health bar.
  if (game.rules.dash) {
    const px = bx + bw + 10, py = by + bh / 2;
    const cd = clamp(1 - f.dashCD / F_DASH_CD, 0, 1);
    ctx.fillStyle = cd >= 1 ? "#7dd3fc" : "rgba(125,211,252,0.28)";
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI * 2 * (cd >= 1 ? 1 : cd) - Math.PI / 2);
    if (cd < 1) ctx.lineTo(px, py);
    ctx.fill();
    text("DASH", px + 12, py, 8, cd >= 1 ? "#7dd3fc" : "#5f7391", "left", 800);
  }
  // Frozen or slowed by the opponent's power: say so, or it reads as a bug.
  if (f.frozen > 0) text("FROZEN", cx, cy + 40, 15, "#38bdf8", "center", 900);
  else if (f.slowed > 0) text("SLOWED", cx, cy + 40, 12, "#c084fc", "center", 900);
  if (f.shield > 0) text("SHIELDED", cx, cy - 40, 12, "#4ade80", "center", 900);

  /*
    GOALS, bottom-right, from this seat's point of view. Knockdowns are shown
    smaller beneath: they matter, but they do not win the match, and the HUD
    should not imply otherwise.
  */
  const foe = A.fighters[1 - seat];
  text(`${A.goals[seat]} — ${A.goals[1 - seat]}`,
       view.x + view.w - 18, by + bh / 2, 17, "#ffffff", "right", 900);
  text(`${seatLabel(seat)} vs ${seatLabel(1 - seat)}`,
       view.x + view.w - 18, by - 10, 9, "#9fb4d0", "right", 700);
  if (A.frags[seat] || A.frags[1 - seat]) {
    text(`knockdowns ${A.frags[seat]}–${A.frags[1 - seat]}`,
         view.x + view.w - 18, by + bh + 8, 8, "#6b819e", "right", 700);
  }

  /*
    A direction cue: which way is the goal you are attacking? Without it, a
    third-person camera in a symmetrical room leaves players genuinely unsure
    which end is theirs.
  */
  {
    const cam = A.cam[seat];
    const tz = aGoalLineZ(1 - seat);
    const dxg = 0 - cam.pos.x, dzg = tz - cam.pos.z;
    let rel = Math.atan2(dxg, dzg) - cam.yaw;
    while (rel > Math.PI) rel -= Math.PI * 2;
    while (rel < -Math.PI) rel += Math.PI * 2;
    const ax = view.x + view.w / 2 + clamp(rel, -1.2, 1.2) * (view.w * 0.3);
    const ay = view.y + 62;
    const behind = Math.abs(rel) > Math.PI / 2;
    ctx.fillStyle = behind ? "rgba(148,163,184,0.55)" : "rgba(125,211,252,0.9)";
    ctx.beginPath();
    ctx.moveTo(ax, ay - 6);
    ctx.lineTo(ax + 7, ay + 5);
    ctx.lineTo(ax - 7, ay + 5);
    ctx.closePath();
    ctx.fill();
    text(behind ? "goal behind you" : "attack", ax, ay + 14, 8,
         behind ? "#94a3b8" : "#7dd3fc", "center", 800);
  }

  if (f.dead) {
    text("DOWN", cx, cy - 14, 26, "#ef4444", "center", 900);
    text(`respawning in ${Math.max(0, f.respawn).toFixed(1)}s`,
         cx, cy + 12, 12, "#cddcf2", "center", 700);
  }
  // A hit flash, so taking damage is felt even when the shooter is off screen.
  if (f.hurt > 0 && game.opt.flash) {
    ctx.fillStyle = `rgba(239,68,68,${clamp(f.hurt, 0, 1) * 0.3})`;
    ctx.fillRect(view.x, view.y, view.w, view.h);
  }
  void foe;
}

/** The whole 3D scene: every viewport, then the shared match chrome. */
function drawArena3D() {
  const A = game.arena;
  if (!A) return;
  const theme = ARENA[MODE.ARENA3D];
  const views = arenaViews();

  for (let i = 0; i < views.length; i++) {
    const view = views[i];
    // The viewport this pass belongs to. Not split: always the mouse-owning
    // seat, falling back to seat 0 so a two-bot match still renders.
    const seat = A.split ? i : Math.max(0, arenaMouseSeat());
    const cam = A.cam[seat];

    ctx.save();
    // Clip, so a split view cannot paint into its neighbour.
    ctx.beginPath();
    ctx.rect(view.x, view.y, view.w, view.h);
    ctx.clip();

    drawArenaSky(view, theme);
    const { basis } = drawArenaWorld(cam, view, theme);
    // Fighters after the world, and the far one first so a near fighter paints
    // over a distant one.
    const order = [...A.fighters].sort((a, b) => {
      const da = v3len(v3sub(v3(a.x, a.y, a.z), cam.pos));
      const db = v3len(v3sub(v3(b.x, b.y, b.z), cam.pos));
      return db - da;
    });
    for (const f of order) drawFighterBillboard(f, cam, view, basis, f.seat === seat);
    drawArenaHUD(seat, view);

    ctx.restore();
  }

  // A divider, so the two halves of a split screen read as separate views.
  if (A.split) {
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, H / 2 - 1.5, W, 3);
  }

  drawArenaScoreboard();
  if (game.flash > 0 && game.opt.flash) {
    ctx.fillStyle = `rgba(255,255,255,${game.flash * 0.28})`;
    ctx.fillRect(0, 0, W, H);
  }

  // GOAL banner, across both viewports.
  if (A.celebrate > 0) {
    const scorer = game.lastScorer;
    const f = A.fighters[scorer];
    const a = clamp(A.celebrate / 0.6, 0, 1);
    ctx.globalAlpha = a;
    const bw = 420, bh = 62, bx = (W - bw) / 2, by = H / 2 - bh / 2;
    ctx.fillStyle = "rgba(6,12,22,0.9)";
    roundRect(bx, by, bw, bh, 12);
    ctx.fill();
    ctx.strokeStyle = f ? f.team.color : "#7dd3fc";
    ctx.lineWidth = 3;
    ctx.stroke();
    text("GOAL!", W / 2, by + 24, 30, f ? f.team.color : "#ffffff", "center", 900);
    text(`${seatLabel(scorer)}  ·  ${A.goals[0]} — ${A.goals[1]}`,
         W / 2, by + 46, 13, "#cddcf2", "center", 700);
    ctx.globalAlpha = 1;
  }

  if (game.opt.hints) {
    text(mouse.locked
           ? "kick with the mouse or your KICK key  ·  ESC — pause"
           : "CLICK to capture the mouse  ·  ESC — pause",
         W / 2, H - 8, 10, "rgba(143,163,192,0.75)", "center", 600);
  }
}

/** Frags and the clock, centred at the top and shared by both viewports. */
function drawArenaScoreboard() {
  const A = game.arena;
  const bw = 300, bh = 44, bx = (W - bw) / 2, by = 8;
  ctx.fillStyle = "rgba(6,12,22,0.82)";
  roundRect(bx, by, bw, bh, 10);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < 2; i++) {
    const f = A.fighters[i];
    const cx = i === 0 ? bx + 54 : bx + bw - 54;
    ctx.fillStyle = f.team.color;
    ctx.beginPath();
    ctx.arc(i === 0 ? bx + 20 : bx + bw - 20, by + bh / 2, 10, 0, Math.PI * 2);
    ctx.fill();
    // GOALS, not knockdowns: this is the number that wins the match.
    text(String(A.goals[i]), cx, by + bh / 2 - 2, 22, "#ffffff", "center", 900);
    text(game.cpu[i] ? "CPU" : `P${i + 1}`, cx, by + bh - 9, 8, "#9fb4d0", "center", 800);
  }

  if (game.matchSecs > 0) {
    const low = game.clock <= 10;
    const col = low && Math.sin(performance.now() / 120) > 0 ? "#ef4444" : "#ffffff";
    text(fmtClock(game.clock), W / 2, by + 17, 17, col, "center", 900);
  } else {
    text("∞", W / 2, by + 17, 15, "#5f7391", "center", 900);
  }
  text(`FIRST TO ${game.goalsToWin} GOALS`, W / 2, by + 34, 8, "#7dd3fc", "center", 800);
}

const fmtClock = (s) => {
  const t = Math.max(0, Math.ceil(s));
  return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
};

/** Label for a controller seat: entrant name in a tournament, else P1/P2. */
function seatLabel(i) {
  // Tournament entrants carry their own names; otherwise a seat is a local
  // player, the CPU, or the remote peer.
  const e = game.seats[i] !== null ? entrantById(game.seats[i]) : null;
  if (e) return e.name;
  if (game.cpu[i]) return `CPU ${cpuCfg().name}`;
  if (net.active && net.remoteSeat === i) return game.remoteName || "OPPONENT";
  return cleanName(game.names[i], DEFAULT_NAMES[i]);
}

/*
  MAIN MENU

  Structured rather than a flat list. Three visual tiers:

    1. The wordmark and a live attract scene behind everything.
    2. A left column of MATCH SETUP (what you are about to play) and a right
       column of PLAYERS (who is playing), so related rows sit together.
    3. A row of destination buttons, then one large primary START button.

  The previous version gave "PLAYER 1 NAME" exactly the same weight as "START",
  which is what made it read as a settings dialog instead of a game front-end.
  Row geometry is still published to layoutProbe so the fits-on-screen tests
  keep working.
*/

/** Which column a menu row belongs to. */
const MENU_GROUP = {
  name1: "players", name2: "players", opponent: "players", cpulevel: "players",
  mode: "setup", map: "setup", goals: "setup", time: "setup",
  chaos: "setup", players: "setup",
  rules: "nav", online: "nav", board: "nav", settings: "nav",
  controls: "nav", credits: "nav",
  roguelike: "action",
  start: "action",
};

function drawMenu() {
  drawMenuBackdrop();

  const rows = menuRows();
  const cur = rows[game.menuRow];

  drawLogo(W / 2, 48);
  text("LOCAL & ONLINE MULTIPLAYER SOCCER", W / 2, 82, 10, "#7dd3fc", "center", 800);
  // Version badge, top-left: the corners are the only space the menu leaves free,
  // and the menu has overflowed its canvas before, so nothing is added below.
  text(`v${VERSION}`, 16, 20, 10, "#5f7391", "left", 800);

  // ---- panel geometry --------------------------------------------------
  const colW = 400, gapX = 24;
  const leftX = (W - (colW * 2 + gapX)) / 2;
  const rightX = leftX + colW + gapX;
  const panelTop = 104;
  const panelH = 268;

  const panel = (x, title, accent) => {
    ctx.fillStyle = "rgba(8,15,28,0.78)";
    roundRect(x, panelTop, colW, panelH, 14);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Accent bar along the top edge.
    ctx.fillStyle = accent;
    roundRect(x + 14, panelTop + 12, 44, 4, 2);
    ctx.fill();
    text(title, x + 68, panelTop + 15, 10, accent, "left", 900);
  };

  panel(leftX, "MATCH SETUP", "#38bdf8");
  panel(rightX, "PLAYERS", "#a78bfa");

  layoutProbe.menu = { rows: rows.length, top: panelTop, rowH: 34, rowGap: 38,
                       bottom: H - 20, labels: [] };

  // ---- a value row inside a panel --------------------------------------
  const rowsIn = { setup: [], players: [], nav: [] };
  const push = (group, fn, key) => rowsIn[group].push({ fn, key });

  const valueRow = (x, y, w, label, value, hint, key) => {
    const on = cur === key;
    layoutProbe.menu.labels.push({ key, y, bottom: y + 34 });
    /*
      Three regions per row: tapping the LABEL selects the row, and tapping either
      END steps its value down or up. That mirrors what the arrow keys do, so a
      tap and a keypress reach the same handler — the row is selected first, then
      the step is applied, which is exactly the keyboard sequence.
    */
    const stepW = 44;
    clickable(x, y, w, 34, () => { game.menuRow = rows.indexOf(key); });
    clickable(x, y, stepW, 34, () => {
      game.menuRow = rows.indexOf(key);
      pressed[SCHEME[0].left] = true;
      keys[SCHEME[0].left] = true;
      tapKeys.push(SCHEME[0].left);
    });
    clickable(x + w - stepW, y, stepW, 34, () => {
      game.menuRow = rows.indexOf(key);
      pressed[SCHEME[0].right] = true;
      keys[SCHEME[0].right] = true;
      tapKeys.push(SCHEME[0].right);
    });

    if (on) {
      ctx.fillStyle = "rgba(125,211,252,0.14)";
      roundRect(x, y, w, 34, 8);
      ctx.fill();
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    text(label, x + 14, y + 17, 11, on ? "#e8f1ff" : "#8fa3c0", "left", 800);
    text(String(value), x + w - 32, y + 17, 14, on ? "#ffffff" : "#cddcf2", "right", 900);
    if (on) {
      text("‹", x + w - 132, y + 17, 15, "#7dd3fc", "center", 900);
      text("›", x + w - 14, y + 17, 15, "#7dd3fc", "center", 900);
    }
    return hint;
  };

  const nameRow = (x, y, w, label, seat, key) => {
    const on = cur === key;
    const editing = game.editing === seat;
    layoutProbe.menu.labels.push({ key, y, bottom: y + 34 });
    if (on) {
      ctx.fillStyle = editing ? "rgba(74,222,128,0.16)" : "rgba(125,211,252,0.14)";
      roundRect(x, y, w, 34, 8);
      ctx.fill();
      ctx.strokeStyle = editing ? "#4ade80" : "#7dd3fc";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    text(label, x + 14, y + 17, 11, on ? "#e8f1ff" : "#8fa3c0", "left", 800);
    nameField(x + w - 210, y + 4, 196, 26, game.names[seat], editing, "kick to type");
    return editing ? "typing — ENTER when done" : "";
  };

  // ---- LEFT: match setup ----------------------------------------------
  let ly = panelTop + 36;
  let hintText = "";
  const take = (h) => { if (h) hintText = h; };

  take(valueRow(leftX + 14, ly, colW - 28, "GAME MODE", MODE_LABEL[game.mode],
                MODE_HINT[game.mode], "mode"));
  ly += 38;
  if (rows.includes("map")) {
    const mp = mapById(game.mapId);
    take(valueRow(leftX + 14, ly, colW - 28, "ARENA", mp.name, mp.hint, "map"));
    ly += 38;
  }
  if (rows.includes("players")) {
    take(valueRow(leftX + 14, ly, colW - 28, "BRACKET SIZE", `${game.entrantCount} PLAYERS`,
                  `${tiesRemaining(game.entrantCount)} ties to win it`, "players"));
    ly += 38;
  }
  take(valueRow(leftX + 14, ly, colW - 28,
                game.mode === MODE.VOLLEY ? "POINTS TO WIN" : "GOALS TO WIN",
                game.goalsToWin, `first to ${game.goalsToWin} takes the match`, "goals"));
  ly += 38;
  take(valueRow(leftX + 14, ly, colW - 28, "MATCH CLOCK",
                game.matchSecs === 0 ? "UNLIMITED" : fmtClock(game.matchSecs),
                game.matchSecs === 0 ? "play until the target is reached"
                                     : "whoever leads at 0:00 wins", "time"));
  ly += 38;
  take(valueRow(leftX + 14, ly, colW - 28, "CHAOS MODE", game.chaos ? "ON" : "OFF",
                game.chaos ? `every stat re-rolls every ${chaosInterval().toFixed(0)}s`
                           : "stats stay as authored", "chaos"));

  // ---- RIGHT: players --------------------------------------------------
  let ry = panelTop + 36;
  take(nameRow(rightX + 14, ry, colW - 28,
               net.active ? "YOUR NAME" : "PLAYER 1", 0, "name1"));
  ry += 38;
  if (rows.includes("name2")) {
    take(nameRow(rightX + 14, ry, colW - 28, "PLAYER 2", 1, "name2"));
    ry += 38;
  }
  if (rows.includes("opponent")) {
    take(valueRow(rightX + 14, ry, colW - 28, "OPPONENT",
                  game.cpu[1] ? "COMPUTER" : "2 PLAYERS",
                  game.cpu[1] ? "you versus the CPU" : "share one keyboard", "opponent"));
    ry += 38;
  }
  if (rows.includes("cpulevel")) {
    take(valueRow(rightX + 14, ry, colW - 28, "CPU SKILL", cpuCfg().name,
                  ["forgiving and slow", "a fair match", "fast and ruthless"][game.cpuLevel],
                  "cpulevel"));
    ry += 38;
  }

  // Character previews, so the right panel is not just text.
  {
    const py = panelTop + panelH - 74;
    for (let i = 0; i < 2; i++) {
      const team = TEAMS[game.sel[i]] || TEAMS[0];
      const look = game.looks[i] || LOOK_DEFAULTS[i];
      const hx = rightX + colW * (i === 0 ? 0.3 : 0.7);
      const hr = 26;
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(hx, py + hr + 6, hr * 0.85, hr * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      const g = ctx.createRadialGradient(hx - 8, py - 10, 6, hx, py, hr);
      g.addColorStop(0, team.accent);
      g.addColorStop(1, team.color);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(hx, py, hr, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
      drawFace(hx, py, hr, i === 0 ? 1 : -1, look.face, "idle", team);
      drawHat(hx, py, hr, i === 0 ? 1 : -1, look.hat, team);
      const who = game.cpu[i] ? `CPU ${cpuCfg().name}`
                 : (net.active && net.remoteSeat === i) ? (game.remoteName || "OPPONENT")
                 : cleanName(game.names[i], DEFAULT_NAMES[i]);
      text(who, hx, py + hr + 20, 9, "#8fa3c0", "center", 800);
    }
    text("faces & hats are chosen on the team screen",
         rightX + colW / 2, panelTop + panelH - 12, 8, "#5f7391", "center", 600);
  }

  // ---- destination buttons --------------------------------------------
  const navKeys = ["rules", "online", "board", "controls", "credits", "settings"];
  const navLabels = {
    rules: ["SPAWN RATES", "#fbbf24"],
    online: ["PLAY ONLINE", "#38bdf8"],
    board: ["LEADERBOARD", "#a78bfa"],
    controls: ["CONTROLS", "#34d399"],
    credits: ["CREDITS", "#fb7185"],
    settings: ["SETTINGS", "#94a3b8"],
  };
  const visibleNav = navKeys.filter((k) => rows.includes(k));
  const navGap = 10, navH = 32;
  const perRow = 3;
  const navW = 190;
  const navY = panelTop + panelH + 10;

  visibleNav.forEach((k, i) => {
    const [label, accent] = navLabels[k];
    const on = cur === k;
    const row = Math.floor(i / perRow);
    const inRowCount = Math.min(perRow, visibleNav.length - row * perRow);
    const rowTotal = inRowCount * navW + (inRowCount - 1) * navGap;
    const col = i % perRow;
    const nx = (W - rowTotal) / 2 + col * (navW + navGap);
    const ny = navY + row * (navH + navGap);

    layoutProbe.menu.labels.push({ key: k, y: ny, bottom: ny + navH });
    // A nav button does one thing, so a tap selects it AND activates it.
    clickable(nx, ny, navW, navH, () => {
      game.menuRow = rows.indexOf(k);
      pressed.Space = true; keys.Space = true; tapKeys.push("Space");
    });
    ctx.fillStyle = on ? "rgba(255,255,255,0.14)" : "rgba(8,15,28,0.78)";
    roundRect(nx, ny, navW, navH, 8);
    ctx.fill();
    ctx.strokeStyle = on ? accent : "rgba(255,255,255,0.12)";
    ctx.lineWidth = on ? 2.5 : 1.5;
    ctx.stroke();
    text(label, nx + navW / 2, ny + navH / 2, 11, on ? accent : "#cddcf2", "center", 900);
  });
  const navRows = Math.ceil(visibleNav.length / perRow);
  const navBottom = navY + navRows * (navH + navGap);

  // ---- roguelike entry -------------------------------------------------
  {
    const on = cur === "roguelike";
    const bw3 = 320, bh3 = 38;
    const bx3 = (W - bw3) / 2, by3 = navBottom + 2;
    layoutProbe.menu.labels.push({ key: "roguelike", y: by3, bottom: by3 + bh3 });

    const g3 = ctx.createLinearGradient(bx3, by3, bx3 + bw3, by3);
    g3.addColorStop(0, on ? "#7c3aed" : "#1b1430");
    g3.addColorStop(1, on ? "#c026d3" : "#221838");
    ctx.fillStyle = g3;
    roundRect(bx3, by3, bw3, bh3, 9);
    ctx.fill();
    ctx.strokeStyle = on ? "#e879f9" : "rgba(192,132,252,0.35)";
    ctx.lineWidth = on ? 2.5 : 1.5;
    ctx.stroke();
    clickable(bx3, by3, bw3, bh3, () => {
      game.menuRow = rows.indexOf("roguelike");
      pressed.Space = true; keys.Space = true; tapKeys.push("Space");
    });
    text("⚔  ROGUELIKE RUN", W / 2, by3 + bh3 / 2 - 1, 14,
         on ? "#ffffff" : "#c4b5fd", "center", 900);
    const best = (() => {
      try { return parseInt(localStorage.getItem("headgame.runbest") || "0", 10) || 0; }
      catch (e) { return 0; }
    })();
    text(best ? `solo ladder · best ${best}/${RUN_STAGES.length}`
              : `solo ladder · ${RUN_STAGES.length} stages`,
         W / 2, by3 + bh3 - 6, 8, on ? "rgba(255,255,255,0.75)" : "#6b819e", "center", 600);
  }

  // ---- the primary action ---------------------------------------------
  {
    const on = cur === "start";
    const bw2 = 320, bh2 = 46;
    const bx2 = (W - bw2) / 2, by2 = navBottom + 44;
    layoutProbe.menu.labels.push({ key: "start", y: by2, bottom: by2 + bh2 });
    clickable(bx2, by2, bw2, bh2, () => {
      game.menuRow = rows.indexOf("start");
      pressed.Space = true; keys.Space = true; tapKeys.push("Space");
    });

    if (on) {
      // Breathing halo, so the primary action is unmistakable.
      const pulse = 0.5 + Math.sin(menuFx.t * 4) * 0.5;
      ctx.fillStyle = `rgba(74,222,128,${0.16 + pulse * 0.16})`;
      roundRect(bx2 - 8, by2 - 8, bw2 + 16, bh2 + 16, 16);
      ctx.fill();
    }
    const g = ctx.createLinearGradient(0, by2, 0, by2 + bh2);
    g.addColorStop(0, on ? "#5eead4" : "#1f2b3d");
    g.addColorStop(1, on ? "#22c55e" : "#16202f");
    ctx.fillStyle = g;
    roundRect(bx2, by2, bw2, bh2, 12);
    ctx.fill();
    ctx.strokeStyle = on ? "#a7f3d0" : "rgba(255,255,255,0.14)";
    ctx.lineWidth = on ? 3 : 1.5;
    ctx.stroke();
    text(game.mode === MODE.TOURNAMENT ? "START TOURNAMENT" : "START MATCH",
         W / 2, by2 + bh2 / 2 - 2, 21, on ? "#04240f" : "#8fa3c0", "center", 900);
    if (on) {
      text("press F or ENTER", W / 2, by2 + bh2 - 11, 8, "rgba(4,36,15,0.75)", "center", 800);
    }
  }

  // ---- contextual hint + controls --------------------------------------
  if (hintText) {
    text(hintText, W / 2, H - 34, 11, "#7dd3fc", "center", 700);
  }
  // Spell out that the arrows move along the button strip, since that is the
  // one place left/right navigates instead of changing a value.
  const onStrip = ["rules", "online", "board", "settings", "start"].includes(cur);
  text(onStrip
        ? "left/right — move between buttons   ·   F or ENTER — open"
        : "up/down — move   ·   left/right — change   ·   F or ENTER — select",
       W / 2, H - 15, 10, "#5f7391", "center", 600);
}

/** Wrap a long connection code so it fits the panel, returning the lines. */
function wrapCode(txt, perLine) {
  const out = [];
  for (let i = 0; i < txt.length; i += perLine) out.push(txt.slice(i, i + perLine));
  return out;
}

function drawOnline() {
  drawMenuBackdrop();

  // Header.
  text("PLAY ONLINE", W / 2, 42, 28, "#ffffff", "center", 900);
  text(net.transport === "relay"
         ? "connected through your own relay — no accounts, nothing stored"
         : "connect by address, or paste codes for a direct link",
       W / 2, 66, 11, "#8fa3c0", "center", 600);

  // ---- step rail: shows exactly where you are in the handshake ----------
  const steps = net.role === "guest"
    ? ["GET CODE", "SEND REPLY", "PLAY"]
    : ["SHARE CODE", "PASTE REPLY", "PLAY"];
  let stage = 0;
  if (net.role === "host") {
    stage = net.state === "offer" ? 0 : net.state === "connecting" ? 1 : net.state === "live" ? 2 : 0;
  } else if (net.role === "guest") {
    stage = net.state === "await-offer" ? 0 : net.state === "answer" ? 1 : net.state === "live" ? 2 : 0;
  }
  // The rail describes the two-code handshake, which the relay does not have.
  if (net.role && net.transport !== "relay") {
    const rw = 150, gap = 16, totalW = steps.length * rw + (steps.length - 1) * gap;
    let rx = (W - totalW) / 2;
    for (let i = 0; i < steps.length; i++) {
      const done = i < stage, now = i === stage;
      ctx.fillStyle = done ? "rgba(74,222,128,0.22)"
                    : now ? "rgba(125,211,252,0.22)" : "rgba(255,255,255,0.05)";
      roundRect(rx, 86, rw, 30, 15);
      ctx.fill();
      ctx.strokeStyle = done ? "#4ade80" : now ? "#7dd3fc" : "rgba(255,255,255,0.12)";
      ctx.lineWidth = now ? 2.5 : 1.5;
      ctx.stroke();
      text((done ? "✓ " : `${i + 1} · `) + steps[i], rx + rw / 2, 101, 11,
           done ? "#4ade80" : now ? "#e8f1ff" : "#5f7391", "center", 800);
      rx += rw + gap;
    }
  }

  const bx = 130, bw = W - 260;
  const card = (y, h, accent) => {
    ctx.fillStyle = "rgba(255,255,255,0.045)";
    roundRect(bx, y, bw, h, 12);
    ctx.fill();
    ctx.strokeStyle = accent || "rgba(255,255,255,0.12)";
    ctx.lineWidth = 2;
    ctx.stroke();
  };

  /** Code panel with a copy prompt and a visible character count. */
  const codePanel = (y, code, label, action) => {
    const lines = wrapCode(code, 84);
    const shown = lines.slice(0, 6);
    const h = 30 + shown.length * 12;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    roundRect(bx + 18, y, bw - 36, h, 8);
    ctx.fill();
    ctx.strokeStyle = "rgba(125,211,252,0.35)";
    ctx.lineWidth = 1;
    ctx.stroke();
    text(label, bx + 30, y + 13, 9, "#7dd3fc", "left", 900);
    text(`${code.length} chars`, bx + bw - 30, y + 13, 9, "#5f7391", "right", 700);
    ctx.font = "9px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.textAlign = "left";
    ctx.fillStyle = "#86efac";
    shown.forEach((ln, i) => ctx.fillText(ln, bx + 30, y + 28 + i * 12));
    if (lines.length > shown.length) {
      text(`…+${lines.length - shown.length} more lines (copy gets all of it)`,
           bx + 30, y + h - 4, 9, "#5f7391", "left", 600);
    }
    // Big call to action.
    const cy = y + h + 14;
    ctx.fillStyle = net.copied ? "rgba(74,222,128,0.2)" : "#7dd3fc";
    roundRect(W / 2 - 150, cy, 300, 36, 8);
    ctx.fill();
    text(net.copied ? "✓ COPIED — now send it" : action,
         W / 2, cy + 18, 13, net.copied ? "#4ade80" : "#0b1220", "center", 900);
    return h + 50;
  };

  /** Paste target with a live indication of what is in the buffer. */
  const pastePanel = (y, prompt) => {
    const has = !!net.paste;
    ctx.fillStyle = has ? "rgba(74,222,128,0.12)" : "rgba(0,0,0,0.35)";
    roundRect(bx + 18, y, bw - 36, 56, 8);
    ctx.fill();
    ctx.strokeStyle = has ? "#4ade80" : "rgba(255,255,255,0.16)";
    ctx.lineWidth = has ? 2 : 1.5;
    ctx.setLineDash(has ? [] : [5, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    if (has) {
      text(`✓ ${net.paste.length} characters ready`, W / 2, y + 22, 13, "#a7f3d0", "center", 800);
      text("press ENTER to connect", W / 2, y + 40, 12, "#4ade80", "center", 900);
    } else {
      text(prompt, W / 2, y + 22, 13, "#cddcf2", "center", 700);
      text("⌘V on Mac  ·  Ctrl-V on Windows", W / 2, y + 40, 11, "#6b819e", "center", 600);
    }
    return 66;
  };

  // ---- role picker ------------------------------------------------------
  if (net.state === "idle" || net.state === "failed") {
    const opt = (y, key, title, blurb, colour) => {
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      roundRect(bx + 24, y, bw - 48, 46, 9);
      ctx.fill();
      ctx.strokeStyle = colour;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = colour;
      roundRect(bx + 36, y + 8, 28, 28, 6);
      ctx.fill();
      text(key, bx + 50, y + 22, 15, "#0b1220", "center", 900);
      text(title, bx + 76, y + 17, 13, "#e8f1ff", "left", 800);
      text(blurb, bx + 76, y + 34, 10, "#8fa3c0", "left", 600);
    };

    /*
      ADDRESS-BASED play is listed FIRST and described as the easy path, because
      it is: one player runs the relay and reads out an address, rather than both
      players copying long codes in opposite directions. The code-based WebRTC
      flow stays below it for anyone who wants a direct connection.
    */
    if (net.editing || net.relayIntent) {
      card(104, 250, "#4ade80");
      const joining = net.relayIntent === "join";
      text(joining ? "JOIN BY ADDRESS" : "HOST BY ADDRESS",
           W / 2, 130, 18, "#4ade80", "center", 900);

      const field = (y, label, value, name, hint) => {
        const on = net.editing === name;
        ctx.fillStyle = on ? "rgba(74,222,128,0.12)" : "rgba(0,0,0,0.35)";
        roundRect(bx + 30, y, bw - 60, 40, 8);
        ctx.fill();
        ctx.strokeStyle = on ? "#4ade80" : "rgba(255,255,255,0.16)";
        ctx.lineWidth = on ? 2.5 : 1.5;
        ctx.stroke();
        text(label, bx + 44, y + 13, 9, "#8fa3c0", "left", 800);
        const shown = value || hint;
        text(shown + (on ? "▌" : ""), bx + 44, y + 28, 13,
             value ? "#ffffff" : "#5f7391", "left", 700);
      };
      field(152, "HOST ADDRESS", net.relayAddr, "addr", `localhost:${RELAY_PORT_DEFAULT}`);
      if (joining) field(202, "GAME CODE", net.relayCode, "code", "ABCD");

      const iy = joining ? 254 : 210;
      if (!joining) {
        text("start the relay first:", W / 2, iy, 11, "#cddcf2", "center", 700);
        text("node tools/relay.js", W / 2, iy + 18, 12, "#a7f3d0", "center", 900);
        text("it prints the address to share", W / 2, iy + 36, 10, "#6b819e", "center", 600);
      } else {
        text("ask the host for their address and 4-letter code",
             W / 2, iy, 11, "#cddcf2", "center", 700);
      }
      text("TAB switches field  ·  ENTER confirms  ·  ESC cancels",
           W / 2, 336, 10, "#6b819e", "center", 600);
    } else {
      card(104, 292, "#7dd3fc");
      text("How do you want to connect?", W / 2, 126, 16, "#e8f1ff", "center", 800);
      text("BY ADDRESS — easiest", bx + 30, 148, 10, "#4ade80", "left", 900);
      opt(156, "A", "HOST by address", "run the relay, share the address", "#4ade80");
      opt(206, "S", "JOIN by address", "type the host's address and code", "#7dd3fc");
      text("BY CODE — direct connection, no relay", bx + 30, 268, 10, "#fbbf24", "left", 900);
      opt(276, "H", "HOST a match", "share a code, paste their reply", "#fbbf24");
      opt(326, "J", "JOIN with a code", "paste the code the host sends", "#fb923c");
      text(`L — host a tournament for up to ${TOURN_MAX} players`,
           W / 2, 384, 10, "#a78bfa", "center", 700);
    }

    text(`playing as ${cleanName(game.names[0], DEFAULT_NAMES[0])}`,
         W / 2, 410, 11, "#7dd3fc", "center", 700);
  }

  /*
    RELAY host: the address and code to read out. Deliberately large, because the
    whole point is that it can be spoken aloud or messaged in one line.
  */
  if (net.transport === "relay" && net.role === "host" &&
      (net.state === "offer" || net.state === "creating")) {
    card(150, 210, "#4ade80");
    if (net.relayCode) {
      text("YOUR GAME IS OPEN", W / 2, 182, 15, "#4ade80", "center", 900);
      text(net.relayCode, W / 2, 232, 58, "#ffffff", "center", 900);
      text("the other player needs this code", W / 2, 272, 11, "#cddcf2", "center", 700);
      text(`…and this address:  ${net.relayAddr}`, W / 2, 296, 12, "#a7f3d0", "center", 800);
      text("waiting for them to join…", W / 2, 328, 11, "#7dd3fc", "center", 600);
    } else {
      text("connecting to the relay…", W / 2, 232, 16, "#7dd3fc", "center", 800);
      text(net.relayUrl || net.relayAddr, W / 2, 256, 11, "#6b819e", "center", 600);
    }
  }
  if (net.transport === "relay" && net.role === "guest" &&
      (net.state === "creating" || net.state === "connecting")) {
    card(170, 130, "#7dd3fc");
    text(net.state === "creating" ? "connecting to the relay…" : "joining the game…",
         W / 2, 216, 16, "#7dd3fc", "center", 800);
    text(net.relayUrl, W / 2, 242, 11, "#6b819e", "center", 600);
    if (net.relayCode) text(`code ${net.relayCode}`, W / 2, 262, 12, "#a7f3d0", "center", 800);
  }

  // The relay draws its own connecting panels above, so this is WebRTC only.
  if (net.state === "creating" && net.transport !== "relay") {
    card(150, 110, "#7dd3fc");
    text("preparing connection…", W / 2, 196, 17, "#7dd3fc", "center", 800);
    text("gathering network candidates", W / 2, 220, 11, "#6b819e", "center", 600);
  }

  // ---- host flow --------------------------------------------------------
  if (net.role === "host" && (net.state === "offer" || net.state === "connecting")) {
    card(128, 330, "#4ade80");
    text("YOU ARE HOSTING", W / 2, 152, 14, "#4ade80", "center", 900);
    const used = codePanel(168, net.offerText, "YOUR INVITE CODE", "PRESS  C  TO COPY");
    pastePanel(168 + used, "waiting for your friend's reply code");
    if (net.state === "connecting") {
      text("connecting…", W / 2, 168 + used + 80, 13, "#7dd3fc", "center", 800);
    }
  }

  // ---- guest flow -------------------------------------------------------
  if (net.state === "await-offer") {
    card(140, 200, "#fbbf24");
    text("JOINING A MATCH", W / 2, 166, 14, "#fbbf24", "center", 900);
    pastePanel(184, "paste the host's invite code");
    text("ask the host to press C and send you their code",
         W / 2, 292, 11, "#6b819e", "center", 600);
  }

  if (net.role === "guest" && net.state === "answer") {
    card(128, 280, "#fbbf24");
    text("ONE MORE STEP", W / 2, 152, 14, "#fbbf24", "center", 900);
    codePanel(168, net.answerText, "YOUR REPLY CODE", "PRESS  C  TO COPY");
    text("send it back to the host, then wait here",
       W / 2, 380, 12, "#8fa3c0", "center", 600);
  }

  // ---- connected --------------------------------------------------------
  if (net.state === "live") {
    card(120, 250, "#4ade80");
    text("✓ CONNECTED", W / 2, 154, 26, "#4ade80", "center", 900);

    // Who's who.
    const me = cleanName(game.names[net.localSeat < 0 ? 0 : net.localSeat],
                         DEFAULT_NAMES[0]);
    const them = game.remoteName || "OPPONENT";
    const half = bw / 2;
    text("YOU", bx + half * 0.5, 196, 10, "#7dd3fc", "center", 800);
    text(me, bx + half * 0.5, 216, 17, "#ffffff", "center", 900);
    text(netIsHost() ? "PLAYER 1 · left" : "PLAYER 2 · right",
         bx + half * 0.5, 236, 10, "#8fa3c0", "center", 600);

    text("vs", W / 2, 216, 12, "#5f7391", "center", 700);

    text("OPPONENT", bx + half * 1.5, 196, 10, "#fbbf24", "center", 800);
    text(them, bx + half * 1.5, 216, 17, "#ffffff", "center", 900);
    text(netIsHost() ? "PLAYER 2 · right" : "PLAYER 1 · left",
         bx + half * 1.5, 236, 10, "#8fa3c0", "center", 600);

    /*
      Version agreement. Host authority assumes both machines simulate the same
      rules, so a differing build is called out here — as a warning, since close
      versions normally play fine and refusing to connect would be worse.
    */
    if (net.versionMismatch) {
      text(`⚠ their build is ${net.peerVersion || "unknown"} · yours is v${VERSION}`,
           W / 2, 262, 10, "#fbbf24", "center", 800);
    } else {
      text(`both on v${VERSION}`, W / 2, 262, 9, "#5f7391", "center", 700);
    }

    if (netIsHost()) {
      ctx.fillStyle = "#4ade80";
      roundRect(W / 2 - 150, 286, 300, 44, 9);
      ctx.fill();
      text("PRESS  F  TO START", W / 2, 308, 15, "#0b1220", "center", 900);
      text(game.mode === MODE.TOURNAMENT
            ? "you host the bracket; your rival plays their own ties"
            : "you host the simulation — their screen follows yours",
           W / 2, 348, 11, "#8fa3c0", "center", 600);
    } else {
      text("waiting for the host to start…", W / 2, 300, 15, "#7dd3fc", "center", 800);
      text("you play with the ARROW keys and ENTER", W / 2, 324, 11, "#8fa3c0", "center", 600);
    }
  }

  /*
    LOBBY: the join code plus everyone who has arrived. Drawn in the band below
    the card, which is unused in every other state.
  */
  if (net.state === "lobby") {
    card(112, 250, "#a78bfa");
    text("TOURNAMENT LOBBY", W / 2, 136, 18, "#a78bfa", "center", 900);
    const used = codePanel(156, net.offerText,
                           "CODE FOR THE NEXT PLAYER",
                           "PRESS C TO COPY, THEN SEND IT");
    pastePanel(156 + used, "PASTE THEIR REPLY AND PRESS ENTER");

    // Who is in.
    const seats = clamp(net.peers.length + 1, TOURN_MIN, TOURN_MAX);
    text(`${net.peers.length + 1} of ${TOURN_MAX} PLAYERS`, W / 2, 384, 10,
         "#7dd3fc", "center", 900);
    const rowH = 20, listTop = 400;
    for (let i = 0; i < seats; i++) {
      const peer = i === 0 ? null : peerByEntrant(i);
      const mine = i === 0;
      const label = mine ? cleanName(game.names[0], "PLAYER 1")
                         : peer ? cleanName(peer.name || "", `PLAYER ${i + 1}`)
                                : `CPU ${i}`;
      const tag = mine ? "you (host)" : peer ? "connected" : "computer";
      const col = mine ? "#4ade80" : peer ? "#ffffff" : "#6b819e";
      const y = listTop + i * rowH;
      if (y > H - 60) break;                 // never spill off the screen
      text(`${i + 1}.`, W / 2 - 150, y, 10, "#5f7391", "left", 800);
      text(label, W / 2 - 126, y, 11, col, "left", 800);
      text(tag, W / 2 + 150, y, 9, col, "right", 600);
    }
    /*
      Keep the footer clear of the last row. A full eight-player list ends at
      y=540 and the naive `+6` put this line at 548 — overlapping it.
    */
    const bottom = Math.min(listTop + seats * rowH + 14, H - 46);
    text(net.peers.length
           ? "press F to start the tournament  ·  the host must stay connected"
           : "waiting for the first player to join",
         W / 2, bottom, 10, net.peers.length ? "#fbbf24" : "#6b819e", "center", 700);
    if (net.joinNoteT > 0 && net.joinNote) {
      text(net.joinNote, W / 2, 370, 10, "#4ade80", "center", 800);
    }
  }

  if (net.state === "closed") {
    card(150, 120, "#f87171");
    text("connection closed", W / 2, 196, 18, "#f87171", "center", 800);
    text("press ESC to go back and try again", W / 2, 222, 12, "#8fa3c0", "center", 600);
  }

  if (net.error) text(net.error, W / 2, H - 62, 12, "#f87171", "center", 700);
  text("ESC — back to setup", W / 2, H - 28, 11, "#6b819e", "center", 600);
}

/** A text field with a blinking caret while it is being edited. */
function nameField(x, y, w, h, value, active, placeholder) {
  ctx.fillStyle = active ? "rgba(125,211,252,0.16)" : "rgba(0,0,0,0.35)";
  roundRect(x, y, w, h, 6);
  ctx.fill();
  ctx.strokeStyle = active ? "#7dd3fc" : "rgba(255,255,255,0.14)";
  ctx.lineWidth = active ? 2.5 : 1.5;
  ctx.stroke();

  const shown = value || "";
  const caret = active && Math.floor(performance.now() / 380) % 2 === 0 ? "▌" : "";
  if (shown) {
    text(shown + caret, x + 12, y + h / 2, 15, "#ffffff", "left", 800);
  } else {
    text(caret || placeholder, x + 12, y + h / 2, 14,
         caret ? "#ffffff" : "#5f7391", "left", active ? 800 : 600);
  }
}

function drawRoster() {
  drawMenuBackdrop();

  text("TOURNAMENT ROSTER", W / 2, 48, 28, "#ffffff", "center", 900);
  text(`${game.entrantCount} players  ·  ${tiesRemaining(game.entrantCount)} ties to a champion`,
       W / 2, 74, 12, "#8fa3c0", "center", 600);

  const n = game.entrantCount;
  const cols = n > 4 ? 2 : 1;
  const fw = cols === 2 ? 380 : 460;
  const startX = cols === 2 ? (W - (fw * 2 + 24)) / 2 : (W - fw) / 2;
  const rows = Math.ceil(n / cols);
  const top = 112;
  const fh = 44, gap = 10;

  for (let i = 0; i < n; i++) {
    const col = cols === 2 ? Math.floor(i / rows) : 0;
    const row = cols === 2 ? i % rows : i;
    const x = startX + col * (fw + 24);
    const y = top + row * (fh + gap);
    const active = game.rosterEdit === i;
    const sel = game.rosterCursor === i;

    // Seed marker.
    ctx.fillStyle = sel ? "#7dd3fc" : "rgba(255,255,255,0.10)";
    roundRect(x, y, 34, fh, 6);
    ctx.fill();
    text(String(i + 1), x + 17, y + fh / 2, 15, sel ? "#0b1220" : "#8fa3c0", "center", 900);

    const isCpu = !!game.rosterCpu[i];
    if (isCpu) {
      // A CPU seat shows a badge instead of an editable name field.
      ctx.fillStyle = sel ? "rgba(251,191,36,0.18)" : "rgba(255,255,255,0.05)";
      roundRect(x + 42, y, fw - 42, fh, 6);
      ctx.fill();
      ctx.strokeStyle = sel ? "#fbbf24" : "rgba(255,255,255,0.14)";
      ctx.lineWidth = sel ? 2.5 : 1.5;
      ctx.stroke();
      text(`COMPUTER · ${cpuCfg().name}`, x + 56, y + fh / 2, 13,
           sel ? "#fde68a" : "#8fa3c0", "left", 800);
    } else {
      nameField(x + 42, y, fw - 42, fh, game.rosterNames[i], active,
                `player ${i + 1} name`);
    }

    if (sel && !active) {
      const tip = i === 0 ? "kick to rename"
                : isCpu ? "◄ ► for a human"
                : "◄ ► for a CPU  ·  kick to rename";
      text(tip, x + fw + 10, y + fh / 2, 9, "#6b819e", "left", 600);
    }
  }

  // START row.
  const sy = top + rows * (fh + gap) + 12;
  const onStart = game.rosterCursor === n;
  ctx.fillStyle = onStart ? "#4ade80" : "rgba(255,255,255,0.08)";
  roundRect(W / 2 - 150, sy, 300, 48, 10);
  ctx.fill();
  text("BEGIN TOURNAMENT", W / 2, sy + 24, 17, onStart ? "#0b1220" : "#cddcf2", "center", 900);

  text(game.rosterEdit >= 0
        ? "type a name  ·  ENTER to confirm"
        : "up/down to choose  ·  left/right for HUMAN or CPU  ·  kick to rename or begin",
       W / 2, H - 30, 12, "#6b819e", "center", 600);
}

/** A vertical list of choices, used by the pause and settings screens. */
/**
 * A vertical list of rows, as used by the pause and settings screens.
 *
 * `onPick` is optional: given one, each row becomes clickable and the callback
 * receives its index. Shared by both screens, so making the list tappable made
 * both tappable at once.
 */
function drawMenuList(items, cursor, x, y, w, rowH, gap, onPick) {
  items.forEach((it, i) => {
    const on = i === cursor;
    const ry = y + i * (rowH + gap);
    if (onPick) clickable(x, ry, w, rowH, () => onPick(i));
    ctx.fillStyle = on ? "rgba(255,255,255,0.13)" : "rgba(255,255,255,0.05)";
    roundRect(x, ry, w, rowH, 9);
    ctx.fill();
    if (on) {
      ctx.strokeStyle = it.accent || "#7dd3fc";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    const mid = ry + rowH / 2;
    if (it.value === undefined) {
      text(it.label, x + w / 2, mid, 17, on ? (it.accent || "#ffffff") : "#cddcf2",
           "center", 900);
    } else {
      text(it.label, x + 24, mid - (it.hint ? 6 : 0), 14, "#cddcf2", "left", 800);
      if (it.hint) text(it.hint, x + 24, mid + 12, 9, "#6b819e", "left", 600);
      // ON/OFF pill.
      const pw = 62, px = x + w - pw - 24;
      ctx.fillStyle = it.value ? "#4ade80" : "rgba(255,255,255,0.12)";
      roundRect(px, mid - 11, pw, 22, 11);
      ctx.fill();
      text(it.value ? "ON" : "OFF", px + pw / 2, mid + 1, 11,
           it.value ? "#0b1220" : "#8fa3c0", "center", 900);
      if (on) {
        text("◄", px - 16, mid, 12, "#7dd3fc", "center", 900);
        text("►", px + pw + 16, mid, 12, "#7dd3fc", "center", 900);
      }
    }
  });
}

/** Freeze-frame of the match, dimmed, behind an overlay. */
function drawFrozenPitch() {
  const keep = game.scene;
  game.scene = game.pauseFrom || SCENE.PLAY;
  try {
    /*
      A paused 3D match must show the arena behind the overlay, not the soccer
      pitch. Without this the pause screen showed a green field the player was
      demonstrably not standing on.
    */
    if (game.arena && game.mode === MODE.ARENA3D) {
      drawArena3D();
      game.scene = keep;
      return;
    }
    drawPitch();
    drawPlatforms();
    drawWalls();
    if (hasNet()) drawNet();
    if (game.mode === MODE.BASKET) drawHoops();
    drawMines();
    drawHelpers();
    drawPowerups();
    if (game.players[0]) drawPlayer(game.players[0]);
    if (game.players[1]) drawPlayer(game.players[1]);
    drawBall();
    drawBullets();
    drawScoreboard();
  } catch (e) {
    // A half-built match shouldn't stop the overlay from appearing.
  }
  game.scene = keep;
}

function drawPause() {
  drawFrozenPitch();

  ctx.fillStyle = "rgba(5,10,18,0.86)";
  ctx.fillRect(0, 0, W, H);

  // A framed card, so pause matches the menu's panelled look.
  const cw = 420, rowH = 38, rowGap = 7;
  // Height follows the row count, so adding a row can never overflow the card.
  const ch = 96 + PAUSE_ITEMS.length * (rowH + rowGap) + 14;
  const cx0 = (W - cw) / 2, cy0 = 62;
  ctx.fillStyle = "rgba(8,15,28,0.85)";
  roundRect(cx0, cy0, cw, ch, 16);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = "#fbbf24";
  roundRect(cx0 + 20, cy0 + 18, 46, 4, 2);
  ctx.fill();

  layoutProbe.pause = { x: cx0, y: cy0, w: cw, h: ch, bottom: cy0 + ch,
                        rows: PAUSE_ITEMS.length };

  text("PAUSED", W / 2, cy0 + 52, 34, "#ffffff", "center", 900);

  // Context line: what you are paused inside.
  const modeName = MODE_LABEL[game.mode] || "MATCH";
  const ctxLine = game.mode === MODE.TOURNAMENT
    ? `${modeName} · round ${game.round} · ${seatLabel(0)} vs ${seatLabel(1)}`
    : `${modeName} · ${seatLabel(0)} ${game.score[0]} – ${game.score[1]} ${seatLabel(1)}`;
  text(ctxLine, W / 2, cy0 + 78, 11, "#8fa3c0", "center", 600);

  /*
    Built from PAUSE_ITEMS so the drawn rows and the rows the keyboard walks are
    the same list. A hand-written parallel array would silently mislabel every
    row below any future insertion.
  */
  const LOOK = {
    resume:   { label: "RESUME", accent: "#4ade80" },
    // The only row with a value: an ON/OFF pill, so the state is readable at a
    // glance without opening settings.
    music:    { label: "MUSIC", accent: "#38bdf8", toggle: true,
                hint: "left/right or kick to switch" },
    settings: { label: "SETTINGS", accent: "#7dd3fc" },
    board:    { label: "LEADERBOARD", accent: "#a78bfa" },
    restart:  { label: "RESTART MATCH", accent: "#fbbf24" },
    quit:     { label: net.active ? "QUIT (disconnects)" : "QUIT TO MENU",
                accent: "#f87171" },
  };
  const items = PAUSE_ITEMS.map((key) => {
    const l = LOOK[key] || { label: key.toUpperCase(), accent: "#cddcf2" };
    return l.toggle
      ? { label: l.label, accent: l.accent, hint: l.hint, value: !!game.opt.music }
      : { label: l.label, accent: l.accent };
  });
  // Tapping a pause row selects it and activates it, as a click should.
  drawMenuList(items, game.pauseRow, W / 2 - 160, cy0 + 96, 320, rowH, rowGap, (i) => {
    game.pauseRow = i;
    pressed.Space = true; keys.Space = true; tapKeys.push("Space");
  });

  if (net.active) {
    // Be honest: the other machine is still running.
    text("⚠ online — your opponent's game keeps running",
         W / 2, cy0 + ch + 18, 11, "#fbbf24", "center", 700);
  }

  text("up/down to choose  ·  kick or ENTER to pick  ·  ESC to resume",
       W / 2, H - 24, 12, "#6b819e", "center", 600);
}

function drawSettings() {
  if (game.settingsFrom === SCENE.PAUSE) {
    drawFrozenPitch();
    ctx.fillStyle = "rgba(5,10,18,0.86)";
    ctx.fillRect(0, 0, W, H);
  } else {
    // Same attract scene as the menu, so moving between them feels continuous.
    drawMenuBackdrop();
  }

  text("SETTINGS", W / 2, 88, 32, "#ffffff", "center", 900);
  text(`saved on this computer  ·  v${VERSION}`, W / 2, 114, 12, "#8fa3c0",
       "center", 600);

  const items = [
    { label: "MUSIC", value: game.opt.music,
      hint: music.failed ? "audio unavailable in this browser"
                         : "synthesised soundtrack" },
    { label: "SCREEN SHAKE", value: game.opt.shake,
      hint: "camera kick on goals, mines and hard hits" },
    { label: "PARTICLES", value: game.opt.particles,
      hint: "burst effects for goals, blasts and pickups" },
    { label: "GOAL FLASH", value: game.opt.flash,
      hint: "white flash the moment someone scores" },
    { label: "CONTROL HINTS", value: game.opt.hints,
      hint: "show the key reminder during play" },
    { label: "GAMEPAD", value: game.opt.gamepad,

    { label: "BACK", accent: "#4ade80" },
  ];
  drawMenuList(items, game.settingsRow, W / 2 - 260, 154, 520, 54, 10, (i) => {
    game.settingsRow = i;
    pressed.Space = true; keys.Space = true; tapKeys.push("Space");
  });

  text("left/right or kick to toggle  ·  ESC to go back",

}

function drawRules() {
  if (game.rulesFrom === SCENE.PAUSE) {
    drawFrozenPitch();
    ctx.fillStyle = "rgba(5,10,18,0.88)";
    ctx.fillRect(0, 0, W, H);
  } else {
    drawMenuBackdrop();
  }

  text("SPAWN RATES", W / 2, 42, 28, "#ffffff", "center", 900);
  text("tune how busy the pitch gets  ·  saved on this computer",
       W / 2, 66, 11, "#8fa3c0", "center", 600);

  const bw = 700, bx = (W - bw) / 2;
  const rowsN = RULE_DEFS.length + 2;
  const top = 92, avail = H - 60 - top;
  const gap = Math.min(46, avail / rowsN);
  const rowH = gap - 5;

  /** Human-readable value for one rule. */
  const shown = (d) => {
    const v = game.rules[d.key];
    if (d.type === "flag") return v ? "ON" : "OFF";
    if (d.type === "int") return String(v);
    if (v <= 0) return "OFF";
    if (d.key === "chaosRate") return `${(CHAOS_EVERY * v).toFixed(0)}s`;
    return `${v.toFixed(2)}×`;
  };

  RULE_DEFS.forEach((d, i) => {
    const y = top + i * gap;
    const on = game.rulesRow === i;
    const off = d.type !== "flag" && game.rules[d.key] <= 0;

    ctx.fillStyle = on ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.045)";
    roundRect(bx, y, bw, rowH, 8);
    ctx.fill();
    if (on) {
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    const mid = y + rowH / 2;
    text(d.label, bx + 22, mid - 6, 13, "#cddcf2", "left", 800);
    text(d.hint, bx + 22, mid + 9, 9, "#6b819e", "left", 600);

    // Value, with a bar for the numeric rows so the range is visible.
    const vx = bx + bw - 24;
    text(shown(d), vx, mid, 16,
         off ? "#f87171" : on ? "#ffffff" : "#a7f3d0", "right", 900);

    if (d.type !== "flag") {
      const barW = 150, barX = vx - 90 - barW;
      const frac = clamp((game.rules[d.key] - d.min) / (d.max - d.min), 0, 1);
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      roundRect(barX, mid - 4, barW, 8, 4);
      ctx.fill();
      ctx.fillStyle = off ? "#f87171" : "#38bdf8";
      roundRect(barX, mid - 4, Math.max(3, barW * frac), 8, 4);
      ctx.fill();
      // Mark the authored default so "normal" is findable again.
      const dFrac = clamp((RULE_DEFAULTS[d.key] - d.min) / (d.max - d.min), 0, 1);
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillRect(barX + barW * dFrac - 1, mid - 8, 2, 16);
    }
    if (on) {
      text("◄", bx + bw - 78, mid, 12, "#7dd3fc", "center", 900);
      text("►", bx + bw - 6, mid, 12, "#7dd3fc", "center", 900);
    }
  });

  // RESET and BACK.
  [["RESET TO DEFAULTS", "#fbbf24"], ["BACK", "#4ade80"]].forEach(([label, col], k) => {
    const i = RULE_DEFS.length + k;
    const y = top + i * gap;
    const on = game.rulesRow === i;
    ctx.fillStyle = on ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.045)";
    roundRect(bx + bw / 4, y, bw / 2, rowH, 8);
    ctx.fill();
    if (on) {
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    text(label, W / 2, y + rowH / 2, 14, on ? col : "#cddcf2", "center", 900);
  });

  text("left/right to adjust  ·  the white notch marks the default  ·  ESC to go back",
       W / 2, H - 26, 11, "#6b819e", "center", 600);
}

/** Upgrade picker, shown after each won stage. */
function drawUpgrade() {
  drawMenuBackdrop();
  ctx.fillStyle = "rgba(5,10,18,0.72)";
  ctx.fillRect(0, 0, W, H);

  const r = game.run;
  const cleared = r.stage;                    // stages beaten so far
  text("STAGE CLEARED", W / 2, 54, 30, "#4ade80", "center", 900);
  text(`${RUN_STAGES[cleared].name}  ·  ${cleared + 1} of ${RUN_STAGES.length}`,
       W / 2, 80, 12, "#8fa3c0", "center", 600);
  text("CHOOSE A REWARD", W / 2, 116, 15, "#fbbf24", "center", 900);

  // Three cards.
  const cw = 260, ch = 190, gap = 22;
  const total = r.offer.length * cw + (r.offer.length - 1) * gap;
  let cx = (W - total) / 2;
  r.offer.forEach((u, i) => {
    const on = i === r.offerRow;
    ctx.fillStyle = on ? "rgba(74,222,128,0.14)" : "rgba(8,15,28,0.85)";
    roundRect(cx, 140, cw, ch, 14);
    ctx.fill();
    ctx.strokeStyle = on ? "#4ade80" : "rgba(255,255,255,0.12)";
    ctx.lineWidth = on ? 3 : 1.5;
    ctx.stroke();

    // A simple emblem so the cards are not just words.
    ctx.fillStyle = on ? "#4ade80" : "#334155";
    ctx.beginPath();
    ctx.arc(cx + cw / 2, 190, 26, 0, Math.PI * 2);
    ctx.fill();
    text(u.name.slice(0, 1), cx + cw / 2, 191, 24, on ? "#04240f" : "#8fa3c0", "center", 900);

    text(u.name, cx + cw / 2, 244, 16, on ? "#ffffff" : "#cddcf2", "center", 900);
    // Wrap the description over two short lines.
    const words = u.desc.split(" ");
    const half = Math.ceil(words.length / 2);
    text(words.slice(0, half).join(" "), cx + cw / 2, 272, 11, "#8fa3c0", "center", 600);
    text(words.slice(half).join(" "), cx + cw / 2, 288, 11, "#8fa3c0", "center", 600);

    if (on) text("PRESS F", cx + cw / 2, 314, 11, "#4ade80", "center", 900);
    cx += cw + gap;
  });

  // What is already held, and what is next.
  if (r.taken.length) {
    const names = r.taken.map((id) => (upgradeById(id) || {}).name || id);
    text("HELD:  " + names.join("   ·   "), W / 2, 366, 10, "#7dd3fc", "center", 700);
  }
  const next = RUN_STAGES[r.stage + 1];
  if (next) {
    text(`NEXT — ${next.name}:  ${next.label}   ·   CPU ${CPU_LEVELS[next.cpu].name}`,
         W / 2, 400, 12, "#fbbf24", "center", 700);
  } else {
    text("NEXT — the final match", W / 2, 400, 12, "#fbbf24", "center", 700);
  }

  drawRunLadder(W / 2, 440);
  text("left/right to choose  ·  F or ENTER to take it",
       W / 2, H - 24, 11, "#6b819e", "center", 600);
}

/** A compact pip ladder showing progress through the run. */
function drawRunLadder(cx, y) {
  const r = game.run;
  if (!r) return;
  const n = RUN_STAGES.length;
  const gap = 42;
  let x = cx - (gap * (n - 1)) / 2;
  for (let i = 0; i < n; i++) {
    const done = i < r.stage;
    const now = i === r.stage;
    ctx.fillStyle = done ? "#4ade80" : now ? "#fbbf24" : "rgba(255,255,255,0.14)";
    ctx.beginPath();
    ctx.arc(x, y, now ? 9 : 6, 0, Math.PI * 2);
    ctx.fill();
    if (i < n - 1) {
      ctx.strokeStyle = done ? "rgba(74,222,128,0.5)" : "rgba(255,255,255,0.12)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 10, y);
      ctx.lineTo(x + gap - 10, y);
      ctx.stroke();
    }
    x += gap;
  }
}

/** End of a run: either defeat or a cleared ladder. */
function drawRunEnd(won) {
  drawMenuBackdrop();
  ctx.fillStyle = won ? "rgba(4,26,14,0.82)" : "rgba(26,6,10,0.82)";
  ctx.fillRect(0, 0, W, H);

  const r = game.run || { stage: 0, taken: [], bestStage: 0 };
  text(won ? "RUN COMPLETE" : "RUN OVER", W / 2, 130,
       44, won ? "#4ade80" : "#f87171", "center", 900);
  text(won ? "you beat every challenger"
           : `fell at ${RUN_STAGES[Math.min(r.stage, RUN_STAGES.length - 1)].name}`,
       W / 2, 168, 15, "#cddcf2", "center", 600);

  text(`STAGES CLEARED   ${r.stage} / ${RUN_STAGES.length}`,
       W / 2, 216, 17, "#ffffff", "center", 900);
  if (r.bestStage) {
    text(`best run so far: ${r.bestStage} / ${RUN_STAGES.length}`,
         W / 2, 240, 11, "#8fa3c0", "center", 600);
  }

  if (r.taken.length) {
    text("UPGRADES COLLECTED", W / 2, 282, 11, "#7dd3fc", "center", 800);
    const names = r.taken.map((id) => (upgradeById(id) || {}).name || id);
    // Two rows so a long list stays readable.
    const half = Math.ceil(names.length / 2);
    text(names.slice(0, half).join("   ·   "), W / 2, 304, 12, "#cddcf2", "center", 700);
    if (names.length > half) {
      text(names.slice(half).join("   ·   "), W / 2, 324, 12, "#cddcf2", "center", 700);
    }
  }

  drawRunLadder(W / 2, 372);

  const bw = 300, bh = 48, bx = W / 2 - bw / 2, by = 410;
  ctx.fillStyle = won ? "#4ade80" : "#94a3b8";
  roundRect(bx, by, bw, bh, 10);
  ctx.fill();
  text("BACK TO MENU", W / 2, by + bh / 2, 17, "#0b1220", "center", 900);
  text("press F, ENTER or ESC", W / 2, by + bh + 22, 11, "#8fa3c0", "center", 600);
}

function drawControls() {
  if (game.ctrlFrom === SCENE.PAUSE) {
    drawFrozenPitch();
    ctx.fillStyle = "rgba(5,10,18,0.88)";
    ctx.fillRect(0, 0, W, H);
  } else {
    drawMenuBackdrop();
  }

  text("CONTROLS", W / 2, 44, 28, "#ffffff", "center", 900);
  text("saved on this computer  ·  left/right switches player",
       W / 2, 68, 11, "#8fa3c0", "center", 600);

  // Seat tabs.
  for (let i = 0; i < 2; i++) {
    const on = game.ctrlSeat === i;
    const tw = 170, tx = W / 2 - tw - 8 + i * (tw + 16);
    ctx.fillStyle = on ? "rgba(125,211,252,0.18)" : "rgba(8,15,28,0.8)";
    roundRect(tx, 84, tw, 30, 8);
    ctx.fill();
    ctx.strokeStyle = on ? "#7dd3fc" : "rgba(255,255,255,0.12)";
    ctx.lineWidth = on ? 2.5 : 1.5;
    ctx.stroke();
    const padTag = pads.active[i] ? "  🎮" : "";
    text(`PLAYER ${i + 1}${padTag}`, tx + tw / 2, 99, 12,
         on ? "#ffffff" : "#8fa3c0", "center", 900);
  }

  const bw = 560, bx = (W - bw) / 2;
  /*
    Geometry scales to the number of actions. The 3D arena added five bindings,
    which at the original 38px pitch pushed BACK and the gamepad status line off
    the bottom of a 600px canvas. Measured: 13 rows at top 116 / gap 28 ends at
    y 540 with the status line at 544, so everything lands on screen.
  */
  const rowsTotal = ACTIONS.length + 2;          // + RESET + BACK
  const compact = rowsTotal > 9;
  const top = compact ? 116 : 128;
  const gap = compact ? 28 : 38;
  const rowH = compact ? 24 : 32;

  ACTIONS.forEach((a, i) => {
    const y = top + i * gap;
    const on = game.ctrlRow === i;
    const binding = game.ctrlBinding &&
                    game.ctrlBinding.seat === game.ctrlSeat &&
                    game.ctrlBinding.action === a.key;

    ctx.fillStyle = binding ? "rgba(251,191,36,0.18)"
                  : on ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.045)";
    roundRect(bx, y, bw, rowH, 8);
    ctx.fill();
    if (on || binding) {
      ctx.strokeStyle = binding ? "#fbbf24" : "#7dd3fc";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    text(a.label, bx + 20, y + rowH / 2, compact ? 11 : 12, "#cddcf2", "left", 800);

    // The bound key, in a keycap.
    const code = SCHEME[game.ctrlSeat][a.key];
    const cap = binding ? "PRESS A KEY…" : keyLabel(code);
    const cw = Math.max(64, cap.length * 9 + 20);
    ctx.fillStyle = binding ? "#fbbf24" : code ? "rgba(15,23,42,0.9)" : "rgba(248,113,113,0.25)";
    roundRect(bx + bw - cw - 16, y + 4, cw, rowH - 8, 5);
    ctx.fill();
    ctx.strokeStyle = binding ? "#fde68a" : "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    text(cap, bx + bw - cw / 2 - 16, y + rowH / 2, 11,
         binding ? "#0b1220" : code ? "#a7f3d0" : "#fca5a5", "center", 900);
  });

  // RESET and BACK.
  [["RESET TO DEFAULTS", "#fbbf24"], ["BACK", "#4ade80"]].forEach(([label, col], k) => {
    const i = ACTIONS.length + k;
    const y = top + i * gap;
    const on = game.ctrlRow === i;
    ctx.fillStyle = on ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.045)";
    roundRect(bx + bw / 4, y, bw / 2, rowH, 8);
    ctx.fill();
    if (on) { ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke(); }
    text(label, W / 2, y + rowH / 2, 13, on ? col : "#cddcf2", "center", 900);
  });

  // Gamepad status, so a player knows whether a pad was seen.
  const gy = top + rowsTotal * gap + 8;
  /*
    Record what was actually painted, so the test suite can assert every row and
    the status line landed on the canvas instead of re-deriving the arithmetic —
    a test that recomputes the layout passes even when the layout is wrong.
  */
  layoutProbe.controls = {
    rows: rowsTotal, top, gap, rowH, statusY: gy,
    bottom: top + (rowsTotal - 1) * gap + rowH,
  };
  if (!padsAvailable()) {
    text("gamepads: not supported by this browser", W / 2, gy, 10, "#6b819e", "center", 600);
  } else if (pads.active[0] || pads.active[1]) {
    const which = [0, 1].filter((i) => pads.active[i]).map((i) => `P${i + 1}`).join(" & ");
    text(`🎮 gamepad connected for ${which} — it overrides the keyboard for that player`,
         W / 2, gy, 10, "#4ade80", "center", 700);
  } else {
    text("🎮 connect a controller and press a button — it is detected automatically",
         W / 2, gy, 10, "#8fa3c0", "center", 600);
  }

    { key: "WIN%", x: bx + 618, align: "right" },
    { key: "GF",   x: bx + 676, align: "right" },
    { key: "GA",   x: bx + 730, align: "right" },

  shown.forEach((r, i) => {
    const rank = start + i + 1;

      ctx.stroke();
    }

    const mid = y + (rowH - 5) / 2;
    // Medal colours for the top three.

    text(String(r.w), cols[3].x, mid, 14, "#4ade80", "right", 900);

    const run = r.streak > 0 ? `W${r.streak}` : r.streak < 0 ? `L${-r.streak}` : "–";

         W / 2, 122 + LB_ROWS_VISIBLE * rowH + 6, 11, "#6b819e", "center", 600);

  // Best streak footnote for the leader.
