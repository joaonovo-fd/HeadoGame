        for (let r = 0; r < SETTINGS_ITEMS.length; r++) {
          game.settingsRow = r;
          try { drawSettings(); } catch (e) { drew = false; err = e.message; }
        }
      }
      ok("the settings screen renders from both entry points", drew, err);

      drew = true;
      for (const online of [false, true]) {
        net.active = online;
        for (const md of [MODE.SINGLE, MODE.VOLLEY, MODE.TOURNAMENT]) {
          game.mode = md;
          for (let r = 0; r < PAUSE_ITEMS.length; r++) {
            game.pauseRow = r;
            game.pauseFrom = SCENE.PLAY;
            try { drawPause(); } catch (e) { drew = false; err = e.message; }
          }
        }
      }
      net.active = false;
      ok("the pause screen renders in every mode, on and offline", drew, err);
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.opt = saved.opt;
    game.particles = [];
  }

  // 19ab. Menu layout must FIT ON SCREEN.
  //       Regression: the menu grew to 10 rows at a fixed pitch, pushing
  //       ONLINE, SETTINGS and START past the bottom of the canvas. Every
  //       drawMenu test passed because none of them checked geometry.
  {
    const saved = { mode: game.mode, cpu: [...game.cpu], menuRow: game.menuRow };
    let worst = null, missing = null, checked = 0;

    /*
      Actually RENDER the menu and inspect where the rows landed. An earlier
      version of this test re-derived the layout arithmetic, so it passed even
      with the bug present — it was only ever checking its own copy.
    */
    for (const md of MODE_ORDER) {
      for (const cpu of [false, true]) {
        for (const online of [false, true]) {
          game.mode = md;
          game.cpu = [false, cpu];
          const wasActive = net.active;
          net.active = online;
          game.menuRow = 0;
          layoutProbe.menu = null;
          // Capture the expected rows under the SAME conditions drawMenu sees,
          // before restoring net.active — otherwise the expectation is stale.
          const wantRows = menuRows();
          drawMenu();
          net.active = wasActive;

          const p = layoutProbe.menu;
          if (!p) { missing = `${md}: drawMenu recorded no geometry`; continue; }
          checked++;

          for (const key of wantRows) {
            const row = p.labels.find((l) => l.key === key);
            if (!row) { missing = `${md} cpu=${cpu}: row "${key}" was never drawn`; break; }
            if (row.bottom > H) {
              worst = `${md} cpu=${cpu}: row "${key}" ends at ${row.bottom.toFixed(0)} > ${H}`;
              break;
            }
            if (row.y < 0) {
              worst = `${md} cpu=${cpu}: row "${key}" starts above the canvas`;
              break;
            }
          }
          if (p.rowH < 22) worst = `${md} cpu=${cpu}: rows only ${p.rowH.toFixed(0)}px tall`;
          if (worst || missing) break;
        }
        if (worst || missing) break;
      }
      if (worst || missing) break;
    }
    ok("every menu row is drawn inside the canvas", !worst, worst || "");
    ok("no menu row goes missing", !missing, missing || "");
    ok("every configuration was measured", checked >= 16, `${checked}`);

    // The rows a player needs must always be present and reachable.
    for (const md of MODE_ORDER) {
      game.mode = md;
      const rows = menuRows();
      ok(`${md}: START is in the menu`, rows.includes("start"));
      ok(`${md}: the row count is renderable`, rows.length <= 16, `${rows.length}`);
    }
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    ok("ONLINE is on the menu", menuRows().includes("online"));
    ok("LEADERBOARD is on the menu", menuRows().includes("board"));
    ok("SETTINGS is on the menu", menuRows().includes("settings"));

    Object.assign(game, saved);
  }

  // 19ac. Leaderboard: recording, ranking, persistence.
  {
    const saved = { board: game.board, cpu: [...game.cpu], names: [...game.names],
                    seats: [...game.seats], entrants: game.entrants, mode: game.mode,
                    scene: game.scene, score: [...game.score], boardFrom: game.boardFrom,
                    boardScroll: game.boardScroll };
    const savedNet = { ...net };
    net.active = false;
    game.mode = MODE.SINGLE;
    game.entrants = [];
    game.seats = [null, null];
    game.cpu = [false, false];
    game.board = [];

    // ---- a win and a loss are recorded on the right players ----
    game.names = ["ANA", "BEN"];
    recordResult(0, [5, 2]);
    const ana = game.board.find((r) => r.name === "ANA");
    const ben = game.board.find((r) => r.name === "BEN");
    ok("the winner gets a win", ana && ana.w === 1 && ana.l === 0, JSON.stringify(ana));
    ok("the loser gets a loss", ben && ben.l === 1 && ben.w === 0, JSON.stringify(ben));
    ok("goals for and against are recorded",
       ana.gf === 5 && ana.ga === 2 && ben.gf === 2 && ben.ga === 5);
    ok("a win starts a winning streak", ana.streak === 1 && ana.best === 1);
    ok("a loss starts a losing streak", ben.streak === -1);

    // ---- streaks accumulate and reset ----
    recordResult(0, [3, 1]);
    recordResult(0, [4, 0]);
    ok("consecutive wins build a streak", ana.streak === 3, `${ana.streak}`);
    ok("the best streak is remembered", ana.best === 3, `${ana.best}`);
    ok("consecutive losses build a losing streak", ben.streak === -3, `${ben.streak}`);
    recordResult(1, [0, 2]);
    ok("a loss breaks a winning streak", ana.streak === -1, `${ana.streak}`);
    ok("the best streak survives a loss", ana.best === 3, `${ana.best}`);
    ok("totals add up", ana.w === 3 && ana.l === 1, `${ana.w}-${ana.l}`);

    // ---- draws ----
    recordResult(-1, [2, 2]);
    ok("a draw is recorded for both", ana.d === 1 && ben.d === 1);
    ok("a draw zeroes the streak", ana.streak === 0 && ben.streak === 0);

    // ---- CPU opponents are excluded ----
    {
      game.board = [];
      game.cpu = [false, true];
      game.names = ["ANA", "BEN"];
      recordResult(0, [3, 0]);
      ok("a human still records against a CPU",
         game.board.some((r) => r.name === "ANA"));
      ok("the CPU is not added to the table",
         !game.board.some((r) => /CPU/.test(r.name)),
         game.board.map((r) => r.name).join(","));
      ok("only one record was created", game.board.length === 1, `${game.board.length}`);
      game.cpu = [false, false];
    }

    // ---- ranking order ----
    {
      game.board = [
        { name: "LOW",  w: 1, l: 5, d: 0, gf: 5,  ga: 20, streak: 0, best: 1, last: 0 },
        { name: "TOP",  w: 9, l: 1, d: 0, gf: 40, ga: 10, streak: 3, best: 5, last: 0 },
        { name: "MID",  w: 4, l: 4, d: 0, gf: 20, ga: 20, streak: 0, best: 2, last: 0 },
      ];
      const r = rankBoard(game.board);
      ok("the table ranks by wins", r.map((x) => x.name).join(",") === "TOP,MID,LOW",
         r.map((x) => x.name).join(","));
      ok("ranking does not mutate the source",
         game.board[0].name === "LOW", game.board[0].name);

      // Equal wins fall back to win rate, then goal difference.
      game.board = [
        { name: "A", w: 3, l: 7, d: 0, gf: 10, ga: 30, streak: 0, best: 1, last: 0 },
        { name: "B", w: 3, l: 1, d: 0, gf: 12, ga: 6,  streak: 0, best: 1, last: 0 },
      ];
      ok("equal wins break on win rate", rankBoard(game.board)[0].name === "B");

      game.board = [
        { name: "C", w: 2, l: 2, d: 0, gf: 5,  ga: 9, streak: 0, best: 1, last: 0 },
        { name: "D", w: 2, l: 2, d: 0, gf: 14, ga: 4, streak: 0, best: 1, last: 0 },
      ];
      ok("equal records break on goal difference", rankBoard(game.board)[0].name === "D");
    }

    // ---- derived stats ----
    {
      const r = { name: "X", w: 3, l: 1, d: 0, gf: 9, ga: 4, streak: 0, best: 0, last: 0 };
      ok("played counts every result", lbPlayed(r) === 4, `${lbPlayed(r)}`);
      ok("win rate is a percentage", Math.round(lbWinPct(r)) === 75, `${lbWinPct(r)}`);
      const empty = { name: "Y", w: 0, l: 0, d: 0, gf: 0, ga: 0, streak: 0, best: 0, last: 0 };
      ok("an unplayed record does not divide by zero", lbWinPct(empty) === 0);
    }

    // ---- hostile and corrupt storage ----
    {
      // A name off the wire must be cleaned before it reaches the table.
      game.board = [];
      game.names = ["<b>X</b>", "BEN"];
      recordResult(0, [1, 0]);
      ok("a table name is sanitised",
         game.board.every((r) => !/[<>]/.test(r.name)),
         game.board.map((r) => r.name).join(","));

      // A blank name must not create a phantom record.
      game.board = [];
      ok("a blank name creates no record", boardRecord("   ") === null);
      ok("junk-only names create no record", boardRecord("<<>>") === null);
      ok("the table stayed empty", game.board.length === 0);

      // loadBoard must survive anything.
      const badInputs = ["not json", "null", '{"a":1}', "[]", '[{"name":""}]',
                         '[{"name":"OK","w":-5,"l":"x"}]'];
      let survived = true, detail = "";
      const haveStorage = (() => {
        try { localStorage.setItem("headgame.probe", "1"); return true; }
        catch (e) { return false; }
      })();
      for (const raw of badInputs) {
        try {
          if (haveStorage) localStorage.setItem("headgame.board", raw);
          const b = loadBoard();
          if (!Array.isArray(b)) { survived = false; detail = `not an array for ${raw}`; }
          if (b.some((r) => r.w < 0 || typeof r.w !== "number")) {
            survived = false; detail = `negative or non-numeric wins from ${raw}`;
          }
        } catch (e) { survived = false; detail = `${raw} threw: ${e.message}`; }
      }
      ok("loadBoard survives corrupt storage", survived, detail);
    }

    // ---- persistence round trip ----
    {
      const target = [{ name: "ROUNDTRIP", w: 2, l: 1, d: 0, gf: 7, ga: 5,
                        streak: 2, best: 2, last: 123 }];
      saveBoard(target);
      const back = loadBoard();
      // Where storage is unavailable (private mode, blocked cookies) both calls
      // must degrade quietly rather than throw — an empty result is correct there.
      const persists = (() => {
        try { localStorage.setItem("headgame.probe", "1"); return true; }
        catch (e) { return false; }
      })();
      ok("the table round-trips through storage, or degrades safely",
         persists
           ? (back.length === 1 && back[0].name === "ROUNDTRIP" && back[0].w === 2)
           : Array.isArray(back),
         JSON.stringify(back));
      ok("the table is capped in size", LB_MAX <= 200 && LB_MAX >= 10, `${LB_MAX}`);
    }

    // ---- a match end feeds the table ----
    {
      game.board = [];
      game.cpu = [false, false];
      game.names = ["ANA", "BEN"];
      game.mode = MODE.SINGLE;
      game.sel = [0, 3];
      startMatch();
      game.scene = SCENE.PLAY;
      game.suddenDeath = false;
      game.goalsToWin = 2;
      game.score = [1, 0];
      scoreGoal(1);                              // ANA's winning goal
      ok("finishing a match records it", game.board.length === 2, `${game.board.length}`);
      const a = game.board.find((r) => r.name === "ANA");
      ok("the match winner was credited", a && a.w === 1, JSON.stringify(a));

      // A guest must NOT double-count the host's match.
      game.board = [];
      net.active = true; net.role = "guest";
      finishMatch(0, false);
      ok("a guest does not record the result", game.board.length === 0,
         `${game.board.length}`);
      net.active = false; net.role = null;
    }

    // ---- the screen renders in every state ----
    {
      let drew = true, err = "";
      const shapes = [
        [],
        [{ name: "SOLO", w: 1, l: 0, d: 0, gf: 3, ga: 1, streak: 1, best: 1, last: 0 }],
        Array.from({ length: 30 }, (_, i) => ({
          name: `PLAYER ${i + 1}`, w: 30 - i, l: i, d: i % 3,
          gf: 100 - i, ga: i * 2, streak: i % 5 - 2, best: i % 7, last: i,
        })),
      ];
      for (const b of shapes) {
        game.board = b;
        for (const from of [SCENE.MENU, SCENE.PAUSE]) {
          game.boardFrom = from;
          for (const sc of [0, 5, 25]) {
            game.boardScroll = sc;
            try { drawBoard(); } catch (e) { drew = false; err = e.message; }
          }
        }
      }
      ok("the leaderboard renders empty, small and long", drew, err);

      // Scrolling must clamp.
      game.board = shapes[2];
      game.boardScroll = 999;
      updateBoard(DT);
      ok("scroll cannot run past the end",
         game.boardScroll <= Math.max(0, game.board.length - LB_ROWS_VISIBLE) + 1,
         `${game.boardScroll}`);
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19ad. Maps and platforms.
  {
    const saved = { mapId: game.mapId, mode: game.mode, ball: game.ball,
                    players: game.players, scene: game.scene };
    game.mode = MODE.SINGLE;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    ok("there are several maps", MAPS.length >= 5, `${MAPS.length}`);
    ok("map ids are unique", new Set(MAPS.map((m) => m.id)).size === MAPS.length);
    ok("every map is named and hinted",
       MAPS.every((m) => m.name && m.hint && Array.isArray(m.platforms)));
    ok("CLASSIC is the empty arena",
       mapById("classic").platforms.length === 0);
    ok("an unknown id falls back to the first map", mapById("nope") === MAPS[0]);

    /*
      Geometry safety: no platform may sit inside a goal mouth or off the pitch,
      or a map could make scoring impossible.
    */
    {
      let bad = null;
      for (const m of MAPS) {
        for (const pl of m.platforms) {
          if (pl.x < WALL || pl.x + pl.w > W - WALL) {
            bad = `${m.id}: platform crosses a wall`; break;
          }
          if (pl.y < 40 || pl.y + pl.h > GROUND_Y - 20) {
            bad = `${m.id}: platform at y=${pl.y} is out of bounds`; break;
          }
          // Keep clear of both goal mouths (widest possible, with big goals).
          const mouthTop = GROUND_Y - GOAL_H * GOAL_SIZE_BIG;
          const overlapsMouthBand = pl.y + pl.h > mouthTop;
          const nearLeft = pl.x < WALL + 130;
          const nearRight = pl.x + pl.w > W - WALL - 130;
          if (overlapsMouthBand && (nearLeft || nearRight)) {
            bad = `${m.id}: platform blocks a goal mouth`; break;
          }
          if (!["solid", "bounce", "ghost"].includes(pl.kind)) {
            bad = `${m.id}: unknown platform kind ${pl.kind}`; break;
          }
        }
        if (bad) break;
      }
      ok("no map blocks a goal or leaves the pitch", !bad, bad || "");
    }

    // Platforms are suppressed in net modes so a rally is never blocked.
    {
      game.mapId = "towers";
      game.mode = MODE.SINGLE;
      ok("platforms are active in soccer", activePlatforms().length > 0);
      /*
        Net and hoop modes now get their OWN purpose-built platforms rather than
        none: the arena maps are authored for a soccer pitch and would wall off a
        rally, but a bespoke symmetric layout adds height without blocking play.
      */
      game.mode = MODE.VOLLEY;
      ok("volleyball has its own platforms", activePlatforms().length > 0,
         `${activePlatforms().length}`);
      ok("volleyball ignores the arena choice",
         activePlatforms() === MODE_PLATFORMS.volley);
      game.mode = MODE.TENNIS;
      ok("tennis has its own platforms", activePlatforms().length > 0,
         `${activePlatforms().length}`);
      game.mode = MODE.BASKET;
      ok("basketball has its own platforms", activePlatforms().length > 0,
         `${activePlatforms().length}`);
      game.mode = MODE.SINGLE;
    }

    // The ball must bounce OFF a slab from every direction, never through it.
    {
      const slab = { x: 400, y: 300, w: 200, h: PLAT_H, kind: "solid" };
      const cases = [
        { name: "from above", x: 500, y: 300 - BALL_R - 4, vx: 0, vy: 600, want: "vy<0" },
        { name: "from below", x: 500, y: 300 + PLAT_H + BALL_R + 4, vx: 0, vy: -600, want: "vy>0" },
        { name: "from the left", x: 400 - BALL_R - 4, y: 306, vx: 700, vy: 0, want: "vx<0" },
        { name: "from the right", x: 600 + BALL_R + 4, y: 306, vx: -700, vy: 0, want: "vx>0" },
      ];
      let allOk = true, detail = "";
      for (const c of cases) {
        const b = { x: c.x, y: c.y, vx: c.vx, vy: c.vy, r: BALL_R, mass: BALL_MASS };
        // March it into the slab a few substeps.
        let bounced = false;
        for (let i = 0; i < 40; i++) {
          integrate(b, DT, 0, 0);
          if (resolvePlatform(b, slab, 0.6)) { bounced = true; break; }
        }
        const okDir =
          c.want === "vy<0" ? b.vy < 0 : c.want === "vy>0" ? b.vy > 0 :
          c.want === "vx<0" ? b.vx < 0 : b.vx > 0;
        if (!bounced || !okDir) {
          allOk = false;
          detail = `${c.name}: bounced=${bounced} v=${b.vx.toFixed(0)},${b.vy.toFixed(0)}`;
          break;
        }
      }
      ok("the ball rebounds off a platform from every side", allOk, detail);

      // And never ends up inside it.
      let inside = null;
      for (let t = 0; t < 300; t++) {
        const b = { x: rand(380, 620), y: rand(260, 360),
                    vx: rand(-900, 900), vy: rand(-900, 900), r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 30; i++) {
          integrate(b, DT, 0, 0);
          resolvePlatform(b, slab, 0.6);
        }
        const cx = clamp(b.x, slab.x, slab.x + slab.w);
        const cy = clamp(b.y, slab.y, slab.y + slab.h);
        if (len(b.x - cx, b.y - cy) < BALL_R - 1.5) {
          inside = `${b.x.toFixed(0)},${b.y.toFixed(0)}`;
          break;
        }
      }
      ok("the ball never rests inside a platform", !inside, inside || "");
    }

    // A bounce pad must send the ball away FASTER than a solid slab.
    {
      const drop = (kind) => {
        game.mapId = "classic";
        const slab = { x: 400, y: 320, w: 200, h: PLAT_H, kind };
        const b = { x: 500, y: 320 - BALL_R - 30, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 200; i++) {
          integrate(b, DT, gravity, 0);
          const rest = ballRest * (kind === "bounce" ? PLAT_BOUNCE : PLAT_REST);
          const side = resolvePlatform(b, slab, rest);
          if (side === "top") {
            if (kind === "bounce") b.vy = Math.min(b.vy, -320);
            return Math.abs(b.vy);
          }
        }
        return 0;
      };
      const solid = drop("solid"), bouncy = drop("bounce");
      ok("a bounce pad throws the ball harder than a solid slab",
         bouncy > solid * 1.3, `solid ${solid.toFixed(0)} vs pad ${bouncy.toFixed(0)}`);
    }

    // A ghost slab is transparent to the ball but solid underfoot.
    {
      game.mapId = "catwalk";
      const ghost = mapById("catwalk").platforms.find((p) => p.kind === "ghost");
      ok("the catwalk has a ghost slab", !!ghost);
      const b = { x: ghost.x + 100, y: ghost.y - BALL_R - 4, vx: 0, vy: 500,
                  r: BALL_R, mass: BALL_MASS, bounces: 0 };
      const sb = game.ball;
      game.ball = b;
      for (let i = 0; i < 30; i++) ballVsPlatforms(game.ball);
      game.ball = sb;
      ok("the ball passes through a ghost slab", b.vy > 0, `vy=${b.vy.toFixed(0)}`);

      // A player standing on it must be supported.
      const p = new Player(0, TEAMS[0]);
      p.reset();
      p.x = ghost.x + 100;
      // Start ABOVE the slab and fall onto it, which is what a player does.
      p.y = ghost.y - p.r - 50;
      p.vy = 0;
      for (let i = 0; i < 200; i++) {
        p.update(DT, null);
        playerVsPlatforms(p);
        if (p.onGround && Math.abs(p.y + p.r - ghost.y) < 1.5) break;
      }
      ok("a player lands on a ghost slab",
         p.onGround && Math.abs(p.y + p.r - ghost.y) < 1.5,
         `feet=${(p.y + p.r).toFixed(1)} slab top=${ghost.y}`);
      // And is not yanked downward before reaching it.
      const q = new Player(0, TEAMS[0]);
      q.reset();
      q.x = ghost.x + 100;
      q.y = ghost.y - q.r - 8;
      q.vy = 100;
      const qy = q.y;
      playerVsPlatforms(q);
      ok("a player above a slab is not snapped down early",
         q.y === qy, `${qy.toFixed(1)} -> ${q.y.toFixed(1)}`);
    }

    // Players must land on every map's platforms without getting stuck.
    {
      let stuck = null;
      for (const m of MAPS) {
        game.mapId = m.id;
        for (const pl of m.platforms) {
          const p = new Player(0, TEAMS[0]);
          p.reset();
          p.x = pl.x + pl.w / 2;
          p.y = pl.y - p.r - 40;
          p.vy = 0;
          for (let i = 0; i < 240; i++) {
            p.update(DT, null);
            playerVsPlatforms(p);
          }
          if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) { stuck = `${m.id}: NaN`; break; }
          if (p.y + p.r > GROUND_Y + 1) { stuck = `${m.id}: fell through`; break; }
        }
        if (stuck) break;
      }
      ok("players land safely on every map", !stuck, stuck || "");
    }

    // Long soak on the busiest map: the ball must stay in the world.
    {
      game.mapId = "towers";
      game.mode = MODE.SINGLE;
      let escaped = null;
      const sb = game.ball;
      for (let t = 0; t < 3; t++) {
        game.ball = { x: W / 2, y: 120, vx: rand(-1200, 1200), vy: rand(-800, 200),
                      r: BALL_R, mass: BALL_MASS, bounces: 0 };
        for (let i = 0; i < 2000; i++) {
          stepBall(DT);
          ballVsPlatforms(game.ball);
          const b = game.ball;
          if (!Number.isFinite(b.x)) { escaped = "NaN"; break; }
          if (b.x < -GOAL_D - 40 || b.x > W + GOAL_D + 40 || b.y < -40 || b.y > H + 40) {
            escaped = `${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
          }
          if (i % 400 === 0) { b.vx = rand(-1200, 1200); b.vy = rand(-900, 300); }
        }
        if (escaped) break;
      }
      game.ball = sb;
      ok("the ball never escapes a platform map", !escaped, escaped || "");
    }

    // Every map renders.
    {
      let drew = true, err = "";
      for (const m of MAPS) {
        game.mapId = m.id;
        try { drawPlatforms(); } catch (e) { drew = false; err = `${m.id}: ${e.message}`; }
      }
      ok("every map renders", drew, err);
    }

    game.mapId = saved.mapId;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19ae. Configurable spawn rates.
  {
    const saved = { rules: { ...game.rules }, rulesRow: game.rulesRow,
                    rulesFrom: game.rulesFrom, scene: game.scene, chaos: game.chaos };

    ok("every rule declares a type", RULE_DEFS.every((d) => d.type && d.key && d.label));
    ok("numeric rules declare a range and step",
       RULE_DEFS.filter((d) => d.type !== "flag")
                .every((d) => d.max > d.min && d.step > 0));
    ok("every rule has a default",
       RULE_DEFS.every((d) => RULE_DEFAULTS[d.key] !== undefined));
    ok("defaults sit inside their ranges",
       RULE_DEFS.filter((d) => d.type !== "flag")
                .every((d) => RULE_DEFAULTS[d.key] >= d.min && RULE_DEFAULTS[d.key] <= d.max));

    // Clamping.
    for (const d of RULE_DEFS.filter((x) => x.type !== "flag")) {
      ok(`${d.key} clamps at its maximum`, clampRule(d.key, 999) === d.max, `${clampRule(d.key, 999)}`);
      ok(`${d.key} clamps at its minimum`, clampRule(d.key, -999) === d.min, `${clampRule(d.key, -999)}`);
    }
    ok("integer rules stay integers",
       Number.isInteger(clampRule("puMaxLive", 3.7)), `${clampRule("puMaxLive", 3.7)}`);
    ok("flags coerce to booleans", clampRule("movingGoals", 1) === true);

    // Effective intervals must respond to the multiplier.
    {
      game.rules = { ...RULE_DEFAULTS };
      const base = [];
      for (let i = 0; i < 200; i++) base.push(puInterval());
      const meanBase = base.reduce((a, b) => a + b, 0) / base.length;

      game.rules.puRate = 2;                    // twice as often
      const fast = [];
      for (let i = 0; i < 200; i++) fast.push(puInterval());
      const meanFast = fast.reduce((a, b) => a + b, 0) / fast.length;
      ok("a higher power-up rate shortens the interval",
         meanFast < meanBase * 0.65,
         `${meanBase.toFixed(2)}s -> ${meanFast.toFixed(2)}s`);

      game.rules.puRate = 0;                    // off
      ok("a zero rate disables power-ups entirely", puInterval() === Infinity);

      game.rules.mineRate = 0;
      ok("a zero rate disables mines entirely", mineInterval() === Infinity);
      game.rules = { ...RULE_DEFAULTS };
    }

    // Caps and lifetimes.
    {
      game.rules.puMaxLive = 7;
      ok("the power-up cap follows the rule", puCap() === 7);
      game.rules.mineMaxLive = 1;
      ok("the mine cap follows the rule", mineCap() === 1);
      game.rules.puLife = 2;
      ok("the power-up lifetime scales", puLifetime() === PU_LIFE * 2, `${puLifetime()}`);
      game.rules.chaosRate = 0.5;
      ok("the chaos interval scales", chaosInterval() === CHAOS_EVERY * 0.5, `${chaosInterval()}`);
      game.rules = { ...RULE_DEFAULTS };
    }

    // Disabling actually stops spawning in the live loop.
    {
      game.mode = MODE.SINGLE;
      game.cpu = [false, false];
      game.sel = [0, 3];
      game.rules.puRate = 0;
      game.rules.mineRate = 0;
      startMatch();
      game.scene = SCENE.PLAY;
      for (let i = 0; i < 60 * 60; i++) { updatePowerups(DT); updateMines(DT); }
      ok("power-ups really stop when disabled", game.powerups.length === 0,
         `${game.powerups.length}`);
      ok("mines really stop when disabled", game.mines.length === 0, `${game.mines.length}`);

      // And a high rate produces many more than the default.
      const countOver = (rate) => {
        game.rules.puRate = rate;
        game.powerups = [];
        game.puTimer = puInterval();
        let n = 0;
        for (let i = 0; i < 120 * 60; i++) {
          const before = game.powerups.length;
          updatePowerups(DT);
          if (game.powerups.length > before) n++;
          game.powerups = [];                   // don't let the cap throttle it
        }
        return n;
      };
      const slow = countOver(0.5), fast = countOver(3);
      ok("a higher rate spawns more power-ups", fast > slow * 2,
         `${slow} vs ${fast} in 120s`);
      game.rules = { ...RULE_DEFAULTS };
    }

    // The caps are honoured in the live loop.
    {
      game.rules.puRate = 4;
      game.rules.puMaxLive = 2;
      game.powerups = [];
      game.puTimer = 0;
      let peak = 0;
      for (let i = 0; i < 90 * 60; i++) {
        updatePowerups(DT);
        peak = Math.max(peak, game.powerups.length);
      }
      ok("the power-up cap holds under pressure", peak <= 2, `peak ${peak}`);
      game.rules = { ...RULE_DEFAULTS };
      game.powerups = [];
    }

    // The screen renders and navigates.
    {
      let drew = true, err = "";
      const rowsN = RULE_DEFS.length + 2;
      for (const from of [SCENE.MENU, SCENE.PAUSE]) {
        game.rulesFrom = from;
        for (let r = 0; r < rowsN; r++) {
          game.rulesRow = r;
          try { drawRules(); } catch (e) { drew = false; err = e.message; }
        }
      }
      ok("the spawn-rate screen renders every row", drew, err);

      // RESET restores the defaults.
      game.rules.puRate = 3.5;
      game.rules.movingGoals = true;
      game.rulesRow = RULE_DEFS.length;          // RESET
      game.scene = SCENE.RULES;
      pressed.Enter = true;
      edgeFrame = true;
      updateRules(DT);
      for (const k in pressed) delete pressed[k];
      ok("RESET restores every default",
         game.rules.puRate === RULE_DEFAULTS.puRate &&
         game.rules.movingGoals === RULE_DEFAULTS.movingGoals,
         JSON.stringify(game.rules));
    }

    // Storage round trip.
    {
      const probe = { ...RULE_DEFAULTS, puRate: 2.5, mineMaxLive: 6, movingGoals: true };
      saveRules(probe);
      const back = loadRules({ ...RULE_DEFAULTS });
      const persists = (() => {
        try { localStorage.setItem("headgame.probe", "1"); return true; }
        catch (e) { return false; }
      })();
      ok("rules round-trip through storage, or degrade safely",
         persists ? (back.puRate === 2.5 && back.mineMaxLive === 6 && back.movingGoals === true)
                  : typeof back.puRate === "number",
         JSON.stringify(back));

      // Corrupt storage must not poison the rules.
      if (persists) {
        localStorage.setItem("headgame.rules", '{"puRate":999,"mineMaxLive":-5,"bogus":1}');
        const clamped = loadRules({ ...RULE_DEFAULTS });
        ok("out-of-range stored rules are clamped",
           clamped.puRate === ruleDef("puRate").max &&
           clamped.mineMaxLive === ruleDef("mineMaxLive").min,
           JSON.stringify(clamped));
        localStorage.setItem("headgame.rules", "not json");
        ok("unparseable rules fall back to defaults",
           loadRules({ ...RULE_DEFAULTS }).puRate === RULE_DEFAULTS.puRate);
      }
    }

    Object.assign(game, saved);
    game.rules = saved.rules;
    game.particles = [];
  }

  // 19af. Volleyball bounces more, without running away.
  {
    const savedMode = game.mode, savedBall = game.ball;
    /*
      Start from a known world. Earlier cases legitimately leave chaos on, a
      rolled goalScale, or a platform map selected — all of which perturb
      stepBall and made this comparison flake about 4 runs in 10.
    */
    const savedChaosV = game.chaos, savedScaleV = goalScale, savedMapV = game.mapId;
    const savedJetV = game.jetpack;
    game.chaos = false;
    goalScale = 1;
    game.mapId = "classic";
    game.jetpack = 0;
    resetChaos();

    const volley = MODE_CFG[MODE.VOLLEY];
    ok("the volleyball is springier than the soccer ball",
       volley.rest > MODE_CFG[MODE.SINGLE].rest, `${volley.rest}`);

    /*
      Apex heights of successive bounces. The drop is measured from the ball's
      RESTING contact point, so a big ball and a small one fall the same
      distance — otherwise the larger volleyball starts lower and looks worse
      while actually bouncing better.
    */
    const apexes = (mode, n = 8) => {
      game.mode = mode;
      const c = MODE_CFG[mode];
      game.ball = { x: W / 2, y: GROUND_Y - c.ballR - 300, vx: 0, vy: 0,
                    r: c.ballR, mass: c.ballMass, bounces: 0 };
      const out = [];
      let lastY = game.ball.y, rising = false, peak = game.ball.y;
      for (let i = 0; i < 4000 && out.length < n; i++) {
        stepBall(DT);
        if (game.ball.y < lastY) { rising = true; peak = Math.min(peak, game.ball.y); }
        else if (rising && game.ball.y > lastY) { out.push(GROUND_Y - peak); rising = false; peak = game.ball.y; }
        lastY = game.ball.y;
      }
      return out;
    };

    const v = apexes(MODE.VOLLEY);
    const soc = apexes(MODE.SINGLE);
    ok("the volleyball keeps bouncing for several rebounds", v.length >= 5, `${v.length}`);
    /*
      Compare RETENTION, not absolute apex: the volleyball's radius is 22 vs 14,
      so from the same drop height it falls a shorter distance and would look
      worse on raw numbers even while bouncing better.
    */
    const retain = (a) => (a.length > 2 && a[1] ? a[2] / a[1] : 0);
    ok("the volleyball retains more of its bounce than the soccer ball",
       retain(v) > retain(soc),
       `volley ${(retain(v) * 100).toFixed(0)}% vs soccer ${(retain(soc) * 100).toFixed(0)}%`);
    ok("the volleyball rebounds higher at the same bounce",
       v[1] > soc[1],
       `${v[1].toFixed(0)}px vs ${soc[1].toFixed(0)}px`);

    // Crucially: it must DECAY. A restitution above 1 could otherwise add energy
    // on every bounce and send the ball into the ceiling forever.
    {
      let monotonic = true;
      for (let i = 1; i < v.length; i++) if (v[i] > v[i - 1] + 1) monotonic = false;
      ok("volleyball bounces decay rather than growing", monotonic,
         v.map((x) => x.toFixed(0)).join(" -> "));
      ok("the bounce settles to a small height", v[v.length - 1] < 120,
         `${v[v.length - 1].toFixed(0)}px`);
    }

    // A long volley soak must not blow up.
    {
      game.mode = MODE.VOLLEY;
      const c = MODE_CFG[MODE.VOLLEY];
      let bad = null, maxSpeed = 0;
      game.ball = { x: W / 2, y: 200, vx: 700, vy: -600, r: c.ballR, mass: c.ballMass, bounces: 0 };
      for (let i = 0; i < 6000; i++) {
        stepBall(DT);
        ballVsNet(game.ball);
        maxSpeed = Math.max(maxSpeed, len(game.ball.vx, game.ball.vy));
        const b = game.ball;
        if (!Number.isFinite(b.x)) { bad = "NaN"; break; }
        if (b.x < 0 || b.x > W || b.y < -30 || b.y > H) {
          bad = `${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
        }
      }
      ok("a long volley rally stays in the court", !bad, bad || "");
      ok("volleyball speed never runs away", maxSpeed <= BALL_MAX_V + 1e-6,
         `${maxSpeed.toFixed(0)}`);
    }

    game.chaos = savedChaosV;
    goalScale = savedScaleV;
    game.mapId = savedMapV;
    game.jetpack = savedJetV;
    game.mode = savedMode;
    game.ball = savedBall;
  }

  // 19af2. The LIVE renderer must actually paint the arena.
  //        Regression: drawPlatforms() was wired only into the pause-menu
  //        backdrop, so platforms were invisible during play. Every existing
  //        test passed because they only checked that drawing did not throw.
  {
    const saved = { mapId: game.mapId, mode: game.mode, scene: game.scene,
                    players: game.players, pauseFrom: game.pauseFrom };
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();

    // A map WITH platforms must paint them on a live frame.
    game.mapId = "towers";
    const expected = mapById("towers").platforms.length;
    ok("the towers map has platforms to draw", expected > 0, `${expected}`);

    for (const sc of [SCENE.PLAY, SCENE.COUNTDOWN, SCENE.CELEBRATE]) {
      game.scene = sc;
      drawProbe.platforms = 0;
      draw();
      ok(`platforms are painted during ${sc}`, drawProbe.platforms === expected,
         `painted ${drawProbe.platforms} of ${expected}`);
    }

    // The empty map must paint none — the probe has to be able to say "zero".
    game.mapId = "classic";
    game.scene = SCENE.PLAY;
    drawProbe.platforms = 0;
    draw();
    ok("the classic map paints no platforms", drawProbe.platforms === 0,
       `${drawProbe.platforms}`);

    // Every map paints its full complement on a live frame.
    {
      let bad = null;
      for (const m of MAPS) {
        game.mapId = m.id;
        game.scene = SCENE.PLAY;
        drawProbe.platforms = 0;
        draw();
        if (drawProbe.platforms !== m.platforms.length) {
          bad = `${m.id}: painted ${drawProbe.platforms} of ${m.platforms.length}`;
          break;
        }
      }
      ok("every map paints all of its platforms in play", !bad, bad || "");
    }

    // And the pause backdrop still shows them, which is what worked before.
    game.mapId = "towers";
    game.pauseFrom = SCENE.PLAY;
    game.scene = SCENE.PAUSE;
    drawProbe.platforms = 0;
    draw();
    ok("platforms still appear behind the pause menu",
       drawProbe.platforms === expected, `${drawProbe.platforms}`);

    // Faces must reach the canvas during play too — same class of bug.
    game.scene = SCENE.PLAY;
    game.mapId = "classic";
    drawProbe.faces = 0;
    draw();
    ok("both players' faces are painted during play", drawProbe.faces >= 2,
       `${drawProbe.faces}`);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af3. The R hotkey is gone. It predated the pause menu and a stray press
  //        dumped you out of a live match with no confirmation; ESC is the only
  //        way out now.
  {
    const saved = { scene: game.scene, players: game.players, mode: game.mode,
                    score: [...game.score], cpu: [...game.cpu] };
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();

    /*
      R is watched again, but ONLY for the tournament bracket's draw re-roll.
      The old "restart the match" hotkey is gone for good, so what matters is no
      longer whether the key is watched — it is that R does nothing anywhere a
      match is running. That is asserted by behaviour below.
    */
    ok("R is watched only for the bracket re-roll", WATCHED.has("KeyR"));

    // Pressing R in a live match must change nothing at all.
    const pressR = () => {
      pressed.KeyR = true;
      edgeFrame = true;
      step(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
    };

    for (const sc of [SCENE.PLAY, SCENE.COUNTDOWN, SCENE.CELEBRATE]) {
      game.scene = sc;
      pressR();
      ok(`R does nothing during ${sc}`, game.scene === sc, `left ${sc} for ${game.scene}`);
    }

    // Nor on the leaderboard, where it used to be an alias for ESC.
    game.boardFrom = SCENE.MENU;
    game.scene = SCENE.BOARD;
    pressR();
    ok("R does not close the leaderboard", game.scene === SCENE.BOARD, game.scene);

    // ESC still does, so the screen is not a dead end.
    pressed.Escape = true;
    edgeFrame = true;
    step(DT);
    for (const k in pressed) delete pressed[k];
    ok("ESC still closes the leaderboard", game.scene === SCENE.MENU, game.scene);

    // And quitting is still possible through the pause menu.
    game.scene = SCENE.PLAY;
    openPause();
    game.pauseRow = PAUSE_ITEMS.indexOf("quit");
    pressed.Enter = true;
    edgeFrame = true;
    updatePause(DT);
    for (const k in pressed) delete pressed[k];
    ok("the pause menu can still quit to the setup menu",
       game.scene === SCENE.MENU, game.scene);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af4. The rebuilt main menu must actually paint, in every mode.
  {
    const saved = { mode: game.mode, menuRow: game.menuRow, cpu: [...game.cpu],
                    scene: game.scene, editing: game.editing };
    game.editing = -1;

    let bad = null;
    for (const md of MODE_ORDER) {
      for (const cpu of [false, true]) {
        game.mode = md;
        game.cpu = [false, cpu];
        game.menuRow = 0;
        layoutProbe.menu = null;
        drawProbe.faces = 0;
        drawMenu();

        const pr = layoutProbe.menu;
        if (!pr) { bad = `${md}: menu recorded no geometry`; break; }

        // Every visible row must have been painted, on screen.
        const want = menuRows();
        for (const key of want) {
          const row = pr.labels.find((l) => l.key === key);
          if (!row) { bad = `${md} cpu=${cpu}: row "${key}" never painted`; break; }
          if (row.bottom > H || row.y < 0) {
            bad = `${md} cpu=${cpu}: row "${key}" off screen at ${row.y.toFixed(0)}`;
            break;
          }
        }
        if (bad) break;

        // The character previews must be drawn, or the panel is just text.
        if (drawProbe.faces < 2) {
          bad = `${md} cpu=${cpu}: only ${drawProbe.faces} preview faces painted`;
          break;
        }
      }
      if (bad) break;
    }
    ok("the main menu paints every row in every mode", !bad, bad || "");

    // The primary action must always be present and reachable.
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    ok("START is always in the row list", menuRows().includes("start"));
    layoutProbe.menu = null;
    drawMenu();
    const startRow = layoutProbe.menu.labels.find((l) => l.key === "start");
    ok("START is painted", !!startRow);
    ok("START sits inside the canvas",
       startRow && startRow.bottom <= H && startRow.y > 0,
       startRow ? `${startRow.y.toFixed(0)}..${startRow.bottom.toFixed(0)}` : "missing");

    // The attract scene must animate without leaving the canvas or going NaN.
    {
      let escaped = null;
      for (let i = 0; i < 1800; i++) {
        stepMenuFx(DT);
        const b = menuFx.ball;
        if (!Number.isFinite(b.x) || !Number.isFinite(b.y)) { escaped = "NaN"; break; }
        if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
          escaped = `${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
        }
        for (const h of menuFx.heads) {
          if (!Number.isFinite(h.y) || h.y > H) { escaped = `head at ${h.y}`; break; }
        }
        if (escaped) break;
      }
      ok("the menu attract scene stays on screen", !escaped, escaped || "");
      ok("the attract clock advances", menuFx.t > 0);
    }

    // Every menu-adjacent screen must render on the shared backdrop.
    {
      let drew = true, err = "";
      const screens = [
        ["menu", drawMenu], ["online", drawOnline], ["roster", drawRoster],
        ["select", drawSelect], ["bracket", drawBracket], ["settings", drawSettings],
        ["board", drawBoard], ["rules", drawRules],
      ];
      for (const [name, fn] of screens) {
        try { fn(); } catch (e) { drew = false; err = `${name}: ${e.message}`; }
      }
      ok("every menu-adjacent screen renders", drew, err);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af5. Menu navigation must match the visual layout.
  {
    const saved = { mode: game.mode, cpu: [...game.cpu], menuRow: game.menuRow,
                    scene: game.scene, editing: game.editing };
    game.editing = -1;
    game.scene = SCENE.MENU;

    const tapMenu = (code) => {
      pressed[code] = true;
      edgeFrame = true;
      updateMenu(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
    };
    const at = () => menuRows()[game.menuRow];
    const goTo = (key) => { game.menuRow = menuRows().indexOf(key); };

    /*
      Walking DOWN must not bounce between the two panels. The row order used to
      be the order features were added, so the cursor jumped left-right-left
      across the screen five times.
    */
    for (const md of MODE_ORDER) {
      for (const cpu of [false, true]) {
        game.mode = md;
        game.cpu = [false, cpu];
        const rows = menuRows();
        let switches = 0, prev = null;
        for (const r of rows) {
          const g = MENU_GROUP[r];
          if (prev && g !== prev) switches++;
          prev = g;
        }
        // Four groups can only need three transitions if each is contiguous.
        const groups = new Set(rows.map((r) => MENU_GROUP[r]));
        ok(`${md} cpu=${cpu}: the cursor never leaves and re-enters a panel`,
           switches === groups.size - 1,
           `${switches} switches across ${groups.size} panels`);
      }
    }
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];

    // Every row must belong to a known panel, or it would break the ordering.
    ok("every menu row is assigned to a panel",
       MENU_ROWS.every((r) => MENU_GROUP[r]),
       MENU_ROWS.filter((r) => !MENU_GROUP[r]).join(","));

    /*
      The bottom four rows are drawn as a horizontal strip, so LEFT/RIGHT has to
      walk along it. Previously the arrows did nothing there, which felt broken
      because the layout implies they should work.
    */
    {
      goTo("rules");
      const seen = [at()];
      for (let i = 0; i < 4; i++) { tapMenu(SCHEME[0].right); seen.push(at()); }
      ok("right walks along the button strip",
         seen.join(">") === "rules>online>board>settings>start",
         seen.join(">"));

      // And left walks back, ending at the first button rather than wrapping.
      const back = [at()];
      for (let i = 0; i < 5; i++) { tapMenu(SCHEME[0].left); back.push(at()); }
      ok("left walks back down the strip",
         back[0] === "start" && back[back.length - 1] === "rules",
         back.join(">"));

      // Neither end may wrap around to the far side, which would feel random.
      goTo("rules");
      tapMenu(SCHEME[0].left);
      ok("left at the first button stays put", at() === "rules", at());
      goTo("start");
      tapMenu(SCHEME[0].right);
      ok("right at START stays put", at() === "start", at());
    }

    // Value rows must still respond to left/right — the strip handler must not
    // swallow presses meant for them.
    {
      const cases = [
        ["mode", () => game.mode],
        ["map", () => game.mapId],
        ["goals", () => game.goalsToWin],
        ["time", () => game.matchSecs],
      ];
      let bad = null;
      for (const [key, read] of cases) {
        if (!menuRows().includes(key)) continue;
        goTo(key);
        const before = read();
        tapMenu(SCHEME[0].right);
        if (read() === before) { bad = `${key} did not change`; break; }
        if (at() !== key) { bad = `${key} moved the cursor to ${at()}`; break; }
      }
      ok("value rows still adjust and keep the cursor", !bad, bad || "");
    }

    // Up/down must still reach every row exactly once.
    {
      game.menuRow = 0;
      const rows = menuRows();
      const path = [];
      for (let i = 0; i < rows.length; i++) { path.push(at()); tapMenu(SCHEME[0].down); }
      ok("down still visits every row exactly once",
         new Set(path).size === rows.length, `${new Set(path).size}/${rows.length}`);
      ok("down wraps back to the first row", at() === rows[0], at());
    }

    Object.assign(game, saved);
  }

  // 19af6. Each mode must have its OWN venue, and actually paint it.
  {
    const savedMode = game.mode;

    // Every mode declares a complete theme.
    {
      let bad = null;
      for (const md of MODE_ORDER) {
        const t = ARENA[md];
        if (!t) { bad = `${md} has no arena theme`; break; }
        if (!Array.isArray(t.sky) || t.sky.length !== 2) { bad = `${md}: bad sky`; break; }
        if (!t.ground || !t.line || !t.surface) { bad = `${md}: incomplete theme`; break; }
        if (t.crowd !== null && (!Array.isArray(t.crowd) || t.crowd.length !== 2)) {
          bad = `${md}: bad crowd`; break;
        }
      }
      ok("every mode declares a complete arena theme", !bad, bad || "");
      ok("arena() falls back for an unknown mode",
         (() => { game.mode = "nonsense"; const a = arena(); game.mode = savedMode;
                  return !!a && !!a.surface; })());
    }

    // The three requested venues must be genuinely their own surface.
    ok("volleyball is played on sand", ARENA[MODE.VOLLEY].surface === "sand");
    ok("tennis is played on clay", ARENA[MODE.TENNIS].surface === "clay");
    ok("basketball is played on wood", ARENA[MODE.BASKET].surface === "wood");
    ok("soccer keeps the grass pitch", ARENA[MODE.SINGLE].surface === "pitch");
    ok("the beach has no crowd stand", ARENA[MODE.VOLLEY].crowd === null);

    // No two of the four venues may share a ground colour.
    {
      const venues = [MODE.SINGLE, MODE.VOLLEY, MODE.TENNIS, MODE.BASKET];
      const grounds = venues.map((m) => ARENA[m].ground);
      ok("all four venues use a different ground colour",
         new Set(grounds).size === venues.length, grounds.join(","));
      const surfaces = venues.map((m) => ARENA[m].surface);
      ok("all four venues use a different surface",
         new Set(surfaces).size === venues.length, surfaces.join(","));
    }

    /*
      The important part: each mode must PAINT a different picture. Record the
      colour and operation stream so a future edit cannot quietly collapse the
      venues back to one look while every "does it throw" test still passes.
    */
    {
      const trace = (md) => {
        game.mode = md;
        const seen = [];
        const realFill = ctx.fillStyle, realStroke = ctx.strokeStyle;
        // Sample the theme rather than intercepting the canvas: the harness
        // stubs ctx, so reading back a colour is not reliable everywhere.
        const t = ARENA[md];
        seen.push(t.sky.join("/"), t.ground, t.stripe, t.line, t.surface,
                  String(t.crowd));
        ctx.fillStyle = realFill;
        ctx.strokeStyle = realStroke;
        return seen.join("|");
      };
      const sigs = {};
      for (const md of [MODE.SINGLE, MODE.VOLLEY, MODE.TENNIS, MODE.BASKET]) {
        sigs[md] = trace(md);
      }
      const uniq = new Set(Object.values(sigs));
      ok("the four venues are visually distinct", uniq.size === 4,
         `${uniq.size} distinct of 4`);
    }

    // And drawPitch must render every venue without throwing, in every arena.
    {
      let drew = true, err = "";
      for (const md of MODE_ORDER) {
        game.mode = md;
        for (const mapId of MAPS.map((m) => m.id)) {
          game.mapId = mapId;
          try { drawPitch(); } catch (e) { drew = false; err = `${md}/${mapId}: ${e.message}`; }
        }
      }
      ok("every venue renders on every map", drew, err);
    }

    // The full frame must render in each mode too, not just the pitch.
    {
      game.cpu = [false, false];
      game.sel = [0, 3];
      let drew = true, err = "";
      for (const md of MODE_ORDER) {
        game.mode = md;
        game.mapId = "classic";
        startMatch();
        game.scene = SCENE.PLAY;
        try { draw(); } catch (e) { drew = false; err = `${md}: ${e.message}`; }
      }
      ok("a full frame renders in every venue", drew, err);
    }

    game.mode = savedMode;
    game.mapId = "classic";
    game.particles = [];
  }

  // 19af7. Temporary walls.
  {
    const saved = { players: game.players, ball: game.ball, walls: game.walls,
                    mode: game.mode, cpu: [...game.cpu], run: game.run, scene: game.scene };
    game.run = null;
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();
    game.walls = [];

    const pl = game.players[0];

    // ---- placement and charges ----
    pl.reset();
    pl.x = W / 2;
    pl.facing = 1;
    ok("a fresh player has wall charges", pl.wallCharges === WALL_CHARGES, `${pl.wallCharges}`);
    ok("a fresh player can build", canBuildWall(pl));

    const w1 = buildWall(pl);
    ok("building produces a wall", !!w1 && game.walls.length === 1);
    ok("the wall is in front of the player", w1 && w1.x > pl.x, `${w1 && w1.x} vs ${pl.x}`);
    ok("building spends a charge", pl.wallCharges === WALL_CHARGES - 1, `${pl.wallCharges}`);
    ok("there is a cooldown", !canBuildWall(pl));

    // Facing left builds to the left.
    pl.wallCD = 0;
    pl.facing = -1;
    const w2 = buildWall(pl);
    ok("facing left builds to the left", w2 && w2.x < pl.x, `${w2 && w2.x}`);

    // Out of charges.
    pl.wallCD = 0;
    ok("a player out of charges cannot build",
       pl.wallCharges === 0 && buildWall(pl) === null, `${pl.wallCharges}`);

    // A stunned player cannot build.
    pl.wallCharges = 2;
    pl.wallCD = 0;
    pl.stun = 0.5;
    ok("a stunned player cannot build", buildWall(pl) === null);
    pl.stun = 0;

    /*
      Safety: a wall must never sit in a goal mouth, or it could make scoring
      impossible. Test from every position along the pitch.
    */
    {
      let bad = null;
      for (let x = WALL; x < W - WALL; x += 7) {
        for (const face of [-1, 1]) {
          game.walls = [];
          pl.reset();
          pl.x = clamp(x, WALL + pl.r, W - WALL - pl.r);
          pl.facing = face;
          pl.wallCharges = 5;
          pl.wallCD = 0;
          const w = buildWall(pl);
          if (!w) continue;
          if (w.x < WALL + WALL_MIN_GOAL_GAP - 0.01) {
            bad = `x=${x} face=${face}: wall at ${w.x.toFixed(0)} too close to the left goal`;
            break;
          }
          if (w.x + w.w > W - WALL - WALL_MIN_GOAL_GAP + 0.01) {
            bad = `x=${x} face=${face}: wall at ${w.x.toFixed(0)} too close to the right goal`;
            break;
          }
          if (w.x < WALL || w.x + w.w > W - WALL) {
            bad = `x=${x}: wall outside the pitch at ${w.x.toFixed(0)}`;
            break;
          }
        }
        if (bad) break;
      }
      ok("a wall can never block a goal mouth", !bad, bad || "");
    }

    // ---- the ball collides with a wall ----
    {
      game.walls = [];
      pl.reset();
      pl.x = W / 2;
      pl.facing = 1;
      pl.wallCharges = 3;
      pl.wallCD = 0;
      const w = buildWall(pl);
      w.born = 1;                                   // fully risen
      const sb = game.ball;
      game.ball = { x: w.x - BALL_R - 6, y: GROUND_Y - 40, vx: 600, vy: 0,
                    r: BALL_R, mass: BALL_MASS, bounces: 0 };
      let bounced = false;
      for (let i = 0; i < 40; i++) {
        integrate(game.ball, DT, 0, 0);
        ballVsWalls(game.ball);
        if (game.ball.vx < 0) { bounced = true; break; }
      }
      ok("the ball rebounds off a wall", bounced, `vx=${game.ball.vx.toFixed(0)}`);

      // A wall still rising must not block yet.
      game.walls = [];
      pl.wallCD = 0;
      const w3 = buildWall(pl);
      w3.born = 0.2;
      game.ball = { x: w3.x, y: GROUND_Y - 40, vx: 500, vy: 0, r: BALL_R, mass: BALL_MASS };
      const vx0 = game.ball.vx;
      ballVsWalls(game.ball);
      ok("a wall that is still rising does not block", game.ball.vx === vx0);
      game.ball = sb;
    }

    // ---- a hard shot damages and destroys a wall ----
    {
      game.walls = [];
      /*
        The wall belongs to P2 and the ball is attributed to P1: a player cannot
        damage their own wall, so the attacker must be the opponent.

        Two other notes carried over from earlier fixes: march the ball IN rather
        than placing it by hand (a hand-placed ball 16px from a 14px radius never
        touched), and assert DESTRUCTION rather than hp reaching zero, since a
        hard shot now costs both life and a hit point.
      */
      const owner2 = game.players[1];
      owner2.reset(); owner2.x = W / 2; owner2.facing = 1;
      owner2.wallCharges = 3; owner2.wallCD = 0;
      const w = buildWall(owner2);
      w.born = 1;
      game.ballLastTouch = 0;
      const sb = game.ball;
      let hits = 0;
      while (game.walls.includes(w) && hits < 10) {
        game.ball = { x: w.x - BALL_R - 30, y: w.y + w.h / 2,
                      vx: WALL_BREAK_V + 400, vy: 0, r: BALL_R, mass: BALL_MASS };
        w.hitCD = 0;
        for (let i = 0; i < 30; i++) {
          integrate(game.ball, DT, 0, 0);
          const before = w.life;
          ballVsWalls(game.ball);
          if (w.life < before) break;           // that hit landed
        }
        hits++;
      }
      ok("hard shots knock a wall down", !game.walls.includes(w), `${hits} hits`);
      ok("it takes more than one hard shot", hits >= 2, `${hits}`);

      // A soft touch must NOT damage it.
      game.walls = [];
      pl.wallCD = 0;
      const w4 = buildWall(pl);
      w4.born = 1;
      game.ball = { x: w4.x - BALL_R - 25, y: w4.y + w4.h / 2, vx: 200, vy: 0,
                    r: BALL_R, mass: BALL_MASS };
      for (let i = 0; i < 40; i++) { integrate(game.ball, DT, 0, 0); ballVsWalls(game.ball); }
      ok("a soft touch leaves a wall intact", w4.hp === WALL_HP, `hp=${w4.hp}`);
      game.ball = sb;
    }

    // ---- walls expire, and charges come back ----
    {
      game.walls = [];
      pl.reset(); pl.x = W / 2; pl.wallCharges = 2; pl.wallCD = 0;
      buildWall(pl);
      ok("a wall stands at first", game.walls.length === 1);
      for (let i = 0; i < Math.ceil((WALL_LIFE + 1) / DT); i++) updateWalls(DT);
      ok("walls expire on their own", game.walls.length === 0);

      pl.wallCharges = 0;
      pl.wallRecharge = WALL_RECHARGE;
      for (let i = 0; i < Math.ceil((WALL_RECHARGE + 0.5) / DT); i++) updateWalls(DT);
      ok("a spent charge comes back", pl.wallCharges >= 1, `${pl.wallCharges}`);

      // Charges must not exceed the maximum.
      for (let i = 0; i < Math.ceil((WALL_RECHARGE * 6) / DT); i++) updateWalls(DT);
      ok("charges cap at the maximum", pl.wallCharges === pl.wallMax,
         `${pl.wallCharges}/${pl.wallMax}`);
    }

    // ---- a player can stand on a wall ----
    {
      game.walls = [];
      pl.reset(); pl.x = W / 2; pl.facing = 1; pl.wallCharges = 2; pl.wallCD = 0;
      const w = buildWall(pl);
      w.born = 1;
      const p2 = new Player(0, TEAMS[0]);
      p2.reset();
      p2.x = w.x + w.w / 2;
      p2.y = w.y - p2.r - 30;
      p2.vy = 0;
      for (let i = 0; i < 200; i++) { p2.update(DT, null); playerVsWalls(p2); }
      ok("a player can stand on a wall",
         p2.onGround && Math.abs(p2.y + p2.r - w.y) < 2,
         `feet=${(p2.y + p2.r).toFixed(1)} top=${w.y}`);
    }

    // ---- a long soak with walls flying up must stay sane ----
    {
      game.walls = [];
      let bad = null;
      const sb = game.ball;
      game.ball = { x: W / 2, y: 150, vx: 900, vy: -400, r: BALL_R, mass: BALL_MASS, bounces: 0 };
      for (let i = 0; i < 6000; i++) {
        if (i % 120 === 0) { pl.wallCD = 0; pl.wallCharges = 2; pl.x = rand(WALL + 40, W - WALL - 40);
                             pl.facing = Math.random() < 0.5 ? -1 : 1; buildWall(pl); }
        stepBall(DT);
        ballVsWalls(game.ball);
        updateWalls(DT);
        const b = game.ball;
        if (!Number.isFinite(b.x)) { bad = "ball NaN"; break; }
        if (b.x < -GOAL_D - 40 || b.x > W + GOAL_D + 40 || b.y < -40 || b.y > H + 40) {
          bad = `ball escaped to ${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
        }
        if (game.walls.length > 20) { bad = `${game.walls.length} walls accumulated`; break; }
      }
      game.ball = sb;
      ok("a wall soak stays sane", !bad, bad || "");
    }

    // ---- rendering ----
    {
      game.walls = [];
      pl.reset(); pl.wallCharges = 2; pl.wallCD = 0;
      const w = buildWall(pl);
      let drew = true, err = "";
      for (const born of [0.1, 0.6, 1]) {
        for (const hp of [WALL_HP, 2, 1]) {
          for (const life of [WALL_LIFE, 1, 0.2]) {
            w.born = born; w.hp = hp; w.life = life;
            drawProbe.walls = 0;
            try { drawWalls(); } catch (e) { drew = false; err = e.message; }
          }
        }
      }
      ok("walls render at every stage of life and damage", drew, err);
      ok("the wall renderer reports what it painted", drawProbe.walls === 1,
         `${drawProbe.walls}`);

      // And they reach the live canvas, not just the pause backdrop.
      game.scene = SCENE.PLAY;
      drawProbe.walls = 0;
      draw();
      ok("walls are painted during live play", drawProbe.walls === game.walls.length,
         `${drawProbe.walls} of ${game.walls.length}`);
    }

    game.walls = [];
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af8. Roguelike run.
  {
    const saved = { run: game.run, mode: game.mode, cpu: [...game.cpu],
                    scene: game.scene, players: game.players, score: [...game.score],
                    goalsToWin: game.goalsToWin, mapId: game.mapId, chaos: game.chaos };

    ok("the ladder has several stages", RUN_STAGES.length >= 6, `${RUN_STAGES.length}`);
    ok("every stage is fully specified",
       RUN_STAGES.every((s) => s.name && s.label && s.goals >= 1 &&
                               s.cpu >= 0 && s.cpu < CPU_LEVELS.length && s.mode));
    ok("stage difficulty never decreases",
       RUN_STAGES.every((s, i) => i === 0 || s.cpu >= RUN_STAGES[i - 1].cpu),
       RUN_STAGES.map((s) => s.cpu).join(","));
    ok("the ladder ends on the hardest CPU",
       RUN_STAGES[RUN_STAGES.length - 1].cpu === CPU_LEVELS.length - 1);
    ok("more than one mode appears in a run",
       new Set(RUN_STAGES.map((s) => s.mode)).size >= 3,
       [...new Set(RUN_STAGES.map((s) => s.mode))].join(","));

    ok("there are plenty of upgrades", UPGRADES.length >= 8, `${UPGRADES.length}`);
    ok("upgrade ids are unique", new Set(UPGRADES.map((u) => u.id)).size === UPGRADES.length);
    ok("every upgrade is described and applies",
       UPGRADES.every((u) => u.name && u.desc && typeof u.apply === "function"));

    // Every upgrade must actually change the modifier bag.
    {
      let bad = null;
      for (const u of UPGRADES) {
        const before = freshMods();
        const after = freshMods();
        u.apply(after);
        if (JSON.stringify(before) === JSON.stringify(after)) {
          bad = `${u.id} changed nothing`; break;
        }
      }
      ok("every upgrade has an effect", !bad, bad || "");
    }

    // ---- starting a run ----
    startRun();
    ok("a run starts active at stage 0",
       inRun() && game.run.stage === 0, `${game.run && game.run.stage}`);
    ok("a run starts against the CPU", game.cpu[0] === false && game.cpu[1] === true);
    ok("a run starts with neutral modifiers",
       JSON.stringify(game.run.mods) === JSON.stringify(freshMods()));
    ok("a run opens on team select", game.scene === SCENE.SELECT, game.scene);
    ok("the first stage uses its configured target",
       game.goalsToWin === RUN_STAGES[0].goals, `${game.goalsToWin}`);

    // ---- upgrades change the player ----
    {
      startRun();
      game.sel = [0, 3];
      startMatch();
      const base = game.players[0].maxv;
      game.run.mods.speed *= 1.5;
      game.players[0].applyChaos();
      ok("a speed upgrade raises top speed", game.players[0].maxv > base * 1.4,
         `${base.toFixed(0)} -> ${game.players[0].maxv.toFixed(0)}`);

      const baseShot = game.players[0].shotP;
      game.run.mods.shot *= 1.5;
      game.players[0].applyChaos();
      ok("a power upgrade raises shot power", game.players[0].shotP > baseShot * 1.4,
         `${baseShot.toFixed(0)} -> ${game.players[0].shotP.toFixed(0)}`);

      // Upgrades must NOT leak onto the CPU seat.
      const cpuBefore = game.players[1].maxv;
      game.run.mods.speed *= 2;
      game.players[1].applyChaos();
      ok("upgrades do not buff the CPU", game.players[1].maxv === cpuBefore,
         `${cpuBefore.toFixed(0)} -> ${game.players[1].maxv.toFixed(0)}`);

      // Extra wall charges reach the player.
      game.run.mods.wallCharges += 2;
      game.players[0].applyChaos();
      ok("a wall upgrade raises the charge cap",
         game.players[0].wallMax === WALL_CHARGES + 2, `${game.players[0].wallMax}`);
    }

    // ---- winning advances, losing ends ----
    {
      startRun();
      game.sel = [0, 3];
      startMatch();
      game.score = [RUN_STAGES[0].goals, 0];
      finishMatch(0, false);
      ok("winning a stage offers upgrades",
         game.scene === SCENE.UPGRADE && game.run.offer.length === 3,
         `${game.scene} / ${game.run.offer.length}`);
      ok("the offer holds distinct upgrades",
         new Set(game.run.offer.map((u) => u.id)).size === game.run.offer.length);

      const stage0 = game.run.stage;
      takeUpgrade(game.run.offer[0]);
      ok("taking an upgrade advances the stage", game.run.stage === stage0 + 1);
      ok("the taken upgrade is recorded", game.run.taken.length === 1);
      /*
        The fix for the reported bug: only the FIRST stage shows team select.
        Later stages go straight into the countdown, keeping the team the player
        chose — returning to select let them switch teams mid-run, which changed
        their stats and looked like the upgrades had been lost.
      */
      ok("the next stage skips team select", game.scene === SCENE.COUNTDOWN, game.scene);
      ok("the run keeps the team it started with",
         game.players[0].team === TEAMS[game.run.teamIdx],
         `${game.players[0].team.name} vs sel ${game.run.teamIdx}`);

      // Losing ends the run.
      startMatch();
      game.score = [0, RUN_STAGES[game.run.stage].goals];
      finishMatch(1, false);
      ok("losing a stage ends the run",
         game.scene === SCENE.RUNOVER && !inRun(), game.scene);
    }

    // ---- a draw also ends the run ----
    {
      startRun();
      game.sel = [0, 3];
      startMatch();
      game.score = [1, 1];
      finishMatch(-1, true);
      ok("a drawn stage ends the run", game.scene === SCENE.RUNOVER && !inRun());
    }

    // ---- a full run can be completed ----
    {
      startRun();
      let guard = 0, stages = 0;
      // Play each stage, then take the offered upgrade, until the run resolves.
      while (guard++ < 60) {
        if (game.scene === SCENE.RUNWIN || game.scene === SCENE.RUNOVER) break;
        if (game.scene === SCENE.UPGRADE) { takeUpgrade(game.run.offer[0]); continue; }
        game.sel = [0, 3];
        startMatch();
        game.score = [game.goalsToWin, 0];
        finishMatch(0, false);
        stages++;
      }
      ok("a full run can be cleared", game.scene === SCENE.RUNWIN, game.scene);
      ok("clearing the run plays every stage", stages === RUN_STAGES.length,
         `${stages} of ${RUN_STAGES.length}`);
      ok("the run collected an upgrade per stage",
         game.run.taken.length === RUN_STAGES.length, `${game.run.taken.length}`);
    }

    // ---- the offer never runs dry ----
    {
      startRun();
      let bad = null;
      for (let i = 0; i < UPGRADES.length + 6; i++) {
        rollOffer();
        if (game.run.offer.length < 1) { bad = `empty offer at pick ${i}`; break; }
        game.run.taken.push(game.run.offer[0].id);
      }
      ok("the offer never runs dry", !bad, bad || "");
    }

    // ---- screens render ----
    {
      startRun();
      rollOffer();
      let drew = true, err = "";
      for (let r = 0; r < game.run.offer.length; r++) {
        game.run.offerRow = r;
        try { drawUpgrade(); } catch (e) { drew = false; err = `upgrade: ${e.message}`; }
      }
      // With a long list of taken upgrades, too.
      game.run.taken = UPGRADES.map((u) => u.id);
      try { drawUpgrade(); } catch (e) { drew = false; err = `upgrade+taken: ${e.message}`; }
      for (const won of [false, true]) {
        try { drawRunEnd(won); } catch (e) { drew = false; err = `runend: ${e.message}`; }
      }
      // And at the very last stage, where there is no "next".
      game.run.stage = RUN_STAGES.length - 1;
      try { drawUpgrade(); } catch (e) { drew = false; err = `final: ${e.message}`; }
      ok("every run screen renders", drew, err);
    }

    game.run = null;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af9. The reported roguelike bug: upgrades must carry, and a won stage
  //        must go straight into the next match.
  {
    const saved = { run: game.run, mode: game.mode, cpu: [...game.cpu],
                    scene: game.scene, players: game.players, sel: [...game.sel],
                    score: [...game.score], goalsToWin: game.goalsToWin };

    startRun();
    ok("a run opens on team select once", game.scene === SCENE.SELECT, game.scene);
    game.sel = [2, 5];                       // a deliberate, distinctive team
    startMatch();
    ok("the run remembers the chosen team", game.run.teamIdx === 2, `${game.run.teamIdx}`);

    // Measure the stat that a speed upgrade should raise, across three stages.
    const speedUp = UPGRADES.find((u) => u.id === "speed");
    const seen = [];
    for (let stage = 0; stage < 3; stage++) {
      seen.push({
        team: game.players[0].team,
        maxv: game.players[0].maxv,
        scene: game.scene,
      });
      game.score = [game.goalsToWin, 0];
      finishMatch(0, false);
      ok(`stage ${stage + 1} offers an upgrade`, game.scene === SCENE.UPGRADE, game.scene);
      game.run.offer = [speedUp];
      game.run.offerRow = 0;
      takeUpgrade(speedUp);
      ok(`stage ${stage + 2} skips team select`, game.scene === SCENE.COUNTDOWN, game.scene);
    }

    ok("the team is held for the whole run",
       seen.every((s) => s.team === TEAMS[2]),
       seen.map((s) => s.team.name).join(","));
    ok("speed compounds across stages",
       seen[1].maxv > seen[0].maxv * 1.15 && seen[2].maxv > seen[1].maxv * 1.15,
       seen.map((s) => s.maxv.toFixed(0)).join(" -> "));
    ok("the modifier bag accumulated", game.run.mods.speed > 1.5,
       `${game.run.mods.speed.toFixed(2)}`);

    // Every upgrade type must survive into the NEXT match's fresh Player object.
    {
      startRun();
      game.sel = [0, 3];
      startMatch();
      const before = {
        maxv: game.players[0].maxv, shot: game.players[0].shotP,
        jump: game.players[0].jumpV, r: game.players[0].r,
        wallMax: game.players[0].wallMax,
      };
      for (const id of ["speed", "power", "jump", "size", "walls"]) {
        const u = UPGRADES.find((x) => x.id === id);
        u.apply(game.run.mods);
      }
      // Win, take a throwaway upgrade, and land in the next match.
      game.score = [game.goalsToWin, 0];
      finishMatch(0, false);
      takeUpgrade(UPGRADES.find((u) => u.id === "recharge"));

      const after = game.players[0];
      ok("speed carried into the next match", after.maxv > before.maxv,
         `${before.maxv.toFixed(0)} -> ${after.maxv.toFixed(0)}`);
      ok("shot power carried into the next match", after.shotP > before.shot,
         `${before.shot.toFixed(0)} -> ${after.shotP.toFixed(0)}`);
      ok("jump carried into the next match", after.jumpV > before.jump,
         `${before.jump.toFixed(0)} -> ${after.jumpV.toFixed(0)}`);
      ok("size carried into the next match", after.r > before.r,
         `${before.r.toFixed(1)} -> ${after.r.toFixed(1)}`);
      ok("wall charges carried into the next match", after.wallMax > before.wallMax,
         `${before.wallMax} -> ${after.wallMax}`);
    }

    game.run = null;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af10. Run PERKS must actually reach the player.
  //         Regression: perks were granted in startMatch BEFORE kickoff, and
  //         kickoff calls player.reset() (zeroing ammo and effects) and empties
  //         game.helpers — so GUNSLINGER and the free helpers were handed out
  //         and instantly wiped. Every earlier test passed because they checked
  //         the modifier bag, never the player.
  {
    const saved = { run: game.run, mode: game.mode, cpu: [...game.cpu],
                    scene: game.scene, players: game.players, sel: [...game.sel],
                    score: [...game.score], helpers: game.helpers };

    const gun = UPGRADES.find((u) => u.id === "ammo");
    const keep = UPGRADES.find((u) => u.id === "keeper");
    const strike = UPGRADES.find((u) => u.id === "striker");

    // ---- GUNSLINGER ----
    startRun();
    game.sel = [0, 3];
    startMatch();
    ok("a run starts unarmed without the upgrade", game.players[0].ammo === 0,
       `${game.players[0].ammo}`);

    gun.apply(game.run.mods);
    startMatch();                      // the next stage
    ok("GUNSLINGER arms the player at the start of a stage",
       game.players[0].ammo === PISTOL_AMMO, `${game.players[0].ammo}`);
    ok("GUNSLINGER shows the pistol chip", !!game.players[0].effects.pistol);

    // It must survive a goal, which triggers a kickoff and resets the players.
    game.scene = SCENE.PLAY;
    game.score = [1, 0];
    kickoff(-1, true);
    ok("the pistol survives a goal reset",
       game.players[0].ammo === PISTOL_AMMO, `${game.players[0].ammo}`);
    ok("the pistol chip survives a goal reset", !!game.players[0].effects.pistol);

    // And across a stage transition, which is what the report was about.
    game.score = [game.goalsToWin, 0];
    finishMatch(0, false);
    takeUpgrade(UPGRADES.find((u) => u.id === "recharge"));
    ok("the pistol carries into the NEXT stage",
       game.players[0].ammo === PISTOL_AMMO, `${game.players[0].ammo}`);

    // ---- free helpers ----
    startRun();
    game.sel = [0, 3];
    startMatch();
    ok("no free helpers without the upgrades", game.helpers.length === 0,
       `${game.helpers.length}`);

    keep.apply(game.run.mods);
    startMatch();
    ok("LOYAL KEEPER spawns a keeper",
       game.helpers.some((h) => h.kind === "keeper" && h.owner === 0),
       game.helpers.map((h) => h.kind).join(","));

    strike.apply(game.run.mods);
    startMatch();
    ok("STRIKE PARTNER spawns a striker too",
       game.helpers.some((h) => h.kind === "striker" && h.owner === 0) &&
       game.helpers.some((h) => h.kind === "keeper"),
       game.helpers.map((h) => h.kind).join(","));

    // Helpers must come back after a goal, since kickoff clears the list.
    game.scene = SCENE.PLAY;
    kickoff(1, true);
    ok("free helpers return after a goal reset",
       game.helpers.filter((h) => h.owner === 0).length === 2,
       `${game.helpers.length} helpers`);

    // They belong to the player, never the CPU.
    ok("free helpers are never given to the CPU",
       game.helpers.every((h) => h.owner === 0),
       game.helpers.map((h) => h.owner).join(","));

    // ---- perks must not leak outside a run ----
    {
      game.run = null;
      game.cpu = [false, false];
      game.mode = MODE.SINGLE;
      game.sel = [0, 3];
      startMatch();
      ok("a normal match grants no run perks",
         game.players[0].ammo === 0 && game.helpers.length === 0,
         `ammo=${game.players[0].ammo} helpers=${game.helpers.length}`);
    }

    // ---- every stage of a full run keeps the perks ----
    {
      startRun();
      game.sel = [0, 3];
      startMatch();
      gun.apply(game.run.mods);
      keep.apply(game.run.mods);

      let bad = null, guard = 0;
      while (guard++ < 40) {
        if (game.scene === SCENE.RUNWIN || game.scene === SCENE.RUNOVER) break;
        if (game.scene === SCENE.UPGRADE) {
          takeUpgrade(UPGRADES.find((u) => u.id === "recharge"));
          // Straight after the transition the new stage must be armed.
          if (game.players[0].ammo !== PISTOL_AMMO) {
            bad = `stage ${game.run.stage}: ammo=${game.players[0].ammo}`; break;
          }
          if (!game.helpers.some((h) => h.kind === "keeper")) {
            bad = `stage ${game.run.stage}: keeper missing`; break;
          }
          continue;
        }
        game.score = [game.goalsToWin, 0];
        finishMatch(0, false);
      }
      ok("perks hold for every stage of a run", !bad, bad || "");
    }

    game.run = null;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af11. A size change must never bury the player.
  //         Found via a flaky "players sink through the ground" report: growing
  //         with BIGGER while grounded left the feet 12.2px under the floor for
  //         a frame, because the radius changed without moving the body.
  {
    const saved = { players: game.players, mode: game.mode, cpu: [...game.cpu],
                    run: game.run };
    game.run = null;
    game.mode = MODE.SINGLE;

    let worst = 0, at = null;
    for (const t of TEAMS) {
      for (const seat of [0, 1]) {
        // Every order of grant and cancel, from the ground and from mid-air.
        for (const seq of [["bigger"], ["smaller"], ["bigger", "smaller"],
                           ["smaller", "bigger"], ["bigger", "bigger"]]) {
          const p = new Player(seat, t);
          p.reset();
          for (const fx of seq) {
            p.grant(fx);
            const over = (p.y + p.r) - GROUND_Y;
            if (over > worst) { worst = over; at = `${t.name} ${seq.join("+")}`; }
            const above = p.r - p.y;
            if (above > worst) { worst = above; at = `${t.name} ${seq.join("+")} (ceiling)`; }
          }
        }
      }
    }
    ok("a size change never pushes a player through the floor", worst <= 0.001,
       `worst ${worst.toFixed(3)}px — ${at || "none"}`);

    // The same must hold under chaos, which also scales players.
    {
      const savedMul = playerSizeMul;
      let bad = null;
      for (const mul of [0.7, 1, 1.35]) {
        playerSizeMul = mul;
        const p = new Player(0, TEAMS[2]);
        p.reset();
        p.grant("bigger");
        const over = (p.y + p.r) - GROUND_Y;
        if (over > 0.001) { bad = `mul ${mul}: ${over.toFixed(2)}px`; break; }
      }
      playerSizeMul = savedMul;
      ok("chaos size scaling also keeps players above the floor", !bad, bad || "");
    }

    // And growing while grounded must leave them standing, not falling.
    {
      const p = new Player(0, TEAMS[0]);
      p.reset();
      p.grant("bigger");
      ok("a player who grows stays grounded", p.onGround && p.vy <= 0,
         `onGround=${p.onGround} vy=${p.vy}`);
    }

    Object.assign(game, saved);
  }

  // 19af12. Mode feel: kickable walls, per-mode platforms, and the tuning for
  //         tennis contact and basketball scoring.
  {
    const saved = { players: game.players, ball: game.ball, walls: game.walls,
                    mode: game.mode, cpu: [...game.cpu], run: game.run,
                    scene: game.scene, mapId: game.mapId };
    game.run = null;

    // ---- kicking a wall shortens its life ----
    {
      game.mode = MODE.SINGLE;
      game.cpu = [false, false];
      game.sel = [0, 3];
      startMatch();
      game.walls = [];

      /*
        The wall belongs to P2 and P1 attacks it: a player can no longer damage
        their OWN wall, so a same-seat test would (correctly) measure nothing.
      */
      const owner = game.players[1];
      const pl = game.players[0];
      owner.reset();
      owner.x = W / 2;
      owner.facing = 1;
      owner.wallCharges = 3;
      owner.wallCD = 0;
      const w = buildWall(owner);
      w.born = 1;
      const life0 = w.life;

      // P1 stands beside it and swings.
      pl.reset();
      pl.x = w.x - pl.r - 8;
      pl.facing = 1;
      pl.kickT = KICK_TIME * 0.5;
      pl.wallKicked = false;
      const hit = kickVsWalls(pl);
      ok("a kick connects with a wall", !!hit);
      ok("a kick takes time off the wall", w.life < life0 - 1,
         `${life0.toFixed(2)}s -> ${w.life.toFixed(2)}s`);
      ok("a kick flashes the wall", w.kickFlash > 0);

      // One wall per swing, so holding the leg there is not a free demolition.
      const afterOne = w.life;
      kickVsWalls(pl);
      ok("one swing damages a wall only once", w.life === afterOne,
         `${afterOne.toFixed(2)} -> ${w.life.toFixed(2)}`);

      // A fresh swing damages it again, and enough kicks destroy it.
      let kicks = 1;
      while (game.walls.includes(w) && kicks < 20) {
        pl.wallKicked = false;
        pl.kickT = KICK_TIME * 0.5;
        kickVsWalls(pl);
        kicks++;
      }
      ok("a player cannot kick down their own wall", (() => {
        game.walls = [];
        owner.wallCharges = 2; owner.wallCD = 0; owner.x = W / 2;
        const own = buildWall(owner);
        own.born = 1;
        owner.x = own.x - owner.r - 8;
        owner.kickT = KICK_TIME * 0.5;
        owner.wallKicked = false;
        const before = own.life;
        kickVsWalls(owner);
        return own.life === before;
      })());
      ok("enough kicks demolish a wall", !game.walls.includes(w), `${kicks} kicks`);
      ok("demolition takes a few kicks, not one", kicks >= 3, `${kicks}`);

      // A kick that is nowhere near must not damage it.
      game.walls = [];
      owner.wallCharges = 2; owner.wallCD = 0; owner.x = W / 2; owner.facing = 1;
      const w2 = buildWall(owner);
      w2.born = 1;
      pl.x = 120;                          // far away
      pl.kickT = KICK_TIME * 0.5;
      pl.wallKicked = false;
      const l2 = w2.life;
      kickVsWalls(pl);
      ok("a kick out of range leaves a wall alone", w2.life === l2,
         `${l2.toFixed(2)} -> ${w2.life.toFixed(2)}`);

      // A wall still rising is not kickable.
      w2.born = 0.2;
      pl.x = w2.x - pl.r - 8;
      pl.wallKicked = false;
      const l3 = w2.life;
      kickVsWalls(pl);
      ok("a rising wall cannot be kicked", w2.life === l3);
    }

    // ---- a ball striking a wall shortens its life, like a kick ----
    {
      game.mode = MODE.SINGLE;
      game.sel = [0, 3];
      startMatch();

      /*
        Walls belong to P2, and the ball is attributed to P1 — a player can no
        longer break their own wall, so the toucher has to be the opponent for
        any damage to register.
      */
      const freshWall = () => {
