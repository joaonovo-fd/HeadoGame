      ok("no 'undefined' ever reaches the screen",
         !shot.strings.some((t) => /undefined/.test(t)),
         shot.strings.filter((t) => /undefined/.test(t)).join("|"));
    }

    // A version string off the wire is untrusted input like any other.
    netHandle({ t: "hi", n: "ZOE", v: "<b>1.9</b>" });
    ok("a hostile version string is stripped",
       !/[<>]/.test(net.peerVersion), net.peerVersion);
    netHandle({ t: "hi", n: "ZOE", v: "9".repeat(500) });
    ok("an over-long version is truncated", net.peerVersion.length <= 12,
       `${net.peerVersion.length} chars`);
    netHandle({ t: "hi", n: "ZOE", v: 42 });
    ok("a non-string version does not throw or stick", net.peerVersion === "");

    // Our own hello carries the version, so the peer can run the same check.
    {
      const sent = [];
      const realChan = net.chan;
      net.chan = { readyState: "open", send: (d) => sent.push(d) };
      netSendHello();
      net.chan = realChan;
      const parsed = sent.map((d) => { try { return JSON.parse(d); } catch (e) { return {}; } });
      ok("our hello announces our version",
         parsed.some((m) => m.t === "hi" && m.v === VERSION),
         JSON.stringify(parsed));
    }

    // Disconnecting must clear the warning, or it follows the player into the
    // next connection.
    netReset();
    ok("netReset clears the version warning", net.versionMismatch === false);
    ok("netReset clears the peer version", net.peerVersion === "", net.peerVersion);

    Object.assign(net, savedNet);
    Object.assign(game, saved);
  }

  // 19am. Music can be silenced from the in-game pause menu.
  {
    const saved = { scene: game.scene, pauseFrom: game.pauseFrom,
                    pauseRow: game.pauseRow, mode: game.mode, cpu: [...game.cpu],
                    players: game.players, ball: game.ball,
                    score: [...game.score], opt: { ...game.opt } };
    const savedNet = { ...net };
    net.active = false; net.role = null;

    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();
    game.scene = SCENE.PLAY;

    ok("the pause menu has a music row", PAUSE_ITEMS.includes("music"));
    // It must be near the top: silencing the music is an urgent want mid-match.
    ok("the music row sits high in the list", PAUSE_ITEMS.indexOf("music") <= 1,
       `index ${PAUSE_ITEMS.indexOf("music")}`);

    const tapPause = (code) => {
      pressed[code] = true;
      edgeFrame = true;
      updatePause(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
    };

    // ---- the toggle itself ----------------------------------------------
    openPause();
    game.pauseRow = PAUSE_ITEMS.indexOf("music");
    game.opt.music = true;

    tapPause(SCHEME[0].right);
    ok("right switches the music off", game.opt.music === false);
    ok("switching music off keeps you on the pause screen",
       game.scene === SCENE.PAUSE, game.scene);

    tapPause(SCHEME[0].left);
    ok("left switches it back on", game.opt.music === true);

    tapPause(SCHEME[0].kick);
    ok("kick toggles it too", game.opt.music === false);
    ok("toggling with kick does not resume play", game.scene === SCENE.PAUSE,
       game.scene);

    // Player 2's keys must work as well; either player may reach for this.
    tapPause(SCHEME[1].right);
    ok("player two can toggle the music too", game.opt.music === true);

    /*
      The row must NOT fall through to the row's neighbours. A left/right press
      handled by the music row and then again by the switch below would both
      toggle and act, which is how a toggle row starts resuming the match.
    */
    game.pauseRow = PAUSE_ITEMS.indexOf("music");
    game.opt.music = true;
    tapPause(SCHEME[0].right);
    ok("a toggle press does nothing else", game.scene === SCENE.PAUSE &&
       game.pauseRow === PAUSE_ITEMS.indexOf("music"), game.scene);

    // ---- it must really silence the audio, and ask to be remembered ------
    {
      /*
        The running track is stopped through musicStop, which no-ops when there is
        no audio context — as here, and in any browser that has not been allowed
        to make sound yet. So the observable effect is asserted by SPYING on the
        call rather than on music.started, which would only ever prove that the
        harness has no audio.
      */
      let stopped = 0;
      const realStop = musicStop;
      try {
        // eslint-disable-next-line no-func-assign
        musicStop = () => { stopped++; realStop(); };
        game.opt.music = true;
        game.pauseRow = PAUSE_ITEMS.indexOf("music");
        tapPause(SCHEME[0].kick);
        ok("turning music off stops the track", stopped === 1, `${stopped} calls`);
        // Turning it back ON must not call stop — that would fight the frame loop.
        tapPause(SCHEME[0].kick);
        ok("turning music back on does not stop anything",
           game.opt.music === true && stopped === 1, `${stopped} calls`);
      } finally {
        // eslint-disable-next-line no-func-assign
        musicStop = realStop;
      }

      /*
        The choice must be WRITTEN. Storage itself may be missing or blocked (it
        is in this harness), so this spies on the save instead of reading the value
        back, which would test the environment rather than the game.
      */
      let saves = 0;
      const realSave = saveOpts;
      try {
        // eslint-disable-next-line no-func-assign
        saveOpts = (o) => { saves++; realSave(o); };
        game.pauseRow = PAUSE_ITEMS.indexOf("music");
        tapPause(SCHEME[0].kick);
        ok("the choice is written to storage", saves === 1, `${saves} saves`);
      } finally {
        // eslint-disable-next-line no-func-assign
        saveOpts = realSave;
      }
    }

    // ---- the row must be visible, and the card must still fit ------------
    {
      for (const on of [true, false]) {
        game.opt.music = on;
        openPause();
        const shot = capturePaint(drawPause);
        ok(`the pause screen shows the music row (music ${on ? "on" : "off"})`,
           shot.strings.includes("MUSIC"), shot.strings.join("|").slice(0, 90));
        ok(`the pill reads ${on ? "ON" : "OFF"}`,
           shot.strings.includes(on ? "ON" : "OFF"));
        const off = shot.lines.filter((l) => l.y < 0 || l.y > H);
        ok(`the taller pause card still fits (music ${on ? "on" : "off"})`,
           off.length === 0, off.map((o) => `${o.s}@${o.y.toFixed(0)}`).join("|"));
      }

      /*
        Every row must sit INSIDE the card, not merely on the canvas. With a
        fixed card height the last row painted below the card's own bottom edge —
        visibly wrong, yet still on screen, so a fits-on-screen check passed it.
      */
      {
        openPause();
        const shot = capturePaint(drawPause);
        const card = layoutProbe.pause;
        ok("the pause card publishes its geometry", !!card);
        const LABELS = ["RESUME", "MUSIC", "SETTINGS", "LEADERBOARD",
                        "RESTART MATCH", "QUIT TO MENU", "QUIT (disconnects)"];
        const rows = shot.lines.filter((l) => LABELS.includes(l.s));
        ok("every pause row was found to measure", rows.length === PAUSE_ITEMS.length,
           `${rows.length} of ${PAUSE_ITEMS.length}`);
        const spill = rows.filter((l) => l.y < card.y || l.y > card.bottom);
        ok("every pause row sits inside the card", spill.length === 0,
           spill.map((l) => `${l.s}@${l.y.toFixed(0)} vs card ${card.y}..${card.bottom.toFixed(0)}`)
                .join(" | "));
        // The card itself must fit the canvas.
        ok("the pause card fits the canvas",
           card.y >= 0 && card.bottom <= H, `${card.y}..${card.bottom.toFixed(0)} vs ${H}`);
      }

      /*
        Every row the keyboard can reach must actually be painted. The drawn list
        used to be a hand-written array parallel to PAUSE_ITEMS, so inserting a
        row would have mislabelled every row beneath it.
      */
      const WANT = { resume: "RESUME", music: "MUSIC", settings: "SETTINGS",
                     board: "LEADERBOARD", restart: "RESTART MATCH",
                     quit: "QUIT TO MENU" };
      const shot = capturePaint(drawPause);
      const missing = PAUSE_ITEMS.filter((k) => !shot.strings.includes(WANT[k]));
      ok("every pause row is painted with its own label", missing.length === 0,
         missing.join(","));

      // Online, the card carries an extra warning line and must still fit.
      net.active = true; net.role = "host";
      const shotNet = capturePaint(drawPause);
      const offNet = shotNet.lines.filter((l) => l.y < 0 || l.y > H);
      ok("the online pause card fits too", offNet.length === 0,
         offNet.map((o) => `${o.s}@${o.y.toFixed(0)}`).join("|"));
      ok("the online quit row is relabelled",
         shotNet.strings.some((t) => /disconnects/.test(t)));
      net.active = false; net.role = null;
    }

    // ---- the settings screen and the pause row must agree ----------------
    {
      game.opt.music = true;
      toggleMusic();
      ok("the shared toggle turns music off", game.opt.music === false);
      toggleMusic();
      ok("the shared toggle turns it back on", game.opt.music === true);
      // The settings row must route through the same function, not its own copy.
      game.scene = SCENE.SETTINGS;
      game.settingsFrom = SCENE.PAUSE;
      game.settingsRow = SETTINGS_ITEMS.indexOf("music");
      game.opt.music = true;
      let stopped = 0;
      const realStop = musicStop;
      try {
        // eslint-disable-next-line no-func-assign
        musicStop = () => { stopped++; realStop(); };
        pressed.Enter = true;
        edgeFrame = true;
        updateSettings(DT);
        for (const k in pressed) delete pressed[k];
        edgeFrame = true;
      } finally {
        // eslint-disable-next-line no-func-assign
        musicStop = realStop;
      }
      ok("the settings row still toggles music", game.opt.music === false);
      ok("and it stops the track as well", stopped === 1, `${stopped} calls`);
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    saveOpts(game.opt);
    game.particles = [];
  }

  // 19an. A head is solid ground: you can jump off the other player.
  {
    const saved = { mode: game.mode, scene: game.scene, players: game.players,
                    cpu: [...game.cpu], ball: game.ball };
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();

    /** Drop `top` onto `bot` and settle. Returns the two players. */
    const stack = () => {
      const bot = game.players[1], top = game.players[0];
      bot.x = 500; bot.y = GROUND_Y - bot.r; bot.vx = 0; bot.vy = 0;
      bot.onGround = true;
      top.x = 500; top.y = bot.y - bot.r - top.r - 30;
      top.vx = 0; top.vy = 0; top.onGround = false;
      for (let i = 0; i < 240; i++) {
        top.update(DT, bot);
        bot.update(DT, top);
        if (i > 30 && Math.abs(top.vy) < 20 && top.y < bot.y - 10) break;
      }
      return { top, bot };
    };

    {
      const { top, bot } = stack();
      ok("a player really is stood on the other",
         top.y < bot.y - bot.r * 0.35, `${top.y.toFixed(0)} vs ${bot.y.toFixed(0)}`);
      ok("standing on a head counts as ground", top.onGround === true);

      // And it must be a real jump that gains height.
      intent[0].up = true;
      top.update(DT, bot);
      intent[0].up = false;
      ok("you can jump off the other player's head", top.vy < -200,
         `vy ${top.vy.toFixed(0)}`);
      const y0 = top.y;
      let peak = top.y;
      for (let i = 0; i < 240; i++) {
        top.update(DT, bot);
        bot.update(DT, top);
        peak = Math.min(peak, top.y);
      }
      ok("the jump off a head gains real height", y0 - peak > 60,
         `${(y0 - peak).toFixed(0)}px`);
    }

    // A player moving UPWARD into the other must NOT be handed a jump — that
    // would be a free double jump on any mid-air bump.
    {
      const bot = game.players[1], top = game.players[0];
      bot.x = 500; bot.y = GROUND_Y - bot.r; bot.vx = 0; bot.vy = 0;
      top.x = 500; top.y = bot.y - bot.r - top.r - 6;
      top.vx = 0; top.vy = -500; top.onGround = false;
      top.update(DT, bot);
      ok("a rising player gets no footing from a bump", top.onGround === false,
         `vy ${top.vy.toFixed(0)}`);
    }

    // The player UNDERNEATH must not be given ground by the one on top.
    {
      const bot = game.players[1], top = game.players[0];
      bot.x = 500; bot.y = 300; bot.vx = 0; bot.vy = 0; bot.onGround = false;
      top.x = 500; top.y = bot.y - bot.r - top.r + 2;
      top.vx = 0; top.vy = 40; top.onGround = false;
      bot.update(DT, top);
      ok("the player underneath gains no footing", bot.onGround === false);
    }

    Object.assign(game, saved);
  }

  // 19ao. The basketball never goes dead, and only the basketball behaves so.
  {
    const saved = { mode: game.mode, ball: game.ball, scene: game.scene,
                    players: game.players, cpu: [...game.cpu] };

    /** Drop a ball and report whether it is still moving after `secs`. */
    const settleTest = (md, secs) => {
      game.mode = md;
      game.cpu = [false, false];
      game.sel = [0, 3];
      startMatch();
      game.mode = md;
      const c = MODE_CFG[md];
      game.ball = { x: W / 2, y: 120, vx: 40, vy: 0,
                    r: c.ballR, mass: c.ballMass, bounces: 0 };
      let bounces = 0;
      const steps = Math.round(secs / DT);
      for (let i = 0; i < steps; i++) {
        const pvy = game.ball.vy;
        stepBall(DT);
        if (pvy > 0 && game.ball.vy < 0) bounces++;
      }
      const floor = GROUND_Y - c.ballR;
      const moving = Math.abs(game.ball.vy) > 1 ||
                     Math.abs(game.ball.y - floor) > 2;
      return { bounces, moving, vy: game.ball.vy };
    };

    {
      const r = settleTest(MODE.BASKET, 45);
      ok("a basketball is still bouncing after 45 seconds", r.moving,
         `vy ${r.vy.toFixed(1)}`);
      ok("and it keeps bouncing steadily", r.bounces >= 40, `${r.bounces} bounces`);
    }

    /*
      Every OTHER mode must still settle. A ball that never rests would make a
      soccer goalmouth scramble unplayable, so this behaviour is basketball-only.
    */
    for (const md of [MODE.SINGLE, MODE.VOLLEY, MODE.TENNIS]) {
      const r = settleTest(md, 45);
      ok(`a ${md} ball still comes to rest`, !r.moving, `vy ${r.vy.toFixed(1)}`);
    }

    // A ball already at rest on the court must pick itself back up.
    {
      game.mode = MODE.BASKET;
      game.sel = [0, 3];
      startMatch();
      game.mode = MODE.BASKET;
      const c = MODE_CFG[MODE.BASKET];
      const floor = GROUND_Y - c.ballR;
      game.ball = { x: W / 2, y: floor, vx: 0, vy: 0,
                    r: c.ballR, mass: c.ballMass, bounces: 0 };
      let peak = game.ball.y;
      for (let i = 0; i < 400; i++) { stepBall(DT); peak = Math.min(peak, game.ball.y); }
      const lift = floor - peak;
      ok("a resting basketball dribbles itself back up", lift > c.ballR * 0.8,
         `${lift.toFixed(0)}px`);
      // But not so high that the ball plays itself over the players' heads.
      ok("and not absurdly high", lift < 120, `${lift.toFixed(0)}px`);
    }

    Object.assign(game, saved);
  }

  // 19ap. A built platform appears above its BUILDER, not at a fixed height.
  {
    const saved = { mode: game.mode, scene: game.scene, players: game.players,
                    cpu: [...game.cpu], walls: game.walls, ball: game.ball };

    for (const md of [MODE.VOLLEY, MODE.TENNIS, MODE.BASKET]) {
      game.mode = md;
      game.cpu = [false, false];
      game.sel = [0, 3];
      startMatch();
      game.mode = md;
      ok(`${md} builds platforms rather than walls`, buildsPlatform() === true);

      const pl = game.players[0];
      const heights = [];
      for (const dy of [0, 90, 170]) {
        game.walls = [];
        pl.wallCharges = 5;
        pl.wallCD = 0;
        pl.x = W * 0.3;
        pl.y = GROUND_Y - pl.r - dy;
        pl.vy = 0;
        const w = buildWall(pl);
        if (!w) { heights.push(null); continue; }
        heights.push({ platY: w.y, head: pl.y - pl.r, h: w.h });
      }
      ok(`${md}: a platform is built at every height`,
         heights.every((x) => x !== null));

      if (heights.every((x) => x !== null)) {
        // Higher builder -> higher platform. This is the whole request.
        ok(`${md}: building higher puts the platform higher`,
           heights[0].platY > heights[1].platY &&
           heights[1].platY > heights[2].platY,
           heights.map((x) => x.platY.toFixed(0)).join(" > "));

        // And it lands just above the head, not at some fixed y.
        for (const x of heights) {
          const gap = x.head - (x.platY + x.h);
          ok(`${md}: the platform sits just above the head (gap ${gap.toFixed(0)}px)`,
             gap > 4 && gap < 70, `${gap.toFixed(0)}px`);
        }
      }

      // Clamped inside the arena at both extremes.
      {
        game.walls = [];
        pl.wallCharges = 5; pl.wallCD = 0;
        pl.x = W * 0.3; pl.y = 40; pl.vy = 0;    // absurdly high
        const w = buildWall(pl);
        ok(`${md}: a platform built very high stays on screen`,
           w && w.y >= 0, w ? `${w.y}` : "none");
        game.walls = [];
        pl.wallCharges = 5; pl.wallCD = 0;
        pl.y = GROUND_Y - pl.r;                  // on the floor
        const w2 = buildWall(pl);
        ok(`${md}: a platform built on the floor clears the grass`,
           w2 && w2.y + w2.h < GROUND_Y - 20,
           w2 ? `${(w2.y + w2.h).toFixed(0)} vs ${GROUND_Y}` : "none");
      }
    }

    /*
      The soccer modes build a tall WALL rather than a platform, and it follows the
      builder too: standing, it rises from the grass; jumping, it appears in the
      air alongside the player. This block used to assert the opposite — that a
      mid-air wall stayed welded to the ground — which was the behaviour being
      fixed, so the rule is inverted here rather than dropped.
    */
    for (const md of [MODE.SINGLE, MODE.TOURNAMENT]) {
      game.mode = md;
      game.sel = [0, 3];
      startMatch();
      game.mode = md;
      ok(`${md} builds a wall, not a platform`, buildsPlatform() === false);
      const pl = game.players[0];

      const raise = (dy) => {
        game.walls = [];
        pl.wallCharges = 5;
        pl.wallCD = 0;
        pl.x = W * 0.4;
        pl.y = GROUND_Y - pl.r - dy;
        pl.vy = 0;
        pl.facing = 1;
        return buildWall(pl);
      };

      // Standing: unchanged, the base sits on the grass.
      const low = raise(0);
      ok(`${md}: a wall built while standing rises from the ground`,
         low && Math.abs((low.y + low.h) - GROUND_Y) < 1,
         low ? `${(low.y + low.h).toFixed(0)} vs ${GROUND_Y}` : "none");
      ok(`${md}: a grounded wall is flagged as grounded`, low.grounded === true);

      // Airborne: the wall goes up with the player.
      const high = raise(170);
      ok(`${md}: a wall built in mid-air is raised off the ground`,
         high && high.y + high.h < GROUND_Y - 40,
         high ? `bottom ${(high.y + high.h).toFixed(0)} vs ${GROUND_Y}` : "none");
      ok(`${md}: the higher wall is above the lower one`, high.y < low.y - 100,
         `${high.y.toFixed(0)} vs ${low.y.toFixed(0)}`);
      ok(`${md}: an airborne wall is not flagged grounded`,
         high.grounded === false);

      // It must SCREEN the builder: the wall spans the player's own height.
      const head = pl.y - pl.r, feet = pl.y + pl.r;
      ok(`${md}: an airborne wall covers the player's body`,
         high.y <= head && high.y + high.h >= feet,
         `wall ${high.y.toFixed(0)}..${(high.y + high.h).toFixed(0)} vs body ${head.toFixed(0)}..${feet.toFixed(0)}`);

      // And it must be IN FRONT, on either facing.
      ok(`${md}: an airborne wall is in front when facing right`, high.x > pl.x,
         `wall ${high.x.toFixed(0)} vs player ${pl.x.toFixed(0)}`);
      {
        game.walls = [];
        pl.wallCharges = 5; pl.wallCD = 0;
        pl.x = W * 0.6; pl.y = GROUND_Y - pl.r - 170; pl.facing = -1;
        const lw = buildWall(pl);
        ok(`${md}: an airborne wall is in front when facing left`,
           lw && lw.x + lw.w < pl.x,
           lw ? `wall ends ${(lw.x + lw.w).toFixed(0)} vs player ${pl.x.toFixed(0)}` : "none");
      }

      /*
        Never built off the top of the screen. Built at the actual CEILING, where
        the player's head reaches y=0 and the wanted wall top goes NEGATIVE — an
        earlier version of this used an arbitrary height that was already inside
        the clamp, so removing the clamp altogether still passed.
      */
      {
        game.walls = [];
        pl.wallCharges = 5;
        pl.wallCD = 0;
        pl.x = W * 0.4;
        pl.y = pl.r;                 // pinned against the ceiling
        pl.vy = 0;
        pl.facing = 1;
        const sky = buildWall(pl);
        ok(`${md}: a wall built at the ceiling stays on screen`,
           sky && sky.y >= 0, sky ? `${sky.y.toFixed(0)}` : "none");
        ok(`${md}: and its whole body is visible`,
           sky && sky.y + sky.h <= H, sky ? `${(sky.y + sky.h).toFixed(0)} vs ${H}` : "none");
      }
    }

    Object.assign(game, saved);
  }

  // 19aq. Multiplayer smoothness, wall sync, and the audio-node leak.
  {
    const saved = { mode: game.mode, scene: game.scene, players: game.players,
                    ball: game.ball, walls: game.walls, cpu: [...game.cpu] };
    const savedNet = { ...net };

    // ---- walls must travel to the guest ----------------------------------
    {
      net.active = false; net.role = null;
      game.mode = MODE.SINGLE;
      game.cpu = [false, false];
      game.sel = [0, 3];
      startMatch();

      const pl = game.players[0];
      game.walls = [];
      pl.wallCharges = 5; pl.wallCD = 0;
      pl.x = W * 0.35; pl.y = GROUND_Y - pl.r; pl.facing = 1;
      const built = buildWall(pl);
      ok("a wall exists to send", !!built);

      const snap = netSnapshot();
      ok("the snapshot carries walls", Array.isArray(snap.wl) && snap.wl.length === 1,
         JSON.stringify(snap.wl));

      // Apply it as a guest and confirm the wall arrives intact.
      net.active = true; net.role = "guest"; net.localSeat = 1; net.remoteSeat = 0;
      game.walls = [];
      netApplySnapshot(snap);
      ok("the guest receives the wall", game.walls.length === 1,
         `${game.walls.length}`);
      if (game.walls.length === 1) {
        const w = game.walls[0];
        ok("the guest's wall has the host's geometry",
           Math.abs(w.x - built.x) <= 1 && Math.abs(w.y - built.y) <= 1 &&
           w.w === built.w && w.h === built.h,
           `${w.x},${w.y} ${w.w}x${w.h} vs ${built.x},${built.y} ${built.w}x${built.h}`);
        ok("the guest knows whose wall it is", w.owner === built.owner);
        ok("the guest knows if it is a platform", w.platform === built.platform);
        ok("the guest knows if it is grounded", w.grounded === built.grounded);
        // It must be renderable, or it is invisible on the client.
        drawProbe.walls = 0;
        drawWalls();
        ok("the guest actually paints the wall", drawProbe.walls === 1,
           `${drawProbe.walls}`);
      }

      // A host that sends no wall field must not wipe the guest's walls.
      {
        const older = netSnapshot();
        delete older.wl;
        const before = game.walls.length;
        netApplySnapshot(older);
        ok("a snapshot with no wall field leaves walls alone",
           game.walls.length === before, `${before} -> ${game.walls.length}`);
      }
      game.walls = [];
    }

    // ---- the guest interpolates, so it moves every frame -----------------
    {
      net.active = true; net.role = "guest"; net.localSeat = 1; net.remoteSeat = 0;
      game.scene = SCENE.PLAY;

      const mk = (bx, by, at) => {
        const snap = netSnapshot();
        snap.b = [bx, by, BALL_R];
        snap.at = at;
        return snap;
      };
      const gap = 1 / NET_SNAP_HZ;
      /*
        A CONTINUOUS stream on a straight line, fed as the clock advances — the
        way a real host sends. A fixed handful of snapshots is not enough: the
        guest renders a delay behind, so a short buffer runs dry mid-test and the
        starved tail looks exactly like the stutter being tested for.
      */
      const SPEED = 1800;                  // px per second along the line
      let sent = 0, world = 0;
      net.snapBuf = [];
      net.renderT = 0;
      game.ball.vx = 0; game.ball.vy = 0;
      // Prime the buffer so the first frame already has data on both sides.
      for (let k = 0; k < 4; k++) {
        net.snapBuf.push(mk(200 + SPEED * world, 300, world));
        world += gap;
        sent++;
      }

      const xs = [];
      let localT = 0;
      for (let i = 0; i < 40; i++) {
        step(DT);
        localT += DT;
        // Keep the stream running: send whenever the clock passes the next slot.
        while (world <= localT + gap * 2) {
          net.snapBuf.push(mk(200 + SPEED * world, 300, world));
          while (net.snapBuf.length > NET_SNAP_BUF) net.snapBuf.shift();
          world += gap;
          sent++;
        }
        xs.push(game.ball.x);
      }
      ok("the test fed a continuous stream", sent >= 10, `${sent} snapshots`);

      // Every frame must move: that is the whole fix.
      let still = 0;
      for (let i = 1; i < xs.length; i++) if (Math.abs(xs[i] - xs[i - 1]) < 1e-9) still++;
      ok("the guest's world moves on every frame", still === 0,
         `${still} of ${xs.length - 1} frames frozen`);

      // Monotonic along the line, never past the newest snapshot.
      let backwards = 0;
      for (let i = 1; i < xs.length; i++) if (xs[i] < xs[i - 1] - 1e-6) backwards++;
      ok("and never jerks backwards", backwards === 0, `${backwards} reversals`);
      ok("and never overshoots the newest snapshot",
         xs.every((x) => x <= 200 + SPEED * world + 1),
         `max ${Math.max(...xs).toFixed(1)}`);

      /*
        Per-frame steps must be EVEN. This is what stutter actually is: the old
        code wrote each snapshot straight in, so the guest sat still then jumped a
        whole interval's travel at once.
      */
      const steps = [];
      for (let i = 1; i < xs.length; i++) steps.push(xs[i] - xs[i - 1]);
      const mean = steps.reduce((a, b) => a + b, 0) / steps.length;
      const worst = Math.max(...steps.map((d) => Math.abs(d - mean)));
      ok("the guest moves in even steps, not bursts", worst < mean * 1.5 + 0.5,
         `mean ${mean.toFixed(2)}px, worst deviation ${worst.toFixed(2)}px`);

      // A teleport must be applied as a cut, not smeared across the window.
      {
        net.snapBuf = [mk(200, 300, 0), mk(900, 300, gap)];
        net.renderT = 0;
        for (let i = 0; i < 4; i++) step(DT);
        const onLine = game.ball.x > 250 && game.ball.x < 850;
        ok("a teleport is cut, never interpolated", !onLine,
           `ball at ${game.ball.x.toFixed(0)}`);
      }
      net.snapBuf = [];
      net.renderT = 0;
    }

    // ---- the music must not leak audio nodes -----------------------------
    {
      /*
        Every note used to leave its oscillator and gain connected to the master
        for the life of the page — roughly 470 dead nodes a minute on a graph the
        audio thread walks constantly, so the whole page grew steadily more
        stuttery and only a reload cleared it. Notes must release themselves.
      */
      ok("a finished note releases its nodes",
         /osc\.onended/.test(String(musicNote)), "no onended handler on a note");
      ok("both nodes are disconnected, not just the oscillator",
         /g\.disconnect\(\)/.test(String(musicNote)));

      // And the release must be wired to note END, not to scheduling time.
      const body = String(musicNote);
      ok("the release is tied to the note ending",
         body.indexOf("onended") > body.indexOf("osc.stop"),
         "release is scheduled before the note stops");
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19ar. The guest must inhabit the HOST's world, not one of its own.
  {
    const saved = { mode: game.mode, scene: game.scene, players: game.players,
                    ball: game.ball, mapId: game.mapId, cpu: [...game.cpu],
                    chaos: game.chaos, rules: { ...game.rules } };
    const savedNet = { ...net };
    const savedTun = getTunablesSnapshot ? getTunablesSnapshot() : null;

    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();

    /*
      THE ARENA. The map was never sent at all, so a guest drew and collided
      against different platforms from the ones the host was simulating — the
      reported map desync. It rides in the snapshot rather than only in `cfg`, so
      a guest that joins late or drops a packet is corrected on the next frame
      instead of playing a whole match in the wrong arena.
    */
    {
      game.mapId = "towers";
      const snap = netSnapshot();
      ok("the snapshot names the arena", snap.mp === "towers", `${snap.mp}`);
      ok("the config names the arena too", (() => {
        const sent = [];
        const real = net.chan;
        net.active = true; net.role = "host";
        net.chan = { readyState: "open", send: (d) => sent.push(JSON.parse(d)) };
        netSendConfig();
        net.chan = real;
        return sent.some((m) => m.t === "cfg" && m.mp === "towers");
      })());

      // A guest adopts it.
      net.active = true; net.role = "guest";
      net.localSeat = 1; net.remoteSeat = 0;
      game.mapId = "classic";
      netApplySnapshot(snap);
      ok("a guest adopts the host's arena", game.mapId === "towers", game.mapId);
      ok("and therefore the same platforms",
         activePlatforms().length === mapById("towers").platforms.length,
         `${activePlatforms().length}`);
    }

    /*
      GOAL GEOMETRY. Chaos re-rolls gravity and the goal motion on the host only,
      and the guest derived all of it locally. Worse, the rates were rounded to
      one decimal — a goal speed of 0.55 arrived as 0.6, a 9% error that compounded
      into ~20px of disagreement about where the goal mouth was. Enough for a shot
      to score on one screen and miss on the other.
    */
    {
      net.active = true; net.role = "host";
      goalSpeedL = 0.55; goalSpeedR = 0.62; goalTravel = 67.25; gravity = 1487;
      const snap = netSnapshot();
      ok("goal rates survive the wire intact",
         Math.abs(snap.gl - 0.55) < 1e-3 && Math.abs(snap.gr - 0.62) < 1e-3,
         `${snap.gl}, ${snap.gr}`);
      ok("goal travel survives the wire",
         Math.abs(snap.gt - 67.25) < 0.01, `${snap.gt}`);
      ok("gravity is sent", Math.abs(snap.gv - 1487) <= 1, `${snap.gv}`);

      // A guest with different values adopts the host's.
      net.role = "guest";
      goalSpeedL = 0.2; goalSpeedR = 0.2; goalTravel = 10; gravity = 900;
      netApplySnapshot(snap);
      ok("a guest adopts the host's goal rates",
         Math.abs(goalSpeedL - 0.55) < 1e-3 && Math.abs(goalSpeedR - 0.62) < 1e-3,
         `${goalSpeedL}, ${goalSpeedR}`);
      ok("a guest adopts the host's gravity", Math.abs(gravity - 1487) <= 1,
         `${gravity}`);
      ok("a guest adopts the host's goal travel",
         Math.abs(goalTravel - 67.25) < 0.01, `${goalTravel}`);
    }

    /*
      A snapshot must never poison the guest with a value it cannot recover from.
      `typeof NaN` is "number", so a type-only guard let NaN through and it STUCK:
      goalTop() returned NaN and the goal vanished for the rest of the match.
    */
    {
      net.active = true; net.role = "guest";
      goalSpeedL = 0.5; goalTravel = 70; gravity = 1500; goalScale = 1;
      const good = { travel: goalTravel, spd: goalSpeedL, grav: gravity };
      const base = netSnapshot();
      const poison = { ...base, gv: NaN, gt: NaN, gl: NaN, gr: NaN,
                       gp: NaN, gs: NaN };
      let threw = null;
      try { netApplySnapshot(poison); } catch (e) { threw = e.message; }
      ok("a NaN-laden snapshot does not throw", !threw, threw || "");
      ok("and NaN never reaches the goal tunables",
         Number.isFinite(goalTravel) && Number.isFinite(goalSpeedL) &&
         Number.isFinite(gravity) && Number.isFinite(goalScale),
         `${goalTravel},${goalSpeedL},${gravity},${goalScale}`);
      ok("the last good values are kept",
         goalTravel === good.travel && goalSpeedL === good.spd &&
         gravity === good.grav,
         `${goalTravel},${goalSpeedL},${gravity}`);
      ok("goalTop stays a real number", Number.isFinite(goalTop(0)),
         `${goalTop(0)}`);

      // Absurd-but-finite values are refused just as firmly.
      netApplySnapshot({ ...base, gv: 1e12, gt: -500, gl: 99, gs: 0 });
      ok("out-of-range geometry is refused",
         gravity === good.grav && goalTravel === good.travel &&
         goalSpeedL === good.spd && goalScale === 1,
         `${gravity},${goalTravel},${goalSpeedL},${goalScale}`);

      // A hostile map id must not stick either.
      netApplySnapshot({ ...base, mp: "../../etc/passwd" });
      ok("a bogus arena id is refused", !!mapById(game.mapId), game.mapId);
    }

    /*
      A valid snapshot must actually APPLY. A reference used before its
      declaration threw on every single snapshot while the whole suite stayed
      green, because nothing asserted that applying one succeeds.
    */
    {
      net.active = true; net.role = "host";
      game.mapId = "terraces";
      const snap = netSnapshot();
      net.role = "guest";
      game.mapId = "classic";
      let threw = null;
      try { netApplySnapshot(snap); } catch (e) { threw = e.message; }
      ok("applying a normal snapshot never throws", !threw, threw || "");
      ok("and it took effect", game.mapId === "terraces", game.mapId);
    }

    // Spawn rates are the host's to set, so a guest must adopt them.
    {
      net.active = true; net.role = "host";
      const key = Object.keys(game.rules)[0];
      const was = game.rules[key];
      const sent = [];
      const real = net.chan;
      net.chan = { readyState: "open", send: (d) => sent.push(JSON.parse(d)) };
      netSendConfig();
      net.chan = real;
      const cfg = sent.find((m) => m.t === "cfg");
      ok("the config carries the world rules", !!(cfg && cfg.rl), JSON.stringify(cfg && cfg.rl));

      net.role = "guest";
      game.rules[key] = typeof was === "boolean" ? !was : was + 1;
      netHandle(cfg);
      ok("a guest adopts the host's rules", game.rules[key] === was,
         `${game.rules[key]} vs ${was}`);

      // But only keys it recognises, so a peer cannot inject tunables.
      netHandle({ ...cfg, rl: { ...cfg.rl, evilKey: 999 } });
      ok("unknown rule keys are ignored", game.rules.evilKey === undefined);
    }

    if (savedTun) {
      gravity = savedTun.gravity ?? gravity;
      goalTravel = savedTun.goalTravel ?? goalTravel;
      goalSpeedL = savedTun.goalSpeedL ?? goalSpeedL;
      goalSpeedR = savedTun.goalSpeedR ?? goalSpeedR;
      goalScale = savedTun.goalScale ?? goalScale;
    }
    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.rules = saved.rules;
    game.particles = [];
  }

  // 19as. Lobby reliability: joining, identity, spectating and bracket size.
  {
    const saved = { mode: game.mode, scene: game.scene, players: game.players,
                    ball: game.ball, entrants: game.entrants, cpu: [...game.cpu],
                    entrantCount: game.entrantCount, seats: [...game.seats] };
    const savedNet = { ...net };

    /*
      A JOINING PEER MUST NOT HIJACK THE HOST'S SCREEN. `net.state` is this
      machine's own connection state; a peer's channel opening used to set it to
      "live", which tore the host out of its lobby the instant anybody joined —
      the join code and player list vanished, no more players could be added, and
      START ran a 1v1 instead of the tournament.
    */
    {
      netReset();
      game.scene = SCENE.ONLINE;
      net.active = true; net.role = "host"; net.state = "lobby";
      net.offerText = "X".repeat(120);
      for (let i = 1; i <= 3; i++) {
        const peer = { id: i, entrantId: i, name: "", chan: null, pc: null,
                       lastRecv: 0, state: "new" };
        net.peers.push(peer);
        const chan = { readyState: "open", onopen: null, onclose: null,
                       onerror: null, onmessage: null, send: () => {}, close: () => {} };
        netAttachChannel(chan, peer);
        chan.onopen();
        ok(`the host keeps its lobby with ${i} joined`, net.state === "lobby",
           net.state);
        ok(`joiner ${i} is marked live on its own`, peer.state === "live",
           String(peer.state));
      }
      const shot = capturePaint(drawOnline);
      ok("the lobby is still on screen after joins",
         shot.strings.some((t) => /TOURNAMENT LOBBY/.test(t)));
      ok("and it is not showing the two-player card",
         !shot.strings.some((t) => /✓ CONNECTED/.test(t)));

      // One peer erroring must not blank the whole lobby either.
      const p0 = net.peers[0];
      const chan2 = { readyState: "open", onopen: null, onclose: null,
                      onerror: null, onmessage: null, send: () => {}, close: () => {} };
      netAttachChannel(chan2, p0);
      chan2.onerror();
      ok("one peer's error does not break the lobby", !net.error, net.error);
      netReset();
    }

    /*
      EVERY JOINER MUST BE TOLD WHICH ENTRANT IT IS. The bracket is a broadcast so
      it cannot carry a per-recipient answer; without a private "me" packet a
      guest kept the default of 0 — the HOST's entrant — published input for a
      seat it did not own, and was timed out and replaced by a CPU.
    */
    {
      netReset();
      net.active = true; net.role = "host";
      const sent = [];
      const peer = { id: 1, entrantId: 2, name: "B",
                     chan: { readyState: "open", send: (d) => sent.push(JSON.parse(d)) },
                     pc: null, lastRecv: 0 };
      net.peers.push(peer);
      netSendBracket();
      ok("the host tells each peer its own entrant",
         sent.some((m) => m.t === "me" && m.e === 2), JSON.stringify(sent));

      // The guest adopts it and re-seats.
      net.peers = [];
      net.role = "guest";
      net.myEntrant = 0;
      net.identified = false;
      game.mode = MODE.TOURNAMENT;
      game.entrants = [
        { id: 0, name: "A", owner: "host", alive: true, teamIdx: 0, look: null },
        { id: 1, name: "B", owner: "guest", alive: true, teamIdx: 1, look: null },
      ];
      game.seats = [1, 0];               // the guest's entrant sits at seat 0
      netHandle({ t: "me", e: 1 });
      ok("a guest learns which entrant it plays", net.myEntrant === 1);
      ok("and it is flagged as identified", net.identified === true);
      ok("and it re-seats onto the right seat", net.localSeat === 0,
         `${net.localSeat}`);

      // A nonsense identity is refused rather than indexing off the bracket.
      netHandle({ t: "me", e: 999 });
      ok("an out-of-range identity is refused", net.myEntrant === 1,
         `${net.myEntrant}`);
      netHandle({ t: "me", e: "two" });
      ok("a non-numeric identity is refused", net.myEntrant === 1);
      netReset();
    }

    /*
      A SPECTATOR MUST STILL SPEAK. Sending nothing while watching somebody else's
      tie meant the host heard six seconds of silence and dropped a player who was
      sitting there happily — the reported mid-tournament disconnect.
    */
    {
      netReset();
      net.active = true; net.role = "guest";
      const sent = [];
      net.chan = { readyState: "open", send: (d) => sent.push(JSON.parse(d)) };
      net.spectating = true;
      net.localSeat = -1;
      for (let i = 0; i < Math.ceil(1 / DT); i++) netPump();   // one second
      ok("a spectator sends a heartbeat", sent.length > 0, `${sent.length}`);
      ok("and it is only a heartbeat, never input",
         sent.every((m) => m.t === "ka"),
         sent.map((m) => m.t).join(","));
      ok("the heartbeat rate is modest", sent.length <= NET_BEAT_HZ + 1,
         `${sent.length} in a second`);
      ok("a heartbeat carries no seat", sent.every((m) => m.b === undefined));

      // It must keep the connection alive for longer than the timeout.
      net.active = true; net.role = "host";
      const peer = { id: 1, entrantId: 1, name: "B",
                     chan: { readyState: "open", send: () => {} },
                     pc: null, lastRecv: 0 };
      net.peers = [peer];
      for (let i = 0; i < Math.ceil((NET_TIMEOUT + 2) / DT); i++) {
        netPump();
        // The channel handler resets this on any inbound frame, heartbeat too.
        if (i % Math.round(1 / (NET_BEAT_HZ * DT)) === 0) peer.lastRecv = 0;
      }
      ok("a heartbeating peer is never dropped", net.peers.length === 1,
         `${net.peers.length}`);
      // And the host still accepts the message without mistaking it for junk.
      let threw = null;
      try { netHandle({ t: "ka" }, peer); } catch (e) { threw = e.message; }
      ok("a heartbeat is handled cleanly", !threw, threw || "");
      netReset();
    }

    /*
      BRACKET SIZE. Two humans are enough to start; CPUs fill the rest, and the
      size chosen on the setup screen is honoured when it seats everyone present.
    */
    {
      netReset();
      net.active = true; net.role = "host"; net.myEntrant = 0;
      game.names = ["HOST", "X"];
      game.goalsToWin = 3;
      game.timeIdx = 0;
      const build = (joiners, chosen) => {
        net.peers = [];
        for (let i = 1; i <= joiners; i++) {
          net.peers.push({ id: i, entrantId: i, name: `P${i + 1}`,
                           chan: { readyState: "open", send: () => {} },
                           pc: null, lastRecv: 0 });
        }
        game.mode = MODE.TOURNAMENT;
        game.entrantCount = chosen;
        startLobbyTournament();
        return {
          n: game.entrantCount,
          humans: game.entrants.filter((e) => e.owner !== "cpu").length,
          cpus: game.entrants.filter((e) => e.owner === "cpu").length,
        };
      };

      const two = build(1, 4);
      ok("two humans can start a tournament", two.n === 4, `${two.n}`);
      ok("and the rest of the bracket is CPUs", two.cpus === 2 && two.humans === 2,
         `${two.humans} human / ${two.cpus} CPU`);

      const big = build(1, 8);
      ok("the chosen bracket size is honoured", big.n === 8, `${big.n}`);
      ok("with CPUs filling every empty slot", big.cpus === 6, `${big.cpus}`);

      const full = build(7, 8);
      ok("a full lobby needs no CPUs", full.cpus === 0 && full.humans === 8,
         `${full.humans} human / ${full.cpus} CPU`);

      // The bracket can never be smaller than the turnout.
      const over = build(7, 2);
      ok("the bracket never seats fewer than the people present", over.n === 8,
         `${over.n} for 8 humans`);
      ok("nor fewer than the minimum", build(0, 1).n >= TOURN_MIN);
      netReset();
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.particles = [];
  }

  /* ---------------------------------------------------------------------
     3D ARENA MODE

     The projector is a pure function, so it is tested the way the 2D physics
     kernel is: by driving it directly and checking the numbers, not by
     calling a draw routine and hoping it did not throw.
     ------------------------------------------------------------------- */

  // 24a. Projection: the core perspective contract.
  {
    const view = makeView(0, 0, W, H);
    // Camera at the origin looking down +z (yaw 0, pitch 0).
    const cam = { pos: v3(0, 0, 0), yaw: 0, pitch: 0 };
    const basis = camBasis(cam);

    const ahead = project(v3(0, 0, 300), cam, view, basis);
    ok("a point straight ahead lands at viewport centre",
       ahead && near(ahead.x, view.cx, 1e-9) && near(ahead.y, view.cy, 1e-9),
       ahead ? `${ahead.x},${ahead.y}` : "null");

    ok("a point behind the camera is refused",
       project(v3(0, 0, -300), cam, view, basis) === null);
    ok("a point at the camera itself is refused",
       project(v3(0, 0, 0), cam, view, basis) === null);
    ok("a point just inside the near plane is refused",
       project(v3(0, 0, NEAR - 0.01), cam, view, basis) === null);
    ok("a point just beyond the near plane is accepted",
       project(v3(0, 0, NEAR + 0.01), cam, view, basis) !== null);

    // Perspective: twice as far is half the size.
    const nearP = project(v3(50, 0, 200), cam, view, basis);
    const farP = project(v3(50, 0, 400), cam, view, basis);
    ok("twice the distance is half the scale",
       near(nearP.s, farP.s * 2, 1e-9), `${nearP.s} vs ${farP.s}`);
    ok("and twice as close is twice as far from centre",
       near(nearP.x - view.cx, (farP.x - view.cx) * 2, 1e-9));

    // World y is UP, canvas y is DOWN: a point above the axis draws higher.
    const above = project(v3(0, 80, 300), cam, view, basis);
    ok("a point above the camera draws above centre", above.y < view.cy,
       `${above.y} vs ${view.cy}`);

    // A point to the world +x draws to screen right when looking down +z.
    const rightP = project(v3(80, 0, 300), cam, view, basis);
    ok("a point to the right draws right of centre", rightP.x > view.cx);
  }

  // 24b. Rotation: yaw and pitch move the image the way a player expects.
  {
    const view = makeView(0, 0, W, H);
    const target = v3(0, 0, 300);

    // Yawing right should slide a fixed point to the LEFT of the screen.
    const straight = { pos: v3(0, 0, 0), yaw: 0, pitch: 0 };
    const turned = { pos: v3(0, 0, 0), yaw: 0.3, pitch: 0 };
    const a = project(target, straight, view, camBasis(straight));
    const b = project(target, turned, view, camBasis(turned));
    ok("yawing right slides the world left", b.x < a.x, `${a.x} -> ${b.x}`);

    // Pitching up should slide a fixed point DOWN the screen.
    const up = { pos: v3(0, 0, 0), yaw: 0, pitch: 0.3 };
    const c = project(target, up, view, camBasis(up));
    ok("pitching up slides the world down", c.y > a.y, `${a.y} -> ${c.y}`);

    // A full sweep must never produce NaN or lose the horizon.
    let bad = null;
    for (let i = 0; i < 360; i += 3) {
      const cam = { pos: v3(0, 40, 0), yaw: (i * Math.PI) / 180, pitch: 0 };
      const bs = camBasis(cam);
      if (Math.abs(v3len(bs.fwd) - 1) > 1e-9) { bad = `fwd not unit at ${i}°`; break; }
      if (Math.abs(v3len(bs.right) - 1) > 1e-9) { bad = `right not unit at ${i}°`; break; }
      if (Math.abs(v3dot(bs.fwd, bs.right)) > 1e-9) { bad = `not orthogonal at ${i}°`; break; }
      if (Math.abs(bs.right.y) > 1e-9) { bad = `horizon rolled at ${i}°`; break; }
      const p = project(v3(0, 0, 300), cam, view, bs);
      if (p && (!isFinite(p.x) || !isFinite(p.y) || !isFinite(p.s))) {
        bad = `non-finite at ${i}°`; break;
      }
    }
    ok("a full yaw sweep keeps an orthonormal, level basis", !bad, bad || "");

    // Pitch too: the basis must stay orthonormal all the way to the clamp.
    let badP = null;
    for (let p = -PITCH_MAX; p <= PITCH_MAX; p += 0.08) {
      const cam = { pos: v3(0, 40, 0), yaw: 0.7, pitch: p };
      const bs = camBasis(cam);
      if (Math.abs(v3len(bs.up) - 1) > 1e-9) { badP = `up not unit at ${p.toFixed(2)}`; break; }
      if (Math.abs(v3dot(bs.up, bs.fwd)) > 1e-9) { badP = `up·fwd at ${p.toFixed(2)}`; break; }
      if (Math.abs(bs.right.y) > 1e-9) { badP = `horizon rolled at ${p.toFixed(2)}`; break; }
    }
    ok("pitching keeps the basis orthonormal and the horizon level", !badP, badP || "");
  }

  // 24c. Vector helpers, including the degenerate cases.
  {
    ok("v3 arithmetic is componentwise",
       (() => { const r = v3add(v3(1, 2, 3), v3(10, 20, 30));
                return r.x === 11 && r.y === 22 && r.z === 33; })());
    ok("v3sub is componentwise",
       (() => { const r = v3sub(v3(10, 20, 30), v3(1, 2, 3));
                return r.x === 9 && r.y === 18 && r.z === 27; })());
    ok("v3dot matches the definition", v3dot(v3(1, 2, 3), v3(4, 5, 6)) === 32);
    ok("v3len is the euclidean norm", near(v3len(v3(3, 4, 0)), 5, 1e-12));
    ok("v3norm returns a unit vector", near(v3len(v3norm(v3(3, 4, 5))), 1, 1e-12));
    // The degenerate case: a zero vector must not become NaN. Two fighters at
    // exactly the same spot would otherwise poison every later calculation.
    ok("v3norm of a zero vector is zero, not NaN",
       (() => { const r = v3norm(v3(0, 0, 0));
                return r.x === 0 && r.y === 0 && r.z === 0; })());
    ok("v3cross is perpendicular to both inputs",
       (() => { const a = v3(1, 2, 3), b = v3(-4, 5, 6), c = v3cross(a, b);
                return near(v3dot(c, a), 0, 1e-9) && near(v3dot(c, b), 0, 1e-9); })());
  }

  // 24d. Viewports: split-screen must not secretly change the lens.
  {
    const full = makeView(0, 0, W, H);
    const top = makeView(0, 0, W, H / 2);
    ok("a viewport centres on itself",
       full.cx === W / 2 && full.cy === H / 2);
    ok("a half-height viewport centres on its own half",
       top.cx === W / 2 && top.cy === H / 4);
    /*
      focal scales with height, so both views show the same VERTICAL angle.
      Were focal fixed instead, the split-screen halves would appear zoomed in
      relative to the full view — the bug this assertion exists to prevent.
    */
    ok("focal length scales with viewport height",
       near(full.focal, top.focal * 2, 1e-9), `${full.focal} vs ${top.focal}`);
  }

  // 24e. The quad renderer: sorting, culling and shading.
  {
    const view = makeView(0, 0, W, H);
    const cam = { pos: v3(0, 0, 0), yaw: 0, pitch: 0 };
    const basis = camBasis(cam);

    // Three two-sided quads at known depths, pushed in the WRONG order.
    const quadAt = (z) => [v3(-40, -40, z), v3(-40, 40, z), v3(40, 40, z), v3(40, -40, z)];
    {
      const b = faceBatch();
      b.push(quadAt(200), "#ff0000", { tag: "near", twoSided: true });
      b.push(quadAt(800), "#00ff00", { tag: "far", twoSided: true });
      b.push(quadAt(400), "#0000ff", { tag: "mid", twoSided: true });
      const order = b.order(cam, view, basis);
      ok("faces paint far to near",
         order.map((f) => f.tag).join(",") === "far,mid,near",
         order.map((f) => f.tag).join(","));
      // Strictly descending depth, so nothing relies on a stable sort.
      let desc = true;
      for (let i = 1; i < order.length; i++) if (order[i].depth > order[i - 1].depth) desc = false;
      ok("and the sort is strictly descending in depth", desc);
    }

    // A face wholly behind the camera is dropped, not smeared.
    {
      const b = faceBatch();
      b.push(quadAt(-300), "#ff0000", { tag: "behind", twoSided: true });
      ok("a face behind the camera is dropped", b.order(cam, view, basis).length === 0);
    }
    // A face STRADDLING the near plane is dropped whole: one bad corner is
    // enough, because a partial projection is what smears across the screen.
    {
      const b = faceBatch();
      b.push([v3(-40, -40, -50), v3(-40, 40, -50), v3(40, 40, 300), v3(40, -40, 300)],
             "#ff0000", { tag: "straddle", twoSided: true });
      ok("a face straddling the near plane is dropped whole",
         b.order(cam, view, basis).length === 0);
    }

    // Back-face culling: a box seen from outside shows at most three sides.
    {
      const b = faceBatch();
      boxFaces(b, 0, 0, 400, 50, 50, 50, "#888888", "box");
      ok("a box pushes six faces", b.length === 6, `${b.length}`);
      const vis = b.order(cam, view, basis);
      ok("but at most three of them are visible at once",
         vis.length > 0 && vis.length <= 3, `${vis.length} visible`);
    }
    // Facing a box head-on, the near side must be the LAST thing painted.
    {
      const b = faceBatch();
      boxFaces(b, 0, 0, 400, 50, 50, 50, "#888888", "box");
      const vis = b.order(cam, view, basis);
      ok("the nearest visible face of a box paints last",
         vis.length >= 1 && vis[vis.length - 1].depth <= 355, `${vis[vis.length - 1].depth}`);
    }

    // Shading: a face square to the light is brighter than one facing away.
    {
      const lit = shadeFace("#ffffff", LIGHT_DIR);
      const away = shadeFace("#ffffff", v3scale(LIGHT_DIR, -1));
      const chan = (s) => Number(s.match(/\d+/)[0]);
      ok("a face toward the light is brighter", chan(lit) > chan(away),
         `${lit} vs ${away}`);
      ok("a face fully lit is not clipped", chan(lit) === 255, lit);
      ok("a face facing away keeps the ambient floor",
         near(chan(away), Math.round(255 * AMBIENT), 1), away);
      ok("shading never leaves the byte range",
         (() => {
           for (let i = 0; i < 64; i++) {
             const a = (i / 64) * Math.PI * 2;
             const c = shadeFace("#3a7bd5", v3norm(v3(Math.cos(a), Math.sin(a), 0.3)));
             const nums = c.match(/\d+/g).map(Number);
             if (nums.some((v) => v < 0 || v > 255 || !isFinite(v))) return false;
           }
           return true;
         })());
      ok("hexRGB parses a six-digit colour",
         hexRGB("#3a7bd5").join(",") === "58,123,213", hexRGB("#3a7bd5").join(","));
    }

    // Winding: the same corners reversed must flip the cull decision.
    {
      const fwdWound = [v3(-40, -40, 300), v3(-40, 40, 300), v3(40, 40, 300), v3(40, -40, 300)]
        .map((p) => project(p, cam, view, basis));
      const revWound = [...fwdWound].reverse();
      ok("winding order decides the cull, and reversing it flips the answer",
         isBackFace(fwdWound) !== isBackFace(revWound));
    }

    /*
      EVERY box face must be wound so it is visible from outside and culled from
      inside. Checked one face at a time, with the camera placed out along that
      face's own normal: a single face wound backwards is invisible from outside
      and leaves a hole straight through the geometry, which is very hard to
      diagnose by eye and trivial to catch here. Four of the six were wrong when
      this test was written.
    */
    {
      const normals = [v3(0, 1, 0), v3(0, -1, 0), v3(0, 0, -1),
                       v3(0, 0, 1), v3(-1, 0, 0), v3(1, 0, 0)];
      const collected = [];
      boxFaces({ push: (pts, hex, opts) => collected.push({ pts, opts }) },
               0, 0, 0, 50, 50, 50, "#888888", "probe");

      let outFail = null, inFail = null;
      collected.forEach((f, i) => {
        const n = normals[i];
        // A camera 400 out along the normal, aimed back at the box centre.
        const eye = v3scale(n, 400);
        const yaw = Math.atan2(-eye.x, -eye.z);
        const pitch = Math.atan2(-eye.y, Math.hypot(eye.x, eye.z));
        const oCam = { pos: eye, yaw, pitch };
        const oScr = f.pts.map((p) => project(p, oCam, view, camBasis(oCam)));
        if (oScr.some((s) => !s) || isBackFace(oScr)) {
          outFail = outFail || `face ${i} is not visible from outside`;
        }
        // The declared normal must match the winding, or shading lies about
        // which way the surface faces even when the cull is right.
        if (Math.abs(v3len(f.opts.normal) - 1) > 1e-9) {
          inFail = inFail || `face ${i} normal is not a unit vector`;
        }
        if (v3dot(f.opts.normal, n) < 0.999) {
          inFail = inFail || `face ${i} normal disagrees with its position`;
        }
      });
      ok("every box face is visible from outside the box", !outFail, outFail || "");
      ok("every box face declares a matching unit normal", !inFail, inFail || "");
    }
  }

  // 24f. The new mode must satisfy every contract MODE_ORDER implies.
  {
    const savedMode = game.mode;
    const savedCpu = [...game.cpu];

    ok("the 3D arena is a selectable mode", MODE_ORDER.includes(MODE.ARENA3D));
    ok("it has a scene of its own", SCENE.ARENA3D === "arena3d");
    ok("it is labelled on the menu", MODE_LABEL[MODE.ARENA3D] === "3D ARENA");
    ok("it explains itself on the menu",
       typeof MODE_HINT[MODE.ARENA3D] === "string" && MODE_HINT[MODE.ARENA3D].length > 8);

    // The config contract the MODE_ORDER loops assert for every mode.
    const c = MODE_CFG[MODE.ARENA3D];
    ok("it declares a complete mode config",
       !!c && typeof c.ballR === "number" && typeof c.ballMass === "number" &&
       typeof c.grav === "number" && typeof c.drag === "number" &&
       typeof c.rest === "number");
    ok("it has no net, no goals and no half-confinement",
       c.net === 0 && c.goals === false && c.confine === false);

    // The theme contract, plus the fields the 3D renderer actually reads.
    const t = ARENA[MODE.ARENA3D];
    ok("it declares a complete arena theme",
       !!t && Array.isArray(t.sky) && t.sky.length === 2 && !!t.ground &&
       !!t.line && !!t.surface);
    ok("and its theme has no crowd stand, being indoors", t.crowd === null);

    // Menu rows: the three that make no sense here must be gone.
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    const rows3d = menuRows();
    ok("the 3D arena hides the 2D map picker", !rows3d.includes("map"));
    ok("the 3D arena hides chaos mode", !rows3d.includes("chaos"));
    ok("the 3D arena hides online play, which cannot carry it",
       !rows3d.includes("online"));
    ok("but it still offers an opponent and a CPU level",
       rows3d.includes("opponent") && rows3d.includes("cpulevel"));
    ok("and it still offers frags-to-win and a time limit",
       rows3d.includes("goals") && rows3d.includes("time"));

    // Panel contiguity: the same invariant the existing loops check per mode.
    {
      let switches = 0, prev = null;
      for (const r of rows3d) {
        const g = MENU_GROUP[r];
        if (prev && g !== prev) switches++;
        prev = g;
      }
      const groups = new Set(rows3d.map((r) => MENU_GROUP[r]));
      ok("its menu cursor never leaves and re-enters a panel",
         switches === groups.size - 1,
         `${switches} switches across ${groups.size} panels`);
    }

    ok("the 3D arena can be paused like any live match",
       PAUSABLE.has(SCENE.ARENA3D));
    ok("and it plays the match music, not the menu loop",
       (() => { const s = game.scene; game.scene = SCENE.ARENA3D;
                const r = musicTrackForScene(); game.scene = s; return r === "play"; })());

    // The other modes must be untouched by the addition.
    ok("adding a mode did not disturb the 2D modes",
       MODE_ORDER.includes(MODE.SINGLE) && MODE_ORDER.includes(MODE.VOLLEY) &&
       MODE_ORDER.includes(MODE.TENNIS) && MODE_ORDER.includes(MODE.BASKET) &&
       MODE_ORDER.includes(MODE.TOURNAMENT));
    ok("soccer still offers the map picker",
       (() => { game.mode = MODE.SINGLE; return menuRows().includes("map"); })());
    ok("soccer still offers online play",
       (() => { game.mode = MODE.SINGLE; return menuRows().includes("online"); })());

    game.mode = savedMode;
    game.cpu = savedCpu;
  }

  // 24g. Arena state, spawns and the match lifecycle.
  {
    const saved = { mode: game.mode, scene: game.scene, arena: game.arena,
                    players: game.players, ball: game.ball, cpu: [...game.cpu],
                    sel: [...game.sel], score: [...game.score], clock: game.clock };

    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];
    startMatch();

    ok("starting a 3D match builds the arena", !!game.arena);
    ok("and enters the 3D scene", game.scene === SCENE.ARENA3D);
    ok("with two fighters", game.arena.fighters.length === 2);
    ok("both at full health", game.arena.fighters.every((f) => f.hp === HP_MAX));
    ok("both alive", game.arena.fighters.every((f) => !f.dead));
    ok("nobody has fragged anybody yet",
       game.arena.frags[0] === 0 && game.arena.frags[1] === 0);
    ok("the scoreline starts level", game.score[0] === 0 && game.score[1] === 0);
    ok("no projectiles are in flight", game.arena.shots.length === 0);
    ok("the fighters carry the chosen teams",
       game.arena.fighters[0].team === TEAMS[0] &&
       game.arena.fighters[1].team === TEAMS[3]);
    ok("each seat gets its own camera", game.arena.cam.length === 2);
    ok("and the cameras are positioned before the first frame is drawn",
       game.arena.cam.every((c) => c.pos && isFinite(c.pos.x) &&
                                   isFinite(c.pos.y) && isFinite(c.pos.z)));
    ok("one human against a bot is NOT split-screen", game.arena.split === false);
    ok("the fighters start apart",
       Math.hypot(game.arena.fighters[0].x - game.arena.fighters[1].x,
                  game.arena.fighters[0].z - game.arena.fighters[1].z) > 400);
    ok("both fighters start inside the arena",
       game.arena.fighters.every((f) =>
         Math.abs(f.x) < ARENA_HW && Math.abs(f.z) < ARENA_HD));
    ok("and standing on the floor", game.arena.fighters.every((f) => f.y === 0));

    // Two humans DO share the screen.
    {
      game.cpu = [false, false];
      startMatch();
      ok("two humans get split-screen", game.arena.split === true);
      game.cpu = [false, true];
    }

    // Cover geometry must be sane, or collision and sorting both suffer.
    {
      const cover = arenaCover();
      ok("the arena has cover to fight around", cover.length >= 4);
      ok("every cover box has positive extent",
         cover.every((c) => c.hw > 0 && c.hh > 0 && c.hd > 0));
      ok("every cover box sits on the floor",
         cover.every((c) => near(c.y, c.hh, 1e-9)));
      ok("every cover box is inside the arena",
         cover.every((c) => Math.abs(c.x) + c.hw <= ARENA_HW &&
                            Math.abs(c.z) + c.hd <= ARENA_HD));
      /*
        No two boxes may overlap: collision resolves per axis and the painter
        sort assumes no interpenetration, so an overlap would break both.
      */
      let overlap = null;
      for (let i = 0; i < cover.length && !overlap; i++) {
        for (let j = i + 1; j < cover.length; j++) {
          const a = cover[i], b = cover[j];
          if (Math.abs(a.x - b.x) < a.hw + b.hw &&
              Math.abs(a.y - b.y) < a.hh + b.hh &&
              Math.abs(a.z - b.z) < a.hd + b.hd) { overlap = `${i} and ${j}`; break; }
        }
      }
      ok("no two cover boxes overlap", !overlap, overlap || "");
    }

    // Spawns must be clear of cover, or a fighter spawns inside a crate.
    {
      const spawns = arenaSpawns();
      ok("there are four spawn points", spawns.length === 4);
      const cover = arenaCover();
      let inside = null;
      for (const s of spawns) {
        for (const c of cover) {
          if (Math.abs(s.x - c.x) < c.hw + FIGHTER_R &&
              Math.abs(s.z - c.z) < c.hd + FIGHTER_R) {
            inside = `spawn ${s.x},${s.z} is inside cover`; break;
          }
        }
        if (inside) break;
      }
      ok("no spawn point sits inside cover", !inside, inside || "");
      ok("every spawn is inside the arena",
         spawns.every((s) => Math.abs(s.x) < ARENA_HW - FIGHTER_R &&
                             Math.abs(s.z) < ARENA_HD - FIGHTER_R));
      /*
        Every spawn must FACE THE FIGHT. Checked by projecting the room centre
        through a camera built from the spawn's own yaw: if the centre is behind
        the camera, the player spawns staring at the wall behind them. All four
        corners were wrong when this test was written — the assertions above
        passed throughout, because none of them looked at facing.
      */
      let away = null;
      for (const s of spawns) {
        const cam = { pos: v3(s.x, EYE_H, s.z), yaw: s.yaw, pitch: 0 };
        const p = project(v3(0, EYE_H, 0), cam, makeView(0, 0, W, H), camBasis(cam));
        if (!p) { away = `spawn ${s.x},${s.z} faces away from the arena centre`; break; }
        // And roughly centred, not merely somewhere in front.
        if (Math.abs(p.x - W / 2) > W * 0.2) {
          away = `spawn ${s.x},${s.z} points ${(p.x - W / 2).toFixed(0)}px off centre`;
          break;
        }
      }
      ok("every spawn faces the middle of the arena", !away, away || "");
    }

    /*
      Respawn must move the victim AWAY from the killer. Respawning next to
      whoever just killed you is the fastest way to make a deathmatch unfair.
    */
    {
      startMatch();
      const [me, foe] = game.arena.fighters;
      const spawns = arenaSpawns();
      // Park the enemy on the first spawn, then die there.
      foe.x = spawns[0].x; foe.z = spawns[0].z; foe.dead = false;
      me.x = spawns[0].x; me.z = spawns[0].z;
      respawnFighter(me);
      const dNew = Math.hypot(me.x - foe.x, me.z - foe.z);
      let worst = 0;
      for (const s of spawns) worst = Math.max(worst, Math.hypot(s.x - foe.x, s.z - foe.z));
      ok("respawning picks the spawn furthest from the enemy",
         near(dNew, worst, 1e-9), `${dNew.toFixed(0)} vs best ${worst.toFixed(0)}`);
      ok("and restores full health", me.hp === HP_MAX);
      ok("and clears the dead flag and its timer", !me.dead && me.respawn === 0);
      ok("and stops all momentum", me.vx === 0 && me.vy === 0 && me.vz === 0);
      ok("and lands on the floor", me.y === 0 && me.onGround);
    }

    // Leaving the mode must leave nothing behind.
    {
      startMatch();
      ok("the arena exists while the mode runs", !!game.arena);
      endArena3D();
      ok("ending the mode clears the arena", game.arena === null);
      // Twice, to prove teardown is idempotent and rebuild is clean.
      startMatch();
      const first = game.arena;
      endArena3D();
      startMatch();
      ok("entering twice builds a fresh arena, not the old one",
         game.arena !== first && game.arena.fighters.length === 2);
      ok("and the second arena has no leftover projectiles",
         game.arena.shots.length === 0);
      endArena3D();
      ok("tearing down twice is harmless",
         (() => { endArena3D(); return game.arena === null; })());
    }

    // A 2D match must never leave 3D state lying around.
    {
      game.mode = MODE.SINGLE;
      startMatch();
      ok("starting a 2D match clears any 3D state", game.arena === null);
      ok("and a 2D match still enters its countdown", game.scene === SCENE.COUNTDOWN);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 24h. The cover slab test, used by both the camera and the bot.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel] };
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];
    startMatch();

    /*
      Derived from the live cover layout rather than hardcoded coordinates: the
      arena has been re-laid-out once already, and a test full of magic numbers
      simply broke rather than telling us anything.
    */
    {
      const c = game.arena.cover[0];
      const mid = v3(c.x, c.y, c.z);
      // Straight through the middle of a box, along each axis in turn.
      ok("a segment through a cover box is blocked",
         segmentHitsCover(v3(c.x - c.hw - 200, c.y, c.z), v3(c.x + c.hw + 200, c.y, c.z)));
      ok("and blocked along the other horizontal axis too",
         segmentHitsCover(v3(c.x, c.y, c.z - c.hd - 200), v3(c.x, c.y, c.z + c.hd + 200)));
      // Passing above it is clear, which is what makes low cover shootable over.
      ok("a segment passing above a cover box is clear",
         !segmentHitsCover(v3(c.x - c.hw - 200, c.y + c.hh + 60, c.z),
                           v3(c.x + c.hw + 200, c.y + c.hh + 60, c.z)));
      ok("a zero-length segment in the open is clear",
         !segmentHitsCover(v3(0, 40, 0), v3(0, 40, 0)));
      ok("a zero-length segment inside a box is blocked",
         segmentHitsCover(mid, mid));
      ok("a segment that stops short of a box is clear",
         !segmentHitsCover(v3(c.x - c.hw - 300, c.y, c.z), v3(c.x - c.hw - 40, c.y, c.z)));
      ok("the slab test is symmetric",
         segmentHitsCover(v3(c.x - c.hw - 200, c.y, c.z), v3(c.x + c.hw + 200, c.y, c.z)) ===
         segmentHitsCover(v3(c.x + c.hw + 200, c.y, c.z), v3(c.x - c.hw - 200, c.y, c.z)));
      // The middle of the pitch must be OPEN, so players can see the goals.
      ok("the centre of the pitch is clear of cover",
         !segmentHitsCover(v3(0, 40, -ARENA_HD + 20), v3(0, 40, ARENA_HD - 20)),
         "a soccer mode needs sight of what you are shooting at");
    }

    // Camera placement: never inside geometry, never outside the room.
    {
      let bad = null;
      const f = game.arena.fighters[0];
      // Sweep the fighter around the room, looking every which way.
      for (let i = 0; i < 48 && !bad; i++) {
        const a = (i / 48) * Math.PI * 2;
        f.x = Math.cos(a) * 420;
        f.z = Math.sin(a) * 420;
        f.yaw = a;
        f.pitch = (i % 5 - 2) * 0.4;
        updateArenaCameras();
        const cam = game.arena.cam[0];
        if (!isFinite(cam.pos.x) || !isFinite(cam.pos.y) || !isFinite(cam.pos.z)) {
          bad = `non-finite camera at ${i}`; break;
        }
        if (outsideArena(cam.pos)) bad = `camera left the room at ${i}`;
        if (cam.dist < CAM_MIN_DIST - 1e-9) bad = `camera too close at ${i}`;
        if (Math.abs(cam.pitch) > PITCH_MAX + 1e-9) bad = `pitch unclamped at ${i}`;
      }
      ok("the camera stays inside the room, sane and clamped, all the way round",
         !bad, bad || "");
    }

    endArena3D();
    Object.assign(game, saved);
  }

  // 24i. Movement, gravity and collision.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball };
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];
    startMatch();

    const noIntent = () => ({ left: false, right: false, up: false, down: false,
                              aimX: 0, aimY: 0, jump: false, dashEdge: false });
    /** A lone fighter in a clear corner of the room, for isolated tests. */
    const lone = (over = {}) => {
      const f = makeFighter(0, TEAMS[0]);
      f.x = -460; f.z = -460; f.y = 0;
      Object.assign(f, over);
      return f;
    };
    const run = (f, a, secs) => {
      const n = Math.round(secs / DT);
      for (let i = 0; i < n; i++) stepFighter(f, a, DT);
      return f;
    };

    // Gravity: a dropped fighter settles ON the floor, never through it.
    {
      const f = lone({ y: 300 });
      run(f, noIntent(), 2);
      ok("a falling fighter comes to rest exactly on the floor",
         near(f.y, 0, 1e-9) && near(f.vy, 0, 1e-9), `y=${f.y} vy=${f.vy}`);
      ok("and is reported as grounded", f.onGround);
    }
    // A very long fall must not tunnel: the floor is a clamp, not a test.
    {
      const f = lone({ y: 5000, vy: -8000 });
      run(f, noIntent(), 1);
      ok("even a fast fall cannot tunnel through the floor", f.y >= 0, `${f.y}`);
    }

    // Jump: rises, then returns to the floor.
    {
      const f = lone();
      const a = noIntent(); a.jump = true;
      stepFighter(f, a, DT);
      ok("jumping leaves the ground", f.vy > 0 && !f.onGround);
      const peak = (() => { let p = 0; for (let i = 0; i < 200; i++)
        { stepFighter(f, noIntent(), DT); p = Math.max(p, f.y); } return p; })();
      ok("a jump gets meaningfully off the floor", peak > 40, `${peak.toFixed(0)}`);
      run(f, noIntent(), 2);
      ok("and lands again", near(f.y, 0, 1e-9) && f.onGround);
    }
    // A second jump in mid-air must be refused, or the fighter can fly.
    {
      const f = lone();
      const a = noIntent(); a.jump = true;
      stepFighter(f, a, DT);
      const vyAfterFirst = f.vy;
      stepFighter(f, a, DT);       // still held, still airborne
      ok("jump cannot be repeated in mid-air", f.vy < vyAfterFirst,
         `${vyAfterFirst} -> ${f.vy}`);
    }

    // WASD is camera-relative: the same key with a different yaw goes elsewhere.
    {
      const north = lone({ yaw: 0 });
      const east = lone({ yaw: Math.PI / 2 });
      const a = noIntent(); a.up = true;
      run(north, a, 0.3);
      run(east, a, 0.3);
      ok("forward with yaw 0 moves along +z",
         north.z > -460 + 10 && near(north.x, -460, 1e-6),
         `x=${north.x.toFixed(1)} z=${north.z.toFixed(1)}`);
      ok("forward with yaw 90° moves along +x instead",
         east.x > -460 + 10 && near(east.z, -460, 1e-6),
         `x=${east.x.toFixed(1)} z=${east.z.toFixed(1)}`);
      ok("so movement is camera-relative, not world-relative",
         Math.abs(north.z - (-460)) > 10 && Math.abs(east.x - (-460)) > 10);
    }
    // Strafing must be perpendicular to forward, not parallel.
    {
      const f = lone({ yaw: 0 });
      const a = noIntent(); a.right = true;
      run(f, a, 0.3);
      ok("strafing right with yaw 0 moves along +x",
         f.x > -460 + 10 && near(f.z, -460, 1e-6),
         `x=${f.x.toFixed(1)} z=${f.z.toFixed(1)}`);
    }
    // Diagonals must not be faster than cardinals.
    {
      const straight = lone({ yaw: 0 });
      const diag = lone({ yaw: 0 });
      const a1 = noIntent(); a1.up = true;
      const a2 = noIntent(); a2.up = true; a2.right = true;
      run(straight, a1, 1.5);
      run(diag, a2, 1.5);
      const d1 = Math.hypot(straight.x + 460, straight.z + 460);
      const d2 = Math.hypot(diag.x + 460, diag.z + 460);
      ok("moving diagonally is no faster than moving straight",
         d2 <= d1 + 1, `straight ${d1.toFixed(1)} vs diagonal ${d2.toFixed(1)}`);
    }

    // Top speed is capped horizontally, whatever the input.
    {
      const f = lone({ yaw: 0.7 });
      const a = noIntent(); a.up = true; a.right = true;
      run(f, a, 4);
      ok("horizontal speed is capped", Math.hypot(f.vx, f.vz) <= F_MAXV + 1e-6,
         `${Math.hypot(f.vx, f.vz).toFixed(1)} vs ${F_MAXV}`);
    }
    // Releasing the keys brings a grounded fighter to a stop.
    {
      const f = lone({ yaw: 0 });
      const a = noIntent(); a.up = true;
      run(f, a, 1);
      run(f, noIntent(), 3);
      ok("letting go stops a grounded fighter",
         Math.hypot(f.vx, f.vz) < 1, `${Math.hypot(f.vx, f.vz).toFixed(3)}`);
    }

    // Dash: adds speed, then refuses until the cooldown expires.
    {
      const f = lone({ yaw: 0 });
      const a = noIntent(); a.dashEdge = true;
      stepFighter(f, a, DT);
      const after = Math.hypot(f.vx, f.vz);
      ok("dashing adds a burst of speed", after > 200, `${after.toFixed(0)}`);
      ok("and starts its cooldown", f.dashCD > 0);
      const before2 = Math.hypot(f.vx, f.vz);
      stepFighter(f, a, DT);
      ok("a second dash is refused while cooling down",
         Math.hypot(f.vx, f.vz) <= before2 + 1e-6);
      run(f, noIntent(), F_DASH_CD + 0.1);
      ok("and allowed again once the cooldown expires", f.dashCD <= 0);
    }

    // Pitch clamp, held hard in both directions.
    {
      const f = lone();
      const up = noIntent(); up.aimY = 0.3;
      run(f, up, 1);
      ok("pitch is clamped looking up", near(f.pitch, PITCH_MAX, 1e-9), `${f.pitch}`);
      const dn = noIntent(); dn.aimY = -0.3;
      run(f, dn, 2);
      ok("and clamped looking down", near(f.pitch, -PITCH_MAX, 1e-9), `${f.pitch}`);
    }
    // Yaw, by contrast, must wrap freely rather than clamp.
    {
      const f = lone();
      const a = noIntent(); a.aimX = 0.2;
      run(f, a, 3);
      ok("yaw turns without limit", Math.abs(f.yaw) > Math.PI, `${f.yaw.toFixed(2)}`);
    }

    // The walls hold, from every direction, under sustained pressure.
    {
      const dirs = [["west", { yaw: -Math.PI / 2 }], ["east", { yaw: Math.PI / 2 }],
                    ["north", { yaw: Math.PI }], ["south", { yaw: 0 }]];
      let bad = null;
      for (const [name, over] of dirs) {
        const f = makeFighter(0, TEAMS[0]);
        f.x = 0; f.z = 0; f.y = 0;
        Object.assign(f, over);
        const a = noIntent(); a.up = true;
        run(f, a, 6);
        if (Math.abs(f.x) > ARENA_HW - FIGHTER_R + 1e-6 ||
            Math.abs(f.z) > ARENA_HD - FIGHTER_R + 1e-6) {
          bad = `escaped ${name}: ${f.x.toFixed(1)},${f.z.toFixed(1)}`; break;
        }
      }
      ok("a fighter cannot walk out of the arena in any direction", !bad, bad || "");
    }
    // Nor escape upward.
    {
      const f = lone({ vy: 9000 });
      run(f, noIntent(), 0.6);
      ok("a fighter cannot escape through the ceiling",
         f.y <= ARENA_WALL_H - FIGHTER_H + 1e-6, `${f.y.toFixed(1)}`);
    }

    /*
      Cover must be solid from every horizontal direction. Walked into hard for
      a full second from each of four sides, the fighter must end up outside the
      box — a fighter that ends up inside would be shooting from within a crate.
    */
    {
      // Every box, from all four sides: derived from the layout, so a re-laid-out
      // arena is still fully covered by this test.
      let bad = null;
      for (const c of game.arena.cover) {
        const D = 260;
        const approaches = [
          ["from -x", { x: c.x - D, z: c.z, yaw: Math.PI / 2 }],
          ["from +x", { x: c.x + D, z: c.z, yaw: -Math.PI / 2 }],
          ["from -z", { x: c.x, z: c.z - D, yaw: 0 }],
          ["from +z", { x: c.x, z: c.z + D, yaw: Math.PI }],
        ];
        for (const [name, over] of approaches) {
          const f = makeFighter(0, TEAMS[0]);
          Object.assign(f, over, { y: 0, vx: 0, vy: 0, vz: 0 });
          const a = noIntent(); a.up = true;
          run(f, a, 1.5);
          const insideX = Math.abs(f.x - c.x) < c.hw + FIGHTER_R - 0.5;
          const insideZ = Math.abs(f.z - c.z) < c.hd + FIGHTER_R - 0.5;
          const insideY = f.y < c.y + c.hh - 0.5;
          if (insideX && insideZ && insideY) {
            bad = `${name}: ended inside a box at ${f.x.toFixed(1)},${f.z.toFixed(1)},${f.y.toFixed(1)}`;
            break;
          }
        }
        if (bad) break;
      }
      ok("a fighter cannot walk into any cover box from any side", !bad, bad || "");
    }

    // Crates are climbable: dropping onto one lands on top of it.
    {
      const c = game.arena.cover[0];
      const f = makeFighter(0, TEAMS[0]);
      Object.assign(f, { x: c.x, z: c.z, y: c.y + c.hh + 120, vx: 0, vy: 0, vz: 0 });
      run(f, noIntent(), 2);
      ok("a fighter lands on top of a crate rather than inside it",
         near(f.y, c.y + c.hh, 1e-6) && f.onGround, `y=${f.y.toFixed(2)}`);
    }
    // And standing on one is stable, not a slow sink.
    {
      const c = game.arena.cover[0];
      const f = makeFighter(0, TEAMS[0]);
      Object.assign(f, { x: c.x, z: c.z, y: c.y + c.hh, vx: 0, vy: 0, vz: 0 });
      run(f, noIntent(), 3);
      ok("and stays there instead of sinking",
         near(f.y, c.y + c.hh, 1e-6), `y=${f.y.toFixed(3)}`);
    }

    // No input can ever produce a non-finite fighter.
    {
      let bad = null;
      const f = lone();
      for (let i = 0; i < 600 && !bad; i++) {
        const a = noIntent();
        a.up = i % 3 === 0; a.down = i % 7 === 0;
        a.left = i % 5 === 0; a.right = i % 4 === 0;
        a.jump = i % 23 === 0; a.dashEdge = i % 61 === 0;
        a.aimX = ((i % 11) - 5) * 0.05;
        a.aimY = ((i % 9) - 4) * 0.05;
        stepFighter(f, a, DT);
        if (![f.x, f.y, f.z, f.vx, f.vy, f.vz, f.yaw, f.pitch].every(isFinite)) {
          bad = `non-finite at step ${i}`;
        }
      }
      ok("no sequence of inputs produces a non-finite fighter", !bad, bad || "");
    }
