    endArena3D();
    Object.assign(game, saved);
    game.particles = [];
  }

  // 24j. Combat: hits, damage, frags and the end of a match.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, score: [...game.score], board: game.board,
                    goalsToWin: game.goalsToWin, clock: game.clock,
                    winner: game.winner, shake: game.shake, flash: game.flash };
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];

    /**
     * A fresh match with both fighters parked where the test wants them.
     *
     * The BALL is parked well out of the way: shots now collide with it, so a
     * ball left on the centre spot would intercept every shot aimed down the
     * pitch and these tests would be measuring the wrong thing.
     */
    const duel = (aPos, bPos) => {
      startMatch();
      const [a, b] = game.arena.fighters;
      Object.assign(a, aPos, { vx: 0, vy: 0, vz: 0 });
      Object.assign(b, bPos, { vx: 0, vy: 0, vz: 0 });
      Object.assign(game.arena.ball,
        { x: ARENA_HW - 60, y: A_BALL_R, z: ARENA_HD - 60, vx: 0, vy: 0, vz: 0 });
      return [a, b];
    };

    // Aim: the ray must agree with yaw and pitch.
    {
      const f = makeFighter(0, TEAMS[0]);
      f.yaw = 0; f.pitch = 0;
      const r = aimRay(f);
      ok("aiming with yaw 0 points along +z",
         near(r.z, 1, 1e-9) && near(r.x, 0, 1e-9) && near(r.y, 0, 1e-9));
      f.yaw = Math.PI / 2;
      ok("aiming with yaw 90° points along +x", near(aimRay(f).x, 1, 1e-9));
      f.yaw = 0; f.pitch = PITCH_MAX;
      ok("aiming up gives a positive y component", aimRay(f).y > 0);
      ok("and the aim ray is always a unit vector",
         (() => {
           for (let i = 0; i < 40; i++) {
             f.yaw = i * 0.37; f.pitch = ((i % 7) - 3) * 0.3;
             if (Math.abs(v3len(aimRay(f)) - 1) > 1e-9) return false;
           }
           return true;
         })());
    }

    // A shot fired straight at an opponent hits.
    {
      const [a, b] = duel({ x: 0, z: -300, yaw: 0, pitch: 0 }, { x: 0, z: 0 });
      // Clear the pillar out of the way: this test is about the hit, not cover.
      game.arena.cover = [];
      ok("firing creates a projectile", fireShot(a) && game.arena.shots.length === 1);
      const hpBefore = b.hp;
      for (let i = 0; i < 60 && game.arena.shots.length; i++) stepShots(DT);
      ok("a shot along the aim ray hits the opponent", b.hp < hpBefore,
         `hp ${hpBefore} -> ${b.hp}`);
      ok("and does exactly the documented damage", b.hp === hpBefore - SHOT_DMG,
         `${hpBefore - b.hp}`);
      ok("and the projectile is consumed by the hit", game.arena.shots.length === 0);
    }

    // A shot aimed past the opponent misses.
    {
      const [a, b] = duel({ x: 0, z: -300, yaw: 0, pitch: 0 }, { x: 220, z: 0 });
      game.arena.cover = [];
      fireShot(a);
      for (let i = 0; i < 60 && game.arena.shots.length; i++) stepShots(DT);
      ok("a shot aimed well past the opponent misses", b.hp === HP_MAX, `${b.hp}`);
    }
    // Firing respects its cooldown.
    {
      const [a] = duel({ x: 0, z: -300, yaw: 0 }, { x: 0, z: 0 });
      ok("the first shot fires", fireShot(a));
      ok("an immediate second shot is refused", !fireShot(a));
      a.fireCD = 0;
      ok("and allowed once the cooldown has elapsed", fireShot(a));
    }
    // A dead fighter cannot shoot.
    {
      const [a] = duel({ x: 0, z: -300, yaw: 0 }, { x: 0, z: 0 });
      a.dead = true;
      ok("a dead fighter cannot fire", !fireShot(a));
    }

    /*
      NO FRIENDLY FIRE. Checked by firing straight through the shooter's own
      position: the shot must pass through its owner untouched.
    */
    {
      const [a, b] = duel({ x: 0, z: 0, yaw: 0, pitch: 0 }, { x: 0, z: 400 });
      game.arena.cover = [];
      fireShot(a);
      const hpA = a.hp;
      for (let i = 0; i < 8; i++) stepShots(DT);
      ok("a shot never damages the seat that fired it", a.hp === hpA, `${a.hp}`);
    }

    // Four hits kill; three do not.
    {
      const [, b] = duel({ x: 0, z: -300, yaw: 0 }, { x: 0, z: 0 });
      applyDamage(b, SHOT_DMG, 0);
      applyDamage(b, SHOT_DMG, 0);
      applyDamage(b, SHOT_DMG, 0);
      ok("three hits leave a fighter standing", !b.dead && b.hp === 25, `${b.hp}`);
      const fatal = applyDamage(b, SHOT_DMG, 0);
      ok("the fourth hit kills", b.dead && fatal);
      ok("and health floors at zero rather than going negative", b.hp === 0, `${b.hp}`);
      ok("and a respawn timer starts", near(b.respawn, RESPAWN_T, 1e-9));
      ok("and a dead fighter takes no further damage",
         (() => { const r = applyDamage(b, SHOT_DMG, 0); return !r && b.hp === 0; })());
    }

    // A knockdown credits the shooter, never the victim.
    {
      const [, b] = duel({ x: 0, z: -300, yaw: 0 }, { x: 0, z: 0 });
      game.goalsToWin = 5;
      for (let i = 0; i < 4; i++) applyDamage(b, SHOT_DMG, 0);
      ok("a knockdown credits the shooter", game.arena.frags[0] === 1);
      ok("and credits the victim with nothing", game.arena.frags[1] === 0);
      /*
        GOALS are the win condition, so a knockdown must NOT touch the scoreline.
        It removes the opponent from play for a moment — a chance to score, not a
        score in itself.
      */
      ok("but a knockdown does not change the scoreline",
         game.score[0] === 0 && game.score[1] === 0,
         `${game.score}`);
      ok("and does not end the match", game.scene === SCENE.ARENA3D);
    }
    // Suicide is impossible: damage attributed to the victim credits nobody.
    {
      const [, b] = duel({ x: 0, z: -300, yaw: 0 }, { x: 0, z: 0 });
      game.goalsToWin = 5;
      for (let i = 0; i < 4; i++) applyDamage(b, SHOT_DMG, 1);
      ok("dying to your own damage credits no frag at all",
         game.arena.frags[0] === 0 && game.arena.frags[1] === 0,
         `${game.arena.frags}`);
    }

    // Dying respawns the fighter after the timer, at full health.
    {
      const [, b] = duel({ x: 0, z: -300, yaw: 0 }, { x: 0, z: 0 });
      game.goalsToWin = 5;
      for (let i = 0; i < 4; i++) applyDamage(b, SHOT_DMG, 0);
      const a0 = { left: false, right: false, up: false, down: false,
                   aimX: 0, aimY: 0, jump: false, dashEdge: false };
      const n = Math.round((RESPAWN_T + 0.05) / DT);
      for (let i = 0; i < n; i++) stepFighter(b, a0, DT);
      ok("a dead fighter comes back after the respawn delay", !b.dead);
      ok("and comes back at full health", b.hp === HP_MAX);
    }

    // Reaching the GOAL target ends the match through the shared path.
    {
      duel({ x: 0, z: -300, yaw: 0 }, { x: 0, z: 0 });
      game.goalsToWin = 2;
      const boardBefore = JSON.stringify(game.board);
      // Side 1 concedes: side 0 scores.
      arenaGoal(1);
      ok("one goal short of the target does not end the match",
         game.scene === SCENE.ARENA3D, game.scene);
      ok("and the goal shows on the scoreline",
         game.score[0] === 1 && game.arena.goals[0] === 1);
      arenaGoal(1);
      ok("reaching the goal target ends the match", game.scene === SCENE.WIN,
         game.scene);
      ok("and names the right winner", game.winner === 0, `${game.winner}`);
      ok("and tears the arena down", game.arena === null);
      ok("and records the result on the leaderboard",
         JSON.stringify(game.board) !== boardBefore);
    }
    // No number of knockdowns can win a match.
    {
      const [, b] = duel({ x: 0, z: -300, yaw: 0 }, { x: 0, z: 0 });
      game.goalsToWin = 2;
      for (let n = 0; n < 12; n++) {
        b.dead = false; b.hp = HP_MAX; b.shield = 0;
        for (let i = 0; i < 4; i++) applyDamage(b, SHOT_DMG, 0);
      }
      ok("no amount of shooting can win the match",
         game.scene === SCENE.ARENA3D && game.score[0] === 0,
         `scene ${game.scene} score ${game.score}`);
    }

    // Shots stop at cover, so cover is dependable.
    {
      // Put both fighters either side of a real cover box, derived from the
      // layout rather than assuming a pillar at the origin.
      startMatch();
      const c = game.arena.cover[0];
      const [a, b] = game.arena.fighters;
      Object.assign(a, { x: c.x, y: 0, z: c.z - 260, yaw: 0, pitch: 0,
                         vx: 0, vy: 0, vz: 0, fireCD: 0 });
      Object.assign(b, { x: c.x, y: 0, z: c.z + 260, vx: 0, vy: 0, vz: 0 });
      fireShot(a);                       // straight into the box between them
      for (let i = 0; i < 120 && game.arena.shots.length; i++) stepShots(DT);
      ok("a shot is stopped by cover instead of passing through",
         b.hp === HP_MAX, `${b.hp}`);
    }
    // And expire rather than accumulating forever.
    {
      const [a] = duel({ x: 0, z: -460, yaw: Math.PI, pitch: 0 }, { x: 400, z: 400 });
      game.arena.cover = [];
      fireShot(a);
      const n = Math.round((SHOT_LIFE + 0.2) / DT);
      for (let i = 0; i < n; i++) stepShots(DT);
      ok("a shot that hits nothing is eventually removed",
         game.arena.shots.length === 0, `${game.arena.shots.length}`);
    }
    // A fast shot must not tunnel past a fighter between substeps.
    {
      const [a, b] = duel({ x: 0, z: -300, yaw: 0, pitch: 0 }, { x: 0, z: 0 });
      game.arena.cover = [];
      fireShot(a);
      // One big step, larger than the time the shot needs to cross the body.
      stepShots(0.2);
      ok("a fast shot cannot tunnel through a fighter in one big step",
         b.hp < HP_MAX, `${b.hp}`);
    }

    endArena3D();
    Object.assign(game, saved);
    game.particles = [];
  }

  // 24k. Input: pointer-lock discipline and the controls screen.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, ctrlSeat: game.ctrlSeat, ctrlRow: game.ctrlRow,
                    ctrlFrom: game.ctrlFrom, pauseFrom: game.pauseFrom,
                    goalsToWin: game.goalsToWin, score: [...game.score],
                    winner: game.winner };

    // The new actions exist and are reachable from the controls screen.
    {
      const keysOf = ACTIONS.map((a) => a.key);
      ok("the aim actions are rebindable",
         ["aimUp", "aimDown", "aimLeft", "aimRight"].every((k) => keysOf.includes(k)));
      ok("and so is dash", keysOf.includes("dash"));
      ok("a blank binding still renders a readable label", keyLabel("") === "—");
      ok("the controls screen has a row for every action plus reset and back",
         (() => { game.ctrlSeat = 0; game.ctrlRow = 0; game.ctrlFrom = null;
                  layoutProbe.controls = null; drawControls();
                  return layoutProbe.controls &&
                         layoutProbe.controls.rows === ACTIONS.length + 2; })());
    }

    /*
      The whole controls list must fit the canvas. Adding five actions overflowed
      it at the original row pitch, and the probe records what was actually
      painted so this cannot pass by re-deriving the same wrong arithmetic.
    */
    {
      game.ctrlFrom = null;
      layoutProbe.controls = null;
      drawControls();
      const p = layoutProbe.controls;
      ok("every controls row lands on the canvas", p && p.bottom <= H,
         p ? `bottom ${p.bottom} vs ${H}` : "no probe");
      ok("and the gamepad status line lands on the canvas too",
         p && p.statusY <= H - 8, p ? `${p.statusY}` : "no probe");
      ok("and the list starts below the seat tabs", p && p.top >= 114, `${p && p.top}`);
      ok("rows do not overlap each other", p && p.rowH <= p.gap,
         p ? `rowH ${p.rowH} vs gap ${p.gap}` : "");
    }

    // Pointer lock must be released on EVERY path out of the mode.
    {
      game.mode = MODE.ARENA3D;
      game.cpu = [false, true];
      game.sel = [0, 3];

      // 1. Pausing.
      startMatch();
      mouse.locked = true; mouse.wantLock = true; mouse.dx = 40; mouse.dy = 20;
      openPause();
      ok("pausing releases the pointer lock", !mouse.locked && !mouse.wantLock);
      ok("and discards accumulated mouse movement",
         mouse.dx === 0 && mouse.dy === 0);

      // 2. Quitting to the menu.
      startMatch();
      mouse.locked = true; mouse.wantLock = true;
      quitToMenu();
      ok("quitting releases the pointer lock", !mouse.locked && !mouse.wantLock);
      ok("and clears the arena", game.arena === null);

      // 3. The match ending on GOALS, which is the win condition.
      startMatch();
      game.goalsToWin = 1;
      mouse.locked = true; mouse.wantLock = true;
      arenaGoal(1);                      // side 1 concedes, so side 0 wins
      ok("winning releases the pointer lock", !mouse.locked && !mouse.wantLock);
      ok("and tears the arena down", game.arena === null);

      // 4. The match ending on the clock, via the shared time-expiry path.
      startMatch();
      game.goalsToWin = 9;
      mouse.locked = true; mouse.wantLock = true;
      game.arena.frags = [2, 1];
      game.score = [2, 1];
      timeExpired();
      ok("time expiry releases the pointer lock", !mouse.locked && !mouse.wantLock);
      ok("and awards the match to the frag leader", game.winner === 0, `${game.winner}`);

      // 5. Explicit teardown, however it is reached.
      startMatch();
      mouse.locked = true; mouse.wantLock = true;
      endArena3D();
      ok("tearing the arena down releases the pointer lock",
         !mouse.locked && !mouse.wantLock);
    }

    // The mouse only steers the seat that owns it, and only in the 3D mode.
    {
      game.mode = MODE.ARENA3D;
      game.cpu = [false, true];
      pads.active[0] = pads.active[1] = false;
      ok("the first human seat owns the mouse", arenaMouseSeat() === 0);
      game.cpu = [true, false];
      ok("and it follows the human when seat 0 is a bot", arenaMouseSeat() === 1);
      game.cpu = [true, true];
      ok("with no human seats, nobody owns the mouse", arenaMouseSeat() === -1);
      game.cpu = [false, true];
    }

    // takeMouseDelta drains exactly once, so one movement turns the view once.
    {
      mouse.dx = 12; mouse.dy = -7;
      const first = takeMouseDelta();
      const second = takeMouseDelta();
      ok("mouse movement is delivered once", first.dx === 12 && first.dy === -7);
      ok("and not delivered twice", second.dx === 0 && second.dy === 0);
    }

    // Aim keys must not steer anything outside the 3D arena.
    {
      game.mode = MODE.SINGLE;
      game.scene = SCENE.PLAY;
      game.arena = null;
      keys[SCHEME[1].aimLeft] = true;
      gatherIntent(true);
      ok("the aim keys do nothing in a 2D match",
         intent[1].aimX === 0 && intent[1].aimY === 0);
      ok("and neither does the 3D jump binding", intent[1].jump === false);
      keys[SCHEME[1].aimLeft] = false;
    }

    Object.assign(game, saved);
    for (const k in keys) keys[k] = false;
    game.particles = [];
  }

  // 24l. Rendering: viewports, split-screen and the HUD.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, pauseFrom: game.pauseFrom,
                    goalsToWin: game.goalsToWin, score: [...game.score] };
    game.mode = MODE.ARENA3D;
    game.sel = [0, 3];

    // Viewport geometry: one full view, or two stacked halves.
    {
      game.cpu = [false, true];
      startMatch();
      const one = arenaViews();
      ok("a single-player view fills the canvas",
         one.length === 1 && one[0].w === W && one[0].h === H);

      game.cpu = [false, false];
      startMatch();
      const two = arenaViews();
      ok("split-screen gives two viewports", two.length === 2);
      ok("stacked, each half the height",
         two[0].h === H / 2 && two[1].h === H / 2 &&
         two[0].y === 0 && two[1].y === H / 2);
      ok("each the full width, for a usable field of view",
         two[0].w === W && two[1].w === W);
      ok("and they do not overlap", two[0].y + two[0].h === two[1].y);
      ok("both halves share the same lens",
         near(two[0].focal, two[1].focal, 1e-12));
    }

    // The scene must paint without throwing, in both layouts, and paint SOMETHING.
    {
      for (const cpu of [[false, true], [false, false]]) {
        game.cpu = cpu;
        startMatch();
        const label = cpu[1] ? "vs CPU" : "split-screen";
        let threw = null;
        try { drawArena3D(); } catch (e) { threw = e && e.message; }
        ok(`the 3D arena renders (${label}) without throwing`, !threw, threw || "");
      }
    }
    // It must also survive being drawn with a fighter dead, mid-respawn.
    {
      game.cpu = [false, true];
      startMatch();
      game.arena.fighters[1].dead = true;
      game.arena.fighters[1].respawn = 1.2;
      let threw = null;
      try { drawArena3D(); } catch (e) { threw = e && e.message; }
      ok("and renders with a fighter down", !threw, threw || "");
    }
    // And with projectiles and impact effects live.
    {
      game.cpu = [false, true];
      startMatch();
      fireShot(game.arena.fighters[0]);
      game.arena.hitFx.push({ x: 0, y: 40, z: 0, life: 0.2 });
      let threw = null;
      try { drawArena3D(); } catch (e) { threw = e && e.message; }
      ok("and renders with shots and impacts in flight", !threw, threw || "");
    }
    // And from a camera jammed into a corner, where faces straddle the near plane.
    {
      game.cpu = [false, true];
      startMatch();
      const f = game.arena.fighters[0];
      f.x = ARENA_HW - FIGHTER_R; f.z = ARENA_HD - FIGHTER_R; f.yaw = -Math.PI * 0.75;
      f.pitch = PITCH_MAX;
      updateArenaCameras();
      let threw = null;
      try { drawArena3D(); } catch (e) { threw = e && e.message; }
      ok("and renders from a camera crammed into a corner", !threw, threw || "");
    }

    // The world batch must actually paint geometry, not silently cull it all.
    {
      game.cpu = [false, true];
      startMatch();
      const view = makeView(0, 0, W, H);
      const r = drawArenaWorld(game.arena.cam[0], view, ARENA[MODE.ARENA3D]);
      ok("the world pass paints a substantial number of faces", r.painted > 20,
         `${r.painted} faces`);
    }

    // The HUD must report the seat it was asked for, not always seat 0.
    {
      game.cpu = [false, false];
      startMatch();
      game.arena.goals = [3, 1];
      game.arena.frags = [2, 5];
      game.arena.fighters[1].hp = 45;
      const view = makeView(0, H / 2, W, H / 2);
      const all = capturePaint(() => drawArenaHUD(1, view)).strings.join(" | ");
      ok("the HUD shows the requested seat's health", all.includes("45"), all);
      ok("and its GOAL count from that seat's point of view",
         all.includes("1 — 3"), all);
      ok("and shows knockdowns separately, as a secondary statistic",
         all.includes("knockdowns 5-2") || all.includes("knockdowns 5–2"), all);
      const all0 = capturePaint(() => drawArenaHUD(0, makeView(0, 0, W, H / 2)))
        .strings.join(" | ");
      ok("and the other seat sees the score the other way round",
         all0.includes("3 — 1"), all0);
    }
    // A downed fighter's HUD says so, and counts down.
    {
      game.cpu = [false, true];
      startMatch();
      game.arena.fighters[0].dead = true;
      game.arena.fighters[0].respawn = 1.5;
      const all = capturePaint(() => drawArenaHUD(0, makeView(0, 0, W, H)))
        .strings.join(" | ");
      ok("a downed player is told so", all.includes("DOWN"), all);
      ok("and told when they return", /respawning in 1\.5s/.test(all), all);
    }
    // The scoreboard shows frags and the target.
    {
      game.cpu = [false, true];
      game.goalsToWin = 7;
      startMatch();
      game.arena.goals = [2, 5];
      const all = capturePaint(() => drawArenaScoreboard()).strings.join(" | ");
      ok("the scoreboard shows both goal counts",
         all.includes("2") && all.includes("5"), all);
      ok("and the target to win", all.includes("FIRST TO 7 GOALS"), all);
    }

    // Pausing a 3D match must show the arena behind the overlay, not a pitch.
    {
      game.cpu = [false, true];
      startMatch();
      openPause();
      let threw = null;
      try { drawPause(); } catch (e) { threw = e && e.message; }
      ok("the pause overlay renders over a 3D match", !threw, threw || "");
      game.scene = SCENE.ARENA3D;
      game.pauseFrom = null;
    }

    // Colour helpers must stay in range and stay valid hex.
    {
      ok("shiftHex lightens and darkens within range",
         /^#[0-9a-f]{6}$/.test(shiftHex("#37414f", 26)) &&
         /^#[0-9a-f]{6}$/.test(shiftHex("#37414f", -26)));
      ok("and clamps rather than wrapping",
         shiftHex("#ffffff", 40) === "#ffffff" && shiftHex("#000000", -40) === "#000000");
    }

    endArena3D();
    Object.assign(game, saved);
    game.particles = [];
  }

  // 24m. The bot, the scene step, and a match played end to end.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, score: [...game.score], winner: game.winner,
                    goalsToWin: game.goalsToWin, clock: game.clock,
                    matchSecs: game.matchSecs, cpuLevel: game.cpuLevel,
                    timeIdx: game.timeIdx };
    game.mode = MODE.ARENA3D;
    game.sel = [0, 3];
    game.cpu = [false, true];

    const clearIntent = () => {
      for (const a of intent) {
        a.left = a.right = a.up = a.down = a.kick = a.kickEdge = a.wallEdge = false;
        a.aimX = a.aimY = 0;
        a.jump = a.dashEdge = false;
      }
    };

    // The bot turns toward its target rather than snapping to it.
    {
      startMatch();
      const [me, bot] = game.arena.fighters;
      me.x = 0; me.z = 0;
      bot.x = 0; bot.z = 400; bot.yaw = 0;      // facing away from the target
      clearIntent();
      updateArenaCPU(bot, DT);
      const a = intent[1];
      ok("the bot turns toward its target", Math.abs(a.aimX) > 0);
      ok("but only at a bounded rate, never snapping",
         Math.abs(a.aimX) <= STICK_SENS * 2 * DT + 1e-9, `${a.aimX}`);
    }

    /*
      THE BOT PLAYS SOCCER. It runs at the ball rather than at the opponent, and
      kicks toward the goal once it is in range. Averaged over many decisions,
      since idle beats and speed throttling are deliberately random.
    */
    {
      startMatch();
      const [me, bot] = game.arena.fighters;
      game.cpuLevel = 2;                        // hard: most decisive
      me.x = 0; me.z = -400;
      // Ball far upfield of the bot, so it must run for it.
      game.arena.ball = makeArenaBall();
      game.arena.ball.x = 0;
      game.arena.ball.z = 0;
      bot.x = 0; bot.z = 600;
      bot.yaw = Math.atan2(0 - bot.x, 0 - bot.z);
      let approach = 0;
      for (let i = 0; i < 400; i++) {
        bot.ai = null;
        clearIntent();
        updateArenaCPU(bot, DT);
        if (intent[1].up) approach++;
      }
      ok("the bot runs at the ball", approach > 200, `${approach}/400`);

      // Aim: it should be turning toward the ball, not toward the opponent.
      bot.ai = null;
      clearIntent();
      updateArenaCPU(bot, DT);
      ok("and turns toward it", Math.abs(intent[1].aimX) >= 0);
    }

    // The bot kicks when the ball is at its feet, and aims at the goal.
    {
      startMatch();
      game.cpuLevel = 2;
      const bot = game.arena.fighters[1];
      const b = game.arena.ball;
      // Bot standing over the ball in midfield, facing the goal it attacks.
      const target = aGoalLineZ(0);
      bot.x = 0; bot.y = 0; bot.z = 0;
      bot.yaw = Math.atan2(0 - bot.x, target - bot.z);
      bot.pitch = 0;
      b.x = bot.x + Math.sin(bot.yaw) * 40;
      b.z = bot.z + Math.cos(bot.yaw) * 40;
      b.y = b.r;
      b.vx = b.vy = b.vz = 0;
      let kicked = false;
      for (let i = 0; i < 300 && !kicked; i++) {
        bot.kickCD = 0;
        bot.ai = null;
        clearIntent();
        updateArenaCPU(bot, DT);
        if (Math.hypot(b.vx, b.vy, b.vz) > 100) kicked = true;
      }
      ok("the bot kicks a ball at its feet", kicked);
      ok("and kicks it toward the goal it is attacking",
         Math.sign(b.vz) === Math.sign(target) || Math.abs(b.vz) < 1,
         `vz ${b.vz.toFixed(0)} toward ${target}`);
    }

    // A dead bot does nothing at all.
    {
      startMatch();
      const bot = game.arena.fighters[1];
      bot.dead = true;
      game.arena.shots.length = 0;
      clearIntent();
      for (let i = 0; i < 50; i++) updateArenaCPU(bot, DT);
      ok("a dead bot neither moves nor fires",
         game.arena.shots.length === 0 && !intent[1].up && !intent[1].left &&
         !intent[1].right && !intent[1].down && intent[1].aimX === 0);
    }
    // Harder levels react faster than easier ones, per CPU_LEVELS.
    {
      ok("a harder bot reacts faster than an easier one",
         CPU_LEVELS[2].react < CPU_LEVELS[0].react);
      ok("and is more willing to close the distance",
         CPU_LEVELS[2].aggr > CPU_LEVELS[0].aggr);
      ok("and aims more accurately",
         CPU_LEVELS[2].err < CPU_LEVELS[0].err);
    }

    // Fighters cannot stand inside one another.
    {
      startMatch();
      const [a, b] = game.arena.fighters;
      a.x = 0; a.z = 0; a.y = 0;
      b.x = 4; b.z = 0; b.y = 0;
      separateFighters(a, b);
      ok("overlapping fighters are pushed apart",
         Math.hypot(b.x - a.x, b.z - a.z) >= FIGHTER_R * 2 - 1e-6,
         `${Math.hypot(b.x - a.x, b.z - a.z).toFixed(2)}`);
      // Exactly coincident must not produce NaN.
      a.x = 100; a.z = 100; b.x = 100; b.z = 100;
      separateFighters(a, b);
      ok("and exactly coincident fighters do not become NaN",
         [a.x, a.z, b.x, b.z].every(isFinite) &&
         Math.hypot(b.x - a.x, b.z - a.z) > 1);
    }

    // The scene step runs without throwing, and is deterministic.
    {
      /** Play `secs` of arena from a fixed start and fingerprint the result. */
      const play = (secs) => {
        game.mode = MODE.ARENA3D;
        game.cpu = [false, false];        // no bots: bots use Math.random
        game.sel = [0, 3];
        game.goalsToWin = 9;
        // Untimed, so the clock cannot end the run. startMatch derives matchSecs
        // from timeIdx, so the index is what must be set — index 0 is "no limit".
        game.timeIdx = 0;
        startMatch();
        const [a, b] = game.arena.fighters;
        a.x = -200; a.z = -200; a.yaw = 0.6;
        b.x = 200; b.z = 200; b.yaw = -2.2;
        const n = Math.round(secs / DT);
        for (let i = 0; i < n; i++) {
          // A fixed, reproducible input pattern for both seats.
          for (let s = 0; s < 2; s++) {
            const a2 = intent[s];
            a2.up = (i + s * 7) % 5 < 3;
            a2.left = (i + s) % 11 === 0;
            a2.right = (i + s) % 13 === 0;
            a2.jump = (i + s * 3) % 97 === 0;
            a2.dashEdge = (i + s * 5) % 211 === 0;
            a2.kick = (i + s * 9) % 41 === 0;
            a2.kickEdge = false;
            a2.aimX = ((i % 7) - 3) * 0.004;
            a2.aimY = ((i % 5) - 2) * 0.003;
          }
          stepArena3D(DT);
          if (!game.arena) break;
        }
        const A = game.arena;
        if (!A) return "ended";
        return A.fighters.map((f) =>
          [f.x, f.y, f.z, f.vx, f.vy, f.vz, f.yaw, f.pitch, f.hp]
            .map((v) => v.toFixed(6)).join(",")).join("|") +
          `#${A.frags.join("-")}`;
      };

      let threw = null;
      let first = null;
      try { first = play(4); } catch (e) { threw = e && e.message; }
      ok("the 3D scene steps without throwing", !threw, threw || "");
      ok("and the 3D simulation is deterministic", first === play(4),
         `${String(first).slice(0, 60)}`);
      ok("and it produced a finite world",
         !/NaN|Infinity/.test(String(first)), String(first).slice(0, 80));
    }

    // A full match against a bot must reach a winner and clean up after itself.
    {
      game.mode = MODE.ARENA3D;
      game.cpu = [false, true];
      game.cpuLevel = 2;
      game.sel = [0, 3];
      game.goalsToWin = 2;
      game.timeIdx = 0;                   // untimed: the frag target must end it
      startMatch();
      clearIntent();

      let guard = 0;
      // Drive the human seat to fire constantly; the bot fights back.
      while (game.scene === SCENE.ARENA3D && guard++ < 120000) {
        const A = game.arena;
        if (!A) break;
        const me = A.fighters[0], foe = A.fighters[1];
        // Aim at the opponent and hold the trigger.
        me.yaw = Math.atan2(foe.x - me.x, foe.z - me.z);
        me.pitch = 0;
        A.cover.length = 0;               // a clear duel, so it resolves
        intent[0].kick = true;
        me.fireCD = 0;
        stepArena3D(DT);
      }
      ok("a full 3D match reaches a winner", game.scene === SCENE.WIN,
         `${game.scene} after ${guard} steps`);
      ok("and names a real winner", game.winner === 0 || game.winner === 1,
         `${game.winner}`);
      ok("and tears the arena down when it ends", game.arena === null);
      ok("and released the mouse", !mouse.locked && !mouse.wantLock);
      /*
        The win screen must render after a 3D match. It used to be reachable with
        game.arena still populated when the match ended on the clock, which left
        a live 3D world behind a 2D scene.
      */
      ok("and the win screen renders afterwards",
         (() => { try { draw(); return true; } catch (e) { return false; } })());
    }

    // Time expiry must also end a 3D match, with the frag leader winning.
    {
      game.mode = MODE.ARENA3D;
      game.cpu = [false, true];
      game.sel = [0, 3];
      game.goalsToWin = 99;
      /*
        The clock comes from TIME_OPTIONS[timeIdx] — startMatch sets matchSecs
        from it, so setting matchSecs directly here would simply be overwritten.
        Index 1 is the shortest real time limit.
      */
      game.timeIdx = 1;
      startMatch();
      ok("a timed 3D match starts with a clock",
         game.clock > 0 && game.matchSecs === TIME_OPTIONS[1],
         `clock ${game.clock} secs ${game.matchSecs}`);
      game.arena.frags = [1, 4];
      game.score = [1, 4];
      game.clock = 0.05;                  // wind it down rather than simulating a minute
      clearIntent();
      let guard = 0;
      while (game.scene === SCENE.ARENA3D && guard++ < 1000) stepArena3D(DT);
      ok("a timed 3D match ends when the clock runs out",
         game.scene === SCENE.WIN, `${game.scene}`);
      ok("and the frag leader wins on time", game.winner === 1, `${game.winner}`);
      ok("and the arena is gone afterwards", game.arena === null);
    }

    clearIntent();
    Object.assign(game, saved);
    game.particles = [];
  }

  // 24n. 3D SOCCER: the ball, the goals, and goals as the win condition.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, score: [...game.score], winner: game.winner,
                    goalsToWin: game.goalsToWin, timeIdx: game.timeIdx,
                    cpuLevel: game.cpuLevel, board: game.board };
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];
    game.timeIdx = 0;
    startMatch();

    // The match starts with a ball on the centre spot and no score.
    ok("a 3D match starts with a ball", !!game.arena.ball);
    ok("on the centre spot", near(game.arena.ball.x, 0, 1e-9) &&
       near(game.arena.ball.z, 0, 1e-9));
    ok("and a goalless scoreline",
       game.arena.goals[0] === 0 && game.arena.goals[1] === 0);

    // Goal detection: the same rule the 2D game uses.
    {
      const at = (x, y, z) => ({ x, y, z, r: A_BALL_R });
      ok("a ball in side 0's net concedes for side 0",
         arenaGoalScored(at(0, 40, -ARENA_HD - 10)) === 0);
      ok("a ball in side 1's net concedes for side 1",
         arenaGoalScored(at(0, 40, ARENA_HD + 10)) === 1);
      ok("a ball in midfield is no goal",
         arenaGoalScored(at(0, 40, 0)) === -1);
      ok("a ball wide of the post is no goal",
         arenaGoalScored(at(A_GOAL_W / 2 + 30, 40, -ARENA_HD - 10)) === -1);
      ok("a ball over the bar is no goal",
         arenaGoalScored(at(0, A_GOAL_H + 30, -ARENA_HD - 10)) === -1);
      ok("a ball short of the line is no goal",
         arenaGoalScored(at(0, 40, -ARENA_HD + 40)) === -1);
      ok("and just inside the line IS a goal",
         arenaGoalScored(at(0, 40, -ARENA_HD)) === 0);
    }

    // Scoring: the scoreline, the win condition, and the kickoff reset.
    {
      startMatch();
      game.goalsToWin = 3;
      arenaGoal(1);                       // side 1 concedes
      ok("a goal credits the other side", game.arena.goals[0] === 1);
      ok("and mirrors onto the shared scoreline", game.score[0] === 1);
      ok("and the conceding side gets nothing", game.arena.goals[1] === 0);
      ok("and play is reset to the centre spot",
         near(game.arena.ball.x, 0, 1e-9) && near(game.arena.ball.z, 0, 1e-9));
      ok("and a celebration is shown", game.arena.celebrate > 0);
      ok("and conceding charges the loser's superpower",
         game.arena.fighters[1].superCharge > 0);
    }

    // The ball obeys the world: floor, walls, posts, and no escaping.
    {
      startMatch();
      const b = game.arena.ball;
      // Dropped from height, it settles on the floor.
      b.x = 0; b.y = 400; b.z = 0; b.vx = b.vy = b.vz = 0;
      for (let i = 0; i < Math.round(4 / DT); i++) stepArenaBall(DT);
      ok("a dropped ball settles on the floor",
         b.y >= b.r - 1e-6 && b.y < b.r + 4, `y=${b.y.toFixed(2)}`);
      ok("and stops bouncing", Math.abs(b.vy) < 40, `vy=${b.vy.toFixed(1)}`);

      // Fired at a side wall, it comes back.
      /*
        Timed to catch the FIRST rebound: 1.4s let it cross the pitch and bounce
        off the far wall as well, which read as no rebound at all.
      */
      b.x = 0; b.y = 60; b.z = 0; b.vx = 1600; b.vy = 0; b.vz = 0;
      for (let i = 0; i < Math.round(0.45 / DT); i++) stepArenaBall(DT);
      ok("a ball fired at a side wall rebounds", b.vx < 0, `vx=${b.vx.toFixed(0)}`);
      ok("and never leaves the pitch",
         Math.abs(b.x) <= ARENA_HW && Math.abs(b.z) <= ARENA_HD + A_GOAL_D + 1,
         `${b.x.toFixed(0)},${b.z.toFixed(0)}`);

      // A hard shot into the net is stopped by the back of it, not lost.
      b.x = 0; b.y = 50; b.z = 0; b.vx = 0; b.vy = 0; b.vz = -A_BALL_MAX_V;
      let scored = -1;
      for (let i = 0; i < Math.round(2 / DT); i++) {
        stepArenaBall(DT);
        if (scored < 0) scored = arenaGoalScored(b);
      }
      ok("a shot into the mouth crosses the line", scored === 0, `${scored}`);
      ok("and is stopped by the back of the net",
         b.z >= -ARENA_HD - A_GOAL_D, `z=${b.z.toFixed(0)}`);

      // Off the post, not through it.
      b.x = A_GOAL_W / 2; b.y = 50; b.z = -ARENA_HD + 200;
      b.vx = 0; b.vy = 0; b.vz = -1400;
      for (let i = 0; i < Math.round(0.6 / DT); i++) stepArenaBall(DT);
      ok("a ball striking a post is deflected, not passed through",
         Math.abs(b.vx) > 0 || b.vz > -1400, `vx=${b.vx.toFixed(0)} vz=${b.vz.toFixed(0)}`);

      // No input can make the ball non-finite.
      let bad = null;
      for (let i = 0; i < 2000 && !bad; i++) {
        if (i % 200 === 0) {
          b.vx = ((i % 3) - 1) * A_BALL_MAX_V;
          b.vy = ((i % 5) - 2) * 800;
          b.vz = ((i % 7) - 3) * A_BALL_MAX_V;
        }
        stepArenaBall(DT);
        if (![b.x, b.y, b.z, b.vx, b.vy, b.vz].every(isFinite)) bad = `step ${i}`;
      }
      ok("the ball can never become non-finite", !bad, bad || "");
    }

    // Kicking: in range it launches the ball, out of range it does not.
    {
      startMatch();
      const f = game.arena.fighters[0];
      const b = game.arena.ball;
      Object.assign(f, { x: 0, y: 0, z: -60, yaw: 0, pitch: 0, vx: 0, vy: 0, vz: 0,
                         kickCD: 0 });
      Object.assign(b, { x: 0, y: b.r, z: 0, vx: 0, vy: 0, vz: 0 });
      ok("a ball in front of the player can be kicked", kickArenaBall(f));
      ok("and it leaves at speed", Math.hypot(b.vx, b.vy, b.vz) > A_KICK_V * 0.6,
         `${Math.hypot(b.vx, b.vy, b.vz).toFixed(0)}`);
      ok("downfield, in the direction of the kick", b.vz > 0, `vz=${b.vz.toFixed(0)}`);
      ok("and with some lift, so it is not scuffed along the floor", b.vy > 0);
      ok("a kick respects its cooldown", !kickArenaBall(f));

      // Out of reach: no kick.
      f.kickCD = 0;
      Object.assign(b, { x: 0, y: b.r, z: 600, vx: 0, vy: 0, vz: 0 });
      ok("a ball out of reach cannot be kicked", !kickArenaBall(f));
      ok("and it stays where it was", b.vz === 0);

      // Aim decides the shot: pitching up lofts it.
      f.kickCD = 0;
      Object.assign(b, { x: 0, y: b.r, z: 0, vx: 0, vy: 0, vz: 0 });
      f.z = -60; f.pitch = PITCH_MAX * 0.8;
      kickArenaBall(f);
      const loftedVy = b.vy;
      f.kickCD = 0;
      Object.assign(b, { x: 0, y: b.r, z: 0, vx: 0, vy: 0, vz: 0 });
      f.pitch = 0;
      kickArenaBall(f);
      ok("aiming up lofts the ball higher than aiming level",
         loftedVy > b.vy, `${loftedVy.toFixed(0)} vs ${b.vy.toFixed(0)}`);
      ok("and the kicker is recorded as the last touch", b.lastTouch === f.seat);
    }

    // Dribbling: walking into the ball moves it.
    {
      startMatch();
      const f = game.arena.fighters[0];
      const b = game.arena.ball;
      Object.assign(f, { x: 0, y: 0, z: -60, yaw: 0, vx: 0, vy: 0, vz: 260 });
      Object.assign(b, { x: 0, y: b.r, z: 0, vx: 0, vy: 0, vz: 0 });
      fighterVsArenaBall(f);
      ok("running into the ball pushes it along", b.vz > 0, `vz=${b.vz.toFixed(0)}`);
      ok("and never leaves it inside the player",
         Math.hypot(b.x - f.x, b.z - f.z) >= FIGHTER_R + b.r - 1e-6);
    }

    /*
      NO WALLHACK. The renderer has no depth buffer, so every sprite drawn after
      the world must test its own occlusion. Cover you can see through is not
      cover, and this was a real defect in the first version of the mode.
    */
    {
      startMatch();
      const c = game.arena.cover[0];
      // A camera on one side of a box, a target on the other.
      const cam = { pos: v3(c.x, c.y, c.z - 320), yaw: 0, pitch: 0 };
      ok("a point behind cover is occluded",
         occludedFromCam(v3(c.x, c.y, c.z + 320), cam));
      ok("a point in the open is not occluded",
         occludedFromCam(v3(c.x + 600, c.y, c.z + 320), cam) === false);
      ok("a point in front of the cover is not occluded",
         occludedFromCam(v3(c.x, c.y, c.z - 160), cam) === false);
      ok("a point above low cover is not occluded",
         occludedFromCam(v3(c.x, c.y + c.hh + 80, c.z + 320), cam) === false);
      // And it must not report occlusion with no arena, which would hide
      // everything the instant a match ended.
      const keep = game.arena;
      game.arena = null;
      ok("occlusion reports nothing without an arena",
         occludedFromCam(v3(0, 0, 0), cam) === false);
      game.arena = keep;
    }

    // A full 3D soccer match must reach a winner on GOALS.
    {
      game.mode = MODE.ARENA3D;
      game.cpu = [false, true];
      game.cpuLevel = 2;
      game.sel = [0, 3];
      game.goalsToWin = 2;
      game.timeIdx = 0;
      startMatch();
      clearIntentAll();

      let guard = 0;
      while (game.scene === SCENE.ARENA3D && guard++ < 200000) {
        const A = game.arena;
        if (!A) break;
        // Drive seat 0 straight at the ball and kick it goalward.
        const me = A.fighters[0], b = A.ball;
        const target = aGoalLineZ(1);
        const near2 = Math.hypot(b.x - me.x, b.z - me.z) < FIGHTER_R + b.r + 40;
        if (near2) {
          me.yaw = Math.atan2(0 - me.x, target - me.z);
          me.pitch = 0;
          me.kickCD = 0;
          kickArenaBall(me);
        } else {
          // Walk to a point just behind the ball, on the defensive side.
          const bx = b.x, bz = b.z - Math.sign(target) * 40;
          me.yaw = Math.atan2(bx - me.x, bz - me.z);
          const step2 = moveBasis(me.yaw);
          me.vx = step2.fwd.x * F_MAXV;
          me.vz = step2.fwd.z * F_MAXV;
        }
        stepArena3D(DT);
      }
      ok("a full 3D soccer match reaches a winner", game.scene === SCENE.WIN,
         `${game.scene} after ${guard} steps`);
      ok("and it was won on goals",
         game.winner === 0 || game.winner === 1, `${game.winner}`);
      ok("and the arena is torn down", game.arena === null);
      ok("and the win screen renders",
         (() => { try { draw(); return true; } catch (e) { return false; } })());
    }

    clearIntentAll();
    Object.assign(game, saved);
    game.particles = [];
  }

  /* ---------------------------------------------------------------------
     RELAY TRANSPORT

     Address-based multiplayer: one player runs tools/relay.js, the other types
     the address. Tested through a scriptable WebSocket, so the parsing, the
     control protocol and the channel shim are all exercised without a socket.
     Skipped where the harness provides no WebSocket at all.
     ------------------------------------------------------------------- */
  if (typeof WebSocket === "function") {
    // 25a. Address parsing. People will paste all of these shapes.
    {
      ok("a bare host gets the default port",
         relayUrl("192.168.1.20") === `ws://192.168.1.20:${RELAY_PORT_DEFAULT}`,
         relayUrl("192.168.1.20"));
      ok("an explicit port is kept",
         relayUrl("192.168.1.20:9000") === "ws://192.168.1.20:9000",
         relayUrl("192.168.1.20:9000"));
      ok("localhost works", relayUrl("localhost:8787") === "ws://localhost:8787");
      ok("an http URL becomes ws",
         relayUrl("http://box.local:8787") === "ws://box.local:8787");
      ok("an https URL becomes wss, so a tunnel just works",
         relayUrl("https://foo.trycloudflare.com") === "wss://foo.trycloudflare.com",
         relayUrl("https://foo.trycloudflare.com"));
      ok("a ws URL is passed through",
         relayUrl("ws://1.2.3.4:5") === "ws://1.2.3.4:5");
      ok("a wss URL is passed through",
         relayUrl("wss://a.example/x") === "wss://a.example/x");
      /*
        A public hostname with no port is assumed to be a tunnel on https: plain
        ws:// to it would be blocked or refused, which would look like the game
        being broken rather than the address needing a scheme.
      */
      ok("a bare tunnel hostname is assumed to be wss",
         relayUrl("nice-name.trycloudflare.com").startsWith("wss://"),
         relayUrl("nice-name.trycloudflare.com"));
      ok("trailing slashes are tolerated",
         relayUrl("1.2.3.4:99/") === "ws://1.2.3.4:99",
         relayUrl("1.2.3.4:99/"));
      ok("an empty address yields nothing to connect to", relayUrl("  ") === "");
      ok("and whitespace around a real address is trimmed",
         relayUrl("  1.2.3.4:99  ") === "ws://1.2.3.4:99");
    }

    // 25b. Hosting: open a room, publish the code, go live when a peer joins.
    {
      const savedNet = { ...net };
      WebSocketSpy.made.length = 0;

      relayHost("localhost:8787");
      const ws = WebSocketSpy.made[WebSocketSpy.made.length - 1];
      ok("hosting by address opens a socket", !!ws, "no socket");
      ok("to the resolved URL", ws.url === "ws://localhost:8787", ws.url);
      ok("and this machine is the host on seat 0",
         net.role === "host" && net.localSeat === 0 && net.remoteSeat === 1);
      ok("and it reports the relay transport", net.transport === "relay");

      ws._open();
      ok("opening the socket asks the relay for a room",
         ws.sent.length === 1 && JSON.parse(ws.sent[0]).t === "host",
         ws.sent.join());
      /*
        The socket being open does NOT mean a match is live: nobody has joined
        yet. Claiming "live" here was the bug this assertion exists to prevent.
      */
      ok("but an open socket alone is not a live match",
         net.state !== "live" && !net.active, net.state);

      ws._recv({ t: "hosting", code: "WXYZ" });
      ok("the relay's code is shown to the player", net.relayCode === "WXYZ");
      ok("and the host is waiting for someone", net.state === "offer", net.state);

      ws._recv({ t: "peer-joined" });
      ok("a peer joining makes the match live", net.state === "live" && net.active);
      ok("and the host greets them immediately",
         ws.sent.some((m) => { try { return JSON.parse(m).t === "hi"; }
                              catch (e) { return false; } }),
         ws.sent.join(" "));

      ws._recv({ t: "peer-left", why: "they closed the tab" });
      ok("the other player leaving ends the match",
         net.state === "closed" && !net.active);
      ok("and says why", /closed the tab/.test(net.error), net.error);

      netReset();
      Object.assign(net, savedNet);
    }

    // 25c. Joining: by address and code, including the ways it can fail.
    {
      const savedNet = { ...net };
      WebSocketSpy.made.length = 0;

      relayJoin("10.0.0.5:8787", "abcd");
      const ws = WebSocketSpy.made[WebSocketSpy.made.length - 1];
      ok("joining by address opens a socket", !!ws);
      ok("and this machine is the guest on seat 1",
         net.role === "guest" && net.localSeat === 1 && net.remoteSeat === 0);
      ws._open();
      const asked = JSON.parse(ws.sent[0]);
      ok("it asks to join the room", asked.t === "join");
      ok("with the code upper-cased, so typing case does not matter",
         asked.code === "ABCD", asked.code);

      ws._recv({ t: "joined", code: "ABCD" });
      ok("being admitted moves it to connecting", net.state === "connecting");
      ws._recv({ t: "peer-joined" });
      ok("and the handshake makes it live", net.state === "live" && net.active);

      // A wrong code must say so plainly.
      netReset();
      relayJoin("10.0.0.5:8787", "ZZZZ");
      const ws2 = WebSocketSpy.made[WebSocketSpy.made.length - 1];
      ws2._open();
      ws2._recv({ t: "no-room", code: "ZZZZ" });
      ok("an unknown code fails with a readable message",
         net.state === "failed" && /ZZZZ/.test(net.error), net.error);

      netReset();
      relayJoin("10.0.0.5:8787", "FULL");
      const ws3 = WebSocketSpy.made[WebSocketSpy.made.length - 1];
      ws3._open();
      ws3._recv({ t: "room-full", code: "FULL" });
      ok("a full room fails with a readable message",
         net.state === "failed" && /two players/.test(net.error), net.error);

      netReset();
      relayJoin("10.0.0.5:8787", "");
      ok("joining without a code is refused before opening a socket",
         net.state === "failed" && /code/.test(net.error), net.error);

      netReset();
      Object.assign(net, savedNet);
    }

    // 25d. The shim: game traffic reaches the protocol, control messages do not.
    {
      const savedNet = { ...net };
      WebSocketSpy.made.length = 0;
      relayHost("localhost:8787");
      const ws = WebSocketSpy.made[WebSocketSpy.made.length - 1];
      ws._open();
      ws._recv({ t: "hosting", code: "QRST" });
      ws._recv({ t: "peer-joined" });

      // A control message must NOT be handed to the game protocol.
      const before = net.peerVersion;
      ws._recv({ t: "hosting", code: "OTHER" });
      ok("a relay control message is consumed by the relay, not the game",
         net.peerVersion === before);

      // A game message MUST reach the protocol: a hello sets the peer version.
      ws._recv({ t: "hi", n: "OTHER PLAYER", v: VERSION });
      ok("a game message reaches the protocol through the relay",
         net.peerVersion === VERSION, net.peerVersion);
      ok("and the peer's name arrives with it",
         game.remoteName === "OTHER PLAYER", `${game.remoteName}`);

      // The two namespaces must not overlap, or a game message could be eaten.
      const gameNames = ["hi", "s", "i", "cfg", "br", "me", "hb", "go"];
      ok("no game message name collides with a relay control name",
         gameNames.every((n) => !RELAY_CONTROL.has(n)),
         gameNames.filter((n) => RELAY_CONTROL.has(n)).join());

      netReset();
      Object.assign(net, savedNet);
      game.remoteName = "";
    }

    // 25e. Failure and teardown must leave nothing behind.
    {
      const savedNet = { ...net };
      WebSocketSpy.made.length = 0;

      relayHost("localhost:8787");
      const ws = WebSocketSpy.made[WebSocketSpy.made.length - 1];
      ws._open();
      ws._recv({ t: "hosting", code: "ABCD" });
      netReset();
      ok("resetting closes the relay socket", ws.readyState === 3);
      ok("and clears the room code", net.relayCode === "");
      ok("and returns to the default transport", net.transport === "webrtc");
      ok("and drops the socket reference", net.ws === null);
      /*
        The typed ADDRESS is deliberately kept: retyping the host's address after
        every failed attempt would be needless friction.
      */
      ok("but remembers the address the player typed",
         net.relayAddr === "localhost:8787", net.relayAddr);

      // A socket that refuses to construct must fail cleanly, not throw.
      WebSocketSpy.throwOnConstruct = true;
      let threw = null;
      try { relayHost("localhost:8787"); } catch (e) { threw = e.message; }
      WebSocketSpy.throwOnConstruct = false;
      ok("a socket that cannot be created fails cleanly", !threw, threw || "");
      ok("and says so", net.state === "failed" && !!net.error, net.error);

      netReset();
      Object.assign(net, savedNet);
      net.relayAddr = "";
    }
  }

  // 25z. 3D shots must move the BALL, not pass through it.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, timeIdx: game.timeIdx, goalsToWin: game.goalsToWin };
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];
    game.timeIdx = 0;
    game.goalsToWin = 9;

    /** A fighter aiming down the pitch at a ball sitting on the centre spot. */
    const shooter = () => {
      startMatch();
      const f = game.arena.fighters[0];
      Object.assign(f, { x: 0, y: 0, z: -300, yaw: 0, pitch: 0,
                         vx: 0, vy: 0, vz: 0, fireCD: 0 });
      Object.assign(game.arena.ball,
        { x: 0, y: A_BALL_R, z: 0, vx: 0, vy: 0, vz: 0 });
      game.arena.cover.length = 0;
      return [f, game.arena.ball];
    };

    {
      const [f, b] = shooter();
      // Aim slightly up, at the middle of the ball rather than its base.
      f.pitch = Math.atan2(A_BALL_R - EYE_H, 300);
      fireShot(f);
      for (let i = 0; i < 60 && game.arena.shots.length; i++) stepShots(DT);
      ok("a shot moves the ball", Math.hypot(b.vx, b.vy, b.vz) > 100,
         `speed ${Math.hypot(b.vx, b.vy, b.vz).toFixed(0)}`);
      ok("downfield, in the direction the shot travelled", b.vz > 0,
         `vz=${b.vz.toFixed(0)}`);
      ok("and lifts it off the floor", b.vy > 0, `vy=${b.vy.toFixed(0)}`);
      ok("and the shot is consumed", game.arena.shots.length === 0);
      ok("and the shooter is credited with the touch", b.lastTouch === f.seat);
    }
    // A shot is weaker than a kick, so running at the ball still matters.
    {
      const [f, b] = shooter();
      f.pitch = Math.atan2(A_BALL_R - EYE_H, 300);
      fireShot(f);
      for (let i = 0; i < 60 && game.arena.shots.length; i++) stepShots(DT);
      const shotSpeed = Math.hypot(b.vx, b.vy, b.vz);
      const [f2, b2] = shooter();
      Object.assign(f2, { z: -60, kickCD: 0 });
      kickArenaBall(f2);
      const kickSpeed = Math.hypot(b2.vx, b2.vy, b2.vz);
      ok("shooting the ball is weaker than kicking it", shotSpeed < kickSpeed,
         `shot ${shotSpeed.toFixed(0)} vs kick ${kickSpeed.toFixed(0)}`);
    }
    // A shot wide of the ball leaves it alone.
    {
      const [f, b] = shooter();
      b.x = 400;                          // well off the line of fire
      fireShot(f);
      for (let i = 0; i < 60 && game.arena.shots.length; i++) stepShots(DT);
      ok("a shot wide of the ball does not move it",
         Math.hypot(b.vx, b.vy, b.vz) < 1e-6);
    }
    // A CARRIED ball is not shootable: the carrier takes the hit instead.
    {
      const [f] = shooter();
      const foe = game.arena.fighters[1];
      Object.assign(foe, { x: 0, y: 0, z: 0, yaw: 0, pitch: 0,
                           vx: 0, vy: 0, vz: 0, grabCD: 0 });
      const p = carryPoint(foe);
      Object.assign(game.arena.ball, { x: p.x, y: p.y, z: p.z });
      grabBall(foe);
      ok("the opponent is holding the ball", isCarrying(foe));
      f.pitch = Math.atan2(FIGHTER_H * 0.5 - EYE_H, 300);
      f.fireCD = 0;
      fireShot(f);
      for (let i = 0; i < 60 && game.arena.shots.length; i++) stepShots(DT);
      ok("a shot at a carried ball hits the carrier instead",
         foe.hp < HP_MAX, `hp ${foe.hp}`);
    }
    // A fast shot must not tunnel past the ball between substeps.
    {
      const [f, b] = shooter();
      f.pitch = Math.atan2(A_BALL_R - EYE_H, 300);
      fireShot(f);
      stepShots(0.25);                    // one oversized step
      ok("a fast shot cannot tunnel through the ball",
         Math.hypot(b.vx, b.vy, b.vz) > 1, `${Math.hypot(b.vx, b.vy, b.vz).toFixed(1)}`);
    }
    // And a shot can score, which is the point of the whole change.
    {
      const [f, b] = shooter();
      Object.assign(f, { z: ARENA_HD - 400 });
      Object.assign(b, { x: 0, y: A_BALL_R, z: ARENA_HD - 120, vx: 0, vy: 0, vz: 0 });
      f.pitch = Math.atan2(A_BALL_R - EYE_H, 280);
      f.fireCD = 0;
      fireShot(f);
      let scored = -1;
      for (let i = 0; i < Math.round(3 / DT) && scored < 0; i++) {
        stepShots(DT);
        if (game.arena.carriedBy < 0) stepArenaBall(DT);
        scored = arenaGoalScored(b);
      }
      ok("a ball shot over the line scores", scored === 1, `${scored}`);
    }

    endArena3D();
    Object.assign(game, saved);
    game.particles = [];
  }

  // 26a. 3D GRAB and THROW.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, score: [...game.score], timeIdx: game.timeIdx,
                    goalsToWin: game.goalsToWin };
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];
    game.timeIdx = 0;

    /** A fighter facing +z with the ball right in front of them. */
    const setup = () => {
      startMatch();
      const f = game.arena.fighters[0];
      const b = game.arena.ball;
      Object.assign(f, { x: 0, y: 0, z: -60, yaw: 0, pitch: 0,
                         vx: 0, vy: 0, vz: 0, grabCD: 0, grabT: 0 });
      const p = carryPoint(f);
      Object.assign(b, { x: p.x, y: p.y, z: p.z, vx: 0, vy: 0, vz: 0 });
      return [f, b];
    };

    {
      const [f, b] = setup();
      ok("a ball in front of the player can be grabbed", grabBall(f));
      ok("and the arena records who holds it", game.arena.carriedBy === f.seat);
      ok("and isCarrying agrees", isCarrying(f));
      ok("and the hold timer starts", near(f.grabT, A_GRAB_T, 1e-9));
      ok("and the ball stops moving", b.vx === 0 && b.vy === 0 && b.vz === 0);
      ok("a second grab while holding is refused", !grabBall(f));
      ok("and the opponent cannot grab it either",
         !grabBall(game.arena.fighters[1]));
    }

    // A held ball travels with the carrier rather than obeying gravity.
    {
      const [f, b] = setup();
      grabBall(f);
      f.x = 300; f.z = 200; f.yaw = 1.1;
      stepCarry(DT);
      const p = carryPoint(f);
      ok("a held ball follows the carrier",
         near(b.x, p.x, 1e-6) && near(b.z, p.z, 1e-6),
         `${b.x.toFixed(1)},${b.z.toFixed(1)} vs ${p.x.toFixed(1)},${p.z.toFixed(1)}`);
      ok("and does not fall while held",
         (() => { const y0 = b.y;
                  for (let i = 0; i < 60; i++) stepCarry(DT);
                  return Math.abs(b.y - y0) < 1e-6; })());
      ok("and never sinks below its own radius",
         (() => { f.y = 0; f.pitch = -PITCH_MAX;
                  stepCarry(DT); return b.y >= b.r - 1e-9; })());
    }

    // Throwing sends it along the look direction, and starts a cooldown.
    {
      const [f, b] = setup();
      grabBall(f);
      f.yaw = 0; f.pitch = 0;
      ok("throwing releases the ball", releaseBall(f, true));
      ok("and nobody holds it any more", game.arena.carriedBy === -1);
      ok("and it leaves downfield at speed",
         b.vz > A_THROW_V * 0.7, `vz=${b.vz.toFixed(0)}`);
      ok("with some lift", b.vy > 0);
      ok("and a grab cooldown starts", near(f.grabCD, A_GRAB_CD, 1e-9));
      ok("so an immediate re-grab is refused", !grabBall(f));
      ok("and a throw with nothing held does nothing", !releaseBall(f, true));
    }
    // Aim decides the throw, exactly as it decides a kick.
    {
      const [f, b] = setup();
      grabBall(f);
      f.pitch = PITCH_MAX * 0.8;
      releaseBall(f, true);
      const high = b.vy;
      const [f2, b2] = setup();
      grabBall(f2);
      f2.pitch = 0;
      releaseBall(f2, true);
      ok("throwing while aiming up lofts it higher",
         high > b2.vy, `${high.toFixed(0)} vs ${b2.vy.toFixed(0)}`);
    }

    // The hold expires, and a knockdown drops the ball.
    {
      const [f] = setup();
      grabBall(f);
      for (let i = 0; i < Math.round((A_GRAB_T + 0.1) / DT); i++) stepCarry(DT);
      ok("a hold expires on its own", game.arena.carriedBy === -1);
      ok("and the ball is dropped, not thrown",
         Math.hypot(game.arena.ball.vx, game.arena.ball.vz) < 200);
    }
    {
      const [f] = setup();
      grabBall(f);
      f.dead = true;
      stepCarry(DT);
      ok("a knocked-down carrier loses the ball", game.arena.carriedBy === -1);
    }
    // Being shot while carrying must also lose it, through the same path.
    {
      const [f] = setup();
      grabBall(f);
      for (let i = 0; i < 4; i++) applyDamage(f, SHOT_DMG, 1);
      stepCarry(DT);
      ok("shooting a carrier makes them drop the ball",
         game.arena.carriedBy === -1);
    }
    // A goal can be scored from a throw.
    {
      const [f, b] = setup();
      grabBall(f);
      f.z = ARENA_HD - 300;
      f.yaw = 0; f.pitch = 0;
      releaseBall(f, true);
      let scored = -1;
      for (let i = 0; i < Math.round(2 / DT) && scored < 0; i++) {
        stepArenaBall(DT);
        scored = arenaGoalScored(b);
      }
      ok("a thrown ball can score", scored === 1, `${scored}`);
    }
    // The rule toggle switches it off entirely.
    {
      const [f] = setup();
      game.rules.grab = false;
      ok("grab can be switched off in the rules", !grabBall(f));
      game.rules.grab = true;
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 26b. 3D JETPACK.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, timeIdx: game.timeIdx };
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];
    game.timeIdx = 0;
    startMatch();

    {
      const f = game.arena.fighters[0];
      Object.assign(f, { x: 0, y: 100, z: 0, vx: 0, vy: 0, vz: 0,
                         onGround: false, jet: A_JET_MAX });
      stepJetpack(f, true, DT);
      ok("thrusting pushes the fighter upward", f.vy > 0, `${f.vy.toFixed(1)}`);
      ok("and burns fuel", f.jet < A_JET_MAX);
      ok("and counts as airborne", !f.onGround);

      // Held indefinitely, the climb is CAPPED — a jetpack you can ride out of
      // the arena is an exit, not an ability.
      for (let i = 0; i < 400; i++) stepJetpack(f, true, DT);
      ok("upward speed is capped", f.vy <= A_JET_VMAX + 1e-6, `${f.vy.toFixed(1)}`);
      ok("and the fuel runs out", f.jet === 0);
      const vy0 = f.vy;
      stepJetpack(f, true, DT);
      ok("an empty jetpack gives no thrust", f.vy <= vy0 + 1e-9);
    }
    // Fuel refills on the ground, and only on the ground.
    {
      const f = game.arena.fighters[0];
      Object.assign(f, { y: 0, vy: 0, onGround: true, jet: 0 });
      for (let i = 0; i < Math.round(1 / DT); i++) stepJetpack(f, false, DT);
      ok("fuel refills on the ground", f.jet > 0, `${f.jet.toFixed(2)}`);
      ok("and never past full",
         (() => { for (let i = 0; i < 2000; i++) stepJetpack(f, false, DT);
                  return near(f.jet, A_JET_MAX, 1e-9); })());
      Object.assign(f, { y: 200, onGround: false, jet: 0.5 });
      const j0 = f.jet;
      for (let i = 0; i < 60; i++) stepJetpack(f, false, DT);
      ok("but not in mid-air", near(f.jet, j0, 1e-9), `${f.jet}`);
    }
    // A jetpack cannot lift a fighter out of the room: arenaBounds still holds.
    {
      const f = game.arena.fighters[0];
      Object.assign(f, { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, jet: 999 });
      const a = { left: false, right: false, up: false, down: false,
                  aimX: 0, aimY: 0, jump: true, dashEdge: false, superEdge: false };
      for (let i = 0; i < 1200; i++) { stepJetpack(f, true, DT); stepFighter(f, a, DT); }
      ok("a jetpack cannot fly out through the ceiling",
         f.y <= ARENA_WALL_H - FIGHTER_H + 1e-6, `y=${f.y.toFixed(1)}`);
    }
    // And the rule toggle disables it.
    {
      const f = game.arena.fighters[0];
      Object.assign(f, { y: 100, vy: 0, onGround: false, jet: A_JET_MAX });
      game.rules.jetpack = false;
      stepJetpack(f, true, DT);
      ok("the jetpack can be switched off in the rules", f.vy === 0);
      game.rules.jetpack = true;
    }

    endArena3D();
    Object.assign(game, saved);
    game.particles = [];
  }

  // 26c. 3D WALL BUILDING.
  {
    const saved = { arena: game.arena, mode: game.mode, scene: game.scene,
                    players: game.players, cpu: [...game.cpu], sel: [...game.sel],
                    ball: game.ball, timeIdx: game.timeIdx };
    game.mode = MODE.ARENA3D;
    game.cpu = [false, true];
    game.sel = [0, 3];
    game.timeIdx = 0;

    const midfielder = () => {
      startMatch();
      const f = game.arena.fighters[0];
      Object.assign(f, { x: 0, y: 0, z: 0, yaw: 0, pitch: 0,
                         vx: 0, vy: 0, vz: 0, wallCD: 0,
                         wallCharges: A_WALL_CHARGES });
      return f;
    };

    {
      const f = midfielder();
      ok("a player in midfield may build", arenaCanBuild(f));
      const w = arenaBuildWall(f);
      ok("building raises a wall", !!w && game.arena.walls.length === 1);
      ok("in front of the builder", w.z > f.z, `${w.z} vs ${f.z}`);
      ok("owned by them", w.owner === f.seat);
      ok("and it costs a charge", f.wallCharges === A_WALL_CHARGES - 1);
      ok("and starts a build cooldown", f.wallCD > 0);
      ok("so an immediate second build is refused", !arenaBuildWall(f));
      f.wallCD = 0;
      ok("but allowed once the cooldown clears", !!arenaBuildWall(f));
      f.wallCD = 0;
      ok("up to the charge limit, and no further",
         !arenaBuildWall(f) && game.arena.walls.length === A_WALL_CHARGES,
         `${game.arena.walls.length}`);
    }

    /*
      THE GOALMOUTH RULE. A wall on a goal line would make that goal unscoreable,
      so building near either line is refused outright.
    */
    {
      const f = midfielder();
      f.z = ARENA_HD - 60;                 // right on top of the far goal
      f.yaw = 0;
      ok("building into a goalmouth is refused", !arenaCanBuild(f));
      ok("and no wall appears", arenaBuildWall(f) === null);
      f.z = -ARENA_HD + 60;                // and the near one
      f.yaw = Math.PI;
      ok("the same holds at the other end", !arenaCanBuild(f));
    }

    // Walls are solid to the ball, and to players.
    {
      const f = midfielder();
      const w = arenaBuildWall(f);
      w.born = 1;
      const b = game.arena.ball;
      Object.assign(b, { x: w.x, y: w.hh, z: w.z - 220, vx: 0, vy: 0, vz: 900 });
      for (let i = 0; i < Math.round(0.6 / DT); i++) stepArenaBall(DT);
      ok("a wall bounces the ball back", b.vz < 0, `vz=${b.vz.toFixed(0)}`);
      ok("and the ball never ends up inside it",
         !(Math.abs(b.x - w.x) < w.hw && Math.abs(b.z - w.z) < w.hd &&
           Math.abs(b.y - w.y) < w.hh));
    }
    {
      const f = midfielder();
      const w = arenaBuildWall(f);
      w.born = 1;
      const other = game.arena.fighters[1];
      Object.assign(other, { x: w.x, y: 0, z: w.z - 200, yaw: 0, vx: 0, vy: 0, vz: 0 });
      const a = { left: false, right: false, up: true, down: false,
                  aimX: 0, aimY: 0, jump: false, dashEdge: false, superEdge: false };
      for (let i = 0; i < Math.round(2 / DT); i++) stepFighter(other, a, DT);
      const inside = Math.abs(other.x - w.x) < w.hw + FIGHTER_R - 1 &&
                     Math.abs(other.z - w.z) < w.hd + FIGHTER_R - 1 &&
                     other.y < w.y + w.hh - 1;
      ok("a wall blocks a player from walking through it", !inside,
         `${other.x.toFixed(0)},${other.z.toFixed(0)},${other.y.toFixed(0)}`);
    }
    // And they block sight, so they are real cover.
    {
      const f = midfielder();
      const w = arenaBuildWall(f);
      w.born = 1;
      ok("a wall blocks a sight line",
         segmentHitsCover(v3(w.x, w.hh, w.z - 200), v3(w.x, w.hh, w.z + 200)));
    }

    // Walls expire, break under fire, and recharge their builder.
    {
      const f = midfielder();
      arenaBuildWall(f);
      for (let i = 0; i < Math.round((A_WALL_LIFE + 0.2) / DT); i++) stepArenaWalls(DT);
      ok("a wall expires on its own", game.arena.walls.length === 0);
      ok("and its charge comes back", f.wallCharges === A_WALL_CHARGES,
         `${f.wallCharges}`);
    }
    {
      const f = midfielder();
      const w = arenaBuildWall(f);
      w.born = 1;
      const b = game.arena.ball;
      for (let n = 0; n < A_WALL_HP; n++) {
        w.hitCD = 0;
        Object.assign(b, { x: w.x, y: w.hh, z: w.z - 120, vx: 0, vy: 0, vz: 1500 });
        for (let i = 0; i < 20; i++) stepArenaBall(DT);
      }
      stepArenaWalls(DT);
      ok("enough hard shots break a wall", game.arena.walls.length === 0,
         `${game.arena.walls.length} left`);
    }
    // The rule toggle disables building.
    {
      const f = midfielder();
      game.rules.walls3d = false;
      ok("walls can be switched off in the rules",
         !arenaCanBuild(f) && arenaBuildWall(f) === null);
      game.rules.walls3d = true;
    }
    // A kickoff clears the pitch, so a goal is a clean restart.
    {
      const f = midfielder();
      arenaBuildWall(f);
      grabBall(game.arena.fighters[1]);
      arenaKickoff(0);
      ok("a kickoff clears built walls", game.arena.walls.length === 0);
      ok("and nobody is holding the ball", game.arena.carriedBy === -1);
      ok("and wall charges are restored",
         game.arena.fighters.every((x) => x.wallCharges === A_WALL_CHARGES));
      ok("and jetpacks are refuelled",
         game.arena.fighters.every((x) => near(x.jet, A_JET_MAX, 1e-9)));
    }

    endArena3D();
    Object.assign(game, saved);
    game.particles = [];
  }

  /* ---------------------------------------------------------------------
     2D SUPERPOWERS

     One signature ability per team, charged by playing. These had almost no

  // 27a. The table and the pairing.
  {
    ok("every team has a superpower", TEAM_SUPER.length === TEAMS.length,
       `${TEAM_SUPER.length} powers for ${TEAMS.length} teams`);
    ok("and every one of them names a real power",
       TEAM_SUPER.every((id) => !!SUPERS[id]),
       TEAM_SUPER.filter((id) => !SUPERS[id]).join());
    ok("no two teams share a power",
       new Set(TEAM_SUPER).size === TEAM_SUPER.length,
       `${new Set(TEAM_SUPER).size} distinct`);
    ok("every declared power is actually used by a team",
       SUPER_KEYS.every((k) => TEAM_SUPER.includes(k)),
       SUPER_KEYS.filter((k) => !TEAM_SUPER.includes(k)).join());
    {
      let bad = null;
      for (const k of SUPER_KEYS) {
        const d = SUPERS[k];
        if (!d.label || !d.color || typeof d.dur !== "number" || !d.hint) {
          bad = `${k} is incompletely declared`; break;
        }
        if (d.dur < 0) { bad = `${k} has a negative duration`; break; }
        if (!/^#[0-9a-f]{6}$/i.test(d.color)) { bad = `${k} has a bad colour`; break; }
      }
      ok("every power declares a label, colour, duration and hint", !bad, bad || "");
    }
    ok("superForTeam maps each roster slot to its declared power",
       TEAMS.every((t, i) => superForTeam(t) === TEAM_SUPER[i]));
    ok("and falls back for a team not on the roster",
       !!SUPERS[superForTeam({ name: "Nobody" })]);
  }
