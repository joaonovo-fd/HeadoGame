              break;
            }
            if (row.y < 0) {
              worst = `${md} cpu=${cpu}: row "${key}" starts above the canvas`;
              break;
            }
          }
          if (p.rowH < 22) worst = `${md} cpu=${cpu}: rows only ${p.rowH.toFixed(0)}px tall`;
          if (worst || missing) break;
        }
        if (worst || missing) break;
      }
      if (worst || missing) break;
    }
    ok("every menu row is drawn inside the canvas", !worst, worst || "");
    ok("no menu row goes missing", !missing, missing || "");
    ok("every configuration was measured", checked >= 16, `${checked}`);

    // The rows a player needs must always be present and reachable.
    for (const md of MODE_ORDER) {
      game.mode = md;
      const rows = menuRows();
      ok(`${md}: START is in the menu`, rows.includes("start"));
      ok(`${md}: the row count is renderable`, rows.length <= 16, `${rows.length}`);
    }
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    ok("ONLINE is on the menu", menuRows().includes("online"));
    ok("LEADERBOARD is on the menu", menuRows().includes("board"));
    ok("SETTINGS is on the menu", menuRows().includes("settings"));

    Object.assign(game, saved);
  }

  // 19ac. Leaderboard: recording, ranking, persistence.
  {
    const saved = { board: game.board, cpu: [...game.cpu], names: [...game.names],
                    seats: [...game.seats], entrants: game.entrants, mode: game.mode,
                    scene: game.scene, score: [...game.score], boardFrom: game.boardFrom,
                    boardScroll: game.boardScroll };
    const savedNet = { ...net };
    net.active = false;
    game.mode = MODE.SINGLE;
    game.entrants = [];
    game.seats = [null, null];
    game.cpu = [false, false];
    game.board = [];

    // ---- a win and a loss are recorded on the right players ----
    game.names = ["ANA", "BEN"];
    recordResult(0, [5, 2]);
    const ana = game.board.find((r) => r.name === "ANA");
    const ben = game.board.find((r) => r.name === "BEN");
    ok("the winner gets a win", ana && ana.w === 1 && ana.l === 0, JSON.stringify(ana));
    ok("the loser gets a loss", ben && ben.l === 1 && ben.w === 0, JSON.stringify(ben));
    ok("goals for and against are recorded",
       ana.gf === 5 && ana.ga === 2 && ben.gf === 2 && ben.ga === 5);
    ok("a win starts a winning streak", ana.streak === 1 && ana.best === 1);
    ok("a loss starts a losing streak", ben.streak === -1);

    // ---- streaks accumulate and reset ----
    recordResult(0, [3, 1]);
    recordResult(0, [4, 0]);
    ok("consecutive wins build a streak", ana.streak === 3, `${ana.streak}`);
    ok("the best streak is remembered", ana.best === 3, `${ana.best}`);
    ok("consecutive losses build a losing streak", ben.streak === -3, `${ben.streak}`);
    recordResult(1, [0, 2]);
    ok("a loss breaks a winning streak", ana.streak === -1, `${ana.streak}`);
    ok("the best streak survives a loss", ana.best === 3, `${ana.best}`);
    ok("totals add up", ana.w === 3 && ana.l === 1, `${ana.w}-${ana.l}`);

    // ---- draws ----
    recordResult(-1, [2, 2]);
    ok("a draw is recorded for both", ana.d === 1 && ben.d === 1);
    ok("a draw zeroes the streak", ana.streak === 0 && ben.streak === 0);

    // ---- CPU opponents are excluded ----
    {
      game.board = [];
      game.cpu = [false, true];
      game.names = ["ANA", "BEN"];
      recordResult(0, [3, 0]);
      ok("a human still records against a CPU",
         game.board.some((r) => r.name === "ANA"));
      ok("the CPU is not added to the table",
         !game.board.some((r) => /CPU/.test(r.name)),
         game.board.map((r) => r.name).join(","));
      ok("only one record was created", game.board.length === 1, `${game.board.length}`);
      game.cpu = [false, false];
    }

    // ---- ranking order ----
    {
      game.board = [
        { name: "LOW",  w: 1, l: 5, d: 0, gf: 5,  ga: 20, streak: 0, best: 1, last: 0 },
        { name: "TOP",  w: 9, l: 1, d: 0, gf: 40, ga: 10, streak: 3, best: 5, last: 0 },
        { name: "MID",  w: 4, l: 4, d: 0, gf: 20, ga: 20, streak: 0, best: 2, last: 0 },
      ];
      const r = rankBoard(game.board);
      ok("the table ranks by wins", r.map((x) => x.name).join(",") === "TOP,MID,LOW",
         r.map((x) => x.name).join(","));
      ok("ranking does not mutate the source",
         game.board[0].name === "LOW", game.board[0].name);

      // Equal wins fall back to win rate, then goal difference.
      game.board = [
        { name: "A", w: 3, l: 7, d: 0, gf: 10, ga: 30, streak: 0, best: 1, last: 0 },
        { name: "B", w: 3, l: 1, d: 0, gf: 12, ga: 6,  streak: 0, best: 1, last: 0 },
      ];
      ok("equal wins break on win rate", rankBoard(game.board)[0].name === "B");

      game.board = [
        { name: "C", w: 2, l: 2, d: 0, gf: 5,  ga: 9, streak: 0, best: 1, last: 0 },
        { name: "D", w: 2, l: 2, d: 0, gf: 14, ga: 4, streak: 0, best: 1, last: 0 },
      ];
      ok("equal records break on goal difference", rankBoard(game.board)[0].name === "D");
    }

    // ---- derived stats ----
    {
      const r = { name: "X", w: 3, l: 1, d: 0, gf: 9, ga: 4, streak: 0, best: 0, last: 0 };
      ok("played counts every result", lbPlayed(r) === 4, `${lbPlayed(r)}`);
      ok("win rate is a percentage", Math.round(lbWinPct(r)) === 75, `${lbWinPct(r)}`);
      const empty = { name: "Y", w: 0, l: 0, d: 0, gf: 0, ga: 0, streak: 0, best: 0, last: 0 };
      ok("an unplayed record does not divide by zero", lbWinPct(empty) === 0);
    }

    // ---- hostile and corrupt storage ----
    {
      // A name off the wire must be cleaned before it reaches the table.
      game.board = [];
      game.names = ["<b>X</b>", "BEN"];
      recordResult(0, [1, 0]);
      ok("a table name is sanitised",
         game.board.every((r) => !/[<>]/.test(r.name)),
         game.board.map((r) => r.name).join(","));

      // A blank name must not create a phantom record.
      game.board = [];
      ok("a blank name creates no record", boardRecord("   ") === null);
      ok("junk-only names create no record", boardRecord("<<>>") === null);
      ok("the table stayed empty", game.board.length === 0);

      // loadBoard must survive anything.
      const badInputs = ["not json", "null", '{"a":1}', "[]", '[{"name":""}]',
                         '[{"name":"OK","w":-5,"l":"x"}]'];
      let survived = true, detail = "";
      const haveStorage = (() => {
        try { localStorage.setItem("headgame.probe", "1"); return true; }
        catch (e) { return false; }
      })();
      for (const raw of badInputs) {
        try {
          if (haveStorage) localStorage.setItem("headgame.board", raw);
          const b = loadBoard();
          if (!Array.isArray(b)) { survived = false; detail = `not an array for ${raw}`; }
          if (b.some((r) => r.w < 0 || typeof r.w !== "number")) {
            survived = false; detail = `negative or non-numeric wins from ${raw}`;
          }
        } catch (e) { survived = false; detail = `${raw} threw: ${e.message}`; }
      }
      ok("loadBoard survives corrupt storage", survived, detail);
    }

    // ---- persistence round trip ----
    {
      const target = [{ name: "ROUNDTRIP", w: 2, l: 1, d: 0, gf: 7, ga: 5,
                        streak: 2, best: 2, last: 123 }];
      saveBoard(target);
      const back = loadBoard();
      // Where storage is unavailable (private mode, blocked cookies) both calls
      // must degrade quietly rather than throw — an empty result is correct there.
      const persists = (() => {
        try { localStorage.setItem("headgame.probe", "1"); return true; }
        catch (e) { return false; }
      })();
      ok("the table round-trips through storage, or degrades safely",
         persists
           ? (back.length === 1 && back[0].name === "ROUNDTRIP" && back[0].w === 2)
           : Array.isArray(back),
         JSON.stringify(back));
      ok("the table is capped in size", LB_MAX <= 200 && LB_MAX >= 10, `${LB_MAX}`);
    }

    // ---- a match end feeds the table ----
    {
      game.board = [];
      game.cpu = [false, false];
      game.names = ["ANA", "BEN"];
      game.mode = MODE.SINGLE;
      game.sel = [0, 3];
      startMatch();
      game.scene = SCENE.PLAY;
      game.suddenDeath = false;
      game.goalsToWin = 2;
      game.score = [1, 0];
      scoreGoal(1);                              // ANA's winning goal
      ok("finishing a match records it", game.board.length === 2, `${game.board.length}`);
      const a = game.board.find((r) => r.name === "ANA");
      ok("the match winner was credited", a && a.w === 1, JSON.stringify(a));

      // A guest must NOT double-count the host's match.
      game.board = [];
      net.active = true; net.role = "guest";
      finishMatch(0, false);
      ok("a guest does not record the result", game.board.length === 0,
         `${game.board.length}`);
      net.active = false; net.role = null;
    }

    // ---- the screen renders in every state ----
    {
      let drew = true, err = "";
      const shapes = [
        [],
        [{ name: "SOLO", w: 1, l: 0, d: 0, gf: 3, ga: 1, streak: 1, best: 1, last: 0 }],
        Array.from({ length: 30 }, (_, i) => ({
          name: `PLAYER ${i + 1}`, w: 30 - i, l: i, d: i % 3,
          gf: 100 - i, ga: i * 2, streak: i % 5 - 2, best: i % 7, last: i,
        })),
      ];
      for (const b of shapes) {
        game.board = b;
        for (const from of [SCENE.MENU, SCENE.PAUSE]) {
          game.boardFrom = from;
          for (const sc of [0, 5, 25]) {
            game.boardScroll = sc;
            try { drawBoard(); } catch (e) { drew = false; err = e.message; }
          }
        }
      }
      ok("the leaderboard renders empty, small and long", drew, err);

      // Scrolling must clamp.
      game.board = shapes[2];
      game.boardScroll = 999;
      updateBoard(DT);
      ok("scroll cannot run past the end",
         game.boardScroll <= Math.max(0, game.board.length - LB_ROWS_VISIBLE) + 1,
         `${game.boardScroll}`);
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19ad. Maps and platforms.
  {
    const saved = { mapId: game.mapId, mode: game.mode, ball: game.ball,
                    players: game.players, scene: game.scene };
    game.mode = MODE.SINGLE;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    ok("there are several maps", MAPS.length >= 5, `${MAPS.length}`);
    ok("map ids are unique", new Set(MAPS.map((m) => m.id)).size === MAPS.length);
    ok("every map is named and hinted",
       MAPS.every((m) => m.name && m.hint && Array.isArray(m.platforms)));
    ok("CLASSIC is the empty arena",
       mapById("classic").platforms.length === 0);
    ok("an unknown id falls back to the first map", mapById("nope") === MAPS[0]);

    /*
      Geometry safety: no platform may sit inside a goal mouth or off the pitch,
      or a map could make scoring impossible.
    */
    {
      let bad = null;
      for (const m of MAPS) {
        for (const pl of m.platforms) {
          if (pl.x < WALL || pl.x + pl.w > W - WALL) {
            bad = `${m.id}: platform crosses a wall`; break;
          }
          if (pl.y < 40 || pl.y + pl.h > GROUND_Y - 20) {
            bad = `${m.id}: platform at y=${pl.y} is out of bounds`; break;
          }
          // Keep clear of both goal mouths (widest possible, with big goals).
          const mouthTop = GROUND_Y - GOAL_H * GOAL_SIZE_BIG;
          const overlapsMouthBand = pl.y + pl.h > mouthTop;
          const nearLeft = pl.x < WALL + 130;
          const nearRight = pl.x + pl.w > W - WALL - 130;
          if (overlapsMouthBand && (nearLeft || nearRight)) {
            bad = `${m.id}: platform blocks a goal mouth`; break;
          }
          if (!["solid", "bounce", "ghost"].includes(pl.kind)) {
            bad = `${m.id}: unknown platform kind ${pl.kind}`; break;
          }
        }
        if (bad) break;
      }
      ok("no map blocks a goal or leaves the pitch", !bad, bad || "");
    }

    // Platforms are suppressed in net modes so a rally is never blocked.
    {
      game.mapId = "towers";
      game.mode = MODE.SINGLE;
      ok("platforms are active in soccer", activePlatforms().length > 0);
      game.mode = MODE.VOLLEY;
      ok("platforms are suppressed in volleyball", activePlatforms().length === 0);
      game.mode = MODE.TENNIS;
      ok("platforms are suppressed in tennis", activePlatforms().length === 0);
      game.mode = MODE.BASKET;
      ok("platforms are active in basketball", activePlatforms().length > 0);
      game.mode = MODE.SINGLE;
    }

    // The ball must bounce OFF a slab from every direction, never through it.
    {
      const slab = { x: 400, y: 300, w: 200, h: PLAT_H, kind: "solid" };
      const cases = [
        { name: "from above", x: 500, y: 300 - BALL_R - 4, vx: 0, vy: 600, want: "vy<0" },
        { name: "from below", x: 500, y: 300 + PLAT_H + BALL_R + 4, vx: 0, vy: -600, want: "vy>0" },
        { name: "from the left", x: 400 - BALL_R - 4, y: 306, vx: 700, vy: 0, want: "vx<0" },
        { name: "from the right", x: 600 + BALL_R + 4, y: 306, vx: -700, vy: 0, want: "vx>0" },
      ];
      let allOk = true, detail = "";
      for (const c of cases) {
        const b = { x: c.x, y: c.y, vx: c.vx, vy: c.vy, r: BALL_R, mass: BALL_MASS };
        // March it into the slab a few substeps.
        let bounced = false;
        for (let i = 0; i < 40; i++) {
          integrate(b, DT, 0, 0);
          if (resolvePlatform(b, slab, 0.6)) { bounced = true; break; }
        }
        const okDir =
          c.want === "vy<0" ? b.vy < 0 : c.want === "vy>0" ? b.vy > 0 :
          c.want === "vx<0" ? b.vx < 0 : b.vx > 0;
        if (!bounced || !okDir) {
          allOk = false;
          detail = `${c.name}: bounced=${bounced} v=${b.vx.toFixed(0)},${b.vy.toFixed(0)}`;
          break;
        }
      }
      ok("the ball rebounds off a platform from every side", allOk, detail);

      // And never ends up inside it.
      let inside = null;
      for (let t = 0; t < 300; t++) {
        const b = { x: rand(380, 620), y: rand(260, 360),
                    vx: rand(-900, 900), vy: rand(-900, 900), r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 30; i++) {
          integrate(b, DT, 0, 0);
          resolvePlatform(b, slab, 0.6);
        }
        const cx = clamp(b.x, slab.x, slab.x + slab.w);
        const cy = clamp(b.y, slab.y, slab.y + slab.h);
        if (len(b.x - cx, b.y - cy) < BALL_R - 1.5) {
          inside = `${b.x.toFixed(0)},${b.y.toFixed(0)}`;
          break;
        }
      }
      ok("the ball never rests inside a platform", !inside, inside || "");
    }

    // A bounce pad must send the ball away FASTER than a solid slab.
    {
      const drop = (kind) => {
        game.mapId = "classic";
        const slab = { x: 400, y: 320, w: 200, h: PLAT_H, kind };
        const b = { x: 500, y: 320 - BALL_R - 30, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 200; i++) {
          integrate(b, DT, gravity, 0);
          const rest = ballRest * (kind === "bounce" ? PLAT_BOUNCE : PLAT_REST);
          const side = resolvePlatform(b, slab, rest);
          if (side === "top") {
            if (kind === "bounce") b.vy = Math.min(b.vy, -320);
            return Math.abs(b.vy);
          }
        }
        return 0;
      };
      const solid = drop("solid"), bouncy = drop("bounce");
      ok("a bounce pad throws the ball harder than a solid slab",
         bouncy > solid * 1.3, `solid ${solid.toFixed(0)} vs pad ${bouncy.toFixed(0)}`);
    }

    // A ghost slab is transparent to the ball but solid underfoot.
    {
      game.mapId = "catwalk";
      const ghost = mapById("catwalk").platforms.find((p) => p.kind === "ghost");
      ok("the catwalk has a ghost slab", !!ghost);
      const b = { x: ghost.x + 100, y: ghost.y - BALL_R - 4, vx: 0, vy: 500,
                  r: BALL_R, mass: BALL_MASS, bounces: 0 };
      const sb = game.ball;
      game.ball = b;
      for (let i = 0; i < 30; i++) ballVsPlatforms(game.ball);
      game.ball = sb;
      ok("the ball passes through a ghost slab", b.vy > 0, `vy=${b.vy.toFixed(0)}`);

      // A player standing on it must be supported.
      const p = new Player(0, TEAMS[0]);
      p.reset();
      p.x = ghost.x + 100;
      // Start ABOVE the slab and fall onto it, which is what a player does.
      p.y = ghost.y - p.r - 50;
      p.vy = 0;
      for (let i = 0; i < 200; i++) {
        p.update(DT, null);
        playerVsPlatforms(p);
        if (p.onGround && Math.abs(p.y + p.r - ghost.y) < 1.5) break;
      }
      ok("a player lands on a ghost slab",
         p.onGround && Math.abs(p.y + p.r - ghost.y) < 1.5,
         `feet=${(p.y + p.r).toFixed(1)} slab top=${ghost.y}`);
      // And is not yanked downward before reaching it.
      const q = new Player(0, TEAMS[0]);
      q.reset();
      q.x = ghost.x + 100;
      q.y = ghost.y - q.r - 8;
      q.vy = 100;
      const qy = q.y;
      playerVsPlatforms(q);
      ok("a player above a slab is not snapped down early",
         q.y === qy, `${qy.toFixed(1)} -> ${q.y.toFixed(1)}`);
    }

    // Players must land on every map's platforms without getting stuck.
    {
      let stuck = null;
      for (const m of MAPS) {
        game.mapId = m.id;
        for (const pl of m.platforms) {
          const p = new Player(0, TEAMS[0]);
          p.reset();
          p.x = pl.x + pl.w / 2;
          p.y = pl.y - p.r - 40;
          p.vy = 0;
          for (let i = 0; i < 240; i++) {
            p.update(DT, null);
            playerVsPlatforms(p);
          }
          if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) { stuck = `${m.id}: NaN`; break; }
          if (p.y + p.r > GROUND_Y + 1) { stuck = `${m.id}: fell through`; break; }
        }
        if (stuck) break;
      }
      ok("players land safely on every map", !stuck, stuck || "");
    }

    // Long soak on the busiest map: the ball must stay in the world.
    {
      game.mapId = "towers";
      game.mode = MODE.SINGLE;
      let escaped = null;
      const sb = game.ball;
      for (let t = 0; t < 3; t++) {
        game.ball = { x: W / 2, y: 120, vx: rand(-1200, 1200), vy: rand(-800, 200),
                      r: BALL_R, mass: BALL_MASS, bounces: 0 };
        for (let i = 0; i < 2000; i++) {
          stepBall(DT);
          ballVsPlatforms(game.ball);
          const b = game.ball;
          if (!Number.isFinite(b.x)) { escaped = "NaN"; break; }
          if (b.x < -GOAL_D - 40 || b.x > W + GOAL_D + 40 || b.y < -40 || b.y > H + 40) {
            escaped = `${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
          }
          if (i % 400 === 0) { b.vx = rand(-1200, 1200); b.vy = rand(-900, 300); }
        }
        if (escaped) break;
      }
      game.ball = sb;
      ok("the ball never escapes a platform map", !escaped, escaped || "");
    }

    // Every map renders.
    {
      let drew = true, err = "";
      for (const m of MAPS) {
        game.mapId = m.id;
        try { drawPlatforms(); } catch (e) { drew = false; err = `${m.id}: ${e.message}`; }
      }
      ok("every map renders", drew, err);
    }

    game.mapId = saved.mapId;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19ae. Configurable spawn rates.
  {
    const saved = { rules: { ...game.rules }, rulesRow: game.rulesRow,
                    rulesFrom: game.rulesFrom, scene: game.scene, chaos: game.chaos };

    ok("every rule declares a type", RULE_DEFS.every((d) => d.type && d.key && d.label));
    ok("numeric rules declare a range and step",
       RULE_DEFS.filter((d) => d.type !== "flag")
                .every((d) => d.max > d.min && d.step > 0));
    ok("every rule has a default",
       RULE_DEFS.every((d) => RULE_DEFAULTS[d.key] !== undefined));
    ok("defaults sit inside their ranges",
       RULE_DEFS.filter((d) => d.type !== "flag")
                .every((d) => RULE_DEFAULTS[d.key] >= d.min && RULE_DEFAULTS[d.key] <= d.max));

    // Clamping.
    for (const d of RULE_DEFS.filter((x) => x.type !== "flag")) {
      ok(`${d.key} clamps at its maximum`, clampRule(d.key, 999) === d.max, `${clampRule(d.key, 999)}`);
      ok(`${d.key} clamps at its minimum`, clampRule(d.key, -999) === d.min, `${clampRule(d.key, -999)}`);
    }
    ok("integer rules stay integers",
       Number.isInteger(clampRule("puMaxLive", 3.7)), `${clampRule("puMaxLive", 3.7)}`);
    ok("flags coerce to booleans", clampRule("movingGoals", 1) === true);

    // Effective intervals must respond to the multiplier.
    {
      game.rules = { ...RULE_DEFAULTS };
      const base = [];
      for (let i = 0; i < 200; i++) base.push(puInterval());
      const meanBase = base.reduce((a, b) => a + b, 0) / base.length;

      game.rules.puRate = 2;                    // twice as often
      const fast = [];
      for (let i = 0; i < 200; i++) fast.push(puInterval());
      const meanFast = fast.reduce((a, b) => a + b, 0) / fast.length;
      ok("a higher power-up rate shortens the interval",
         meanFast < meanBase * 0.65,
         `${meanBase.toFixed(2)}s -> ${meanFast.toFixed(2)}s`);

      game.rules.puRate = 0;                    // off
      ok("a zero rate disables power-ups entirely", puInterval() === Infinity);

      game.rules.mineRate = 0;
      ok("a zero rate disables mines entirely", mineInterval() === Infinity);
      game.rules = { ...RULE_DEFAULTS };
    }

    // Caps and lifetimes.
    {
      game.rules.puMaxLive = 7;
      ok("the power-up cap follows the rule", puCap() === 7);
      game.rules.mineMaxLive = 1;
      ok("the mine cap follows the rule", mineCap() === 1);
      game.rules.puLife = 2;
      ok("the power-up lifetime scales", puLifetime() === PU_LIFE * 2, `${puLifetime()}`);
      game.rules.chaosRate = 0.5;
      ok("the chaos interval scales", chaosInterval() === CHAOS_EVERY * 0.5, `${chaosInterval()}`);
      game.rules = { ...RULE_DEFAULTS };
    }

    // Disabling actually stops spawning in the live loop.
    {
      game.mode = MODE.SINGLE;
      game.cpu = [false, false];
      game.sel = [0, 3];
      game.rules.puRate = 0;
      game.rules.mineRate = 0;
      startMatch();
      game.scene = SCENE.PLAY;
      for (let i = 0; i < 60 * 60; i++) { updatePowerups(DT); updateMines(DT); }
      ok("power-ups really stop when disabled", game.powerups.length === 0,
         `${game.powerups.length}`);
      ok("mines really stop when disabled", game.mines.length === 0, `${game.mines.length}`);

      // And a high rate produces many more than the default.
      const countOver = (rate) => {
        game.rules.puRate = rate;
        game.powerups = [];
        game.puTimer = puInterval();
        let n = 0;
        for (let i = 0; i < 120 * 60; i++) {
          const before = game.powerups.length;
          updatePowerups(DT);
          if (game.powerups.length > before) n++;
          game.powerups = [];                   // don't let the cap throttle it
        }
        return n;
      };
      const slow = countOver(0.5), fast = countOver(3);
      ok("a higher rate spawns more power-ups", fast > slow * 2,
         `${slow} vs ${fast} in 120s`);
      game.rules = { ...RULE_DEFAULTS };
    }

    // The caps are honoured in the live loop.
    {
      game.rules.puRate = 4;
      game.rules.puMaxLive = 2;
      game.powerups = [];
      game.puTimer = 0;
      let peak = 0;
      for (let i = 0; i < 90 * 60; i++) {
        updatePowerups(DT);
        peak = Math.max(peak, game.powerups.length);
      }
      ok("the power-up cap holds under pressure", peak <= 2, `peak ${peak}`);
      game.rules = { ...RULE_DEFAULTS };
      game.powerups = [];
    }

    // The screen renders and navigates.
    {
      let drew = true, err = "";
      const rowsN = RULE_DEFS.length + 2;
      for (const from of [SCENE.MENU, SCENE.PAUSE]) {
        game.rulesFrom = from;
        for (let r = 0; r < rowsN; r++) {
          game.rulesRow = r;
          try { drawRules(); } catch (e) { drew = false; err = e.message; }
        }
      }
      ok("the spawn-rate screen renders every row", drew, err);

      // RESET restores the defaults.
      game.rules.puRate = 3.5;
      game.rules.movingGoals = true;
      game.rulesRow = RULE_DEFS.length;          // RESET
      game.scene = SCENE.RULES;
      pressed.Enter = true;
      edgeFrame = true;
      updateRules(DT);
      for (const k in pressed) delete pressed[k];
      ok("RESET restores every default",
         game.rules.puRate === RULE_DEFAULTS.puRate &&
         game.rules.movingGoals === RULE_DEFAULTS.movingGoals,
         JSON.stringify(game.rules));
    }

    // Storage round trip.
    {
      const probe = { ...RULE_DEFAULTS, puRate: 2.5, mineMaxLive: 6, movingGoals: true };
      saveRules(probe);
      const back = loadRules({ ...RULE_DEFAULTS });
      const persists = (() => {
        try { localStorage.setItem("headgame.probe", "1"); return true; }
        catch (e) { return false; }
      })();
      ok("rules round-trip through storage, or degrade safely",
         persists ? (back.puRate === 2.5 && back.mineMaxLive === 6 && back.movingGoals === true)
                  : typeof back.puRate === "number",
         JSON.stringify(back));

      // Corrupt storage must not poison the rules.
      if (persists) {
        localStorage.setItem("headgame.rules", '{"puRate":999,"mineMaxLive":-5,"bogus":1}');
        const clamped = loadRules({ ...RULE_DEFAULTS });
        ok("out-of-range stored rules are clamped",
           clamped.puRate === ruleDef("puRate").max &&
           clamped.mineMaxLive === ruleDef("mineMaxLive").min,
           JSON.stringify(clamped));
        localStorage.setItem("headgame.rules", "not json");
        ok("unparseable rules fall back to defaults",
           loadRules({ ...RULE_DEFAULTS }).puRate === RULE_DEFAULTS.puRate);
      }
    }

    Object.assign(game, saved);
    game.rules = saved.rules;
    game.particles = [];
  }

  // 19af. Volleyball bounces more, without running away.
  {
    const savedMode = game.mode, savedBall = game.ball;
    /*
      Start from a known world. Earlier cases legitimately leave chaos on, a
      rolled goalScale, or a platform map selected — all of which perturb
      stepBall and made this comparison flake about 4 runs in 10.
    */
    const savedChaosV = game.chaos, savedScaleV = goalScale, savedMapV = game.mapId;
    const savedJetV = game.jetpack;
    game.chaos = false;
    goalScale = 1;
    game.mapId = "classic";
    game.jetpack = 0;
    resetChaos();

    const volley = MODE_CFG[MODE.VOLLEY];
    ok("the volleyball is springier than the soccer ball",
       volley.rest > MODE_CFG[MODE.SINGLE].rest, `${volley.rest}`);

    /*
      Apex heights of successive bounces. The drop is measured from the ball's
      RESTING contact point, so a big ball and a small one fall the same
      distance — otherwise the larger volleyball starts lower and looks worse
      while actually bouncing better.
    */
    const apexes = (mode, n = 8) => {
      game.mode = mode;
      const c = MODE_CFG[mode];
      game.ball = { x: W / 2, y: GROUND_Y - c.ballR - 300, vx: 0, vy: 0,
                    r: c.ballR, mass: c.ballMass, bounces: 0 };
      const out = [];
      let lastY = game.ball.y, rising = false, peak = game.ball.y;
      for (let i = 0; i < 4000 && out.length < n; i++) {
        stepBall(DT);
        if (game.ball.y < lastY) { rising = true; peak = Math.min(peak, game.ball.y); }
        else if (rising && game.ball.y > lastY) { out.push(GROUND_Y - peak); rising = false; peak = game.ball.y; }
        lastY = game.ball.y;
      }
      return out;
    };

    const v = apexes(MODE.VOLLEY);
    const soc = apexes(MODE.SINGLE);
    ok("the volleyball keeps bouncing for several rebounds", v.length >= 5, `${v.length}`);
    /*
      Compare RETENTION, not absolute apex: the volleyball's radius is 22 vs 14,
      so from the same drop height it falls a shorter distance and would look
      worse on raw numbers even while bouncing better.
    */
    const retain = (a) => (a.length > 2 && a[1] ? a[2] / a[1] : 0);
    ok("the volleyball retains more of its bounce than the soccer ball",
       retain(v) > retain(soc),
       `volley ${(retain(v) * 100).toFixed(0)}% vs soccer ${(retain(soc) * 100).toFixed(0)}%`);
    ok("the volleyball rebounds higher at the same bounce",
       v[1] > soc[1],
       `${v[1].toFixed(0)}px vs ${soc[1].toFixed(0)}px`);

    // Crucially: it must DECAY. A restitution above 1 could otherwise add energy
    // on every bounce and send the ball into the ceiling forever.
    {
      let monotonic = true;
      for (let i = 1; i < v.length; i++) if (v[i] > v[i - 1] + 1) monotonic = false;
      ok("volleyball bounces decay rather than growing", monotonic,
         v.map((x) => x.toFixed(0)).join(" -> "));
      ok("the bounce settles to a small height", v[v.length - 1] < 120,
         `${v[v.length - 1].toFixed(0)}px`);
    }

    // A long volley soak must not blow up.
    {
      game.mode = MODE.VOLLEY;
      const c = MODE_CFG[MODE.VOLLEY];
      let bad = null, maxSpeed = 0;
      game.ball = { x: W / 2, y: 200, vx: 700, vy: -600, r: c.ballR, mass: c.ballMass, bounces: 0 };
      for (let i = 0; i < 6000; i++) {
        stepBall(DT);
        ballVsNet(game.ball);
        maxSpeed = Math.max(maxSpeed, len(game.ball.vx, game.ball.vy));
        const b = game.ball;
        if (!Number.isFinite(b.x)) { bad = "NaN"; break; }
        if (b.x < 0 || b.x > W || b.y < -30 || b.y > H) {
          bad = `${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
        }
      }
      ok("a long volley rally stays in the court", !bad, bad || "");
      ok("volleyball speed never runs away", maxSpeed <= BALL_MAX_V + 1e-6,
         `${maxSpeed.toFixed(0)}`);
    }

    game.chaos = savedChaosV;
    goalScale = savedScaleV;
    game.mapId = savedMapV;
    game.jetpack = savedJetV;
    game.mode = savedMode;
    game.ball = savedBall;
  }

  // 19af2. The LIVE renderer must actually paint the arena.
  //        Regression: drawPlatforms() was wired only into the pause-menu
  //        backdrop, so platforms were invisible during play. Every existing
  //        test passed because they only checked that drawing did not throw.
  {
    const saved = { mapId: game.mapId, mode: game.mode, scene: game.scene,
                    players: game.players, pauseFrom: game.pauseFrom };
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();

    // A map WITH platforms must paint them on a live frame.
    game.mapId = "towers";
    const expected = mapById("towers").platforms.length;
    ok("the towers map has platforms to draw", expected > 0, `${expected}`);

    for (const sc of [SCENE.PLAY, SCENE.COUNTDOWN, SCENE.CELEBRATE]) {
      game.scene = sc;
      drawProbe.platforms = 0;
      draw();
      ok(`platforms are painted during ${sc}`, drawProbe.platforms === expected,
         `painted ${drawProbe.platforms} of ${expected}`);
    }

    // The empty map must paint none — the probe has to be able to say "zero".
    game.mapId = "classic";
    game.scene = SCENE.PLAY;
    drawProbe.platforms = 0;
    draw();
    ok("the classic map paints no platforms", drawProbe.platforms === 0,
       `${drawProbe.platforms}`);

    // Every map paints its full complement on a live frame.
    {
      let bad = null;
      for (const m of MAPS) {
        game.mapId = m.id;
        game.scene = SCENE.PLAY;
        drawProbe.platforms = 0;
        draw();
        if (drawProbe.platforms !== m.platforms.length) {
          bad = `${m.id}: painted ${drawProbe.platforms} of ${m.platforms.length}`;
          break;
        }
      }
      ok("every map paints all of its platforms in play", !bad, bad || "");
    }

    // And the pause backdrop still shows them, which is what worked before.
    game.mapId = "towers";
    game.pauseFrom = SCENE.PLAY;
    game.scene = SCENE.PAUSE;
    drawProbe.platforms = 0;
    draw();
    ok("platforms still appear behind the pause menu",
       drawProbe.platforms === expected, `${drawProbe.platforms}`);

    // Faces must reach the canvas during play too — same class of bug.
    game.scene = SCENE.PLAY;
    game.mapId = "classic";
    drawProbe.faces = 0;
    draw();
    ok("both players' faces are painted during play", drawProbe.faces >= 2,
       `${drawProbe.faces}`);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af3. The R hotkey is gone. It predated the pause menu and a stray press
  //        dumped you out of a live match with no confirmation; ESC is the only
  //        way out now.
  {
    const saved = { scene: game.scene, players: game.players, mode: game.mode,
                    score: [...game.score], cpu: [...game.cpu] };
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();

    ok("R is not a watched key", !WATCHED.has("KeyR"));

    // Pressing R in a live match must change nothing at all.
    const pressR = () => {
      pressed.KeyR = true;
      edgeFrame = true;
      step(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
    };

    for (const sc of [SCENE.PLAY, SCENE.COUNTDOWN, SCENE.CELEBRATE]) {
      game.scene = sc;
      pressR();
      ok(`R does nothing during ${sc}`, game.scene === sc, `left ${sc} for ${game.scene}`);
    }

    // Nor on the leaderboard, where it used to be an alias for ESC.
    game.boardFrom = SCENE.MENU;
    game.scene = SCENE.BOARD;
    pressR();
    ok("R does not close the leaderboard", game.scene === SCENE.BOARD, game.scene);

    // ESC still does, so the screen is not a dead end.
    pressed.Escape = true;
    edgeFrame = true;
    step(DT);
    for (const k in pressed) delete pressed[k];
    ok("ESC still closes the leaderboard", game.scene === SCENE.MENU, game.scene);

    // And quitting is still possible through the pause menu.
    game.scene = SCENE.PLAY;
    openPause();
    game.pauseRow = PAUSE_ITEMS.indexOf("quit");
    pressed.Enter = true;
    edgeFrame = true;
    updatePause(DT);
    for (const k in pressed) delete pressed[k];
    ok("the pause menu can still quit to the setup menu",
       game.scene === SCENE.MENU, game.scene);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19ag. Kicks are a strike, not a touch.
  {
    const saved = { players: game.players, ball: game.ball, mode: game.mode };
    game.mode = MODE.SINGLE;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    /** Launch speed for a given team at a given point through the swing. */
    const kickAt = (team, frac, powered = false) => {
      const p = new Player(0, team);
      p.reset();
      p.facing = 1;
      if (powered) p.grant("powershot");
      p.kickT = KICK_TIME * (1 - frac);
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return len(game.ball.vx, game.ball.vy);
    };

    const mid = kickAt(TEAMS[0], 0.5);
    ok("a plain kick is genuinely strong", mid >= 1000, `${mid.toFixed(0)} px/s`);
    ok("the base kick constant was raised", KICK_BASE >= 1000, `${KICK_BASE}`);

    // Even the weakest team must not feel like a nudge.
    const weakest = TEAMS.reduce((a, t) => (t.shot < a.shot ? t : a), TEAMS[0]);
    const weakKick = kickAt(weakest, 0.5);
    ok(`even ${weakest.name} kicks hard`, weakKick >= 800, `${weakKick.toFixed(0)} px/s`);

    // Swing timing must be worth something.
    const early = kickAt(TEAMS[0], 0.05), late = kickAt(TEAMS[0], 0.95);
    ok("a late swing hits harder than an early one", late > early * 1.4,
       `${early.toFixed(0)} -> ${late.toFixed(0)}`);

    // A kicked ball must travel a useful distance across the pitch.
    {
      const p = new Player(0, TEAMS[0]);
      p.reset();
      p.facing = 1;
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS, bounces: 0 };
      ballVsPlayer(p);
      const x0 = game.ball.x;
      let far = x0;
      for (let i = 0; i < 400; i++) { stepBall(DT); far = Math.max(far, game.ball.x); }
      ok("one kick carries the ball a long way", far - x0 > 380,
         `${(far - x0).toFixed(0)}px`);
    }

    // The power shot must still be a clear step up, not lost in the clamp.
    {
      const plain = kickAt(TEAMS[0], 0.5, false);
      const power = kickAt(TEAMS[0], 0.5, true);
      ok("a power shot still clearly beats a normal kick", power > plain * 1.3,
         `${plain.toFixed(0)} -> ${power.toFixed(0)}`);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19ah. Basketball is actually scoreable.
  {
    const savedMode = game.mode, savedBall = game.ball;
    const c = MODE_CFG[MODE.BASKET];

    ok("the basketball is bouncier than before", c.rest >= 1.0, `${c.rest}`);
    ok("the basketball is no longer the least bouncy mode",
       c.rest > MODE_CFG[MODE.SINGLE].rest, `${c.rest} vs ${MODE_CFG[MODE.SINGLE].rest}`);

    // Bounce retention, and it must still decay.
    {
      game.mode = MODE.BASKET;
      game.ball = { x: W / 2, y: GROUND_Y - c.ballR - 300, vx: 0, vy: 0,
                    r: c.ballR, mass: c.ballMass, bounces: 0 };
      const out = [];
      let lastY = game.ball.y, rising = false, peak = game.ball.y;
      for (let i = 0; i < 4000 && out.length < 6; i++) {
        stepBall(DT);
        if (game.ball.y < lastY) { rising = true; peak = Math.min(peak, game.ball.y); }
        else if (rising && game.ball.y > lastY) { out.push(GROUND_Y - peak); rising = false; peak = game.ball.y; }
        lastY = game.ball.y;
      }
      ok("the basketball bounces several times", out.length >= 5, `${out.length}`);
      let decays = true;
      for (let i = 1; i < out.length; i++) if (out[i] > out[i - 1] + 1) decays = false;
      ok("basketball bounces still decay", decays, out.map((x) => x.toFixed(0)).join(" -> "));
    }

    // The measurable complaint: a blind shot should sometimes go in.
    {
      game.mode = MODE.BASKET;
      let scored = 0;
      const N = 500;
      for (let t = 0; t < N; t++) {
        game.ball = { x: 500 + Math.random() * 180, y: GROUND_Y - 60,
                      vx: 400 + Math.random() * 500, vy: -(600 + Math.random() * 450),
                      r: c.ballR, mass: c.ballMass, bounces: 0 };
        for (let i = 0; i < 900; i++) {
          const prevY = game.ball.y;
          stepBall(DT);
          ballVsHoops(game.ball);
          if (basketScored(game.ball, prevY) !== 0) { scored++; break; }
          if (game.ball.x < 0 || game.ball.x > W) break;
        }
      }
      const pct = (scored / N) * 100;
      ok("blind basketball shots score sometimes", pct >= 4, `${pct.toFixed(1)}%`);
      ok("but not trivially often", pct <= 45, `${pct.toFixed(1)}%`);
    }

    // The aperture must still reject a clear miss.
    {
      game.mode = MODE.BASKET;
      const h = hoopPos(1);
      const wide = { x: h.x + HOOP_R + 30, y: h.y + 2, vx: 0, vy: 300, r: c.ballR, mass: c.ballMass };
      ok("a shot well wide of the ring does not score",
         basketScored(wide, h.y - 2) === 0);
      const dead = { x: h.x, y: h.y + 2, vx: 0, vy: 300, r: c.ballR, mass: c.ballMass };
      ok("a shot through the middle scores", basketScored(dead, h.y - 2) === 1);
    }

    game.mode = savedMode;
    game.ball = savedBall;
  }

  // 19ai. Character customization: faces, hats, and reactive moods.
  {
    const saved = { players: game.players, looks: game.looks.map((l) => ({ ...l })),
                    lookRow: [...game.lookRow], scene: game.scene, score: [...game.score],
                    locked: [...game.locked], cpu: [...game.cpu], mode: game.mode };
    game.mode = MODE.SINGLE;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    ok("there are several faces", FACES.length >= 6, `${FACES.length}`);
    ok("there are several hats", HATS.length >= 6, `${HATS.length}`);
    ok("face ids are unique", new Set(FACES.map((f) => f.id)).size === FACES.length);
    ok("hat ids are unique", new Set(HATS.map((h) => h.id)).size === HATS.length);
    ok("every face and hat is named",
       FACES.every((f) => f.name) && HATS.every((h) => h.name));
    ok("NONE is an available hat", HATS.some((h) => h.id === "none"));
    ok("an unknown face falls back", faceById("bogus") === FACES[0]);
    ok("an unknown hat falls back", hatById("bogus") === HATS[0]);

    // Moods must track live player state — this is what makes them feel alive.
    {
      const p = game.players[0];
      p.reset();
      game.scene = SCENE.PLAY;
      game.score = [0, 0];
      ok("a settled player is idle", faceMood(p) === "idle", faceMood(p));
      p.stun = 0.5;
      ok("a stunned player looks stunned", faceMood(p) === "stunned");
      p.stun = 0;
      p.kickT = KICK_TIME * 0.5;
      ok("a kicking player looks like it", faceMood(p) === "kick");
      p.kickT = 0;
      p.onGround = false;
      ok("an airborne player has an airborne face", faceMood(p) === "air");
      p.onGround = true;

      // Scoreline moods only apply at a celebration or a win.
      game.score = [3, 1];
      game.scene = SCENE.PLAY;
      ok("the scoreline does not change the face mid-play", faceMood(p) === "idle");
      game.scene = SCENE.CELEBRATE;
      ok("the leader looks happy at a goal", faceMood(p) === "happy");
      ok("the trailer looks sad at a goal", faceMood(game.players[1]) === "sad");
      game.score = [1, 1];
      ok("a level score stays neutral", faceMood(p) === "idle");
      ok("a null player is handled", faceMood(null) === "idle");
      game.scene = SCENE.PLAY;
      game.score = [0, 0];
    }

    // Every face x hat x mood must render, at small and large radii.
    {
      let drew = true, err = "";
      const moods = ["idle", "kick", "air", "stunned", "happy", "sad"];
      for (const f of FACES) {
        for (const h of HATS) {
          for (const m of moods) {
            for (const r of [12, 30, 62]) {
              for (const facing of [-1, 1]) {
                try {
                  drawFace(500, 300, r, facing, f.id, m, TEAMS[0]);
                  drawHat(500, 300, r, facing, h.id, TEAMS[0]);
                } catch (e) {
                  drew = false;
                  err = `${f.id}/${h.id}/${m} r=${r}: ${e.message}`;
                }
              }
            }
          }
        }
      }
      ok("every face, hat and mood renders at any size", drew, err);
    }

    // lookOf must always return something valid, even from corrupt state.
    {
      game.looks = [{ face: "bogus", hat: "bogus" }, null];
      const a = lookOf(game.players[0]);
      const b = lookOf(game.players[1]);
      ok("a corrupt look falls back to a valid face",
         FACES.some((f) => f.id === a.face) && HATS.some((h) => h.id === a.hat),
         JSON.stringify(a));
      ok("a missing look falls back entirely",
         FACES.some((f) => f.id === b.face) && HATS.some((h) => h.id === b.hat),
         JSON.stringify(b));
      game.looks = LOOK_DEFAULTS.map((l) => ({ ...l }));
    }

    // The select screen cycles faces and hats.
    {
      game.scene = SCENE.SELECT;
      game.cpu = [false, false];
      game.locked = [false, false];
      game.lookRow = [0, 0];

      const tapSel = (code) => {
        pressed[code] = true;
        edgeFrame = true;
        updateSelect(DT);
        for (const k in pressed) delete pressed[k];
        edgeFrame = true;
      };

      // Row 0 changes the team.
      const team0 = game.sel[0];
      tapSel(SCHEME[0].right);
      ok("the team row changes the team", game.sel[0] !== team0);

      // Row 1 changes the face.
      tapSel(SCHEME[0].down);
      ok("down moves to the face row", game.lookRow[0] === 1);
      const face0 = game.looks[0].face;
      tapSel(SCHEME[0].right);
      ok("the face row changes the face", game.looks[0].face !== face0,
         `${face0} -> ${game.looks[0].face}`);

      // Row 2 changes the hat.
      tapSel(SCHEME[0].down);
      ok("down moves to the hat row", game.lookRow[0] === 2);
      const hat0 = game.looks[0].hat;
      tapSel(SCHEME[0].right);
      ok("the hat row changes the hat", game.looks[0].hat !== hat0,
         `${hat0} -> ${game.looks[0].hat}`);

      // Cycling all the way round returns to the start.
      const startFace = game.looks[0].face;
      game.lookRow[0] = 1;
      for (let i = 0; i < FACES.length; i++) tapSel(SCHEME[0].right);
      ok("faces wrap around", game.looks[0].face === startFace);

      // The rows wrap too.
      game.lookRow[0] = 2;
      tapSel(SCHEME[0].down);
      ok("the row list wraps", game.lookRow[0] === 0, `${game.lookRow[0]}`);
    }

    // Looks persist.
    {
      const probe = [{ face: "robot", hat: "crown" }, { face: "cool", hat: "halo" }];
      saveLooks(probe);
      const back = loadLooks(LOOK_DEFAULTS.map((l) => ({ ...l })));
      const persists = (() => {
        try { localStorage.setItem("headgame.probe", "1"); return true; }
        catch (e) { return false; }
      })();
      ok("looks round-trip through storage, or degrade safely",
         persists ? (back[0].face === "robot" && back[1].hat === "halo")
                  : FACES.some((f) => f.id === back[0].face),
         JSON.stringify(back));

      if (persists) {
        localStorage.setItem("headgame.looks", '[{"face":"<evil>","hat":42},null]');
        const cleaned = loadLooks(LOOK_DEFAULTS.map((l) => ({ ...l })));
        ok("corrupt stored looks are rejected",
           FACES.some((f) => f.id === cleaned[0].face) &&
           HATS.some((h) => h.id === cleaned[0].hat),
           JSON.stringify(cleaned));
        localStorage.setItem("headgame.looks", "not json");
        ok("unparseable looks fall back",
           loadLooks(LOOK_DEFAULTS.map((l) => ({ ...l })))[0].face === LOOK_DEFAULTS[0].face);
      }
    }

    Object.assign(game, saved);
    game.looks = saved.looks;
    game.particles = [];
  }

  // 20. Bigger/Smaller cancel instead of compounding.
  {
    const p = new Player(0, TEAMS[0]);
    const base = p.r;
    p.grant("bigger");
    const big = p.r;
    p.grant("smaller");
    ok("bigger enlarges", big > base);
    ok("smaller cancels bigger", near(p.r, base, 1e-9) && !p.effects.bigger && !p.effects.smaller);
    p.grant("smaller");
    ok("smaller shrinks", p.r < base);
  }

  // 21. Scoring attribution: left goal credits P2, right goal credits P1.
  {
    const saved = { players: game.players, score: game.score, scene: game.scene, ball: game.ball };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    game.score = [0, 0];
    game.ball = makeBall();
    scoreGoal(-1);
    ok("left goal credits P2", game.score[1] === 1 && game.score[0] === 0);
    game.score = [0, 0];
    scoreGoal(1);
    ok("right goal credits P1", game.score[0] === 1 && game.score[1] === 0);

    game.suddenDeath = false;
    game.score = [game.goalsToWin - 1, 0];
    scoreGoal(1);
    ok("the target-reaching goal wins", game.scene === SCENE.WIN && game.winner === 0);
    Object.assign(game, saved);
    game.particles = [];
  }

  // 21b. Body contact always launches the ball upward and shoves the player.
  {
    const saved = { players: game.players, ball: game.ball, scene: game.scene };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    const pl = game.players[0];

    // Ball rolling flat into the player's side.
    pl.reset();
    game.ball = { x: pl.x + pl.r + 4, y: pl.y, vx: -600, vy: 0, r: BALL_R, mass: BALL_MASS };
    const pvx0 = pl.vx;
    ballVsPlayer(pl);
    ok("side contact launches the ball upward", game.ball.vy <= -BODY_POP + 1e-6,
       `vy=${game.ball.vy.toFixed(1)}`);
    ok("ball shoves the player back", pl.vx < pvx0 - 1, `vx ${pvx0} -> ${pl.vx.toFixed(1)}`);

    // Ball dropping onto the top of the head: harder launch.
    pl.reset();
    game.ball = { x: pl.x, y: pl.y - pl.r - BALL_R + 3, vx: 0, vy: 500, r: BALL_R, mass: BALL_MASS };
    ballVsPlayer(pl);
    ok("header launches harder than a side touch",
       game.ball.vy <= -BODY_POP * HEAD_BOOST + 1e-6, `vy=${game.ball.vy.toFixed(1)}`);

    // Knockback is capped so a max-speed shot can't fling a player away.
    pl.reset();
    game.ball = { x: pl.x + pl.r + 4, y: pl.y, vx: -BALL_MAX_V, vy: 0, r: BALL_R, mass: BALL_MASS };
    ballVsPlayer(pl);
    // A fast ball now knocks players back much harder than a body bump, so the
    // ceiling is BALL_KNOCK_MAX rather than the gentle contact cap.
    ok("knockback is capped", Math.abs(pl.vx) <= BALL_KNOCK_MAX + 1e-6, `vx=${pl.vx.toFixed(1)}`);
    ok("player stays in bounds after knockback",
       pl.x >= WALL + pl.r - 1e-6 && pl.x <= W - WALL - pl.r + 1e-6);

    // Heavier teams are shoved less by the same shot.
    const shove = (team) => {
      const p = new Player(0, team);
      p.reset();
      game.ball = { x: p.x + p.r + 4, y: p.y, vx: -800, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return Math.abs(p.vx);
    };
    const light = TEAMS.find(t => t.size === 1);
    const heavy = TEAMS.find(t => t.size === 5);
    ok("heavier teams resist the ball better", shove(heavy) < shove(light),
       `${heavy.name} ${shove(heavy).toFixed(1)} vs ${light.name} ${shove(light).toFixed(1)}`);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 21c. Kicks always send the ball upward, from any contact angle.
  {
    const saved = { players: game.players, ball: game.ball };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    let allUp = true, worst = 0;

    // Try contact points all around the player: low, level, high, near, far.
    for (const dy of [-0.6, -0.3, 0, 0.3, 0.6]) {
      for (const dxMul of [0.9, 1.05, 1.2]) {
        const pl = game.players[0];
        pl.reset();
        pl.facing = 1;
        pl.kickT = KICK_TIME * 0.5;      // mid-swing
        pl.kickConsumed = false;
        const tip = pl.legTip;
        game.ball = {
          x: tip.x + BALL_R * dxMul * 0.6, y: tip.y + pl.r * dy,
          vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS,
        };
        ballVsPlayer(pl);
        if (pl.kickConsumed) {
          if (!(game.ball.vy < 0)) allUp = false;
          worst = Math.max(worst, game.ball.vy);
        }
      }
    }
    ok("kicks always have upward velocity", allUp, `worst vy=${worst.toFixed(1)}`);

    // A kicked ball must actually clear the ground, not skid along it.
    const pl = game.players[0];
    pl.reset();
    pl.facing = 1;
    pl.kickT = KICK_TIME * 0.5;
    pl.kickConsumed = false;
    const tip = pl.legTip;
    game.ball = { x: tip.x + 6, y: tip.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
    ballVsPlayer(pl);
    const startY = game.ball.y;
    let peak = startY;
    for (let i = 0; i < 240; i++) { stepBall(DT); peak = Math.min(peak, game.ball.y); }
    ok("kicked ball rises off the ground", startY - peak > 60,
       `rose ${(startY - peak).toFixed(1)}px`);

    // Measure a kick's rise and horizontal reach for a given team/power-up.
    const flight = (team, powershot) => {
      const p = new Player(0, team);
      p.reset();
      p.facing = 1;
      if (powershot) p.grant("powershot");
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      const y0 = game.ball.y, x0 = game.ball.x;
      let hi = y0, landed = null;
      for (let i = 0; i < 900; i++) {
        stepBall(DT);
        hi = Math.min(hi, game.ball.y);
        if (landed === null && i > 10 && game.ball.y + game.ball.r >= GROUND_Y - 1) {
          landed = game.ball.x;
        }
      }
      return { rise: y0 - hi, dist: (landed ?? game.ball.x) - x0 };
    };

    // Arc must be substantial, not a token loft.
    const mid = flight(TEAMS[0], false);
    ok("a normal kick arcs at least 80px high", mid.rise >= 80,
       `${mid.rise.toFixed(0)}px (gravity ${gravity.toFixed(0)}, jetpack ${game.jetpack.toFixed(2)}, drag ${ballDrag.toFixed(2)})`);

    // Shot Power shapes the arc: a 5-pip team must loft clearly higher than 2-pip.
    const weak = flight(TEAMS.find(t => t.shot === 2), false);
    const strong = flight(TEAMS.find(t => t.shot === 5), false);
    ok("higher Shot Power arcs higher", strong.rise > weak.rise * 1.3,
       `${weak.rise.toFixed(0)}px -> ${strong.rise.toFixed(0)}px`);

    // Compare LAUNCH SPEED, not distance-to-landing: every team's shot reaches
    // the far wall and rebounds, which caps any distance measurement.
    const launchVx = (team) => {
      const p = new Player(0, team);
      p.reset();
      p.facing = 1;
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return game.ball.vx;
    };
    const wv = launchVx(TEAMS.find(t => t.shot === 2));
    const sv = launchVx(TEAMS.find(t => t.shot === 5));
    ok("higher Shot Power launches the ball faster", sv > wv * 1.3,
       `${wv.toFixed(0)} -> ${sv.toFixed(0)} px/s`);

    // Power Shot must buy SPEED, not altitude. Measured as launch velocity
    // rather than distance-to-landing: a power shot crosses the whole pitch and
    // rebounds off the far wall, which would silently cap any distance metric.
    const launch = (powershot) => {
      const p = new Player(0, TEAMS[0]);
      p.reset();
      p.facing = 1;
      if (powershot) p.grant("powershot");
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return { vx: game.ball.vx, vy: game.ball.vy, hit: p.kickConsumed };
    };
    const ln = launch(false), lp = launch(true);
    ok("power shot connects as a forward shot, not a clearance", ln.hit && lp.hit && ln.vx > 0);
    ok("power shot is much faster forward", lp.vx > ln.vx * 1.5,
       `${ln.vx.toFixed(0)} -> ${lp.vx.toFixed(0)} px/s`);
    // Power Shot must not convert its extra force into ALTITUDE — its lift may
    // match a normal shot's but must never balloon with the added power.
    ok("power shot stays flat, not lofted", Math.abs(lp.vy) <= Math.abs(ln.vy) * 1.1,
       `lift ${ln.vy.toFixed(0)} -> ${lp.vy.toFixed(0)}`);
    ok("power shot puts its force into speed, not height",
       (Math.abs(lp.vx) / Math.abs(ln.vx)) > (Math.abs(lp.vy) / Math.abs(ln.vy)) * 1.5,
       `vx ratio ${(lp.vx / ln.vx).toFixed(2)} vs vy ratio ${(lp.vy / ln.vy).toFixed(2)}`);

    // And it must still travel further over ground it can actually cover.
    const norm = flight(TEAMS[0], false);
    ok("a normal shot lands inside the pitch", norm.dist > 100 && norm.dist < W,
       `${norm.dist.toFixed(0)}px`);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 21d. Edge-triggered input fires ONCE per keypress, at any substep count.
  //      Regression: physics runs 2+ substeps per rendered frame, and reading
  //      `pressed` directly made every menu press advance the cursor twice.
  {
    const saved = { scene: game.scene, sel: [...game.sel], locked: [...game.locked] };

    // Simulate one rendered frame that runs `n` physics substeps.
    const oneFrame = (code, n) => {
      pressed[code] = true;
      edgeFrame = true;
      for (let s = 0; s < n; s++) { step(DT); edgeFrame = false; }
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
    };

    let allSingle = true, detail = "";
    for (const n of [1, 2, 3, 4, 8]) {
      game.scene = SCENE.SELECT;
      game.locked = [false, false];
      game.sel = [0, 0];
      oneFrame("KeyD", n);
      if (game.sel[0] !== 1) { allSingle = false; detail = `${n} substeps advanced ${game.sel[0]}`; }
    }
    ok("one keypress advances the cursor exactly once", allSingle, detail);

    // Left/right must be true inverses.
    game.scene = SCENE.SELECT;
    game.locked = [false, false];
    game.sel = [3, 0];
    oneFrame("KeyD", 2);
    oneFrame("KeyA", 2);
    ok("left undoes right", game.sel[0] === 3, `ended on ${game.sel[0]}`);

    // Holding a key must NOT keep scrolling: only the initial press counts.
    game.sel = [0, 0];
    keys.KeyD = true;              // held, but never re-pressed
    for (let f = 0; f < 10; f++) {
      edgeFrame = true;
      for (let s = 0; s < 2; s++) { step(DT); edgeFrame = false; }
      edgeFrame = true;
    }
    keys.KeyD = false;
    ok("holding a key does not scroll the menu", game.sel[0] === 0, `drifted to ${game.sel[0]}`);

    // A locked player can unlock and pick a different team.
    game.scene = SCENE.SELECT;
    game.locked = [false, false];
    game.sel = [2, 5];
    oneFrame("KeyF", 2);
    ok("kick locks a player in", game.locked[0] === true);
    oneFrame("KeyD", 2);
    ok("moving unlocks a locked player", game.locked[0] === false);
    ok("unlocking still changes the team", game.sel[0] === 3, `sel ${game.sel[0]}`);
    oneFrame("KeyF", 2);
    oneFrame("KeyF", 2);
    ok("kick toggles lock off again", game.locked[0] === false);

    // Locking BOTH players must start the match exactly once.
    game.scene = SCENE.SELECT;
    game.locked = [false, false];
    game.sel = [1, 4];
    oneFrame("KeyF", 2);
    oneFrame("Enter", 2);
    ok("both locked starts the match", game.scene === SCENE.COUNTDOWN, game.scene);
    ok("chosen teams are the ones that were locked",
       !!game.players[0] && !!game.players[1] &&
       game.players[0].team === TEAMS[1] && game.players[1].team === TEAMS[4],
       game.players[0] ? `${game.players[0].team.name} / ${game.players[1].team.name}` : "no players");

    Object.assign(game, saved);
    game.particles = [];
  }

  // 22. Kick fires exactly once per press.
  {
    const p = new Player(0, TEAMS[0]);
    ok("kick starts", p.tryStartKick() === true);
    ok("kick cannot restart mid-swing", p.tryStartKick() === false);
  }

  // 23. Determinism: identical initial conditions give identical results.
  {
    const run = () => {
      const saveBall = game.ball;
      game.ball = { x: 400, y: 120, vx: 555, vy: -222, r: BALL_R, mass: 1 };
      for (let i = 0; i < 900; i++) stepBall(DT);
      const r = `${game.ball.x.toFixed(9)}|${game.ball.y.toFixed(9)}`;
      game.ball = saveBall;
      return r;
    };
    ok("simulation is deterministic", run() === run());
  }

  return { pass, fail, out };
}

/* ------------------------------------------------------------------ BOOT */

const isTest = typeof location !== "undefined" && /[?&]test=1\b/.test(location.search);

game.names = loadNames();
loadOpts(game.opt);
game.board = loadBoard();
loadRules(game.rules);
loadLooks(game.looks);
fitCanvas();

if (isTest) {
  const { pass, fail, out } = runTests();
  for (const line of out) {
    console[line.startsWith("FAIL") ? "error" : "log"](line);
  }
  console.log(`\n${pass} passed, ${fail} failed`);

  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, W, H);
  text(fail === 0 ? "ALL PHYSICS TESTS PASSED" : `${fail} TEST(S) FAILED`,
       W / 2, 40, 22, fail === 0 ? "#4ade80" : "#ef4444", "center", 900);
  text(`${pass} passed · ${fail} failed`, W / 2, 66, 13, "#8fa3c0", "center", 600);
  ctx.font = "12px ui-monospace, SFMono-Regular, Menlo, monospace";
  ctx.textAlign = "left";
  out.forEach((line, i) => {
    const col = (i / 24) | 0;
    ctx.fillStyle = line.startsWith("FAIL") ? "#ef4444" : "#7fd6a0";
    ctx.fillText(line, 24 + col * 330, 100 + (i % 24) * 19);
  });
  text("remove ?test=1 from the URL to play", W / 2, H - 18, 12, "#8fa3c0", "center", 600);
} else {
  requestAnimationFrame(frame);
}
</script>
