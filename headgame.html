    r: HELP_R,
    life: POWERUPS[kind].dur,
    kickCD: 0,
  };
  game.helpers.push(h);
  return h;
}

function updateHelpers(dt) {
  const b = game.ball;

  for (let i = game.helpers.length - 1; i >= 0; i--) {
    const h = game.helpers[i];
    h.life -= dt;
    if (h.life <= 0) { game.helpers.splice(i, 1); continue; }
    if (h.kickCD > 0) h.kickCD -= dt;

    if (h.kind === "keeper") {
      // Hold the goal line and track the ball's height so it can save high
      // shots as well as ground ones. The keeper is allowed anywhere from the
      // grass up to the top of the screen — clamping it to the crossbar would
      // pin it below the bar and make high shots unsaveable.
      const lineX = h.owner === 0 ? WALL + HELP_KEEP_X : W - WALL - HELP_KEEP_X;
      // Track the ball freely, but never drop below the frame it is guarding —
      // a raised goal is defended in the air, not on the grass.
      const guardTop = modeCfg().goals ? goalTop(h.owner) : 0;
      const guardBot = modeCfg().goals ? goalBottom(h.owner) : GROUND_Y;
      const targetY = clamp(b.y, h.r, Math.max(guardBot - h.r * 0.2, guardTop));
      h.x += clamp(lineX - h.x, -HELP_KEEP_SPD * dt, HELP_KEEP_SPD * dt);
      h.y += clamp(targetY - h.y, -HELP_KEEP_SPD * dt, HELP_KEEP_SPD * dt);
    } else {
      // Striker: chase the ball, then boot it at the opponent's goal.
      const targetX = b.x - (h.owner === 0 ? h.r : -h.r);
      const targetY = clamp(b.y, 60, GROUND_Y - h.r);
      h.x += clamp(targetX - h.x, -HELP_STRIKE_SPD * dt, HELP_STRIKE_SPD * dt);
      h.y += clamp(targetY - h.y, -HELP_STRIKE_SPD * dt, HELP_STRIKE_SPD * dt);
    }

    h.x = clamp(h.x, WALL + h.r, W - WALL - h.r);
    h.y = clamp(h.y, h.r, GROUND_Y - h.r);

    // Ball interaction. Helpers never touch players, only the ball.
    const d = len(b.x - h.x, b.y - h.y);
    if (d < h.r + b.r) {
      const attackDir = h.owner === 0 ? 1 : -1;    // toward the opponent's goal
      if (h.kind === "keeper") {
        // Deflect firmly away from its own goal, upward.
        const hb = { x: h.x, y: h.y, vx: 0, vy: 0, r: h.r, mass: 40 };
        const bb = { x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, mass: b.mass };
        resolveCircles(hb, bb, 0.8);
        b.x = bb.x; b.y = bb.y;
        b.vx = Math.abs(bb.vx) * attackDir + attackDir * 190;
        b.vy = Math.min(bb.vy, -320);
        limitSpeed(b, BALL_MAX_V);
        burst(b.x, b.y, POWERUPS.keeper.color, 8);
      } else if (h.kickCD <= 0) {
        // Striker shot: firm, lofted, toward goal.
        b.vx = attackDir * HELP_KICK;
        b.vy = -HELP_KICK * 0.55;
        limitSpeed(b, BALL_MAX_V);
        h.kickCD = HELP_KICK_CD;
        game.shake = Math.max(game.shake, 0.14);
        burst(b.x, b.y, POWERUPS.striker.color, 10);
      }
    }
  }
}

/* ---- bullets -------------------------------------------------------------- */

function updateBullets(dt) {
  const b = game.ball;
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const u = game.bullets[i];
    u.life -= dt;
    u.x += u.vx * dt;
    u.y += u.vy * dt;

    if (u.life <= 0 || u.x < -20 || u.x > W + 20) { game.bullets.splice(i, 1); continue; }

    // Ball hit: shove it hard in the bullet's direction, with some lift.
    if (len(b.x - u.x, b.y - u.y) < b.r + u.r) {
      const dir = Math.sign(u.vx) || 1;
      b.vx += dir * BULLET_BALL_PUSH;
      b.vy = Math.min(b.vy, -BULLET_BALL_PUSH * 0.42);
      limitSpeed(b, BALL_MAX_V);
      burst(u.x, u.y, "#fde68a", 12);
      game.shake = Math.max(game.shake, 0.16);
      game.bullets.splice(i, 1);
      continue;
    }

    // Opponent hit: stagger and knock back. Never friendly fire.
    let consumed = false;
    for (const pl of game.players) {
      if (!pl || pl.index === u.owner) continue;
      if (len(pl.x - u.x, pl.y - u.y) < pl.r + u.r) {
        const dir = Math.sign(u.vx) || 1;
        // Taking a hit charges the victim's meter — and an immovable power shrugs
        // the stun off entirely, which is what makes it worth its charge.
        superGain(pl, SUPER_GAIN_HIT * (game.rules.superRate || 1));
        if (!superImmovable(pl)) {
          pl.stun = Math.max(pl.stun, BULLET_STUN);
          pl.vx += dir * BULLET_KNOCK * (3 / pl.massNow);
          pl.vy = Math.min(pl.vy, -BULLET_KNOCK * 0.4);
          pl.onGround = false;
          pl.kickT = 0;
        }
        burst(pl.x, pl.y, "#fca5a5", 16);
        game.shake = Math.max(game.shake, 0.24);
        consumed = true;
        break;
      }
    }
    if (consumed) game.bullets.splice(i, 1);
  }
}

/* ---- volleyball ----------------------------------------------------------- */

const netTop = () => GROUND_Y - (modeCfg().net || NET_H);
const hasNet = () => modeCfg().net > 0;

/** Keep a player on their own side of the net (volleyball only). */
function confineToHalf(pl) {
  const half = W / 2;
  if (pl.index === 0) {
    const maxX = half - NET_W / 2 - pl.r;
    if (pl.x > maxX) { pl.x = maxX; if (pl.vx > 0) pl.vx = 0; }
  } else {
    const minX = half + NET_W / 2 + pl.r;
    if (pl.x < minX) { pl.x = minX; if (pl.vx < 0) pl.vx = 0; }
  }
}

/** Ball vs. the net post. Returns true on contact. */
function ballVsNet(b) {
  const half = W / 2;
  const top = netTop();
  // Solid band from the grass up to the net top.
  if (b.y + b.r > top && Math.abs(b.x - half) < NET_W / 2 + b.r) {
    const side = b.x < half ? -1 : 1;
    b.x = half + side * (NET_W / 2 + b.r);
    if (Math.sign(b.vx) !== side) b.vx = -b.vx * 0.7;
    return true;
  }
  // Rounded cap so a ball clipping the top deflects rather than sticking.
  return resolveStaticCircle(b, half, top, NET_W / 2, 0.75);
}

/**
 * Volleyball scoring: the ball landing on a side concedes a point to the OTHER
 * side. Returns 0, or the scoring player index + 1 (so 1 or 2) — callers treat
 * a non-zero result as "point scored by that player".
 */
function volleyGround(b) {
  if (b.y + b.r < GROUND_Y - 1) return 0;
  return b.x < W / 2 ? 2 : 1;      // landed left -> P2 scores, and vice versa
}

/* ---- tennis --------------------------------------------------------------- */

/**
 * Tennis scoring. The ball may bounce ONCE on a side; a second bounce on the
 * same side concedes. Tracked via `game.lastBounceSide`, reset whenever the ball
 * crosses the net. Returns 0, or the scoring player index + 1.
 */
function tennisGround(b) {
  if (b.y + b.r < GROUND_Y - 1) return 0;
  const side = b.x < W / 2 ? 0 : 1;
  if (game.lastBounceSide === side) {
    return side === 0 ? 2 : 1;        // second bounce here -> other side scores
  }
  game.lastBounceSide = side;
  return 0;                            // first bounce on this side is legal
}

/** Reset the tennis bounce count when the ball changes side. */
function tennisTrackCrossing(b) {
  const side = b.x < W / 2 ? 0 : 1;
  if (game.ballSide !== side) {
    game.ballSide = side;
    game.lastBounceSide = -1;          // a fresh side gets a fresh bounce
  }
}

/* ---- basketball ----------------------------------------------------------- */

/** Hoop centre for a side. 0 = left hoop (P2 attacks it), 1 = right. */
function hoopPos(side) {
  return {
    x: side === 0 ? WALL + HOOP_X : W - WALL - HOOP_X,
    y: HOOP_Y,
  };
}

/**
 * Basketball scoring: the ball must pass DOWNWARD through a hoop's ring.
 * Returns 0, or the scoring player index + 1. A downward-only test stops a
 * ball bouncing up through the net from counting.
 */
function basketScored(b, prevY) {
  if (b.vy <= 0) return 0;                       // must be falling
  for (const side of [0, 1]) {
    const h = hoopPos(side);
    // Crossed the ring plane this substep?
    /*
      Aperture: the ball centre only has to be inside the ring, rather than
      clearing it by most of a radius. The old margin left a ~28px target and
      made honest shots rattle out.
    */
    if (prevY <= h.y && b.y > h.y && Math.abs(b.x - h.x) < HOOP_R * 0.95) {
      // Left hoop is P2's target, right hoop is P1's.
      return side === 0 ? 2 : 1;
    }
  }
  return 0;
}

/** Ball vs. the two hoop rims — solid little circles either side of the ring. */
function ballVsHoops(b) {
  let hit = false;
  for (const side of [0, 1]) {
    const h = hoopPos(side);
    /*
      Rim colliders sit slightly OUTSIDE the ring, and are skipped entirely for
      a ball already falling through the aperture.

      They used to sit exactly at ±HOOP_R, which is the scoring aperture edge —
      so a ball on target had to clip a rim, and 272 of 400 measured shots
      rattled out instead of dropping. That was the real reason scoring felt
      impossible, not the ball's weight or bounce.
    */
    /*
      The skip window is generous on purpose: the rim used to deflect an
      on-target ball BEFORE it reached the aperture, so a tight window changed
      nothing. A ball descending anywhere near the ring is treated as going in.
    */
    const dropping = b.vy > 0 &&
                     Math.abs(b.x - h.x) < HOOP_R + b.r &&
                     b.y > h.y - HOOP_R * 2.5 &&
                     b.y < h.y + HOOP_R;
    if (!dropping) {
      const rimX = HOOP_R + RIM_R;
      if (resolveStaticCircle(b, h.x - rimX, h.y, RIM_R, 0.6)) hit = true;
      if (resolveStaticCircle(b, h.x + rimX, h.y, RIM_R, 0.6)) hit = true;
    }
    // Backboard itself.
    const bx = side === 0 ? WALL + 4 : W - WALL - 4;
    const boardTop = h.y - BOARD_H * 0.65, boardBot = h.y + BOARD_H * 0.35;
    if (b.y > boardTop && b.y < boardBot) {
      if (side === 0 && b.x - b.r < bx + BOARD_W) {
        b.x = bx + BOARD_W + b.r;
        if (b.vx < 0) { b.vx = -b.vx * 0.7; hit = true; }
      }
      if (side === 1 && b.x + b.r > bx - BOARD_W) {
        b.x = bx - BOARD_W - b.r;
        if (b.vx > 0) { b.vx = -b.vx * 0.7; hit = true; }
      }
    }
  }
  return hit;
}

/* ---- CPU opponent --------------------------------------------------------- */

/*
  Three difficulty tiers. The AI drives the SAME `keys` a human would, so it is
  bound by identical physics, cooldowns and stun rules — it cannot cheat.

    react    seconds of lag before it responds to a new ball position
    err      pixels of aim error (how sloppily it tracks)
    aggr     0..1 chance it commits to a kick when in range
    jump     0..1 chance it jumps for a high ball
    idle     fraction of time it simply does nothing
*/
const CPU_LEVELS = [
  { name: "EASY",   react: 0.34, err: 130, aggr: 0.45, jump: 0.30, idle: 0.30, speed: 0.72 },
  { name: "MEDIUM", react: 0.17, err: 62,  aggr: 0.75, jump: 0.62, idle: 0.10, speed: 0.88 },
  { name: "HARD",   react: 0.06, err: 18,  aggr: 0.96, jump: 0.90, idle: 0.02, speed: 1.0  },
];

const cpuCfg = () => CPU_LEVELS[clamp(game.cpuLevel, 0, CPU_LEVELS.length - 1)];

/**
 * Decide what a CPU-controlled seat wants to do and write it into `keys` for
 * that seat's control scheme. Called once per substep per CPU player.
 */
function updateCPU(pl, dt) {
  const act = intent[pl.index];
  const lvl = cpuCfg();
  const b = game.ball;
  const cfg = modeCfg();

  // Lazily initialise per-player AI memory.
  if (!pl.ai) pl.ai = { t: 0, tx: pl.x, ty: pl.y, idle: 0, jumpRoll: 0 };
  const ai = pl.ai;

  // Release everything first, so a decision is a fresh set of presses.
  act.left = act.right = act.up = act.down = false;

  // Reaction lag: only refresh the target every `react` seconds, and aim with
  // error. This is what actually separates the tiers.
  ai.t -= dt;
  if (ai.t <= 0) {
    ai.t = lvl.react;
    ai.idle = Math.random() < lvl.idle ? lvl.react : 0;
    ai.jumpRoll = Math.random();

    // Predict where the ball will be, scaled by skill: hard aims ahead of it.
    const lead = lvl.aggr * 0.28;
    let px = b.x + b.vx * lead;
    let py = b.y + b.vy * lead;
    px += rand(-lvl.err, lvl.err);
    py += rand(-lvl.err * 0.5, lvl.err * 0.5);

    // In goal modes, stand between the ball and your own goal when the ball is
    // on your half; otherwise press up the pitch toward it.
    const ownGoalDir = pl.index === 0 ? -1 : 1;
    if (cfg.goals) {
      const ballOnMyHalf = (b.x - W / 2) * ownGoalDir > 0;
      if (ballOnMyHalf) {
        // Get goal-side of the ball so a clearance is possible.
        px += ownGoalDir * (pl.r + 6);
      }
    } else if (cfg.confine) {
      // Net games: never leave your own half, and hold a ready position.
      const half = W / 2;
      const lo = pl.index === 0 ? WALL + pl.r : half + NET_W / 2 + pl.r;
      const hi = pl.index === 0 ? half - NET_W / 2 - pl.r : W - WALL - pl.r;
      px = clamp(px, lo, hi);
    }

    ai.tx = clamp(px, WALL + pl.r, W - WALL - pl.r);
    ai.ty = py;
  }

  if (ai.idle > 0) { ai.idle -= dt; return; }

  /*
    Horizontal: walk toward the target with a deadzone so it doesn't jitter.
    `lvl.speed` throttles a weaker CPU by making it release the key part of the
    time — it moves at the same top speed a human would, just less of the time,
    rather than being given different physics.
  */
  const dx = ai.tx - pl.x;
  const dead = 8 + (1 - lvl.aggr) * 22;
  const throttled = lvl.speed < 1 && (ai.throttle = (ai.throttle || 0) + dt) % 0.12 > 0.12 * lvl.speed;
  if (!throttled) {
    if (dx < -dead) act.left = true;
    else if (dx > dead) act.right = true;
  }

  // Jump for a high ball, or to header it, when close enough to matter.
  const near = Math.abs(b.x - pl.x) < pl.r + b.r + 66;
  const ballHigh = b.y < pl.y - pl.r * 0.4;
  if (pl.onGround && near && ballHigh && ai.jumpRoll < lvl.jump) act.up = true;

  // Fast-fall to meet a dropping ball.
  if (!pl.onGround && b.y > pl.y + pl.r && ai.jumpRoll < lvl.jump) act.down = true;

  // Kick / fire. Uses the same entry points a human's keypress would.
  const dist = len(b.x - pl.x, b.y - pl.y);
  const inRange = dist < pl.r + b.r + LEG_LEN * 0.95;
  if (inRange && Math.random() < lvl.aggr * 0.6) {
    if (pl.ammo > 0 && Math.random() < 0.4) pl.tryFire();
    else pl.tryStartKick();
  }
  // Hard CPUs will also shoot at a distant ball to move it upfield.
  if (!inRange && pl.ammo > 0 && lvl.aggr > 0.9 &&
      Math.abs(b.y - pl.y) < pl.r * 1.5 &&
      Math.sign(b.x - pl.x) === pl.facing &&
      Math.random() < 0.04) {
    pl.tryFire();
  }
}

/** Clear the intent a CPU seat was holding (used when leaving PLAY). */
function releaseCPUKeys() {
  for (let i = 0; i < 2; i++) {
    if (!game.cpu[i]) continue;
    const a = intent[i];
    a.left = a.right = a.up = a.down = a.kick = a.kickEdge = a.wallEdge = false;
  }
}

/* ---- online play (peer to peer) ------------------------------------------- */

/*
  ONLINE MODEL — host authority.

  There is no server: this file has no dependencies and nothing to deploy. Two
  browsers connect directly over WebRTC, and the connection offer/answer is
  copied between players by hand (the codes are shown on screen, and the paste
  box accepts them). That is the whole signalling layer.

  To make the two screens agree without any rollback machinery:
    - The HOST runs the one true simulation and broadcasts a state snapshot
      every frame.
    - The GUEST runs no physics of its own. It sends one input byte per frame
      and renders whatever the host sends, interpolating between snapshots so a
      30-60Hz feed still looks smooth at 60fps.

  This means the guest sees a little latency on its own movement. The trade is
  deliberate: it is impossible to desync, which is the failure mode that makes
  hand-rolled netcode unplayable. Snapshots are small (~40 numbers) so a typical
  connection carries them comfortably.
*/

const NET_SNAP_HZ = 30;        // host snapshot rate
/*
  A jump larger than this between two snapshots is a TELEPORT, not movement, so
  it is applied outright instead of being smoothed. Without this, a kickoff reset
  or a goal would slide everything across the pitch over a third of a second.
  Set above the furthest anything travels in one snapshot interval at full pace.
*/
const NET_SNAP_CUT = 220;
/*
  How far BEHIND the newest snapshot the guest renders, as a multiple of the send
  interval. This is the interpolation buffer: the guest draws a moment that is
  already bracketed by two received snapshots, so there is always real data on
  both sides and never a gap to guess at.

  A little over one interval absorbs ordinary jitter. Larger is smoother but
  adds input latency, which matters because the guest also plays.
*/
const NET_LERP_DELAY = 1.6;
/* Snapshots kept for interpolation. Enough to cover the delay plus jitter. */
const NET_SNAP_BUF = 12;
const NET_TIMEOUT = 6;         // seconds without traffic before we call it dead
/*
  How often a machine with no seat to drive says "still here". Well inside
  NET_TIMEOUT, and cheap: a spectator used to send nothing at all and was dropped
  mid-tournament for the crime of watching.
*/
const NET_BEAT_HZ = 4;
const ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];

/*
  RELAY (address-based multiplayer).

  Copy-pasting a WebRTC offer code and then an answer code back is reliable but
  laborious — two long strings, in opposite directions, before anyone plays. The
  relay replaces that with an address: one player runs tools/relay.js, shares the
  address it prints, and the other types it in. The relay hands out a short room
  code and forwards messages between the two members of a room.

  The relay carries the GAME PROTOCOL DIRECTLY rather than brokering a WebRTC
  connection. It is one more hop, but it means no ICE, no NAT traversal and no
  failure mode where the handshake completes and the media path silently does
  not — which is the usual way peer-to-peer play fails for people behind awkward
  routers. WebRTC remains available on the same screen for anyone who wants the
  lower-latency direct path.

  Local play over a LAN is a couple of milliseconds either way. Over a tunnel it
  costs whatever the tunnel costs, which the snapshot interpolation already
  smooths — the same machinery that hides ordinary jitter.
*/
const RELAY_PORT_DEFAULT = 8787;
const RELAY_TIMEOUT = 10;        // seconds to wait for a room before giving up

/**
 * Turn whatever the player typed into a WebSocket URL.
 *
 * Accepts `1.2.3.4`, `1.2.3.4:9000`, `host:port`, or a full http(s)/ws(s) URL —
 * because people will paste all of those, and refusing four of the five would
 * read as the feature being broken.
 */
function relayUrl(input) {
  let s = String(input || "").trim();
  if (!s) return "";
  // A full URL: swap the scheme for its WebSocket equivalent.
  if (/^wss?:\/\//i.test(s)) return s;
  if (/^https:\/\//i.test(s)) return s.replace(/^https:/i, "wss:");
  if (/^http:\/\//i.test(s)) return s.replace(/^http:/i, "ws:");
  // A bare host, with or without a port.
  s = s.replace(/^\/+/, "").replace(/\/+$/, "");
  /*
    A hostname with no port gets the default. An address WITH a port keeps it.
    Checked by counting colons so an IPv6 literal is not mangled — it is passed
    through untouched and the player can bracket it themselves.
  */
  if (s.includes("[") || (s.match(/:/g) || []).length > 1) return `ws://${s}`;
  if (/:\d+$/.test(s)) return `ws://${s}`;
  // A tunnel hostname is almost certainly https, and plain ws to it would fail.
  if (/\.(com|net|org|io|dev|app|sh|xyz|me|link|live|cloud|trycloudflare\.com)$/i.test(s)) {
    return `wss://${s}`;
  }
  return `ws://${s}:${RELAY_PORT_DEFAULT}`;
}

/**
 * A relay socket dressed up as an RTCDataChannel.
 *
 * netAttachChannel only needs onopen/onclose/onerror/onmessage and send(), so
 * wrapping the WebSocket to that shape lets the entire existing protocol —
 * hello, snapshots, intent, bracket sync — run over the relay unchanged. Not one
 * line of game netcode had to learn about a second transport.
 */
function relayChannelShim(ws) {
  const shim = {
    binaryType: "arraybuffer",
    onopen: null, onclose: null, onerror: null, onmessage: null,
    get readyState() { return ws.readyState === 1 ? "open" : "closed"; },
    send(data) {
      // The relay forwards text; the game already sends JSON strings.
      if (ws.readyState === 1) ws.send(data);
    },
    close() { try { ws.close(); } catch (e) { /* already gone */ } },
  };
  ws.onmessage = (e) => {
    /*
      Relay control messages are consumed here; everything else is game traffic
      and is handed straight to the protocol. Splitting them by name rather than
      by channel keeps the relay dumb.
    */
    let msg = null;
    try { msg = JSON.parse(e.data); } catch (err) { /* not ours */ }
    if (msg && typeof msg.t === "string" && RELAY_CONTROL.has(msg.t)) {
      relayControl(msg);
      return;
    }
    if (shim.onmessage) shim.onmessage(e);
  };
  ws.onclose = () => { if (shim.onclose) shim.onclose(); };
  ws.onerror = () => { if (shim.onerror) shim.onerror(); };
  return shim;
}

/** Message names the relay itself uses. Everything else is game traffic. */
const RELAY_CONTROL = new Set([
  "hosting", "joined", "peer-joined", "peer-left", "no-room", "room-full", "expired",
]);

/** Handle one relay control message. */
function relayControl(msg) {
  switch (msg.t) {
    case "hosting":
      // The room exists; show the code for the other player to type.
      net.relayCode = msg.code;
      net.state = "offer";
      net.error = "";
      break;
    case "joined":
      net.relayCode = msg.code;
      net.state = "connecting";
      net.error = "";
      break;
    case "peer-joined":
      /*
        The guest has arrived. Both sides are now connected to the relay, so the
        channel is live and the ordinary handshake can begin — the host announces
        itself exactly as it would over WebRTC.
      */
      net.state = "live";
      net.active = true;
      net.lastRecv = 0;
      netSendHello();
      break;
    case "peer-left":
      net.error = msg.why || "the other player left";
      net.state = "closed";
      net.active = false;
      break;
    case "no-room":
      net.error = `no game found with code ${msg.code}`;
      net.state = "failed";
      break;
    case "room-full":
      net.error = `game ${msg.code} already has two players`;
      net.state = "failed";
      break;
    case "expired":
      net.error = "the room expired";
      net.state = "failed";
      break;
    default:
      break;
  }
}

/** Open a WebSocket to the relay, or report why not. */
function relayConnect(address, onOpen) {
  const url = relayUrl(address);
  if (!url) { net.error = "enter the host's address"; net.state = "failed"; return null; }
  // Remember what was typed, so a retry after a failure does not need it again.
  net.relayAddr = String(address || "").trim();
  net.relayUrl = url;
  net.state = "creating";
  net.error = "";
  let ws;
  try {
    ws = new WebSocket(url);
  } catch (e) {
    net.error = "bad address: " + e.message;
    net.state = "failed";
    return null;
  }
  net.ws = ws;
  net.transport = "relay";
  const shim = relayChannelShim(ws);
  ws.onopen = () => {
    /*
      The socket is up, but the GAME is not connected until a peer joins the room.
      netAttachChannel's onopen is therefore deliberately not fired here — it is
      fired by the "peer-joined" control message, so `net.state` never claims a
      live match with nobody on the other end.
    */
    net.error = "";
    onOpen(ws);
  };
  netAttachChannel(shim);
  // Suppress the shim's own onopen: liveness is decided by the relay's messages.
  shim.onopen = null;
  return ws;
}

/** HOST over the relay: open a room and publish its code. */
function relayHost(address) {
  netReset();
  net.role = "host";
  net.localSeat = 0;
  net.remoteSeat = 1;
  relayConnect(address, (ws) => ws.send(JSON.stringify({ t: "host" })));
}

/** JOIN over the relay: connect and ask for a room by code. */
function relayJoin(address, code) {
  netReset();
  net.role = "guest";
  net.localSeat = 1;
  net.remoteSeat = 0;
  const room = String(code || "").toUpperCase().trim();
  if (!room) { net.error = "enter the 4-letter game code"; net.state = "failed"; return; }
  relayConnect(address, (ws) => ws.send(JSON.stringify({ t: "join", code: room })));
}

const net = {
  active: false,          // an online match is running
  role: null,             // "host" | "guest"
  pc: null,               // RTCPeerConnection
  chan: null,             // RTCDataChannel
  state: "idle",          // idle|creating|offer|answer|connecting|live|failed|closed
  localSeat: 0,           // which seat this machine drives
  remoteSeat: 1,          // which seat the peer drives
  offerText: "",          // code to hand to the other player
  answerText: "",
  paste: "",              // what the user has typed/pasted
  error: "",
  lastRecv: 0,            // seconds since last message
  sendAcc: 0,             // snapshot rate limiter
  snapPrev: null,         // guest: previous snapshot (for interpolation)
  snapNext: null,         // guest: latest snapshot
  snapBuf: [],            // guest: recent snapshots, each stamped with .at
  goalPhaseTarget: 0,     // guest: the host's goal clock, eased toward
  goalPhaseHave: false,   // guest: has a goal clock arrived yet?
  renderT: 0,             // guest: local render clock, trails the newest snapshot
  snapT: 0,               // guest: unused by the buffer, kept for the tests
  snapGap: 1 / NET_SNAP_HZ,
  snapAt: 0,
  pingMs: 0,
  copied: false,
  spectating: false,     // guest watching a tie it is not playing
  peerVersion: "",       // the other machine's build, from its hello
  versionMismatch: false,// true once a differing peer version is seen

  /*
    RELAY transport. "webrtc" is the original copy-a-code path; "relay" connects
    by address through tools/relay.js. Both drive the same protocol, so nothing
    downstream of netAttachChannel knows which is in use.
  */
  transport: "webrtc",   // "webrtc" | "relay"
  ws: null,              // the relay WebSocket, when transport === "relay"
  relayAddr: "",         // what the player typed as the host's address
  relayCode: "",         // the 4-letter room code
  relayUrl: "",          // the resolved ws:// or wss:// URL
  relayWait: 0,          // seconds spent waiting for a room
  editing: null,         // "addr" | "code" while a relay field has the keyboard
  relayGo: null,         // set by ENTER in a field, consumed by updateOnline
  relayIntent: null,     // "host" | "join" — what the typed address is for

  /*
    THE HUB. A tournament can seat up to TOURN_MAX humans, each on their own
    machine, so the HOST holds one connection per joined player:

      { id, pc, chan, name, entrantId, version, mismatch, lastRecv, state }

    A guest still has exactly ONE connection — to the host — and leaves this
    empty, so the guest path stays as simple as it was. All the hub-ness is
    host-side.

    `net.chan` is deliberately kept: with a single peer everything still flows
    through it, which is what lets every existing caller and test keep working
    unchanged while the peer table is introduced.
  */
  peers: [],
  pending: null,         // host: the slot currently awaiting an answer
  nextPeerId: 1,         // host: ids handed to joiners, never reused
  myEntrant: 0,          // which entrant THIS machine plays (host is always 0)
  identified: false,     // guest: has the host told us which entrant we are?
  joinNote: "",          // transient lobby message (someone joined or dropped)
  joinNoteT: 0,
};

const netIsHost = () => net.active && net.role === "host";
const netIsGuest = () => net.active && net.role === "guest";

/** Reset all networking state and tear down any live connection. */
function netReset() {
  try { if (net.chan) net.chan.close(); } catch (e) { /* already gone */ }
  try { if (net.pc) net.pc.close(); } catch (e) { /* already gone */ }
  // The relay socket too, or a reset leaves the old room still forwarding.
  try { if (net.ws) net.ws.close(); } catch (e) { /* already gone */ }
  // Every hub connection goes too, or a stale peer keeps receiving snapshots.
  for (const p of net.peers) {
    try { if (p.chan) p.chan.close(); } catch (e) { /* already gone */ }
    try { if (p.pc) p.pc.close(); } catch (e) { /* already gone */ }
  }
  try { if (net.pending && net.pending.pc) net.pending.pc.close(); }
  catch (e) { /* already gone */ }
  net.pending = null;
  net.peers = [];
  net.nextPeerId = 1;
  net.myEntrant = 0;
  net.identified = false;
  net.joinNote = "";
  net.joinNoteT = 0;
  net.active = false;
  net.role = null;
  net.peerVersion = "";
  net.versionMismatch = false;
  net.pc = null;
  net.chan = null;
  net.state = "idle";
  net.offerText = "";
  net.answerText = "";
  net.paste = "";
  net.error = "";
  net.snapPrev = net.snapNext = null;
  net.snapBuf = [];
  net.renderT = 0;
  net.goalPhaseTarget = 0;
  net.goalPhaseHave = false;
  net.beatAcc = 0;
  net.snapT = 0;
  net.snapGap = 1 / NET_SNAP_HZ;
  net.snapAt = 0;
  net.copied = false;
  net.ws = null;
  net.transport = "webrtc";
  net.relayCode = "";
  net.relayUrl = "";
  net.relayWait = 0;
  // net.relayAddr is deliberately KEPT: it is what the player typed, and having
  // to retype the host's address after every failed attempt is needless friction.
}

/*
  Codes are base64 of the SDP, which is long. We strip it to the fields that
  matter and rebuild on the far side, so the code a player copies is short
  enough to paste into a chat window.
*/
function encodeSignal(obj) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
    .replace(/=+$/, "");
}
function decodeSignal(txt) {
  const pad = "=".repeat((4 - (txt.trim().length % 4)) % 4);
  return JSON.parse(decodeURIComponent(escape(atob(txt.trim() + pad))));
}

/** Wait until ICE gathering finishes so the code contains all candidates. */
function waitForIce(pc) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") return resolve();
    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    pc.addEventListener("icegatheringstatechange", check);
    // Don't hang forever on a stubborn network.
    setTimeout(resolve, 2500);
  });
}

function netAttachChannel(chan, peer) {
  // A hub peer keeps its own channel; a lone connection is still `net.chan`.
  if (peer) peer.chan = chan;
  else net.chan = chan;
  chan.binaryType = "arraybuffer";
  chan.onopen = () => {
    /*
      A PEER connecting must not change the HOST's screen. `net.state` is this
      machine's own connection state, and blindly setting it to "live" tore the
      host out of its lobby the moment anybody joined: the join code and the
      player list vanished, replaced by the two-player CONNECTED card — so no
      further players could be added and START ran a 1v1 instead of the
      tournament. The peer's own liveness is tracked on the peer.
    */
    if (peer) {
      peer.state = "live";
      peer.lastRecv = 0;
      net.active = true;
      net.error = "";
      netSendHello();
      // Tell this machine which entrant it plays, now that it can hear us.
      if (peer.entrantId != null) netSendTo(peer, { t: "me", e: peer.entrantId });
      return;
    }
    net.state = "live";
    net.active = true;
    net.lastRecv = 0;
    net.error = "";
    netSendHello();          // exchange names immediately
  };
  chan.onclose = () => {
    if (peer) { netDropPeer(peer); return; }
    if (net.state === "live") net.state = "closed";
  };
  chan.onerror = () => {
    // One peer erroring is that peer's problem, not the whole lobby's.
    if (peer) { peer.state = "error"; return; }
    net.error = "connection error";
  };
  chan.onmessage = (e) => {
    net.lastRecv = 0;
    if (peer) peer.lastRecv = 0;
    try { netHandle(JSON.parse(e.data), peer); }
    catch (err) { /* ignore a malformed frame rather than dying */ }
  };
}

/** HOST: create an offer for the other player to paste. */
async function netHost() {
  netReset();
  net.role = "host";
  net.localSeat = 0;
  net.remoteSeat = 1;
  net.state = "creating";
  try {
    net.pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    netAttachChannel(net.pc.createDataChannel("hg", {
      ordered: false, maxRetransmits: 0,     // stale snapshots are worthless
    }));
    const offer = await net.pc.createOffer();
    await net.pc.setLocalDescription(offer);
    await waitForIce(net.pc);
    net.offerText = encodeSignal({ t: "o", sdp: net.pc.localDescription.sdp });
    net.state = "offer";
  } catch (e) {
    net.error = "could not start hosting: " + e.message;
    net.state = "failed";
  }
}

/**
 * HOST: open a slot for the NEXT player and mint the code they paste.
 *
 * WebRTC ties one offer to one connection, so a lobby cannot publish a single
 * code that everybody answers — a bundle of eight offers would be ~21KB of
 * base64 to copy by hand. Instead the host always has exactly one slot open, and
 * rolling to the next one is what "the code for the next player" means. Each
 * joiner's flow is unchanged: paste the code, send the answer back.
 */
async function netOpenSlot() {
  if (!netIsHost()) return null;
  if (net.peers.length >= TOURN_MAX - 1) {
    net.error = `the bracket is full (${TOURN_MAX} players)`;
    return null;
  }
  net.pending = null;
  net.copied = false;              // a fresh code has not been copied yet
  net.error = "";
  net.state = "creating";
  try {
    const peer = {
      id: net.nextPeerId++,
      pc: new RTCPeerConnection({ iceServers: ICE_SERVERS }),
      chan: null,
      name: "",
      entrantId: null,             // assigned when the lobby seats them
      version: "",
      mismatch: false,
      lastRecv: 0,
      state: "offering",
    };
    netAttachChannel(peer.pc.createDataChannel("hg", {
      ordered: false, maxRetransmits: 0,     // stale snapshots are worthless
    }), peer);
    const offer = await peer.pc.createOffer();
    await peer.pc.setLocalDescription(offer);
    await waitForIce(peer.pc);
    net.offerText = encodeSignal({ t: "o", sdp: peer.pc.localDescription.sdp });
    net.pending = peer;            // awaiting this joiner's answer
    net.state = "lobby";
    return peer;
  } catch (e) {
    net.error = "could not open a slot: " + e.message;
    net.state = "failed";
    return null;
  }
}

/**
 * HOST: take the answer from whoever is joining, seat them, and immediately open
 * the next slot so the lobby is always ready for one more player.
 */
async function netAcceptJoiner(answerCode) {
  const peer = net.pending;
  if (!peer) { net.error = "no slot is open"; return false; }
  try {
    const sig = decodeSignal(answerCode);
    if (sig.t !== "a") throw new Error("that is not a join code");
    await peer.pc.setRemoteDescription({ type: "answer", sdp: sig.sdp });
    peer.state = "connecting";
    // Seat them in the lowest free slot; entrant 0 is always the host.
    let slot = 1;
    while (peerByEntrant(slot)) slot++;
    peer.entrantId = slot;
    net.peers.push(peer);
    /*
      Tell this machine which entrant it plays. The bracket message is a
      broadcast, so it cannot carry a per-recipient answer; without this the
      guest kept the default of 0 — the HOST's entrant — so it published input
      for a seat it did not own, sent the host nothing it recognised, and was
      timed out and replaced by a CPU six seconds into the first tie.

      Sent on a short repeat as well as here, because this single packet landing
      before the channel is fully open would otherwise be lost silently.
    */
    netSendTo(peer, { t: "me", e: slot });
    net.pending = null;
    net.error = "";
    netOpenSlot();                 // roll the code on for the next player
    return true;
  } catch (e) {
    net.error = "bad code: " + e.message;
    return false;
  }
}

/** GUEST: consume the host's offer and produce an answer code. */
async function netJoin(offerCode) {
  netReset();
  net.role = "guest";
  net.localSeat = 1;
  net.remoteSeat = 0;
  net.state = "creating";
  try {
    const sig = decodeSignal(offerCode);
    if (sig.t !== "o") throw new Error("that is not a host code");
    net.pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    net.pc.ondatachannel = (e) => netAttachChannel(e.channel);
    await net.pc.setRemoteDescription({ type: "offer", sdp: sig.sdp });
    const answer = await net.pc.createAnswer();
    await net.pc.setLocalDescription(answer);
    await waitForIce(net.pc);
    net.answerText = encodeSignal({ t: "a", sdp: net.pc.localDescription.sdp });
    net.state = "answer";
  } catch (e) {
    net.error = "bad code: " + e.message;
    net.state = "failed";
  }
}

/** HOST: accept the guest's answer code and open the link. */
async function netAcceptAnswer(answerCode) {
  try {
    const sig = decodeSignal(answerCode);
    if (sig.t !== "a") throw new Error("that is not a join code");
    await net.pc.setRemoteDescription({ type: "answer", sdp: sig.sdp });
    net.state = "connecting";
  } catch (e) {
    net.error = "bad code: " + e.message;
  }
}

/**
 * Every open channel this machine can write to.
 *
 * The host with a peer table writes to all of them; anything else — a guest, or
 * a host before anyone has joined — falls back to the single `net.chan`. That
 * fallback is what keeps the pre-hub callers and the whole existing test suite
 * working untouched.
 */
function netChannels() {
  if (net.peers.length) {
    const out = [];
    for (const p of net.peers) {
      if (p.chan && p.chan.readyState === "open") out.push(p.chan);
    }
    return out;
  }
  return net.chan && net.chan.readyState === "open" ? [net.chan] : [];
}

/** Broadcast to every connected peer. */
const netSend = (obj) => {
  const chans = netChannels();
  if (!chans.length) return;
  const txt = JSON.stringify(obj);          // serialise once, not per peer
  for (const c of chans) {
    try { c.send(txt); } catch (e) { /* that peer dropped; the rest still get it */ }
  }
};

/** Send to ONE peer — used for anything peer-specific, like its assigned seat. */
function netSendTo(peer, obj) {
  if (!peer || !peer.chan || peer.chan.readyState !== "open") return;
  try { peer.chan.send(JSON.stringify(obj)); } catch (e) { /* dropped */ }
}

/**
 * Is this a HUB session (a peer table), as opposed to the original
 * single-connection host/guest pair?
 *
 * The two are genuinely different shapes and the distinction is needed in
 * several places, so it lives here rather than being re-inferred from
 * `net.peers.length` at each call site.
 */
const netIsHub = () => net.active && net.peers.length > 0;

/** The peer that owns a given entrant, or null. */
function peerByEntrant(id) {
  for (const p of net.peers) if (p.entrantId === id) return p;
  return null;
}

/**
 * Which seat is this peer allowed to drive right now? -1 for none.
 *
 * With no peer (the pre-hub single-connection case) this is the old
 * `net.remoteSeat`. With a peer it is wherever that peer's entrant is seated in
 * the current tie, so a machine can only ever move its own player.
 */
/**
 * A peer has gone. Hand its entrant to the computer and carry on.
 *
 * With eight machines a dropped connection must never stall the bracket, so the
 * tournament continues with a CPU in that seat rather than waiting for somebody
 * who is not coming back. Everyone is told, and the notice names them.
 */
function netDropPeer(peer) {
  const i = net.peers.indexOf(peer);
  if (i < 0) return;
  net.peers.splice(i, 1);
  try { if (peer.chan) peer.chan.close(); } catch (e) { /* already gone */ }
  try { if (peer.pc) peer.pc.close(); } catch (e) { /* already gone */ }

  const e = peer.entrantId != null ? entrantById(peer.entrantId) : null;
  const who = cleanName(peer.name || "", e ? e.name : "A PLAYER");
  if (e) {
    e.owner = "cpu";                        // the computer takes over the seat
    // If they are in the tie being played, that seat must switch over now.
    const seat = game.seats.indexOf(e.id);
    if (seat >= 0 && netIsHost()) game.cpu[seat] = true;
  }
  net.joinNote = `${who} disconnected — the computer takes over`;
  net.joinNoteT = 6;
  if (netIsHost()) netSendBracket();        // everyone learns the new owner
}

function netSeatFor(peer) {
  if (!peer) return net.remoteSeat;
  if (peer.entrantId == null) return -1;
  const seat = game.seats.indexOf(peer.entrantId);
  return seat;                              // -1 when that entrant is not playing
}

/** Which seat does THIS machine drive? -1 while spectating. */
function netLocalSeat() {
  if (!net.active) return net.localSeat;
  // In a hub tournament the local seat follows this machine's own entrant.
  if (game.mode === MODE.TOURNAMENT && net.myEntrant != null) {
    const seat = game.seats.indexOf(net.myEntrant);
    if (seat >= 0) return seat;
    // Not in this tie: only a lone host still drives seat 0 for a local tie.
    if (netIsHost() && !peerByEntrant(game.seats[0]) &&
        !peerByEntrant(game.seats[1])) return net.localSeat;
    return -1;
  }
  return net.localSeat;
}

/** Compact snapshot of everything the guest needs in order to draw. */
function netSnapshot() {
  const round = (v) => Math.round(v * 10) / 10;
  /*
    Rates need finer precision than positions. `round` keeps one decimal, which
    is right for pixels but destroys a value like a goal speed of 0.55 — it
    became 0.6, a 9% error in how fast the goal slides, compounding into ~20px of
    disagreement about where the goal mouth was. Enough for a shot to score on
    one screen and miss on the other.
  */
  const rate = (v) => Math.round(v * 10000) / 10000;
  return {
    t: "s",
    sc: game.scene,
    sr: game.score,
    md: game.mode,
    b: [round(game.ball.x), round(game.ball.y), round(game.ball.r)],
    p: game.players.map((pl) => pl && [
      round(pl.x), round(pl.y), round(pl.r), pl.facing,
      round(pl.kickT * 100), Math.round(pl.stun * 100), pl.ammo,
      TEAMS.indexOf(pl.team),
    ]),
    gp: rate(goalPhase),
    gs: round(goalScale),
    tm: Math.round(game.clock * 10) / 10,
    cd: Math.round(game.timer * 10) / 10,
    pu: game.powerups.map((p) => [Math.round(p.x), Math.round(p.y), p.type]),
    mn: game.mines.map((m) => [Math.round(m.x), Math.round(m.y), round(m.arm)]),
    hp: game.helpers.map((h) => [Math.round(h.x), Math.round(h.y), h.kind, h.owner]),
    bl: game.bullets.map((u) => [Math.round(u.x), Math.round(u.y), Math.sign(u.vx), u.owner]),
    jp: round(game.jetpack),
    ls: game.lastScorer,
    wn: game.winner,
    gf: game.goalFx,
    ch: game.chaos ? Math.ceil(game.chaosT) : -1,
    sd: game.suddenDeath,
    /*
      WORLD GEOMETRY. The guest used to derive all of this locally, so it drew and
      collided against a different arena from the one the host was simulating:
      the map was never sent at all, and chaos re-rolls gravity and the goal
      motion on the host only.

      Sent every snapshot rather than once in `cfg`, so a guest that joins late
      or drops a packet is corrected on the very next frame instead of playing a
      whole match in the wrong arena.
    */
    mp: game.mapId,
    gv: Math.round(gravity),
    gt: rate(goalTravel),
    gl: rate(goalSpeedL),
    gr: rate(goalSpeedR),
    /*
      Walls and built platforms. These were missing from the snapshot entirely,
      so on the guest's screen they simply did not exist: invisible, and the ball
      appeared to bounce off nothing. Sent as plain geometry plus the fields the
      renderer needs — the guest runs no physics, so hp/cooldowns stay host-side.
    */
    wl: game.walls.map((w) => [
      Math.round(w.x), Math.round(w.y), Math.round(w.w), Math.round(w.h),
      w.owner, w.platform ? 1 : 0, round(w.life), w.hp,
      round(w.born), w.grounded ? 1 : 0,
    ]),
  };
}

/**
 * GUEST: adopt a snapshot. Never runs physics.
 *
 * Scalar state (score, clock, scene) is applied immediately; POSITIONS are not.
 * Snapshots arrive at NET_SNAP_HZ, well under the display rate, so writing
 * positions straight in left the guest's world frozen on roughly half of all
 * rendered frames and then jumping twice as far — the reported lag. Instead the
 * last two snapshots are kept and netInterpolate() walks between them every
 * frame, so motion is continuous at whatever rate the screen runs.
 */
function netApplySnapshot(s) {
  /*
    Adopt a number only if it is finite AND inside a sane range, otherwise keep
    what is already in force.

    `typeof NaN` is "number", so a plain type guard let NaN through and it STUCK:
    goalTop() then returned NaN and the goal vanished from the guest's screen for
    the rest of the match with no way to recover. A missing field is handled the
    same way, so a snapshot from an older build still applies cleanly.
  */
  const numOr = (v, cur, lo, hi) =>
    (typeof v === "number" && Number.isFinite(v) && v >= lo && v <= hi) ? v : cur;

  /*
    Stamp the snapshot with its arrival time and keep it in a short buffer. The
    renderer then asks for "the world as it was at time X" for an X that trails
    the newest arrival, so position is a continuous function of the clock.

    An earlier version restarted a 0..1 blend on every packet. That structurally
    could not work: at 60fps against a 30Hz stream the blend only ever reached
    0.74 before the next packet reset it, so a quarter of every window's travel
    was discarded and reappeared as a jump.
  */
  s.at = netClock();
  net.snapBuf.push(s);
  while (net.snapBuf.length > NET_SNAP_BUF) net.snapBuf.shift();
  net.snapPrev = net.snapBuf[net.snapBuf.length - 2] || null;
  net.snapNext = s;

  game.scene = s.sc;
  game.score = s.sr;
  game.mode = s.md;
  game.clock = s.tm;
  game.timer = s.cd;
  game.jetpack = s.jp;
  game.lastScorer = s.ls;
  game.winner = s.wn;
  game.goalFx = s.gf;
  game.suddenDeath = s.sd;
  /*
    The host's goal clock. It is NOT written straight into `goalPhase`: the guest
    ticks that locally every frame so the goals slide smoothly between snapshots,
    and overwriting it 30 times a second dragged the phase backwards and forwards
    — measured at up to 20px of disagreement on where the goal mouth actually
    was, enough for a shot to score on one screen and not the other.

    Instead the arriving value is remembered and `netSyncGoalPhase` eases the
    local clock onto it. A large gap is snapped (a kickoff or a scene change);
    ordinary drift is corrected gradually and invisibly.
  */
  net.goalPhaseTarget = numOr(s.gp, net.goalPhaseTarget, -1e7, 1e7);
  if (net.goalPhaseHave !== true &&
      typeof s.gp === "number" && Number.isFinite(s.gp)) {
    net.goalPhaseHave = true;
    goalPhase = s.gp;                    // first snapshot: adopt outright
  }
  // A bad scale would shrink the goal mouth to nothing, so bound it too.
  goalScale = numOr(s.gs, goalScale, 0.05, 20);
  game.chaos = s.ch >= 0;
  if (s.ch >= 0) game.chaosT = s.ch;

  /*
    Adopt the host's world geometry.

    Every value is bounds-checked, not merely type-checked: `typeof NaN` is
    "number", so a plain type guard let NaN through and it STUCK — goalTop() then
    returned NaN and the goal vanished from the guest's screen for the rest of the
    match with no way to recover. `numOr` keeps the value already in force
    whenever the arriving one is not a finite number inside a sane range, which
    also covers a missing field from an older build.
  */
  if (typeof s.mp === "string" && mapById(s.mp)) game.mapId = s.mp;
  gravity    = numOr(s.gv, gravity, 1, 20000);
  goalTravel = numOr(s.gt, goalTravel, 0, GROUND_Y);
  goalSpeedL = numOr(s.gl, goalSpeedL, -8, 8);
  goalSpeedR = numOr(s.gr, goalSpeedR, -8, 8);

  /*
    Make sure the render shells exist and carry the right team, then place
    everything from THIS snapshot. On the first snapshot there is nothing to
    interpolate from, so the world is simply seeded; afterwards netInterpolate
    overwrites these positions every frame with a blend.
  */
  for (let i = 0; i < 2; i++) {
    const d = s.p[i];
    if (!d) continue;
    if (!game.players[i] || TEAMS.indexOf(game.players[i].team) !== d[7]) {
      game.players[i] = new Player(i, TEAMS[d[7]] || TEAMS[0]);
    }
    const pl = game.players[i];
    pl.facing = d[3];
    pl.kickT = d[4] / 100; pl.stun = d[5] / 100; pl.ammo = d[6];
  }
  netPlaceFrom(s);

  game.powerups = s.pu.map(([x, y, type]) => ({ x, y, type, life: 9, bob: 0 }));
  game.mines = s.mn.map(([x, y, arm]) => ({ x, y, arm, life: 9, pulse: 0 }));
  game.helpers = s.hp.map(([x, y, kind, owner]) => ({
    x, y, kind, owner, r: HELP_R, life: POWERUPS[kind].dur, kickCD: 0, vx: 0, vy: 0,
  }));
  game.bullets = s.bl.map(([x, y, dir, owner]) => ({
    x, y, vx: dir * BULLET_SPD, vy: 0, r: BULLET_R, life: 1, owner,
  }));
  /*
    Walls, rebuilt from the host's geometry. Older hosts send no `wl` field, so
    an absent one leaves the guest's walls untouched rather than clearing them.
  */
  if (Array.isArray(s.wl)) {
    game.walls = s.wl.map(([x, y, w, h, owner, platform, life, hp, born, grounded]) => ({
      x, y, w, h, owner,
      platform: !!platform,
      grounded: !!grounded,
      kind: "solid",
      life, hp, born,
      hitCD: 0, kickFlash: 0,
    }));
  }
}

/**
 * GUEST: ease the local goal clock onto the host's.
 *
 * The goals must slide smoothly, so the guest runs its own clock; but it must
 * also end up where the host says, or the goal mouth is drawn in the wrong
 * place. Called once per frame after the local tick.
 */
function netSyncGoalPhase(dt) {
  if (net.goalPhaseHave !== true) return;
  const drift = net.goalPhaseTarget - goalPhase;
  if (Math.abs(drift) > 0.5) {
    goalPhase = net.goalPhaseTarget;     // a cut, not drift: adopt at once
    return;
  }
  // Ease across, fast enough to stay within a pixel but slow enough to be
  // invisible. The target also advances with the host, so this converges.
  goalPhase += drift * clamp(dt * 8, 0, 1);
  net.goalPhaseTarget += dt;             // the host's clock keeps running too
}

/** Seconds on a monotonic clock, for measuring snapshot arrival gaps. */
function netClock() {
  try { return performance.now() / 1000; } catch (e) { return 0; }
}

/** GUEST: place ball, players and walls exactly as one snapshot describes. */
function netPlaceFrom(s) {
  game.ball.x = s.b[0];
  game.ball.y = s.b[1];
  game.ball.r = s.b[2];
  for (let i = 0; i < 2; i++) {
    const d = s.p[i];
    if (!d || !game.players[i]) continue;
    game.players[i].x = d[0];
    game.players[i].y = d[1];
    game.players[i].r = d[2];
  }
}

/**
 * GUEST: render the world as it was a fixed moment ago.
 *
 * Called once per frame. The target time trails the newest snapshot by
 * NET_LERP_DELAY intervals, so it almost always falls BETWEEN two snapshots that
 * have already arrived — real data on both sides, nothing extrapolated. That
 * makes the drawn position a continuous function of the wall clock rather than a
 * series of per-packet blends, which is what removes the stutter.
 */
function netInterpolate(dt) {
  const buf = net.snapBuf;
  if (buf.length === 0) return;
  if (buf.length === 1) { netPlaceFrom(buf[0]); return; }

  const newest = buf[buf.length - 1];
  /*
    The render target advances with the LOCAL clock, not with snapshot arrivals.

    Deriving it from the newest arrival was the bug: the target then only changed
    when a packet landed, so between packets it was frozen and the guest redrew
    the identical position — motion in 30Hz steps, which is the stutter itself.

    net.renderT is a local clock kept a fixed delay behind the newest snapshot. It
    ticks every frame by dt, and is nudged back toward the ideal offset whenever
    it drifts, so a slow or bursty stream corrects itself without a visible jump.
  */
  const ideal = newest.at - (1 / NET_SNAP_HZ) * NET_LERP_DELAY;
  if (!net.renderT) {
    net.renderT = ideal;
  } else {
    net.renderT += dt;
    /*
      Drift correction. Falling behind the ideal point means the buffer is growing
      and latency is climbing; running ahead means the guest is about to starve.
      Either way, ease toward the ideal rather than snapping to it.
    */
    const drift = ideal - net.renderT;
    if (Math.abs(drift) > 1 / NET_SNAP_HZ * 3) {
      net.renderT = ideal;                 // way out: resynchronise outright
    } else {
      net.renderT += drift * clamp(dt * 4, 0, 1);
    }
  }
  const target = net.renderT;

  // Find the pair that brackets the target time.
  let a = null, b = null;
  for (let i = buf.length - 1; i > 0; i--) {
    if (buf[i - 1].at <= target && target <= buf[i].at) {
      a = buf[i - 1]; b = buf[i];
      break;
    }
  }
  if (!a) {
    /*
      The target is outside the buffer. Older than everything held means the
      guest has fallen behind (a long stall), so show the oldest frame it has;
      newer than everything means the buffer is still filling, so hold the
      newest. Either way, never extrapolate — a guessed position overshoots and
      snaps back, which reads worse than being slightly behind.
    */
    netPlaceFrom(target < buf[0].at ? buf[0] : newest);
    return;
  }

  const span = b.at - a.at;
  const t = span > 1e-6 ? clamp((target - a.at) / span, 0, 1) : 1;
  const mix = (u, v) => u + (v - u) * t;
  const jumped = (dx, dy) => Math.hypot(dx, dy) > NET_SNAP_CUT;

  /*
    A teleport — a kickoff reset, a goal, a scene change — must not be smeared
    across the interpolation window. Past NET_SNAP_CUT the move is a cut and is
    applied outright.
  */
  if (jumped(b.b[0] - a.b[0], b.b[1] - a.b[1])) {
    game.ball.x = b.b[0];
    game.ball.y = b.b[1];
    game.ball.r = b.b[2];
  } else {
    game.ball.x = mix(a.b[0], b.b[0]);
    game.ball.y = mix(a.b[1], b.b[1]);
    game.ball.r = mix(a.b[2], b.b[2]);
  }

  for (let i = 0; i < 2; i++) {
    const pa = a.p[i], pb = b.p[i], pl = game.players[i];
    if (!pa || !pb || !pl) continue;
    if (jumped(pb[0] - pa[0], pb[1] - pa[1])) {
      pl.x = pb[0]; pl.y = pb[1]; pl.r = pb[2];
    } else {
      pl.x = mix(pa[0], pb[0]);
      pl.y = mix(pa[1], pb[1]);
      pl.r = mix(pa[2], pb[2]);
    }
  }
}

/**
 * Handle one decoded message.
 *
 * `peer` is the hub connection it arrived on, when there is one. It is optional:
 * without it the old single-peer routing applies, which is what keeps the
 * pre-hub callers and the existing tests working.
 */
function netHandle(msg, peer) {
  if (msg.t === "i" && netIsHost()) {
    /*
      Route the byte by SENDER, not by a single remote seat.

      `game.seats` holds entrant ids, so the seat this peer is entitled to drive
      is wherever its entrant sits in the current tie. A peer whose entrant is
      not playing right now is a spectator, and its input is DISCARDED — without
      this, any connected machine could steer a match it is not in.
    */
    const seat = netSeatFor(peer);
    if (seat < 0) return;
    unpackIntent(msg.b, intent[seat]);
    return;
  }
  if (msg.t === "s" && netIsGuest()) { netApplySnapshot(msg); return; }
  if (msg.t === "cfg" && netIsGuest()) {
    // Host owns the rules; adopt them so both screens agree.
    game.mode = msg.md;
    game.goalsToWin = msg.g;
    game.matchSecs = msg.ts;
    game.chaos = msg.ch;
    game.sel = msg.sel;
    game.cpu = [false, false];
    if (typeof msg.mp === "string" && mapById(msg.mp)) game.mapId = msg.mp;
    if (msg.rl && typeof msg.rl === "object") {
      // Only adopt keys the local build knows, so a newer host cannot inject
      // unknown tunables into the rules object.
      for (const k in game.rules) {
        if (typeof msg.rl[k] === typeof game.rules[k]) game.rules[k] = msg.rl[k];
      }
    }
    return;
  }
  if (msg.t === "br" && netIsGuest()) {
    game.entrantCount = msg.ec;
    game.entrants = msg.en.map(([id, name, teamIdx, alive, owner, look]) => ({
      id, name: cleanName(name, `PLAYER ${id + 1}`), teamIdx, alive: !!alive, owner,
      // Never trust a look off the wire: faceById/hatById fall back to a known
      // one, so a bogus id cannot reach the renderer.
      look: Array.isArray(look)
        ? { face: faceById(look[0]).id, hat: hatById(look[1]).id }
        : null,
    }));
    game.roundPairs = msg.rp;
    game.tieIndex = msg.ti;
    game.round = msg.rd;
    game.seats = msg.st;
    game.lastResult = msg.lr;
    game.champion = msg.ch >= 0 ? entrantById(msg.ch) : null;
    game.mode = MODE.TOURNAMENT;
    // Mirror the host's seat locks so the select screen agrees on both machines.
    for (let s = 0; s < 2; s++) {
      const e = entrantById(game.seats[s]);
      game.selFixed[s] = !!(e && e.teamIdx !== null);
      game.lookOverride[s] = e && e.look ? { ...e.look } : null;
    }
    // Follow the host between bracket screens; PLAY state arrives as snapshots.
    if (msg.sc === SCENE.BRACKET || msg.sc === SCENE.CHAMPION || msg.sc === SCENE.SELECT) {
      game.scene = msg.sc;
    }
    applyTieControl();
    return;
  }
  if (msg.t === "hi") {
    // Never trust a name off the wire: strip it to printable characters.
    game.remoteName = cleanName(msg.n, "OPPONENT");
    if (peer) {
      peer.name = cleanName(msg.n, `PLAYER ${(peer.entrantId ?? 0) + 1}`);
      peer.version = typeof msg.v === "string"
        ? msg.v.replace(/[^0-9A-Za-z.\-]/g, "").slice(0, 12) : "";
      peer.mismatch = peer.version !== VERSION;
      if (!net.joinNote) { net.joinNote = `${peer.name} joined`; net.joinNoteT = 4; }
    }
    /*
      Version check. Both machines must run the same simulation for host
      authority to make sense, so a mismatch is surfaced plainly instead of
      showing up later as a desync nobody can account for. It is a WARNING, not
      a refusal: close builds usually interoperate, and blocking play outright
      would be worse than letting people decide. An older peer may send no
      version at all, which is itself a mismatch worth showing.
    */
    net.peerVersion = typeof msg.v === "string"
      ? msg.v.replace(/[^0-9A-Za-z.\-]/g, "").slice(0, 12)
      : "";
    net.versionMismatch = net.peerVersion !== VERSION;
    return;
  }
  if (msg.t === "me" && netIsGuest()) {
    // Which entrant this machine plays. Bounded, because it indexes the bracket.
    if (typeof msg.e === "number" && Number.isFinite(msg.e) &&
        msg.e >= 0 && msg.e < TOURN_MAX) {
      net.myEntrant = msg.e;
      net.identified = true;           // we now know which entrant we are
      applyTieControl();               // re-seat accordingly
    }
    return;
  }
  // A spectator's "still here". The clocks are already reset by the channel
  // handler, so there is nothing more to do than not mistake it for rubbish.
  if (msg.t === "ka") return;
  if (msg.t === "bye") { net.state = "closed"; return; }
}

/**
 * Called once per substep from the frame loop. Moves bytes in both directions
 * and handles a dropped connection.
 */
function netPump() {
  if (!net.active) return;

  if (net.joinNoteT > 0) net.joinNoteT = Math.max(0, net.joinNoteT - DT);

  /*
    HUB: every connection is timed out on its own. One silent machine must not
    stall the other seven, so its entrant is handed to a CPU and play continues.
  */
  if (netIsHub()) {
    for (let i = net.peers.length - 1; i >= 0; i--) {
      const p = net.peers[i];
      p.lastRecv = (p.lastRecv || 0) + DT;
      if (p.lastRecv > NET_TIMEOUT ||
          (p.chan && p.chan.readyState === "closed")) netDropPeer(p);
    }
  }

  net.lastRecv += DT;
  /*
    A hub host has no single peer to lose, so its own silence means nothing — the
    per-peer timeouts above are what matter. Without this exemption a lobby would
    declare itself closed six seconds in, because nothing writes to `net.chan`.
  */
  if (!netIsHub() && net.lastRecv > NET_TIMEOUT && net.state === "live") {
    net.state = "closed";
    net.error = "peer stopped responding";
  }

  if (netIsGuest()) {
    /*
      A spectator has no seat to drive, but it must still SPEAK. Sending nothing
      at all meant the host heard silence for the whole of any tie this machine
      was not in — a CPU-vs-CPU tie, or two other people playing — and timed the
      connection out after six seconds, dropping a player who was sitting there
      perfectly happily. Watching is not the same as being gone.

      So a spectator sends a heartbeat instead of input: cheap, and it carries no
      seat, so it can never move anybody.
    */
    if (net.spectating || net.localSeat < 0) {
      net.beatAcc = (net.beatAcc || 0) + DT;
      if (net.beatAcc >= 1 / NET_BEAT_HZ) {
        net.beatAcc = 0;
        netSend({ t: "ka" });
      }
      return;
    }
    netSend({ t: "i", b: packIntent(intent[net.localSeat]) });
    return;
  }

  // Host: broadcast a snapshot at a fixed rate rather than every substep.
  net.sendAcc += DT;
  if (net.sendAcc >= 1 / NET_SNAP_HZ) {
    net.sendAcc = 0;
    netSend(netSnapshot());
  }
}

/** Tell the peer our name and version (re-sent whenever the name changes). */
function netSendHello() {
  if (!net.active) return;
  netSend({ t: "hi", n: cleanName(game.names[net.localSeat], DEFAULT_NAMES[net.localSeat]),
            v: VERSION });
}

/** Host: push the whole bracket so the guest's screen follows along. */
function netSendBracket() {
  if (!netIsHost()) return;
  // Re-state each machine's own entrant: this is per-recipient, so it cannot
  // ride in the broadcast below, and repeating it heals a lost "me" packet.
  for (const p of net.peers) {
    if (p.entrantId != null) netSendTo(p, { t: "me", e: p.entrantId });
  }
  netSend({
    t: "br",
    en: game.entrants.map((e) => [e.id, e.name, e.teamIdx, e.alive ? 1 : 0, e.owner,
                                  e.look ? [e.look.face, e.look.hat] : null]),
    rp: game.roundPairs,
    ti: game.tieIndex,
    rd: game.round,
    sc: game.scene,
    st: game.seats,
    ch: game.champion ? game.champion.id : -1,
    lr: game.lastResult,
    ec: game.entrantCount,
  });
}

/** Host: push the agreed rules to the guest when a match starts. */
function netSendConfig() {
  if (!netIsHost()) return;
  netSend({
    t: "cfg", md: game.mode, g: game.goalsToWin,
    ts: game.matchSecs, ch: game.chaos, sel: game.sel,
    // The arena, so the guest has it before the first snapshot lands.
    mp: game.mapId,
    // Spawn rates and world toggles: the host owns them, and a guest drawing
    // power-ups it will never receive looks like a bug.
    rl: game.rules ? { ...game.rules } : null,
  });
}

/*
  ONLINE TOURNAMENT

  The transport is strictly two peers, so a 4-8 player online bracket cannot
  give everyone their own machine. The model that fits the constraint:

    - The two REMOTE rivals are one entrant each (the host's seat and the
      guest's seat). Every other entrant is a local hot-seat player or a CPU.
    - When a tie pairs the host's entrant against the guest's entrant, it is
      played online, exactly like a 1v1 online match.
    - Any other tie is played on the host's machine — hot-seat or versus CPU —
      and the guest watches it as a spectator via the same snapshot stream.

  So both players always follow the whole bracket on their own screen, and the
  ties that matter to them are the ones they actually play. `entrant.owner` says
  who controls each entrant: "host", "guest" or "cpu".
*/

/** Which seat, if any, a remote peer drives for the current tie. */
/**
 * Does this tie involve a remote human?
 *
 * With a hub that means EITHER seat belongs to a joined peer — two remote
 * players can meet each other without the host being in the tie at all, which
 * the old host-versus-guest test could not express.
 */
function tieIsOnline() {
  if (!net.active || game.mode !== MODE.TOURNAMENT) return false;
  const a = entrantById(game.seats[0]);
  const b = entrantById(game.seats[1]);
  if (!a || !b) return false;
  if (netIsHub()) {
    return !!(peerByEntrant(a.id) || peerByEntrant(b.id));
  }
  return (a.owner === "host" && b.owner === "guest") ||
         (a.owner === "guest" && b.owner === "host");
}

/**
 * Configure control for the tie that is about to start: who is local, who is
 * remote, who is a CPU. Called from nextTie once seats are known.
 */
function applyTieControl() {
  if (game.mode !== MODE.TOURNAMENT) return;

  /*
    Seat control first, and it applies OFFLINE too. This used to return early
    unless a network match was running, so an offline bracket never handed a tie
    to the computer — entrants marked CPU were still played by hand.
  */
  for (let s = 0; s < 2; s++) {
    const e = entrantById(game.seats[s]);
    game.cpu[s] = !!(e && e.owner === "cpu");
  }

  if (!net.active) {
    net.localSeat = 0;
    net.remoteSeat = -1;
    net.spectating = false;
    return;
  }

  /*
    HUB SEATING. Each machine asks one question: is MY entrant in this tie?
    If so it drives that seat and everything else is remote; if not it spectates.
    Input from other machines is routed per-peer in netHandle, so `remoteSeat`
    only matters for the single-peer fallback below.
  */
  /*
    This branch is for a MULTIPLAYER TOURNAMENT on either machine — not just the
    hub host. `netIsHub()` is false on a guest, because a guest has no peer table
    of its own, so gating on it sent guests down the legacy owner-string path:
    a guest playing its own tie was assigned seat 0 instead of its real seat,
    which made `netPump` publish input for a seat it did not own and never send
    anything the host recognised. The host then timed the guest out after six
    seconds and replaced it with a CPU — the reported "it gets disconnected".

    The right question is the same on every machine: is MY entrant in this tie?
  */
  /*
    Use entrant-based seating when this machine actually KNOWS which entrant it
    is: the host always does, and a lobby guest is told by a "me" packet. A
    legacy two-machine guest is never sent one, so it keeps the owner-string path
    below — without this distinction it would assume entrant 0, the host's, and
    drive the wrong seat.
  */
  /*
    Entrant-based seating applies when this machine is part of a MULTI-PLAYER
    session and knows which entrant it is.

    A hub host always qualifies. A guest qualifies once the host has told it (the
    "me" packet). A legacy two-machine session qualifies for neither: its guest is
    never sent an identity, and its host plays every tie itself — including local
    and CPU ones, where entrant 0 is not seated at all. Both keep the
    owner-string path below, which is what that session shape expects.
  */
  const inTournament = game.mode === MODE.TOURNAMENT && net.myEntrant != null;
  const knowsSelf = netIsHub() || net.identified === true;
  if (inTournament && knowsSelf) {
    const mine = game.seats.indexOf(net.myEntrant);
    if (mine >= 0) {
      net.localSeat = mine;
      net.remoteSeat = 1 - mine;
      net.spectating = false;
    } else {
      net.localSeat = -1;
      net.remoteSeat = -1;
      net.spectating = true;           // this machine is not in this tie
    }
    // A seat nobody is connected for is played by the computer, so a bracket
    // with empty slots still runs.
    for (let s = 0; s < 2; s++) {
      const e = entrantById(game.seats[s]);
      if (!e) continue;
      const remote = !!peerByEntrant(e.id);
      const isMine = e.id === net.myEntrant;
      if (!remote && !isMine) game.cpu[s] = true;
    }
    // Only the host simulates, so only the host runs those CPUs.
    if (netIsGuest()) game.cpu = [false, false];
    return;
  }

  const me = netIsHost() ? "host" : "guest";
  const online = tieIsOnline();

  if (online) {
    // Each machine drives its own entrant.
    const mySeat = entrantById(game.seats[0]).owner === me ? 0 : 1;
    net.localSeat = mySeat;
    net.remoteSeat = 1 - mySeat;
    net.spectating = false;
  } else {
    // A local/CPU tie on the host; the guest simply watches.
    net.localSeat = 0;
    net.remoteSeat = -1;               // nothing arrives from the peer
    net.spectating = netIsGuest();
  }
}

/* ---- chaos mode ----------------------------------------------------------- */

/**
 * Re-roll every tunable at once. Bounds are chosen so the result is always
 * playable: the tests assert reachability and that nothing escapes the pitch.
 */
function rollChaos() {
  game.gravMul = rand(GRAV_MIN_MUL, GRAV_MAX_MUL);
  gravity = GRAVITY * game.gravMul;

  ballRest = rand(0.45, 0.95);
  ballDrag = rand(0.12, 0.5);
  playerSpeedMul = rand(0.7, 1.6);
  playerJumpMul = rand(0.8, 1.4);
  playerSizeMul = rand(0.7, 1.35);

  goalTravel = rand(20, 110);
  goalSpeedL = rand(0.25, 1.0);
  goalSpeedR = rand(0.25, 1.0);
  // Only touch goal size when no resize power-up is holding it.
  if (game.goalFxT <= 0) goalScale = rand(0.7, 1.5);

  game.chaosAnnounce = CHAOS_ANNOUNCE;
  game.chaosCount++;
  for (const pl of game.players) if (pl) pl.applyChaos();
}

/** Snapshot of every chaos-tunable, for tests and debugging. */
function getTunablesSnapshot() {
  return {
    ballRest, ballDrag, playerSpeedMul, playerJumpMul, playerSizeMul,
    goalTravel, goalSpeedL, goalSpeedR, goalScale, gravMul: game.gravMul,
  };
}

/**
 * Restore every chaos-tunable to its authored default.
 * This MUST include gravity: rollChaos writes it, and leaving it rolled leaks
 * into everything else that reads gravity (and, in tests, into later cases).
 */
function resetChaos() {
  game.gravMul = 1;
  gravity = GRAVITY;
  ballRest = BALL_REST;
  ballDrag = BALL_DRAG;
  playerSpeedMul = 1;
  playerJumpMul = 1;
  playerSizeMul = 1;
  goalTravel = GOAL_TRAVEL;
  goalSpeedL = GOAL_SPEED_L;
  goalSpeedR = GOAL_SPEED_R;
  if (game.goalFxT <= 0) goalScale = 1;
  game.chaosT = chaosInterval();
  game.chaosAnnounce = 0;
  game.chaosCount = 0;
  for (const pl of game.players) if (pl) pl.applyChaos();
}

/* ---- ball physics for one substep --------------------------------------- */

function stepBall(dt) {
  const b = game.ball;

  const cfg = modeCfg();
  const rest = ballRest * cfg.rest;

  // Jetpack: the ball loses almost all weight and drifts with a slight lift.
  if (game.jetpack > 0) {
    game.jetpack = Math.max(0, game.jetpack - dt);
    integrate(b, dt, gravity * JET_GRAV - JET_LIFT, JET_DRAG);
  } else {
    integrate(b, dt, gravity * cfg.grav, ballDrag * cfg.drag);
  }

  // Ground.
  if (b.y + b.r > GROUND_Y) {
    const wasFalling = b.vy > 0;
    b.y = GROUND_Y - b.r;
    if (b.vy > 0) b.vy = -b.vy * rest;
    if (wasFalling) {
      b.bounces = (b.bounces || 0) + 1;
      // A ball that has hit the ground is no longer a live power shot.
      game.ballPowered = false;
      game.ballPoweredBy = -1;
    }
    /*
      Basketball keeps the ball ALIVE: a bounce too weak to survive the sleep
      clamp below is boosted back to a real dribble instead of being stopped, so
      the ball never lies dead on the court. Only on a genuine downward landing,
      so it cannot pump a ball that is already rising.
    */
    if (game.mode === MODE.BASKET && wasFalling && Math.abs(b.vy) < BASKET_LIVE_V) {
      b.vy = -BASKET_LIVE_V;
    } else if (Math.abs(b.vy) < 30) {
      b.vy = 0;
    }
    // Rolling friction, but a live basketball keeps its pace so a dribbling ball
    // does not grind to a halt in place.
    if (game.mode !== MODE.BASKET) {
      b.vx -= b.vx * clamp(BALL_ROLL * dt, 0, 1);
    } else {
      b.vx -= b.vx * clamp(BALL_ROLL * 0.25 * dt, 0, 1);
    }
  }
  // Ceiling.
  if (b.y - b.r < 0) { b.y = b.r; if (b.vy < 0) b.vy = -b.vy * rest; }

  // Modes without goals have solid side walls from grass to ceiling.
  if (!cfg.goals) {
    if (b.x - b.r < WALL)     { b.x = WALL + b.r;     if (b.vx < 0) b.vx = -b.vx * rest; }
    if (b.x + b.r > W - WALL) { b.x = W - WALL - b.r; if (b.vx > 0) b.vx = -b.vx * rest; }
    limitSpeed(b, BALL_MAX_V);
    return;
  }

  /*
    Each side's mouth is the band its frame occupies. Both edges matter: with
    only an upper bound, a raised goal would leave the wall open below its net
    and the ball could roll out under the frame.
  */
  const topL = goalTop(0), botL = goalBottom(0);
  const topR = goalTop(1), botR = goalBottom(1);
  const inMouthL = b.y > topL && b.y < botL;
  const inMouthR = b.y > topR && b.y < botR;

  // Left wall — open across that goal's mouth, solid elsewhere.
  if (!inMouthL) {
    if (b.x - b.r < WALL) { b.x = WALL + b.r; if (b.vx < 0) b.vx = -b.vx * rest; }
  } else if (b.x - b.r < WALL - GOAL_D) {          // back of the left net
    b.x = WALL - GOAL_D + b.r;
    if (b.vx < 0) b.vx = -b.vx * 0.3;
  }

  // Right wall.
  if (!inMouthR) {
    if (b.x + b.r > W - WALL) { b.x = W - WALL - b.r; if (b.vx > 0) b.vx = -b.vx * rest; }
  } else if (b.x + b.r > W - WALL + GOAL_D) {      // back of the right net
    b.x = W - WALL + GOAL_D - b.r;
    if (b.vx > 0) b.vx = -b.vx * 0.3;
  }

  // Crossbars as static circles — gives real post/bar deflections. When a goal
  // is raised clear of the grass its LOWER edge is a bar too, so add a circle
  // there; otherwise the ball would pass through the drawn frame.
  resolveStaticCircle(b, WALL + POST_R, topL, POST_R, 0.85);
  resolveStaticCircle(b, W - WALL - POST_R, topR, POST_R, 0.85);
  if (botL < GROUND_Y - 1) resolveStaticCircle(b, WALL + POST_R, botL, POST_R, 0.85);
  if (botR < GROUND_Y - 1) resolveStaticCircle(b, W - WALL - POST_R, botR, POST_R, 0.85);

  limitSpeed(b, BALL_MAX_V);
}

/** Ball vs. a player's head/body and swinging leg. */
function ballVsPlayer(pl) {
  const b = game.ball;

  // Body contact is springy and mutual: the ball pops upward, the player is
  // shoved back. Heavier teams (higher massNow) get moved less.
  const pb = { x: pl.x, y: pl.y, vx: pl.vx, vy: pl.vy, r: pl.r, mass: pl.massNow * BODY_MASS_MUL };
  const bb = { x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, mass: b.mass };
  const pvx0 = pl.vx, pvy0 = pl.vy;
  // Pre-collision ball state, needed to size the knockback below.
  const ballVx0 = b.vx, ballVy0 = b.vy, bx0 = b.x, by0 = b.y;

  if (resolveCircles(pb, bb, 0.62)) {
    game.ballLastTouch = pl.index;      // for wall-damage attribution
    b.x = bb.x; b.y = bb.y; b.vx = bb.vx; b.vy = bb.vy;
    // Touching the ball charges the superpower meter.
    superGain(pl, SUPER_GAIN_TOUCH * (game.rules.superRate || 1));

    // Every body touch launches the ball upward. Striking the top of the head
    // launches it harder still.
    const onHead = b.y < pl.y - pl.r * 0.35;
    const pop = BODY_POP * (onHead ? HEAD_BOOST : 1);
    b.vy = Math.min(b.vy, -pop);

    b.vx += pl.vx * 0.35;          // carry some of the player's momentum
    limitSpeed(b, BALL_MAX_V);

    // Reaction on the player, clamped so a rocket can't launch them off-screen.
    pl.x = pb.x;
    pl.y = pb.y;
    pl.vx = pvx0 + clamp((pb.vx - pvx0) * BALL_PUSH, -KNOCK_MAX, KNOCK_MAX);
    pl.vy = pvy0 + clamp((pb.vy - pvy0) * BALL_PUSH, -KNOCK_MAX, KNOCK_MAX);

    /*
      A fast ball KNOCKS THE PLAYER BACK. The impulse scales with the ball's
      incoming speed and is divided by the player's mass, so heavy teams hold
      their ground and light ones get launched. A solid hit also staggers them
      briefly, which is what makes a Power Shot into the opponent a real weapon.
    */
    const impact = len(ballVx0, ballVy0);
    // Only a POWER-SHOT ball knocks players about, and never the player who
    // fired it. Volleyball opts out of knockback entirely.
    const canKnock = game.ballPowered &&
                     game.ballPoweredBy !== pl.index &&
                     game.mode !== MODE.VOLLEY &&
                     modeCfg().knockback;
    if (canKnock && impact > BALL_KNOCK_MIN) {
      const over = impact - BALL_KNOCK_MIN;
      const massRef = 3;                     // baseline player mass
      const force = clamp(over * BALL_KNOCK * (massRef / pl.massNow), 0, BALL_KNOCK_MAX);
      const nx = (pl.x - bx0) || (pl.facing * -1);
      const ny = (pl.y - by0);
      const nl = len(nx, ny) || 1;
      pl.vx = clamp(pl.vx + (nx / nl) * force, -BALL_KNOCK_MAX, BALL_KNOCK_MAX);
      pl.vy = clamp(pl.vy + (ny / nl) * force - force * 0.3,
                    -BALL_KNOCK_MAX, BALL_KNOCK_MAX);
      pl.onGround = false;
      if (impact > BALL_KNOCK_MIN * 1.8) {
        pl.stun = Math.max(pl.stun, BALL_KNOCK_STUN);
        pl.kickT = 0;
        game.shake = Math.max(game.shake, 0.2);
        burst(pl.x, pl.y, "#ffe066", 12);
      }
      // The charge is spent on the player it hit.
      game.ballPowered = false;
      game.ballPoweredBy = -1;
    }

    // Keep the player legal after being shoved.
    pl.x = clamp(pl.x, WALL + pl.r, W - WALL - pl.r);
    if (pl.y + pl.r > GROUND_Y) { pl.y = GROUND_Y - pl.r; if (pl.vy > 0) pl.vy = 0; pl.onGround = true; }
    else if (pl.vy < 0) { pl.onGround = false; }
    if (pl.y - pl.r < 0) { pl.y = pl.r; if (pl.vy < 0) pl.vy = 0; }
  }

  // Leg: only live during a swing, and only one impulse per press.
  if (pl.kickT > 0 && !pl.kickConsumed) {
    const tip = pl.legTip;
    const dx = b.x - tip.x, dy = b.y - tip.y;
    const d = len(dx, dy);
    // Some modes widen the contact window: a small, fast ball is otherwise
    // almost impossible to connect with.
    const reach = (pl.r + b.r) * KICK_REACH * modeReachMul();

    // A kick connects if the ball is near the leg (normal shot) OR if it has
    // slipped behind the player, in which case it becomes a defensive
    // clearance hit away from that player's own goal.
    const forward = (b.x - pl.x) * pl.facing;
    const ownGoalDir = pl.index === 0 ? -1 : 1;         // which way their goal is
    const behind = (b.x - pl.x) * ownGoalDir > 0;        // ball on own-goal side
    const bodyD = len(b.x - pl.x, b.y - pl.y);

    const hitPad = 6 * modeReachMul();
    const normalHit = d < (tip.r + b.r) * modeReachMul() + hitPad &&
                      forward > -pl.r * 0.4;
    const clearHit = behind && bodyD < pl.r + b.r + LEG_LEN * 0.9;

    if (normalHit || clearHit) {
      // `behind` WINS over a leg-tip hit. A player can face toward their own
      // goal, so without this precedence the leg would drive a ball that is
      // already goal-side straight into their own net.
      const isClear = behind;
      const proximity = clamp(1 - (isClear ? bodyD : d) / reach, 0, 1);
      const hasPower = !!pl.effects.powershot;
      // The swing-timing window is wider now (0.72..1.3 rather than 0.8..1.15),
      // so catching the ball late in the swing is a visible reward.
      let power = pl.shotP * (hasPower ? POWERSHOT_MUL : 1) *
                  lerp(0.72, 1.3, tip.t) * modeKickMul() * superKickMul(pl);

      // Clearance: drive the ball AWAY from the defender's own goal, regardless
      // of which way they happen to be facing.
      const dir = isClear ? -ownGoalDir : pl.facing;
      if (isClear) power *= CLEAR_MUL;

      game.ballLastTouch = pl.index;    // for wall-damage attribution

      /*
        A connecting kick RESETS THE JUMP. Landing a touch in mid-air lets you
        jump again, so a skilled player can juggle the ball across the pitch.
        Only a real connection counts, so it cannot be used as a free double
        jump by swinging at nothing.
      */
      if (!pl.onGround) {
        pl.onGround = true;             // consumed by the next jump press
        pl.airKickReset = true;         // for the visual cue
      }

      // Mark the ball as charged so it can knock the opponent back.
      if (hasPower) { game.ballPowered = true; game.ballPoweredBy = pl.index; }
      // A connecting kick builds the superpower meter: involvement is what
      // charges it, so the player doing the work gets the reward.
      superGain(pl, SUPER_GAIN_KICK * (game.rules.superRate || 1));
      const up = hasPower ? KICK_UP * 0.45 : KICK_UP;
      // Force the horizontal offset to match the kick direction so a clearance
      // can't be dragged back toward the defender's own goal.
      const offX = isClear ? Math.abs(b.x - pl.x) * dir : b.x - pl.x;
