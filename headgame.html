  net.state = "idle";
  net.offerText = "";
  net.answerText = "";
  net.paste = "";
  net.error = "";
  net.snapPrev = net.snapNext = null;
  net.snapT = 0;
  net.copied = false;
}

/*
  Codes are base64 of the SDP, which is long. We strip it to the fields that
  matter and rebuild on the far side, so the code a player copies is short
  enough to paste into a chat window.
*/
function encodeSignal(obj) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
    .replace(/=+$/, "");
}
function decodeSignal(txt) {
  const pad = "=".repeat((4 - (txt.trim().length % 4)) % 4);
  return JSON.parse(decodeURIComponent(escape(atob(txt.trim() + pad))));
}

/** Wait until ICE gathering finishes so the code contains all candidates. */
function waitForIce(pc) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") return resolve();
    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    pc.addEventListener("icegatheringstatechange", check);
    // Don't hang forever on a stubborn network.
    setTimeout(resolve, 2500);
  });
}

function netAttachChannel(chan) {
  net.chan = chan;
  chan.binaryType = "arraybuffer";
  chan.onopen = () => {
    net.state = "live";
    net.active = true;
    net.lastRecv = 0;
    net.error = "";
    netSendHello();          // exchange names immediately
  };
  chan.onclose = () => {
    if (net.state === "live") net.state = "closed";
  };
  chan.onerror = () => { net.error = "connection error"; };
  chan.onmessage = (e) => {
    net.lastRecv = 0;
    try { netHandle(JSON.parse(e.data)); }
    catch (err) { /* ignore a malformed frame rather than dying */ }
  };
}

/** HOST: create an offer for the other player to paste. */
async function netHost() {
  netReset();
  net.role = "host";
  net.localSeat = 0;
  net.remoteSeat = 1;
  net.state = "creating";
  try {
    net.pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    netAttachChannel(net.pc.createDataChannel("hg", {
      ordered: false, maxRetransmits: 0,     // stale snapshots are worthless
    }));
    const offer = await net.pc.createOffer();
    await net.pc.setLocalDescription(offer);
    await waitForIce(net.pc);
    net.offerText = encodeSignal({ t: "o", sdp: net.pc.localDescription.sdp });
    net.state = "offer";
  } catch (e) {
    net.error = "could not start hosting: " + e.message;
    net.state = "failed";
  }
}

/** GUEST: consume the host's offer and produce an answer code. */
async function netJoin(offerCode) {
  netReset();
  net.role = "guest";
  net.localSeat = 1;
  net.remoteSeat = 0;
  net.state = "creating";
  try {
    const sig = decodeSignal(offerCode);
    if (sig.t !== "o") throw new Error("that is not a host code");
    net.pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    net.pc.ondatachannel = (e) => netAttachChannel(e.channel);
    await net.pc.setRemoteDescription({ type: "offer", sdp: sig.sdp });
    const answer = await net.pc.createAnswer();
    await net.pc.setLocalDescription(answer);
    await waitForIce(net.pc);
    net.answerText = encodeSignal({ t: "a", sdp: net.pc.localDescription.sdp });
    net.state = "answer";
  } catch (e) {
    net.error = "bad code: " + e.message;
    net.state = "failed";
  }
}

/** HOST: accept the guest's answer code and open the link. */
async function netAcceptAnswer(answerCode) {
  try {
    const sig = decodeSignal(answerCode);
    if (sig.t !== "a") throw new Error("that is not a join code");
    await net.pc.setRemoteDescription({ type: "answer", sdp: sig.sdp });
    net.state = "connecting";
  } catch (e) {
    net.error = "bad code: " + e.message;
  }
}

const netSend = (obj) => {
  if (net.chan && net.chan.readyState === "open") {
    try { net.chan.send(JSON.stringify(obj)); } catch (e) { /* dropped */ }
  }
};

/** Compact snapshot of everything the guest needs in order to draw. */
function netSnapshot() {
  const round = (v) => Math.round(v * 10) / 10;
  return {
    t: "s",
    sc: game.scene,
    sr: game.score,
    md: game.mode,
    b: [round(game.ball.x), round(game.ball.y), round(game.ball.r)],
    p: game.players.map((pl) => pl && [
      round(pl.x), round(pl.y), round(pl.r), pl.facing,
      round(pl.kickT * 100), Math.round(pl.stun * 100), pl.ammo,
      TEAMS.indexOf(pl.team),
    ]),
    gp: round(goalPhase),
    gs: round(goalScale),
    tm: Math.round(game.clock * 10) / 10,
    cd: Math.round(game.timer * 10) / 10,
    pu: game.powerups.map((p) => [Math.round(p.x), Math.round(p.y), p.type]),
    mn: game.mines.map((m) => [Math.round(m.x), Math.round(m.y), round(m.arm)]),
    hp: game.helpers.map((h) => [Math.round(h.x), Math.round(h.y), h.kind, h.owner]),
    bl: game.bullets.map((u) => [Math.round(u.x), Math.round(u.y), Math.sign(u.vx), u.owner]),
    jp: round(game.jetpack),
    ls: game.lastScorer,
    wn: game.winner,
    gf: game.goalFx,
    ch: game.chaos ? Math.ceil(game.chaosT) : -1,
    sd: game.suddenDeath,
  };
}

/** GUEST: adopt a snapshot for rendering. Never runs physics. */
function netApplySnapshot(s) {
  net.snapPrev = net.snapNext;
  net.snapNext = s;
  net.snapT = 0;

  game.scene = s.sc;
  game.score = s.sr;
  game.mode = s.md;
  game.clock = s.tm;
  game.timer = s.cd;
  game.jetpack = s.jp;
  game.lastScorer = s.ls;
  game.winner = s.wn;
  game.goalFx = s.gf;
  game.suddenDeath = s.sd;
  goalPhase = s.gp;
  goalScale = s.gs;
  game.chaos = s.ch >= 0;
  if (s.ch >= 0) game.chaosT = s.ch;

  game.ball.x = s.b[0];
  game.ball.y = s.b[1];
  game.ball.r = s.b[2];

  // Players exist locally only as render shells; the host owns their state.
  for (let i = 0; i < 2; i++) {
    const d = s.p[i];
    if (!d) continue;
    if (!game.players[i] || TEAMS.indexOf(game.players[i].team) !== d[7]) {
      game.players[i] = new Player(i, TEAMS[d[7]] || TEAMS[0]);
    }
    const pl = game.players[i];
    pl.x = d[0]; pl.y = d[1]; pl.r = d[2]; pl.facing = d[3];
    pl.kickT = d[4] / 100; pl.stun = d[5] / 100; pl.ammo = d[6];
  }

  game.powerups = s.pu.map(([x, y, type]) => ({ x, y, type, life: 9, bob: 0 }));
  game.mines = s.mn.map(([x, y, arm]) => ({ x, y, arm, life: 9, pulse: 0 }));
  game.helpers = s.hp.map(([x, y, kind, owner]) => ({
    x, y, kind, owner, r: HELP_R, life: POWERUPS[kind].dur, kickCD: 0, vx: 0, vy: 0,
  }));
  game.bullets = s.bl.map(([x, y, dir, owner]) => ({
    x, y, vx: dir * BULLET_SPD, vy: 0, r: BULLET_R, life: 1, owner,
  }));
}

function netHandle(msg) {
  if (msg.t === "i" && netIsHost()) {
    // Guest input byte -> the remote seat's intent.
    unpackIntent(msg.b, intent[net.remoteSeat]);
    return;
  }
  if (msg.t === "s" && netIsGuest()) { netApplySnapshot(msg); return; }
  if (msg.t === "cfg" && netIsGuest()) {
    // Host owns the rules; adopt them so both screens agree.
    game.mode = msg.md;
    game.goalsToWin = msg.g;
    game.matchSecs = msg.ts;
    game.chaos = msg.ch;
    game.sel = msg.sel;
    game.cpu = [false, false];
    return;
  }
  if (msg.t === "br" && netIsGuest()) {
    game.entrantCount = msg.ec;
    game.entrants = msg.en.map(([id, name, teamIdx, alive, owner]) => ({
      id, name: cleanName(name, `PLAYER ${id + 1}`), teamIdx, alive: !!alive, owner,
    }));
    game.roundPairs = msg.rp;
    game.tieIndex = msg.ti;
    game.round = msg.rd;
    game.seats = msg.st;
    game.lastResult = msg.lr;
    game.champion = msg.ch >= 0 ? entrantById(msg.ch) : null;
    game.mode = MODE.TOURNAMENT;
    // Follow the host between bracket screens; PLAY state arrives as snapshots.
    if (msg.sc === SCENE.BRACKET || msg.sc === SCENE.CHAMPION || msg.sc === SCENE.SELECT) {
      game.scene = msg.sc;
    }
    applyTieControl();
    return;
  }
  if (msg.t === "hi") {
    // Never trust a name off the wire: strip it to printable characters.
    game.remoteName = cleanName(msg.n, "OPPONENT");
    return;
  }
  if (msg.t === "bye") { net.state = "closed"; return; }
}

/**
 * Called once per substep from the frame loop. Moves bytes in both directions
 * and handles a dropped connection.
 */
function netPump() {
  if (!net.active) return;

  net.lastRecv += DT;
  if (net.lastRecv > NET_TIMEOUT && net.state === "live") {
    net.state = "closed";
    net.error = "peer stopped responding";
  }

  if (netIsGuest()) {
    // A spectator has no seat to drive, so it sends nothing at all.
    if (net.spectating || net.localSeat < 0) return;
    netSend({ t: "i", b: packIntent(intent[net.localSeat]) });
    return;
  }

  // Host: broadcast a snapshot at a fixed rate rather than every substep.
  net.sendAcc += DT;
  if (net.sendAcc >= 1 / NET_SNAP_HZ) {
    net.sendAcc = 0;
    netSend(netSnapshot());
  }
}

/** Tell the peer our name (and re-send whenever it changes). */
function netSendHello() {
  if (!net.active) return;
  netSend({ t: "hi", n: cleanName(game.names[net.localSeat], DEFAULT_NAMES[net.localSeat]) });
}

/** Host: push the whole bracket so the guest's screen follows along. */
function netSendBracket() {
  if (!netIsHost()) return;
  netSend({
    t: "br",
    en: game.entrants.map((e) => [e.id, e.name, e.teamIdx, e.alive ? 1 : 0, e.owner]),
    rp: game.roundPairs,
    ti: game.tieIndex,
    rd: game.round,
    sc: game.scene,
    st: game.seats,
    ch: game.champion ? game.champion.id : -1,
    lr: game.lastResult,
    ec: game.entrantCount,
  });
}

/** Host: push the agreed rules to the guest when a match starts. */
function netSendConfig() {
  if (!netIsHost()) return;
  netSend({
    t: "cfg", md: game.mode, g: game.goalsToWin,
    ts: game.matchSecs, ch: game.chaos, sel: game.sel,
  });
}

/*
  ONLINE TOURNAMENT

  The transport is strictly two peers, so a 4-8 player online bracket cannot
  give everyone their own machine. The model that fits the constraint:

    - The two REMOTE rivals are one entrant each (the host's seat and the
      guest's seat). Every other entrant is a local hot-seat player or a CPU.
    - When a tie pairs the host's entrant against the guest's entrant, it is
      played online, exactly like a 1v1 online match.
    - Any other tie is played on the host's machine — hot-seat or versus CPU —
      and the guest watches it as a spectator via the same snapshot stream.

  So both players always follow the whole bracket on their own screen, and the
  ties that matter to them are the ones they actually play. `entrant.owner` says
  who controls each entrant: "host", "guest" or "cpu".
*/

/** Which seat, if any, a remote peer drives for the current tie. */
function tieIsOnline() {
  if (!net.active || game.mode !== MODE.TOURNAMENT) return false;
  const a = entrantById(game.seats[0]);
  const b = entrantById(game.seats[1]);
  if (!a || !b) return false;
  return (a.owner === "host" && b.owner === "guest") ||
         (a.owner === "guest" && b.owner === "host");
}

/**
 * Configure control for the tie that is about to start: who is local, who is
 * remote, who is a CPU. Called from nextTie once seats are known.
 */
function applyTieControl() {
  if (!net.active || game.mode !== MODE.TOURNAMENT) return;
  const me = netIsHost() ? "host" : "guest";
  const online = tieIsOnline();

  for (let s = 0; s < 2; s++) {
    const e = entrantById(game.seats[s]);
    game.cpu[s] = !!(e && e.owner === "cpu");
  }

  if (online) {
    // Each machine drives its own entrant.
    const mySeat = entrantById(game.seats[0]).owner === me ? 0 : 1;
    net.localSeat = mySeat;
    net.remoteSeat = 1 - mySeat;
    net.spectating = false;
  } else {
    // A local/CPU tie on the host; the guest simply watches.
    net.localSeat = 0;
    net.remoteSeat = -1;               // nothing arrives from the peer
    net.spectating = netIsGuest();
  }
}

/* ---- chaos mode ----------------------------------------------------------- */

/**
 * Re-roll every tunable at once. Bounds are chosen so the result is always
 * playable: the tests assert reachability and that nothing escapes the pitch.
 */
function rollChaos() {
  game.gravMul = rand(GRAV_MIN_MUL, GRAV_MAX_MUL);
  gravity = GRAVITY * game.gravMul;

  ballRest = rand(0.45, 0.95);
  ballDrag = rand(0.12, 0.5);
  playerSpeedMul = rand(0.7, 1.6);
  playerJumpMul = rand(0.8, 1.4);
  playerSizeMul = rand(0.7, 1.35);

  goalTravel = rand(20, 110);
  goalSpeedL = rand(0.25, 1.0);
  goalSpeedR = rand(0.25, 1.0);
  // Only touch goal size when no resize power-up is holding it.
  if (game.goalFxT <= 0) goalScale = rand(0.7, 1.5);

  game.chaosAnnounce = CHAOS_ANNOUNCE;
  game.chaosCount++;
  for (const pl of game.players) if (pl) pl.applyChaos();
}

/** Snapshot of every chaos-tunable, for tests and debugging. */
function getTunablesSnapshot() {
  return {
    ballRest, ballDrag, playerSpeedMul, playerJumpMul, playerSizeMul,
    goalTravel, goalSpeedL, goalSpeedR, goalScale, gravMul: game.gravMul,
  };
}

/**
 * Restore every chaos-tunable to its authored default.
 * This MUST include gravity: rollChaos writes it, and leaving it rolled leaks
 * into everything else that reads gravity (and, in tests, into later cases).
 */
function resetChaos() {
  game.gravMul = 1;
  gravity = GRAVITY;
  ballRest = BALL_REST;
  ballDrag = BALL_DRAG;
  playerSpeedMul = 1;
  playerJumpMul = 1;
  playerSizeMul = 1;
  goalTravel = GOAL_TRAVEL;
  goalSpeedL = GOAL_SPEED_L;
  goalSpeedR = GOAL_SPEED_R;
  if (game.goalFxT <= 0) goalScale = 1;
  game.chaosT = chaosInterval();
  game.chaosAnnounce = 0;
  game.chaosCount = 0;
  for (const pl of game.players) if (pl) pl.applyChaos();
}

/* ---- ball physics for one substep --------------------------------------- */

function stepBall(dt) {
  const b = game.ball;

  const cfg = modeCfg();
  const rest = ballRest * cfg.rest;

  // Jetpack: the ball loses almost all weight and drifts with a slight lift.
  if (game.jetpack > 0) {
    game.jetpack = Math.max(0, game.jetpack - dt);
    integrate(b, dt, gravity * JET_GRAV - JET_LIFT, JET_DRAG);
  } else {
    integrate(b, dt, gravity * cfg.grav, ballDrag * cfg.drag);
  }

  // Ground.
  if (b.y + b.r > GROUND_Y) {
    const wasFalling = b.vy > 0;
    b.y = GROUND_Y - b.r;
    if (b.vy > 0) b.vy = -b.vy * rest;
    if (wasFalling) {
      b.bounces = (b.bounces || 0) + 1;
      // A ball that has hit the ground is no longer a live power shot.
      game.ballPowered = false;
      game.ballPoweredBy = -1;
    }
    if (Math.abs(b.vy) < 30) b.vy = 0;
    b.vx -= b.vx * clamp(BALL_ROLL * dt, 0, 1);
  }
  // Ceiling.
  if (b.y - b.r < 0) { b.y = b.r; if (b.vy < 0) b.vy = -b.vy * rest; }

  // Modes without goals have solid side walls from grass to ceiling.
  if (!cfg.goals) {
    if (b.x - b.r < WALL)     { b.x = WALL + b.r;     if (b.vx < 0) b.vx = -b.vx * rest; }
    if (b.x + b.r > W - WALL) { b.x = W - WALL - b.r; if (b.vx > 0) b.vx = -b.vx * rest; }
    limitSpeed(b, BALL_MAX_V);
    return;
  }

  /*
    Each side's mouth is the band its frame occupies. Both edges matter: with
    only an upper bound, a raised goal would leave the wall open below its net
    and the ball could roll out under the frame.
  */
  const topL = goalTop(0), botL = goalBottom(0);
  const topR = goalTop(1), botR = goalBottom(1);
  const inMouthL = b.y > topL && b.y < botL;
  const inMouthR = b.y > topR && b.y < botR;

  // Left wall — open across that goal's mouth, solid elsewhere.
  if (!inMouthL) {
    if (b.x - b.r < WALL) { b.x = WALL + b.r; if (b.vx < 0) b.vx = -b.vx * rest; }
  } else if (b.x - b.r < WALL - GOAL_D) {          // back of the left net
    b.x = WALL - GOAL_D + b.r;
    if (b.vx < 0) b.vx = -b.vx * 0.3;
  }

  // Right wall.
  if (!inMouthR) {
    if (b.x + b.r > W - WALL) { b.x = W - WALL - b.r; if (b.vx > 0) b.vx = -b.vx * rest; }
  } else if (b.x + b.r > W - WALL + GOAL_D) {      // back of the right net
    b.x = W - WALL + GOAL_D - b.r;
    if (b.vx > 0) b.vx = -b.vx * 0.3;
  }

  // Crossbars as static circles — gives real post/bar deflections. When a goal
  // is raised clear of the grass its LOWER edge is a bar too, so add a circle
  // there; otherwise the ball would pass through the drawn frame.
  resolveStaticCircle(b, WALL + POST_R, topL, POST_R, 0.85);
  resolveStaticCircle(b, W - WALL - POST_R, topR, POST_R, 0.85);
  if (botL < GROUND_Y - 1) resolveStaticCircle(b, WALL + POST_R, botL, POST_R, 0.85);
  if (botR < GROUND_Y - 1) resolveStaticCircle(b, W - WALL - POST_R, botR, POST_R, 0.85);

  limitSpeed(b, BALL_MAX_V);
}

/** Ball vs. a player's head/body and swinging leg. */
function ballVsPlayer(pl) {
  const b = game.ball;

  // Body contact is springy and mutual: the ball pops upward, the player is
  // shoved back. Heavier teams (higher massNow) get moved less.
  const pb = { x: pl.x, y: pl.y, vx: pl.vx, vy: pl.vy, r: pl.r, mass: pl.massNow * BODY_MASS_MUL };
  const bb = { x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, mass: b.mass };
  const pvx0 = pl.vx, pvy0 = pl.vy;
  // Pre-collision ball state, needed to size the knockback below.
  const ballVx0 = b.vx, ballVy0 = b.vy, bx0 = b.x, by0 = b.y;

  if (resolveCircles(pb, bb, 0.62)) {
    b.x = bb.x; b.y = bb.y; b.vx = bb.vx; b.vy = bb.vy;

    // Every body touch launches the ball upward. Striking the top of the head
    // launches it harder still.
    const onHead = b.y < pl.y - pl.r * 0.35;
    const pop = BODY_POP * (onHead ? HEAD_BOOST : 1);
    b.vy = Math.min(b.vy, -pop);

    b.vx += pl.vx * 0.35;          // carry some of the player's momentum
    limitSpeed(b, BALL_MAX_V);

    // Reaction on the player, clamped so a rocket can't launch them off-screen.
    pl.x = pb.x;
    pl.y = pb.y;
    pl.vx = pvx0 + clamp((pb.vx - pvx0) * BALL_PUSH, -KNOCK_MAX, KNOCK_MAX);
    pl.vy = pvy0 + clamp((pb.vy - pvy0) * BALL_PUSH, -KNOCK_MAX, KNOCK_MAX);

    /*
      A fast ball KNOCKS THE PLAYER BACK. The impulse scales with the ball's
      incoming speed and is divided by the player's mass, so heavy teams hold
      their ground and light ones get launched. A solid hit also staggers them
      briefly, which is what makes a Power Shot into the opponent a real weapon.
    */
    const impact = len(ballVx0, ballVy0);
    // Only a POWER-SHOT ball knocks players about, and never the player who
    // fired it. Volleyball opts out of knockback entirely.
    const canKnock = game.ballPowered &&
                     game.ballPoweredBy !== pl.index &&
                     game.mode !== MODE.VOLLEY &&
                     modeCfg().knockback;
    if (canKnock && impact > BALL_KNOCK_MIN) {
      const over = impact - BALL_KNOCK_MIN;
      const massRef = 3;                     // baseline player mass
      const force = clamp(over * BALL_KNOCK * (massRef / pl.massNow), 0, BALL_KNOCK_MAX);
      const nx = (pl.x - bx0) || (pl.facing * -1);
      const ny = (pl.y - by0);
      const nl = len(nx, ny) || 1;
      pl.vx = clamp(pl.vx + (nx / nl) * force, -BALL_KNOCK_MAX, BALL_KNOCK_MAX);
      pl.vy = clamp(pl.vy + (ny / nl) * force - force * 0.3,
                    -BALL_KNOCK_MAX, BALL_KNOCK_MAX);
      pl.onGround = false;
      if (impact > BALL_KNOCK_MIN * 1.8) {
        pl.stun = Math.max(pl.stun, BALL_KNOCK_STUN);
        pl.kickT = 0;
        game.shake = Math.max(game.shake, 0.2);
        burst(pl.x, pl.y, "#ffe066", 12);
      }
      // The charge is spent on the player it hit.
      game.ballPowered = false;
      game.ballPoweredBy = -1;
    }

    // Keep the player legal after being shoved.
    pl.x = clamp(pl.x, WALL + pl.r, W - WALL - pl.r);
    if (pl.y + pl.r > GROUND_Y) { pl.y = GROUND_Y - pl.r; if (pl.vy > 0) pl.vy = 0; pl.onGround = true; }
    else if (pl.vy < 0) { pl.onGround = false; }
    if (pl.y - pl.r < 0) { pl.y = pl.r; if (pl.vy < 0) pl.vy = 0; }
  }

  // Leg: only live during a swing, and only one impulse per press.
  if (pl.kickT > 0 && !pl.kickConsumed) {
    const tip = pl.legTip;
    const dx = b.x - tip.x, dy = b.y - tip.y;
    const d = len(dx, dy);
    const reach = (pl.r + b.r) * KICK_REACH;

    // A kick connects if the ball is near the leg (normal shot) OR if it has
    // slipped behind the player, in which case it becomes a defensive
    // clearance hit away from that player's own goal.
    const forward = (b.x - pl.x) * pl.facing;
    const ownGoalDir = pl.index === 0 ? -1 : 1;         // which way their goal is
    const behind = (b.x - pl.x) * ownGoalDir > 0;        // ball on own-goal side
    const bodyD = len(b.x - pl.x, b.y - pl.y);

    const normalHit = d < tip.r + b.r + 6 && forward > -pl.r * 0.4;
    const clearHit = behind && bodyD < pl.r + b.r + LEG_LEN * 0.9;

    if (normalHit || clearHit) {
      // `behind` WINS over a leg-tip hit. A player can face toward their own
      // goal, so without this precedence the leg would drive a ball that is
      // already goal-side straight into their own net.
      const isClear = behind;
      const proximity = clamp(1 - (isClear ? bodyD : d) / reach, 0, 1);
      const hasPower = !!pl.effects.powershot;
      // The swing-timing window is wider now (0.72..1.3 rather than 0.8..1.15),
      // so catching the ball late in the swing is a visible reward.
      let power = pl.shotP * (hasPower ? POWERSHOT_MUL : 1) * lerp(0.72, 1.3, tip.t);

      // Clearance: drive the ball AWAY from the defender's own goal, regardless
      // of which way they happen to be facing.
      const dir = isClear ? -ownGoalDir : pl.facing;
      if (isClear) power *= CLEAR_MUL;

      // Mark the ball as charged so it can knock the opponent back.
      if (hasPower) { game.ballPowered = true; game.ballPoweredBy = pl.index; }
      const up = hasPower ? KICK_UP * 0.45 : KICK_UP;
      // Force the horizontal offset to match the kick direction so a clearance
      // can't be dragged back toward the defender's own goal.
      const offX = isClear ? Math.abs(b.x - pl.x) * dir : b.x - pl.x;
      const { ix, iy } = kickImpulse(offX, b.y - pl.y, dir, power, proximity, up);
      b.vx = ix + pl.vx * 0.3;
      b.vy = iy + pl.vy * 0.2;
      // Guarantee lift: a kick always sends the ball up, never along the floor.
      // The floor scales with the TEAM's shot power (so Shot still shapes the
      // arc) but ignores the Power Shot multiplier, which stays flat and fast.
      const lift = KICK_LIFT_MIN * (pl.shotP / KICK_BASE) * (hasPower ? 0.8 : 1);
      b.vy = Math.min(b.vy, -lift);
      limitSpeed(b, BALL_MAX_V);
      pl.kickConsumed = true;
      game.shake = Math.max(game.shake, 0.12 + proximity * 0.1);
      burst(b.x, b.y, "#ffffff", 8);
    }
  }
}

/* ------------------------------------------------------- 9. UPDATE + LOOP */

/**
 * Setup screen. Either player can drive it: up/down picks a row, left/right
 * changes that row's value, kick activates START.
 */
function updateMenu(dt) {
  stepMenuFx(dt);          // the attract scene animates while you browse

  const up = hit(SCHEME[0].up) || hit(SCHEME[1].up);
  const down = hit(SCHEME[0].down) || hit(SCHEME[1].down);
  const left = hit(SCHEME[0].left) || hit(SCHEME[1].left);
  const right = hit(SCHEME[0].right) || hit(SCHEME[1].right);
  const go = kickHit(0) || kickHit(1) || hit("Space");

  // Rows: the player count only applies to tournament mode, so skip it in single.
  const rows = menuRows();
  game.menuRow = clamp(game.menuRow, 0, rows.length - 1);
  if (up)   game.menuRow = (game.menuRow + rows.length - 1) % rows.length;
  if (down) game.menuRow = (game.menuRow + 1) % rows.length;

  const row = rows[game.menuRow];
  const step = (left ? -1 : right ? 1 : 0);

  if (step !== 0) {
    switch (row) {
      case "mode": {
        const i = MODE_ORDER.indexOf(game.mode);
        game.mode = MODE_ORDER[(i + step + MODE_ORDER.length) % MODE_ORDER.length];
        break;
      }
      case "chaos":
        game.chaos = !game.chaos;
        break;
      case "map": {
        const i = MAPS.findIndex((m) => m.id === game.mapId);
        game.mapId = MAPS[(i + step + MAPS.length) % MAPS.length].id;
        break;
      }
      case "opponent":
        // P2 is either a second human or the CPU. P1 is always human.
        game.cpu = [false, !game.cpu[1]];
        break;
      case "cpulevel":
        game.cpuLevel = clamp(game.cpuLevel + step, 0, CPU_LEVELS.length - 1);
        break;
      case "online":
        // Entering the online screen; the actual connect happens there.
        break;
      case "name1":
      case "name2":
        game.editing = row === "name1" ? 0 : 1;
        break;
      case "players":
        game.entrantCount = clamp(game.entrantCount + step, TOURN_MIN, TOURN_MAX);
        break;
      case "goals":
        game.goalsToWin = clamp(game.goalsToWin + step, GOALS_MIN, GOALS_MAX);
        break;
      case "time":
        game.timeIdx = clamp(game.timeIdx + step, 0, TIME_OPTIONS.length - 1);
        game.matchSecs = TIME_OPTIONS[game.timeIdx];
        break;
    }
  }

  if (go && (row === "name1" || row === "name2")) {
    game.editing = row === "name1" ? 0 : 1;
    return;
  }

  if (go && row === "rules") {
    game.rulesFrom = SCENE.MENU;
    game.rulesRow = 0;
    game.scene = SCENE.RULES;
    return;
  }

  if (go && row === "board") {
    game.boardFrom = SCENE.MENU;
    game.boardScroll = 0;
    game.scene = SCENE.BOARD;
    return;
  }

  if (go && row === "settings") {
    game.settingsFrom = SCENE.MENU;
    game.settingsRow = 0;
    game.scene = SCENE.SETTINGS;
    return;
  }

  if (go && row === "online") {
    if (typeof RTCPeerConnection === "undefined") {
      net.error = "this browser has no WebRTC support";
    } else {
      netReset();
      game.scene = SCENE.ONLINE;
    }
    return;
  }

  if (go && row === "start") {
    if (game.mode === MODE.TOURNAMENT) {
      // Name everyone first, so the bracket is readable.
      game.rosterNames = [];
      for (let i = 0; i < game.entrantCount; i++) {
        game.rosterNames.push(i < 2 ? cleanName(game.names[i], `PLAYER ${i + 1}`)
                                    : `PLAYER ${i + 1}`);
      }
      game.rosterEdit = -1;
      game.scene = SCENE.ROSTER;
      return;
    }
    // SINGLE, VOLLEY, TENNIS and BASKET all go straight to team selection.
    game.seats = [null, null];
    game.sel = [0, 3];
    game.locked = [false, false];
    game.scene = SCENE.SELECT;
  }
}

/**
 * Connection screen. Deliberately keyboard-only so it matches the rest of the
 * game: H hosts, J joins, V pastes from the clipboard, C copies your code,
 * ENTER accepts a pasted code, ESC backs out.
 */
function updateOnline(dt) {
  if (hit("Escape")) { escUsed = true; netReset(); game.scene = SCENE.MENU; return; }

  if (net.state === "idle" || net.state === "failed") {
    if (hit("KeyH")) { netHost(); return; }
    if (hit("KeyJ")) { net.state = "await-offer"; net.paste = ""; return; }
  }

  // Waiting for the user to paste the other side's code.
  if (net.state === "await-offer" && net.paste && hit("Enter")) {
    netJoin(net.paste);
    return;
  }
  if (net.state === "offer" && net.paste && hit("Enter")) {
    netAcceptAnswer(net.paste);
    return;
  }

  // Once live, the host starts the match for both machines.
  if (net.state === "live" && netIsHost() && (kickHit(0) || hit("Space"))) {
    netSendConfig();
    if (game.mode === MODE.TOURNAMENT) {
      // Name the field first; the bracket then syncs to the guest.
      game.rosterNames = [];
      for (let i = 0; i < game.entrantCount; i++) {
        game.rosterNames.push(i === 0 ? cleanName(game.names[0], "PLAYER 1")
                            : i === 1 ? (game.remoteName || "PLAYER 2")
                            : `PLAYER ${i + 1}`);
      }
      game.rosterEdit = -1;
      game.rosterCursor = 0;
      game.scene = SCENE.ROSTER;
      return;
    }
    game.cpu = [false, false];
    startMatch();
    netSendConfig();
    return;
  }
}

/** Roster screen: name every tournament entrant before the bracket begins. */
function updateRoster(dt) {
  if (game.rosterEdit >= 0) return;            // keydown handles typing

  if (hit("Escape")) { escUsed = true; game.scene = SCENE.MENU; return; }

  const n = game.entrantCount;
  if (hit(SCHEME[0].down) || hit(SCHEME[1].down)) game.rosterCursor = (game.rosterCursor + 1) % (n + 1);
  if (hit(SCHEME[0].up) || hit(SCHEME[1].up)) game.rosterCursor = (game.rosterCursor + n) % (n + 1);

  if (kickHit(0) || kickHit(1) || hit("Space") || hit("Enter")) {
    if (game.rosterCursor === n) {              // the START row
      startTournament();
    } else {
      game.rosterEdit = game.rosterCursor;
    }
  }
}

/** Scenes during which ESC should open the pause overlay. */
const PAUSABLE = new Set([SCENE.COUNTDOWN, SCENE.PLAY, SCENE.CELEBRATE]);

/**
 * Open the pause overlay, remembering what it interrupted.
 * Online play cannot truly be frozen — the peer keeps simulating — so there it
 * behaves as a non-blocking overlay and says so rather than pretending.
 */
function openPause() {
  game.pauseFrom = game.scene;
  game.pauseRow = 0;
  game.scene = SCENE.PAUSE;
  releaseCPUKeys();
  // Drop any held input so a key held at the moment of pausing doesn't
  // keep steering when play resumes.
  for (const a of intent) {
    a.left = a.right = a.up = a.down = a.kick = a.kickEdge = false;
  }
}

function closePause() {
  game.scene = game.pauseFrom || SCENE.PLAY;
  game.pauseFrom = null;
}

/** Leave a match entirely and return to the setup menu. */
function quitToMenu() {
  game.scene = SCENE.MENU;
  game.pauseFrom = null;
  game.locked = [false, false];
  game.suddenDeath = false;
  game.editing = -1;
  if (net.active) netReset();      // a match abandoned online drops the link
}

function updatePause(dt) {
  const up = hit(SCHEME[0].up) || hit(SCHEME[1].up);
  const down = hit(SCHEME[0].down) || hit(SCHEME[1].down);
  const go = kickHit(0) || kickHit(1) || hit("Space") || hit("Enter");

  if (hit("Escape")) { escUsed = true; closePause(); return; }
  if (up) game.pauseRow = (game.pauseRow + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length;
  if (down) game.pauseRow = (game.pauseRow + 1) % PAUSE_ITEMS.length;

  if (!go) return;
  switch (PAUSE_ITEMS[game.pauseRow]) {
    case "resume":
      closePause();
      break;
    case "settings":
      game.settingsFrom = SCENE.PAUSE;
      game.settingsRow = 0;
      game.scene = SCENE.SETTINGS;
      break;
    case "board":
      game.boardFrom = SCENE.PAUSE;
      game.boardScroll = 0;
      game.scene = SCENE.BOARD;
      break;
    case "restart":
      // Same rules and teams, fresh scoreline.
      game.pauseFrom = null;
      startMatch();
      break;
    case "quit":
      quitToMenu();
      break;
  }
}

function updateSettings(dt) {
  const up = hit(SCHEME[0].up) || hit(SCHEME[1].up);
  const down = hit(SCHEME[0].down) || hit(SCHEME[1].down);
  const left = hit(SCHEME[0].left) || hit(SCHEME[1].left);
  const right = hit(SCHEME[0].right) || hit(SCHEME[1].right);
  const go = kickHit(0) || kickHit(1) || hit("Space") || hit("Enter");

  const leave = () => {
    saveOpts(game.opt);
    game.scene = game.settingsFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.settingsFrom = null;
  };

  if (hit("Escape")) { escUsed = true; leave(); return; }
  if (up) game.settingsRow = (game.settingsRow + SETTINGS_ITEMS.length - 1) % SETTINGS_ITEMS.length;
  if (down) game.settingsRow = (game.settingsRow + 1) % SETTINGS_ITEMS.length;

  const row = SETTINGS_ITEMS[game.settingsRow];
  const toggled = go || left || right;
  if (!toggled) return;

  switch (row) {
    case "shake":     game.opt.shake = !game.opt.shake; saveOpts(game.opt); break;
    case "particles": game.opt.particles = !game.opt.particles; saveOpts(game.opt); break;
    case "flash":     game.opt.flash = !game.opt.flash; saveOpts(game.opt); break;
    case "sfxhint":   game.opt.hints = !game.opt.hints; saveOpts(game.opt); break;
    case "back":      if (go) leave(); break;
  }
}

const LB_ROWS_VISIBLE = 9;

function updateBoard(dt) {
  const ranked = rankBoard(game.board);
  const maxScroll = Math.max(0, ranked.length - LB_ROWS_VISIBLE);
  // Clamp unconditionally: the table can shrink between visits (or be set from
  // elsewhere), so a stale scroll offset must correct itself immediately.
  game.boardScroll = clamp(game.boardScroll, 0, maxScroll);

  if (hit("Escape")) {
    escUsed = true;
    game.scene = game.boardFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.boardFrom = null;
    return;
  }
  if (hit(SCHEME[0].down) || hit(SCHEME[1].down)) {
    game.boardScroll = Math.min(maxScroll, game.boardScroll + 1);
  }
  if (hit(SCHEME[0].up) || hit(SCHEME[1].up)) {
    game.boardScroll = Math.max(0, game.boardScroll - 1);
  }
  // Kick or ENTER also leaves, so the screen is never a dead end.
  if (kickHit(0) || kickHit(1) || hit("Enter") || hit("Space")) {
    game.scene = game.boardFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.boardFrom = null;
  }
}

/** Spawn-rate screen. Every row is driven by RULE_DEFS, including its range. */
function updateRules(dt) {
  const rowsN = RULE_DEFS.length + 2;           // + RESET + BACK
  const up = hit(SCHEME[0].up) || hit(SCHEME[1].up);
  const down = hit(SCHEME[0].down) || hit(SCHEME[1].down);
  const left = hit(SCHEME[0].left) || hit(SCHEME[1].left);
  const right = hit(SCHEME[0].right) || hit(SCHEME[1].right);
  const go = kickHit(0) || kickHit(1) || hit("Enter") || hit("Space");

  const leave = () => {
    saveRules(game.rules);
    game.scene = game.rulesFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.rulesFrom = null;
  };

  if (hit("Escape")) { escUsed = true; leave(); return; }
  if (up) game.rulesRow = (game.rulesRow + rowsN - 1) % rowsN;
  if (down) game.rulesRow = (game.rulesRow + 1) % rowsN;

  const i = game.rulesRow;
  if (i === RULE_DEFS.length) {                 // RESET
    if (go) { game.rules = { ...RULE_DEFAULTS }; saveRules(game.rules); }
    return;
  }
  if (i === RULE_DEFS.length + 1) {             // BACK
    if (go) leave();
    return;
  }

  const d = RULE_DEFS[i];
  if (d.type === "flag") {
    if (left || right || go) {
      game.rules[d.key] = !game.rules[d.key];
      saveRules(game.rules);
    }
    return;
  }
  const step = (right ? d.step : left ? -d.step : 0);
  if (step) {
    game.rules[d.key] = clampRule(d.key, game.rules[d.key] + step);
    saveRules(game.rules);
  }
}

function updateSelect(dt) {
  // A CPU seat picks a team for itself and locks in, so the human only chooses
  // once. Re-rolled each time the screen is entered for variety.
  for (let i = 0; i < 2; i++) {
    if (game.cpu[i] && !game.locked[i]) {
      game.sel[i] = (Math.random() * TEAMS.length) | 0;
      game.locked[i] = true;
    }
  }

  for (let i = 0; i < 2; i++) {
    if (game.cpu[i]) continue;          // CPU seats are already locked
    const S = SCHEME[i];

    // A locked player can change their mind: kick un-readies, and a direction
    // both un-readies AND moves the cursor, so one press does what it looks like.
    if (game.locked[i]) {
      const moved = hit(S.left) || hit(S.right) || hit(S.up) || hit(S.down);
      if (moved || kickHit(i)) game.locked[i] = false;
      if (!moved) continue;        // fall through so the move applies below
    }

    /*
      Three rows per player: TEAM, FACE, HAT. Up/down changes row, left/right
      changes the value on that row. Kick locks in. The team row keeps its
      original wrap-by-4 feel by stepping a whole row of the team grid.
    */
    if (hit(S.up))   game.lookRow[i] = (game.lookRow[i] + 2) % 3;
    if (hit(S.down)) game.lookRow[i] = (game.lookRow[i] + 1) % 3;

    const step = hit(S.left) ? -1 : hit(S.right) ? 1 : 0;
    if (step !== 0) {
      if (game.lookRow[i] === 0) {
        game.sel[i] = (game.sel[i] + step + TEAMS.length) % TEAMS.length;
      } else if (game.lookRow[i] === 1) {
        const k = FACES.findIndex((f) => f.id === game.looks[i].face);
        game.looks[i].face = FACES[(k + step + FACES.length) % FACES.length].id;
        saveLooks(game.looks);
      } else {
        const k = HATS.findIndex((h) => h.id === game.looks[i].hat);
        game.looks[i].hat = HATS[(k + step + HATS.length) % HATS.length].id;
        saveLooks(game.looks);
      }
    }
    if (kickHit(i)) game.locked[i] = true;
  }

  if (game.locked[0] && game.locked[1]) {
    game.locked = [false, false];
    startMatch();
  }
}

function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    p.vy += GRAVITY * 0.35 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

function step(dt) {
  /*
    A GUEST runs no simulation at all — the host owns the world and streams it.
    We still tick cosmetic timers so shake, flashes and particles animate, but
    everything authoritative arrives in a snapshot.
  */
  if (netIsGuest()) {
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt);
    if (game.gravAnnounce > 0) game.gravAnnounce = Math.max(0, game.gravAnnounce - dt);
    if (game.chaosAnnounce > 0) game.chaosAnnounce = Math.max(0, game.chaosAnnounce - dt);
    updateParticles(dt);
    for (const k in pressed) { /* consumed by gatherIntent */ }
    return;
  }

  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
  if (game.flash > 0) game.flash = Math.max(0, game.flash - dt);
  if (game.gravAnnounce > 0) game.gravAnnounce = Math.max(0, game.gravAnnounce - dt);
  // Goals slide continuously, including during countdowns and celebrations so
  // their motion never visibly stutters.
  goalPhase += dt;
  updateParticles(dt);

  switch (game.scene) {
    case SCENE.MENU:
      updateMenu(dt);
      break;

    case SCENE.ONLINE:
      updateOnline(dt);
      break;

    case SCENE.ROSTER:
      updateRoster(dt);
      break;

    case SCENE.PAUSE:
      updatePause(dt);
      break;

    case SCENE.SETTINGS:
      updateSettings(dt);
      break;

    case SCENE.BOARD:
      updateBoard(dt);
      break;

    case SCENE.RULES:
      updateRules(dt);
      break;

    case SCENE.SELECT:
      updateSelect(dt);
      break;

    case SCENE.COUNTDOWN:
      game.timer -= dt;
      // Players may position themselves; the ball is held.
      game.players[0].update(dt, game.players[1]);
      game.players[1].update(dt, game.players[0]);
      if (modeCfg().confine) {
        confineToHalf(game.players[0]);
        confineToHalf(game.players[1]);
      }
      if (game.timer <= 0) game.scene = SCENE.PLAY;
      break;

    case SCENE.PLAY: {
      const cfgP = modeCfg();
      const volley = game.mode === MODE.VOLLEY;
      const netMode = hasNet();       // volleyball AND tennis
      const tennis = game.mode === MODE.TENNIS;
      const basket = game.mode === MODE.BASKET;

      // CPU seats write their own intent; local and remote seats are already
      // filled in by gatherIntent / the network before step() runs.
      for (let i = 0; i < 2; i++) {
        if (game.cpu[i]) updateCPU(game.players[i], dt);
      }

      for (let i = 0; i < 2; i++) {
        if (game.cpu[i]) continue;          // the AI calls these itself
        const a = intent[i];
        // Kick doubles as fire when armed: the pistol takes priority so picking
        // one up changes what the button does, with no extra key to learn.
        if (a.kickEdge && game.players[i].ammo > 0) game.players[i].tryFire();
        else if (a.kick) game.players[i].tryStartKick();
      }

      game.players[0].update(dt, game.players[1]);
      game.players[1].update(dt, game.players[0]);

      const ballPrevY = game.ball.y;    // for the basket ring-crossing test
      stepBall(dt);
      if (netMode) ballVsNet(game.ball);
      if (basket) ballVsHoops(game.ball);
      ballVsPlatforms(game.ball);
      playerVsPlatforms(game.players[0]);
      playerVsPlatforms(game.players[1]);
      ballVsPlayer(game.players[0]);
      ballVsPlayer(game.players[1]);
      updatePowerups(dt);
      updateMines(dt);
      updateHelpers(dt);
      updateBullets(dt);

      /*
        Confine AFTER every force is applied. Ball knockback, mine blasts and
        bullets all move players, so confining earlier let a shove push someone
        through the net.
      */
      if (cfgP.confine) { confineToHalf(game.players[0]); confineToHalf(game.players[1]); }

      // Goal-resize power-up timer (world effect, not per-player).
      if (game.goalFxT > 0) {
        game.goalFxT -= dt;
        if (game.goalFxT <= 0) { game.goalFxT = 0; game.goalFx = null; goalScale = 1; }
      }

      // Chaos: re-roll every tunable on a timer.
      if (game.chaos) {
        game.chaosT -= dt;
        if (game.chaosT <= 0) { game.chaosT = chaosInterval(); rollChaos(); }
      }

      if (game.volleyT > 0) game.volleyT -= dt;

      if (volley) {
        // A ball touching the ground concedes to the other side.
        const p = volleyGround(game.ball);
        if (p !== 0 && game.volleyT <= 0) {
          game.volleyT = VOLLEY_SETTLE;
          scoreVolleyPoint(p - 1);
          break;
        }
      } else if (tennis) {
        // One bounce per side is legal; a second on the same side concedes.
        tennisTrackCrossing(game.ball);
        const p = tennisGround(game.ball);
        if (p !== 0 && game.volleyT <= 0) {
          game.volleyT = VOLLEY_SETTLE;
          scoreVolleyPoint(p - 1);
          break;
        }
      } else if (basket) {
        const p = basketScored(game.ball, ballPrevY);
        if (p !== 0 && game.volleyT <= 0) {
          game.volleyT = VOLLEY_SETTLE;
          scoreVolleyPoint(p - 1);
          break;
        }
      } else {
        const side = goalScored(game.ball);
        if (side !== 0) { scoreGoal(side); break; }
      }

      // Match clock. Only runs during live play, so celebrations and
      // countdowns don't eat into it.
      if (game.matchSecs > 0 || game.suddenDeath) {
        game.clock -= dt;
        if (game.clock <= 0) { game.clock = 0; timeExpired(); }
      }
      break;
    }

    case SCENE.CELEBRATE:
      releaseCPUKeys();
      game.timer -= dt;
      if (game.timer <= 0) kickoff(game.lastScorer === 0 ? -1 : 1);
      break;

    case SCENE.WIN:
      if (kickHit(0) || kickHit(1) || hit("Space") || hit("Enter")) {
        if (game.mode === MODE.TOURNAMENT) {
          // Back to the bracket, which then seats the next tie or ends the round.
          game.scene = SCENE.BRACKET;
        } else {
          game.scene = SCENE.MENU;
          game.locked = [false, false];
        }
      }
      break;

    case SCENE.BRACKET:
      if (kickHit(0) || kickHit(1) || hit("Space") || hit("Enter")) {
        if (aliveEntrants().length <= 1) beginRound();   // resolves to CHAMPION
        else nextTie();
      }
      break;

    case SCENE.CHAMPION:
      if (kickHit(0) || kickHit(1) || hit("Space") || hit("Enter")) {
        game.scene = SCENE.MENU;
        game.locked = [false, false];
      }
      break;
  }

  /*
    ESC opens the pause overlay from a live match. `escUsed` guards against
    double-handling: the scene switch above runs first, so an ESC that CLOSED
    the overlay would otherwise be seen again here — with the scene already back
    in PLAY — and immediately reopen it, making ESC look dead.
  */
  if (hit("Escape") && !escUsed && PAUSABLE.has(game.scene)) openPause();
  escUsed = false;

}

let acc = 0, last = performance.now();

function frame(now) {
  const raw = (now - last) / 1000;
  last = now;
  acc += clamp(raw, 0, MAX_FRAME);

  // Edge triggers are visible only to the first substep, so one keypress is
  // one action regardless of how many substeps this frame runs.
  let guard = 0;
  edgeFrame = true;
  while (acc >= DT && guard++ < 240) {
    // Translate whatever drives each seat into intent before simulating. Only
    // the first substep sees the keypress edge, so one press is one kick.
    gatherIntent(edgeFrame);
    netPump();
    step(DT);
    acc -= DT;
    edgeFrame = false;
  }
  if (guard === 0) { gatherIntent(true); netPump(); step(0); }

  for (const k in pressed) delete pressed[k];
  edgeFrame = true;
  draw();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------ 10. RENDER */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

function fitCanvas() {
  const pad = 28;
  const s = Math.min((innerWidth - pad) / W, (innerHeight - pad - 24) / H);
  cv.style.width = Math.floor(W * s) + "px";
  cv.style.height = Math.floor(H * s) + "px";
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.floor(W * dpr);
  cv.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fitCanvas);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, align = "center", weight = 800) {
  ctx.font = `${weight} ${size}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function drawPitch() {
  // Sky.
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, "#0d1b2e");
  sky.addColorStop(1, "#173a52");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // Crowd speckle.
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 90; i++) {
    const x = (i * 137.5) % W, y = 20 + ((i * 71) % 90);
    ctx.fillStyle = i % 3 === 0 ? "#22405c" : "#1b3348";
    ctx.fillRect(x, y, 6, 5);
  }
  ctx.globalAlpha = 1;

  // Grass with mow stripes.
  ctx.fillStyle = "#1c6b2e";
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let x = 0; x < W; x += 80) ctx.fillRect(x, GROUND_Y, 40, H - GROUND_Y);

  // Halfway line + centre circle.
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, GROUND_Y);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(W / 2, GROUND_Y, 90, Math.PI, 0);
  ctx.stroke();

  // Walls — each reaches down to its own (moving) crossbar.
  if (modeCfg().goals) {
    ctx.fillStyle = "#0a1421";
    ctx.fillRect(0, 0, WALL, goalTop(0));
    ctx.fillRect(W - WALL, 0, WALL, goalTop(1));
  }

  if (!modeCfg().goals) {
    // No goals in this mode — the side walls are solid all the way down.
    ctx.fillStyle = "#0a1421";
    ctx.fillRect(0, 0, WALL, GROUND_Y);
    ctx.fillRect(W - WALL, 0, WALL, GROUND_Y);
  } else {
    drawGoal(0);
    drawGoal(1);
  }
}

function drawGoal(side) {
  const left = side === 0;
  const xOuter = left ? WALL - GOAL_D : W - WALL + GOAL_D;
  const xInner = left ? WALL : W - WALL;
  const GT = goalTop(side);          // live position — the goals slide
  const GB = goalBottom(side);       // lower edge of the frame (may be the grass)
  const GH = GB - GT;                // drawn mouth height, matching the collider

  // Net.
  ctx.save();
  ctx.beginPath();
  ctx.rect(Math.min(xOuter, xInner), GT, GOAL_D, GH);
  ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  ctx.fillRect(Math.min(xOuter, xInner), GT, GOAL_D, GH);
  ctx.strokeStyle = "rgba(255,255,255,0.30)";
  ctx.lineWidth = 1;
  for (let i = -GH; i < GOAL_D + GH; i += 11) {
    ctx.beginPath();
    ctx.moveTo(Math.min(xOuter, xInner) + i, GT);
    ctx.lineTo(Math.min(xOuter, xInner) + i + GH, GT + GH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(Math.min(xOuter, xInner) + i + GH, GT);
    ctx.lineTo(Math.min(xOuter, xInner) + i, GT + GH);
    ctx.stroke();
  }
  ctx.restore();

  // Frame + crossbar knob.
  ctx.strokeStyle = "#f2f6ff";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(xOuter, GB);
  ctx.lineTo(xOuter, GT);
  ctx.lineTo(xInner, GT);
  ctx.stroke();

  // Ground line of the mouth, so a raised goal reads as hanging in the air
  // rather than looking like it still reaches the grass.
  if (GB < GROUND_Y - 1) {
    ctx.beginPath();
    ctx.moveTo(xOuter, GB);
    ctx.lineTo(xInner, GB);
    ctx.stroke();
  }

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(left ? WALL + POST_R : W - WALL - POST_R, GT, POST_R, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer(pl) {
  const t = pl.team;
  const stunned = pl.stun > 0;

  ctx.save();
  if (stunned) {
    // Wobble while dazed so the loss of control is unmistakable.
    ctx.translate(pl.x, pl.y);
    ctx.rotate(Math.sin(performance.now() / 45) * 0.16);
    ctx.translate(-pl.x, -pl.y);
  }

  // Leg.
  const tip = pl.legTip;
  ctx.strokeStyle = t.accent;
  ctx.lineWidth = Math.max(7, pl.r * 0.3);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(pl.x, pl.y + pl.r * 0.35);
  ctx.lineTo(tip.x, tip.y);
  ctx.stroke();
  ctx.fillStyle = t.accent;
  ctx.beginPath();
  ctx.arc(tip.x, tip.y, LEG_R * 0.85, 0, Math.PI * 2);
  ctx.fill();

  // Shadow.
  const h = clamp((GROUND_Y - (pl.y + pl.r)) / 300, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.32 * (1 - h)})`;
  ctx.beginPath();
  ctx.ellipse(pl.x, GROUND_Y + 3, pl.r * (1 - h * 0.35), pl.r * 0.24, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body.
  const g = ctx.createRadialGradient(pl.x - pl.r * 0.35, pl.y - pl.r * 0.45, pl.r * 0.2, pl.x, pl.y, pl.r);
  g.addColorStop(0, t.accent);
  g.addColorStop(1, t.color);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(pl.x, pl.y, pl.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.stroke();

  // Face and hat, both reacting to what is happening to this player.
  drawFace(pl.x, pl.y, pl.r, pl.facing, lookOf(pl).face, faceMood(pl), t);
  drawHat(pl.x, pl.y, pl.r, pl.facing, lookOf(pl).hat, t);

  // Power-up aura.
  const fx = Object.keys(pl.effects);
  if (fx.length) {
    ctx.lineWidth = 3;
    ctx.strokeStyle = POWERUPS[fx[0]].color;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.arc(pl.x, pl.y, pl.r + 7 + Math.sin(performance.now() / 120) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // Dazed stars, drawn unrotated above the head.
  if (stunned) {
    const n = 3;
    for (let i = 0; i < n; i++) {
      const a = performance.now() / 260 + (i * Math.PI * 2) / n;
      const sx = pl.x + Math.cos(a) * (pl.r * 0.75);
      const sy = pl.y - pl.r - 12 + Math.sin(a) * 4;
      ctx.fillStyle = "#fde047";
      ctx.globalAlpha = 0.85;
      text("✦", sx, sy, 15, "#fde047", "center", 900);
      ctx.globalAlpha = 1;
    }
  }
}

function drawBall() {
  const b = game.ball;
  const h = clamp((GROUND_Y - (b.y + b.r)) / 300, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.3 * (1 - h)})`;
  ctx.beginPath();
  ctx.ellipse(b.x, GROUND_Y + 3, b.r * (1 - h * 0.3), b.r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  // Jetpack: glowing halo + thruster flames so the weightlessness is legible.
  if (game.jetpack > 0) {
    const jc = POWERUPS.jetpack.color;
    const fading = game.jetpack < 1.5 && Math.floor(game.jetpack * 6) % 2 === 0;
    ctx.globalAlpha = fading ? 0.45 : 1;
    ctx.shadowColor = jc;
    ctx.shadowBlur = 22;
    ctx.strokeStyle = jc;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 6 + Math.sin(performance.now() / 90) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Thruster plume beneath.
    for (let i = 0; i < 3; i++) {
      const fl = 8 + Math.random() * 10;
      ctx.fillStyle = i === 0 ? "#fff7ed" : jc;
      ctx.beginPath();
      ctx.ellipse(b.x + (i - 1) * 5, b.y + b.r + fl * 0.4, 2.6, fl * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = "#fdfdfd";
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#243244";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Rolling pentagon marks — angle derived from travelled distance.
  const rot = (b.x / b.r) * 0.9;
  ctx.fillStyle = "#243244";
  for (let i = 0; i < 5; i++) {
    const a = rot + (i * Math.PI * 2) / 5;
    ctx.beginPath();
    ctx.arc(b.x + Math.cos(a) * b.r * 0.5, b.y + Math.sin(a) * b.r * 0.5, b.r * 0.19, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMines() {
  for (const m of game.mines) {
    const arming = m.arm > 0;
    const blink = arming && Math.floor(m.arm * 10) % 2 === 0;
    const fading = !arming && m.life < 3 && Math.floor(m.life * 6) % 2 === 0;
    ctx.globalAlpha = blink ? 0.3 : fading ? 0.35 : 1;

    ctx.save();
    ctx.translate(m.x, m.y);

    // Shadow on the grass.
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(0, MINE_R * 0.85, MINE_R * 0.9, MINE_R * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Spikes.
    const pulse = 1 + Math.sin(m.pulse) * 0.08;
    ctx.strokeStyle = arming ? "#94a3b8" : "#ff6b35";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI * 2) / 8 + m.pulse * 0.15;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * MINE_R * 0.55, Math.sin(a) * MINE_R * 0.55);
      ctx.lineTo(Math.cos(a) * MINE_R * 1.25 * pulse, Math.sin(a) * MINE_R * 1.25 * pulse);
      ctx.stroke();
    }

    // Body.
    ctx.shadowColor = arming ? "transparent" : "#ff6b35";
    ctx.shadowBlur = arming ? 0 : 14;
    ctx.fillStyle = arming ? "#475569" : "#2b1a12";
    ctx.beginPath();
    ctx.arc(0, 0, MINE_R * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = arming ? "#94a3b8" : "#ff8a3d";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Core light.
    ctx.fillStyle = arming ? "#94a3b8" : `rgba(255,209,102,${0.55 + Math.sin(m.pulse * 2) * 0.35})`;
    ctx.beginPath();
    ctx.arc(0, 0, MINE_R * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawHelpers() {
  for (const h of game.helpers) {
    const team = game.players[h.owner] ? game.players[h.owner].team : TEAMS[0];
    const def = POWERUPS[h.kind];
    const expiring = h.life < 2 && Math.floor(h.life * 6) % 2 === 0;
    ctx.globalAlpha = expiring ? 0.4 : 1;

    // Shadow.
    const hh = clamp((GROUND_Y - (h.y + h.r)) / 300, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.3 * (1 - hh)})`;
    ctx.beginPath();
    ctx.ellipse(h.x, GROUND_Y + 3, h.r * 0.9, h.r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body in the owner's colours, ringed in the power-up's colour so you can
    // tell whose helper it is and which kind at a glance.
    const g = ctx.createRadialGradient(h.x - h.r * 0.3, h.y - h.r * 0.4, h.r * 0.2, h.x, h.y, h.r);
    g.addColorStop(0, team.accent);
    g.addColorStop(1, team.color);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 3;
    ctx.stroke();

    text(def.glyph, h.x, h.y + 1, 15, "#ffffff", "center", 900);

    // Duration ring: shrinking arc above the helper.
    const frac = clamp(h.life / def.dur, 0, 1);
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r + 5, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 1;
  }
}

function drawBullets() {
  for (const u of game.bullets) {
    const team = game.players[u.owner] ? game.players[u.owner].team : TEAMS[0];
    // Tracer streak behind the round.
    const dir = Math.sign(u.vx) || 1;
    const grd = ctx.createLinearGradient(u.x - dir * 26, u.y, u.x, u.y);
    grd.addColorStop(0, "rgba(255,255,255,0)");
    grd.addColorStop(1, team.accent);
    ctx.strokeStyle = grd;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(u.x - dir * 26, u.y);
    ctx.lineTo(u.x, u.y);
    ctx.stroke();

    ctx.shadowColor = "#fde68a";
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#fff7ed";
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawHoops() {
  for (const side of [0, 1]) {
    const h = hoopPos(side);
    const bx = side === 0 ? WALL + 4 : W - WALL - 4;

    // Backboard.
    ctx.fillStyle = "rgba(226,232,240,0.22)";
    ctx.fillRect(side === 0 ? bx : bx - BOARD_W, h.y - BOARD_H * 0.65, BOARD_W, BOARD_H);
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 2;
    ctx.strokeRect(side === 0 ? bx : bx - BOARD_W, h.y - BOARD_H * 0.65, BOARD_W, BOARD_H);

    // Ring, drawn as a flattened ellipse so it reads as a hoop in profile.
    ctx.strokeStyle = "#f97316";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(h.x, h.y, HOOP_R, 6, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Rims as solid nubs (these are what the ball actually collides with).
    ctx.fillStyle = "#fb923c";
    for (const dx of [-HOOP_R, HOOP_R]) {
      ctx.beginPath();
      ctx.arc(h.x + dx, h.y, RIM_R, 0, Math.PI * 2);
      ctx.fill();
    }

    // Netting.
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 6; i++) {
      const t = i / 6;
      const xTop = h.x - HOOP_R + t * HOOP_R * 2;
      ctx.beginPath();
      ctx.moveTo(xTop, h.y);
      ctx.lineTo(h.x - HOOP_R * 0.42 + t * HOOP_R * 0.84, h.y + 34);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.ellipse(h.x, h.y + 34, HOOP_R * 0.44, 4, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/** The appearance for a player's seat, falling back to the defaults. */
function lookOf(pl) {
  const l = game.looks[pl.index] || LOOK_DEFAULTS[pl.index] || LOOK_DEFAULTS[0];
  return { face: faceById(l.face).id, hat: hatById(l.hat).id };
}

/**
 * Draw a face inside a head of radius `r`. Everything is expressed as a
 * fraction of `r`, so a face survives the Bigger/Smaller power-ups and the
 * chaos size roll unchanged.
 *
 * `mood` comes from faceMood() and shapes eyes and mouth; `faceId` picks the
 * overall style.
 */
function drawFace(x, y, r, facing, faceId, mood, team) {
  drawProbe.faces++;
  const ink = "#101828";
  const eyeY = y - r * 0.16;
  const eyeDX = r * 0.30;
  const baseR = Math.max(2.6, r * 0.17);
  const look = facing * baseR * 0.34;      // pupils glance where you face
  const mouthY = y + r * 0.34;

  // --- eyes -------------------------------------------------------------
  const drawEye = (cx, open, style) => {
    if (style === "closed" || open <= 0.05) {
      // A closed eye is a stroke, which reads much better than a thin ellipse.
      ctx.strokeStyle = ink;
      ctx.lineWidth = Math.max(1.6, r * 0.06);
      ctx.beginPath();
      ctx.moveTo(cx - baseR, eyeY);
      ctx.lineTo(cx + baseR, eyeY);
      ctx.stroke();
      return;
    }
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(cx, eyeY, baseR, baseR * open, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.arc(cx + look, eyeY, baseR * 0.52 * Math.min(1, open + 0.25), 0, Math.PI * 2);
    ctx.fill();
  };

  // Mood decides how open the eyes are.
  let open = 1;
  if (mood === "stunned") open = 0.18;
  else if (mood === "kick") open = 1.25;
  else if (mood === "air") open = 1.15;
  else if (mood === "happy") open = 0.55;
  else if (mood === "sad") open = 0.7;

  const lx = x - eyeDX, rx = x + eyeDX;

  if (faceId === "cyclops") {
    // One big central eye.
    const bigR = baseR * 1.7;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(x, eyeY, bigR, bigR * open, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.arc(x + look * 1.4, eyeY, bigR * 0.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (faceId === "robot") {
    // Rectangular visor eyes.
    ctx.fillStyle = "#7dd3fc";
    const w = baseR * 1.5, h = Math.max(2, baseR * 0.95 * open);
    ctx.fillRect(lx - w / 2, eyeY - h / 2, w, h);
    ctx.fillRect(rx - w / 2, eyeY - h / 2, w, h);
    ctx.fillStyle = ink;
    ctx.fillRect(lx - w / 2 + look, eyeY - h / 2, w * 0.28, h);
    ctx.fillRect(rx - w / 2 + look, eyeY - h / 2, w * 0.28, h);
  } else if (faceId === "sleepy") {
    drawEye(lx, mood === "stunned" ? 0.18 : 0.12, "open");
    drawEye(rx, mood === "stunned" ? 0.18 : 0.12, "open");
  } else if (faceId === "cool") {
    // Sunglasses: one bar across both eyes.
    ctx.fillStyle = "#111827";
    roundRect(lx - baseR * 1.5, eyeY - baseR * 0.95, (rx - lx) + baseR * 3, baseR * 1.9, baseR * 0.5);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.fillRect(lx - baseR * 1.1, eyeY - baseR * 0.6, baseR * 0.9, baseR * 0.5);
  } else if (faceId === "goofy") {
    // Mismatched eyes.
    drawEye(lx, Math.min(1.4, open * 1.35), "open");
    drawEye(rx, Math.max(0.25, open * 0.6), "open");
  } else {
    drawEye(lx, open, "open");
    drawEye(rx, open, "open");
  }

  // --- brows ------------------------------------------------------------
  const angry = faceId === "angry" || mood === "kick";
  if (angry || mood === "sad") {
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.8, r * 0.075);
    ctx.lineCap = "round";
    const browY = eyeY - baseR * 1.7;
    const tilt = baseR * (angry ? 0.55 : -0.5);
    ctx.beginPath();
    ctx.moveTo(lx - baseR, browY - tilt);
    ctx.lineTo(lx + baseR, browY + tilt);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rx - baseR, browY + tilt);
    ctx.lineTo(rx + baseR, browY - tilt);
    ctx.stroke();
  }

  // --- mouth ------------------------------------------------------------
  ctx.strokeStyle = ink;
  ctx.lineWidth = Math.max(1.8, r * 0.08);
  ctx.lineCap = "round";
  const mw = r * 0.42;

  if (mood === "stunned") {
    // Wavy dazed mouth.
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) {
      const px = x - mw + (i / 6) * mw * 2;
      ctx.lineTo(px, mouthY + (i % 2 ? -1 : 1) * r * 0.055);
    }
    ctx.stroke();
  } else if (mood === "kick" || mood === "air") {
    // Open "oh" mouth.
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.ellipse(x, mouthY, mw * 0.5, r * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (mood === "sad") {
    ctx.beginPath();
    ctx.arc(x, mouthY + r * 0.2, mw, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  } else {
    // Smile, deeper when happy or on a grinning face.
    const deep = mood === "happy" || faceId === "grin" ? 0.62 : 0.3;
    if (faceId === "angry" && mood === "idle") {
      ctx.beginPath();
      ctx.moveTo(x - mw, mouthY);
      ctx.lineTo(x + mw, mouthY);
      ctx.stroke();
    } else if (faceId === "robot") {
      ctx.beginPath();
      ctx.moveTo(x - mw, mouthY);
      ctx.lineTo(x + mw, mouthY);
      ctx.stroke();
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * mw * 0.5, mouthY - r * 0.06);
        ctx.lineTo(x + i * mw * 0.5, mouthY + r * 0.06);
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.arc(x, mouthY - r * deep * 0.5, mw,
              Math.PI * (0.5 - deep * 0.42), Math.PI * (0.5 + deep * 0.42));
      ctx.stroke();
      // Teeth on a big grin.
      if (deep > 0.5) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, mouthY - r * deep * 0.5, mw * 0.92,
                Math.PI * (0.5 - deep * 0.3), Math.PI * (0.5 + deep * 0.3));
        ctx.fill();
      }
    }
  }
  ctx.lineCap = "butt";
}

/** Draw a hat sitting on a head of radius `r`. */
function drawHat(x, y, r, facing, hatId, team) {
  if (hatId === "none") return;
  const topY = y - r;
  const accent = team ? team.accent : "#ffffff";
  const colour = team ? team.color : "#e2413c";

  if (hatId === "cap") {
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.arc(x, topY + r * 0.12, r * 0.82, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fill();
    // Peak, pointing the way the player faces.
    ctx.fillStyle = accent;
    roundRect(facing > 0 ? x + r * 0.3 : x - r * 1.15, topY + r * 0.02, r * 0.85, r * 0.16, r * 0.06);
    ctx.fill();
  } else if (hatId === "band") {
    ctx.fillStyle = accent;
    roundRect(x - r * 0.86, topY + r * 0.18, r * 1.72, r * 0.2, r * 0.08);
    ctx.fill();
  } else if (hatId === "crown") {
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    const bw = r * 1.1, by = topY + r * 0.16;
    ctx.moveTo(x - bw / 2, by);
    for (let i = 0; i < 3; i++) {
      const sx = x - bw / 2 + (i * bw) / 3;
      ctx.lineTo(sx + bw / 6, by - r * 0.34);
      ctx.lineTo(sx + bw / 3, by);
    }
    ctx.closePath();
    ctx.fill();
  } else if (hatId === "horns") {
    ctx.fillStyle = "#f8fafc";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * r * 0.5, topY + r * 0.28);
      ctx.quadraticCurveTo(x + s * r * 0.95, topY - r * 0.1, x + s * r * 0.62, topY - r * 0.3);
      ctx.quadraticCurveTo(x + s * r * 0.6, topY + r * 0.02, x + s * r * 0.34, topY + r * 0.3);
      ctx.closePath();
      ctx.fill();
    }
  } else if (hatId === "tophat") {
    ctx.fillStyle = "#111827";
    roundRect(x - r * 0.9, topY + r * 0.05, r * 1.8, r * 0.14, r * 0.05);
    ctx.fill();
    ctx.fillRect(x - r * 0.45, topY - r * 0.55, r * 0.9, r * 0.62);
    ctx.fillStyle = colour;
    ctx.fillRect(x - r * 0.45, topY - r * 0.1, r * 0.9, r * 0.12);
  } else if (hatId === "mohawk") {
    ctx.fillStyle = accent;
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const t2 = i / 8;
      const px = x - r * 0.5 + t2 * r;
      const spike = Math.sin(t2 * Math.PI) * r * 0.55;
      ctx.lineTo(px, topY + r * 0.2 - spike);
    }
    ctx.lineTo(x + r * 0.5, topY + r * 0.28);
    ctx.lineTo(x - r * 0.5, topY + r * 0.28);
    ctx.closePath();
    ctx.fill();
  } else if (hatId === "halo") {
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = Math.max(2, r * 0.1);
    ctx.beginPath();
    ctx.ellipse(x, topY - r * 0.34, r * 0.62, r * 0.2, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawPlatforms() {
  // Tally for the test suite: proves platforms reached the canvas on this
  // frame. A previous bug had this called only from the pause backdrop, so the
  // arena was invisible in play while every "does it throw" test passed.
  drawProbe.platforms = 0;
  for (const pl of activePlatforms()) {
    drawProbe.platforms++;
    const ghost = pl.kind === "ghost";
    const bounce = pl.kind === "bounce";
    const base = bounce ? "#0ea5e9" : ghost ? "rgba(148,163,184,0.35)" : "#334155";
    const edge = bounce ? "#7dd3fc" : ghost ? "rgba(203,213,225,0.5)" : "#64748b";

    // Slab.
    ctx.fillStyle = base;
    roundRect(pl.x, pl.y, pl.w, pl.h, Math.min(6, pl.h / 2));
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Top highlight so the standable surface reads clearly.
    ctx.fillStyle = bounce ? "rgba(186,230,253,0.9)" : "rgba(255,255,255,0.22)";
    ctx.fillRect(pl.x + 3, pl.y + 1.5, pl.w - 6, 2.5);

    if (bounce) {
      // Springs, so a pad is obviously bouncy before you touch it.
      ctx.strokeStyle = "rgba(186,230,253,0.75)";
      ctx.lineWidth = 1.5;
      const n = Math.max(2, Math.floor(pl.w / 34));
      for (let i = 0; i < n; i++) {
        const sx = pl.x + 12 + i * ((pl.w - 24) / Math.max(1, n - 1));
        ctx.beginPath();
        for (let k = 0; k <= 3; k++) {
          const yy = pl.y + pl.h + 2 + k * 3;
          ctx.lineTo(sx + (k % 2 ? 4 : -4), yy);
        }
        ctx.stroke();
      }
    }
    if (ghost) {
      // Dashes signal "the ball goes through this".
      ctx.strokeStyle = "rgba(203,213,225,0.55)";
      ctx.setLineDash([7, 6]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(pl.x + 4, pl.y + pl.h / 2);
      ctx.lineTo(pl.x + pl.w - 4, pl.y + pl.h / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Shadow on the grass beneath.
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(pl.x + pl.w / 2, GROUND_Y + 3, pl.w * 0.42, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawNet() {
  const half = W / 2, top = netTop();
  // Post.
  ctx.fillStyle = "#e8eef9";
  ctx.fillRect(half - NET_W / 2, top, NET_W, GROUND_Y - top);
  // Netting.
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 1;
  for (let y = top; y < GROUND_Y; y += 12) {
    ctx.beginPath();
    ctx.moveTo(half - NET_W / 2, y);
    ctx.lineTo(half + NET_W / 2, y);
    ctx.stroke();
  }
  // Cap.
  ctx.fillStyle = "#fbbf24";
  ctx.beginPath();
  ctx.arc(half, top, NET_W / 2 + 1.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawPowerups() {
  for (const p of game.powerups) {
    const def = POWERUPS[p.type];
    const y = p.y + Math.sin(p.bob) * 6;
    const fading = p.life < 3 && Math.floor(p.life * 6) % 2 === 0;

    ctx.globalAlpha = fading ? 0.35 : 1;
    ctx.save();
    ctx.translate(p.x, y);
    ctx.rotate(Math.sin(p.bob * 0.5) * 0.12);

    ctx.shadowColor = def.color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = def.color;
    roundRect(-PU_R, -PU_R, PU_R * 2, PU_R * 2, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 2;
    roundRect(-PU_R, -PU_R, PU_R * 2, PU_R * 2, 6);
    ctx.stroke();

    text(def.glyph, 0, 1, 20, "#10141c", "center", 900);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const fmtClock = (s) => {
  const t = Math.max(0, Math.ceil(s));
  return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
};

/** Label for a controller seat: entrant name in a tournament, else P1/P2. */
function seatLabel(i) {
  // Tournament entrants carry their own names; otherwise a seat is a local
  // player, the CPU, or the remote peer.
  const e = game.seats[i] !== null ? entrantById(game.seats[i]) : null;
  if (e) return e.name;
  if (game.cpu[i]) return `CPU ${cpuCfg().name}`;
  if (net.active && net.remoteSeat === i) return game.remoteName || "OPPONENT";
  return cleanName(game.names[i], DEFAULT_NAMES[i]);
}

/*
  MAIN MENU

  Structured rather than a flat list. Three visual tiers:

    1. The wordmark and a live attract scene behind everything.
    2. A left column of MATCH SETUP (what you are about to play) and a right
       column of PLAYERS (who is playing), so related rows sit together.
    3. A row of destination buttons, then one large primary START button.

  The previous version gave "PLAYER 1 NAME" exactly the same weight as "START",
  which is what made it read as a settings dialog instead of a game front-end.
  Row geometry is still published to layoutProbe so the fits-on-screen tests
  keep working.
*/

/** Which column a menu row belongs to. */
const MENU_GROUP = {
  name1: "players", name2: "players", opponent: "players", cpulevel: "players",
  mode: "setup", map: "setup", goals: "setup", time: "setup",
  chaos: "setup", players: "setup",
  rules: "nav", online: "nav", board: "nav", settings: "nav",
  start: "action",
};

function drawMenu() {
  drawMenuBackdrop();

  const rows = menuRows();
  const cur = rows[game.menuRow];

  drawLogo(W / 2, 52);
  text("LOCAL & ONLINE MULTIPLAYER SOCCER", W / 2, 88, 10, "#7dd3fc", "center", 800);

  // ---- panel geometry --------------------------------------------------
  const colW = 400, gapX = 24;
  const leftX = (W - (colW * 2 + gapX)) / 2;
  const rightX = leftX + colW + gapX;
  const panelTop = 108;
  const panelH = 300;

  const panel = (x, title, accent) => {
    ctx.fillStyle = "rgba(8,15,28,0.78)";
    roundRect(x, panelTop, colW, panelH, 14);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Accent bar along the top edge.
    ctx.fillStyle = accent;
    roundRect(x + 14, panelTop + 12, 44, 4, 2);
    ctx.fill();
    text(title, x + 68, panelTop + 15, 10, accent, "left", 900);
  };

  panel(leftX, "MATCH SETUP", "#38bdf8");
  panel(rightX, "PLAYERS", "#a78bfa");

  layoutProbe.menu = { rows: rows.length, top: panelTop, rowH: 34, rowGap: 38,
                       bottom: H - 20, labels: [] };

  // ---- a value row inside a panel --------------------------------------
  const rowsIn = { setup: [], players: [], nav: [] };
  const push = (group, fn, key) => rowsIn[group].push({ fn, key });

  const valueRow = (x, y, w, label, value, hint, key) => {
    const on = cur === key;
    layoutProbe.menu.labels.push({ key, y, bottom: y + 34 });

    if (on) {
      ctx.fillStyle = "rgba(125,211,252,0.14)";
      roundRect(x, y, w, 34, 8);
      ctx.fill();
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    text(label, x + 14, y + 17, 11, on ? "#e8f1ff" : "#8fa3c0", "left", 800);
    text(String(value), x + w - 32, y + 17, 14, on ? "#ffffff" : "#cddcf2", "right", 900);
    if (on) {
      text("‹", x + w - 132, y + 17, 15, "#7dd3fc", "center", 900);
      text("›", x + w - 14, y + 17, 15, "#7dd3fc", "center", 900);
    }
    return hint;
  };

  const nameRow = (x, y, w, label, seat, key) => {
    const on = cur === key;
    const editing = game.editing === seat;
    layoutProbe.menu.labels.push({ key, y, bottom: y + 34 });
    if (on) {
      ctx.fillStyle = editing ? "rgba(74,222,128,0.16)" : "rgba(125,211,252,0.14)";
      roundRect(x, y, w, 34, 8);
      ctx.fill();
      ctx.strokeStyle = editing ? "#4ade80" : "#7dd3fc";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    text(label, x + 14, y + 17, 11, on ? "#e8f1ff" : "#8fa3c0", "left", 800);
    nameField(x + w - 210, y + 4, 196, 26, game.names[seat], editing, "kick to type");
    return editing ? "typing — ENTER when done" : "";
  };

  // ---- LEFT: match setup ----------------------------------------------
  let ly = panelTop + 36;
  let hintText = "";
  const take = (h) => { if (h) hintText = h; };

  take(valueRow(leftX + 14, ly, colW - 28, "GAME MODE", MODE_LABEL[game.mode],
                MODE_HINT[game.mode], "mode"));
  ly += 38;
  if (rows.includes("map")) {
    const mp = mapById(game.mapId);
    take(valueRow(leftX + 14, ly, colW - 28, "ARENA", mp.name, mp.hint, "map"));
    ly += 38;
  }
  if (rows.includes("players")) {
    take(valueRow(leftX + 14, ly, colW - 28, "BRACKET SIZE", `${game.entrantCount} PLAYERS`,
                  `${tiesRemaining(game.entrantCount)} ties to win it`, "players"));
    ly += 38;
  }
  take(valueRow(leftX + 14, ly, colW - 28,
                game.mode === MODE.VOLLEY ? "POINTS TO WIN" : "GOALS TO WIN",
                game.goalsToWin, `first to ${game.goalsToWin} takes the match`, "goals"));
  ly += 38;
  take(valueRow(leftX + 14, ly, colW - 28, "MATCH CLOCK",
                game.matchSecs === 0 ? "UNLIMITED" : fmtClock(game.matchSecs),
                game.matchSecs === 0 ? "play until the target is reached"
                                     : "whoever leads at 0:00 wins", "time"));
  ly += 38;
  take(valueRow(leftX + 14, ly, colW - 28, "CHAOS MODE", game.chaos ? "ON" : "OFF",
                game.chaos ? `every stat re-rolls every ${chaosInterval().toFixed(0)}s`
                           : "stats stay as authored", "chaos"));

  // ---- RIGHT: players --------------------------------------------------
  let ry = panelTop + 36;
  take(nameRow(rightX + 14, ry, colW - 28,
               net.active ? "YOUR NAME" : "PLAYER 1", 0, "name1"));
  ry += 38;
  if (rows.includes("name2")) {
    take(nameRow(rightX + 14, ry, colW - 28, "PLAYER 2", 1, "name2"));
    ry += 38;
  }
  if (rows.includes("opponent")) {
    take(valueRow(rightX + 14, ry, colW - 28, "OPPONENT",
                  game.cpu[1] ? "COMPUTER" : "2 PLAYERS",
                  game.cpu[1] ? "you versus the CPU" : "share one keyboard", "opponent"));
    ry += 38;
  }
  if (rows.includes("cpulevel")) {
    take(valueRow(rightX + 14, ry, colW - 28, "CPU SKILL", cpuCfg().name,
                  ["forgiving and slow", "a fair match", "fast and ruthless"][game.cpuLevel],
                  "cpulevel"));
    ry += 38;
  }

  // Character previews, so the right panel is not just text.
  {
    const py = panelTop + panelH - 74;
    for (let i = 0; i < 2; i++) {
      const team = TEAMS[game.sel[i]] || TEAMS[0];
      const look = game.looks[i] || LOOK_DEFAULTS[i];
      const hx = rightX + colW * (i === 0 ? 0.3 : 0.7);
      const hr = 26;
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(hx, py + hr + 6, hr * 0.85, hr * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      const g = ctx.createRadialGradient(hx - 8, py - 10, 6, hx, py, hr);
      g.addColorStop(0, team.accent);
      g.addColorStop(1, team.color);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(hx, py, hr, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
      drawFace(hx, py, hr, i === 0 ? 1 : -1, look.face, "idle", team);
      drawHat(hx, py, hr, i === 0 ? 1 : -1, look.hat, team);
      const who = game.cpu[i] ? `CPU ${cpuCfg().name}`
                 : (net.active && net.remoteSeat === i) ? (game.remoteName || "OPPONENT")
                 : cleanName(game.names[i], DEFAULT_NAMES[i]);
      text(who, hx, py + hr + 20, 9, "#8fa3c0", "center", 800);
    }
    text("faces & hats are chosen on the team screen",
         rightX + colW / 2, panelTop + panelH - 12, 8, "#5f7391", "center", 600);
  }

  // ---- destination buttons --------------------------------------------
  const navKeys = ["rules", "online", "board", "settings"];
  const navLabels = {
    rules: ["SPAWN RATES", "#fbbf24"],
    online: ["PLAY ONLINE", "#38bdf8"],
    board: ["LEADERBOARD", "#a78bfa"],
    settings: ["SETTINGS", "#94a3b8"],
  };
  const visibleNav = navKeys.filter((k) => rows.includes(k));
  const navW = 190, navGap = 12;
  const navTotal = visibleNav.length * navW + (visibleNav.length - 1) * navGap;
  let nx = (W - navTotal) / 2;
  const navY = panelTop + panelH + 16;

  for (const k of visibleNav) {
    const [label, accent] = navLabels[k];
    const on = cur === k;
    layoutProbe.menu.labels.push({ key: k, y: navY, bottom: navY + 38 });
    ctx.fillStyle = on ? "rgba(255,255,255,0.14)" : "rgba(8,15,28,0.78)";
    roundRect(nx, navY, navW, 38, 9);
    ctx.fill();
    ctx.strokeStyle = on ? accent : "rgba(255,255,255,0.12)";
    ctx.lineWidth = on ? 2.5 : 1.5;
    ctx.stroke();
    text(label, nx + navW / 2, navY + 20, 12, on ? accent : "#cddcf2", "center", 900);
    nx += navW + navGap;
  }

  // ---- the primary action ---------------------------------------------
  {
    const on = cur === "start";
    const bw2 = 320, bh2 = 54;
    const bx2 = (W - bw2) / 2, by2 = navY + 50;
    layoutProbe.menu.labels.push({ key: "start", y: by2, bottom: by2 + bh2 });

    if (on) {
      // Breathing halo, so the primary action is unmistakable.
      const pulse = 0.5 + Math.sin(menuFx.t * 4) * 0.5;
      ctx.fillStyle = `rgba(74,222,128,${0.16 + pulse * 0.16})`;
      roundRect(bx2 - 8, by2 - 8, bw2 + 16, bh2 + 16, 16);
      ctx.fill();
    }
    const g = ctx.createLinearGradient(0, by2, 0, by2 + bh2);
    g.addColorStop(0, on ? "#5eead4" : "#1f2b3d");
    g.addColorStop(1, on ? "#22c55e" : "#16202f");
    ctx.fillStyle = g;
    roundRect(bx2, by2, bw2, bh2, 12);
    ctx.fill();
    ctx.strokeStyle = on ? "#a7f3d0" : "rgba(255,255,255,0.14)";
    ctx.lineWidth = on ? 3 : 1.5;
    ctx.stroke();
    text(game.mode === MODE.TOURNAMENT ? "START TOURNAMENT" : "START MATCH",
         W / 2, by2 + bh2 / 2 - 2, 21, on ? "#04240f" : "#8fa3c0", "center", 900);
    if (on) {
      text("press F or ENTER", W / 2, by2 + bh2 - 11, 8, "rgba(4,36,15,0.75)", "center", 800);
    }
  }

  // ---- contextual hint + controls --------------------------------------
  if (hintText) {
    text(hintText, W / 2, H - 34, 11, "#7dd3fc", "center", 700);
  }
  text("up/down — move   ·   left/right — change   ·   F or ENTER — select",
       W / 2, H - 15, 10, "#5f7391", "center", 600);
}
