function drawOnline() {
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, W, H);

  // Header.
  text("PLAY ONLINE", W / 2, 42, 28, "#ffffff", "center", 900);
  text("connects the two browsers directly — no server, no accounts",
       W / 2, 66, 11, "#8fa3c0", "center", 600);

  // ---- step rail: shows exactly where you are in the handshake ----------
  const steps = net.role === "guest"
    ? ["GET CODE", "SEND REPLY", "PLAY"]
    : ["SHARE CODE", "PASTE REPLY", "PLAY"];
  let stage = 0;
  if (net.role === "host") {
    stage = net.state === "offer" ? 0 : net.state === "connecting" ? 1 : net.state === "live" ? 2 : 0;
  } else if (net.role === "guest") {
    stage = net.state === "await-offer" ? 0 : net.state === "answer" ? 1 : net.state === "live" ? 2 : 0;
  }
  if (net.role) {
    const rw = 150, gap = 16, totalW = steps.length * rw + (steps.length - 1) * gap;
    let rx = (W - totalW) / 2;
    for (let i = 0; i < steps.length; i++) {
      const done = i < stage, now = i === stage;
      ctx.fillStyle = done ? "rgba(74,222,128,0.22)"
                    : now ? "rgba(125,211,252,0.22)" : "rgba(255,255,255,0.05)";
      roundRect(rx, 86, rw, 30, 15);
      ctx.fill();
      ctx.strokeStyle = done ? "#4ade80" : now ? "#7dd3fc" : "rgba(255,255,255,0.12)";
      ctx.lineWidth = now ? 2.5 : 1.5;
      ctx.stroke();
      text((done ? "✓ " : `${i + 1} · `) + steps[i], rx + rw / 2, 101, 11,
           done ? "#4ade80" : now ? "#e8f1ff" : "#5f7391", "center", 800);
      rx += rw + gap;
    }
  }

  const bx = 130, bw = W - 260;
  const card = (y, h, accent) => {
    ctx.fillStyle = "rgba(255,255,255,0.045)";
    roundRect(bx, y, bw, h, 12);
    ctx.fill();
    ctx.strokeStyle = accent || "rgba(255,255,255,0.12)";
    ctx.lineWidth = 2;
    ctx.stroke();
  };

  /** Code panel with a copy prompt and a visible character count. */
  const codePanel = (y, code, label, action) => {
    const lines = wrapCode(code, 84);
    const shown = lines.slice(0, 6);
    const h = 30 + shown.length * 12;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    roundRect(bx + 18, y, bw - 36, h, 8);
    ctx.fill();
    ctx.strokeStyle = "rgba(125,211,252,0.35)";
    ctx.lineWidth = 1;
    ctx.stroke();
    text(label, bx + 30, y + 13, 9, "#7dd3fc", "left", 900);
    text(`${code.length} chars`, bx + bw - 30, y + 13, 9, "#5f7391", "right", 700);
    ctx.font = "9px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.textAlign = "left";
    ctx.fillStyle = "#86efac";
    shown.forEach((ln, i) => ctx.fillText(ln, bx + 30, y + 28 + i * 12));
    if (lines.length > shown.length) {
      text(`…+${lines.length - shown.length} more lines (copy gets all of it)`,
           bx + 30, y + h - 4, 9, "#5f7391", "left", 600);
    }
    // Big call to action.
    const cy = y + h + 14;
    ctx.fillStyle = net.copied ? "rgba(74,222,128,0.2)" : "#7dd3fc";
    roundRect(W / 2 - 150, cy, 300, 36, 8);
    ctx.fill();
    text(net.copied ? "✓ COPIED — now send it" : action,
         W / 2, cy + 18, 13, net.copied ? "#4ade80" : "#0b1220", "center", 900);
    return h + 50;
  };

  /** Paste target with a live indication of what is in the buffer. */
  const pastePanel = (y, prompt) => {
    const has = !!net.paste;
    ctx.fillStyle = has ? "rgba(74,222,128,0.12)" : "rgba(0,0,0,0.35)";
    roundRect(bx + 18, y, bw - 36, 56, 8);
    ctx.fill();
    ctx.strokeStyle = has ? "#4ade80" : "rgba(255,255,255,0.16)";
    ctx.lineWidth = has ? 2 : 1.5;
    ctx.setLineDash(has ? [] : [5, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    if (has) {
      text(`✓ ${net.paste.length} characters ready`, W / 2, y + 22, 13, "#a7f3d0", "center", 800);
      text("press ENTER to connect", W / 2, y + 40, 12, "#4ade80", "center", 900);
    } else {
      text(prompt, W / 2, y + 22, 13, "#cddcf2", "center", 700);
      text("⌘V on Mac  ·  Ctrl-V on Windows", W / 2, y + 40, 11, "#6b819e", "center", 600);
    }
    return 66;
  };

  // ---- role picker ------------------------------------------------------
  if (net.state === "idle" || net.state === "failed") {
    card(104, 240, "#7dd3fc");
    text("Who are you?", W / 2, 134, 18, "#e8f1ff", "center", 800);

    const opt = (y, key, title, blurb, colour) => {
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      roundRect(bx + 24, y, bw - 48, 62, 9);
      ctx.fill();
      ctx.strokeStyle = colour;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = colour;
      roundRect(bx + 38, y + 15, 32, 32, 7);
      ctx.fill();
      text(key, bx + 54, y + 31, 18, "#0b1220", "center", 900);
      text(title, bx + 84, y + 24, 15, "#e8f1ff", "left", 800);
      text(blurb, bx + 84, y + 44, 11, "#8fa3c0", "left", 600);
    };
    opt(154, "H", "HOST the match", "you run the game — best on the faster connection", "#4ade80");
    opt(226, "J", "JOIN a match", "paste the code your friend sends you", "#fbbf24");

    text(`playing as ${cleanName(game.names[0], DEFAULT_NAMES[0])}`,
         W / 2, 372, 12, "#7dd3fc", "center", 700);
    text("change it on the setup screen · both players need this file open",
         W / 2, 392, 11, "#6b819e", "center", 600);
  }

  if (net.state === "creating") {
    card(150, 110, "#7dd3fc");
    text("preparing connection…", W / 2, 196, 17, "#7dd3fc", "center", 800);
    text("gathering network candidates", W / 2, 220, 11, "#6b819e", "center", 600);
  }

  // ---- host flow --------------------------------------------------------
  if (net.role === "host" && (net.state === "offer" || net.state === "connecting")) {
    card(128, 330, "#4ade80");
    text("YOU ARE HOSTING", W / 2, 152, 14, "#4ade80", "center", 900);
    const used = codePanel(168, net.offerText, "YOUR INVITE CODE", "PRESS  C  TO COPY");
    pastePanel(168 + used, "waiting for your friend's reply code");
    if (net.state === "connecting") {
      text("connecting…", W / 2, 168 + used + 80, 13, "#7dd3fc", "center", 800);
    }
  }

  // ---- guest flow -------------------------------------------------------
  if (net.state === "await-offer") {
    card(140, 200, "#fbbf24");
    text("JOINING A MATCH", W / 2, 166, 14, "#fbbf24", "center", 900);
    pastePanel(184, "paste the host's invite code");
    text("ask the host to press C and send you their code",
         W / 2, 292, 11, "#6b819e", "center", 600);
  }

  if (net.role === "guest" && net.state === "answer") {
    card(128, 280, "#fbbf24");
    text("ONE MORE STEP", W / 2, 152, 14, "#fbbf24", "center", 900);
    codePanel(168, net.answerText, "YOUR REPLY CODE", "PRESS  C  TO COPY");
    text("send it back to the host, then wait here",
       W / 2, 380, 12, "#8fa3c0", "center", 600);
  }

  // ---- connected --------------------------------------------------------
  if (net.state === "live") {
    card(120, 250, "#4ade80");
    text("✓ CONNECTED", W / 2, 154, 26, "#4ade80", "center", 900);

    // Who's who.
    const me = cleanName(game.names[net.localSeat < 0 ? 0 : net.localSeat],
                         DEFAULT_NAMES[0]);
    const them = game.remoteName || "OPPONENT";
    const half = bw / 2;
    text("YOU", bx + half * 0.5, 196, 10, "#7dd3fc", "center", 800);
    text(me, bx + half * 0.5, 216, 17, "#ffffff", "center", 900);
    text(netIsHost() ? "PLAYER 1 · left" : "PLAYER 2 · right",
         bx + half * 0.5, 236, 10, "#8fa3c0", "center", 600);

    text("vs", W / 2, 216, 12, "#5f7391", "center", 700);

    text("OPPONENT", bx + half * 1.5, 196, 10, "#fbbf24", "center", 800);
    text(them, bx + half * 1.5, 216, 17, "#ffffff", "center", 900);
    text(netIsHost() ? "PLAYER 2 · right" : "PLAYER 1 · left",
         bx + half * 1.5, 236, 10, "#8fa3c0", "center", 600);

    if (netIsHost()) {
      ctx.fillStyle = "#4ade80";
      roundRect(W / 2 - 150, 286, 300, 44, 9);
      ctx.fill();
      text("PRESS  F  TO START", W / 2, 308, 15, "#0b1220", "center", 900);
      text(game.mode === MODE.TOURNAMENT
            ? "you host the bracket; your rival plays their own ties"
            : "you host the simulation — their screen follows yours",
           W / 2, 348, 11, "#8fa3c0", "center", 600);
    } else {
      text("waiting for the host to start…", W / 2, 300, 15, "#7dd3fc", "center", 800);
      text("you play with the ARROW keys and ENTER", W / 2, 324, 11, "#8fa3c0", "center", 600);
    }
  }

  if (net.state === "closed") {
    card(150, 120, "#f87171");
    text("connection closed", W / 2, 196, 18, "#f87171", "center", 800);
    text("press ESC to go back and try again", W / 2, 222, 12, "#8fa3c0", "center", 600);
  }

  if (net.error) text(net.error, W / 2, H - 62, 12, "#f87171", "center", 700);
  text("ESC — back to setup", W / 2, H - 28, 11, "#6b819e", "center", 600);
}

/** A text field with a blinking caret while it is being edited. */
function nameField(x, y, w, h, value, active, placeholder) {
  ctx.fillStyle = active ? "rgba(125,211,252,0.16)" : "rgba(0,0,0,0.35)";
  roundRect(x, y, w, h, 6);
  ctx.fill();
  ctx.strokeStyle = active ? "#7dd3fc" : "rgba(255,255,255,0.14)";
  ctx.lineWidth = active ? 2.5 : 1.5;
  ctx.stroke();

  const shown = value || "";
  const caret = active && Math.floor(performance.now() / 380) % 2 === 0 ? "▌" : "";
  if (shown) {
    text(shown + caret, x + 12, y + h / 2, 15, "#ffffff", "left", 800);
  } else {
    text(caret || placeholder, x + 12, y + h / 2, 14,
         caret ? "#ffffff" : "#5f7391", "left", active ? 800 : 600);
  }
}

function drawRoster() {
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, W, H);

  text("TOURNAMENT ROSTER", W / 2, 48, 28, "#ffffff", "center", 900);
  text(`${game.entrantCount} players  ·  ${tiesRemaining(game.entrantCount)} ties to a champion`,
       W / 2, 74, 12, "#8fa3c0", "center", 600);

  const n = game.entrantCount;
  const cols = n > 4 ? 2 : 1;
  const fw = cols === 2 ? 380 : 460;
  const startX = cols === 2 ? (W - (fw * 2 + 24)) / 2 : (W - fw) / 2;
  const rows = Math.ceil(n / cols);
  const top = 112;
  const fh = 44, gap = 10;

  for (let i = 0; i < n; i++) {
    const col = cols === 2 ? Math.floor(i / rows) : 0;
    const row = cols === 2 ? i % rows : i;
    const x = startX + col * (fw + 24);
    const y = top + row * (fh + gap);
    const active = game.rosterEdit === i;
    const sel = game.rosterCursor === i;

    // Seed marker.
    ctx.fillStyle = sel ? "#7dd3fc" : "rgba(255,255,255,0.10)";
    roundRect(x, y, 34, fh, 6);
    ctx.fill();
    text(String(i + 1), x + 17, y + fh / 2, 15, sel ? "#0b1220" : "#8fa3c0", "center", 900);

    nameField(x + 42, y, fw - 42, fh, game.rosterNames[i], active,
              `player ${i + 1} name`);

    if (sel && !active) {
      text("press kick to rename", x + fw + 10, y + fh / 2, 9, "#6b819e", "left", 600);
    }
  }

  // START row.
  const sy = top + rows * (fh + gap) + 12;
  const onStart = game.rosterCursor === n;
  ctx.fillStyle = onStart ? "#4ade80" : "rgba(255,255,255,0.08)";
  roundRect(W / 2 - 150, sy, 300, 48, 10);
  ctx.fill();
  text("BEGIN TOURNAMENT", W / 2, sy + 24, 17, onStart ? "#0b1220" : "#cddcf2", "center", 900);

  text(game.rosterEdit >= 0
        ? "type a name  ·  ENTER to confirm"
        : "up/down to choose  ·  kick to rename or begin  ·  ESC to go back",
       W / 2, H - 30, 12, "#6b819e", "center", 600);
}

/** A vertical list of choices, used by the pause and settings screens. */
function drawMenuList(items, cursor, x, y, w, rowH, gap) {
  items.forEach((it, i) => {
    const on = i === cursor;
    const ry = y + i * (rowH + gap);
    ctx.fillStyle = on ? "rgba(255,255,255,0.13)" : "rgba(255,255,255,0.05)";
    roundRect(x, ry, w, rowH, 9);
    ctx.fill();
    if (on) {
      ctx.strokeStyle = it.accent || "#7dd3fc";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    const mid = ry + rowH / 2;
    if (it.value === undefined) {
      text(it.label, x + w / 2, mid, 17, on ? (it.accent || "#ffffff") : "#cddcf2",
           "center", 900);
    } else {
      text(it.label, x + 24, mid - (it.hint ? 6 : 0), 14, "#cddcf2", "left", 800);
      if (it.hint) text(it.hint, x + 24, mid + 12, 9, "#6b819e", "left", 600);
      // ON/OFF pill.
      const pw = 62, px = x + w - pw - 24;
      ctx.fillStyle = it.value ? "#4ade80" : "rgba(255,255,255,0.12)";
      roundRect(px, mid - 11, pw, 22, 11);
      ctx.fill();
      text(it.value ? "ON" : "OFF", px + pw / 2, mid + 1, 11,
           it.value ? "#0b1220" : "#8fa3c0", "center", 900);
      if (on) {
        text("◄", px - 16, mid, 12, "#7dd3fc", "center", 900);
        text("►", px + pw + 16, mid, 12, "#7dd3fc", "center", 900);
      }
    }
  });
}

/** Freeze-frame of the match, dimmed, behind an overlay. */
function drawFrozenPitch() {
  const keep = game.scene;
  game.scene = game.pauseFrom || SCENE.PLAY;
  try {
    drawPitch();
    drawPlatforms();
    if (hasNet()) drawNet();
    if (game.mode === MODE.BASKET) drawHoops();
    drawMines();
    drawHelpers();
    drawPowerups();
    if (game.players[0]) drawPlayer(game.players[0]);
    if (game.players[1]) drawPlayer(game.players[1]);
    drawBall();
    drawBullets();
    drawScoreboard();
  } catch (e) {
    // A half-built match shouldn't stop the overlay from appearing.
  }
  game.scene = keep;
}

function drawPause() {
  drawFrozenPitch();

  ctx.fillStyle = "rgba(5,10,18,0.82)";
  ctx.fillRect(0, 0, W, H);

  text("PAUSED", W / 2, 116, 40, "#ffffff", "center", 900);

  // Context line: what you are paused inside.
  const modeName = MODE_LABEL[game.mode] || "MATCH";
  const ctxLine = game.mode === MODE.TOURNAMENT
    ? `${modeName} · round ${game.round} · ${seatLabel(0)} vs ${seatLabel(1)}`
    : `${modeName} · ${seatLabel(0)} ${game.score[0]} – ${game.score[1]} ${seatLabel(1)}`;
  text(ctxLine, W / 2, 146, 13, "#8fa3c0", "center", 600);

  const items = [
    { label: "RESUME", accent: "#4ade80" },
    { label: "SETTINGS", accent: "#7dd3fc" },
    { label: "LEADERBOARD", accent: "#a78bfa" },
    { label: "RESTART MATCH", accent: "#fbbf24" },
    { label: net.active ? "QUIT (disconnects)" : "QUIT TO MENU", accent: "#f87171" },
  ];
  drawMenuList(items, game.pauseRow, W / 2 - 170, 182, 340, 46, 10);

  if (net.active) {
    // Be honest: the other machine is still running.
    text("⚠ online — your opponent's game keeps running",
         W / 2, 452, 12, "#fbbf24", "center", 700);
  }

  text("up/down to choose  ·  kick or ENTER to pick  ·  ESC to resume",
       W / 2, H - 30, 12, "#6b819e", "center", 600);
}

function drawSettings() {
  if (game.settingsFrom === SCENE.PAUSE) {
    drawFrozenPitch();
    ctx.fillStyle = "rgba(5,10,18,0.86)";
    ctx.fillRect(0, 0, W, H);
  } else {
    // Same attract scene as the menu, so moving between them feels continuous.
    drawMenuBackdrop();
  }

  text("SETTINGS", W / 2, 88, 32, "#ffffff", "center", 900);
  text("saved on this computer", W / 2, 114, 12, "#8fa3c0", "center", 600);

  const items = [
    { label: "SCREEN SHAKE", value: game.opt.shake,
      hint: "camera kick on goals, mines and hard hits" },
    { label: "PARTICLES", value: game.opt.particles,
      hint: "burst effects for goals, blasts and pickups" },
    { label: "GOAL FLASH", value: game.opt.flash,
      hint: "white flash the moment someone scores" },
    { label: "CONTROL HINTS", value: game.opt.hints,
      hint: "show the key reminder during play" },
    { label: "BACK", accent: "#4ade80" },
  ];
  drawMenuList(items, game.settingsRow, W / 2 - 260, 154, 520, 54, 10);

  text("left/right or kick to toggle  ·  ESC to go back",
       W / 2, H - 30, 12, "#6b819e", "center", 600);
}

function drawRules() {
  if (game.rulesFrom === SCENE.PAUSE) {
    drawFrozenPitch();
    ctx.fillStyle = "rgba(5,10,18,0.88)";
    ctx.fillRect(0, 0, W, H);
  } else {
    drawMenuBackdrop();
  }

  text("SPAWN RATES", W / 2, 42, 28, "#ffffff", "center", 900);
  text("tune how busy the pitch gets  ·  saved on this computer",
       W / 2, 66, 11, "#8fa3c0", "center", 600);

  const bw = 700, bx = (W - bw) / 2;
  const rowsN = RULE_DEFS.length + 2;
  const top = 92, avail = H - 60 - top;
  const gap = Math.min(46, avail / rowsN);
  const rowH = gap - 5;

  /** Human-readable value for one rule. */
  const shown = (d) => {
    const v = game.rules[d.key];
    if (d.type === "flag") return v ? "ON" : "OFF";
    if (d.type === "int") return String(v);
    if (v <= 0) return "OFF";
    if (d.key === "chaosRate") return `${(CHAOS_EVERY * v).toFixed(0)}s`;
    return `${v.toFixed(2)}×`;
  };

  RULE_DEFS.forEach((d, i) => {
    const y = top + i * gap;
    const on = game.rulesRow === i;
    const off = d.type !== "flag" && game.rules[d.key] <= 0;

    ctx.fillStyle = on ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.045)";
    roundRect(bx, y, bw, rowH, 8);
    ctx.fill();
    if (on) {
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    const mid = y + rowH / 2;
    text(d.label, bx + 22, mid - 6, 13, "#cddcf2", "left", 800);
    text(d.hint, bx + 22, mid + 9, 9, "#6b819e", "left", 600);

    // Value, with a bar for the numeric rows so the range is visible.
    const vx = bx + bw - 24;
    text(shown(d), vx, mid, 16,
         off ? "#f87171" : on ? "#ffffff" : "#a7f3d0", "right", 900);

    if (d.type !== "flag") {
      const barW = 150, barX = vx - 90 - barW;
      const frac = clamp((game.rules[d.key] - d.min) / (d.max - d.min), 0, 1);
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      roundRect(barX, mid - 4, barW, 8, 4);
      ctx.fill();
      ctx.fillStyle = off ? "#f87171" : "#38bdf8";
      roundRect(barX, mid - 4, Math.max(3, barW * frac), 8, 4);
      ctx.fill();
      // Mark the authored default so "normal" is findable again.
      const dFrac = clamp((RULE_DEFAULTS[d.key] - d.min) / (d.max - d.min), 0, 1);
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillRect(barX + barW * dFrac - 1, mid - 8, 2, 16);
    }
    if (on) {
      text("◄", bx + bw - 78, mid, 12, "#7dd3fc", "center", 900);
      text("►", bx + bw - 6, mid, 12, "#7dd3fc", "center", 900);
    }
  });

  // RESET and BACK.
  [["RESET TO DEFAULTS", "#fbbf24"], ["BACK", "#4ade80"]].forEach(([label, col], k) => {
    const i = RULE_DEFS.length + k;
    const y = top + i * gap;
    const on = game.rulesRow === i;
    ctx.fillStyle = on ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.045)";
    roundRect(bx + bw / 4, y, bw / 2, rowH, 8);
    ctx.fill();
    if (on) {
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    text(label, W / 2, y + rowH / 2, 14, on ? col : "#cddcf2", "center", 900);
  });

  text("left/right to adjust  ·  the white notch marks the default  ·  ESC to go back",
       W / 2, H - 26, 11, "#6b819e", "center", 600);
}

function drawBoard() {
  if (game.boardFrom === SCENE.PAUSE) {
    drawFrozenPitch();
    ctx.fillStyle = "rgba(5,10,18,0.9)";
    ctx.fillRect(0, 0, W, H);
  } else {
    drawMenuBackdrop();
  }

  const ranked = rankBoard(game.board);

  text("LEADERBOARD", W / 2, 44, 30, "#ffffff", "center", 900);
  // Be explicit about scope rather than implying a worldwide table.
  text("every match played on this computer  ·  CPU games excluded",
       W / 2, 68, 11, "#8fa3c0", "center", 600);

  if (!ranked.length) {
    text("no matches recorded yet", W / 2, H / 2 - 20, 20, "#5f7391", "center", 700);
    text("finish a match and the result lands here",
         W / 2, H / 2 + 8, 13, "#6b819e", "center", 600);
    text("kick or ESC to go back", W / 2, H - 30, 12, "#6b819e", "center", 600);
    return;
  }

  // Column layout.
  const bw = 860, bx = (W - bw) / 2;
  const cols = [
    { key: "#",    x: bx + 26,  align: "left"  },
    { key: "NAME", x: bx + 66,  align: "left"  },
    { key: "P",    x: bx + 372, align: "right" },
    { key: "W",    x: bx + 428, align: "right" },
    { key: "L",    x: bx + 484, align: "right" },
    { key: "D",    x: bx + 540, align: "right" },
    { key: "WIN%", x: bx + 618, align: "right" },
    { key: "GF",   x: bx + 676, align: "right" },
    { key: "GA",   x: bx + 730, align: "right" },
    { key: "DIFF", x: bx + 796, align: "right" },
    { key: "RUN",  x: bx + 848, align: "right" },
  ];

  // Header.
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  roundRect(bx, 88, bw, 26, 6);
  ctx.fill();
  for (const c of cols) text(c.key, c.x, 101, 9, "#7dd3fc", c.align, 900);

  const start = clamp(game.boardScroll, 0, Math.max(0, ranked.length - LB_ROWS_VISIBLE));
  const shown = ranked.slice(start, start + LB_ROWS_VISIBLE);
  const rowH = 38;

  shown.forEach((r, i) => {
    const rank = start + i + 1;
    const y = 122 + i * rowH;
    // Highlight whoever is sitting at the keyboard.
    const isMe = r.name === cleanName(game.names[0], DEFAULT_NAMES[0]) ||
                 r.name === cleanName(game.names[1], DEFAULT_NAMES[1]);
    ctx.fillStyle = isMe ? "rgba(125,211,252,0.13)" : "rgba(255,255,255,0.04)";
    roundRect(bx, y, bw, rowH - 5, 7);
    ctx.fill();
    if (isMe) {
      ctx.strokeStyle = "rgba(125,211,252,0.45)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    const mid = y + (rowH - 5) / 2;
    // Medal colours for the top three.
    const medal = rank === 1 ? "#fde047" : rank === 2 ? "#cbd5e1" : rank === 3 ? "#d8a05a" : null;
    text(String(rank), cols[0].x, mid, medal ? 14 : 12, medal || "#5f7391", "left", 900);
    text(r.name, cols[1].x, mid, 15, isMe ? "#ffffff" : "#e8f1ff", "left", 800);

    const played = lbPlayed(r);
    const diff = r.gf - r.ga;
    text(String(played), cols[2].x, mid, 13, "#8fa3c0", "right", 700);
    text(String(r.w), cols[3].x, mid, 14, "#4ade80", "right", 900);
    text(String(r.l), cols[4].x, mid, 14, "#f87171", "right", 900);
    text(String(r.d), cols[5].x, mid, 13, "#8fa3c0", "right", 700);
    text(lbWinPct(r).toFixed(0) + "%", cols[6].x, mid, 13, "#cddcf2", "right", 800);
    text(String(r.gf), cols[7].x, mid, 12, "#8fa3c0", "right", 700);
    text(String(r.ga), cols[8].x, mid, 12, "#8fa3c0", "right", 700);
    text((diff > 0 ? "+" : "") + diff, cols[9].x, mid, 13,
         diff > 0 ? "#86efac" : diff < 0 ? "#fca5a5" : "#8fa3c0", "right", 800);

    // Current run: W3 / L2, plus a flame for a long streak.
    const run = r.streak > 0 ? `W${r.streak}` : r.streak < 0 ? `L${-r.streak}` : "–";
    text(run, cols[10].x, mid, 12,
         r.streak >= 3 ? "#fbbf24" : r.streak > 0 ? "#4ade80"
         : r.streak < 0 ? "#f87171" : "#5f7391", "right", 900);
  });

  // Scroll affordance.
  if (ranked.length > LB_ROWS_VISIBLE) {
    text(`showing ${start + 1}–${start + shown.length} of ${ranked.length}  ·  up/down to scroll`,
         W / 2, 122 + LB_ROWS_VISIBLE * rowH + 6, 11, "#6b819e", "center", 600);
  }

  // Best streak footnote for the leader.
  const top = ranked[0];
  if (top && top.best >= 2) {
    text(`longest winning run: ${top.name} — ${top.best} straight`,
         W / 2, H - 52, 12, "#fbbf24", "center", 700);
  }

  text("kick or ESC to go back", W / 2, H - 28, 12, "#6b819e", "center", 600);
}

function drawBracket() {
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, W, H);

  const alive = aliveEntrants();
  text("TOURNAMENT", W / 2, 44, 30, "#ffffff", "center", 900);
  text(`ROUND ${game.round}  ·  ${alive.length} still standing`, W / 2, 72, 13, "#8fa3c0", "center", 600);

  // Last result, if any.
  if (game.lastResult) {
    const w = entrantById(game.lastResult.winnerId);
    const l = entrantById(game.lastResult.loserId);
    const [s0, s1] = game.lastResult.score;
    const bw = 520, bx = (W - bw) / 2;
    ctx.fillStyle = "rgba(74,222,128,0.10)";
    roundRect(bx, 92, bw, 46, 9);
    ctx.fill();
    ctx.strokeStyle = "rgba(74,222,128,0.5)";
    ctx.lineWidth = 2;
    ctx.stroke();
    const winSc = Math.max(s0, s1), loseSc = Math.min(s0, s1);
    text(`${w ? w.name : "?"} beat ${l ? l.name : "?"}  ${winSc}–${loseSc}` +
         (game.lastResult.byTime ? "  (on time)" : ""),
         W / 2, 115, 15, "#a7f3d0", "center", 800);
  }

  // Pairs for this round.
  const startY = game.lastResult ? 164 : 120;
  const pairs = game.roundPairs;
  for (let i = 0; i < pairs.length; i++) {
    const [a, b] = pairs[i];
    const ea = entrantById(a), eb = b === null ? null : entrantById(b);
    const done = i < game.tieIndex;
    const next = i === game.tieIndex;
    const rowY = startY + i * 46;
    const bw = 560, bx = (W - bw) / 2;

    ctx.fillStyle = next ? "rgba(125,211,252,0.13)" : "rgba(255,255,255,0.045)";
    roundRect(bx, rowY, bw, 38, 8);
    ctx.fill();
    if (next) {
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const dim = done ? "#5f7391" : "#e8f1ff";
    if (eb === null) {
      text(`${ea ? ea.name : "?"} — BYE`, W / 2, rowY + 19, 14,
           done ? "#5f7391" : "#fbbf24", "center", 800);
    } else {
      text(ea ? ea.name : "?", bx + 150, rowY + 19, 14,
           done && !ea.alive ? "#5f7391" : dim, "center", 800);
      text("vs", W / 2, rowY + 19, 11, "#6b819e", "center", 700);
      text(eb ? eb.name : "?", bx + bw - 150, rowY + 19, 14,
           done && !eb.alive ? "#5f7391" : dim, "center", 800);
      if (next) text("NEXT", bx + 34, rowY + 19, 9, "#7dd3fc", "center", 900);
      if (done) text("✓", bx + 34, rowY + 19, 13, "#4ade80", "center", 900);

      // Online: mark the tie the two remote rivals will play against each other.
      if (net.active && ea && eb) {
        const isOnlineTie = (ea.owner === "host" && eb.owner === "guest") ||
                            (ea.owner === "guest" && eb.owner === "host");
        if (isOnlineTie) {
          text("ONLINE", bx + bw - 34, rowY + 19, 8, "#a78bfa", "center", 900);
        } else if (!done) {
          text("LOCAL", bx + bw - 34, rowY + 19, 8, "#5f7391", "center", 700);
        }
      }
    }
  }

  const msg = alive.length <= 1 ? "press kick to crown the champion" : "press kick to play the next tie";
  text(msg, W / 2, H - 30, 13, "#9fb4d0", "center", 700);
}

function drawChampion() {
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, W, H);
  const c = game.champion;

  text("TOURNAMENT CHAMPION", W / 2, 90, 18, "#8fa3c0", "center", 800);

  // Trophy-ish laurel of particles behind the name.
  const cx = W / 2, cy = 220;
  const team = c && c.teamIdx !== null ? TEAMS[c.teamIdx] : TEAMS[0];
  const g = ctx.createRadialGradient(cx - 18, cy - 20, 10, cx, cy, 62);
  g.addColorStop(0, team.accent);
  g.addColorStop(1, team.color);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, 58, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#fde047";
  ctx.lineWidth = 4;
  ctx.stroke();

  for (let i = 0; i < 12; i++) {
    const a = performance.now() / 900 + (i * Math.PI * 2) / 12;
    text("✦", cx + Math.cos(a) * 92, cy + Math.sin(a) * 92, 17, "#fde047", "center", 900);
  }

  text(c ? c.name : "—", W / 2, 322, 44, "#ffffff", "center", 900);
  text(team.name.toUpperCase(), W / 2, 358, 17, team.accent, "center", 800);
  text(`${game.entrantCount} players  ·  ${tiesRemaining(game.entrantCount)} ties`,
       W / 2, 392, 13, "#8fa3c0", "center", 600);

  const bw = 280, bh = 48, bx = W / 2 - bw / 2, by = 440;
  ctx.fillStyle = "#4ade80";
  roundRect(bx, by, bw, bh, 10);
  ctx.fill();
  text("NEW TOURNAMENT", W / 2, by + bh / 2, 17, "#0b1220", "center", 900);
  text("press kick, ENTER or SPACE", W / 2, by + bh + 22, 11, "#8fa3c0", "center", 600);
}

function drawScoreboard() {
  const bw = 470, bh = 62, bx = (W - bw) / 2, by = 12;
  ctx.fillStyle = "rgba(6,12,22,0.82)";
  roundRect(bx, by, bw, bh, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < 2; i++) {
    const pl = game.players[i];
    if (!pl) continue;
    const cx = i === 0 ? bx + 96 : bx + bw - 96;

    ctx.fillStyle = pl.team.color;
    ctx.beginPath();
    ctx.arc(i === 0 ? bx + 26 : bx + bw - 26, by + bh / 2, 13, 0, Math.PI * 2);
    ctx.fill();

    text(pl.team.name.toUpperCase(), cx, by + 20, 13, "#cddcf2", "center", 700);
    text(String(game.score[i]), cx, by + 42, 26, "#ffffff", "center", 900);
    text(game.cpu[i] ? "CPU" : `P${i + 1}`,
         i === 0 ? bx + 26 : bx + bw - 26, by + bh / 2,
         game.cpu[i] ? 9 : 11, "#0b1220", "center", 900);
  }

  // Clock (or the goal target when untimed) sits between the two scores.
  if (game.suddenDeath) {
    const flash = Math.sin(performance.now() / 140) > 0 ? "#ef4444" : "#fca5a5";
    text("SUDDEN DEATH", W / 2, by + 16, 11, flash, "center", 900);
    text(fmtClock(game.clock), W / 2, by + 34, 19, "#ffffff", "center", 900);
  } else if (game.matchSecs > 0) {
    const low = game.clock <= 10;
    const col = low && Math.sin(performance.now() / 120) > 0 ? "#ef4444" : "#ffffff";
    text(fmtClock(game.clock), W / 2, by + 26, 21, col, "center", 900);
  } else {
    text(":", W / 2, by + 26, 24, "#5f7391", "center", 900);
  }

  // Gravity readout — always visible, since it changes how every jump feels.
  const band = gravBand(game.gravMul);
  text(`${band.label} ×${game.gravMul.toFixed(2)}`, W / 2, by + 46, 9, band.color, "center", 800);

  // World-effect banners: goal resize and chaos, both visible to both players.
  let wy = by + bh + 26;
  if (game.goalFx) {
    const def = POWERUPS[game.goalFx];
    const frac = clamp(game.goalFxT / def.dur, 0, 1);
    const ww = 150, wx = W / 2 - ww / 2;
    ctx.fillStyle = "rgba(6,12,22,0.85)";
    roundRect(wx, wy, ww, 17, 5); ctx.fill();
    ctx.fillStyle = def.color;
    roundRect(wx, wy, ww * frac, 17, 5); ctx.fill();
    text(def.label, W / 2, wy + 9, 9, "#0b1220", "center", 900);
    wy += 21;
  }
  if (game.chaos) {
    const ww = 150, wx = W / 2 - ww / 2;
    const frac = clamp(game.chaosT / chaosInterval(), 0, 1);
    ctx.fillStyle = "rgba(6,12,22,0.85)";
    roundRect(wx, wy, ww, 17, 5); ctx.fill();
    const hot = game.chaosT < 3;
    ctx.fillStyle = hot && Math.sin(performance.now() / 100) > 0 ? "#fca5a5" : "#f97316";
    roundRect(wx, wy, ww * (1 - frac), 17, 5); ctx.fill();
    text(`CHAOS #${game.chaosCount} · ${Math.ceil(game.chaosT)}s`,
         W / 2, wy + 9, 9, "#ffffff", "center", 900);
  }

  // Online status: latency-free indicator of who is authoritative.
  if (net.active) {
    const good = net.state === "live";
    const tag = netIsHost() ? "HOSTING" : "ONLINE";
    text(good ? tag : "DISCONNECTED", W / 2, by + bh + 12,
         9, good ? "#4ade80" : "#f87171", "center", 900);
  }

  // Round / target context above the board.
  const ctx1 = game.mode === MODE.TOURNAMENT
    ? `ROUND ${game.round}  ·  TIE ${game.tieIndex + 1}/${game.roundPairs.filter(p => p[1] !== null).length}  ·  FIRST TO ${game.goalsToWin}`
    : (modeCfg().goals
        ? `FIRST TO ${game.goalsToWin}`
        : `${MODE_LABEL[game.mode]}  ·  FIRST TO ${game.goalsToWin} POINTS`);
  text(ctx1, W / 2, by - 6, 9, "#7f95b3", "center", 700);

  // Active effect chips under each score.
  for (let i = 0; i < 2; i++) {
    const pl = game.players[i];
    if (!pl) continue;
    const fx = Object.keys(pl.effects);
    let x = i === 0 ? bx + 8 : bx + bw - 8;
    for (const f of fx) {
      const def = POWERUPS[f];
      const w = 74, h = 16;
      const dx = i === 0 ? x : x - w;
      const yy = by + bh + 6;
      ctx.fillStyle = "rgba(6,12,22,0.8)";
      roundRect(dx, yy, w, h, 5); ctx.fill();
      ctx.fillStyle = def.color;
      // The pistol shows rounds left, not a draining timer.
      const frac = f === "pistol"
        ? clamp(pl.ammo / (PISTOL_AMMO * 2), 0, 1)
        : clamp(pl.effects[f] / def.dur, 0, 1);
      roundRect(dx, yy, w * frac, h, 5); ctx.fill();
      const label = f === "pistol" ? `PISTOL ×${pl.ammo}` : def.label;
      text(label, dx + w / 2, yy + h / 2 + 1, 9, "#0b1220", "center", 900);
      x += i === 0 ? w + 5 : -(w + 5);
    }
  }
}

function drawStatBars(x, y, team, w = 190) {
  for (let i = 0; i < STAT_KEYS.length; i++) {
    const [key, label] = STAT_KEYS[i];
    const yy = y + i * 26;
    text(label, x, yy, 11, "#9fb4d0", "left", 700);
    const bx = x + 56, bw = w - 56;
    for (let p = 0; p < 5; p++) {
      const pw = (bw - 4 * 4) / 5;
      const px = bx + p * (pw + 4);
      ctx.fillStyle = p < team[key] ? team.color : "rgba(255,255,255,0.12)";
      roundRect(px, yy - 6, pw, 12, 3);
      ctx.fill();
    }
  }
}

function drawSelect() {
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, W, H);

  // Title.
  text("HEAD GAME", W / 2, 52, 44, "#ffffff", "center", 900);
  const sub = game.mode === MODE.TOURNAMENT
    ? `ROUND ${game.round}  ·  first to ${game.goalsToWin}` +
      (game.matchSecs > 0 ? `  ·  ${fmtClock(game.matchSecs)}` : "  ·  no time limit")
    : `first to ${game.goalsToWin} goals` +
      (game.matchSecs > 0 ? `  ·  ${fmtClock(game.matchSecs)}` : "  ·  no time limit");
  text(sub, W / 2, 84, 14, "#8fa3c0", "center", 600);

  for (let i = 0; i < 2; i++) {
    const px = i === 0 ? 30 : W / 2 + 15;
    const pw = W / 2 - 45;
    const team = TEAMS[game.sel[i]];
    const lockedNow = game.locked[i];

    ctx.fillStyle = lockedNow ? "rgba(30,60,40,0.75)" : "rgba(255,255,255,0.05)";
    roundRect(px, 110, pw, 440, 14);
    ctx.fill();
    ctx.strokeStyle = lockedNow ? "#4ade80" : "rgba(255,255,255,0.15)";
    ctx.lineWidth = lockedNow ? 3 : 2;
    ctx.stroke();

    text(game.cpu[i] ? `CPU · ${cpuCfg().name}` : seatLabel(i),
         px + pw / 2, 136, 15,
         game.cpu[i] ? "#fbbf24" : (lockedNow ? "#4ade80" : "#cddcf2"), "center", 900);
    text(game.cpu[i] ? "computer controlled"
                     : (i === 0 ? "W A S D  ·  F to lock" : "ARROWS  ·  ENTER to lock"),
         px + pw / 2, 156, 11, "#7f95b3", "center", 600);

    // Big preview head.
    const cx = px + pw / 2, cy = 224;
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(cx, cy + 46, 40, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    const headR = 40 * (0.78 + team.size * 0.07);
    const g = ctx.createRadialGradient(cx - 14, cy - 16, 8, cx, cy, 42);
    g.addColorStop(0, team.accent);
    g.addColorStop(1, team.color);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Live preview: the chosen face and hat, winking so it reads as alive.
    const look = game.looks[i] || LOOK_DEFAULTS[i];
    const previewMood = game.locked[i] ? "happy"
      : Math.floor(performance.now() / 1400) % 5 === 0 ? "kick" : "idle";
    drawFace(cx, cy, headR, i === 0 ? 1 : -1, look.face, previewMood, team);
    drawHat(cx, cy, headR, i === 0 ? 1 : -1, look.hat, team);
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Three picker rows. The active one is outlined so left/right is obvious.
    const look2 = game.looks[i] || LOOK_DEFAULTS[i];
    const rowsSel = [
      { label: "TEAM", value: team.name.toUpperCase() },
      { label: "FACE", value: faceById(look2.face).name },
      { label: "HAT",  value: hatById(look2.hat).name },
    ];
    rowsSel.forEach((rw, k) => {
      const ry = 288 + k * 28;
      const on = !game.cpu[i] && !game.locked[i] && game.lookRow[i] === k;
      ctx.fillStyle = on ? "rgba(125,211,252,0.16)" : "rgba(255,255,255,0.05)";
      roundRect(px + 24, ry, pw - 48, 24, 6);
      ctx.fill();
      if (on) {
        ctx.strokeStyle = "#7dd3fc";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      text(rw.label, px + 36, ry + 12, 9, "#7f95b3", "left", 800);
      text(rw.value, px + pw - 36, ry + 12, 12,
           on ? "#ffffff" : "#cddcf2", "right", 800);
      if (on) {
        text("◄", px + 96, ry + 12, 10, "#7dd3fc", "center", 900);
        text("►", px + pw - 96, ry + 12, 10, "#7dd3fc", "center", 900);
      }
    });

    drawStatBars(px + 24, 388, team, pw - 48);

    /*
      A compact dot strip instead of the old 2x4 name grid. The TEAM row above
      already names the selection, and the grid collided with the stat bars once
      the face and hat rows were added.
    */
    const dotY = 500;
    const dotGap = Math.min(34, (pw - 48) / TEAMS.length);
    const dotX0 = px + pw / 2 - (dotGap * (TEAMS.length - 1)) / 2;
    for (let t = 0; t < TEAMS.length; t++) {
      const on = t === game.sel[i];
      const dx = dotX0 + t * dotGap;
      ctx.fillStyle = TEAMS[t].color;
      ctx.beginPath();
      ctx.arc(dx, dotY, on ? 9 : 6, 0, Math.PI * 2);
      ctx.fill();
      if (on) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
    }

    if (lockedNow) text("READY", px + pw / 2, 528, 14, "#4ade80", "center", 900);
    else if (!game.cpu[i]) {
      text("up/down to switch row", px + pw / 2, 528, 10, "#6b819e", "center", 600);
    }
  }
}

function drawOverlays() {
  // New-gravity banner, shown over the countdown after a goal.
  if (game.gravAnnounce > 0 && game.gravMul !== 1) {
    const band = gravBand(game.gravMul);
    const a = clamp(game.gravAnnounce / 0.5, 0, 1);      // fade out at the end
    ctx.globalAlpha = a;
    const bw = 300, bh = 46, bx = (W - bw) / 2, by = 150;
    ctx.fillStyle = "rgba(6,12,22,0.85)";
    roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.strokeStyle = band.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    text(band.label, W / 2, by + 17, 17, band.color, "center", 900);
    text(`gravity ×${game.gravMul.toFixed(2)}`, W / 2, by + 34, 11, "#9fb4d0", "center", 700);
    ctx.globalAlpha = 1;
  }

  // Chaos re-roll banner.
  if (game.chaosAnnounce > 0) {
    const a = clamp(game.chaosAnnounce / 0.6, 0, 1);
    ctx.globalAlpha = a;
    const bw = 330, bh = 50, bx = (W - bw) / 2, by = 206;
    ctx.fillStyle = "rgba(20,6,2,0.88)";
    roundRect(bx, by, bw, bh, 10); ctx.fill();
    ctx.strokeStyle = "#f97316";
    ctx.lineWidth = 2.5; ctx.stroke();
    text("⚡ CHAOS ⚡", W / 2, by + 18, 19, "#fdba74", "center", 900);
    text(`every stat re-rolled  ·  roll #${game.chaosCount}`,
         W / 2, by + 36, 10, "#fed7aa", "center", 700);
    ctx.globalAlpha = 1;
  }

  if (game.scene === SCENE.COUNTDOWN) {
    const n = Math.ceil(game.timer - 0.2);
    const label = n <= 0 ? "GO!" : String(Math.min(3, n));
    const frac = 1 - ((game.timer - 0.2) % 1);
    const scale = label === "GO!" ? 1.25 : lerp(1.5, 0.95, clamp(frac, 0, 1));
    ctx.save();
    ctx.translate(W / 2, H / 2 - 40);
    ctx.scale(scale, scale);
    ctx.globalAlpha = 0.92;
    text(label, 0, 0, 86, label === "GO!" ? "#4ade80" : "#ffffff", "center", 900);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  if (game.scene === SCENE.CELEBRATE) {
    const pl = game.players[game.lastScorer];
    const t = 1 - game.timer / CELEBRATE_T;
    const pop = 1 + Math.sin(clamp(t * 3, 0, Math.PI)) * 0.22;
    ctx.fillStyle = "rgba(5,10,18,0.45)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2 - 50);
    ctx.scale(pop, pop);
    text("GOAL!", 0, 0, 92, pl.team.color, "center", 900);
    ctx.restore();
    text(`${pl.team.name.toUpperCase()}  —  P${game.lastScorer + 1}`,
         W / 2, H / 2 + 26, 20, "#ffffff", "center", 800);
    text(`${game.score[0]}  :  ${game.score[1]}`, W / 2, H / 2 + 60, 26, "#cddcf2", "center", 900);
  }

  if (game.scene === SCENE.WIN) {
    ctx.fillStyle = "rgba(5,10,18,0.78)";
    ctx.fillRect(0, 0, W, H);

    // A single match with no goal target can legitimately end level.
    if (game.winner < 0) {
      text("DRAW", W / 2, H / 2 - 40, 56, "#cddcf2", "center", 900);
      text(`${game.score[0]} – ${game.score[1]}  ·  time up`,
           W / 2, H / 2 + 12, 19, "#8fa3c0", "center", 700);
    } else {
      const pl = game.players[game.winner];
      text(game.byTime ? "WINNER ON TIME" : "WINNER",
           W / 2, H / 2 - 110, 24, "#8fa3c0", "center", 800);

      const cx = W / 2, cy = H / 2 - 34;
      const g = ctx.createRadialGradient(cx - 16, cy - 18, 10, cx, cy, 48);
      g.addColorStop(0, pl.team.accent);
      g.addColorStop(1, pl.team.color);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, 46, 0, Math.PI * 2);
      ctx.fill();

      text(pl.team.name.toUpperCase(), W / 2, H / 2 + 42, 36, "#ffffff", "center", 900);
      text(`${seatLabel(game.winner)}   ·   ${game.score[0]} – ${game.score[1]}`,
           W / 2, H / 2 + 78, 18, "#cddcf2", "center", 700);
    }

    const tourn = game.mode === MODE.TOURNAMENT;
    const bw = 300, bh = 46, bx = W / 2 - bw / 2, by = H / 2 + 104;
    ctx.fillStyle = "#4ade80";
    roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    text(tourn ? "TO THE BRACKET" : "BACK TO SETUP", W / 2, by + bh / 2, 17, "#0b1220", "center", 900);
    text("press kick, ENTER or SPACE", W / 2, by + bh + 20, 11, "#8fa3c0", "center", 600);
  }
}

function draw() {
  ctx.save();

  // Full-screen scenes that draw no pitch.
  if (game.scene === SCENE.MENU)     { drawMenu();     ctx.restore(); return; }
  if (game.scene === SCENE.ONLINE)   { drawOnline();   ctx.restore(); return; }
  if (game.scene === SCENE.ROSTER)   { drawRoster();   ctx.restore(); return; }
  if (game.scene === SCENE.PAUSE)    { drawPause();    ctx.restore(); return; }
  if (game.scene === SCENE.SETTINGS) { drawSettings(); ctx.restore(); return; }
  if (game.scene === SCENE.BOARD)    { drawBoard();    ctx.restore(); return; }
  if (game.scene === SCENE.RULES)    { drawRules();    ctx.restore(); return; }
  if (game.scene === SCENE.SELECT)   { drawSelect();   ctx.restore(); return; }
  if (game.scene === SCENE.BRACKET)  { drawBracket();  ctx.restore(); return; }
  if (game.scene === SCENE.CHAMPION) { drawChampion(); ctx.restore(); return; }

  if (game.shake > 0) {
    // Gated here rather than at the ~11 places that set `shake`, so the
    // setting cannot be bypassed by a new effect forgetting to check it.
    const m = game.opt.shake ? game.shake * 14 : 0;
    if (m) ctx.translate(rand(-m, m), rand(-m, m));
  }

  drawPitch();
  drawPlatforms();
  if (hasNet()) drawNet();
  if (game.mode === MODE.BASKET) drawHoops();
  drawMines();
  drawHelpers();
  drawPowerups();
  if (game.players[0]) drawPlayer(game.players[0]);
  if (game.players[1]) drawPlayer(game.players[1]);
  drawBall();
  drawBullets();
  drawParticles();

  if (game.flash > 0 && game.opt.flash) {
    ctx.fillStyle = `rgba(255,255,255,${game.flash * 0.35})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  drawScoreboard();
  drawOverlays();

  // Quiet reminder that a pause menu exists, toggleable in settings.
  if (game.opt.hints && (game.scene === SCENE.PLAY || game.scene === SCENE.COUNTDOWN)) {
    text("ESC — pause", W - 14, H - 12, 10, "rgba(143,163,192,0.65)", "right", 600);
  }

  ctx.restore();
}

if (typeof window !== "undefined") window.PHYS = PHYS;

function runTests() {
  const out = [];
  let pass = 0, fail = 0;
  const ok = (name, cond, extra = "") => {
    (cond ? pass++ : fail++);
    out.push(`${cond ? "PASS" : "FAIL"}  ${name}${extra && !cond ? "  — " + extra : ""}`);
  };
  const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;

  // 1. Integration: free fall matches the closed form within a substep.
  {
    const b = { x: 0, y: 0, vx: 0, vy: 0, r: 1, mass: 1 };
    for (let i = 0; i < 120; i++) integrate(b, DT, GRAVITY, 0);
    const exact = 0.5 * GRAVITY * 1;
    ok("free fall ≈ ½gt²", Math.abs(b.y - exact) / exact < 0.02, `got ${b.y.toFixed(1)} want ${exact}`);
  }

  // 2. Drag never reverses or amplifies velocity.
  {
    const b = { x: 0, y: 0, vx: 500, vy: 0, r: 1, mass: 1 };
    integrate(b, DT, 0, BALL_DRAG);
    ok("drag decelerates only", b.vx > 0 && b.vx < 500);
  }

  // 3. Bounce symmetry: equal restitution gives equal rebound both ways.
  {
    const mk = (vx) => ({ x: 0, y: 0, vx, vy: 0, r: 10, mass: 1 });
    const a = mk(300), b = mk(-300);
    resolveStaticCircle(a, 15, 0, 8, 0.8);
    resolveStaticCircle(b, -15, 0, 8, 0.8);
    ok("bounce is symmetric", near(a.vx, -b.vx, 1e-9), `${a.vx} vs ${b.vx}`);
  }

  // 4. Restitution scales rebound speed correctly.
  {
    const b = { x: 0, y: 0, vx: 400, vy: 0, r: 10, mass: 1 };
    resolveStaticCircle(b, 15, 0, 8, 0.5);
    ok("restitution 0.5 halves rebound", near(Math.abs(b.vx), 200, 1e-6), String(b.vx));
  }

  // 5. Depenetration: no residual overlap after a static resolve.
  {
    const b = { x: 10, y: 0, vx: 0, vy: 0, r: 10, mass: 1 };
    resolveStaticCircle(b, 14, 0, 8, 0.7);
    ok("depenetrates fully", near(Math.hypot(b.x - 14, b.y), 18, 1e-9));
  }

  // 6. Two-body momentum conservation.
  {
    const a = { x: 0,  y: 0, vx: 200, vy: 0, r: 10, mass: 2 };
    const b = { x: 15, y: 0, vx: -100, vy: 0, r: 10, mass: 3 };
    const p0 = a.mass * a.vx + b.mass * b.vx;
    resolveCircles(a, b, 0.5);
    const p1 = a.mass * a.vx + b.mass * b.vx;
    ok("momentum conserved", near(p0, p1, 1e-6), `${p0} vs ${p1}`);
  }

  // 7. Heavier body deflects less.
  {
    const heavy = { x: 0,  y: 0, vx: 0, vy: 0, r: 30, mass: 100 };
    const light = { x: 40, y: 0, vx: -400, vy: 0, r: 12, mass: 1 };
    resolveCircles(heavy, light, 0.7);
    ok("mass ratio respected", Math.abs(heavy.vx) < Math.abs(light.vx) / 10);
  }

  // 8. Separating pairs are left alone.
  {
    const a = { x: 0,  y: 0, vx: -50, vy: 0, r: 10, mass: 1 };
    const b = { x: 15, y: 0, vx: 50,  vy: 0, r: 10, mass: 1 };
    resolveCircles(a, b, 0.8);
    ok("no impulse when separating", near(a.vx, -50, 1e-9) && near(b.vx, 50, 1e-9));
  }

  // 9. Coincident centres do not produce NaN.
  {
    const a = { x: 0, y: 0, vx: 0, vy: 0, r: 10, mass: 1 };
    const b = { x: 0, y: 0, vx: 0, vy: 0, r: 10, mass: 1 };
    resolveCircles(a, b, 0.5);
    ok("no NaN on coincident centres",
       Number.isFinite(a.x) && Number.isFinite(b.x) && Number.isFinite(a.vx));
  }

  // 10. Goal detection: inside the mouth scores, above the bar does not.
  {
    goalPhase = 0;                       // pin the goals for exact geometry
    const TL = goalTop(0), TR = goalTop(1);
    const inside = { x: WALL - 2, y: TL + goalHeight() / 2, r: BALL_R };
    const above  = { x: WALL - 2, y: TL - 60,         r: BALL_R };
    const mid    = { x: W / 2,    y: TL + 10,         r: BALL_R };
    ok("left goal scores -1", goalScored(inside) === -1);
    ok("above the bar is no goal", goalScored(above) === 0);
    ok("midfield is no goal", goalScored(mid) === 0);
    const right = { x: W - WALL + 2, y: TR + 20, r: BALL_R };
    ok("right goal scores +1", goalScored(right) === 1);
  }

  // 11. No tunneling: a max-speed ball cannot pass through a post in one step.
  {
    const dist = BALL_MAX_V * DT;
    ok("max step < post diameter", dist < POST_R * 2 + BALL_R * 2,
       `step ${dist.toFixed(2)}px vs ${(POST_R * 2 + BALL_R * 2)}px`);

    // Swept check: fire the ball at the crossbar and confirm it never ends up
    // on the far side without having been deflected.
    let through = false;
    goalPhase = 0;
    const b = { x: 300, y: goalTop(0), vx: -BALL_MAX_V, vy: 0, r: BALL_R, mass: 1 };
    for (let i = 0; i < 400; i++) {
      integrate(b, DT, 0, 0);
      resolveStaticCircle(b, WALL + POST_R, goalTop(0), POST_R, 0.85);
      if (b.x < WALL - GOAL_D) { through = true; break; }
      if (b.vx > 0) break;                       // deflected — good
    }
    ok("post is not tunneled at max speed", !through);
  }

  // 12. Speed clamp.
  {
    const b = limitSpeed({ vx: 5000, vy: 5000 }, BALL_MAX_V);
    ok("speed clamp holds", near(Math.hypot(b.vx, b.vy), BALL_MAX_V, 1e-6));
  }

  // 13. Kick direction: always downfield and always upward.
  {
    const r = kickImpulse(5, 0, 1, 800, 1);
    ok("kick goes right when facing right", r.ix > 0);
    ok("kick has lift", r.iy < 0);
    const l = kickImpulse(-5, 0, -1, 800, 1);
    ok("kick goes left when facing left", l.ix < 0);
    ok("kick magnitude is bounded", Math.hypot(r.ix, r.iy) <= 800 + 1e-6);
  }

  // 14. Proximity: closer contact kicks harder.
  {
    const close = kickImpulse(5, 0, 1, 800, 1);
    const far   = kickImpulse(5, 0, 1, 800, 0);
    ok("proximity increases power", Math.hypot(close.ix, close.iy) > Math.hypot(far.ix, far.iy));
  }

  // 15. Stat monotonicity + neutral midpoint.
  {
    let mono = true;
    for (let p = 1; p < 5; p++) {
      if (!(statToMultiplier(p, 0.15) < statToMultiplier(p + 1, 0.15))) mono = false;
    }
    ok("stats are monotonic", mono);
    ok("3 pips is neutral", near(statToMultiplier(3, 0.15), 1, 1e-12));
    ok("multipliers stay positive", statToMultiplier(1, 0.3) > 0);
  }

  // 16. Every team is on a comparable budget and stats are in range.
  {
    let rangeOk = true, budgets = [];
    for (const t of TEAMS) {
      for (const [k] of STAT_KEYS) {
        if (!(t[k] >= 1 && t[k] <= 5 && Number.isInteger(t[k]))) rangeOk = false;
      }
      budgets.push(t.speed + t.shot + t.jump + t.size);
    }
    ok("team stats in 1..5", rangeOk);
    const spread = Math.max(...budgets) - Math.min(...budgets);
    ok("team budgets within 1 point", spread <= 1, `spread ${spread} (${budgets.join(",")})`);
    ok("at least 6 teams", TEAMS.length >= 6, `${TEAMS.length}`);
    ok("teams are distinct", new Set(TEAMS.map(t => `${t.speed}${t.shot}${t.jump}${t.size}`)).size === TEAMS.length);
  }

  // 17. A resting ball settles instead of jittering forever.
  {
    const b = { x: W / 2, y: GROUND_Y - BALL_R - 100, vx: 0, vy: 0, r: BALL_R, mass: 1 };
    const saveBall = game.ball;
    game.ball = b;
    for (let i = 0; i < 1200; i++) stepBall(DT);
    game.ball = saveBall;
    ok("ball comes to rest", Math.abs(b.vy) < 40 && near(b.y, GROUND_Y - BALL_R, 2),
       `vy=${b.vy.toFixed(2)} y=${b.y.toFixed(2)}`);
  }

  // 18. Ball stays inside the world over a long chaotic run.
  {
    const saveBall = game.ball;
    let escaped = false;
    game.ball = { x: W / 2, y: 100, vx: 900, vy: -300, r: BALL_R, mass: 1 };
    for (let i = 0; i < 4000; i++) {
      stepBall(DT);
      const b = game.ball;
      if (!Number.isFinite(b.x) || !Number.isFinite(b.y)) { escaped = true; break; }
      if (b.x < -GOAL_D - 40 || b.x > W + GOAL_D + 40 || b.y < -40 || b.y > H + 40) { escaped = true; break; }
      if (i % 700 === 0) { b.vx = rand(-900, 900); b.vy = rand(-700, 200); }
    }
    game.ball = saveBall;
    ok("ball never escapes the world", !escaped);
  }

  // 19. Power-up table is well formed.
  {
    let good = PU_KEYS.length === 11;
    const colors = new Set();
    for (const k of PU_KEYS) {
      const d = POWERUPS[k];
      if (!d.label || !d.color || !d.glyph || !(d.dur > 0)) good = false;
      colors.add(d.color);
    }
    ok("11 power-ups, all well formed", good);
    ok("power-up colors are distinct", colors.size === PU_KEYS.length);
  }

  // 19b. Power-ups spawn in a low band that every team can actually reach.
  {
    let lowest = Infinity, highest = -Infinity, inBand = true;
    for (let i = 0; i < 400; i++) {
      game.powerups.length = 0;
      spawnPowerup();
      const p = game.powerups[0];
      lowest = Math.min(lowest, p.y);
      highest = Math.max(highest, p.y);
      if (p.y > PU_Y_LOW || p.y < PU_Y_HIGH) inBand = false;
    }
    game.powerups.length = 0;
    ok("power-ups spawn inside the low band", inBand);
    ok("power-ups clear the grass", highest + PU_R < GROUND_Y,
       `lowest edge ${(highest + PU_R).toFixed(1)} vs ground ${GROUND_Y}`);

    // Worst jumper on the roster must reach the top of the band. Peak rise of
    // a jump is v^2/2g, measured from the centre of a grounded player.
    const worst = TEAMS.reduce((a, t) => (t.jump < a.jump ? t : a), TEAMS[0]);
    const wp = new Player(0, worst);
    const peakRise = (wp.jumpV * wp.jumpV) / (2 * GRAVITY);
    const reachY = (GROUND_Y - wp.r) - peakRise - wp.r;   // topmost point of the head
    ok(`worst jumper (${worst.name}) reaches the band top`,
       reachY <= PU_Y_HIGH + PU_R,
       `reach ${reachY.toFixed(1)} vs band top ${(PU_Y_HIGH + PU_R).toFixed(1)}`);
  }

  // 19c. Random gravity stays inside playable limits across its whole range.
  {
    const savedG = gravity, savedMul = game.gravMul;

    // Re-rolls must always land inside the declared bounds.
    let inBounds = true, lo = Infinity, hi = -Infinity;
    for (let i = 0; i < 500; i++) {
      const m = rand(GRAV_MIN_MUL, GRAV_MAX_MUL);
      lo = Math.min(lo, m); hi = Math.max(hi, m);
      if (m < GRAV_MIN_MUL || m > GRAV_MAX_MUL) inBounds = false;
    }
    ok("gravity rolls stay in bounds", inBounds, `${lo.toFixed(2)}..${hi.toFixed(2)}`);
    ok("gravity range is actually varied", GRAV_MAX_MUL - GRAV_MIN_MUL >= 0.3,
       `spread ${(GRAV_MAX_MUL - GRAV_MIN_MUL).toFixed(2)}`);
    ok("every band is reachable and ordered",
       GRAV_BANDS.length >= 3 && gravBand(GRAV_MIN_MUL) && gravBand(GRAV_MAX_MUL) &&
       GRAV_BANDS.every((b, i) => i === 0 || b.max > GRAV_BANDS[i - 1].max));

    // At the LOWEST gravity, the best jumper must not fly through the ceiling.
    {
      const best = TEAMS.reduce((a, t) => (t.jump > a.jump ? t : a), TEAMS[0]);
      const p = new Player(0, best);
      p.grant("powerjump");                       // worst case: jump power-up too
      const gLow = GRAVITY * GRAV_MIN_MUL;
      const v = p.jumpV * 1.45 * Math.sqrt(GRAV_MIN_MUL);   // scaled jump
      const rise = (v * v) / (2 * gLow);
      const topY = (GROUND_Y - p.r) - rise - p.r;
      ok(`best jumper (${best.name}) stays under the ceiling at min gravity`,
         topY > 0, `peak y=${topY.toFixed(1)} (rise ${rise.toFixed(0)}px)`);
    }

    // At the HIGHEST gravity, the worst jumper must still reach the band top.
    {
      const worst = TEAMS.reduce((a, t) => (t.jump < a.jump ? t : a), TEAMS[0]);
      const p = new Player(0, worst);
      const gHigh = GRAVITY * GRAV_MAX_MUL;
      const vh = p.jumpV * Math.sqrt(GRAV_MAX_MUL);          // scaled jump
      const rise = (vh * vh) / (2 * gHigh);
      const reachY = (GROUND_Y - p.r) - rise - p.r;
      ok(`worst jumper (${worst.name}) still reaches power-ups at max gravity`,
         reachY <= PU_Y_HIGH + PU_R,
         `reach ${reachY.toFixed(1)} vs band top ${(PU_Y_HIGH + PU_R).toFixed(1)}`);
    }

    // Simulated jumps at both extremes must land, and land sooner under
    // heavier gravity — i.e. the live `gravity` really drives player dynamics.
    {
      const airtime = (mul) => {
        gravity = GRAVITY * mul;
        const p = new Player(0, TEAMS[0]);
        p.reset();
        const g0 = p.y;
        intent[0].up = true; p.update(DT, null); intent[0].up = false;
        let t = 0;
        for (let i = 0; i < 2000; i++) {
          p.update(DT, null);
          t += DT;
          if (i > 4 && p.onGround && Math.abs(p.y - g0) < 1) break;
        }
        return t;
      };
      const light = airtime(GRAV_MIN_MUL);
      const heavy = airtime(GRAV_MAX_MUL);
      ok("higher gravity shortens airtime", heavy < light * 0.92,
         `${light.toFixed(2)}s -> ${heavy.toFixed(2)}s`);
      ok("jumps always land", light < 3 && heavy < 3, `${light.toFixed(2)}s / ${heavy.toFixed(2)}s`);
    }

    // The ball must stay in the world at both extremes.
    {
      let escaped = null;
      for (const mul of [GRAV_MIN_MUL, GRAV_MAX_MUL]) {
        gravity = GRAVITY * mul;
        const sb = game.ball;
        game.ball = { x: W / 2, y: 100, vx: 1000, vy: -600, r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 3000; i++) {
          stepBall(DT);
          const b = game.ball;
          if (!Number.isFinite(b.x) || !Number.isFinite(b.y)) { escaped = `NaN at ×${mul}`; break; }
          if (b.y < -40 || b.y > H + 40 || b.x < -GOAL_D - 40 || b.x > W + GOAL_D + 40) {
            escaped = `out at ×${mul.toFixed(2)}: ${b.x.toFixed(0)},${b.y.toFixed(0)}`;
            break;
          }
          if (i % 600 === 0) { b.vx = rand(-1000, 1000); b.vy = rand(-800, 200); }
        }
        game.ball = sb;
        if (escaped) break;
      }
      ok("ball stays in the world at both gravity extremes", !escaped, escaped || "");
    }

    // Gravity must visibly change BALL behaviour (the point of the feature)
    // while leaving jump height alone (the safety property).
    {
      const flight = (mul) => {
        gravity = GRAVITY * mul;
        const p = new Player(0, TEAMS[0]);
        p.reset(); p.facing = 1;
        p.kickT = KICK_TIME * 0.5; p.kickConsumed = false;
        const tp = p.legTip;
        const sb = game.ball;
        game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        ballVsPlayer(p);
        const y0 = game.ball.y;
        let hi = y0, hang = 0;
        for (let i = 0; i < 1600; i++) {
          stepBall(DT);
          hi = Math.min(hi, game.ball.y);
          if (game.ball.y + game.ball.r < GROUND_Y - 1) hang += DT;
        }
        game.ball = sb;
        return { hang, rise: y0 - hi };
      };
      const lowG = flight(GRAV_MIN_MUL);
      const highG = flight(GRAV_MAX_MUL);
      ok("low gravity makes the ball hang much longer", lowG.hang > highG.hang * 1.6,
         `${highG.hang.toFixed(2)}s vs ${lowG.hang.toFixed(2)}s`);
      ok("low gravity makes shots arc higher", lowG.rise > highG.rise * 1.5,
         `${highG.rise.toFixed(0)}px vs ${lowG.rise.toFixed(0)}px`);

      const jumpRise = (mul) => {
        gravity = GRAVITY * mul;
        const p = new Player(0, TEAMS[0]);
        p.reset();
        const g0 = p.y;
        let hi = g0;
        intent[0].up = true; p.update(DT, null); intent[0].up = false;
        for (let i = 0; i < 3000; i++) {
          p.update(DT, null);
          hi = Math.min(hi, p.y);
          if (i > 4 && p.onGround && Math.abs(p.y - g0) < 1) break;
        }
        return g0 - hi;
      };
      const jl = jumpRise(GRAV_MIN_MUL), jh = jumpRise(GRAV_MAX_MUL);
      ok("jump height is preserved across the gravity range",
         Math.abs(jl - jh) / jl < 0.06, `${jl.toFixed(0)}px vs ${jh.toFixed(0)}px`);
    }

    // The opening kickoff is normal; a post-goal kickoff re-rolls.
    {
      const savedState = { scene: game.scene, players: game.players, ball: game.ball,
                           score: [...game.score], timer: game.timer };
      game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
      kickoff(0, false);
      ok("opening kickoff uses normal gravity",
         game.gravMul === 1 && gravity === GRAVITY, `×${game.gravMul}`);

      const seen = new Set();
      for (let i = 0; i < 40; i++) { kickoff(1, true); seen.add(game.gravMul.toFixed(4)); }
      ok("post-goal kickoff re-rolls gravity", seen.size > 30, `${seen.size} distinct values`);
      ok("re-roll updates the live gravity value",
         Math.abs(gravity - GRAVITY * game.gravMul) < 1e-9);
      ok("re-roll announces itself", game.gravAnnounce > 0);

      Object.assign(game, savedState);
      game.particles = [];
    }

    gravity = savedG;
    game.gravMul = savedMul;
  }

  // 19c2. Goals are FIXED in a normal match and only slide under chaos.
  //       This is the behaviour change: moving nets made a normal match feel
  //       arbitrary, so motion is now chaos-only (or an explicit rule).
  {
    const sPhase = goalPhase, sChaos = game.chaos, sMoving = game.rules.movingGoals;
    game.rules.movingGoals = false;

    game.chaos = false;
    const tops = new Set();
    for (let i = 0; i < 400; i++) {
      goalPhase = i * 0.37;
      tops.add(goalTop(0).toFixed(4));
      tops.add(goalTop(1).toFixed(4));
    }
    ok("a normal match has motionless goals", tops.size === 1,
       `${tops.size} distinct positions`);
    ok("the static goal sits at its resting height",
       Math.abs(goalTop(0) - (GROUND_Y - goalHeight())) < 1e-6, `${goalTop(0).toFixed(1)}`);
    ok("both static goals are level", goalTop(0) === goalTop(1));
    ok("a static frame still reaches the grass",
       Math.abs(goalBottom(0) - GROUND_Y) < 1e-6, `${goalBottom(0).toFixed(1)}`);

    // Scoring must still work against a motionless goal.
    ok("a static goal still scores",
       goalScored({ x: WALL - 2, y: goalTop(0) + 30, r: BALL_R }) === -1);
    ok("above a static bar is still no goal",
       goalScored({ x: WALL - 2, y: goalTop(0) - BALL_R - 12, r: BALL_R }) === 0);

    game.chaos = true;
    const moved = new Set();
    for (let i = 0; i < 400; i++) { goalPhase = i * 0.37; moved.add(goalTop(0).toFixed(2)); }
    ok("chaos makes the goals slide again", moved.size > 10, `${moved.size}`);

    game.chaos = false;
    game.rules.movingGoals = true;
    const forced = new Set();
    for (let i = 0; i < 200; i++) { goalPhase = i * 0.37; forced.add(goalTop(0).toFixed(2)); }
    ok("the MOVING GOALS rule can force motion on", forced.size > 10, `${forced.size}`);

    game.rules.movingGoals = sMoving;
    game.chaos = sChaos;
    goalPhase = sPhase;
  }

  // 19d. Mines: placement, arming, stun, and ball launch.
  {
    const savedState = { players: game.players, ball: game.ball, mines: game.mines,
                         mineTimer: game.mineTimer, scene: game.scene };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    // Placement: never inside a goal mouth, always on the grass.
    let placementOk = true, minX = Infinity, maxX = -Infinity;
    for (let i = 0; i < 400; i++) {
      game.mines = [];
      spawnMine();
      const m = game.mines[0];
      minX = Math.min(minX, m.x); maxX = Math.max(maxX, m.x);
      if (m.x - MINE_R < WALL || m.x + MINE_R > W - WALL) placementOk = false;
      if (m.y + MINE_R > GROUND_Y + 1) placementOk = false;
      // Must not sit in front of either goal mouth.
      if (m.x < WALL + 60 || m.x > W - WALL - 60) placementOk = false;
    }
    ok("mines spawn on the grass, clear of both goals", placementOk,
       `x range ${minX.toFixed(0)}..${maxX.toFixed(0)}`);

    // A fresh mine is inert while arming.
    {
      game.mines = [];
      spawnMine();
      const m = game.mines[0];
      const pl = game.players[0];
      pl.reset();
      m.x = pl.x; m.y = pl.y;                    // standing right on it
      updateMines(DT);
      ok("an arming mine does not detonate", game.mines.length === 1 && pl.stun === 0);

      // Once armed, the same contact detonates.
      m.arm = 0;
      updateMines(DT);
      ok("an armed mine detonates on contact", game.mines.length === 0);
      ok("the mine stuns the player", pl.stun > 0, `stun=${pl.stun}`);
      ok("the mine flings the player", Math.abs(pl.vx) > 100 || pl.vy < -100,
         `v=${pl.vx.toFixed(0)},${pl.vy.toFixed(0)}`);
    }

    // A stunned player ignores input but always recovers.
    // NOTE: use a standalone Player, not game.players[0] — a second player
    // overlapping the same spot would pin it and mask the real behaviour.
    {
      const pl = new Player(0, TEAMS[0]);
      pl.reset();
      pl.stun = MINE_STUN;
      const x0 = pl.x;
      intent[0].right = true; intent[0].up = true;
      for (let i = 0; i < 12; i++) pl.update(DT, null);
      ok("a stunned player ignores movement input", Math.abs(pl.x - x0) < 6,
         `moved ${(pl.x - x0).toFixed(1)}px`);
      ok("a stunned player cannot kick", pl.tryStartKick() === false);

      // Run well past the stun with NO input held, so the player does not drift
      // into a wall (which would make the recovery check unfalsifiable).
      intent[0].right = false; intent[0].up = false;
      for (let i = 0; i < 400; i++) pl.update(DT, null);
      ok("stun always wears off", pl.stun === 0, `stun=${pl.stun}`);
      ok("a recovered player can kick again", pl.tryStartKick() === true);

      // Re-centre before testing movement so there is room to move.
      pl.reset();
      const x1 = pl.x;
      intent[0].right = true;
      for (let i = 0; i < 60; i++) pl.update(DT, null);
      intent[0].right = false;
      ok("control returns after the stun", pl.x > x1 + 10, `moved ${(pl.x - x1).toFixed(1)}px`);
    }

    // Ball contact launches the ball upward and away, and never downward.
    {
      const pl = game.players[0];
      pl.reset();
      pl.x = 100;                                 // keep the player clear
      game.players[1].x = 900;
      let allUp = true, detail = "";
      for (const side of [-1, 1]) {
        game.mines = [];
        spawnMine();
        const m = game.mines[0];
        m.arm = 0;
        /*
          Pin the mine to midfield and park both players far away. spawnMine
          picks a random x, and a mine that lands near a player detonates on the
          PLAYER first — so leaving the position to chance made this test fail
          roughly one run in ten.
        */
        m.x = W / 2;
        m.y = GROUND_Y - MINE_R;
        pl.x = WALL + pl.r + 5;
        game.players[1].x = W - WALL - game.players[1].r - 5;
        game.ball = { x: m.x + side * 5, y: m.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        updateMines(DT);
        if (!(game.ball.vy < 0)) { allUp = false; detail = `side ${side}: vy=${game.ball.vy.toFixed(0)}`; }
        if (Math.sign(game.ball.vx) !== side) {
          allUp = false;
          detail = `side ${side}: vx=${game.ball.vx.toFixed(0)}`;
        }
      }
      ok("a mine launches the ball upward and away", allUp, detail);
      ok("mine launch respects the speed clamp",
         len(game.ball.vx, game.ball.vy) <= BALL_MAX_V + 1e-6);
    }

    // Live mine count is capped, and mines clear on kickoff.
    {
      game.mines = [];
      game.mineTimer = 0;
      for (let i = 0; i < 4000; i++) updateMines(DT);
      ok("live mines are capped", game.mines.length <= MINE_MAX_LIVE, `${game.mines.length}`);

      game.score = [0, 0];
      kickoff(1, true);
      ok("kickoff clears all mines", game.mines.length === 0);
    }

    Object.assign(game, savedState);
    game.particles = [];
  }

  // 19e. Defensive clearance: a ball behind you is kicked AWAY from your goal.
  {
    const savedState = { players: game.players, ball: game.ball };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    // For each player, put the ball on their own-goal side and kick.
    for (const idx of [0, 1]) {
      const ownGoalDir = idx === 0 ? -1 : 1;
      const pl = game.players[idx];
      pl.reset();
      pl.x = W / 2;                          // mid-pitch, so both sides are open
      // Face AWAY from the ball, which is the case the old code couldn't handle.
      pl.facing = -ownGoalDir;
      pl.kickT = KICK_TIME * 0.5;
      pl.kickConsumed = false;
      game.ball = {
        x: pl.x + ownGoalDir * (pl.r + BALL_R * 0.8), y: pl.y,
        vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS,
      };
      ballVsPlayer(pl);
      ok(`P${idx + 1} can clear a ball behind them`, pl.kickConsumed,
         "kick did not connect");
      ok(`P${idx + 1}'s clearance goes away from their own goal`,
         Math.sign(game.ball.vx) === -ownGoalDir,
         `vx=${game.ball.vx.toFixed(0)} (own goal dir ${ownGoalDir})`);
      ok(`P${idx + 1}'s clearance has lift`, game.ball.vy < 0, `vy=${game.ball.vy.toFixed(0)}`);
    }

    // A clearance must not be strong enough to be a free shot on goal, and a
    // normal forward shot must still be stronger than a clearance.
    {
      const pl = game.players[0];
      const measure = (behind) => {
        pl.reset();
        pl.x = W / 2;
        pl.facing = 1;
        pl.kickT = KICK_TIME * 0.5;
        pl.kickConsumed = false;
        const off = behind ? -(pl.r + BALL_R * 0.8) : (pl.r + BALL_R * 0.5);
        game.ball = { x: pl.x + off, y: pl.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        ballVsPlayer(pl);
        return len(game.ball.vx, game.ball.vy);
      };
      const fwd = measure(false), back = measure(true);
      ok("a clearance is weaker than a forward shot", back < fwd,
         `${back.toFixed(0)} vs ${fwd.toFixed(0)}`);
    }

    // Sweep: from many positions behind the defender, the ball must NEVER be
    // driven toward their own goal (which would be an own goal).
    {
      let ownGoalRisk = null;
      for (const idx of [0, 1]) {
        const ownGoalDir = idx === 0 ? -1 : 1;
        for (const dy of [-0.5, 0, 0.5]) {
          for (const dist of [0.7, 0.9, 1.1]) {
            for (const face of [-1, 1]) {
              const pl = game.players[idx];
              pl.reset();
              pl.x = W / 2;
              pl.facing = face;
              pl.kickT = KICK_TIME * 0.5;
              pl.kickConsumed = false;
              game.ball = {
                x: pl.x + ownGoalDir * (pl.r + BALL_R) * dist,
                y: pl.y + pl.r * dy,
                vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS,
              };
              ballVsPlayer(pl);
              if (pl.kickConsumed && Math.sign(game.ball.vx) === ownGoalDir) {
                ownGoalRisk = `P${idx + 1} face=${face} dy=${dy} dist=${dist} vx=${game.ball.vx.toFixed(0)}`;
              }
            }
          }
        }
      }
      ok("no kick ever drives the ball into your own goal", !ownGoalRisk, ownGoalRisk || "");
    }

    Object.assign(game, savedState);
    game.particles = [];
  }

  // 19f. Match rules: goal target bounds and the match clock.
  {
    const saved = { mode: game.mode, goalsToWin: game.goalsToWin, timeIdx: game.timeIdx,
                    menuRow: game.menuRow, entrantCount: game.entrantCount,
                    scene: game.scene, players: game.players, score: [...game.score],
                    suddenDeath: game.suddenDeath, clock: game.clock };

    ok("goal bounds are 3..15", GOALS_MIN === 3 && GOALS_MAX === 15);

    // Drive the menu the way a player would and confirm clamping at both ends.
    const menuFrame = (code, times = 1) => {
      for (let n = 0; n < times; n++) {
        pressed[code] = true;
        edgeFrame = true;
        updateMenu(DT);
        for (const k in pressed) delete pressed[k];
        edgeFrame = true;
      }
    };
    const gotoRow = (name) => {
      const rows = menuRows();
      game.menuRow = rows.indexOf(name);
    };

    game.mode = MODE.SINGLE;
    gotoRow("goals");
    menuFrame("KeyD", 40);                       // spam right well past the max
    ok("goals clamp at the maximum", game.goalsToWin === GOALS_MAX, `${game.goalsToWin}`);
    menuFrame("KeyA", 40);                       // and left past the min
    ok("goals clamp at the minimum", game.goalsToWin === GOALS_MIN, `${game.goalsToWin}`);
    menuFrame("KeyD", 2);
    ok("goals step one at a time", game.goalsToWin === GOALS_MIN + 2, `${game.goalsToWin}`);

    // Time options, including the "no limit" end.
    gotoRow("time");
    menuFrame("KeyA", 20);
    ok("time clamps to the first option", game.timeIdx === 0 && TIME_OPTIONS[0] === 0);
    menuFrame("KeyD", 20);
    ok("time clamps to the last option", game.timeIdx === TIME_OPTIONS.length - 1);

    // Player count only clamps within tournament bounds.
    game.mode = MODE.TOURNAMENT;
    gotoRow("players");
    menuFrame("KeyD", 30);
    ok("player count clamps at the max", game.entrantCount === TOURN_MAX, `${game.entrantCount}`);
    menuFrame("KeyA", 30);
    ok("player count clamps at the min", game.entrantCount === TOURN_MIN, `${game.entrantCount}`);

    ok("clock formats as m:ss",
       fmtClock(0) === "0:00" && fmtClock(90) === "1:30" && fmtClock(125) === "2:05",
       `${fmtClock(0)} ${fmtClock(90)} ${fmtClock(125)}`);

    // The configured goal target actually ends the match.
    {
      game.mode = MODE.SINGLE;
      game.goalsToWin = 3;
      game.timeIdx = 0;                          // no time limit
      game.sel = [0, 1];
      startMatch();
      game.scene = SCENE.PLAY;
      for (let i = 0; i < 2; i++) { game.score = [i + 1, 0]; }
      game.score = [2, 0];
      scoreGoal(1);                              // 3rd goal for P1
      ok("match ends at the configured goal target",
         game.scene === SCENE.WIN && game.winner === 0, `${game.scene} w=${game.winner}`);

      // A higher target must NOT end early.
      game.goalsToWin = 10;
      startMatch();
      game.scene = SCENE.PLAY;
      game.score = [4, 0];
      scoreGoal(1);
      ok("match does not end below the target", game.scene !== SCENE.WIN, game.scene);
    }

    // Clock expiry: leader wins, and it is flagged as a time win.
    {
      game.mode = MODE.SINGLE;
      game.goalsToWin = 9;
      game.sel = [0, 1];
      startMatch();
      game.score = [2, 1];
      timeExpired();
      ok("clock expiry gives the win to the leader",
         game.scene === SCENE.WIN && game.winner === 0 && game.byTime === true);

      startMatch();
      game.score = [1, 4];
      timeExpired();
      ok("clock expiry works for either side", game.winner === 1);

      // Level single match = draw.
      startMatch();
      game.score = [2, 2];
      timeExpired();
      ok("a level single match is a draw", game.winner === -1 && game.scene === SCENE.WIN);
    }

    // The clock only runs during PLAY, and stops at zero.
    {
      game.mode = MODE.SINGLE;
      game.timeIdx = 1;                          // 60s
      game.goalsToWin = 9;
      game.sel = [0, 1];
      startMatch();
      ok("clock starts at the configured time", Math.abs(game.clock - TIME_OPTIONS[1]) < 1e-9,
         `${game.clock}`);
      const c0 = game.clock;
      step(DT);                                  // still COUNTDOWN
      ok("clock does not run during the countdown", game.clock === c0, `${game.clock}`);
      game.scene = SCENE.PLAY;
      for (let i = 0; i < 120; i++) step(DT);
      ok("clock runs during play", game.clock < c0 - 0.9, `${game.clock.toFixed(2)}`);
      ok("clock never goes negative", game.clock >= 0);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19g. Tournament: bracket shape, byes, advancement, and a full run to a champion.
  {
    const saved = { mode: game.mode, scene: game.scene, entrantCount: game.entrantCount,
                    entrants: game.entrants, roundPairs: game.roundPairs, round: game.round,
                    tieIndex: game.tieIndex, seats: [...game.seats], champion: game.champion,
                    players: game.players, score: [...game.score], goalsToWin: game.goalsToWin,
                    timeIdx: game.timeIdx, suddenDeath: game.suddenDeath };

    // Pairing is pure and handles odd counts with a trailing bye.
    ok("4 entrants make 2 pairs, no byes",
       JSON.stringify(buildPairs([0, 1, 2, 3])) === JSON.stringify([[0, 1], [2, 3]]));
    ok("3 entrants make a pair plus a bye",
       JSON.stringify(buildPairs([0, 1, 2])) === JSON.stringify([[0, 1], [2, null]]));
    ok("1 entrant is a lone bye",
       JSON.stringify(buildPairs([7])) === JSON.stringify([[7, null]]));
    ok("ties needed is n-1",
       tiesRemaining(2) === 1 && tiesRemaining(5) === 4 && tiesRemaining(8) === 7);

    // Play a whole tournament for every legal size; player 0 always wins.
    for (let n = TOURN_MIN; n <= TOURN_MAX; n++) {
      game.mode = MODE.TOURNAMENT;
      game.entrantCount = n;
      game.goalsToWin = 3;
      game.timeIdx = 0;
      startTournament();

      let tiesPlayed = 0, guard = 0, bad = null;
      while (game.scene !== SCENE.CHAMPION && guard++ < 200) {
        if (game.scene === SCENE.BRACKET) {
          if (aliveEntrants().length <= 1) beginRound();
          else nextTie();
          continue;
        }
        if (game.scene === SCENE.SELECT) {
          // Seat the tie and play it: the lower entrant id always wins.
          startMatch();
          const winSeat = game.seats[0] < game.seats[1] ? 0 : 1;
          game.score = winSeat === 0 ? [3, 0] : [0, 3];
          finishMatch(winSeat, false);
          tiesPlayed++;
          game.scene = SCENE.BRACKET;
          continue;
        }
        bad = `stuck in scene ${game.scene}`;
        break;
      }
      const champ = game.champion;
      ok(`${n}-player tournament produces exactly one champion`,
         !bad && game.scene === SCENE.CHAMPION && champ !== null &&
         aliveEntrants().length === 1,
         bad || `scene=${game.scene} alive=${aliveEntrants().length}`);
      ok(`${n}-player tournament plays exactly ${tiesRemaining(n)} ties`,
         tiesPlayed === tiesRemaining(n), `played ${tiesPlayed}`);
      ok(`${n}-player champion is the expected entrant`,
         champ && champ.id === 0, champ ? `id ${champ.id}` : "none");
    }

    // A bye must advance its entrant WITHOUT a match being played.
    {
      game.mode = MODE.TOURNAMENT;
      game.entrantCount = 3;
      startTournament();
      ok("3-player round 1 has a bye", game.roundPairs.some(p => p[1] === null));
      const byeId = game.roundPairs.find(p => p[1] === null)[0];
      nextTie();                                  // seats the real tie, skipping the bye
      ok("the bye is not seated", !game.seats.includes(byeId), `seats ${game.seats}`);
      ok("the bye entrant is still alive", entrantById(byeId).alive);
    }

    // A drawn KNOCKOUT tie must not stay drawn: it goes to sudden death, and
    // the next goal settles it.
    {
      game.mode = MODE.TOURNAMENT;
      game.entrantCount = 2;
      game.goalsToWin = 5;
      game.timeIdx = 2;
      startTournament();
      nextTie();
      startMatch();
      game.score = [2, 2];
      timeExpired();
      ok("a drawn tie goes to sudden death",
         game.suddenDeath === true && game.scene === SCENE.COUNTDOWN, game.scene);
      ok("sudden death has its own clock", game.clock > 0);

      game.scene = SCENE.PLAY;
      scoreGoal(1);                               // right goal -> P1 (seat 0)
      ok("the first sudden-death goal wins the tie",
         game.scene === SCENE.WIN && game.winner === 0, `${game.scene} w=${game.winner}`);
      ok("sudden death eliminated the loser", aliveEntrants().length === 1);
    }

    // Losing a tie eliminates exactly one entrant.
    {
      game.mode = MODE.TOURNAMENT;
      game.entrantCount = 4;
      game.goalsToWin = 3;
      game.timeIdx = 0;
      startTournament();
      nextTie();
      const before = aliveEntrants().length;
      startMatch();
      game.score = [3, 0];
      finishMatch(0, false);
      ok("one tie eliminates exactly one entrant",
         aliveEntrants().length === before - 1, `${before} -> ${aliveEntrants().length}`);
      ok("the winner survives", entrantById(game.seats[0]).alive);
      ok("the loser is out", !entrantById(game.seats[1]).alive);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19h. Moving goals: motion, bounds, and agreement with scoring.
  {
    const savedPhase = goalPhase;
    /*
      Goals are STATIC in a normal match and only slide under chaos, so this
      block enables it; 19c2 below asserts the static behaviour separately.
    */
    const savedChaosB = game.chaos;
    game.chaos = true;

    // The goals must actually move, and the two sides must drift apart.
    let loL = Infinity, hiL = -Infinity, loR = Infinity, hiR = -Infinity;
    let maxSeparation = 0;
    for (let i = 0; i < 4000; i++) {
      goalPhase = i * DT * 4;
      const a = goalTop(0), b = goalTop(1);
      loL = Math.min(loL, a); hiL = Math.max(hiL, a);
      loR = Math.min(loR, b); hiR = Math.max(hiR, b);
      maxSeparation = Math.max(maxSeparation, Math.abs(a - b));
    }
    ok("the left goal moves", hiL - loL > 60, `travel ${(hiL - loL).toFixed(0)}px`);
    ok("the right goal moves", hiR - loR > 60, `travel ${(hiR - loR).toFixed(0)}px`);
    ok("the two goals drift out of sync", maxSeparation > 40,
       `max separation ${maxSeparation.toFixed(0)}px`);
    game.chaos = savedChaosB;      // restored immediately; later cases set it themselves

    // Bounds: never off the top, never sunk into the grass, mouth always usable.
    let boundsOk = true, worst = "";
    for (let i = 0; i < 6000; i++) {
      goalPhase = i * 0.013;
      for (const side of [0, 1]) {
        const t = goalTop(side);
        if (t < 0) { boundsOk = false; worst = `top ${t.toFixed(1)} off screen`; }
        if (t > GROUND_Y - 50) { boundsOk = false; worst = `top ${t.toFixed(1)} too low`; }
        if (GROUND_Y - t < 50) { boundsOk = false; worst = `mouth only ${(GROUND_Y - t).toFixed(1)}px`; }
      }
    }
    ok("goals stay on screen with a usable mouth", boundsOk, worst);
