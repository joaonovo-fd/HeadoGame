  a.dashEdge = false;
  a.superEdge = false;
  a.kickEdge = false;
  a.aimX = 0;
  a.aimY = 0;
  // No arena means the match just ended: the bot has nothing left to decide.
  if (!A || f.dead || !foe) return;

  if (!f.ai) f.ai = { think: 0, strafe: 1 };
  const ai = f.ai;

  // Re-decide only every `react` seconds: a bot that re-evaluates every substep
  // reacts inhumanly fast and jitters between choices.
  ai.think -= dt;
  if (ai.think <= 0) {
    ai.think = lvl.react;
    if (Math.random() < 0.25) ai.strafe = -ai.strafe;
    ai.idle = Math.random() < lvl.idle;
  }

  const b = A.ball;
  const ownGoalZ = aGoalLineZ(f.seat);
  const theirGoalZ = aGoalLineZ(1 - f.seat);

  /*
    THE BOT PLAYS SOCCER, not deathmatch. It chases the ball, and once close
    enough to strike it aims at the opponent's goal rather than at the ball —
    otherwise it would dribble endlessly without ever shooting.
  */
  const ballD = b ? Math.hypot(b.x - f.x, b.z - f.z) : 1e9;
  const striking = b && ballD < FIGHTER_R + b.r + A_KICK_REACH * 1.4;

  let tx, ty, tz;
  if (striking) {
    // Aim at the goal mouth, a little above the line so the shot is not scuffed
    // into the ground.
    tx = clamp(b.x * 0.35, -A_GOAL_W / 2 + 40, A_GOAL_W / 2 - 40);
    ty = A_GOAL_H * 0.45;
    tz = theirGoalZ;
  } else if (b) {
    /*
      Approach the ball from the DEFENSIVE side, so the bot ends up behind it
      facing the right way. Aiming straight at the ball made it shepherd the ball
      into its own net whenever it was upfield of it.
    */
    const behind = Math.sign(ownGoalZ) * 1;
    tx = b.x;
    ty = b.y;
    tz = b.z + behind * (FIGHTER_R + b.r) * 1.1;
  } else {
    tx = 0; ty = 0; tz = 0;
  }

  const to = v3sub(v3(tx, ty + EYE_H * 0.4, tz), fighterEye(f));
  const dist = Math.hypot(to.x, to.z);

  /*
    AIM. Turn toward the target at a bounded rate rather than snapping: a bot
    that snaps is unbeatable and reads as cheating. `err` offsets where it thinks
    the target is, so an easy bot misses honestly rather than by being slowed.
  */
  const wantYaw = Math.atan2(to.x, to.z);
  const wantPitch = clamp(Math.atan2(to.y, Math.max(1, dist)), -PITCH_MAX, PITCH_MAX);
  let dYaw = wantYaw - f.yaw;
  while (dYaw > Math.PI) dYaw -= Math.PI * 2;
  while (dYaw < -Math.PI) dYaw += Math.PI * 2;
  const errRad = (lvl.err / 900) * Math.sin(performance.now() / 700 + f.seat);
  const turn = STICK_SENS * (0.7 + lvl.aggr) * dt;
  a.aimX = clamp(dYaw + errRad, -turn, turn);
  a.aimY = clamp(wantPitch - f.pitch, -turn, turn);

  if (ai.idle) return;                       // a beat of doing nothing

  // MOVEMENT: run at the ball. Strafe only when already on top of it, so the bot
  // does not orbit the thing it is trying to kick.
  const ballBehindMe = b && Math.sign(b.z - f.z) === Math.sign(ownGoalZ);
  if (dist > 60) a.up = true;
  if (striking && Math.abs(dYaw) > 0.5) {
    if (ai.strafe > 0) a.right = true; else a.left = true;
  }
  // Retreat to defend when the ball is behind the bot, heading for its own goal.
  if (ballBehindMe && ballD > 260) a.up = true;

  // Speed is scaled by using the movement keys only part of the time, which is
  // how the 2D CPU is throttled too — the physics stays identical for everyone.
  if (Math.random() > lvl.speed) { a.up = a.down = a.left = a.right = false; }

  // Hop occasionally, to clear a crate it has walked into.
  if (f.onGround && Math.random() < lvl.jump * dt * 1.6) a.jump = true;
  // Dash to close a long gap toward the ball.
  if (ballD > 420 && f.dashCD <= 0 && Math.random() < lvl.aggr * dt * 2) {
    a.dashEdge = true;
  }
  // Spend a superpower when it is charged; the bot has no notion of timing, but
  // a power sitting unused is worse than one spent early.
  if (superReady(f) && Math.random() < lvl.aggr * dt * 1.5) fireArenaSuper(f);

  /*
    THE BOT USES THE NEW ABILITIES, but sparingly and only where they help:
      - it throws immediately if it somehow ends up holding the ball, so a carry
        never stalls the match;
      - it grabs only when it has a clear run at goal, since carrying into
        pressure just gives the ball away;
      - it walls up when the ball is behind it, near its own goal;
      - it jets for a ball genuinely above its head.
  */
  if (isCarrying(f)) {
    // Facing goal? Throw. Otherwise turn first — the aim above is already doing
    // that, so simply waiting a beat is the right move.
    if (Math.abs(dYaw) < 0.35) releaseBall(f, true);
    return;
  }
  if (b && !f.dead) {
    const ballHigh = b.y > FIGHTER_H * 1.15;
    if (ballHigh && ballD < 200 && f.jet > 0.5 && Math.random() < lvl.aggr) {
      a.jump = true;                        // stepJetpack turns a held jump into thrust
    }
    // Grab when close, clear and pointed the right way.
    if (game.rules.grab && striking && f.grabCD <= 0 &&
        Math.abs(dYaw) < 0.3 && Math.random() < lvl.aggr * dt * 3) {
      if (grabBall(f)) return;
    }
    // Wall up defensively: the ball is between the bot and its own goal.
    const threatened = Math.abs(b.z - ownGoalZ) < Math.abs(f.z - ownGoalZ);
    if (game.rules.walls3d && threatened && ballD > 200 &&
        arenaCanBuild(f) && Math.random() < lvl.aggr * dt * 1.2) {
      arenaBuildWall(f);
    }
  }

  // KICK when the ball is in range and the bot is roughly facing its target.
  if (striking && f.kickCD <= 0 && Math.abs(dYaw) < 0.4 + (1 - lvl.aggr) * 0.3) {
    kickArenaBall(f);
    return;
  }
  /*
    Otherwise take a pot shot at the opponent, but only with a genuinely clear
    line. Shooting is now a way to disrupt whoever has the ball rather than the
    route to winning, so the bot only bothers when the opponent is closer to the
    ball than it is.
  */
  const foeCloser = b && Math.hypot(b.x - foe.x, b.z - foe.z) < ballD;
  if (foeCloser && !foe.dead && f.fireCD <= 0) {
    const toFoe = v3sub(v3(foe.x, foe.y + EYE_H, foe.z), fighterEye(f));
    let fYaw = Math.atan2(toFoe.x, toFoe.z) - f.yaw;
    while (fYaw > Math.PI) fYaw -= Math.PI * 2;
    while (fYaw < -Math.PI) fYaw += Math.PI * 2;
    const clear = !segmentHitsCover(fighterEye(f), v3(foe.x, foe.y + EYE_H, foe.z));
    if (clear && Math.abs(fYaw) < 0.12) fireShot(f);
  }
}

/**
 * One simulation step of the 3D arena.
 *
 * Mirrors the shape of the PLAY case: CPU seats fill their own intent, every
 * seat's intent then drives its fighter, world state advances, and the clock is
 * checked last so a frag scored on the final tick still counts.
 */
function stepArena3D(dt) {
  const A = game.arena;
  if (!A) return;

  for (let i = 0; i < 2; i++) {
    if (game.cpu[i]) updateArenaCPU(A.fighters[i], dt);
  }

  /*
    A goal celebration freezes play briefly: the players still animate, but the
    ball is held and nothing can be scored, so a goal reads as an event rather
    than flowing straight into the next kickoff.
  */
  if (A.celebrate > 0) {
    A.celebrate -= dt;
    for (let i = 0; i < 2; i++) stepFighter(A.fighters[i], intent[i], dt);
    updateArenaCameras();
    return;
  }

  /*
    KICK is the primary action now that this is soccer; the gun is secondary.
    Kick fires on the button EDGE so one press is one kick, and falls through to a
    shot only when the ball is out of reach — so the same button does the
    sensible thing at any distance without a second key to learn.
  */
  for (let i = 0; i < 2; i++) {
    if (game.cpu[i]) continue;
    const a = intent[i];
    const f = A.fighters[i];

    /*
      GRAB / THROW share the wall key's neighbour: the dedicated GRAB action. It
      is one button for both halves of the move — press to take the ball, press
      again to throw it — because a separate throw key would be a key you only
      need while already holding something.
    */
    if (a.grabEdge) {
      if (isCarrying(f)) releaseBall(f, true);
      else grabBall(f);
    }

    // BUILD, on the same binding the 2D game uses for walls.
    if (a.wallEdge) arenaBuildWall(f);

    /*
      KICK. Throwing takes precedence while carrying, so the kick button never
      punts a ball out of your own hands; otherwise kick the ball if it is in
      reach, and fall through to a shot when it is not.
    */
    const pressed = a.kickEdge || (mouse.fireHeld && i === arenaMouseSeat() &&
                                   f.kickCD <= 0);
    if (!pressed) continue;
    if (isCarrying(f)) { releaseBall(f, true); continue; }
    if (!kickArenaBall(f)) fireShot(f);
  }

  for (let i = 0; i < 2; i++) {
    const f = A.fighters[i];
    const a = intent[i];
    /*
      JETPACK on the jump key HELD. Tapping still jumps — stepFighter owns that —
      so the thrust only takes over once the fighter is already airborne, which
      keeps a single key doing the obvious thing at both ends.
    */
    stepJetpack(f, !!a.jump && !f.onGround, dt);
    stepFighter(f, a, dt);
    if (f.kickT > 0) f.kickT -= dt;
    if (f.kickCD > 0) f.kickCD -= dt;
    if (f.grabCD > 0) f.grabCD -= dt;
  }
  stepArenaWalls(dt);

  // Fighters must not stand inside each other, or two players can occupy the
  // same spot and neither can tell who is where.
  separateFighters(A.fighters[0], A.fighters[1]);

  /*
    A CARRIED ball is not simulated: it is held. Body contact is skipped too, or
    the carrier would be shoving the ball they are holding.
  */
  if (A.carriedBy >= 0) {
    stepCarry(dt);
  } else {
    stepArenaBall(dt);
    for (const f of A.fighters) fighterVsArenaBall(f);
  }

  stepShots(dt);
  /*
    A shot can end the match only indirectly now, but the teardown hazard is the
    same: anything after this point would be operating on state that no longer
    exists.
  */
  if (!game.arena) return;

  // GOAL. Checked after the ball has moved and before the clock, so a goal on
  // the final tick still counts.
  const conceded = arenaGoalScored(A.ball);
  if (conceded >= 0) {
    arenaGoal(conceded);
    if (!game.arena) return;
  }

  updateArenaCameras();

  if (game.matchSecs > 0 || game.suddenDeath) {
    game.clock -= dt;
    if (game.clock <= 0) { game.clock = 0; timeExpired(); }
  }
}

/**
 * Push two fighters apart if they overlap.
 *
 * Split evenly between them, so neither can shove the other around by walking
 * into them — a heavier-feeling push would need masses, and a deathmatch reads
 * better when bodies simply cannot interpenetrate.
 */
function separateFighters(a, b) {
  if (!a || !b || a.dead || b.dead) return;
  const dx = b.x - a.x, dz = b.z - a.z;
  // Vertical clearance means one is standing on the other's head: leave it.
  if (Math.abs(b.y - a.y) >= FIGHTER_H * 0.8) return;
  const d = Math.hypot(dx, dz);
  const min = FIGHTER_R * 2;
  if (d >= min) return;
  // Exactly coincident: pick an arbitrary axis rather than dividing by zero.
  const nx = d > 1e-6 ? dx / d : 1;
  const nz = d > 1e-6 ? dz / d : 0;
  const push = (min - d) / 2;
  a.x -= nx * push; a.z -= nz * push;
  b.x += nx * push; b.z += nz * push;
  arenaBounds(a);
  arenaBounds(b);
}

function step(dt) {
  /*
    A GUEST runs no simulation at all — the host owns the world and streams it.
    We still tick cosmetic timers so shake, flashes and particles animate, but
    everything authoritative arrives in a snapshot.
  */
  if (netIsGuest()) {
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt);
    if (game.gravAnnounce > 0) game.gravAnnounce = Math.max(0, game.gravAnnounce - dt);
    if (game.chaosAnnounce > 0) game.chaosAnnounce = Math.max(0, game.chaosAnnounce - dt);
    updateParticles(dt);
    /*
      Walk between the last two snapshots so the world moves every frame instead
      of only when a packet lands. Goals and built walls also animate locally —
      their motion is cosmetic and driven by a clock, so running it here costs
      nothing and stops them stuttering at the snapshot rate.
    */
    netInterpolate(dt);
    goalPhase += dt;
    netSyncGoalPhase(dt);
    for (const w of game.walls) {
      w.born = Math.min(1, w.born + dt * 6);
      if (w.life > 0) w.life -= dt;      // host still owns removal
    }
    for (const k in pressed) { /* consumed by gatherIntent */ }
    return;
  }

  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
  if (game.flash > 0) game.flash = Math.max(0, game.flash - dt);
  if (game.gravAnnounce > 0) game.gravAnnounce = Math.max(0, game.gravAnnounce - dt);
  if (game.rerollDenied > 0) game.rerollDenied = Math.max(0, game.rerollDenied - dt);
  // The superpower banner fades on its own clock, so it survives a scene change
  // (a power fired the instant before a goal should still be announced).
  if (game.superFx) {
    game.superFx.t -= dt;
    if (game.superFx.t <= 0) game.superFx = null;
  }
  // Goals slide continuously, including during countdowns and celebrations so
  // their motion never visibly stutters.
  goalPhase += dt;
  updateParticles(dt);

  switch (game.scene) {
    case SCENE.MENU:
      updateMenu(dt);
      break;

    case SCENE.ONLINE:
      updateOnline(dt);
      break;

    case SCENE.ROSTER:
      updateRoster(dt);
      break;

    case SCENE.PAUSE:
      updatePause(dt);
      break;

    case SCENE.SETTINGS:
      updateSettings(dt);
      break;

    case SCENE.BOARD:
      updateBoard(dt);
      break;

    case SCENE.CONTROLS:
      updateControls(dt);
      break;

    case SCENE.CREDITS:
      updateCredits(dt);
      break;

    case SCENE.UPGRADE:
      updateUpgrade(dt);
      break;

    case SCENE.RUNOVER:
    case SCENE.RUNWIN:
      updateRunEnd(dt);
      break;

    case SCENE.RULES:
      updateRules(dt);
      break;

    case SCENE.SELECT:
      updateSelect(dt);
      break;

    case SCENE.ARENA3D:
      stepArena3D(dt);
      break;

    case SCENE.COUNTDOWN:
      game.timer -= dt;
      // Players may position themselves; the ball is held.
      game.players[0].update(dt, game.players[1]);
      game.players[1].update(dt, game.players[0]);
      if (modeCfg().confine) {
        confineToHalf(game.players[0]);
        confineToHalf(game.players[1]);
      }
      if (game.timer <= 0) game.scene = SCENE.PLAY;
      break;

    case SCENE.PLAY: {
      const cfgP = modeCfg();
      const volley = game.mode === MODE.VOLLEY;
      const netMode = hasNet();       // volleyball AND tennis
      const tennis = game.mode === MODE.TENNIS;
      const basket = game.mode === MODE.BASKET;

      // CPU seats write their own intent; local and remote seats are already
      // filled in by gatherIntent / the network before step() runs.
      for (let i = 0; i < 2; i++) {
        if (game.cpu[i]) updateCPU(game.players[i], dt);
      }

      // Wall building, for any seat that asked for it this substep.
      for (let i = 0; i < 2; i++) {
        if (intent[i].wallEdge) buildWall(game.players[i]);
      }

      for (let i = 0; i < 2; i++) {
        if (game.cpu[i]) continue;          // the AI calls these itself
        const a = intent[i];
        // Kick doubles as fire when armed: the pistol takes priority so picking
        // one up changes what the button does, with no extra key to learn.
        if (a.kickEdge && game.players[i].ammo > 0) game.players[i].tryFire();
        else if (a.kick) game.players[i].tryStartKick();
      }

      game.players[0].update(dt, game.players[1]);
      game.players[1].update(dt, game.players[0]);

      const ballPrevY = game.ball.y;    // for the basket ring-crossing test
      stepBall(dt);
      if (netMode) ballVsNet(game.ball);
      if (basket) ballVsHoops(game.ball);
      // A swinging leg damages a wall it connects with.
      kickVsWalls(game.players[0]);
      kickVsWalls(game.players[1]);

      ballVsPlatforms(game.ball);
      ballVsWalls(game.ball);
      playerVsPlatforms(game.players[0]);
      playerVsPlatforms(game.players[1]);
      playerVsWalls(game.players[0]);
      playerVsWalls(game.players[1]);
      updateWalls(dt);
      ballVsPlayer(game.players[0]);
      ballVsPlayer(game.players[1]);
      updatePowerups(dt);
      updateMines(dt);
      updateHelpers(dt);
      updateBullets(dt);

      /*
        Confine AFTER every force is applied. Ball knockback, mine blasts and
        bullets all move players, so confining earlier let a shove push someone
        through the net.
      */
      if (cfgP.confine) { confineToHalf(game.players[0]); confineToHalf(game.players[1]); }

      // Goal-resize power-up timer (world effect, not per-player).
      if (game.goalFxT > 0) {
        game.goalFxT -= dt;
        if (game.goalFxT <= 0) { game.goalFxT = 0; game.goalFx = null; goalScale = 1; }
      }

      // Chaos: re-roll every tunable on a timer.
      if (game.chaos) {
        game.chaosT -= dt;
        if (game.chaosT <= 0) { game.chaosT = chaosInterval(); rollChaos(); }
      }

      if (game.volleyT > 0) game.volleyT -= dt;

      if (volley) {
        // A ball touching the ground concedes to the other side.
        const p = volleyGround(game.ball);
        if (p !== 0 && game.volleyT <= 0) {
          game.volleyT = VOLLEY_SETTLE;
          scoreVolleyPoint(p - 1);
          break;
        }
      } else if (tennis) {
        // One bounce per side is legal; a second on the same side concedes.
        tennisTrackCrossing(game.ball);
        const p = tennisGround(game.ball);
        if (p !== 0 && game.volleyT <= 0) {
          game.volleyT = VOLLEY_SETTLE;
          scoreVolleyPoint(p - 1);
          break;
        }
      } else if (basket) {
        const p = basketScored(game.ball, ballPrevY);
        if (p !== 0 && game.volleyT <= 0) {
          game.volleyT = VOLLEY_SETTLE;
          scoreVolleyPoint(p - 1);
          break;
        }
      } else {
        const side = goalScored(game.ball);
        if (side !== 0) { scoreGoal(side); break; }
      }

      // Match clock. Only runs during live play, so celebrations and
      // countdowns don't eat into it.
      if (game.matchSecs > 0 || game.suddenDeath) {
        game.clock -= dt;
        if (game.clock <= 0) { game.clock = 0; timeExpired(); }
      }
      break;
    }

    case SCENE.CELEBRATE:
      releaseCPUKeys();
      /*
        Superpower timers keep running through a celebration. Nothing else here
        touches the players, so a power fired just before a goal used to FREEZE
        for the whole 1.8s celebration and then resume — visibly longer than its
        stated duration, and long enough to still be live at the next kickoff.
        Ticked directly rather than through update(), because the players must not
        move or accept input while the goal is being celebrated.
      */
      for (const pl of game.players) {
        if (!pl || pl.superT <= 0) continue;
        pl.superT = Math.max(0, pl.superT - dt);
        if (pl.superT === 0) endSuper(pl);
      }
      game.timer -= dt;
      if (game.timer <= 0) kickoff(game.lastScorer === 0 ? -1 : 1);
      break;

    case SCENE.WIN:
      if (kickHit(0) || kickHit(1) || hit("Space") || hit("Enter")) {
        if (game.mode === MODE.TOURNAMENT) {
          // Back to the bracket, which then seats the next tie or ends the round.
          game.scene = SCENE.BRACKET;
        } else {
          game.scene = SCENE.MENU;
          game.locked = [false, false];
        }
      }
      break;

    case SCENE.BRACKET:
      // R re-rolls the draw, but only before the first tie has been played.
      if (hit("KeyR")) { if (!rerollDraw()) game.rerollDenied = 1.2; break; }
      if (kickHit(0) || kickHit(1) || hit("Space") || hit("Enter")) {
        if (aliveEntrants().length <= 1) beginRound();   // resolves to CHAMPION
        else nextTie();
      }
      break;

    case SCENE.CHAMPION:
      if (kickHit(0) || kickHit(1) || hit("Space") || hit("Enter")) {
        game.scene = SCENE.MENU;
        game.locked = [false, false];
      }
      break;
  }

  /*
    ESC opens the pause overlay from a live match. `escUsed` guards against
    double-handling: the scene switch above runs first, so an ESC that CLOSED
    the overlay would otherwise be seen again here — with the scene already back
    in PLAY — and immediately reopen it, making ESC look dead.
  */
  if (hit("Escape") && !escUsed && PAUSABLE.has(game.scene)) openPause();
  escUsed = false;

}

let acc = 0, last = performance.now();

function frame(now) {
  const raw = (now - last) / 1000;
  last = now;
  acc += clamp(raw, 0, MAX_FRAME);

  // Edge triggers are visible only to the first substep, so one keypress is
  // one action regardless of how many substeps this frame runs.
  let guard = 0;
  edgeFrame = true;
  while (acc >= DT && guard++ < 240) {
    // Translate whatever drives each seat into intent before simulating. Only
    // the first substep sees the keypress edge, so one press is one kick.
    gatherIntent(edgeFrame);
    netPump();
    step(DT);
    acc -= DT;
    edgeFrame = false;
  }
  if (guard === 0) { gatherIntent(true); netPump(); step(0); }

  for (const k in pressed) delete pressed[k];
  /*
    Keys synthesised by a tap are released here, after the update that consumed
    them. Without this a tapped key would stay logically held for ever, which
    reads as the game having jammed.
  */
  for (const k of tapKeys) keys[k] = false;
  tapKeys.length = 0;
  edgeFrame = true;

  // Music: pick the track for the current scene and keep the scheduler fed.
  if (game.opt.music) musicPlay(musicTrackForScene()); else musicStop();
  musicPump();

  draw();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------ 10. RENDER */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

function fitCanvas() {
  /*
    On a phone every pixel counts, so the desktop padding and the room left for
    the hint line below the canvas are both dropped — the hint is hidden by the
    stylesheet at the same breakpoint.
  */
  const tight = innerWidth <= 820 || isTouchDevice();
  const pad = tight ? 0 : 28;
  const chrome = tight ? 0 : 24;
  const s = Math.min((innerWidth - pad) / W, (innerHeight - pad - chrome) / H);
  cv.style.width = Math.floor(W * s) + "px";
  cv.style.height = Math.floor(H * s) + "px";
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.floor(W * dpr);
  cv.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fitCanvas);
/*
  Rotating a phone fires orientationchange BEFORE the new dimensions are readable,
  so the refit is deferred a frame — without the delay the canvas is laid out to
  the old orientation and stays that way until something else resizes it.
*/
addEventListener("orientationchange", () => setTimeout(fitCanvas, 120));

/* ---- mouse and touch -----------------------------------------------------

   Registered once. A tap on a menu is resolved against the click regions the
   last draw pass registered; a tap during 3D play is handled by the pointer-lock
   listeners below instead.
*/

/** Live touches, by identifier, in logical canvas coordinates. */
const touchPoints = new Map();

/** Is this a touch device? Decides whether on-screen controls are drawn. */
const isTouchDevice = () => {
  try {
    return (typeof navigator !== "undefined" && navigator.maxTouchPoints > 0) ||
           (typeof window !== "undefined" && "ontouchstart" in window);
  } catch (e) { return false; }
};

cv.addEventListener("pointermove", (e) => {
  const p = toLogical(e.clientX, e.clientY);
  pointer.x = p.x;
  pointer.y = p.y;
  pointer.inside = true;
  // Remembered so the renderer can highlight what is under the cursor, which is
  // the only affordance telling a mouse user that anything here is clickable.
  const r = regionAt(p.x, p.y);
  pointer.hover = r ? r.act : null;
  try { cv.style.cursor = r ? "pointer" : "default"; } catch (err) { /* no style */ }
});

cv.addEventListener("pointerleave", () => {
  pointer.inside = false;
  pointer.hover = null;
});

cv.addEventListener("pointerdown", (e) => {
  const p = toLogical(e.clientX, e.clientY);
  pointer.x = p.x;
  pointer.y = p.y;
  pointer.down = true;
  /*
    The 3D arena owns its own pointer handling — a click there fires and captures
    the mouse — so menu regions are only consulted outside it. The touch pads are
    an exception: they are regions, and they must work during 3D play.
  */
  if (pointerActivate(p.x, p.y)) {
    e.preventDefault();
    return;
  }
});

addEventListener("pointerup", () => { pointer.down = false; });

/*
  Touch. preventDefault on the canvas stops a tap being turned into a scroll, a
  double-tap zoom or a 300ms-delayed click — all three make a game unplayable on
  a phone. Registered non-passive precisely so preventDefault is allowed.
*/
cv.addEventListener("touchstart", (e) => {
  if (!e.touches || !e.touches.length) return;
  for (const t of e.touches) {
    const p = toLogical(t.clientX, t.clientY);
    touchPoints.set(t.identifier, { x: p.x, y: p.y, sx: p.x, sy: p.y });
    pointerActivate(p.x, p.y);
  }
  e.preventDefault();
}, { passive: false });

cv.addEventListener("touchmove", (e) => {
  for (const t of e.changedTouches) {
    const rec = touchPoints.get(t.identifier);
    if (!rec) continue;
    const p = toLogical(t.clientX, t.clientY);
    rec.x = p.x;
    rec.y = p.y;
  }
  e.preventDefault();
}, { passive: false });

const endTouch = (e) => {
  for (const t of e.changedTouches) touchPoints.delete(t.identifier);
  // A lifted finger must release whatever it was holding, or a held control
  // sticks down for the rest of the match.
  e.preventDefault();
};
cv.addEventListener("touchend", endTouch, { passive: false });
cv.addEventListener("touchcancel", endTouch, { passive: false });

/* ---- pointer lock listeners ----------------------------------------------

   Registered once, and deliberately inert outside the 3D arena: a listener that
   grabbed the mouse on any canvas click would break the 2D game's menus.
*/

cv.addEventListener("mousedown", (e) => {
  if (!isArena3D()) return;
  // Left click fires; it also acquires the lock the first time, since a browser
  // only grants pointer lock inside a user gesture.
  if (!mouse.locked) requestArenaLock();
  if (e.button === 0) mouse.fireHeld = true;
});

addEventListener("mouseup", (e) => {
  if (e.button === 0) mouse.fireHeld = false;
});

addEventListener("mousemove", (e) => {
  if (!mouse.locked || !isArena3D()) return;
  // Accumulated raw and drained once per frame by gatherIntent, so sensitivity
  // never depends on how many mousemove events a frame happens to receive.
  mouse.dx += e.movementX || 0;
  mouse.dy += e.movementY || 0;
});

document.addEventListener("pointerlockchange", () => {
  mouse.locked = document.pointerLockElement === cv;
  if (!mouse.locked) {
    // Escaping the lock (the player pressed ESC, or the browser dropped it)
    // must not leave a half-consumed movement to be applied on return.
    mouse.dx = 0;
    mouse.dy = 0;
    /*
      The browser's own ESC handling releases the lock WITHOUT sending a keydown
      the game can see. Treating that release as a pause is what stops the mode
      appearing to swallow ESC: the player presses it once and gets the pause
      overlay, exactly as in every other mode.
    */
    if (isArena3D() && mouse.wantLock) {
      mouse.wantLock = false;
      openPause();
    }
  }
});

document.addEventListener("pointerlockerror", () => {
  // Refused. The mode stays playable on the aim keys, so this is not fatal.
  mouse.locked = false;
  mouse.wantLock = false;
});

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, align = "center", weight = 800) {
  if (textProbe.on) textProbe.lines.push({ s: String(str), x, y, size, color });
  ctx.font = `${weight} ${size}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

/**
 * Run a draw function and return every string it actually painted, with where.
 * Screens have shipped with a row that silently never painted, so a test that
 * only checks "it did not throw" is not enough — this reads the real output.
 */
function capturePaint(fn) {
  textProbe.on = true;
  textProbe.lines = [];
  try { fn(); } finally { textProbe.on = false; }
  const lines = textProbe.lines;
  textProbe.lines = [];
  return { lines, strings: lines.map((l) => l.s) };
}

function drawPitch() {
  const A = arena();
  const gh = H - GROUND_Y;              // depth of the ground strip

  // ---- sky / hall -------------------------------------------------------
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, A.sky[0]);
  sky.addColorStop(1, A.sky[1]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // ---- venue dressing ---------------------------------------------------
  if (A.surface === "sand") {
    // Beach: low sun, sea band and a couple of palms. No crowd.
    const sun = ctx.createRadialGradient(W * 0.74, 250, 10, W * 0.74, 250, 210);
    sun.addColorStop(0, "rgba(255,236,180,0.95)");
    sun.addColorStop(0.35, "rgba(255,186,110,0.45)");
    sun.addColorStop(1, "rgba(255,150,90,0)");
    ctx.fillStyle = sun;
    ctx.fillRect(0, 60, W, GROUND_Y - 60);
    ctx.fillStyle = "#f6c98a";
    ctx.beginPath();
    ctx.arc(W * 0.74, 250, 44, 0, Math.PI * 2);
    ctx.fill();

    // Sea, with a few glints.
    ctx.fillStyle = "#1d6f86";
    ctx.fillRect(0, GROUND_Y - 74, W, 74);
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    for (let i = 0; i < 26; i++) {
      const x = (i * 173) % W;
      const y = GROUND_Y - 66 + ((i * 29) % 58);
      ctx.fillRect(x, y, 26, 2);
    }
    // Foam line where sea meets sand.
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillRect(0, GROUND_Y - 6, W, 5);

    // Palms at both edges, out of the play area.
    for (const [px, flip] of [[52, 1], [W - 52, -1]]) {
      ctx.strokeStyle = "#6b4a2a";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(px, GROUND_Y - 10);
      ctx.quadraticCurveTo(px + flip * 14, GROUND_Y - 110, px + flip * 6, GROUND_Y - 178);
      ctx.stroke();
      ctx.fillStyle = "#1f7a4d";
      for (let k = -2; k <= 2; k++) {
        ctx.beginPath();
        ctx.ellipse(px + flip * 6, GROUND_Y - 178, 46, 11, k * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (A.surface === "wood") {
    // Indoor hall: rafters and hanging lamps.
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 6;
    for (let y = 26; y < 120; y += 34) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    for (const lx of [W * 0.25, W * 0.5, W * 0.75]) {
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, 52);
      ctx.stroke();
      const lamp = ctx.createRadialGradient(lx, 62, 4, lx, 62, 120);
      lamp.addColorStop(0, "rgba(255,244,214,0.5)");
      lamp.addColorStop(1, "rgba(255,244,214,0)");
      ctx.fillStyle = lamp;
      ctx.fillRect(lx - 120, 40, 240, 200);
      ctx.fillStyle = "#fdf3d0";
      roundRect(lx - 26, 52, 52, 13, 5);
      ctx.fill();
    }
  } else if (A.surface === "clay") {
    // Floodlight pylons either side.
    for (const px of [110, W - 110]) {
      ctx.strokeStyle = "rgba(226,232,240,0.16)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(px, GROUND_Y - 120);
      ctx.lineTo(px, 56);
      ctx.stroke();
      const beam = ctx.createRadialGradient(px, 52, 6, px, 52, 190);
      beam.addColorStop(0, "rgba(224,255,255,0.34)");
      beam.addColorStop(1, "rgba(224,255,255,0)");
      ctx.fillStyle = beam;
      ctx.fillRect(px - 190, 20, 380, 300);
      ctx.fillStyle = "#e2e8f0";
      roundRect(px - 30, 40, 60, 16, 4);
      ctx.fill();
    }
  }

  // ---- crowd ------------------------------------------------------------
  if (A.crowd) {
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 90; i++) {
      const x = (i * 137.5) % W, y = 20 + ((i * 71) % 90);
      ctx.fillStyle = i % 3 === 0 ? A.crowd[0] : A.crowd[1];
      ctx.fillRect(x, y, 6, 5);
    }
    ctx.globalAlpha = 1;
  }

  // ---- the ground -------------------------------------------------------
  ctx.fillStyle = A.ground;
  ctx.fillRect(0, GROUND_Y, W, gh);

  if (A.surface === "pitch") {
    // Mow stripes.
    ctx.fillStyle = A.stripe;
    for (let x = 0; x < W; x += 80) ctx.fillRect(x, GROUND_Y, 40, gh);
  } else if (A.surface === "sand") {
    // Ripples, plus a darker damp band nearest the sea.
    ctx.fillStyle = "rgba(150,105,60,0.18)";
    ctx.fillRect(0, GROUND_Y, W, 8);
    ctx.strokeStyle = A.stripe;
    ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      const y = GROUND_Y + 10 + i * 9;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 40) {
        ctx.lineTo(x, y + Math.sin((x + i * 37) * 0.02) * 3);
      }
      ctx.stroke();
    }
  } else if (A.surface === "clay") {
    // Brushed clay: fine horizontal grain.
    ctx.strokeStyle = "rgba(0,0,0,0.07)";
    ctx.lineWidth = 1;
    for (let y = GROUND_Y + 4; y < H; y += 5) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  } else if (A.surface === "wood") {
    // Hardwood planks with seams and a varnish sheen.
    ctx.strokeStyle = "rgba(0,0,0,0.16)";
    ctx.lineWidth = 1.5;
    for (let y = GROUND_Y + 9; y < H; y += 11) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    for (let i = 0; i < 14; i++) {
      const x = (i * 137) % W;
      ctx.fillStyle = "rgba(0,0,0,0.10)";
      ctx.fillRect(x, GROUND_Y, 1.5, gh);
    }
    const sheen = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    sheen.addColorStop(0, "rgba(255,240,200,0.16)");
    sheen.addColorStop(1, "rgba(255,240,200,0)");
    ctx.fillStyle = sheen;
    ctx.fillRect(0, GROUND_Y, W, gh);
  }

  // ---- sponsor hoardings ------------------------------------------------
  /*
    A band of advertising boards along the back of the pitch. Drawn before the
    markings so players, ball and lines all sit in front of them.
  */
  {
    const hh = 26, hy = GROUND_Y - hh - 2;
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.fillRect(WALL, hy, W - WALL * 2, hh);
    drawSponsorStrip(WALL + 4, hy + 2, W - WALL * 2 - 8, hh - 4,
                     { dark: false, gap: 6, placeholders: 4 });
  }

  // ---- court markings ---------------------------------------------------
  ctx.strokeStyle = A.line;
  ctx.lineWidth = A.surface === "pitch" ? 3 : 2.5;

  if (A.surface === "pitch") {
    // Halfway line and centre circle.
    ctx.beginPath();
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, GROUND_Y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(W / 2, GROUND_Y, 90, Math.PI, 0);
    ctx.stroke();
  } else if (A.surface === "clay") {
    // Tennis: service boxes and tramlines, drawn in perspective on the strip.
    for (const inset of [26, 62]) {
      ctx.beginPath();
      ctx.moveTo(inset, GROUND_Y + 2);
      ctx.lineTo(W - inset, GROUND_Y + 2);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(WALL, H - 6); ctx.lineTo(W - WALL, H - 6);
    ctx.stroke();
    // Service line and the centre mark.
    ctx.beginPath();
    ctx.moveTo(W * 0.22, GROUND_Y + 30); ctx.lineTo(W * 0.78, GROUND_Y + 30);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W / 2, GROUND_Y + 30); ctx.lineTo(W / 2, H - 6);
    ctx.stroke();
  } else if (A.surface === "sand") {
    // Beach court: a simple boundary rope.
    ctx.setLineDash([9, 7]);
    ctx.beginPath();
    ctx.moveTo(WALL + 18, GROUND_Y + 6); ctx.lineTo(W - WALL - 18, GROUND_Y + 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(WALL + 18, H - 8); ctx.lineTo(W - WALL - 18, H - 8);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(W / 2, GROUND_Y + 6); ctx.lineTo(W / 2, H - 8);
    ctx.stroke();
  } else if (A.surface === "wood") {
    // Basketball: centre line, centre circle and a key under each hoop.
    ctx.beginPath();
    ctx.moveTo(W / 2, GROUND_Y); ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(W / 2, GROUND_Y + gh / 2, 30, 0, Math.PI * 2);
    ctx.stroke();
    for (const side of [0, 1]) {
      const hx = side === 0 ? WALL + HOOP_X : W - WALL - HOOP_X;
      ctx.beginPath();
      ctx.arc(hx, GROUND_Y + gh / 2, 46, side === 0 ? -Math.PI / 2 : Math.PI / 2,
              side === 0 ? Math.PI / 2 : Math.PI * 1.5);
      ctx.stroke();
    }
  }

  // Walls, tinted to suit the venue rather than always being dark navy.
  const wallCol = A.surface === "sand" ? "#8a5f36"
                : A.surface === "clay" ? "#123039"
                : A.surface === "wood" ? "#191026"
                : "#0a1421";

  if (modeCfg().goals) {
    ctx.fillStyle = wallCol;
    ctx.fillRect(0, 0, WALL, goalTop(0));
    ctx.fillRect(W - WALL, 0, WALL, goalTop(1));
  }

  if (!modeCfg().goals) {
    // No goals in this mode — the side walls are solid all the way down.
    ctx.fillStyle = wallCol;
    ctx.fillRect(0, 0, WALL, GROUND_Y);
    ctx.fillRect(W - WALL, 0, WALL, GROUND_Y);
  } else {
    drawGoal(0);
    drawGoal(1);
  }
}

function drawGoal(side) {
  const left = side === 0;
  const xOuter = left ? WALL - GOAL_D : W - WALL + GOAL_D;
  const xInner = left ? WALL : W - WALL;
  const GT = goalTop(side);          // live position — the goals slide
  const GB = goalBottom(side);       // lower edge of the frame (may be the grass)
  const GH = GB - GT;                // drawn mouth height, matching the collider

  // Net.
  ctx.save();
  ctx.beginPath();
  ctx.rect(Math.min(xOuter, xInner), GT, GOAL_D, GH);
  ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  ctx.fillRect(Math.min(xOuter, xInner), GT, GOAL_D, GH);
  ctx.strokeStyle = "rgba(255,255,255,0.30)";
  ctx.lineWidth = 1;
  for (let i = -GH; i < GOAL_D + GH; i += 11) {
    ctx.beginPath();
    ctx.moveTo(Math.min(xOuter, xInner) + i, GT);
    ctx.lineTo(Math.min(xOuter, xInner) + i + GH, GT + GH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(Math.min(xOuter, xInner) + i + GH, GT);
    ctx.lineTo(Math.min(xOuter, xInner) + i, GT + GH);
    ctx.stroke();
  }
  ctx.restore();

  // Frame + crossbar knob.
  ctx.strokeStyle = "#f2f6ff";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(xOuter, GB);
  ctx.lineTo(xOuter, GT);
  ctx.lineTo(xInner, GT);
  ctx.stroke();

  // Ground line of the mouth, so a raised goal reads as hanging in the air
  // rather than looking like it still reaches the grass.
  if (GB < GROUND_Y - 1) {
    ctx.beginPath();
    ctx.moveTo(xOuter, GB);
    ctx.lineTo(xInner, GB);
    ctx.stroke();
  }

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(left ? WALL + POST_R : W - WALL - POST_R, GT, POST_R, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer(pl) {
  const t = pl.team;
  const stunned = pl.stun > 0;

  /*
    A running superpower gets an aura in its own colour, drawn UNDER the player so
    it reads as a glow rather than a mask. Without this the powers with no obvious
    silhouette change — venom, cannon, titan — were invisible to both players.
  */
  if (pl.superT > 0) {
    const def = superDef(pl);
    if (def) {
      const puls = 0.72 + Math.sin(performance.now() / 90) * 0.28;
      const rr = pl.r * (1.5 + puls * 0.25);
      const g = ctx.createRadialGradient(pl.x, pl.y, pl.r * 0.6, pl.x, pl.y, rr);
      g.addColorStop(0, def.color);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 0.5 * puls;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(pl.x, pl.y, rr, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  // A dash leaves a brief motion streak behind it, so the burst is legible.
  if (pl.dashT > 0) {
    ctx.globalAlpha = clamp(pl.dashT / DASH_T, 0, 1) * 0.45;
    ctx.fillStyle = t.accent;
    for (let i = 1; i <= 3; i++) {
      const bx = pl.x - pl.facing * i * pl.r * 0.55;
      ctx.beginPath();
      ctx.arc(bx, pl.y, pl.r * (1 - i * 0.18), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.save();
  if (stunned) {
    // Wobble while dazed so the loss of control is unmistakable.
    ctx.translate(pl.x, pl.y);
    ctx.rotate(Math.sin(performance.now() / 45) * 0.16);
    ctx.translate(-pl.x, -pl.y);
  }

  // Leg.
  const tip = pl.legTip;
  ctx.strokeStyle = t.accent;
  ctx.lineWidth = Math.max(7, pl.r * 0.3);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(pl.x, pl.y + pl.r * 0.35);
  ctx.lineTo(tip.x, tip.y);
  ctx.stroke();
  ctx.fillStyle = t.accent;
  ctx.beginPath();
  ctx.arc(tip.x, tip.y, LEG_R * 0.85, 0, Math.PI * 2);
  ctx.fill();

  // Shadow.
  const h = clamp((GROUND_Y - (pl.y + pl.r)) / 300, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.32 * (1 - h)})`;
  ctx.beginPath();
  ctx.ellipse(pl.x, GROUND_Y + 3, pl.r * (1 - h * 0.35), pl.r * 0.24, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body.
  const g = ctx.createRadialGradient(pl.x - pl.r * 0.35, pl.y - pl.r * 0.45, pl.r * 0.2, pl.x, pl.y, pl.r);
  g.addColorStop(0, t.accent);
  g.addColorStop(1, t.color);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(pl.x, pl.y, pl.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.stroke();

  // Face and hat, both reacting to what is happening to this player.
  drawFace(pl.x, pl.y, pl.r, pl.facing, lookOf(pl).face, faceMood(pl), t);
  drawHat(pl.x, pl.y, pl.r, pl.facing, lookOf(pl).hat, t);

  // Power-up aura.
  const fx = Object.keys(pl.effects);
  if (fx.length) {
    ctx.lineWidth = 3;
    ctx.strokeStyle = POWERUPS[fx[0]].color;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.arc(pl.x, pl.y, pl.r + 7 + Math.sin(performance.now() / 120) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // Dazed stars, drawn unrotated above the head.
  if (stunned) {
    const n = 3;
    for (let i = 0; i < n; i++) {
      const a = performance.now() / 260 + (i * Math.PI * 2) / n;
      const sx = pl.x + Math.cos(a) * (pl.r * 0.75);
      const sy = pl.y - pl.r - 12 + Math.sin(a) * 4;
      ctx.fillStyle = "#fde047";
      ctx.globalAlpha = 0.85;
      text("✦", sx, sy, 15, "#fde047", "center", 900);
      ctx.globalAlpha = 1;
    }
  }
}

function drawBall() {
  const b = game.ball;
  const h = clamp((GROUND_Y - (b.y + b.r)) / 300, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.3 * (1 - h)})`;
  ctx.beginPath();
  ctx.ellipse(b.x, GROUND_Y + 3, b.r * (1 - h * 0.3), b.r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  // Jetpack: glowing halo + thruster flames so the weightlessness is legible.
  if (game.jetpack > 0) {
    const jc = POWERUPS.jetpack.color;
    const fading = game.jetpack < 1.5 && Math.floor(game.jetpack * 6) % 2 === 0;
    ctx.globalAlpha = fading ? 0.45 : 1;
    ctx.shadowColor = jc;
    ctx.shadowBlur = 22;
    ctx.strokeStyle = jc;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 6 + Math.sin(performance.now() / 90) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Thruster plume beneath.
    for (let i = 0; i < 3; i++) {
      const fl = 8 + Math.random() * 10;
      ctx.fillStyle = i === 0 ? "#fff7ed" : jc;
      ctx.beginPath();
      ctx.ellipse(b.x + (i - 1) * 5, b.y + b.r + fl * 0.4, 2.6, fl * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = "#fdfdfd";
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#243244";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Rolling pentagon marks — angle derived from travelled distance.
  const rot = (b.x / b.r) * 0.9;
  ctx.fillStyle = "#243244";
  for (let i = 0; i < 5; i++) {
    const a = rot + (i * Math.PI * 2) / 5;
    ctx.beginPath();
    ctx.arc(b.x + Math.cos(a) * b.r * 0.5, b.y + Math.sin(a) * b.r * 0.5, b.r * 0.19, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMines() {
  for (const m of game.mines) {
    const arming = m.arm > 0;
    const blink = arming && Math.floor(m.arm * 10) % 2 === 0;
    const fading = !arming && m.life < 3 && Math.floor(m.life * 6) % 2 === 0;
    ctx.globalAlpha = blink ? 0.3 : fading ? 0.35 : 1;

    ctx.save();
    ctx.translate(m.x, m.y);

    // Shadow on the grass.
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(0, MINE_R * 0.85, MINE_R * 0.9, MINE_R * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Spikes.
    const pulse = 1 + Math.sin(m.pulse) * 0.08;
    ctx.strokeStyle = arming ? "#94a3b8" : "#ff6b35";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI * 2) / 8 + m.pulse * 0.15;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * MINE_R * 0.55, Math.sin(a) * MINE_R * 0.55);
      ctx.lineTo(Math.cos(a) * MINE_R * 1.25 * pulse, Math.sin(a) * MINE_R * 1.25 * pulse);
      ctx.stroke();
    }

    // Body.
    ctx.shadowColor = arming ? "transparent" : "#ff6b35";
    ctx.shadowBlur = arming ? 0 : 14;
    ctx.fillStyle = arming ? "#475569" : "#2b1a12";
    ctx.beginPath();
    ctx.arc(0, 0, MINE_R * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = arming ? "#94a3b8" : "#ff8a3d";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Core light.
    ctx.fillStyle = arming ? "#94a3b8" : `rgba(255,209,102,${0.55 + Math.sin(m.pulse * 2) * 0.35})`;
    ctx.beginPath();
    ctx.arc(0, 0, MINE_R * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawHelpers() {
  for (const h of game.helpers) {
    const team = game.players[h.owner] ? game.players[h.owner].team : TEAMS[0];
    const def = POWERUPS[h.kind];
    const expiring = h.life < 2 && Math.floor(h.life * 6) % 2 === 0;
    ctx.globalAlpha = expiring ? 0.4 : 1;

    // Shadow.
    const hh = clamp((GROUND_Y - (h.y + h.r)) / 300, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.3 * (1 - hh)})`;
    ctx.beginPath();
    ctx.ellipse(h.x, GROUND_Y + 3, h.r * 0.9, h.r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body in the owner's colours, ringed in the power-up's colour so you can
    // tell whose helper it is and which kind at a glance.
    const g = ctx.createRadialGradient(h.x - h.r * 0.3, h.y - h.r * 0.4, h.r * 0.2, h.x, h.y, h.r);
    g.addColorStop(0, team.accent);
    g.addColorStop(1, team.color);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 3;
    ctx.stroke();

    text(def.glyph, h.x, h.y + 1, 15, "#ffffff", "center", 900);

    // Duration ring: shrinking arc above the helper.
    const frac = clamp(h.life / def.dur, 0, 1);
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r + 5, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 1;
  }
}

function drawBullets() {
  for (const u of game.bullets) {
    const team = game.players[u.owner] ? game.players[u.owner].team : TEAMS[0];
    // Tracer streak behind the round.
    const dir = Math.sign(u.vx) || 1;
    const grd = ctx.createLinearGradient(u.x - dir * 26, u.y, u.x, u.y);
    grd.addColorStop(0, "rgba(255,255,255,0)");
    grd.addColorStop(1, team.accent);
    ctx.strokeStyle = grd;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(u.x - dir * 26, u.y);
    ctx.lineTo(u.x, u.y);
    ctx.stroke();

    ctx.shadowColor = "#fde68a";
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#fff7ed";
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawHoops() {
  for (const side of [0, 1]) {
    const h = hoopPos(side);
    const bx = side === 0 ? WALL + 4 : W - WALL - 4;

    // Backboard.
    ctx.fillStyle = "rgba(226,232,240,0.22)";
    ctx.fillRect(side === 0 ? bx : bx - BOARD_W, h.y - BOARD_H * 0.65, BOARD_W, BOARD_H);
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 2;
    ctx.strokeRect(side === 0 ? bx : bx - BOARD_W, h.y - BOARD_H * 0.65, BOARD_W, BOARD_H);

    // Ring, drawn as a flattened ellipse so it reads as a hoop in profile.
    ctx.strokeStyle = "#f97316";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(h.x, h.y, HOOP_R, 6, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Rims as solid nubs (these are what the ball actually collides with).
    ctx.fillStyle = "#fb923c";
    for (const dx of [-HOOP_R, HOOP_R]) {
      ctx.beginPath();
      ctx.arc(h.x + dx, h.y, RIM_R, 0, Math.PI * 2);
      ctx.fill();
    }

    // Netting.
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 6; i++) {
      const t = i / 6;
      const xTop = h.x - HOOP_R + t * HOOP_R * 2;
      ctx.beginPath();
      ctx.moveTo(xTop, h.y);
      ctx.lineTo(h.x - HOOP_R * 0.42 + t * HOOP_R * 0.84, h.y + 34);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.ellipse(h.x, h.y + 34, HOOP_R * 0.44, 4, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/**
 * The appearance in force at a seat: a tournament entrant's own look if they
 * carry one, otherwise the seat's saved look. Ids are normalised here, so
 * nothing downstream — including looks arriving off the wire — can pass an
 * unknown face or hat through to the renderer.
 */
function lookForSeat(i) {
  const ov = game.mode === MODE.TOURNAMENT ? game.lookOverride[i] : null;
  const l = ov || game.looks[i] || LOOK_DEFAULTS[i] || LOOK_DEFAULTS[0];
  return { face: faceById(l.face).id, hat: hatById(l.hat).id };
}

/** The appearance for a player's seat, falling back to the defaults. */
function lookOf(pl) {
  return lookForSeat(pl.index);
}

/**
 * Draw a face inside a head of radius `r`. Everything is expressed as a
 * fraction of `r`, so a face survives the Bigger/Smaller power-ups and the
 * chaos size roll unchanged.
 *
 * `mood` comes from faceMood() and shapes eyes and mouth; `faceId` picks the
 * overall style.
 */
function drawFace(x, y, r, facing, faceId, mood, team) {
  drawProbe.faces++;
  const ink = "#101828";
  const eyeY = y - r * 0.16;
  const eyeDX = r * 0.30;
  const baseR = Math.max(2.6, r * 0.17);
  const look = facing * baseR * 0.34;      // pupils glance where you face
  const mouthY = y + r * 0.34;

  // --- eyes -------------------------------------------------------------
  const drawEye = (cx, open, style) => {
    if (style === "closed" || open <= 0.05) {
      // A closed eye is a stroke, which reads much better than a thin ellipse.
      ctx.strokeStyle = ink;
      ctx.lineWidth = Math.max(1.6, r * 0.06);
      ctx.beginPath();
      ctx.moveTo(cx - baseR, eyeY);
      ctx.lineTo(cx + baseR, eyeY);
      ctx.stroke();
      return;
    }
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(cx, eyeY, baseR, baseR * open, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.arc(cx + look, eyeY, baseR * 0.52 * Math.min(1, open + 0.25), 0, Math.PI * 2);
    ctx.fill();
  };

  // Mood decides how open the eyes are.
  let open = 1;
  if (mood === "stunned") open = 0.18;
  else if (mood === "kick") open = 1.25;
  else if (mood === "air") open = 1.15;
  else if (mood === "happy") open = 0.55;
  else if (mood === "sad") open = 0.7;

  const lx = x - eyeDX, rx = x + eyeDX;

  if (faceId === "cyclops") {
    // One big central eye.
    const bigR = baseR * 1.7;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(x, eyeY, bigR, bigR * open, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.arc(x + look * 1.4, eyeY, bigR * 0.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (faceId === "robot") {
    // Rectangular visor eyes.
    ctx.fillStyle = "#7dd3fc";
    const w = baseR * 1.5, h = Math.max(2, baseR * 0.95 * open);
    ctx.fillRect(lx - w / 2, eyeY - h / 2, w, h);
    ctx.fillRect(rx - w / 2, eyeY - h / 2, w, h);
    ctx.fillStyle = ink;
    ctx.fillRect(lx - w / 2 + look, eyeY - h / 2, w * 0.28, h);
    ctx.fillRect(rx - w / 2 + look, eyeY - h / 2, w * 0.28, h);
  } else if (faceId === "sleepy") {
    drawEye(lx, mood === "stunned" ? 0.18 : 0.12, "open");
    drawEye(rx, mood === "stunned" ? 0.18 : 0.12, "open");
  } else if (faceId === "cool") {
    // Sunglasses: one bar across both eyes.
    ctx.fillStyle = "#111827";
    roundRect(lx - baseR * 1.5, eyeY - baseR * 0.95, (rx - lx) + baseR * 3, baseR * 1.9, baseR * 0.5);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.fillRect(lx - baseR * 1.1, eyeY - baseR * 0.6, baseR * 0.9, baseR * 0.5);
  } else if (faceId === "goofy") {
    // Mismatched eyes.
    drawEye(lx, Math.min(1.4, open * 1.35), "open");
    drawEye(rx, Math.max(0.25, open * 0.6), "open");
  } else {
    drawEye(lx, open, "open");
    drawEye(rx, open, "open");
  }

  // --- brows ------------------------------------------------------------
  const angry = faceId === "angry" || mood === "kick";
  if (angry || mood === "sad") {
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.8, r * 0.075);
    ctx.lineCap = "round";
    const browY = eyeY - baseR * 1.7;
    const tilt = baseR * (angry ? 0.55 : -0.5);
    ctx.beginPath();
    ctx.moveTo(lx - baseR, browY - tilt);
    ctx.lineTo(lx + baseR, browY + tilt);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rx - baseR, browY + tilt);
    ctx.lineTo(rx + baseR, browY - tilt);
    ctx.stroke();
  }

  // --- mouth ------------------------------------------------------------
  ctx.strokeStyle = ink;
  ctx.lineWidth = Math.max(1.8, r * 0.08);
  ctx.lineCap = "round";
  const mw = r * 0.42;

  if (mood === "stunned") {
    // Wavy dazed mouth.
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) {
      const px = x - mw + (i / 6) * mw * 2;
      ctx.lineTo(px, mouthY + (i % 2 ? -1 : 1) * r * 0.055);
    }
    ctx.stroke();
  } else if (mood === "kick" || mood === "air") {
    // Open "oh" mouth.
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.ellipse(x, mouthY, mw * 0.5, r * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (mood === "sad") {
    ctx.beginPath();
    ctx.arc(x, mouthY + r * 0.2, mw, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  } else {
    // Smile, deeper when happy or on a grinning face.
    const deep = mood === "happy" || faceId === "grin" ? 0.62 : 0.3;
    if (faceId === "angry" && mood === "idle") {
      ctx.beginPath();
      ctx.moveTo(x - mw, mouthY);
      ctx.lineTo(x + mw, mouthY);
      ctx.stroke();
    } else if (faceId === "robot") {
      ctx.beginPath();
      ctx.moveTo(x - mw, mouthY);
      ctx.lineTo(x + mw, mouthY);
      ctx.stroke();
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * mw * 0.5, mouthY - r * 0.06);
        ctx.lineTo(x + i * mw * 0.5, mouthY + r * 0.06);
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.arc(x, mouthY - r * deep * 0.5, mw,
              Math.PI * (0.5 - deep * 0.42), Math.PI * (0.5 + deep * 0.42));
      ctx.stroke();
      // Teeth on a big grin.
      if (deep > 0.5) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, mouthY - r * deep * 0.5, mw * 0.92,
                Math.PI * (0.5 - deep * 0.3), Math.PI * (0.5 + deep * 0.3));
        ctx.fill();
      }
    }
  }
  ctx.lineCap = "butt";
}

/** Draw a hat sitting on a head of radius `r`. */
function drawHat(x, y, r, facing, hatId, team) {
  if (hatId === "none") return;
  const topY = y - r;
  const accent = team ? team.accent : "#ffffff";
  const colour = team ? team.color : "#e2413c";

  if (hatId === "cap") {
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.arc(x, topY + r * 0.12, r * 0.82, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fill();
    // Peak, pointing the way the player faces.
    ctx.fillStyle = accent;
    roundRect(facing > 0 ? x + r * 0.3 : x - r * 1.15, topY + r * 0.02, r * 0.85, r * 0.16, r * 0.06);
    ctx.fill();
  } else if (hatId === "band") {
    ctx.fillStyle = accent;
    roundRect(x - r * 0.86, topY + r * 0.18, r * 1.72, r * 0.2, r * 0.08);
    ctx.fill();
  } else if (hatId === "crown") {
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    const bw = r * 1.1, by = topY + r * 0.16;
    ctx.moveTo(x - bw / 2, by);
    for (let i = 0; i < 3; i++) {
      const sx = x - bw / 2 + (i * bw) / 3;
      ctx.lineTo(sx + bw / 6, by - r * 0.34);
      ctx.lineTo(sx + bw / 3, by);
    }
    ctx.closePath();
    ctx.fill();
  } else if (hatId === "horns") {
    ctx.fillStyle = "#f8fafc";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * r * 0.5, topY + r * 0.28);
      ctx.quadraticCurveTo(x + s * r * 0.95, topY - r * 0.1, x + s * r * 0.62, topY - r * 0.3);
      ctx.quadraticCurveTo(x + s * r * 0.6, topY + r * 0.02, x + s * r * 0.34, topY + r * 0.3);
      ctx.closePath();
      ctx.fill();
    }
  } else if (hatId === "tophat") {
    ctx.fillStyle = "#111827";
    roundRect(x - r * 0.9, topY + r * 0.05, r * 1.8, r * 0.14, r * 0.05);
    ctx.fill();
    ctx.fillRect(x - r * 0.45, topY - r * 0.55, r * 0.9, r * 0.62);
    ctx.fillStyle = colour;
    ctx.fillRect(x - r * 0.45, topY - r * 0.1, r * 0.9, r * 0.12);
  } else if (hatId === "mohawk") {
    ctx.fillStyle = accent;
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const t2 = i / 8;
      const px = x - r * 0.5 + t2 * r;
      const spike = Math.sin(t2 * Math.PI) * r * 0.55;
      ctx.lineTo(px, topY + r * 0.2 - spike);
    }
    ctx.lineTo(x + r * 0.5, topY + r * 0.28);
    ctx.lineTo(x - r * 0.5, topY + r * 0.28);
    ctx.closePath();
    ctx.fill();
  } else if (hatId === "halo") {
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = Math.max(2, r * 0.1);
    ctx.beginPath();
    ctx.ellipse(x, topY - r * 0.34, r * 0.62, r * 0.2, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawWalls() {
  drawProbe.walls = 0;
  for (const w of game.walls) {
    drawProbe.walls++;
    const team = game.players[w.owner] ? game.players[w.owner].team : TEAMS[0];
    /*
      A wall standing on the grass grows up out of the ground. A platform — or a
      wall raised in MID-AIR, which has no ground to grow from — fades in at full
      size instead, since sliding it upward would read as it falling.
    */
    const rises = !w.platform && w.grounded !== false;
    const h = rises ? w.h * w.born : w.h;
    const y = rises ? w.y + (w.h - h) : w.y;
    if (!rises) ctx.globalAlpha = 0.35 + 0.65 * w.born;
    const dying = w.life < 1.5 && Math.floor(w.life * 8) % 2 === 0;
    ctx.globalAlpha = dying ? 0.45 : 1;

    // Body, tinted toward the owner's colour so you can tell whose it is.
    const g = ctx.createLinearGradient(w.x, y, w.x + w.w, y);
    g.addColorStop(0, "#475569");
    g.addColorStop(0.5, team.color);
    g.addColorStop(1, "#334155");
    ctx.fillStyle = g;
    roundRect(w.x, y, w.w, h, 4);
    ctx.fill();
    ctx.strokeStyle = team.accent;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Brick courses, so damage reads as structural.
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 1;
    for (let by = y + 12; by < y + h - 4; by += 14) {
      ctx.beginPath();
      ctx.moveTo(w.x + 2, by);
      ctx.lineTo(w.x + w.w - 2, by);
      ctx.stroke();
    }

    // Damage: cracks appear as hit points are lost.
    const lost = WALL_HP - w.hp;
    if (lost > 0) {
      ctx.strokeStyle = "rgba(15,23,42,0.75)";
      ctx.lineWidth = 2;
      for (let k = 0; k < lost; k++) {
        const cy = y + h * (0.25 + k * 0.25);
        ctx.beginPath();
        ctx.moveTo(w.x + 1, cy);
        ctx.lineTo(w.x + w.w * 0.6, cy + 6);
        ctx.lineTo(w.x + w.w - 1, cy - 3);
        ctx.stroke();
      }
    }

    // A kick flashes the wall white, so the hit reads even without a hp change.
    if (w.kickFlash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${w.kickFlash * 1.6})`;
      roundRect(w.x, y, w.w, h, 4);
      ctx.fill();
    }

    // Remaining-life bar along the top.
    const frac = clamp(w.life / WALL_LIFE, 0, 1);
    ctx.fillStyle = frac > 0.35 ? team.accent : "#f87171";
    ctx.fillRect(w.x, y - 4, w.w * frac, 2.5);

    ctx.globalAlpha = 1;
  }
}

function drawPlatforms() {
  // Tally for the test suite: proves platforms reached the canvas on this
  // frame. A previous bug had this called only from the pause backdrop, so the
  // arena was invisible in play while every "does it throw" test passed.
  drawProbe.platforms = 0;
  for (const pl of activePlatforms()) {
    drawProbe.platforms++;
    const ghost = pl.kind === "ghost";
    const bounce = pl.kind === "bounce";
    const base = bounce ? "#0ea5e9" : ghost ? "rgba(148,163,184,0.35)" : "#334155";
    const edge = bounce ? "#7dd3fc" : ghost ? "rgba(203,213,225,0.5)" : "#64748b";

    // Slab.
    ctx.fillStyle = base;
    roundRect(pl.x, pl.y, pl.w, pl.h, Math.min(6, pl.h / 2));
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Top highlight so the standable surface reads clearly.
    ctx.fillStyle = bounce ? "rgba(186,230,253,0.9)" : "rgba(255,255,255,0.22)";
    ctx.fillRect(pl.x + 3, pl.y + 1.5, pl.w - 6, 2.5);

    if (bounce) {
      // Springs, so a pad is obviously bouncy before you touch it.
      ctx.strokeStyle = "rgba(186,230,253,0.75)";
      ctx.lineWidth = 1.5;
      const n = Math.max(2, Math.floor(pl.w / 34));
      for (let i = 0; i < n; i++) {
        const sx = pl.x + 12 + i * ((pl.w - 24) / Math.max(1, n - 1));
        ctx.beginPath();
        for (let k = 0; k <= 3; k++) {
          const yy = pl.y + pl.h + 2 + k * 3;
          ctx.lineTo(sx + (k % 2 ? 4 : -4), yy);
        }
        ctx.stroke();
      }
    }
    if (ghost) {
      // Dashes signal "the ball goes through this".
      ctx.strokeStyle = "rgba(203,213,225,0.55)";
      ctx.setLineDash([7, 6]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(pl.x + 4, pl.y + pl.h / 2);
      ctx.lineTo(pl.x + pl.w - 4, pl.y + pl.h / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Shadow on the grass beneath.
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(pl.x + pl.w / 2, GROUND_Y + 3, pl.w * 0.42, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawNet() {
  const half = W / 2, top = netTop();
  const beach = arena().surface === "sand";

  // Post: a weathered wooden pole on the beach, white metal on a court.
  ctx.fillStyle = beach ? "#7a5330" : "#e8eef9";
  ctx.fillRect(half - NET_W / 2, top, NET_W, GROUND_Y - top);
  if (beach) {
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    for (let y = top + 8; y < GROUND_Y; y += 16) {
      ctx.fillRect(half - NET_W / 2, y, NET_W, 2);
    }
  }

  // Netting: a coarse mesh for the beach, fine bands for a court.
  ctx.strokeStyle = beach ? "rgba(250,240,220,0.55)" : "rgba(255,255,255,0.5)";
  ctx.lineWidth = 1;
  const gapY = beach ? 16 : 12;
  for (let y = top; y < GROUND_Y; y += gapY) {
    ctx.beginPath();
    ctx.moveTo(half - NET_W / 2, y);
    ctx.lineTo(half + NET_W / 2, y);
    ctx.stroke();
  }

  // Top tape / cap.
  ctx.fillStyle = beach ? "#f8fafc" : "#fbbf24";
  if (beach) {
    ctx.fillRect(half - NET_W / 2 - 2, top - 4, NET_W + 4, 6);
  } else {
    ctx.beginPath();
    ctx.arc(half, top, NET_W / 2 + 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPowerups() {
  for (const p of game.powerups) {
    const def = POWERUPS[p.type];
    const y = p.y + Math.sin(p.bob) * 6;
    const fading = p.life < 3 && Math.floor(p.life * 6) % 2 === 0;

    ctx.globalAlpha = fading ? 0.35 : 1;
    ctx.save();
    ctx.translate(p.x, y);
    ctx.rotate(Math.sin(p.bob * 0.5) * 0.12);

    ctx.shadowColor = def.color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = def.color;
    roundRect(-PU_R, -PU_R, PU_R * 2, PU_R * 2, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 2;
    roundRect(-PU_R, -PU_R, PU_R * 2, PU_R * 2, 6);
    ctx.stroke();

    text(def.glyph, 0, 1, 20, "#10141c", "center", 900);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ----------------------------------------------- 10b. 3D QUAD RENDERER

   A painter's-algorithm rasteriser for the 3D arena: collect polygons, sort
   them back-to-front, fill them with flat shading. There is no depth buffer,
   which is why the arena is built from few, convex, well-separated boxes —
   painter order is exact for that geometry and cheap to compute.
*/

// Direction the light comes FROM. Fixed, so a surface's brightness tells the
// player which way it faces — the only depth cue flat shading has.
const LIGHT_DIR = v3norm(v3(-0.42, 0.84, -0.34));
const AMBIENT = 0.42;             // floor brightness for a face facing away

/** Parse "#rrggbb" once, so shadeFace can do arithmetic on the channels. */
function hexRGB(hex) {
  const h = String(hex).replace("#", "");
  const n = h.length === 3
    ? h.split("").map((c) => parseInt(c + c, 16))
    : [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  return n.map((v) => (isFinite(v) ? v : 0));
}

/**
 * Flat-shade a colour by how squarely a face meets the light.
 *
 * `k` runs from AMBIENT (facing away) to 1 (facing the light), so the six
 * sides of a box read as six distinct tones and the shape is legible without
 * outlines or textures.
 */
function shadeFace(hex, normal) {
  const [r, g, b] = hexRGB(hex);
  const k = AMBIENT + (1 - AMBIENT) * Math.max(0, v3dot(normal, LIGHT_DIR));
  const c = (v) => clamp(Math.round(v * k), 0, 255);
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}

/**
 * Is this projected polygon facing away from the camera?
 *
 * Uses the signed area of the screen-space polygon. Our world winding is
 * counter-clockwise seen from OUTSIDE, and project() flips y for the canvas,
 * so an outward-facing polygon comes out with a NEGATIVE signed area here.
 * A positive area therefore means we are looking at the inside of a box, and
 * the face can be skipped — halving the fill cost and removing the commonest
 * painter-order artefact in a single test.
 *
 * A zero area is a face seen exactly edge-on: it covers no pixels, so culling
 * it is both correct and cheaper than filling a degenerate polygon.
 */
function isBackFace(pts) {
  let area = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    area += a.x * b.y - b.x * a.y;
  }
  return area >= 0;
}

/**
 * A batch of world-space polygons to be drawn in one depth-sorted pass.
 *
 * Faces are pushed in whatever order is convenient for the geometry code, then
 * `flush` projects, culls and sorts them. Sorting happens on the mean camera
 * depth of each face: for convex, non-interpenetrating boxes that ordering is
 * exact, and it degrades gracefully (a seam, not a hole) if two faces do touch.
 */
function faceBatch() {
  const faces = [];
  return {
    /** `pts` are world-space corners, counter-clockwise seen from outside. */
    push(pts, hex, opts = {}) {
      faces.push({ pts, hex, opts });
    },
    get length() { return faces.length; },
    /** Project, cull, sort and fill. Returns how many faces were painted. */
    flush(cam, view, basis) {
      const ready = [];
      for (const f of faces) {
        const scr = [];
        let depth = 0, ok = true;
        for (const p of f.pts) {
          const q = project(p, cam, view, basis);
          // One corner behind the near plane discards the whole face: see NEAR.
          if (!q) { ok = false; break; }
          scr.push(q);
          depth += q.z;
        }
        if (!ok) continue;
        if (!f.opts.twoSided && isBackFace(scr)) continue;
        ready.push({ scr, depth: depth / scr.length, hex: f.hex, opts: f.opts });
      }

      // Far to near: a nearer face must paint over a farther one.
      ready.sort((a, b) => b.depth - a.depth);

      for (const f of ready) {
        const n = f.opts.normal;
        ctx.fillStyle = n ? shadeFace(f.hex, n) : f.hex;
        ctx.beginPath();
        ctx.moveTo(f.scr[0].x, f.scr[0].y);
        for (let i = 1; i < f.scr.length; i++) ctx.lineTo(f.scr[i].x, f.scr[i].y);
        ctx.closePath();
        ctx.fill();
        if (f.opts.edge) {
          ctx.strokeStyle = f.opts.edge;
          ctx.lineWidth = f.opts.edgeW || 1;
          ctx.stroke();
        }
      }
      return ready.length;
    },
    /** The sorted draw order, for the test suite to assert against. */
    order(cam, view, basis) {
      const out = [];
      for (const f of faces) {
        let depth = 0, ok = true;
        const scr = [];
        for (const p of f.pts) {
          const q = project(p, cam, view, basis);
          if (!q) { ok = false; break; }
          scr.push(q);
          depth += q.z;
        }
        if (!ok) continue;
        if (!f.opts.twoSided && isBackFace(scr)) continue;
        out.push({ tag: f.opts.tag, depth: depth / scr.length });
      }
      out.sort((a, b) => b.depth - a.depth);
      return out;
    },
    clear() { faces.length = 0; },
  };
}

/*
  The six faces of an axis-aligned box, each wound counter-clockwise as seen
  from OUTSIDE the box so back-face culling works, and each carrying its own
  outward normal for shading. Written once here because every wall, crate and
  pillar in the arena is a box — the alternative was six near-identical
  literals per object.

  The winding of every face is asserted by the test suite against its own
  normal, because a single face wound the wrong way is invisible from outside
  and shows a hole straight through the geometry.
*/
function boxFaces(batch, cx, cy, cz, hw, hh, hd, hex, tag) {
  const x0 = cx - hw, x1 = cx + hw;
  const y0 = cy - hh, y1 = cy + hh;
  const z0 = cz - hd, z1 = cz + hd;
  const P = (x, y, z) => v3(x, y, z);
  const face = (pts, normal) => batch.push(pts, hex, { normal, tag });

  // Top (+y), seen from above: x increasing, then z increasing.
  face([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], v3(0, 1, 0));
  // Bottom (-y), seen from below: the reverse sweep.
  face([P(x0, y0, z1), P(x1, y0, z1), P(x1, y0, z0), P(x0, y0, z0)], v3(0, -1, 0));
  // Front (-z): wound so it reads counter-clockwise from outside, i.e. from -z.
  face([P(x1, y1, z0), P(x0, y1, z0), P(x0, y0, z0), P(x1, y0, z0)], v3(0, 0, -1));
  // Back (+z): the mirror of the front.
  face([P(x0, y1, z1), P(x1, y1, z1), P(x1, y0, z1), P(x0, y0, z1)], v3(0, 0, 1));
  // Left (-x): seen from -x, z runs front-to-back.
  face([P(x0, y1, z0), P(x0, y1, z1), P(x0, y0, z1), P(x0, y0, z0)], v3(-1, 0, 0));
  // Right (+x): the mirror of the left.
  face([P(x1, y1, z1), P(x1, y1, z0), P(x1, y0, z0), P(x1, y0, z1)], v3(1, 0, 0));
}

/* --------------------------------------------- 10c. 3D ARENA RENDERING

   One draw pass per viewport: sky, then the world as a single sorted face
   batch, then the fighters as billboards, then the HUD in plain 2D.

   Fighters are billboards rather than boxes on purpose. The 2D game's whole
   visual identity is those hand-drawn faces and hats, and drawFace/drawHat
   already paint them at any screen position and radius — so the 3D mode shows
   the same characters the rest of the game does, rather than strangers.
*/

/** The viewports for this frame: one, or two stacked for split-screen. */
function arenaViews() {
  if (!game.arena || !game.arena.split) return [makeView(0, 0, W, H)];
  // Stacked rather than side-by-side: a 1000x300 strip keeps a usable
  // horizontal field of view, which a 500x600 column would not.
  return [makeView(0, 0, W, H / 2), makeView(0, H / 2, W, H / 2)];
}

/** The floor, as a grid of plates so the grid lines give a sense of speed. */
function arenaFloorFaces(batch, theme) {
  const N = 8;
  const step = (ARENA_HW * 2) / N;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const x0 = -ARENA_HW + i * step, z0 = -ARENA_HD + j * step;
      // Alternating shade, so the grid reads without drawing any lines at all.
      const dark = (i + j) % 2 === 0;
      const col = dark ? theme.ground : shiftHex(theme.ground, 12);
      batch.push([v3(x0, 0, z0), v3(x0 + step, 0, z0),
                  v3(x0 + step, 0, z0 + step), v3(x0, 0, z0 + step)],
                 col, { normal: v3(0, 1, 0), tag: "floor" });
    }
  }
}

/** Nudge a hex colour lighter (positive) or darker (negative) by `d` per channel. */
function shiftHex(hex, d) {
  const [r, g, b] = hexRGB(hex);
  const c = (v) => clamp(v + d, 0, 255);
  return `#${[c(r), c(g), c(b)].map((v) => v.toString(16).padStart(2, "0")).join("")}`;
}

/**
 * The enclosing walls, drawn as inward-facing quads.
 *
 * Only the far walls are wanted: a wall behind the camera would fill the screen.
 * Back-face culling does exactly that for free, provided each wall is wound to
 * face INWARD — the opposite of a crate, since we stand inside this box.
 */
function arenaWallFaces(batch, theme) {
  const h = ARENA_WALL_H;
  const w = shiftHex(theme.ground, -14);
  const X = ARENA_HW, Z = ARENA_HD;
  // Each quad is wound counter-clockwise seen from INSIDE the room.
  batch.push([v3(-X, 0, -Z), v3(-X, h, -Z), v3(X, h, -Z), v3(X, 0, -Z)], w,
             { normal: v3(0, 0, 1), tag: "wall" });
  batch.push([v3(X, 0, Z), v3(X, h, Z), v3(-X, h, Z), v3(-X, 0, Z)], w,
             { normal: v3(0, 0, -1), tag: "wall" });
  batch.push([v3(-X, 0, Z), v3(-X, h, Z), v3(-X, h, -Z), v3(-X, 0, -Z)], w,
             { normal: v3(1, 0, 0), tag: "wall" });
  batch.push([v3(X, 0, -Z), v3(X, h, -Z), v3(X, h, Z), v3(X, 0, Z)], w,
             { normal: v3(-1, 0, 0), tag: "wall" });
}

/**
 * The two goals: posts, crossbar, and a net panel across the back.
 *
 * Built from thin boxes so they sort with the rest of the world in one batch,
 * and coloured per side so a glance tells you which end you are attacking.
 */
function arenaGoalFaces(batch) {
  for (const side of [0, 1]) {
    const gz = aGoalLineZ(side);
    const into = side === 0 ? -1 : 1;         // direction the net extends
    const col = game.arena.fighters[side]
      ? game.arena.fighters[side].team.color
      : "#cccccc";
    const post = shiftHex(col, 40);

    // Uprights.
    for (const px of [-A_GOAL_W / 2, A_GOAL_W / 2]) {
      boxFaces(batch, px, A_GOAL_H / 2, gz, A_POST_R, A_GOAL_H / 2, A_POST_R,
               post, "post");
    }
    // Crossbar.
    boxFaces(batch, 0, A_GOAL_H, gz, A_GOAL_W / 2 + A_POST_R, A_POST_R, A_POST_R,
             post, "post");
    // The net: a translucent-looking panel at the back, plus side panels, so the
    // goal reads as a box you can put the ball INTO rather than a flat frame.
    const backZ = gz + into * A_GOAL_D;
    boxFaces(batch, 0, A_GOAL_H / 2, backZ, A_GOAL_W / 2, A_GOAL_H / 2, 3,
             shiftHex(col, -30), "net");
    for (const px of [-A_GOAL_W / 2, A_GOAL_W / 2]) {
      boxFaces(batch, px, A_GOAL_H / 2, gz + into * A_GOAL_D / 2,
               2, A_GOAL_H / 2, A_GOAL_D / 2, shiftHex(col, -38), "net");
    }
    // A roof on the net, so it is not open from above.
    boxFaces(batch, 0, A_GOAL_H, gz + into * A_GOAL_D / 2,
             A_GOAL_W / 2, 2, A_GOAL_D / 2, shiftHex(col, -34), "net");
  }
}

/** Sky: a flat gradient, since the room is sealed and has no horizon to sell. */
function drawArenaSky(view, theme) {
  const g = ctx.createLinearGradient(0, view.y, 0, view.y + view.h);
  g.addColorStop(0, theme.sky[0]);
  g.addColorStop(1, theme.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(view.x, view.y, view.w, view.h);
}

/**
 * One viewport's view of the world: floor, walls, cover, shots and impacts.
 *
 * Everything goes through a single batch so the depth sort is global — sorting
 * per object would let a near crate paint behind a far one.
 */
function drawArenaWorld(cam, view, theme) {
  const basis = camBasis(cam);
  const batch = faceBatch();

  arenaFloorFaces(batch, theme);
  arenaWallFaces(batch, theme);
  arenaGoalFaces(batch);
  for (const c of game.arena.cover) {
    boxFaces(batch, c.x, c.y, c.z, c.hw, c.hh, c.hd, shiftHex(theme.ground, 26), "cover");
  }
  /*
    Built walls, in their owner's colour so you can tell your own from theirs at a
    glance. They RISE from the floor as `born` grows, DARKEN as they take damage,
    and BLINK in their last second — the batch fills opaque polygons, so a blink
    is how a wall warns you it is about to vanish rather than a fade.
  */
  for (const w of game.arena.walls) {
    const f = game.arena.fighters[w.owner];
    const base = f ? f.team.color : "#94a3b8";
    const dying = w.life < 1 && Math.sin(performance.now() / 70) > 0;
    const col = dying ? "#1b2436"
                      : shiftHex(base, Math.round(-34 + 34 * (w.hp / A_WALL_HP)));
    const h = w.hh * w.born;
    boxFaces(batch, w.x, h, w.z, w.hw, Math.max(1, h), w.hd, col, "wall");
  }
  const painted = batch.flush(cam, view, basis);

  /*
    THE BALL, drawn after the world with its own occlusion test — the same reason
    the fighters need one: there is no depth buffer, so without this the ball
    would show straight through a crate.
  */
  const ball = game.arena.ball;
  if (ball && !occludedFromCam(v3(ball.x, ball.y, ball.z), cam)) {
    const bp = project(v3(ball.x, ball.y, ball.z), cam, view, basis);
    if (bp) {
      const br = Math.max(2, ball.r * bp.s);
      // A shadow on the floor directly beneath it, which is what makes the
      // ball's position readable in 3D at all.
      const sp = project(v3(ball.x, 0.5, ball.z), cam, view, basis);
      if (sp) {
        ctx.fillStyle = "rgba(0,0,0,0.32)";
        ctx.beginPath();
        ctx.ellipse(sp.x, sp.y, Math.max(2, ball.r * sp.s), Math.max(1, ball.r * sp.s * 0.36),
                    0, 0, Math.PI * 2);
        ctx.fill();
      }
      // The ball itself, with a highlight so it does not read as a flat disc.
      const g = ctx.createRadialGradient(bp.x - br * 0.3, bp.y - br * 0.35, br * 0.15,
                                         bp.x, bp.y, br);
      g.addColorStop(0, "#ffffff");
      g.addColorStop(0.65, "#e8edf5");
      g.addColorStop(1, "#8e9bb0");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(bp.x, bp.y, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(15,23,42,0.55)";
      ctx.lineWidth = Math.max(0.5, br * 0.09);
      ctx.stroke();
      // A couple of panel marks, so spin and travel are visible.
      if (br > 5) {
        ctx.fillStyle = "rgba(15,23,42,0.55)";
        for (const [ox, oy] of [[-0.32, -0.1], [0.3, 0.24], [0, 0.46]]) {
          ctx.beginPath();
          ctx.arc(bp.x + ox * br, bp.y + oy * br, br * 0.17, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  // Projectiles: small bright dots. Drawn after the world, so each must test its
  // own occlusion — there is no depth buffer to do it for them.
  for (const s of game.arena.shots) {
    const sp = v3(s.x, s.y, s.z);
    if (occludedFromCam(sp, cam)) continue;
    const p = project(sp, cam, view, basis);
    if (!p) continue;
    const r = Math.max(1.5, SHOT_R * p.s);
    ctx.fillStyle = "#fde68a";
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
    // A short tracer back along its path sells the speed at 1750 units/s.
    const tail = project(v3(s.x - s.vx * 0.02, s.y - s.vy * 0.02, s.z - s.vz * 0.02),
                         cam, view, basis);
    if (tail) {
      ctx.strokeStyle = "rgba(253,230,138,0.5)";
