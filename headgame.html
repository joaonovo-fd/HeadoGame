      game.rules.supers = false;
      superGain(p0, SUPER_MAX);
      ok("supers can be switched off in the rules",
         p0.superCharge === 0 && !superReady(p0));
      game.rules.supers = true;
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 27c. Every power must fire, run and end without breaking the match.
  {
    const saved = { mode: game.mode, scene: game.scene, players: game.players,
                    ball: game.ball, cpu: [...game.cpu], sel: [...game.sel],
                    score: [...game.score], superFx: game.superFx,
                    helpers: game.helpers, bullets: game.bullets };
    game.mode = MODE.SINGLE;
    game.cpu = [false, true];

    /*
      Power-ups OFF for this sweep. A `smaller` pickup landing during the five
      seconds of live match resized the player independently of the power, and the
      cleanup assertion below blamed the power for it — a 1-in-20 flake that read
      as "bulwark left the player resized". The point here is the power's own
      bookkeeping, so the pitch is kept clear of anything else that scales.
    */
    const savedRules = { ...game.rules };
    game.rules.puRate = 0;
    game.rules.mineRate = 0;
    game.chaos = false;

    let bad = null;
    for (let i = 0; i < TEAMS.length && !bad; i++) {
      game.sel = [i, (i + 1) % TEAMS.length];
      startMatch();
      game.scene = SCENE.PLAY;
      const pl = game.players[0];
      const id = pl.superId;
      const def = SUPERS[id];
      const r0 = pl.r;

      try {
        pl.superCharge = SUPER_MAX;
        if (!fireSuper(pl)) { bad = `${id} refused to fire`; break; }
        /*
          Run it out, driving the whole match so the power meets real physics —
          the ball, the walls, the opponent. A goal during the power calls
          kickoff, which resets both players, so the timer is read back off
          `game.players[0]` each pass rather than through a captured reference
          that a reset may have superseded.
        */
        const steps = Math.round((def.dur + 0.6) / DT) || 60;
        let live = true;
        for (let s = 0; s < steps && live; s++) {
          step(DT);
          if (game.scene !== SCENE.PLAY && game.scene !== SCENE.CELEBRATE &&
              game.scene !== SCENE.COUNTDOWN) live = false;
        }
        const now = game.players[0] || pl;
        if (now.superT > 0) {
          bad = `${id} never expired (${now.superT.toFixed(2)}s left, scene ${game.scene})`;
          break;
        }
        // Nothing may be left permanently changed.
        if (Math.abs(pl.r - r0) > 1e-6) {
          bad = `${id} left the player resized (${r0} -> ${pl.r})`; break;
        }
        for (const v of [pl.x, pl.y, pl.vx, pl.vy, game.ball.x, game.ball.y,
                         game.ball.vx, game.ball.vy]) {
          if (!isFinite(v)) { bad = `${id} produced a non-finite world`; break; }
        }
        if (bad) break;
        if (superSizeMul(pl) !== 1 || superKickMul(pl) !== 1 ||
            superSpeedMul(pl) !== 1 || superImmovable(pl)) {
          bad = `${id} left a multiplier applied after expiring`; break;
        }
      } catch (e) {
        bad = `${id} threw: ${e.message}`;
        break;
      }
    }
    ok("every superpower fires, runs its course and cleans up after itself",
       !bad, bad || "");
    Object.assign(game.rules, savedRules);

    /*
      A power fired just before a goal must keep expiring through the
      celebration. Nothing in CELEBRATE touched the players, so the timer froze
      for its whole 1.8 seconds and the power ran visibly longer than advertised —
      long enough to still be live at the next kickoff.
    */
    {
      game.sel = [15, 0];                  // Violet Vipers — VENOM SHOT
      startMatch();
      game.scene = SCENE.PLAY;
      const pl = game.players[0];
      pl.superCharge = SUPER_MAX;
      fireSuper(pl);
      const t0 = pl.superT;
      game.scene = SCENE.CELEBRATE;
      game.timer = CELEBRATE_T;
      for (let i = 0; i < Math.round(1 / DT); i++) step(DT);
      const now = game.players[0];
      ok("a superpower keeps expiring during a goal celebration",
         now.superT < t0 - 0.9, `${t0.toFixed(2)} -> ${now.superT.toFixed(2)}`);
    }

    // The instantaneous ones do their work immediately.
    {
      game.sel = [6, 0];                   // Cyan Sprinters — QUAKE
      startMatch();
      game.scene = SCENE.PLAY;
      const pl = game.players[0];
      ok("the quake team carries the quake", pl.superId === "quake");
      pl.onGround = true;
      game.ball.x = pl.x + 40;
      game.ball.y = GROUND_Y - 20;
      game.ball.vy = 0;
      pl.superCharge = SUPER_MAX;
      fireSuper(pl);
      ok("a grounded quake launches a nearby ball", game.ball.vy < 0,
         `${game.ball.vy.toFixed(0)}`);
    }
    {
      game.sel = [1, 0];                   // Blue Bolts — BLINK
      startMatch();
      game.scene = SCENE.PLAY;
      const pl = game.players[0];
      ok("the blink team carries the blink", pl.superId === "blink");
      game.ball.x = W * 0.8;
      game.ball.y = 200;
      pl.x = 80;
      pl.superCharge = SUPER_MAX;
      fireSuper(pl);
      ok("blinking moves the player to the ball",
         Math.abs(pl.x - game.ball.x) < pl.r + game.ball.r + 8,
         `player ${pl.x.toFixed(0)} ball ${game.ball.x.toFixed(0)}`);
      ok("and lands them inside the pitch",
         pl.x >= WALL + pl.r - 1e-6 && pl.x <= W - WALL - pl.r + 1e-6);
    }
    {
      game.sel = [10, 0];                  // Amber Arrows — ARROW STORM
      startMatch();
      game.scene = SCENE.PLAY;
      const pl = game.players[0];
      game.bullets = [];
      pl.superCharge = SUPER_MAX;
      fireSuper(pl);
      ok("an arrow storm fires a volley at once", game.bullets.length >= 3,
         `${game.bullets.length}`);
      ok("all of it belongs to the firing player",
         game.bullets.every((b) => b.owner === pl.index));
    }
    {
      game.sel = [14, 0];                  // Slate Sentinels — LAST WALL
      startMatch();
      game.scene = SCENE.PLAY;
      const pl = game.players[0];
      game.helpers = [];
      pl.superCharge = SUPER_MAX;
      fireSuper(pl);
      ok("the sentinel power summons two helpers", game.helpers.length === 2,
         `${game.helpers.length}`);
      ok("one keeper and one striker",
         game.helpers.some((h) => h.kind === "keeper") &&
         game.helpers.some((h) => h.kind === "striker"));
    }
    {
      game.sel = [13, 0];                  // Crimson Bulls — DEEP FREEZE
      startMatch();
      game.scene = SCENE.PLAY;
      const pl = game.players[0];
      const foe = game.players[1];
      foe.stun = 0;
      pl.superCharge = SUPER_MAX;
      fireSuper(pl);
      ok("a freeze stuns the opponent", foe.stun > 0, `${foe.stun}`);
    }
    // The immovable powers must actually resist.
    {
      game.sel = [2, 0];                   // Green Giants — BULWARK
      startMatch();
      game.scene = SCENE.PLAY;
      const pl = game.players[0];
      pl.superCharge = SUPER_MAX;
      fireSuper(pl);
      ok("a bulwark is immovable while it runs", superImmovable(pl));
      ok("and larger", superSizeMul(pl) > 1);
      const r1 = pl.r;
      pl.superT = 0;
      endSuper(pl);
      ok("and returns to its own size afterwards", pl.r < r1, `${r1} -> ${pl.r}`);
    }

    Object.assign(game, saved);
    game.particles = [];
    game.bullets = [];
    game.helpers = [];
  }

  /* ---------------------------------------------------------------------
     POINTER AND TOUCH

     The game was keyboard-only, which is impossible on a phone. Every screen now
     registers click regions as it draws, so the rectangle you can tap is by
     construction the rectangle that was painted.
     ------------------------------------------------------------------- */
  // 28a. Regions, hit testing and synthesised keys.
  {
    const saved = { scene: game.scene, mode: game.mode, menuRow: game.menuRow,
                    cpu: [...game.cpu], sel: [...game.sel],
                    locked: [...game.locked], lookRow: [...game.lookRow],
                    players: game.players, ball: game.ball };

    /** Draw, tap a point, then run one update — the real per-frame sequence. */
    /*
     * Draw, tap, update — the same order the frame loop uses, INCLUDING its
     * end-of-frame key release. Without that release a tapped key stays held and
     * the next tap arrives with the previous one still down, which is how a
     * sequence of taps starts producing results no single tap would.
     */
    const tap = (x, y) => {
      draw();                       // regions are whatever the last pass painted
      const hitIt = pointerActivate(x, y);
      edgeFrame = true;             // a tap is an edge, exactly like a keypress
      step(0);
      for (const k in pressed) delete pressed[k];
      for (const k of tapKeys) keys[k] = false;
      tapKeys.length = 0;
      return hitIt;
    };

    ok("a tap outside every region does nothing",
       (() => { game.scene = SCENE.MENU; draw();
                return pointerActivate(-50, -50) === false; })());
    ok("regionAt finds the topmost region",
       (() => { clickRegions = [{ x: 0, y: 0, w: 100, h: 100, act: "A" },
                                { x: 10, y: 10, w: 20, h: 20, act: "B" }];
                return regionAt(15, 15).act === "B"; })());
    ok("and nothing outside them",
       (() => { clickRegions = [{ x: 0, y: 0, w: 10, h: 10, act: "A" }];
                return regionAt(50, 50) === null; })());
    ok("a synthesised key is released after the frame that reads it",
       (() => {
         tapKeys.length = 0;
         clickRegions = [{ x: 0, y: 0, w: W, h: H, act: "KeyZ" }];
         pointerActivate(5, 5);
         if (!keys.KeyZ) return false;
         // The frame loop clears them; emulate that step.
         for (const k of tapKeys) keys[k] = false;
         tapKeys.length = 0;
         return !keys.KeyZ;
       })());
    ok("logical coordinates are derived from the canvas rect, not raw client px",
       (() => { const p = toLogical(0, 0); return isFinite(p.x) && isFinite(p.y); })());

    // 28b. The MENU is fully operable by pointer.
    {
      game.scene = SCENE.MENU;
      game.mode = MODE.SINGLE;
      game.cpu = [false, true];
      game.menuRow = 0;
      draw();
      const regions = clickRegions;
      ok("the menu registers click regions", regions.length > 10, `${regions.length}`);
      const lbl = (k) => layoutProbe.menu.labels.find((l) => l.key === k);

      // Stepping a value row by tapping its right-hand end.
      const before = game.mode;
      const mr = lbl("mode");
      const wide = clickRegions
        .filter((r) => Math.abs(r.y - mr.y) < 1)
        .reduce((a, b) => (b.w > a.w ? b : a));
      tap(wide.x + wide.w - 12, mr.y + 17);
      ok("tapping the end of a menu row changes its value",
         game.mode !== before, `${before} -> ${game.mode}`);

      // A nav button both selects and activates.
      game.mode = MODE.SINGLE;
      draw();
      const cr = lbl("controls");
      const creg = clickRegions
        .find((r) => Math.abs(r.y - cr.y) < 1 && r.w < 200);
      tap(creg.x + creg.w / 2, cr.y + 10);
      ok("tapping a nav button opens that screen", game.scene === SCENE.CONTROLS,
         game.scene);

      /*
        START. The nav test above left the CONTROLS screen open, and its own state
        (ctrlFrom, ctrlBinding) would send the next ESC or ENTER back there — so
        the screen is properly closed before this is measured rather than merely
        overwriting `scene`.
      */
      game.ctrlFrom = null;
      game.ctrlBinding = null;
      game.locked = [false, false];
      game.scene = SCENE.MENU;
      game.mode = MODE.SINGLE;
      game.menuRow = 0;
      /*
        Drawn TWICE on purpose. The first pass rebuilds the row list for the mode
        just restored — the earlier taps changed it — and the second records the
        regions for that list. Reading a label from one layout and tapping it in
        another is what made this fail: the tap landed on whatever row now sits at
        those coordinates.
      */
      draw();
      draw();
      const sr = lbl("start");
      tap(W / 2, sr.y + 20);
      ok("tapping START begins team selection", game.scene === SCENE.SELECT,
         game.scene);
    }

    /*
      28c. The SELECT screen. This was a dead end on a phone: reachable, with no
      way to choose a team or to finish. Every part of it must be tappable.
    */
    {
      game.scene = SCENE.SELECT;
      game.mode = MODE.SINGLE;
      game.cpu = [false, false];
      game.sel = [0, 3];
      game.locked = [false, false];
      game.lookRow = [0, 0];
      draw();

      // No keys held over from an earlier tap, or a stray left/right would step
      // the team as well and the assertion would be off by one.
      for (const k in pressed) delete pressed[k];
      for (const k of tapKeys) keys[k] = false;
      tapKeys.length = 0;

      // Team dots: one region each, and tapping one picks that team outright.
      const dots = clickRegions.filter((r) => Math.abs(r.y - 484) < 2 && r.x < 500);
      ok("every team has a tappable dot on the select screen",
         dots.length === TEAMS.length, `${dots.length} of ${TEAMS.length}`);
      tap(dots[7].x + dots[7].w / 2, 500);
      ok("tapping a team dot selects that team", game.sel[0] === 7, `${game.sel[0]}`);

      // The picker rows step with a tap on either end.
      const faceBefore = lookForSeat(0).face;
      draw();
      const faceRow = clickRegions.filter((r) => Math.abs(r.y - 316) < 2 && r.x < 500);
      ok("a picker row registers a body and two arrows", faceRow.length === 3,
         `${faceRow.length}`);
      const rightArrow = faceRow.reduce((a, b) => (b.x > a.x ? b : a));
      tap(rightArrow.x + 10, 328);
      ok("tapping a picker arrow changes the value",
         lookForSeat(0).face !== faceBefore,
         `${faceBefore} -> ${lookForSeat(0).face}`);

      /*
        LOCK IN. Without this button the screen cannot be completed by touch at
        all, which is the bug this whole section exists to prevent regressing.
      */
      draw();
      const lock0 = clickRegions.find((r) => Math.abs(r.y - 520) < 1 && r.x < 500);
      ok("each seat has a LOCK IN button", !!lock0);
      const lock1 = clickRegions.find((r) => Math.abs(r.y - 520) < 1 && r.x > 500);
      ok("including the second seat", !!lock1);
      tap(lock0.x + lock0.w / 2, 537);
      ok("tapping LOCK IN readies that seat", game.locked[0] === true);
      // Tapping again un-readies, so a change of mind is possible.
      draw();
      tap(lock0.x + lock0.w / 2, 537);
      ok("and tapping it again un-readies", game.locked[0] === false);

      // Both seats ready starts the match.
      draw();
      tap(lock0.x + lock0.w / 2, 537);
      draw();
      tap(lock1.x + lock1.w / 2, 537);
      ok("readying both seats starts the match", game.scene === SCENE.COUNTDOWN,
         game.scene);

      // BACK leaves the screen, which ESC now does too.
      game.scene = SCENE.SELECT;
      game.locked = [false, false];
      draw();
      const back = clickRegions.find((r) => Math.abs(r.y - 566) < 2);
      ok("the select screen offers a way back", !!back);
      tap(back.x + back.w / 2, 580);
      ok("and tapping it returns to the menu", game.scene === SCENE.MENU, game.scene);
      // The same must work from the keyboard, which it previously did not.
      game.scene = SCENE.SELECT;
      pressed.Escape = true;
      edgeFrame = true;
      updateSelect(0);
      ok("ESC also leaves the select screen", game.scene === SCENE.MENU, game.scene);
      delete pressed.Escape;
      escUsed = false;
    }

    // 28d. Tap-anywhere screens, and the pause list.
    {
      game.mode = MODE.SINGLE;
      game.cpu = [false, true];
      game.sel = [0, 3];
      startMatch();
      game.scene = SCENE.WIN;
      game.winner = 0;
      draw();
      ok("a tap-anywhere screen accepts a tap in the middle",
         !!regionAt(W / 2, H / 2));
      tap(W / 2, H / 2);
      ok("and it advances", game.scene !== SCENE.WIN, game.scene);

      // The pause list rows are tappable, sharing drawMenuList with settings.
      startMatch();
      game.scene = SCENE.PLAY;
      openPause();
      draw();
      const rows = clickRegions.filter((r) => r.w === 320);
      ok("the pause menu rows are tappable",
         rows.length === PAUSE_ITEMS.length, `${rows.length}`);
      // RESUME is the first row.
      tap(rows[0].x + 10, rows[0].y + 10);
      ok("tapping RESUME closes the pause overlay",
         game.scene !== SCENE.PAUSE, game.scene);
    }

    // 28e. On-screen controls feed the same intent a keyboard does.
    {
      game.mode = MODE.SINGLE;
      game.cpu = [false, true];
      game.sel = [0, 3];
      startMatch();
      game.scene = SCENE.PLAY;
      const L = touchControlLayout();
      ok("the touch layout puts movement bottom-left",
         L.stick.x < W / 2 && L.stick.y > H / 2);
      ok("and the actions bottom-right",
         L.buttons.every((b) => b.x > W / 2 && b.y > H / 3));
      ok("and every button is on screen",
         L.buttons.every((b) => b.x - b.r >= 0 && b.x + b.r <= W &&
                                b.y - b.r >= 0 && b.y + b.r <= H),
         L.buttons.filter((b) => b.x + b.r > W).map((b) => b.id).join());
      ok("with a kick button, which is the primary action",
         L.buttons.some((b) => b.id === "kick"));

      // A finger on the stick, dragged right, must read as "right".
      touchPoints.clear();
      touchPoints.set(1, { x: L.stick.x + 40, y: L.stick.y,
                           sx: L.stick.x, sy: L.stick.y });
      const a = intent[0];
      a.left = a.right = a.up = a.down = false;
      touchIntent(a, true);
      ok("dragging the stick right moves right", a.right && !a.left);
      touchPoints.clear();
      touchPoints.set(1, { x: L.stick.x, y: L.stick.y - 40,
                           sx: L.stick.x, sy: L.stick.y });
      a.left = a.right = a.up = a.down = false;
      touchIntent(a, true);
      ok("and dragging it up jumps", a.up && !a.down);
      // A neutral finger is not a direction.
      touchPoints.clear();
      touchPoints.set(1, { x: L.stick.x + 2, y: L.stick.y + 2,
                           sx: L.stick.x, sy: L.stick.y });
      a.left = a.right = a.up = a.down = false;
      touchIntent(a, true);
      ok("a resting thumb is not a direction",
         !a.left && !a.right && !a.up && !a.down);

      // A press on the kick button must produce exactly one kick edge.
      touchPoints.clear();
      touchPrev = new Set();
      const kb = L.buttons.find((b) => b.id === "kick");
      touchPoints.set(2, { x: kb.x, y: kb.y, sx: kb.x, sy: kb.y });
      a.kickEdge = false;
      touchIntent(a, true);
      ok("tapping KICK produces a kick", a.kick && a.kickEdge);
      touchIntent(a, true);
      ok("and holding it does not kick again", a.kick && !a.kickEdge);
      touchPoints.clear();
      touchPrev = new Set();
      ok("drawing the controls does not throw",
         (() => { try { drawTouchControls(); return true; }
                  catch (e) { return false; } })());
    }

    clickRegions = [];
    tapKeys.length = 0;
    touchPoints.clear();
    Object.assign(game, saved);
    game.particles = [];
  }

  // 23. Determinism: identical initial conditions give identical results.
  {
    const run = () => {
      const saveBall = game.ball;
      game.ball = { x: 400, y: 120, vx: 555, vy: -222, r: BALL_R, mass: 1 };
      for (let i = 0; i < 900; i++) stepBall(DT);
      const r = `${game.ball.x.toFixed(9)}|${game.ball.y.toFixed(9)}`;
      game.ball = saveBall;
      return r;
    };
    ok("simulation is deterministic", run() === run());
  }

  return { pass, fail, out };
}

/* ------------------------------------------------------------------ BOOT */

const isTest = typeof location !== "undefined" && /[?&]test=1\b/.test(location.search);

/*
  The tab title is written from VERSION rather than hard-coded in the <title>
  tag, so it can never drift from the constant on a release. The tag above holds
  the name only.
*/
try { document.title = `Head Game v${VERSION} — 1v1 Soccer`; }
catch (e) { /* no document (test harness): nothing to title */ }

game.names = loadNames();
loadOpts(game.opt);
game.board = loadBoard();
loadRules(game.rules);
rebuildWatched();
loadScheme();
loadSponsors();
loadLooks(game.looks);
fitCanvas();

if (isTest) {
  const { pass, fail, out } = runTests();
  for (const line of out) {
    console[line.startsWith("FAIL") ? "error" : "log"](line);
  }
  console.log(`\n${pass} passed, ${fail} failed`);

  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, W, H);
  text(fail === 0 ? "ALL PHYSICS TESTS PASSED" : `${fail} TEST(S) FAILED`,
       W / 2, 40, 22, fail === 0 ? "#4ade80" : "#ef4444", "center", 900);
  text(`${pass} passed · ${fail} failed`, W / 2, 66, 13, "#8fa3c0", "center", 600);
  ctx.font = "12px ui-monospace, SFMono-Regular, Menlo, monospace";
  ctx.textAlign = "left";
  out.forEach((line, i) => {
    const col = (i / 24) | 0;
    ctx.fillStyle = line.startsWith("FAIL") ? "#ef4444" : "#7fd6a0";
    ctx.fillText(line, 24 + col * 330, 100 + (i % 24) * 19);
  });
  text("remove ?test=1 from the URL to play", W / 2, H - 18, 12, "#8fa3c0", "center", 600);
} else {
  requestAnimationFrame(frame);
}
</script>
