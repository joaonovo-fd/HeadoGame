<script>
"use strict";

/* ============================================================================
   HEAD GAME — 2D local-multiplayer 1v1 soccer.

   Layout of this file:
     1.  Constants and tuning
     2.  Small math helpers
     3.  Pure physics kernel        <- unit-tested, no globals touched
     4.  Teams
     5.  Power-ups
     6.  Input
     7.  Entities (Ball, Player)
     8.  Match state + scene machine
     9.  Fixed-timestep loop
     10. Rendering
     11. Self-test suite (?test=1)

   Physics runs in fixed 1/120 s substeps inside a requestAnimationFrame loop,
   so bounces are repeatable and a max-power shot cannot tunnel a goalpost.
   ========================================================================= */

/* ---------------------------------------------------------------- 1. CONSTS */

const W = 1000;               // logical width  (canvas is letterboxed to fit)
const H = 600;                // logical height
const GROUND_Y = 520;         // top of the grass
const WALL = 8;               // side wall thickness

const GOAL_H = 140;           // goal mouth height
const GOAL_D = 70;            // goal depth (recessed into the wall)
const GOAL_BASE_TOP = GROUND_Y - GOAL_H;   // resting position of the crossbar
const POST_R = 7;             // crossbar radius

/*
  The goals slide up and down. Each side oscillates on its own sine wave, so the
  two are rarely aligned. `goalTop(side)` is the ONLY way to ask where a goal
  is — nothing may assume GOAL_BASE_TOP, or scoring and the posts will disagree
  with what is drawn.
*/
const GOAL_TRAVEL = 74;       // peak-to-centre vertical travel (px)
const GOAL_SPEED_L = 0.55;    // radians/sec, left goal
const GOAL_SPEED_R = 0.43;    // deliberately different so they drift apart
let goalPhase = 0;            // advanced by the fixed-step simulation

/** Current y of a goal's crossbar. side 0 = left, 1 = right. */
/*
  Live, mutable versions of the goal tunables. Chaos mode and the goal-resize
  power-up write these; nothing else should. `goalHeight()` and `goalTop()` are
  the only sanctioned readers of goal geometry.
*/
let goalTravel = GOAL_TRAVEL;
let goalSpeedL = GOAL_SPEED_L;
let goalSpeedR = GOAL_SPEED_R;
let goalScale = 1;            // set by the goal-resize power-up

/** Current mouth height, honouring the resize power-up. */
function goalHeight() {
  return clamp(GOAL_H * goalScale, 60, GROUND_Y - 70);
}

/**
 * Current y of a goal's crossbar. side 0 = left, 1 = right.
 *
 * Goals only SLIDE in chaos mode. A normal match wants a fixed, learnable
 * target; the moving nets were unpredictable enough to feel arbitrary. Every
 * collider reads this, so nothing else needs to know about the distinction.
 */
function goalTop(side) {
  const base = GROUND_Y - goalHeight();
  if (!goalsMove()) return clamp(base, 24, GROUND_Y - 55);
  const w = side === 0
    ? Math.sin(goalPhase * goalSpeedL)
    : Math.sin(goalPhase * goalSpeedR + 1.9);
  // Clamped so the mouth never sinks below the grass or leaves the screen.
  return clamp(base - w * goalTravel, 24, GROUND_Y - 55);
}

/** Do the goals slide? Only under chaos, unless the player forces it on. */
function goalsMove() {
  return game.chaos || game.rules.movingGoals;
}

/**
 * Lower edge of a goal's mouth — the crossbar plus the mouth height, capped at
 * the grass. The whole frame slides as one unit, so every collider that cares
 * about the goal must use this rather than assuming the ground.
 */
function goalBottom(side) {
  return Math.min(goalTop(side) + goalHeight(), GROUND_Y);
}

const GRAVITY = 1500;         // px/s^2 — baseline; live value is `gravity`
const DT = 1 / 120;           // fixed physics substep
const MAX_FRAME = 0.1;        // clamp frame delta (tab-switch guard)

/*
  Gravity is re-rolled at every kickoff after a goal, so each restart plays
  differently: the BALL floats or drops sharply, changing how shots arc and how
  long the ball hangs.

  Player jump velocity is scaled by sqrt(gravity multiplier) so that jump HEIGHT
  is preserved (peak rise = v²/2g, so scaling v by √k against g·k leaves the
  rise unchanged). Without this, low gravity launched the best jumper clean
  through the ceiling and high gravity put power-ups out of reach for the worst
  jumper — the safe range collapsed to nothing. Scaling means players keep their
  reachable envelope at every setting while air TIME still changes noticeably.
*/
const GRAV_MIN_MUL = 0.6;
const GRAV_MAX_MUL = 1.5;
let gravity = GRAVITY;        // live value, read by all dynamics
// Jump velocity multiplier that holds jump height constant as gravity changes.
const jumpScale = () => Math.sqrt(gravity / GRAVITY);

// Flavour bands for the on-screen readout, low multiplier to high.
const GRAV_BANDS = [
  { max: 0.75, label: "LOW GRAVITY",  color: "#7dd3fc" },
  { max: 0.92, label: "LIGHT",        color: "#a7f3d0" },
  { max: 1.09, label: "NORMAL",       color: "#cddcf2" },
  { max: 1.30, label: "HEAVY",        color: "#fbbf24" },
  { max: Infinity, label: "HIGH GRAVITY", color: "#f87171" },
];
const gravBand = (mul) => GRAV_BANDS.find((b) => mul < b.max);

const BALL_R = 14;
const BALL_REST = 0.72;       // restitution vs. static surfaces
const BALL_DRAG = 0.28;       // air drag coefficient (per second)
const BALL_ROLL = 1.4;        // ground rolling friction
/*
  Speed clamp. Raised again alongside the stronger KICK_BASE: with every team
  hitting the ceiling on a power shot, Shot Power stopped meaning anything at
  the moment it matters most.

  The hard limit is TUNNELING. At 1/120s the ball travels BALL_MAX_V/120 px per
  substep, and that must stay below the smallest collider it has to notice —
  the goal posts, at (POST_R + BALL_R) * 2 = 42px. 2400/120 = 20px, comfortably
  under. The test suite asserts this rather than trusting the arithmetic here.
*/
const BALL_MAX_V = 2400;
const BALL_MASS = 1;

/*
  Live tunables written ONLY by chaos mode (and reset by resetChaos). Physics
  reads these rather than the constants above, so a chaos roll takes effect
  everywhere at once.
*/
let ballRest = BALL_REST;
let ballDrag = BALL_DRAG;
let playerSpeedMul = 1;
let playerJumpMul = 1;
let playerSizeMul = 1;

const PLAYER_R = 30;          // baseline radius, scaled by team Size
const PLAYER_ACCEL = 2600;
const PLAYER_MAXV = 340;
const PLAYER_JUMP = 620;
const PLAYER_FRICTION = 12;   // ground damping when no input
const PLAYER_AIR_CTL = 0.55;  // horizontal control authority in mid-air

const LEG_LEN = 30;           // distance from body centre to leg tip
const LEG_R = 11;             // leg tip radius
const KICK_TIME = 0.22;       // swing duration
const KICK_COOLDOWN = 0.3;
const KICK_REACH = 1.25;      // kick range as a multiple of (playerR + ballR)
// Base kick impulse. Raised from 720: a plain kick was landing around 700-880
// px/s against a 2000 clamp, which read as a touch rather than a strike.
const KICK_BASE = 1180;
const KICK_UP = 0.95;         // upward bias mixed into every kick — shots arc high
const KICK_LIFT_MIN = 560;    // floor on upward launch speed, so kicks truly loft
const HEAD_BOOST = 1.3;       // bonus when the ball strikes the top of the head

// Bodies are springy, not walls: any contact launches the ball upward, and the
// ball shoves the player back instead of bouncing off an immovable object.
const BODY_POP = 430;         // minimum upward launch on body contact (px/s)
const BODY_MASS_MUL = 2.2;    // player's effective mass vs. the ball
const BALL_PUSH = 0.7;        // fraction of the collision impulse the player absorbs
const KNOCK_MAX = 280;        // cap on knockback so a hard shot can't fling a player

// Defensive clearance: when the ball is BEHIND a player (on their own-goal
// side), a kick fires it away from that goal instead of into the facing
// hemisphere. Slightly weaker than a real shot, so it clears rather than scores.
const CLEAR_MUL = 0.82;

/*
  Power Shot multiplier. Reduced from 3.1: that was tuned when a plain kick was
  only ~700 px/s. With KICK_BASE now 1180 a 3.1x shot pinned every team to the
  speed clamp, which flattened Shot Power exactly when it should matter. 1.9x on
  a much stronger base still lands harder than the old 3.1x did.
*/
const POWERSHOT_MUL = 1.9;

/*
  A moving ball that strikes a player knocks them back. The heavier the team the
  less they move; a fast shot hits much harder than a rolling ball. Capped so a
  max-power hit cannot fling anyone across the pitch.
*/
const BALL_KNOCK = 0.62;      // ball speed -> knockback conversion
const BALL_KNOCK_MIN = 260;   // ball must be at least this fast to knock back
const BALL_KNOCK_MAX = 900;   // hard cap on the resulting player speed
const BALL_KNOCK_STUN = 0.28; // brief stagger on a solid hit

/*
  Knockback is a POWER SHOT weapon, not a side effect of ordinary play. A normal
  kick never shoves the opponent; only a ball struck while the kicker held the
  Power Shot power-up does. `game.ballPowered` carries that "charged" state on
  the ball and is cleared the moment it is spent or the ball settles.
*/

/*
  Pistol: a pickup granting a few shots. A bullet travels flat and fast; it
  shoves the ball hard on impact and briefly stuns an opposing player. It is
  deliberately not a goal-scoring tool on its own — it moves the ball.
*/
const PISTOL_AMMO = 3;
const BULLET_SPD = 900;
const BULLET_R = 5;
const BULLET_LIFE = 1.6;
const BULLET_BALL_PUSH = 640; // impulse imparted to the ball
const BULLET_STUN = 0.5;
const BULLET_KNOCK = 300;
const PISTOL_CD = 0.32;       // between shots

// Goal-resize power-up: scales BOTH goals for a duration. >1 grows, <1 shrinks.
const GOAL_SIZE_BIG = 1.75;
const GOAL_SIZE_SMALL = 0.5;

/*
  Volleyball mode: a net at midfield, players confined to their own half, and a
  point is conceded when the ball touches the ground on your side. Goals are not
  used at all, so the scoring rule is entirely separate.
*/
const NET_W = 10;
const NET_H = 210;            // default net height above the grass
const VOLLEY_SETTLE = 0.25;   // grace after a point before the next serve

/*
  Basketball: a hoop on each side, mounted high on the wall. The ball scores by
  falling through the ring. Rims are small solid circles so shots can rattle out,
  and each hoop has a backboard the ball rebounds off.
*/
const HOOP_X = 96;            // ring centre distance from the wall
const HOOP_Y = 250;           // ring height
const HOOP_R = 34;            // ring half-width
const RIM_R = 5;              // rim thickness
const BOARD_W = 5;            // backboard thickness
const BOARD_H = 150;          // backboard height

/*
  Chaos mode: every CHAOS_EVERY seconds, re-roll every tunable in the game at
  once — gravity, ball bounce, player speed, goal motion, sizes. Bounds are kept
  inside playable limits and asserted by the test suite.
*/
const CHAOS_EVERY = 12;
const CHAOS_ANNOUNCE = 2.4;

/*
  Mines: hazards that spawn on the grass and punish careless chasing. A player
  who touches one is stunned briefly and flung back; the ball is launched hard.
*/
const MINE_R = 15;
const MINE_MIN = 11, MINE_MAX = 17;   // spawn interval (seconds)
const MINE_MAX_LIVE = 3;              // never more than this on the pitch
const MINE_ARM = 0.7;                 // seconds before a fresh mine is live
const MINE_LIFE = 22;                 // despawn if untouched
const MINE_STUN = 0.9;                // how long a player is disabled
const MINE_KNOCK = 430;               // player knockback speed
const MINE_BALL_V = 950;              // ball launch speed
const MINE_SAFE_X = 130;              // keep mines away from either goal mouth

// Match rules are configurable on the setup screen; these are the bounds and
// defaults. `game.goalsToWin` and `game.matchSecs` hold the live values.
const GOALS_MIN = 3;
const GOALS_MAX = 15;
const GOALS_DEFAULT = 5;

// Match clock. 0 means "no limit"; otherwise the match ends when it expires and
// whoever is ahead wins. OFF sorts first so the list reads low-to-high.
const TIME_OPTIONS = [0, 60, 90, 120, 180, 300];
const TIME_DEFAULT_IDX = 3;        // 120s

const CELEBRATE_T = 1.8;
const COUNTDOWN_T = 3.2;

/*
  Tournament: a single-elimination bracket for 2-8 hot-seat players sharing the
  two control schemes. Each round pairs the survivors; the winner of each tie
  advances. With an odd number of entrants one player gets a bye that round.
*/
const TOURN_MIN = 2;
const TOURN_MAX = 8;

/*
  Player names. Typed on the setup screen, persisted in localStorage so they
  survive a reload, and sent to the peer over the network so both screens show
  the same labels. Kept short so they fit the scoreboard.
*/
const NAME_MAX = 12;
const NAME_OK = /^[A-Za-z0-9 _.\-]$/;      // one printable character
const DEFAULT_NAMES = ["PLAYER 1", "PLAYER 2"];

/** Sanitise anything that arrives from storage or the network. */
function cleanName(raw, fallback) {
  const t = String(raw == null ? "" : raw)
    .replace(/[^A-Za-z0-9 _.\-]/g, "")
    .trim()
    .slice(0, NAME_MAX);
  return t || fallback;
}

function loadNames() {
  try {
    const raw = localStorage.getItem("headgame.names");
    if (!raw) return [...DEFAULT_NAMES];
    const arr = JSON.parse(raw);
    return [cleanName(arr[0], DEFAULT_NAMES[0]), cleanName(arr[1], DEFAULT_NAMES[1])];
  } catch (e) {
    // Private browsing, blocked storage, or corrupt JSON — defaults are fine.
    return [...DEFAULT_NAMES];
  }
}

function loadOpts(into) {
  try {
    const raw = localStorage.getItem("headgame.opts");
    if (!raw) return into;
    const o = JSON.parse(raw);
    for (const k of Object.keys(into)) if (typeof o[k] === "boolean") into[k] = o[k];
  } catch (e) {
    // Blocked or corrupt storage — the authored defaults are fine.
  }
  return into;
}

function saveOpts(o) {
  try { localStorage.setItem("headgame.opts", JSON.stringify(o)); }
  catch (e) { /* not fatal: options just won't persist */ }
}

/*
  LEADERBOARD

  A persistent win/loss record keyed by player name, stored in localStorage and
  shown on its own screen. Note the honest scope: with no server there is no
  worldwide table — this is every match played on THIS computer, including
  online matches (both names are recorded) and games against the CPU.

  Each record: { name, w, l, d, gf, ga, streak, best, last }
    w/l/d  wins, losses, draws
    gf/ga  goals (or points) for and against
    streak current run: positive = wins, negative = losses
    best   longest winning streak
    last   timestamp of the most recent match
*/
const LB_MAX = 60;              // keep the table bounded

function loadBoard() {
  try {
    const raw = localStorage.getItem("headgame.board");
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr
      .map((r) => ({
        name: cleanName(r && r.name, ""),
        w: Math.max(0, r.w | 0), l: Math.max(0, r.l | 0), d: Math.max(0, r.d | 0),
        gf: Math.max(0, r.gf | 0), ga: Math.max(0, r.ga | 0),
        streak: r.streak | 0, best: Math.max(0, r.best | 0),
        last: Number(r.last) || 0,
      }))
      .filter((r) => r.name);        // drop anything unnamed or corrupt
  } catch (e) {
    return [];                        // blocked or corrupt storage
  }
}

function saveBoard(board) {
  try {
    localStorage.setItem("headgame.board", JSON.stringify(board.slice(0, LB_MAX)));
  } catch (e) { /* not fatal: the table just won't persist */ }
}

/** Find or create a record for `name`. */
function boardRecord(name) {
  const clean = cleanName(name, "");
  if (!clean) return null;
  let r = game.board.find((x) => x.name === clean);
  if (!r) {
    r = { name: clean, w: 0, l: 0, d: 0, gf: 0, ga: 0, streak: 0, best: 0, last: 0 };
    game.board.push(r);
  }
  return r;
}

const lbPlayed = (r) => r.w + r.l + r.d;
const lbWinPct = (r) => (lbPlayed(r) ? (r.w / lbPlayed(r)) * 100 : 0);

/**
 * Rank the table: most wins first, then win rate, then goal difference.
 * Pure so the ordering can be asserted directly.
 */
function rankBoard(board) {
  return [...board].sort((a, b) =>
    b.w - a.w ||
    lbWinPct(b) - lbWinPct(a) ||
    (b.gf - b.ga) - (a.gf - a.ga) ||
    a.name.localeCompare(b.name));
}

/**
 * Record a finished match. `winner` is 0, 1 or -1 for a draw.
 * Called once per completed match, from finishMatch.
 */
function recordResult(winner, score) {
  // CPU seats are not people; don't pollute the table with them.
  const names = [0, 1].map((i) => (game.cpu[i] ? null : seatLabel(i)));
  const now = Date.now();

  for (let i = 0; i < 2; i++) {
    if (!names[i]) continue;
    const r = boardRecord(names[i]);
    if (!r) continue;
    const mine = score[i] | 0, theirs = score[1 - i] | 0;
    r.gf += mine;
    r.ga += theirs;
    r.last = now;
    if (winner === -1) {
      r.d++;
      r.streak = 0;
    } else if (winner === i) {
      r.w++;
      r.streak = r.streak > 0 ? r.streak + 1 : 1;
      r.best = Math.max(r.best, r.streak);
    } else {
      r.l++;
      r.streak = r.streak < 0 ? r.streak - 1 : -1;
    }
  }
  saveBoard(game.board);
}

function saveNames(names) {
  try { localStorage.setItem("headgame.names", JSON.stringify(names)); }
  catch (e) { /* not fatal: names just won't persist */ }
}
const SUDDEN_DEATH_T = 90;         // extra time cap when a knockout tie is drawn

/*
  SPAWN / RULE CONFIGURATION

  Everything the player can tune from the setup screen. Each entry declares its
  own range and step so the menu, the clamping and the tests all read from one
  place — adding a knob means adding a row here, not editing four screens.

  `mul` entries scale an authored constant; `flag` entries are on/off.
*/
const RULE_DEFS = [
  { key: "puRate",     label: "POWER-UP RATE",  type: "mul",  min: 0,   max: 4,   step: 0.25,
    hint: "how often power-ups appear (0 = off)" },
  { key: "puLife",     label: "POWER-UP LIFE",  type: "mul",  min: 0.5, max: 3,   step: 0.25,
    hint: "how long one waits before vanishing" },
  { key: "puMaxLive",  label: "MAX POWER-UPS",  type: "int",  min: 1,   max: 8,   step: 1,
    hint: "how many can sit on the pitch at once" },
  { key: "mineRate",   label: "MINE RATE",      type: "mul",  min: 0,   max: 4,   step: 0.25,
    hint: "how often mines appear (0 = off)" },
  { key: "mineMaxLive",label: "MAX MINES",      type: "int",  min: 1,   max: 8,   step: 1,
    hint: "how many can be armed at once" },
  { key: "chaosRate",  label: "CHAOS INTERVAL", type: "mul",  min: 0.25, max: 3,  step: 0.25,
    hint: "seconds between chaos re-rolls" },
  { key: "movingGoals",label: "MOVING GOALS",   type: "flag",
    hint: "normally only chaos slides the nets" },
];

/** Authored defaults, cloned into game.rules at boot. */
const RULE_DEFAULTS = {
  puRate: 1, puLife: 1, puMaxLive: 3,
  mineRate: 1, mineMaxLive: 3,
  chaosRate: 1, movingGoals: false,
};

const ruleDef = (key) => RULE_DEFS.find((r) => r.key === key);

/** Clamp one rule value to its declared range. */
function clampRule(key, v) {
  const d = ruleDef(key);
  if (!d) return v;
  if (d.type === "flag") return !!v;
  const c = clamp(Number(v), d.min, d.max);
  return d.type === "int" ? Math.round(c) : Math.round(c * 100) / 100;
}

function loadRules(into) {
  try {
    const raw = localStorage.getItem("headgame.rules");
    if (!raw) return into;
    const o = JSON.parse(raw);
    for (const d of RULE_DEFS) {
      if (o[d.key] !== undefined) into[d.key] = clampRule(d.key, o[d.key]);
    }
  } catch (e) {
    // Blocked or corrupt storage — authored defaults stand.
  }
  return into;
}

function saveRules(r) {
  try { localStorage.setItem("headgame.rules", JSON.stringify(r)); }
  catch (e) { /* not fatal */ }
}

/*
  Effective values, derived from the authored constants and the player's
  multipliers. A rate multiplier ABOVE 1 means "more often", so it divides the
  interval — the menu reads as the player expects rather than as the maths does.
*/
const puInterval = () => {
  const m = game.rules.puRate;
  if (m <= 0) return Infinity;                 // disabled
  return rand(PU_MIN, PU_MAX) / m;
};
const mineInterval = () => {
  const m = game.rules.mineRate;
  if (m <= 0) return Infinity;
  return rand(MINE_MIN, MINE_MAX) / m;
};
const puLifetime = () => PU_LIFE * game.rules.puLife;
const puCap = () => game.rules.puMaxLive;
const mineCap = () => game.rules.mineMaxLive;
const chaosInterval = () => CHAOS_EVERY * game.rules.chaosRate;

/*
  MAPS

  A map is a named set of platforms laid over the same pitch. Platforms are
  axis-aligned slabs that BOTH the ball and the players collide with, so they
  change routes and rebounds rather than being decoration.

  Each platform: { x, y, w, h, kind }
    kind "solid"  — collides from every side
    kind "bounce" — springy: the ball leaves faster than it arrived
    kind "ghost"  — the ball passes through, players stand on it

  Coordinates are authored in the 1000x600 logical space. `y` is the TOP of the
  slab. Anything that would sit inside a goal mouth is rejected at load time by
  the test suite, so a map cannot make a goal unreachable.
*/
const PLAT_H = 14;              // standard slab thickness
const PLAT_BOUNCE = 1.45;       // restitution multiplier for a bounce pad
const PLAT_REST = 0.62;         // restitution of a solid slab

const MAPS = [
  {
    id: "classic",
    name: "CLASSIC",
    hint: "open pitch, no platforms",
    platforms: [],
  },
  {
    id: "terraces",
    name: "TERRACES",
    hint: "stepped ledges either side",
    platforms: [
      { x: 210, y: 400, w: 150, h: PLAT_H, kind: "solid" },
      { x: 640, y: 400, w: 150, h: PLAT_H, kind: "solid" },
      { x: 400, y: 300, w: 200, h: PLAT_H, kind: "solid" },
    ],
  },
  {
    id: "towers",
    name: "TOWERS",
    hint: "tall pillars split the pitch",
    platforms: [
      { x: 300, y: 250, w: 26, h: 210, kind: "solid" },
      { x: 674, y: 250, w: 26, h: 210, kind: "solid" },
      { x: 430, y: 200, w: 140, h: PLAT_H, kind: "solid" },
    ],
  },
  {
    id: "trampolines",
    name: "TRAMPOLINES",
    hint: "springy pads fling the ball",
    platforms: [
      { x: 180, y: 430, w: 130, h: PLAT_H, kind: "bounce" },
      { x: 690, y: 430, w: 130, h: PLAT_H, kind: "bounce" },
      { x: 420, y: 330, w: 160, h: PLAT_H, kind: "bounce" },
    ],
  },
  {
    id: "cage",
    name: "THE CAGE",
    hint: "a lid over the middle",
    platforms: [

const mapById = (id) => MAPS.find((m) => m.id === id) || MAPS[0];

/** Platforms in play right now. Net modes stay clear so rallies aren't blocked. */
function activePlatforms() {
  if (modeCfg().net > 0) return [];
  return mapById(game.mapId).platforms;
}

/**
 * Resolve a circle against one slab. Pushes out along the shallowest axis and
 * reflects that component. Returns "top" | "bottom" | "side" | null so callers
 * can tell a landing from a head-bump.
 * Pure apart from mutating `b`.
 */
function resolvePlatform(b, pl, restitution) {
  const cx = clamp(b.x, pl.x, pl.x + pl.w);
  const cy = clamp(b.y, pl.y, pl.y + pl.h);
  const dx = b.x - cx, dy = b.y - cy;
  if (dx * dx + dy * dy >= b.r * b.r) return null;

  // Overlap on each axis, measured from the slab's faces.
  const left = (pl.x - b.r) - b.x;          // negative when overlapping
  const right = (pl.x + pl.w + b.r) - b.x;
  const top = (pl.y - b.r) - b.y;
  const bottom = (pl.y + pl.h + b.r) - b.y;

  // Choose the smallest push that separates them.
  const cand = [
    { d: Math.abs(top), ax: "y", to: pl.y - b.r, side: "top" },
    { d: Math.abs(bottom), ax: "y", to: pl.y + pl.h + b.r, side: "bottom" },
    { d: Math.abs(left), ax: "x", to: pl.x - b.r, side: "side" },
    { d: Math.abs(right), ax: "x", to: pl.x + pl.w + b.r, side: "side" },
  ].sort((p, q) => p.d - q.d)[0];

  if (cand.ax === "y") {
    b.y = cand.to;
    if (cand.side === "top" && b.vy > 0) b.vy = -b.vy * restitution;
    else if (cand.side === "bottom" && b.vy < 0) b.vy = -b.vy * restitution;
  } else {
    b.x = cand.to;
    const outward = Math.sign(cand.to - (pl.x + pl.w / 2)) || 1;
    if (Math.sign(b.vx) !== outward) b.vx = -b.vx * restitution;
  }
  return cand.side;
}

/** Ball vs. every platform on the current map. */
function ballVsPlatforms(b) {
  let hit = null;
  for (const pl of activePlatforms()) {
    if (pl.kind === "ghost") continue;                 // ball ignores these
    const rest = ballRest * (pl.kind === "bounce" ? PLAT_BOUNCE : PLAT_REST);
    const side = resolvePlatform(b, pl, rest);
    if (side) {
      hit = side;
      if (pl.kind === "bounce") {
        // Guarantee a lively kick off a pad rather than a limp tap.
        if (side === "top") b.vy = Math.min(b.vy, -320);
        burst(b.x, b.y, "#38bdf8", 6);
      }
      limitSpeed(b, BALL_MAX_V);
    }
  }
  return hit;
}

/** Players land on platforms; ghost slabs are solid underfoot. */
function playerVsPlatforms(p) {
  for (const pl of activePlatforms()) {
    // Treat the player as a circle and only support them from ABOVE, so a
    // platform never traps someone who jumped into its underside.
    const withinX = p.x > pl.x - p.r * 0.65 && p.x < pl.x + pl.w + p.r * 0.65;
    if (!withinX) continue;
    const feet = p.y + p.r;
    /*
      Land only when the feet have actually reached the surface. An earlier
      version snapped from a band ABOVE the slab too, which teleported a falling
      player up to 12px downward onto it — visibly wrong on the catwalk.
    */
    if (p.vy >= 0 && feet >= pl.y - 1 && feet <= pl.y + pl.h + 10) {
      p.y = pl.y - p.r;
      p.vy = 0;
      p.onGround = true;
    }
  }
}

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const len = (x, y) => Math.hypot(x, y);

function limitSpeed(v, max) {
  const s = len(v.vx, v.vy);
  if (s > max) { const k = max / s; v.vx *= k; v.vy *= k; }
  return v;
}

/* -------------------------------------------------- 3. PURE PHYSICS KERNEL

   Everything here is a pure function of its arguments (bodies are plain
   {x,y,vx,vy,r,mass} records). The self-test suite drives these directly.   */

/**
 * Semi-implicit Euler integration with drag. Mutates and returns `b`.
 * `g` is passed in explicitly (rather than read from the module-level
 * `gravity`) to keep this function pure and directly testable.
 */
function integrate(b, dt, g, drag) {
  b.vy += g * dt;
  if (drag) {
    const d = 1 - drag * dt;
    b.vx *= d;
    b.vy *= d;
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  return b;
}

/**
 * Resolve a moving circle against a static circle (post, leg tip).
 * Returns true when contact occurred.
 */
function resolveStaticCircle(b, cx, cy, cr, restitution) {
  const dx = b.x - cx, dy = b.y - cy;
  const d = len(dx, dy);
  const min = b.r + cr;
  if (d >= min || d === 0) return false;

  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * min;              // depenetrate
  b.y = cy + ny * min;

  const vn = b.vx * nx + b.vy * ny; // reflect only the normal component
  if (vn < 0) {
    b.vx -= (1 + restitution) * vn * nx;
    b.vy -= (1 + restitution) * vn * ny;
  }
  return true;
}

/**
 * Elastic-ish collision between two circles with mass. Mutates both.
 * `restitution` 0 = perfectly inelastic, 1 = perfectly elastic.
 * Returns true when contact occurred.
 */
function resolveCircles(a, b, restitution) {
  const dx = b.x - a.x, dy = b.y - a.y;
  let d = len(dx, dy);
  const min = a.r + b.r;
  if (d >= min) return false;
  if (d === 0) { d = 0.001; }

  const nx = dx / d, ny = dy / d;
  const overlap = min - d;
  const ma = a.mass, mb = b.mass, total = ma + mb;

  // Positional correction, split by inverse mass.
  a.x -= nx * overlap * (mb / total);
  a.y -= ny * overlap * (mb / total);
  b.x += nx * overlap * (ma / total);
  b.y += ny * overlap * (ma / total);

  // Impulse along the normal.
  const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  const vn = rvx * nx + rvy * ny;
  if (vn > 0) return true;                 // already separating

  const j = (-(1 + restitution) * vn) / (1 / ma + 1 / mb);
  a.vx -= (j / ma) * nx;
  a.vy -= (j / ma) * ny;
  b.vx += (j / mb) * nx;
  b.vy += (j / mb) * ny;
  return true;
}

/**
 * Is the ball inside a goal mouth? Returns -1 (left goal), 1 (right goal)
 * or 0. The scorer is the OPPOSITE side: ball in the left goal scores for P2.
 */
/**
 * Is the ball inside a goal mouth? Returns -1 (left goal), 1 (right goal)
 * or 0. The scorer is the OPPOSITE side: ball in the left goal scores for P2.
 *
 * The mouth is the band [goalTop(side), goalTop(side) + goalHeight()] — the SAME
 * band drawGoal paints. Both edges move with the goal: nailing the lower edge to
 * the ground would let a raised goal score on empty air beneath its net, and
 * would refuse a legitimate goal when the frame dips below the grass line.
 */
function goalScored(ball) {
  if (ball.x - ball.r < WALL + 2) {
    const top = goalTop(0), bot = goalBottom(0);
    return (ball.y + ball.r >= top && ball.y - ball.r <= bot) ? -1 : 0;
  }
  if (ball.x + ball.r > W - WALL - 2) {
    const top = goalTop(1), bot = goalBottom(1);
    return (ball.y + ball.r >= top && ball.y - ball.r <= bot) ? 1 : 0;
  }
  return 0;
}


/**
 * Kick impulse: direction blends "away from body" with facing + upward bias.
 * `up` defaults to KICK_UP; a Power Shot passes a smaller value to fire flatter.
 */
function kickImpulse(dx, dy, facing, power, proximity, up = KICK_UP) {
  const d = len(dx, dy) || 1;
  let ux = dx / d, uy = dy / d;
  ux = ux * 0.55 + facing * 0.65;          // bias downfield
  uy = uy * 0.55 - up;                     // bias upward (canvas y grows down)
  const m = len(ux, uy) || 1;
  const mag = power * lerp(0.55, 1, proximity);
  return { ix: (ux / m) * mag, iy: (uy / m) * mag };
}

/** Map a 1..5 stat pip count onto a multiplier around 1.0. */
function statToMultiplier(pips, spread) {
  return 1 + (pips - 3) * spread;
}

const SCHEME = [
  { left: "KeyA",      right: "KeyD",       up: "KeyW",     down: "KeyS",     kick: "KeyF"  },
  { left: "ArrowLeft", right: "ArrowRight", up: "ArrowUp",  down: "ArrowDown",kick: "Enter" },
];

/*
  INTENT is the single input channel the simulation reads. Nothing inside the
  physics touches `keys` directly, because a seat may be driven by:
    - the local keyboard,
    - the CPU,
    - or a remote peer over the network.
  Each seat's intent is filled in once per substep by `gatherIntent()`, and
  `kickEdge` is a one-shot flag so a held button fires a single kick.
*/
const intent = [
  { left: false, right: false, up: false, down: false, kick: false, kickEdge: false },
  { left: false, right: false, up: false, down: false, kick: false, kickEdge: false },
];

/** Pack a seat's intent into one byte, for the network. */
function packIntent(a) {
  return (a.left ? 1 : 0) | (a.right ? 2 : 0) | (a.up ? 4 : 0) |
         (a.down ? 8 : 0) | (a.kick ? 16 : 0) | (a.kickEdge ? 32 : 0);
}

/** Unpack a byte into a seat's intent object (mutates and returns `out`). */
function unpackIntent(byte, out) {
  out.left  = !!(byte & 1);
  out.right = !!(byte & 2);
  out.up    = !!(byte & 4);
  out.down  = !!(byte & 8);
  out.kick  = !!(byte & 16);
  out.kickEdge = !!(byte & 32);
  return out;
}

/**
 * Fill both seats' intent for this substep from whatever drives them.
 * `edge` is true only on the first substep of a rendered frame, so a keypress
 * produces exactly one kick regardless of how many substeps run.
 */
function gatherIntent(edge) {
  for (let i = 0; i < 2; i++) {
    const a = intent[i];
    if (net.active && net.remoteSeat === i && i >= 0) continue;  // filled by the network
    if (game.cpu[i]) continue;                          // filled by updateCPU
    const S = SCHEME[i];
    a.left  = !!keys[S.left];
    a.right = !!keys[S.right];
    a.up    = !!keys[S.up];
    a.down  = !!keys[S.down];
    a.kick  = kickDown(i);
    a.kickEdge = edge && kickHit(i);
  }
}

/*
  Edge-triggered input must fire exactly ONCE per keypress. Physics runs several
  substeps per rendered frame, so a naive `pressed[code]` read inside step() is
  seen by every substep — on a 60Hz display that advanced menus two at a time.
  `edgeFrame` is true only for the first substep of each frame; `hit()` is the
  only sanctioned way to read a press.
*/
let edgeFrame = true;
const hit = (code) => edgeFrame && !!pressed[code];

/*
  Set by any scene handler that consumes an ESC press, so the global pause
  shortcut later in the same step() does not act on it a second time.
*/
let escUsed = false;

// Numpad0 is an accepted alias for P2's kick.
const kickDown = (i) => keys[SCHEME[i].kick] || (i === 1 && keys.Numpad0);
const kickHit  = (i) => hit(SCHEME[i].kick) || (i === 1 && hit("Numpad0"));

function makeBall() {
  const c = modeCfg();
  return { x: W / 2, y: 200, vx: 0, vy: 0, r: c.ballR, mass: c.ballMass, bounces: 0 };
}

class Player {
  constructor(index, team) {
    this.index = index;                 // 0 = left, 1 = right
    this.team = team;
    this.facing = index === 0 ? 1 : -1;
    this.baseR = PLAYER_R * statToMultiplier(team.size, 0.13);
    this.r = this.baseR;
    this.mass = 3 * statToMultiplier(team.size, 0.3);
    this.accel = PLAYER_ACCEL * statToMultiplier(team.speed, 0.16);
    this.maxv = PLAYER_MAXV * statToMultiplier(team.speed, 0.16);
    this.jumpV = PLAYER_JUMP * statToMultiplier(team.jump, 0.14);
    this.shotP = KICK_BASE * statToMultiplier(team.shot, 0.17);
    this.effects = Object.create(null); // type -> remaining seconds
    this.reset();
    this.applyChaos();                  // pick up any live chaos multipliers
  }

  reset() {
    // Volleyball starts each side deeper in its own half, clear of the net.
    this.x = modeCfg().confine
      ? (this.index === 0 ? W * 0.22 : W * 0.78)
      : (this.index === 0 ? W * 0.27 : W * 0.73);
    this.y = GROUND_Y - this.r;
    this.vx = 0; this.vy = 0;
    this.onGround = true;
    this.kickT = 0;                     // >0 while swinging
    this.kickCD = 0;
    this.kickConsumed = false;
    this.stun = 0;                      // >0 while disabled by a mine
    this.ammo = 0;                      // pistol rounds remaining
    this.fireCD = 0;
    this.facing = this.index === 0 ? 1 : -1;
    this.effects = Object.create(null);
    this.applySize();
  }

  applySize() {
    let s = playerSizeMul;                 // chaos mode scales everyone
    if (this.effects.bigger)  s *= 1.55;
    if (this.effects.smaller) s *= 0.62;
    this.r = this.baseR * s;
    this.massNow = this.mass * s * s;
  }

  /**
   * Recompute stats that depend on the chaos multipliers. Called on every chaos
   * roll and on reset, so a re-roll is felt immediately without rebuilding
   * the player (which would lose their active power-ups and position).
   */
  applyChaos() {
    const t = this.team;
    this.accel = PLAYER_ACCEL * statToMultiplier(t.speed, 0.16) * playerSpeedMul;
    this.maxv  = PLAYER_MAXV  * statToMultiplier(t.speed, 0.16) * playerSpeedMul;
    this.jumpV = PLAYER_JUMP  * statToMultiplier(t.jump, 0.14)  * playerJumpMul;
    this.applySize();
  }

  grant(type) {
    // Jetpack is a BALL effect, not a player buff — it lives on game state so
    // it keeps running regardless of what happens to whoever picked it up.
    if (type === "jetpack") {
      game.jetpack = POWERUPS.jetpack.dur;
      game.jetpackOwner = this.index;
      this.effects.jetpack = POWERUPS.jetpack.dur;   // for the HUD chip only
      return;
    }

    // Keeper / striker spawn an AI helper owned by this player. One of each
    // kind per player: re-grabbing refreshes rather than stacking a second.
    if (type === "keeper" || type === "striker") {
      spawnHelper(this.index, type);
      this.effects[type] = POWERUPS[type].dur;
      return;
    }

    // Pistol grants ammo rather than a timed buff. Picking up more tops it up.
    if (type === "pistol") {
      this.ammo = Math.min(this.ammo + PISTOL_AMMO, PISTOL_AMMO * 2);
      this.effects.pistol = POWERUPS.pistol.dur;
      return;
    }

    // Goal resize is a WORLD effect: it changes both goals for both players.
    if (type === "bigGoals" || type === "tinyGoals") {
      game.goalFx = type;
      game.goalFxT = POWERUPS[type].dur;
      goalScale = type === "bigGoals" ? GOAL_SIZE_BIG : GOAL_SIZE_SMALL;
      this.effects[type] = POWERUPS[type].dur;   // HUD attribution only
      return;
    }

    // Bigger and Smaller cancel rather than compounding.
    if (type === "bigger" && this.effects.smaller) { delete this.effects.smaller; this.applySize(); return; }
    if (type === "smaller" && this.effects.bigger) { delete this.effects.bigger; this.applySize(); return; }
    this.effects[type] = POWERUPS[type].dur;
    this.applySize();
  }

  get legTip() {
    // Leg swings from behind the body through to fully extended forward.
    const t = this.kickT > 0 ? 1 - this.kickT / KICK_TIME : 0;
    const ang = lerp(-0.9, 0.75, t);            // radians from horizontal
    const reach = this.r + LEG_LEN * lerp(0.45, 1, t);
    return {
      x: this.x + Math.cos(ang) * reach * this.facing,
      y: this.y + Math.sin(ang) * reach * 0.75 + this.r * 0.35,
      r: LEG_R,
      t,
    };
  }

  update(dt, other) {
    const act = intent[this.index];     // keyboard, CPU or remote — same shape
    const spdMul = this.effects.speed ? 1.5 : 1;
    const jmpMul = this.effects.powerjump ? 1.45 : 1;

    // Mine stun: no input is accepted, but gravity and collisions still apply
    // so the player falls and can be shoved while helpless.
    if (this.stun > 0) this.stun = Math.max(0, this.stun - dt);
    const stunned = this.stun > 0;

    let dir = 0;
    if (!stunned) {
      if (act.left)  dir -= 1;
      if (act.right) dir += 1;
      if (dir !== 0) this.facing = dir;
    }

    const ctl = this.onGround ? 1 : PLAYER_AIR_CTL;
    if (dir !== 0) {
      this.vx += dir * this.accel * spdMul * ctl * dt;
      const mv = this.maxv * spdMul;
      this.vx = clamp(this.vx, -mv, mv);
    } else if (this.onGround) {
      this.vx -= this.vx * clamp(PLAYER_FRICTION * dt, 0, 1);
    }

    if (!stunned && act.up && this.onGround) {
      // Scaled by jumpScale() so jump HEIGHT survives a gravity re-roll while
      // airtime still changes — see the note by GRAV_MIN_MUL.
      this.vy = -this.jumpV * jmpMul * jumpScale();
      this.onGround = false;
    }
    if (!stunned && act.down && !this.onGround) this.vy += gravity * 0.9 * dt;  // fast-fall

    this.vy += gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Ground + walls.
    if (this.y + this.r >= GROUND_Y) {
      this.y = GROUND_Y - this.r;
      if (this.vy > 0) this.vy = 0;
      this.onGround = true;
    } else if (this.vy !== 0) {
      this.onGround = false;
    }
    this.x = clamp(this.x, WALL + this.r, W - WALL - this.r);
    if (this.y - this.r < 0) { this.y = this.r; if (this.vy < 0) this.vy = 0; }

    // Kick / fire timers.
    if (this.fireCD > 0) this.fireCD -= dt;
    if (this.kickCD > 0) this.kickCD -= dt;
    if (this.kickT > 0) {
      this.kickT -= dt;
      if (this.kickT <= 0) { this.kickT = 0; this.kickConsumed = false; }
    }

    // Effect timers.
    for (const k in this.effects) {
      this.effects[k] -= dt;
      if (this.effects[k] <= 0) { delete this.effects[k]; this.applySize(); }
    }

    // Body-vs-body shove.
    if (other) {
      const a = { x: this.x,  y: this.y,  vx: this.vx,  vy: this.vy,  r: this.r,  mass: this.massNow };
      const b = { x: other.x, y: other.y, vx: other.vx, vy: other.vy, r: other.r, mass: other.massNow };
      if (resolveCircles(a, b, 0.25)) {
        this.x = a.x; this.y = a.y; this.vx = a.vx; this.vy = a.vy;
        other.x = b.x; other.y = b.y; other.vx = b.vx; other.vy = b.vy;
        this.x = clamp(this.x, WALL + this.r, W - WALL - this.r);
        other.x = clamp(other.x, WALL + other.r, W - WALL - other.r);
      }
    }
  }

  /**
   * Fire the pistol if armed. Returns the new bullet, or null.
   * Bullets travel flat in the facing direction.
   */
  tryFire() {
    if (this.stun > 0 || this.ammo <= 0 || this.fireCD > 0) return null;
    this.ammo--;
    this.fireCD = PISTOL_CD;
    if (this.ammo === 0) delete this.effects.pistol;
    const b = {
      owner: this.index,
      x: this.x + this.facing * (this.r + BULLET_R + 2),
      y: this.y - this.r * 0.15,
      vx: this.facing * BULLET_SPD,
      vy: 0,
      r: BULLET_R,
      life: BULLET_LIFE,
    };
    game.bullets.push(b);
    game.shake = Math.max(game.shake, 0.1);
    burst(b.x, b.y, "#fff7ed", 5);
    return b;
  }

  tryStartKick() {
    if (this.stun > 0) return false;
    if (this.kickT === 0 && this.kickCD <= 0) {
      this.kickT = KICK_TIME;
      this.kickCD = KICK_TIME + KICK_COOLDOWN;
      this.kickConsumed = false;
      return true;
    }
    return false;
  }
}

const SCENE = {
  MENU: "menu",             // mode + rules setup
  SELECT: "select",         // team picking for the two players in this tie
  COUNTDOWN: "countdown",
  PLAY: "play",
  CELEBRATE: "celebrate",
  WIN: "win",               // end of a single match / tie
  ONLINE: "online",         // connection setup for peer-to-peer play
  ROSTER: "roster",         // name the tournament entrants
  BRACKET: "bracket",       // tournament standings between ties
  CHAMPION: "champion",     // tournament winner
  PAUSE: "pause",           // in-game overlay: resume / settings / quit
  SETTINGS: "settings",     // adjustable options, reachable from menu or pause
  BOARD: "board",           // win/loss leaderboard
  RULES: "rules",           // spawn rates and world toggles
};

/*
  The pause overlay remembers which scene it interrupted so RESUME can put the
  match back exactly where it was, including mid-countdown or mid-celebration.
*/
const PAUSE_ITEMS = ["resume", "settings", "board", "restart", "quit"];
const SETTINGS_ITEMS = ["shake", "particles", "flash", "sfxhint", "back"];

const MODE = {
  SINGLE: "single",
  TOURNAMENT: "tournament",
  VOLLEY: "volley",          // net at midfield, ball on the ground concedes
  TENNIS: "tennis",          // low net, ball may bounce ONCE per side
  BASKET: "basket",          // elevated hoops, ball through the hoop scores
};
// Cycled by the MODE row, in order.
const MODE_ORDER = [MODE.SINGLE, MODE.VOLLEY, MODE.TENNIS, MODE.BASKET, MODE.TOURNAMENT];

/*
  Per-mode ball and rule configuration. `modeCfg()` is the single source of
  truth: physics, rendering and scoring all read it rather than testing the mode
  by hand, so adding a mode does not mean hunting for every `if (mode === ...)`.

    ballR / ballMass  — size and weight of the ball
    grav / drag       — gravity and air-drag multipliers applied to the ball
    rest              — bounce restitution
    knockback         — whether a power-shot ball can shove players
    net               — net height above the grass, or 0 for none
    confine           — players locked to their own half
    goals             — soccer goals in play
*/
const MODE_CFG = {
  [MODE.SINGLE]:     { ballR: 14, ballMass: 1,    grav: 1,    drag: 1,   rest: 1,
                       knockback: true,  net: 0,   confine: false, goals: true },
  [MODE.TOURNAMENT]: { ballR: 14, ballMass: 1,    grav: 1,    drag: 1,   rest: 1,
                       knockback: true,  net: 0,   confine: false, goals: true },
  // Volleyball: a big, light, floaty ball that never shoves anyone.
  // Volleyball: big, light and springy — the ball should keep a rally alive.
  [MODE.VOLLEY]:     { ballR: 22, ballMass: 0.45, grav: 0.52, drag: 1.35, rest: 1.16,
                       knockback: false, net: 210, confine: true,  goals: false },
  // Tennis: small, quick, very bouncy ball over a low net.
  [MODE.TENNIS]:     { ballR: 10, ballMass: 0.6,  grav: 1.45, drag: 0.45, rest: 1.02,
                       knockback: false, net: 110, confine: true,  goals: false },
  /*
    Basketball: a genuinely bouncy ball. It was the second-least bouncy mode in
    the game (0.78) while also needing the tightest aim, which made scoring
    rare. Smaller and springier, with lower gravity for a floatier arc.
  */
  [MODE.BASKET]:     { ballR: 15, ballMass: 1.0,  grav: 0.78, drag: 0.95, rest: 1.06,
                       knockback: true,  net: 0,   confine: false, goals: false },
};
const modeCfg = () => MODE_CFG[game.mode] || MODE_CFG[MODE.SINGLE];
const MODE_LABEL = {
  [MODE.SINGLE]: "SOCCER",
  [MODE.VOLLEY]: "VOLLEYBALL",
  [MODE.TENNIS]: "TENNIS",
  [MODE.BASKET]: "BASKETBALL",
  [MODE.TOURNAMENT]: "TOURNAMENT",
};
const MODE_HINT = {
  [MODE.SINGLE]: "goals, power-ups, moving nets",
  [MODE.VOLLEY]: "big light ball — don't let it land",
  [MODE.TENNIS]: "low net, one bounce per side",
  [MODE.BASKET]: "shoot through the hoops",
  [MODE.TOURNAMENT]: "knockout bracket, hot-seat",
};

// Setup rows on the menu, navigated with either player's up/down.
/*
  Records the geometry the drawing code actually produced, so the test suite can
  assert that every row landed on screen instead of re-deriving the maths.
*/
const layoutProbe = { menu: null };

/*
  Counts what the renderer actually painted on the last frame. Assertions read
  this instead of merely calling a draw function and checking it did not throw —
  which is how an unpainted arena shipped once already.
*/
const drawProbe = { platforms: 0, faces: 0 };

/*
  MENU ATTRACT SCENE

  A small self-contained simulation that plays behind the main menu: two idle
  characters knocking a ball about. It is deliberately separate from `game` so
  the menu can never disturb match state, and it runs on its own clock so the
  menu animates even before a match exists.
*/
const menuFx = {
  t: 0,
  ball: { x: 500, y: 140, vx: 150, vy: 0, r: 15 },
  heads: [
    { x: 200, y: 0, vy: 0, phase: 0.0, face: "grin", hat: "cap", team: 0 },
    { x: 800, y: 0, vy: 0, phase: 2.1, face: "cool", hat: "crown", team: 4 },
  ],
  confetti: [],
};

/** Advance the attract scene. Purely cosmetic; never touches `game`. */
function stepMenuFx(dt) {
  menuFx.t += dt;
  const floor = H - 96;

  // Ball: simple bounce inside the panel area.
  const b = menuFx.ball;
  b.vy += 900 * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  if (b.y + b.r > floor) { b.y = floor - b.r; b.vy = -Math.abs(b.vy) * 0.86; }
  if (b.vy > -40 && b.y + b.r >= floor - 1) b.vy = -560;      // keep it lively
  if (b.x - b.r < 40) { b.x = 40 + b.r; b.vx = Math.abs(b.vx); }
  if (b.x + b.r > W - 40) { b.x = W - 40 - b.r; b.vx = -Math.abs(b.vx); }

  // Heads bob, and hop when the ball comes near.
  for (const h of menuFx.heads) {
    h.phase += dt * 1.7;
    const rest = floor - 34;
    h.vy += 1500 * dt;
    h.y += h.vy * dt;
    if (h.y > rest) { h.y = rest; h.vy = 0; }
    if (h.y >= rest - 0.5 && Math.abs(b.x - h.x) < 150 && b.y < rest) h.vy = -430;
  }
}

/** The attract scene, drawn behind the menu chrome. */
function drawMenuBackdrop() {
  const floor = H - 96;

  // Deep gradient sky.
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#070c17");
  sky.addColorStop(0.55, "#0d1a2e");
  sky.addColorStop(1, "#122a3f");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stadium glow behind the title.
  const glow = ctx.createRadialGradient(W / 2, 90, 20, W / 2, 90, 420);
  glow.addColorStop(0, "rgba(125,211,252,0.20)");
  glow.addColorStop(1, "rgba(125,211,252,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, 400);

  // Crowd speckle.
  for (let i = 0; i < 150; i++) {
    const x = (i * 97.3) % W;
    const y = 18 + ((i * 53) % 120);
    ctx.fillStyle = i % 4 === 0 ? "rgba(56,102,150,0.55)" : "rgba(30,60,92,0.5)";
    ctx.fillRect(x, y, 5, 4);
  }

  // Grass strip along the bottom.
  ctx.fillStyle = "#14622b";
  ctx.fillRect(0, floor, W, H - floor);
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let x = 0; x < W; x += 90) ctx.fillRect(x, floor, 45, H - floor);
  ctx.strokeStyle = "rgba(255,255,255,0.18)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, floor);
  ctx.lineTo(W, floor);
  ctx.stroke();

  // The two idle characters, then the ball on top.
  for (const h of menuFx.heads) {
    const team = TEAMS[h.team];
    const r = 32 + Math.sin(h.phase) * 1.5;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(h.x, floor + 4, r * 0.9, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    const g = ctx.createRadialGradient(h.x - r * 0.3, h.y - r * 0.4, r * 0.2, h.x, h.y, r);
    g.addColorStop(0, team.accent);
    g.addColorStop(1, team.color);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 3;
    ctx.stroke();
    const facing = h.x < W / 2 ? 1 : -1;
    const mood = h.vy < -50 ? "kick" : "idle";
    drawFace(h.x, h.y, r, facing, h.face, mood, team);
    drawHat(h.x, h.y, r, facing, h.hat, team);
    ctx.globalAlpha = 1;
  }

  const b = menuFx.ball;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(b.x, floor + 3, b.r, b.r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fdfdfd";
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#243244";
  ctx.lineWidth = 2;
  ctx.stroke();
  const rot = b.x / b.r;
  ctx.fillStyle = "#243244";
  for (let i = 0; i < 5; i++) {
    const a = rot + (i * Math.PI * 2) / 5;
    ctx.beginPath();
    ctx.arc(b.x + Math.cos(a) * b.r * 0.5, b.y + Math.sin(a) * b.r * 0.5, b.r * 0.19, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Vignette so the chrome above stays legible.
  ctx.fillStyle = "rgba(6,11,20,0.55)";
  ctx.fillRect(0, 0, W, H);
}

/** The wordmark: layered, with a ball for the O. */
function drawLogo(cx, cy) {
  const pulse = 1 + Math.sin(menuFx.t * 2) * 0.012;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(pulse, pulse);

  const big = 54;
  ctx.font = `900 ${big}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // Drop shadow, then a coloured underlay, then the face.
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillText("HEAD GAME", 4, 5);
  ctx.fillStyle = "#0ea5e9";
  ctx.fillText("HEAD GAME", 0, 3);
  const grad = ctx.createLinearGradient(0, -big / 2, 0, big / 2);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(1, "#bae6fd");
  ctx.fillStyle = grad;
  ctx.fillText("HEAD GAME", 0, 0);
  ctx.restore();
}

const MENU_ROWS = ["name1", "name2", "mode", "map", "opponent", "cpulevel", "players", "goals", "time", "chaos", "rules", "online", "board", "settings", "start"];

/**
 * Which setup rows are currently visible. PLAYERS only applies to a tournament;
 * OPPONENT is meaningless there (every seat is a human taking turns); and the
 * CPU level only matters once the CPU is switched on.
 */
function menuRows() {
  return MENU_ROWS.filter((r) => {
    if (r === "players") return game.mode === MODE.TOURNAMENT;
    if (r === "opponent") return game.mode !== MODE.TOURNAMENT;
    if (r === "cpulevel") return game.mode !== MODE.TOURNAMENT && game.cpu[1];
    if (r === "online") return true;
    if (r === "settings") return true;
    if (r === "board") return true;
    if (r === "rules") return true;
    // Platforms would block a volleyball or tennis rally, so no map choice there.
    if (r === "map") return modeCfg().net === 0;
    // The second name only matters when a second human shares this keyboard.
    if (r === "name2") return game.mode !== MODE.TOURNAMENT && !game.cpu[1] && !net.active;
    return true;
  });
}

  flash: 0,
  gravMul: 1,          // current gravity as a multiple of GRAVITY
  gravAnnounce: 0,     // >0 while the "new gravity" banner shows
};

/* ---- tournament ---------------------------------------------------------- */

/**
 * Pair up the surviving entrants for a round. Returns [[a, b], ...] where the
 * second element is null for a bye (odd number of survivors).
 * Pure: takes and returns plain data.
 */
function buildPairs(aliveIds) {
  const pairs = [];
  for (let i = 0; i < aliveIds.length; i += 2) {
    pairs.push([aliveIds[i], aliveIds[i + 1] ?? null]);
  }
  return pairs;
}

const aliveEntrants = () => game.entrants.filter((e) => e.alive);
const entrantById = (id) => game.entrants.find((e) => e.id === id) || null;

/** Total ties (byes excluded) needed to go from n entrants to a champion. */
function tiesRemaining(n) {
  return Math.max(0, n - 1);
}

function startTournament() {
  game.entrants = [];
  for (let i = 0; i < game.entrantCount; i++) {
    // Seats 0 and 1 inherit the names typed on the setup screen; the rest get
    // numbered defaults that can be renamed on the roster screen.
    const preset = game.rosterNames[i];
    /*
      Ownership decides who controls this entrant. Online, seed 1 belongs to the
      host and seed 2 to the guest, so their meeting is the online tie; the rest
      are local players on the host's keyboard (or CPUs if that was chosen).
    */
    let owner = "host";
    if (net.active) owner = i === 1 ? "guest" : "host";
    if (!net.active && i > 0 && game.cpu[1] && game.entrantCount === 2) owner = "cpu";
    game.entrants.push({
      id: i,
      name: cleanName(preset || (i < 2 ? game.names[i] : ""), `PLAYER ${i + 1}`),
      teamIdx: null,
      alive: true,
      owner,
    });
  }
  game.round = 0;
  game.champion = null;
  game.lastResult = null;
  beginRound();
}

function beginRound() {
  const alive = aliveEntrants().map((e) => e.id);
  if (alive.length <= 1) {
    game.champion = alive.length === 1 ? entrantById(alive[0]) : null;
    game.scene = SCENE.CHAMPION;
    netSendBracket();
    return;
  }
  game.round++;
  game.roundPairs = buildPairs(alive);
  game.tieIndex = 0;
  game.scene = SCENE.BRACKET;
  netSendBracket();
}

/**
 * Advance past any byes, then either seat the next tie or finish the round.
 * A bye advances its entrant without a match being played.
 */
function nextTie() {
  while (game.tieIndex < game.roundPairs.length) {
    const [a, b] = game.roundPairs[game.tieIndex];
    if (b === null) {                    // bye: `a` advances untouched
      game.tieIndex++;
      continue;
    }
    game.seats = [a, b];
    game.sel = [
      entrantById(a).teamIdx ?? 0,
      entrantById(b).teamIdx ?? 3,
    ];
    game.locked = [false, false];
    applyTieControl();
    game.scene = SCENE.SELECT;
    netSendBracket();
    return;
  }
  // Round complete: eliminate nobody further, just start the next round.
  beginRound();
}

/** Record a finished tie and move the bracket along. */
function resolveTie(winnerSeat, byTime) {
  const winId = game.seats[winnerSeat];
  const loseId = game.seats[1 - winnerSeat];
  const loser = entrantById(loseId);
  if (loser) loser.alive = false;

  // Remember each entrant's chosen team so it persists across rounds.
  for (let s = 0; s < 2; s++) {
    const e = entrantById(game.seats[s]);
    if (e && game.players[s]) e.teamIdx = TEAMS.indexOf(game.players[s].team);
  }

  game.lastResult = {
    winnerId: winId,
    loserId: loseId,
    score: [...game.score],
    byTime,
  };
  game.tieIndex++;
  netSendBracket();
}

/* ---- match lifecycle ----------------------------------------------------- */

function startMatch() {
  game.players[0] = new Player(0, TEAMS[game.sel[0]]);
  game.players[1] = new Player(1, TEAMS[game.sel[1]]);
  game.score = [0, 0];
  game.powerups = [];
  game.mines = [];
  game.helpers = [];
  game.bullets = [];
  game.jetpack = 0;
  game.jetpackOwner = -1;
  game.goalFx = null;
  game.goalFxT = 0;
  goalScale = 1;
  game.volleyT = 0;
  resetChaos();               // authored defaults; chaos re-rolls on its timer
  game.particles = [];
  game.puTimer = puInterval();
  game.mineTimer = mineInterval();
  game.matchSecs = TIME_OPTIONS[game.timeIdx];
  game.clock = game.matchSecs;
  game.ballPowered = false;
  game.ballPoweredBy = -1;
  game.lastBounceSide = -1;
  game.ballSide = -1;
  for (const pl of game.players) if (pl) pl.ai = null;   // fresh AI memory
  game.suddenDeath = false;
  kickoff(0, false);          // opening kickoff: normal gravity
}

/**
 * The clock ran out. Whoever leads wins. A draw in a single match is reported
 * as a draw; a draw in a tournament tie MUST produce a winner, so it goes to
 * sudden death (next goal wins, with its own time cap).
 */
function timeExpired() {
  const [a, b] = game.score;
  if (a !== b) {
    finishMatch(a > b ? 0 : 1, true);
    return;
  }
  if (game.mode === MODE.TOURNAMENT) {
    game.suddenDeath = true;
    game.clock = SUDDEN_DEATH_T;
    game.gravAnnounce = 0;
    kickoff(0, true);
    return;
  }
  finishMatch(-1, true);            // -1 = draw, single match only
}

/** End the current match. `winner` is 0, 1, or -1 for a draw. */
function finishMatch(winner, byTime) {
  game.winner = winner;
  game.byTime = !!byTime;
  game.scene = SCENE.WIN;
  game.timer = 0;
  // A guest is only mirroring the host's world; the host records the result so
  // the same match is not counted twice on one machine.
  if (!netIsGuest()) recordResult(winner, game.score);
  if (game.mode === MODE.TOURNAMENT && winner >= 0) resolveTie(winner, byTime);
}

/**
 * Reset for a kickoff. `reroll` is false for the opening kickoff of a match
 * (everyone starts on level terms) and true after a goal, where gravity is
 * re-rolled so each restart plays differently.
 */
function kickoff(towards, reroll = true) {
  if (reroll) {
    game.gravMul = rand(GRAV_MIN_MUL, GRAV_MAX_MUL);
    game.gravAnnounce = 2.6;      // seconds to show the new-gravity banner
  } else {
    game.gravMul = 1;
    game.gravAnnounce = 0;
  }
  gravity = GRAVITY * game.gravMul;

  game.ball = makeBall();
  game.ball.vx = towards * 40;
  if (hasNet()) {
    // Serve over the side that just conceded, well clear of the net, and high
    // enough that it never spawns inside the netting.
    const serveSide = towards <= 0 ? 0 : 1;
    game.ball.x = serveSide === 0 ? W * 0.25 : W * 0.75;
    game.ball.y = Math.min(150, netTop() - 60);
    game.ball.vx = 0;
  }
  game.players[0].reset();
  game.players[1].reset();
  game.powerups = [];
  game.mines = [];
  game.mineTimer = mineInterval();
  game.helpers = [];
  game.bullets = [];
  game.jetpack = 0;
  game.jetpackOwner = -1;
  game.goalFx = null;
  game.goalFxT = 0;
  if (!game.chaos) goalScale = 1;    // chaos keeps its rolled goal size
  game.volleyT = 0;
  game.ballPowered = false;
  game.ballPoweredBy = -1;
  game.lastBounceSide = -1;
  game.ballSide = -1;
  game.timer = COUNTDOWN_T;
  game.scene = SCENE.COUNTDOWN;
}

function burst(x, y, color, n = 34) {
  if (!game.opt.particles) return;      // honour the setting at the source
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(60, 420);
    game.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120,
      life: rand(0.5, 1.3), max: 1.3, color, r: rand(2, 5),
    });
  }
}

function scoreGoal(side) {
  // side === -1: ball entered the LEFT goal, so the right player (P2) scored.
  const scorer = side === -1 ? 1 : 0;
  game.score[scorer]++;
  game.lastScorer = scorer;
  game.scene = SCENE.CELEBRATE;
  game.timer = CELEBRATE_T;
  game.shake = 0.45;
  game.flash = 0.4;
  burst(game.ball.x, game.ball.y, game.players[scorer].team.color, 46);

  // Sudden death: the first goal settles a drawn knockout tie immediately.
  if (game.suddenDeath) {
    finishMatch(scorer, false);
    return;
  }
  if (game.score[scorer] >= game.goalsToWin) finishMatch(scorer, false);
}

/**
 * Volleyball point. Shares the celebration/win path with scoreGoal so the
 * clock, sudden death and match-end rules behave identically.
 */
function scoreVolleyPoint(scorer) {
  game.score[scorer]++;
  game.lastScorer = scorer;
  game.scene = SCENE.CELEBRATE;
  game.timer = CELEBRATE_T;
  game.shake = 0.4;
  game.flash = 0.32;
  burst(game.ball.x, GROUND_Y - 10, game.players[scorer].team.color, 38);

  if (game.suddenDeath) { finishMatch(scorer, false); return; }
  if (game.score[scorer] >= game.goalsToWin) finishMatch(scorer, false);
}

/* ---- power-up lifecycle -------------------------------------------------- */

/* ---- mines ---------------------------------------------------------------- */

function spawnMine() {
  // Keep mines out of both goal mouths so they can't make a goal unavoidable.
  game.mines.push({
    x: rand(WALL + MINE_SAFE_X, W - WALL - MINE_SAFE_X),
    y: GROUND_Y - MINE_R,
    arm: MINE_ARM,          // counts down; not dangerous until 0
    life: MINE_LIFE,
    pulse: rand(0, Math.PI * 2),
  });
}

/** Detonate a mine: stun+fling any player, launch the ball. */
function detonateMine(m, i) {
  game.mines.splice(i, 1);
  game.shake = Math.max(game.shake, 0.5);
  burst(m.x, m.y, "#ff8a3d", 30);
  burst(m.x, m.y, "#ffd166", 18);
}

function updateMines(dt) {
  game.mineTimer -= dt;
  if (game.mineTimer <= 0) {
    if (game.rules.mineRate > 0 && game.mines.length < mineCap()) spawnMine();
    game.mineTimer = mineInterval();
  }

  for (let i = game.mines.length - 1; i >= 0; i--) {
    const m = game.mines[i];
    m.pulse += dt * 4;
    if (m.arm > 0) { m.arm -= dt; continue; }     // still arming: harmless
    m.life -= dt;
    if (m.life <= 0) { game.mines.splice(i, 1); continue; }

    // Player contact: stun and fling away from the blast.
    let blown = false;
    for (const pl of game.players) {
      if (len(pl.x - m.x, pl.y - m.y) < pl.r + MINE_R) {
        pl.stun = MINE_STUN;
        const away = pl.x >= m.x ? 1 : -1;
        pl.vx = away * MINE_KNOCK;
        pl.vy = -MINE_KNOCK * 0.8;
        pl.onGround = false;
        pl.kickT = 0;
        detonateMine(m, i);
        blown = true;
        break;
      }
    }
    if (blown) continue;

    // Ball contact: launch it violently, biased upward and away.
    const b = game.ball;
    if (len(b.x - m.x, b.y - m.y) < b.r + MINE_R) {
      const away = b.x >= m.x ? 1 : -1;
      b.vx = away * MINE_BALL_V * rand(0.5, 0.9);
      b.vy = -MINE_BALL_V * rand(0.75, 1);
      limitSpeed(b, BALL_MAX_V);
      detonateMine(m, i);
    }
  }
}

function spawnPowerup() {
  const type = PU_KEYS[(Math.random() * PU_KEYS.length) | 0];
  game.powerups.push({
    type,
    x: rand(W * 0.2, W * 0.8),
    y: rand(PU_Y_HIGH, PU_Y_LOW),
    life: puLifetime(),
    bob: rand(0, Math.PI * 2),
  });
}

function updatePowerups(dt) {
  game.puTimer -= dt;
  if (game.puTimer <= 0) {
    // Re-check the rule here: a timer armed before the player set the rate to
    // zero would otherwise fire one last time after spawning was turned off.
    if (game.rules.puRate > 0 && game.powerups.length < puCap()) spawnPowerup();
    game.puTimer = puInterval();
  }

  for (let i = game.powerups.length - 1; i >= 0; i--) {
    const p = game.powerups[i];
    p.life -= dt;
    p.bob += dt * 3;
    if (p.life <= 0) { game.powerups.splice(i, 1); continue; }

    for (const pl of game.players) {
      if (len(pl.x - p.x, pl.y - p.y) < pl.r + PU_R) {
        pl.grant(p.type);
        burst(p.x, p.y, POWERUPS[p.type].color, 18);
        game.powerups.splice(i, 1);
        break;
      }
    }
  }
}

/* ---- AI helpers (goalkeeper / striker) ----------------------------------- */

/**
 * Spawn (or refresh) a helper of `kind` owned by player `owner`.
 * Only one helper of each kind per player.
 */
function spawnHelper(owner, kind) {
  const existing = game.helpers.find((h) => h.owner === owner && h.kind === kind);
  if (existing) { existing.life = POWERUPS[kind].dur; return existing; }

  const ownGoalX = owner === 0 ? WALL : W - WALL;
  const h = {
    owner,
    kind,
    // Keeper starts on its own goal line; striker starts near its owner.
    x: kind === "keeper"
      ? (owner === 0 ? ownGoalX + HELP_KEEP_X : ownGoalX - HELP_KEEP_X)
      : clamp(game.players[owner].x + (owner === 0 ? 90 : -90), WALL + HELP_R, W - WALL - HELP_R),
    y: GROUND_Y - HELP_R,
    vx: 0,
    vy: 0,
    r: HELP_R,
    life: POWERUPS[kind].dur,
    kickCD: 0,
  };
  game.helpers.push(h);
  return h;
}

function updateHelpers(dt) {
  const b = game.ball;

  for (let i = game.helpers.length - 1; i >= 0; i--) {
    const h = game.helpers[i];
    h.life -= dt;
    if (h.life <= 0) { game.helpers.splice(i, 1); continue; }
    if (h.kickCD > 0) h.kickCD -= dt;

    if (h.kind === "keeper") {
      // Hold the goal line and track the ball's height so it can save high
      // shots as well as ground ones. The keeper is allowed anywhere from the
      // grass up to the top of the screen — clamping it to the crossbar would
      // pin it below the bar and make high shots unsaveable.
      const lineX = h.owner === 0 ? WALL + HELP_KEEP_X : W - WALL - HELP_KEEP_X;
      // Track the ball freely, but never drop below the frame it is guarding —
      // a raised goal is defended in the air, not on the grass.
      const guardTop = modeCfg().goals ? goalTop(h.owner) : 0;
      const guardBot = modeCfg().goals ? goalBottom(h.owner) : GROUND_Y;
      const targetY = clamp(b.y, h.r, Math.max(guardBot - h.r * 0.2, guardTop));
      h.x += clamp(lineX - h.x, -HELP_KEEP_SPD * dt, HELP_KEEP_SPD * dt);
      h.y += clamp(targetY - h.y, -HELP_KEEP_SPD * dt, HELP_KEEP_SPD * dt);
    } else {
      // Striker: chase the ball, then boot it at the opponent's goal.
      const targetX = b.x - (h.owner === 0 ? h.r : -h.r);
      const targetY = clamp(b.y, 60, GROUND_Y - h.r);
      h.x += clamp(targetX - h.x, -HELP_STRIKE_SPD * dt, HELP_STRIKE_SPD * dt);
      h.y += clamp(targetY - h.y, -HELP_STRIKE_SPD * dt, HELP_STRIKE_SPD * dt);
    }

    h.x = clamp(h.x, WALL + h.r, W - WALL - h.r);
    h.y = clamp(h.y, h.r, GROUND_Y - h.r);

    // Ball interaction. Helpers never touch players, only the ball.
    const d = len(b.x - h.x, b.y - h.y);
    if (d < h.r + b.r) {
      const attackDir = h.owner === 0 ? 1 : -1;    // toward the opponent's goal
      if (h.kind === "keeper") {
        // Deflect firmly away from its own goal, upward.
        const hb = { x: h.x, y: h.y, vx: 0, vy: 0, r: h.r, mass: 40 };
        const bb = { x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, mass: b.mass };
        resolveCircles(hb, bb, 0.8);
        b.x = bb.x; b.y = bb.y;
        b.vx = Math.abs(bb.vx) * attackDir + attackDir * 190;
        b.vy = Math.min(bb.vy, -320);
        limitSpeed(b, BALL_MAX_V);
        burst(b.x, b.y, POWERUPS.keeper.color, 8);
      } else if (h.kickCD <= 0) {
        // Striker shot: firm, lofted, toward goal.
        b.vx = attackDir * HELP_KICK;
        b.vy = -HELP_KICK * 0.55;
        limitSpeed(b, BALL_MAX_V);
        h.kickCD = HELP_KICK_CD;
        game.shake = Math.max(game.shake, 0.14);
        burst(b.x, b.y, POWERUPS.striker.color, 10);
      }
    }
  }
}

/* ---- bullets -------------------------------------------------------------- */

function updateBullets(dt) {
  const b = game.ball;
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const u = game.bullets[i];
    u.life -= dt;
    u.x += u.vx * dt;
    u.y += u.vy * dt;

    if (u.life <= 0 || u.x < -20 || u.x > W + 20) { game.bullets.splice(i, 1); continue; }

    // Ball hit: shove it hard in the bullet's direction, with some lift.
    if (len(b.x - u.x, b.y - u.y) < b.r + u.r) {
      const dir = Math.sign(u.vx) || 1;
      b.vx += dir * BULLET_BALL_PUSH;
      b.vy = Math.min(b.vy, -BULLET_BALL_PUSH * 0.42);
      limitSpeed(b, BALL_MAX_V);
      burst(u.x, u.y, "#fde68a", 12);
      game.shake = Math.max(game.shake, 0.16);
      game.bullets.splice(i, 1);
      continue;
    }

    // Opponent hit: stagger and knock back. Never friendly fire.
    let consumed = false;
    for (const pl of game.players) {
      if (!pl || pl.index === u.owner) continue;
      if (len(pl.x - u.x, pl.y - u.y) < pl.r + u.r) {
        const dir = Math.sign(u.vx) || 1;
        pl.stun = Math.max(pl.stun, BULLET_STUN);
        pl.vx += dir * BULLET_KNOCK * (3 / pl.massNow);
        pl.vy = Math.min(pl.vy, -BULLET_KNOCK * 0.4);
        pl.onGround = false;
        pl.kickT = 0;
        burst(pl.x, pl.y, "#fca5a5", 16);
        game.shake = Math.max(game.shake, 0.24);
        consumed = true;
        break;
      }
    }
    if (consumed) game.bullets.splice(i, 1);
  }
}

/* ---- volleyball ----------------------------------------------------------- */

const netTop = () => GROUND_Y - (modeCfg().net || NET_H);
const hasNet = () => modeCfg().net > 0;

/** Keep a player on their own side of the net (volleyball only). */
function confineToHalf(pl) {
  const half = W / 2;
  if (pl.index === 0) {
    const maxX = half - NET_W / 2 - pl.r;
    if (pl.x > maxX) { pl.x = maxX; if (pl.vx > 0) pl.vx = 0; }
  } else {
    const minX = half + NET_W / 2 + pl.r;
    if (pl.x < minX) { pl.x = minX; if (pl.vx < 0) pl.vx = 0; }
  }
}

/** Ball vs. the net post. Returns true on contact. */
function ballVsNet(b) {
  const half = W / 2;
  const top = netTop();
  // Solid band from the grass up to the net top.
  if (b.y + b.r > top && Math.abs(b.x - half) < NET_W / 2 + b.r) {
    const side = b.x < half ? -1 : 1;
    b.x = half + side * (NET_W / 2 + b.r);
    if (Math.sign(b.vx) !== side) b.vx = -b.vx * 0.7;
    return true;
  }
  // Rounded cap so a ball clipping the top deflects rather than sticking.
  return resolveStaticCircle(b, half, top, NET_W / 2, 0.75);
}

/**
 * Volleyball scoring: the ball landing on a side concedes a point to the OTHER
 * side. Returns 0, or the scoring player index + 1 (so 1 or 2) — callers treat
 * a non-zero result as "point scored by that player".
 */
function volleyGround(b) {
  if (b.y + b.r < GROUND_Y - 1) return 0;
  return b.x < W / 2 ? 2 : 1;      // landed left -> P2 scores, and vice versa
}

/* ---- tennis --------------------------------------------------------------- */

/**
 * Tennis scoring. The ball may bounce ONCE on a side; a second bounce on the
 * same side concedes. Tracked via `game.lastBounceSide`, reset whenever the ball
 * crosses the net. Returns 0, or the scoring player index + 1.
 */
function tennisGround(b) {
  if (b.y + b.r < GROUND_Y - 1) return 0;
  const side = b.x < W / 2 ? 0 : 1;
  if (game.lastBounceSide === side) {
    return side === 0 ? 2 : 1;        // second bounce here -> other side scores
  }
  game.lastBounceSide = side;
  return 0;                            // first bounce on this side is legal
}

/** Reset the tennis bounce count when the ball changes side. */
function tennisTrackCrossing(b) {
  const side = b.x < W / 2 ? 0 : 1;
  if (game.ballSide !== side) {
    game.ballSide = side;
    game.lastBounceSide = -1;          // a fresh side gets a fresh bounce
  }
}

/* ---- basketball ----------------------------------------------------------- */

/** Hoop centre for a side. 0 = left hoop (P2 attacks it), 1 = right. */
function hoopPos(side) {
  return {
    x: side === 0 ? WALL + HOOP_X : W - WALL - HOOP_X,
    y: HOOP_Y,
  };
}

/**
 * Basketball scoring: the ball must pass DOWNWARD through a hoop's ring.
 * Returns 0, or the scoring player index + 1. A downward-only test stops a
 * ball bouncing up through the net from counting.
 */
function basketScored(b, prevY) {
  if (b.vy <= 0) return 0;                       // must be falling
  for (const side of [0, 1]) {
    const h = hoopPos(side);
    // Crossed the ring plane this substep?
    /*
      Aperture: the ball centre only has to be inside the ring, rather than
      clearing it by most of a radius. The old margin left a ~28px target and
      made honest shots rattle out.
    */
    if (prevY <= h.y && b.y > h.y && Math.abs(b.x - h.x) < HOOP_R * 0.95) {
      // Left hoop is P2's target, right hoop is P1's.
      return side === 0 ? 2 : 1;
    }
  }
  return 0;
}

/** Ball vs. the two hoop rims — solid little circles either side of the ring. */
function ballVsHoops(b) {
  let hit = false;
  for (const side of [0, 1]) {
    const h = hoopPos(side);
    // Backboard side and open side rims.
    if (resolveStaticCircle(b, h.x - HOOP_R, h.y, RIM_R, 0.6)) hit = true;
    if (resolveStaticCircle(b, h.x + HOOP_R, h.y, RIM_R, 0.6)) hit = true;
    // Backboard itself.
    const bx = side === 0 ? WALL + 4 : W - WALL - 4;
    const boardTop = h.y - BOARD_H * 0.65, boardBot = h.y + BOARD_H * 0.35;
    if (b.y > boardTop && b.y < boardBot) {
      if (side === 0 && b.x - b.r < bx + BOARD_W) {
        b.x = bx + BOARD_W + b.r;
        if (b.vx < 0) { b.vx = -b.vx * 0.7; hit = true; }
      }
      if (side === 1 && b.x + b.r > bx - BOARD_W) {
        b.x = bx - BOARD_W - b.r;
        if (b.vx > 0) { b.vx = -b.vx * 0.7; hit = true; }
      }
    }
  }
  return hit;
}

/* ---- CPU opponent --------------------------------------------------------- */

/*
  Three difficulty tiers. The AI drives the SAME `keys` a human would, so it is
  bound by identical physics, cooldowns and stun rules — it cannot cheat.

    react    seconds of lag before it responds to a new ball position
    err      pixels of aim error (how sloppily it tracks)
    aggr     0..1 chance it commits to a kick when in range
    jump     0..1 chance it jumps for a high ball
    idle     fraction of time it simply does nothing
*/
const CPU_LEVELS = [
  { name: "EASY",   react: 0.34, err: 130, aggr: 0.45, jump: 0.30, idle: 0.30, speed: 0.72 },
  { name: "MEDIUM", react: 0.17, err: 62,  aggr: 0.75, jump: 0.62, idle: 0.10, speed: 0.88 },
  { name: "HARD",   react: 0.06, err: 18,  aggr: 0.96, jump: 0.90, idle: 0.02, speed: 1.0  },
];

const cpuCfg = () => CPU_LEVELS[clamp(game.cpuLevel, 0, CPU_LEVELS.length - 1)];

/**
 * Decide what a CPU-controlled seat wants to do and write it into `keys` for
 * that seat's control scheme. Called once per substep per CPU player.
 */
function updateCPU(pl, dt) {
  const act = intent[pl.index];
  const lvl = cpuCfg();
  const b = game.ball;
  const cfg = modeCfg();

  // Lazily initialise per-player AI memory.
  if (!pl.ai) pl.ai = { t: 0, tx: pl.x, ty: pl.y, idle: 0, jumpRoll: 0 };
  const ai = pl.ai;

  // Release everything first, so a decision is a fresh set of presses.
  act.left = act.right = act.up = act.down = false;

  // Reaction lag: only refresh the target every `react` seconds, and aim with
  // error. This is what actually separates the tiers.
  ai.t -= dt;
  if (ai.t <= 0) {
    ai.t = lvl.react;
    ai.idle = Math.random() < lvl.idle ? lvl.react : 0;
    ai.jumpRoll = Math.random();

    // Predict where the ball will be, scaled by skill: hard aims ahead of it.
    const lead = lvl.aggr * 0.28;
    let px = b.x + b.vx * lead;
    let py = b.y + b.vy * lead;
    px += rand(-lvl.err, lvl.err);
    py += rand(-lvl.err * 0.5, lvl.err * 0.5);

    // In goal modes, stand between the ball and your own goal when the ball is
    // on your half; otherwise press up the pitch toward it.
    const ownGoalDir = pl.index === 0 ? -1 : 1;
    if (cfg.goals) {
      const ballOnMyHalf = (b.x - W / 2) * ownGoalDir > 0;
      if (ballOnMyHalf) {
        // Get goal-side of the ball so a clearance is possible.
        px += ownGoalDir * (pl.r + 6);
      }
    } else if (cfg.confine) {
      // Net games: never leave your own half, and hold a ready position.
      const half = W / 2;
      const lo = pl.index === 0 ? WALL + pl.r : half + NET_W / 2 + pl.r;
      const hi = pl.index === 0 ? half - NET_W / 2 - pl.r : W - WALL - pl.r;
      px = clamp(px, lo, hi);
    }

    ai.tx = clamp(px, WALL + pl.r, W - WALL - pl.r);
    ai.ty = py;
  }

  if (ai.idle > 0) { ai.idle -= dt; return; }

  /*
    Horizontal: walk toward the target with a deadzone so it doesn't jitter.
    `lvl.speed` throttles a weaker CPU by making it release the key part of the
    time — it moves at the same top speed a human would, just less of the time,
    rather than being given different physics.
  */
  const dx = ai.tx - pl.x;
  const dead = 8 + (1 - lvl.aggr) * 22;
  const throttled = lvl.speed < 1 && (ai.throttle = (ai.throttle || 0) + dt) % 0.12 > 0.12 * lvl.speed;
  if (!throttled) {
    if (dx < -dead) act.left = true;
    else if (dx > dead) act.right = true;
  }

  // Jump for a high ball, or to header it, when close enough to matter.
  const near = Math.abs(b.x - pl.x) < pl.r + b.r + 66;
  const ballHigh = b.y < pl.y - pl.r * 0.4;
  if (pl.onGround && near && ballHigh && ai.jumpRoll < lvl.jump) act.up = true;

  // Fast-fall to meet a dropping ball.
  if (!pl.onGround && b.y > pl.y + pl.r && ai.jumpRoll < lvl.jump) act.down = true;

  // Kick / fire. Uses the same entry points a human's keypress would.
  const dist = len(b.x - pl.x, b.y - pl.y);
  const inRange = dist < pl.r + b.r + LEG_LEN * 0.95;
  if (inRange && Math.random() < lvl.aggr * 0.6) {
    if (pl.ammo > 0 && Math.random() < 0.4) pl.tryFire();
    else pl.tryStartKick();
  }
  // Hard CPUs will also shoot at a distant ball to move it upfield.
  if (!inRange && pl.ammo > 0 && lvl.aggr > 0.9 &&
      Math.abs(b.y - pl.y) < pl.r * 1.5 &&
      Math.sign(b.x - pl.x) === pl.facing &&
      Math.random() < 0.04) {
    pl.tryFire();
  }
}

/** Clear the intent a CPU seat was holding (used when leaving PLAY). */
function releaseCPUKeys() {
  for (let i = 0; i < 2; i++) {
    if (!game.cpu[i]) continue;
    const a = intent[i];
    a.left = a.right = a.up = a.down = a.kick = a.kickEdge = false;
  }
}

/* ---- online play (peer to peer) ------------------------------------------- */

/*
  ONLINE MODEL — host authority.

  There is no server: this file has no dependencies and nothing to deploy. Two
  browsers connect directly over WebRTC, and the connection offer/answer is
  copied between players by hand (the codes are shown on screen, and the paste
  box accepts them). That is the whole signalling layer.

  To make the two screens agree without any rollback machinery:
    - The HOST runs the one true simulation and broadcasts a state snapshot
      every frame.
    - The GUEST runs no physics of its own. It sends one input byte per frame
      and renders whatever the host sends, interpolating between snapshots so a
      30-60Hz feed still looks smooth at 60fps.

  This means the guest sees a little latency on its own movement. The trade is
  deliberate: it is impossible to desync, which is the failure mode that makes
  hand-rolled netcode unplayable. Snapshots are small (~40 numbers) so a typical
  connection carries them comfortably.
*/

const NET_SNAP_HZ = 30;        // host snapshot rate
const NET_TIMEOUT = 6;         // seconds without traffic before we call it dead
const ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];

const net = {
  active: false,          // an online match is running
  role: null,             // "host" | "guest"
  pc: null,               // RTCPeerConnection
  chan: null,             // RTCDataChannel
  state: "idle",          // idle|creating|offer|answer|connecting|live|failed|closed
  localSeat: 0,           // which seat this machine drives
  remoteSeat: 1,          // which seat the peer drives
  offerText: "",          // code to hand to the other player
  answerText: "",
  paste: "",              // what the user has typed/pasted
  error: "",
  lastRecv: 0,            // seconds since last message
  sendAcc: 0,             // snapshot rate limiter
  snapPrev: null,         // guest: previous snapshot (for interpolation)
  snapNext: null,         // guest: latest snapshot
  snapT: 0,               // guest: interpolation progress
  pingMs: 0,
  copied: false,
  spectating: false,     // guest watching a tie it is not playing
};

const netIsHost = () => net.active && net.role === "host";
const netIsGuest = () => net.active && net.role === "guest";

/** Reset all networking state and tear down any live connection. */
function netReset() {
  try { if (net.chan) net.chan.close(); } catch (e) { /* already gone */ }
  try { if (net.pc) net.pc.close(); } catch (e) { /* already gone */ }
  net.active = false;
  net.role = null;
  net.pc = null;
  net.chan = null;
