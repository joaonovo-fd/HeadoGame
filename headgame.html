<script>
"use strict";

/* ============================================================================
   HEAD GAME — 2D local-multiplayer 1v1 soccer.

   Layout of this file:
     1.  Constants and tuning
     2.  Small math helpers
     3.  Pure physics kernel        <- unit-tested, no globals touched
     4.  Teams
     5.  Power-ups
     6.  Input
     7.  Entities (Ball, Player)
     8.  Match state + scene machine
     9.  Fixed-timestep loop
     10. Rendering
     11. Self-test suite (?test=1)

   Physics runs in fixed 1/120 s substeps inside a requestAnimationFrame loop,
   so bounces are repeatable and a max-power shot cannot tunnel a goalpost.
   ========================================================================= */

/* ---------------------------------------------------------------- 1. CONSTS */

/*
  THE VERSION. Single source of truth: the title bar, the menu badge, the credits
  screen and the netcode handshake all read this one constant, so they can never
  drift apart. Bump it here and nowhere else.

  Guests are told the host's version when they connect: the two machines run the
  same simulation lockstep, so a mismatch is worth a visible warning rather than
  a desync nobody can explain.
*/
const VERSION = "1.6";

const W = 1000;               // logical width  (canvas is letterboxed to fit)
const H = 600;                // logical height
const GROUND_Y = 520;         // top of the grass
const WALL = 8;               // side wall thickness

const GOAL_H = 140;           // goal mouth height
const GOAL_D = 70;            // goal depth (recessed into the wall)
const GOAL_BASE_TOP = GROUND_Y - GOAL_H;   // resting position of the crossbar
const POST_R = 7;             // crossbar radius

/*
  The goals slide up and down. Each side oscillates on its own sine wave, so the
  two are rarely aligned. `goalTop(side)` is the ONLY way to ask where a goal
  is — nothing may assume GOAL_BASE_TOP, or scoring and the posts will disagree
  with what is drawn.
*/
const GOAL_TRAVEL = 74;       // peak-to-centre vertical travel (px)
const GOAL_SPEED_L = 0.55;    // radians/sec, left goal
const GOAL_SPEED_R = 0.43;    // deliberately different so they drift apart
let goalPhase = 0;            // advanced by the fixed-step simulation

/** Current y of a goal's crossbar. side 0 = left, 1 = right. */
/*
  Live, mutable versions of the goal tunables. Chaos mode and the goal-resize
  power-up write these; nothing else should. `goalHeight()` and `goalTop()` are
  the only sanctioned readers of goal geometry.
*/
let goalTravel = GOAL_TRAVEL;
let goalSpeedL = GOAL_SPEED_L;
let goalSpeedR = GOAL_SPEED_R;
let goalScale = 1;            // set by the goal-resize power-up

/** Current mouth height, honouring the resize power-up. */
function goalHeight() {
  return clamp(GOAL_H * goalScale, 60, GROUND_Y - 70);
}

/**
 * Current y of a goal's crossbar. side 0 = left, 1 = right.
 *
 * Goals only SLIDE in chaos mode. A normal match wants a fixed, learnable
 * target; the moving nets were unpredictable enough to feel arbitrary. Every
 * collider reads this, so nothing else needs to know about the distinction.
 */
function goalTop(side) {
  const base = GROUND_Y - goalHeight();
  if (!goalsMove()) return clamp(base, 24, GROUND_Y - 55);
  const w = side === 0
    ? Math.sin(goalPhase * goalSpeedL)
    : Math.sin(goalPhase * goalSpeedR + 1.9);
  // Clamped so the mouth never sinks below the grass or leaves the screen.
  return clamp(base - w * goalTravel, 24, GROUND_Y - 55);
}

/** Do the goals slide? Only under chaos, unless the player forces it on. */
function goalsMove() {
  return game.chaos || game.rules.movingGoals;
}

/**
 * Lower edge of a goal's mouth — the crossbar plus the mouth height, capped at
 * the grass. The whole frame slides as one unit, so every collider that cares
 * about the goal must use this rather than assuming the ground.
 */
function goalBottom(side) {
  return Math.min(goalTop(side) + goalHeight(), GROUND_Y);
}

const GRAVITY = 1500;         // px/s^2 — baseline; live value is `gravity`
const DT = 1 / 120;           // fixed physics substep
const MAX_FRAME = 0.1;        // clamp frame delta (tab-switch guard)

/*
  Gravity is re-rolled at every kickoff after a goal, so each restart plays
  differently: the BALL floats or drops sharply, changing how shots arc and how
  long the ball hangs.

  Player jump velocity is scaled by sqrt(gravity multiplier) so that jump HEIGHT
  is preserved (peak rise = v²/2g, so scaling v by √k against g·k leaves the
  rise unchanged). Without this, low gravity launched the best jumper clean
  through the ceiling and high gravity put power-ups out of reach for the worst
  jumper — the safe range collapsed to nothing. Scaling means players keep their
  reachable envelope at every setting while air TIME still changes noticeably.
*/
const GRAV_MIN_MUL = 0.6;
const GRAV_MAX_MUL = 1.5;
let gravity = GRAVITY;        // live value, read by all dynamics
// Jump velocity multiplier that holds jump height constant as gravity changes.
const jumpScale = () => Math.sqrt(gravity / GRAVITY);

// Flavour bands for the on-screen readout, low multiplier to high.
const GRAV_BANDS = [
  { max: 0.75, label: "LOW GRAVITY",  color: "#7dd3fc" },
  { max: 0.92, label: "LIGHT",        color: "#a7f3d0" },
  { max: 1.09, label: "NORMAL",       color: "#cddcf2" },
  { max: 1.30, label: "HEAVY",        color: "#fbbf24" },
  { max: Infinity, label: "HIGH GRAVITY", color: "#f87171" },
];
const gravBand = (mul) => GRAV_BANDS.find((b) => mul < b.max);

const BALL_R = 14;
const BALL_REST = 0.72;       // restitution vs. static surfaces
const BALL_DRAG = 0.28;       // air drag coefficient (per second)
const BALL_ROLL = 1.4;        // ground rolling friction
/*
  Speed clamp. Raised again alongside the stronger KICK_BASE: with every team
  hitting the ceiling on a power shot, Shot Power stopped meaning anything at
  the moment it matters most.

  The hard limit is TUNNELING. At 1/120s the ball travels BALL_MAX_V/120 px per
  substep, and that must stay below the smallest collider it has to notice —
  the goal posts, at (POST_R + BALL_R) * 2 = 42px. 2400/120 = 20px, comfortably
  under. The test suite asserts this rather than trusting the arithmetic here.
*/
const BALL_MAX_V = 2400;
const BALL_MASS = 1;

/*
  Live tunables written ONLY by chaos mode (and reset by resetChaos). Physics
  reads these rather than the constants above, so a chaos roll takes effect
  everywhere at once.
*/
let ballRest = BALL_REST;
let ballDrag = BALL_DRAG;
let playerSpeedMul = 1;
let playerJumpMul = 1;
let playerSizeMul = 1;

const PLAYER_R = 30;          // baseline radius, scaled by team Size
const PLAYER_ACCEL = 2600;
const PLAYER_MAXV = 340;
const PLAYER_JUMP = 620;
const PLAYER_FRICTION = 12;   // ground damping when no input
const PLAYER_AIR_CTL = 0.55;  // horizontal control authority in mid-air

const LEG_LEN = 30;           // distance from body centre to leg tip
const LEG_R = 11;             // leg tip radius
const KICK_TIME = 0.22;       // swing duration
const KICK_COOLDOWN = 0.3;
const KICK_REACH = 1.25;      // kick range as a multiple of (playerR + ballR)
// Base kick impulse. Raised from 720: a plain kick was landing around 700-880
// px/s against a 2000 clamp, which read as a touch rather than a strike.
const KICK_BASE = 1180;
const KICK_UP = 0.95;         // upward bias mixed into every kick — shots arc high
const KICK_LIFT_MIN = 560;    // floor on upward launch speed, so kicks truly loft
const HEAD_BOOST = 1.3;       // bonus when the ball strikes the top of the head

// Bodies are springy, not walls: any contact launches the ball upward, and the
// ball shoves the player back instead of bouncing off an immovable object.
const BODY_POP = 430;         // minimum upward launch on body contact (px/s)
const BODY_MASS_MUL = 2.2;    // player's effective mass vs. the ball
const BALL_PUSH = 0.7;        // fraction of the collision impulse the player absorbs
const KNOCK_MAX = 280;        // cap on knockback so a hard shot can't fling a player

// Defensive clearance: when the ball is BEHIND a player (on their own-goal
// side), a kick fires it away from that goal instead of into the facing
// hemisphere. Slightly weaker than a real shot, so it clears rather than scores.
const CLEAR_MUL = 0.82;

/*
  Power Shot multiplier. Reduced from 3.1: that was tuned when a plain kick was
  only ~700 px/s. With KICK_BASE now 1180 a 3.1x shot pinned every team to the
  speed clamp, which flattened Shot Power exactly when it should matter. 1.9x on
  a much stronger base still lands harder than the old 3.1x did.
*/
const POWERSHOT_MUL = 1.9;

/*
  A moving ball that strikes a player knocks them back. The heavier the team the
  less they move; a fast shot hits much harder than a rolling ball. Capped so a
  max-power hit cannot fling anyone across the pitch.
*/
const BALL_KNOCK = 0.62;      // ball speed -> knockback conversion
const BALL_KNOCK_MIN = 260;   // ball must be at least this fast to knock back
const BALL_KNOCK_MAX = 900;   // hard cap on the resulting player speed
const BALL_KNOCK_STUN = 0.28; // brief stagger on a solid hit

/*
  Knockback is a POWER SHOT weapon, not a side effect of ordinary play. A normal
  kick never shoves the opponent; only a ball struck while the kicker held the
  Power Shot power-up does. `game.ballPowered` carries that "charged" state on
  the ball and is cleared the moment it is spent or the ball settles.
*/

/*
  Pistol: a pickup granting a few shots. A bullet travels flat and fast; it
  shoves the ball hard on impact and briefly stuns an opposing player. It is
  deliberately not a goal-scoring tool on its own — it moves the ball.
*/
const PISTOL_AMMO = 3;
const BULLET_SPD = 900;
const BULLET_R = 5;
const BULLET_LIFE = 1.6;
const BULLET_BALL_PUSH = 640; // impulse imparted to the ball
const BULLET_STUN = 0.5;
const BULLET_KNOCK = 300;
const PISTOL_CD = 0.32;       // between shots

// Goal-resize power-up: scales BOTH goals for a duration. >1 grows, <1 shrinks.
const GOAL_SIZE_BIG = 1.75;
const GOAL_SIZE_SMALL = 0.5;

/*
  DASH — a short burst of speed on a cooldown, available in every mode.

  Distinct from the SPEED power-up: that raises your top speed for seconds, this
  is an instant reposition you spend and wait for. It is the one movement option
  that does not depend on finding a pickup, so both players always have it.

  The 2D dash is horizontal along `facing`; the 3D arena's is along the camera
  forward. Both read these constants, so the move feels the same in both halves
  of the game.
*/
const DASH_V = 720;           // 2D horizontal burst (px/s)
const DASH_CD = 1.45;         // seconds before it recharges
const DASH_T = 0.16;          // how long the burst lasts
const DASH_AIR = 1;           // dashes allowed per airtime, so it is not a fly

/*
  SUPERPOWERS — one signature ability per team, charged by playing.

  Deliberately NOT another entry in POWERUPS. A power-up is random and found on
  the floor; a superpower is who your character IS: the same team always has the
  same power, so picking Green Giants is a tactical choice rather than a colour.

  Charge accrues from doing things that matter — touching the ball, taking a hit,
  conceding — so it rewards involvement and a losing player is never locked out.
  At full charge the ability is spent with the SUPER key and the meter empties.

  Each power is matched to its team's stats rather than assigned at random, so a
  Bulldozer's power suits a heavy immovable side and a Sprinter's suits a fast
  light one.
*/
const SUPER_MAX = 100;              // charge needed to fire
const SUPER_GAIN_TOUCH = 9;         // per ball touch
const SUPER_GAIN_KICK = 4;          // per kick that connects
const SUPER_GAIN_HIT = 16;          // when hit by a bullet or mine
const SUPER_GAIN_CONCEDE = 34;      // when the opponent scores
const SUPER_GAIN_TIME = 2.1;        // per second, so a quiet match still charges
const SUPER_GAIN_FRAG = 22;         // 3D arena: per frag scored
const SUPER_GAIN_DAMAGE = 11;       // 3D arena: per hit taken

const SUPERS = {
  /*
    Each entry: a label, a colour for the meter, how long the effect lasts, and
    a one-line hint shown on the select screen. `dur` of 0 is instantaneous.
  */
  rocket:   { label: "ROCKET BOOST", color: "#ef4444", dur: 5,
              hint: "huge shot power and a blazing burst" },
  quake:    { label: "QUAKE",        color: "#78716c", dur: 0,
              hint: "slam the ground: stuns and launches the ball" },
  bulwark:  { label: "BULWARK",      color: "#3f9c48", dur: 6,
              hint: "immovable and double size" },
  flea:     { label: "FLEA JUMP",    color: "#e5c534", dur: 6,
              hint: "endless mid-air jumps" },
  cannon:   { label: "CANNON",       color: "#8b56c9", dur: 5,
              hint: "the ball becomes a guided missile on your kick" },
  tumble:   { label: "TUMBLE",       color: "#e2822f", dur: 6,
              hint: "no gravity — fly freely" },
  blink:    { label: "BLINK",        color: "#2fb9c4", dur: 0,
              hint: "teleport instantly to the ball" },
  freeze:   { label: "DEEP FREEZE",  color: "#38bdf8", dur: 2.6,
              hint: "freeze your opponent where they stand" },
  panther:  { label: "POUNCE",       color: "#ec4899", dur: 5,
              hint: "speed, reach and a longer dash" },
  titan:    { label: "TITAN GRIP",   color: "#0d9488", dur: 6,
              hint: "the ball is drawn toward you" },
  volley:   { label: "ARROW STORM",  color: "#f59e0b", dur: 0,
              hint: "a volley of shots, all at once" },
  owl:      { label: "OWL EYES",     color: "#4f46e5", dur: 6,
              hint: "slow the world while you keep pace" },
  livewire: { label: "LIVEWIRE",     color: "#84cc16", dur: 5,
              hint: "the ball sticks to you and never escapes" },
  charge:   { label: "BULL CHARGE",  color: "#b91c1c", dur: 4,
              hint: "unstoppable: barge through everything" },
  sentinel: { label: "LAST WALL",    color: "#64748b", dur: 8,
              hint: "a keeper AND a striker at once" },
  venom:    { label: "VENOM SHOT",   color: "#a855f7", dur: 5,
              hint: "your shots curve toward the goal" },
};
const SUPER_KEYS = Object.keys(SUPERS);

/*
  Which team has which power, by roster index. Ordered to match TEAMS exactly,
  so the pairing is legible here rather than buried in a lookup — and asserted by
  the suite, since a mismatch would silently give a team the wrong identity.
*/
const TEAM_SUPER = [
  "rocket",    // Red Rockets      — all-rounder, so a straightforward buff
  "blink",     // Blue Bolts       — fastest, so a teleport
  "bulwark",   // Green Giants     — biggest, so immovability
  "flea",      // Yellow Fleas     — best jumper, so infinite jumps
  "cannon",    // Purple Cannons   — best shot, so a guided missile
  "tumble",    // Orange Acrobats  — acrobat, so free flight
  "quake",     // Cyan Sprinters   — light and quick, so a ground slam
  "charge",    // Black Bulldozers — heaviest, so an unstoppable barge
  "panther",   // Pink Panthers    — balanced attacker
  "titan",     // Teal Titans      — heavy, so it pulls the ball in
  "volley",    // Amber Arrows     — arrows, so a volley
  "owl",       // Indigo Owls      — owl eyes, so bullet time
  "livewire",  // Lime Livewires   — the ball sticks to it
  "freeze",    // Crimson Bulls    — slow but strong, so it stops the other
  "sentinel",  // Slate Sentinels  — defensive, so it summons helpers
  "venom",     // Violet Vipers    — best shot and speed, so curving shots
];

/*
  Volleyball mode: a net at midfield, players confined to their own half, and a
  point is conceded when the ball touches the ground on your side. Goals are not
  used at all, so the scoring rule is entirely separate.
*/
const NET_W = 10;
const NET_H = 210;            // default net height above the grass
const VOLLEY_SETTLE = 0.25;   // grace after a point before the next serve

/*
  Basketball: a hoop on each side, mounted high on the wall. The ball scores by
  falling through the ring. Rims are small solid circles so shots can rattle out,
  and each hoop has a backboard the ball rebounds off.
*/
const HOOP_X = 96;            // ring centre distance from the wall
const HOOP_Y = 250;           // ring height
/*
  Ring half-width. Raised from 34: a swept measurement of blind arcs (speed x
  angle, from five spots) scored 2.3% at 34 against 3.1% here, and the width a
  ball can drop straight through went from 65px to 84px against a 28px ball.
  Kept clear of 49+, where the ring grows wide enough that a ball clipping the
  outer rim gets knocked sideways INTO the hoop and scores from outside it.
*/
const HOOP_R = 44;            // ring half-width
const RIM_R = 5;              // rim thickness
/*
  Basketball never lets the ball go dead. Every other mode clamps a slow bounce
  to a stop, so the ball settled flat on the hardwood after about seven seconds
  and lay there until somebody walked into it. Here a bounce that would have
  died is given this much rebound instead, so the ball keeps dribbling and stays
  playable. Chosen to lift the ball a bit over a ball-width — clearly alive,
  without hopping so high it plays itself.
*/
const BASKET_LIVE_V = 210;

const BOARD_W = 5;            // backboard thickness
const BOARD_H = 150;          // backboard height

/*
  Chaos mode: every CHAOS_EVERY seconds, re-roll every tunable in the game at
  once — gravity, ball bounce, player speed, goal motion, sizes. Bounds are kept
  inside playable limits and asserted by the test suite.
*/
const CHAOS_EVERY = 12;
const CHAOS_ANNOUNCE = 2.4;

/*
  Mines: hazards that spawn on the grass and punish careless chasing. A player
  who touches one is stunned briefly and flung back; the ball is launched hard.
*/
const MINE_R = 15;
const MINE_MIN = 11, MINE_MAX = 17;   // spawn interval (seconds)
const MINE_MAX_LIVE = 3;              // never more than this on the pitch
const MINE_ARM = 0.7;                 // seconds before a fresh mine is live
const MINE_LIFE = 22;                 // despawn if untouched
const MINE_STUN = 0.9;                // how long a player is disabled
const MINE_KNOCK = 430;               // player knockback speed
const MINE_BALL_V = 950;              // ball launch speed
const MINE_SAFE_X = 130;              // keep mines away from either goal mouth

// Match rules are configurable on the setup screen; these are the bounds and
// defaults. `game.goalsToWin` and `game.matchSecs` hold the live values.
const GOALS_MIN = 3;
const GOALS_MAX = 15;
const GOALS_DEFAULT = 5;

// Match clock. 0 means "no limit"; otherwise the match ends when it expires and
// whoever is ahead wins. OFF sorts first so the list reads low-to-high.
const TIME_OPTIONS = [0, 60, 90, 120, 180, 300];
const TIME_DEFAULT_IDX = 3;        // 120s

const CELEBRATE_T = 1.8;
const COUNTDOWN_T = 3.2;

/*
  Tournament: a single-elimination bracket for 2-16 hot-seat players sharing the
  two control schemes. Each round pairs the survivors; the winner of each tie
  advances. With an odd number of entrants one player gets a bye that round.

  16 is four full rounds — last 16, quarters, semis, final — which is the largest
  bracket the standings screen can list legibly. The bracket code is size-agnostic
  (it pairs whatever survives), so this is a limit on the DISPLAY, not the logic.
*/
const TOURN_MIN = 2;
const TOURN_MAX = 16;

/*
  Player names. Typed on the setup screen, persisted in localStorage so they
  survive a reload, and sent to the peer over the network so both screens show
  the same labels. Kept short so they fit the scoreboard.
*/
const NAME_MAX = 12;
const NAME_OK = /^[A-Za-z0-9 _.\-]$/;      // one printable character
const DEFAULT_NAMES = ["PLAYER 1", "PLAYER 2"];

/** Sanitise anything that arrives from storage or the network. */
function cleanName(raw, fallback) {
  const t = String(raw == null ? "" : raw)
    .replace(/[^A-Za-z0-9 _.\-]/g, "")
    .trim()
    .slice(0, NAME_MAX);
  return t || fallback;
}

function loadNames() {
  try {
    const raw = localStorage.getItem("headgame.names");
    if (!raw) return [...DEFAULT_NAMES];
    const arr = JSON.parse(raw);
    return [cleanName(arr[0], DEFAULT_NAMES[0]), cleanName(arr[1], DEFAULT_NAMES[1])];
  } catch (e) {
    // Private browsing, blocked storage, or corrupt JSON — defaults are fine.
    return [...DEFAULT_NAMES];
  }
}

function loadOpts(into) {
  try {
    const raw = localStorage.getItem("headgame.opts");
    if (!raw) return into;
    const o = JSON.parse(raw);
    for (const k of Object.keys(into)) if (typeof o[k] === "boolean") into[k] = o[k];
  } catch (e) {
    // Blocked or corrupt storage — the authored defaults are fine.
  }
  return into;
}

function saveOpts(o) {
  try { localStorage.setItem("headgame.opts", JSON.stringify(o)); }
  catch (e) { /* not fatal: options just won't persist */ }
}

/*
  LEADERBOARD

  A persistent win/loss record keyed by player name, stored in localStorage and
  shown on its own screen. Note the honest scope: with no server there is no
  worldwide table — this is every match played on THIS computer, including
  online matches (both names are recorded) and games against the CPU.

  Each record: { name, w, l, d, gf, ga, streak, best, last }
    w/l/d  wins, losses, draws
    gf/ga  goals (or points) for and against
    streak current run: positive = wins, negative = losses
    best   longest winning streak
    last   timestamp of the most recent match
*/
const LB_MAX = 60;              // keep the table bounded

function loadBoard() {
  try {
    const raw = localStorage.getItem("headgame.board");
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr
      .map((r) => ({
        name: cleanName(r && r.name, ""),
        w: Math.max(0, r.w | 0), l: Math.max(0, r.l | 0), d: Math.max(0, r.d | 0),
        gf: Math.max(0, r.gf | 0), ga: Math.max(0, r.ga | 0),
        streak: r.streak | 0, best: Math.max(0, r.best | 0),
        last: Number(r.last) || 0,
      }))
      .filter((r) => r.name);        // drop anything unnamed or corrupt
  } catch (e) {
    return [];                        // blocked or corrupt storage
  }
}

function saveBoard(board) {
  try {
    localStorage.setItem("headgame.board", JSON.stringify(board.slice(0, LB_MAX)));
  } catch (e) { /* not fatal: the table just won't persist */ }
}

/** Find or create a record for `name`. */
function boardRecord(name) {
  const clean = cleanName(name, "");
  if (!clean) return null;
  let r = game.board.find((x) => x.name === clean);
  if (!r) {
    r = { name: clean, w: 0, l: 0, d: 0, gf: 0, ga: 0, streak: 0, best: 0, last: 0 };
    game.board.push(r);
  }
  return r;
}

const lbPlayed = (r) => r.w + r.l + r.d;
const lbWinPct = (r) => (lbPlayed(r) ? (r.w / lbPlayed(r)) * 100 : 0);

/**
 * Rank the table: most wins first, then win rate, then goal difference.
 * Pure so the ordering can be asserted directly.
 */
function rankBoard(board) {
  return [...board].sort((a, b) =>
    b.w - a.w ||
    lbWinPct(b) - lbWinPct(a) ||
    (b.gf - b.ga) - (a.gf - a.ga) ||
    a.name.localeCompare(b.name));
}

/**
 * Record a finished match. `winner` is 0, 1 or -1 for a draw.
 * Called once per completed match, from finishMatch.
 */
function recordResult(winner, score) {
  // CPU seats are not people; don't pollute the table with them.
  const names = [0, 1].map((i) => (game.cpu[i] ? null : seatLabel(i)));
  const now = Date.now();

  for (let i = 0; i < 2; i++) {
    if (!names[i]) continue;
    const r = boardRecord(names[i]);
    if (!r) continue;
    const mine = score[i] | 0, theirs = score[1 - i] | 0;
    r.gf += mine;
    r.ga += theirs;
    r.last = now;
    if (winner === -1) {
      r.d++;
      r.streak = 0;
    } else if (winner === i) {
      r.w++;
      r.streak = r.streak > 0 ? r.streak + 1 : 1;
      r.best = Math.max(r.best, r.streak);
    } else {
      r.l++;
      r.streak = r.streak < 0 ? r.streak - 1 : -1;
    }
  }
  saveBoard(game.board);
}

function saveNames(names) {
  try { localStorage.setItem("headgame.names", JSON.stringify(names)); }
  catch (e) { /* not fatal: names just won't persist */ }
}

const ruleDef = (key) => RULE_DEFS.find((r) => r.key === key);

/** Clamp one rule value to its declared range. */
function clampRule(key, v) {
  const d = ruleDef(key);
  if (!d) return v;
  if (d.type === "flag") return !!v;
  const c = clamp(Number(v), d.min, d.max);
  return d.type === "int" ? Math.round(c) : Math.round(c * 100) / 100;
}

function loadRules(into) {

    if (!raw) return into;
    const o = JSON.parse(raw);
    for (const d of RULE_DEFS) {
      if (o[d.key] !== undefined) into[d.key] = clampRule(d.key, o[d.key]);
    }
  } catch (e) {

*/

*/
// Keyed by the MODE string values directly: `MODE` itself is declared further

const MODE_PLATFORMS = {
  volley: [
    // Two low pads either side, to spike from. Well clear of the net at x=500.

function activePlatforms() {
  // Net and hoop modes use their own purpose-built layout; the soccer modes use
  // whichever arena the player picked.
  const own = MODE_PLATFORMS[game.mode];
  if (own) return own;
  return mapById(game.mapId).platforms;
}

/**
 * Resolve a circle against one slab. Pushes out along the shallowest axis and
 * reflects that component. Returns "top" | "bottom" | "side" | null so callers
 * can tell a landing from a head-bump.
 * Pure apart from mutating `b`.
 */
function resolvePlatform(b, pl, restitution) {
  const cx = clamp(b.x, pl.x, pl.x + pl.w);
  const cy = clamp(b.y, pl.y, pl.y + pl.h);
  const dx = b.x - cx, dy = b.y - cy;
  if (dx * dx + dy * dy >= b.r * b.r) return null;

  // Overlap on each axis, measured from the slab's faces.
  const left = (pl.x - b.r) - b.x;          // negative when overlapping
  const right = (pl.x + pl.w + b.r) - b.x;
  const top = (pl.y - b.r) - b.y;
  const bottom = (pl.y + pl.h + b.r) - b.y;

  // Choose the smallest push that separates them.
  const cand = [
    { d: Math.abs(top), ax: "y", to: pl.y - b.r, side: "top" },
    { d: Math.abs(bottom), ax: "y", to: pl.y + pl.h + b.r, side: "bottom" },
    { d: Math.abs(left), ax: "x", to: pl.x - b.r, side: "side" },
    { d: Math.abs(right), ax: "x", to: pl.x + pl.w + b.r, side: "side" },
  ].sort((p, q) => p.d - q.d)[0];

  if (cand.ax === "y") {
    b.y = cand.to;
    if (cand.side === "top" && b.vy > 0) b.vy = -b.vy * restitution;
    else if (cand.side === "bottom" && b.vy < 0) b.vy = -b.vy * restitution;
  } else {
    b.x = cand.to;
    const outward = Math.sign(cand.to - (pl.x + pl.w / 2)) || 1;
    if (Math.sign(b.vx) !== outward) b.vx = -b.vx * restitution;
  }
  return cand.side;
}

/** Ball vs. every platform on the current map. */
function ballVsPlatforms(b) {
  let hit = null;
  for (const pl of activePlatforms()) {
    if (pl.kind === "ghost") continue;                 // ball ignores these
    const rest = ballRest * (pl.kind === "bounce" ? PLAT_BOUNCE : PLAT_REST);
    const side = resolvePlatform(b, pl, rest);
    if (side) {
      hit = side;
      if (pl.kind === "bounce") {
        // Guarantee a lively kick off a pad rather than a limp tap.
        if (side === "top") b.vy = Math.min(b.vy, -320);
        burst(b.x, b.y, "#38bdf8", 6);
      }
      limitSpeed(b, BALL_MAX_V);
    }
  }
  return hit;
}

/** Players land on platforms; ghost slabs are solid underfoot. */
function playerVsPlatforms(p) {
  for (const pl of activePlatforms()) {
    // Treat the player as a circle and only support them from ABOVE, so a
    // platform never traps someone who jumped into its underside.
    const withinX = p.x > pl.x - p.r * 0.65 && p.x < pl.x + pl.w + p.r * 0.65;
    if (!withinX) continue;
    const feet = p.y + p.r;
    /*
      Land only when the feet have actually reached the surface. An earlier
      version snapped from a band ABOVE the slab too, which teleported a falling
      player up to 12px downward onto it — visibly wrong on the catwalk.
    */
    if (p.vy >= 0 && feet >= pl.y - 1 && feet <= pl.y + pl.h + 10) {
      p.y = pl.y - p.r;
      p.vy = 0;
      p.onGround = true;
    }
  }
}

/**
 * What expression should this player be wearing? Derived from live state, so a
 * face changes as the match happens rather than being chosen once.
 * Returns one of: stunned | kick | air | happy | sad | idle
 */
function faceMood(pl) {
  if (!pl) return "idle";
  if (pl.stun > 0) return "stunned";
  if (pl.kickT > 0) return "kick";
  if (!pl.onGround) return "air";
  // Scoreline mood, but only once a match is actually under way.
  const me = game.score[pl.index], them = game.score[1 - pl.index];
  if (game.scene === SCENE.CELEBRATE || game.scene === SCENE.WIN) {
    if (me > them) return "happy";
    if (me < them) return "sad";
  }
  return "idle";
}

/*
  TEMPORARY WALLS

  Each player can raise a short-lived wall in front of themselves. Walls are the
  same axis-aligned slabs the arena platforms use, so they inherit the collision
  code that is already tested — the ball rebounds off them and players stand on
  them. They decay on a timer and can be destroyed by a hard enough shot, which
  stops them being a permanent goal-blocker.

  Charges refill over time so the ability is rate-limited rather than free.
*/
const WALL_MIN_GOAL_GAP = 120;  // walls stay this far from a goal mouth
const WALL_W = 18;
const WALL_H = 96;
const WALL_LIFE = 6;            // seconds before it crumbles
const WALL_COOLDOWN = 1.6;      // between placements
const WALL_CHARGES = 2;         // held at once
const WALL_RECHARGE = 7;        // seconds to earn one back
const WALL_DIST = 62;           // how far in front it appears
/*
  A wall is placed relative to the BUILDER, not welded to the grass. Built from a
  standing position it still rises from the ground, but built in mid-air it
  appears in front of the player at that height — so a jumping player can throw
  up a block where the ball actually is, instead of one that materialises at
  their feet.

  WALL_AIR_MARGIN is how far the wall's top sits above the builder's head, so a
  wall raised in mid-air always covers the player rather than starting below them.
*/
const WALL_AIR_MARGIN = 12;
const WALL_Y_MIN = 40;          // never built off the top of the screen
const WALL_HP = 3;              // hard hits it survives
const WALL_BREAK_V = 900;       // ball speed that counts as a hard hit
const WALL_KICK_LIFE = 1.6;     // seconds a direct kick takes off a wall
const WALL_KICK_REACH = 26;     // how close the leg must be to connect
// A ball impact also costs the wall time, scaled by how hard it lands.
const WALL_BALL_MIN_V = 260;    // below this the ball just bounces off harmlessly
const WALL_BALL_LIFE_MIN = 0.35; // cost of a soft-but-real hit
const WALL_BALL_LIFE_MAX = 1.8;  // cost at full pace
const WALL_HIT_CD = 0.2;        // per-wall gap between ball hits
const WALL_REST = 0.72;         // bounciness

/** Can this player raise a wall right now? */
function canBuildWall(pl) {
  return pl.stun <= 0 && pl.wallCD <= 0 && pl.wallCharges > 0 &&
         game.walls.filter((w) => w.owner === pl.index).length < WALL_CHARGES;
}

/**
 * Raise a wall in front of `pl`. Returns the wall, or null if refused.
 * Placement is clamped inside the pitch and pushed out of the goal mouths so a
 * wall can never make a goal unreachable.
 */
/*
  In the net and hoop modes a tall vertical wall would simply block the rally, so
  the same ability instead lays a horizontal PLATFORM in front of the player —
  something to jump onto and spike or shoot from. It is the same entity with
  different dimensions, so every collider, timer and damage rule already applies.
*/
const buildsPlatform = () => modeCfg().net > 0 || game.mode === MODE.BASKET;

const PLATFORM_W = 118;         // built platform: wide and shallow
const PLATFORM_H = 16;
/*
  A built platform appears just above the BUILDER, not at a fixed height. It used
  to spawn at one authored y, so building it while airborne dropped it far below
  your feet — useless mid-rally, and impossible to stack. Now it lands a step
  above the head, wherever that head happens to be.

  PLATFORM_RISE is the gap from the top of the head to the underside of the new
  platform: enough that the builder is never overlapping it at birth, small
  enough to be a step you can actually hop onto.
*/
const PLATFORM_RISE = 34;
const PLATFORM_Y_MIN = 74;           // never so high the ball cannot pass over
const PLATFORM_Y = GROUND_Y - 108;   // fallback height, used when there is no builder

function buildWall(pl) {
  if (!canBuildWall(pl)) return null;

  const asPlatform = buildsPlatform();
  const bw = asPlatform ? PLATFORM_W : WALL_W;
  const bh = asPlatform ? PLATFORM_H : WALL_H;
  /*
    Platforms follow the builder's height so one can be planted wherever the
    player is — including in mid-air, to climb. Clamped at the top so it cannot
    be built off-screen, and at the bottom so it always clears the grass by a
    ball's height rather than sealing the floor.
  */
  let by;
  if (asPlatform) {
    const wanted = pl.y - pl.r - PLATFORM_RISE - bh;
    by = clamp(wanted, PLATFORM_Y_MIN, GROUND_Y - bh - 30);
  } else {
    /*
      The wall's TOP is anchored a little above the builder's head, so it always
      screens the player who raised it. Standing on the grass that puts the base
      on the ground as before; jumping puts the whole wall up in the air with you.

      Clamped so it can never be built off the top of the screen, and never so
      low that it sinks into the grass.
    */
    const wantedTop = pl.y - pl.r - WALL_AIR_MARGIN;
    by = clamp(wantedTop, WALL_Y_MIN, GROUND_Y - bh);
  }

  const raw = pl.x + pl.facing * WALL_DIST;
  let lo, hi;
  if (asPlatform) {
    /*
      Keep a built platform out of the net column and clear of the hoops, so the
      ability can never wall off a rally or block a shot at the basket.
    */
    lo = WALL + 8;
    hi = W - WALL - 8 - bw;
  } else {
    lo = WALL + WALL_MIN_GOAL_GAP;
    hi = W - WALL - WALL_MIN_GOAL_GAP - bw;
  }
  let x = clamp(raw - bw / 2, lo, hi);

  if (asPlatform && modeCfg().net > 0) {
    // Push it fully onto the builder's own side of the net.
    const half = W / 2;
    if (pl.index === 0) x = Math.min(x, half - NET_W / 2 - bw - 6);
    else x = Math.max(x, half + NET_W / 2 + 6);
    x = clamp(x, lo, hi);
  }

  const w = {
    owner: pl.index,
    x,
    y: by,
    w: bw,
    h: bh,
    kind: "solid",          // reuses the platform collider
    platform: asPlatform,   // drives the rendering and the label
    /*
      Does this build rest on the grass? A grounded wall grows upward out of the
      ground; one raised in mid-air has no ground to grow from, so it fades in
      like a platform. Recorded at build time rather than re-derived when drawing.
    */
    grounded: !asPlatform && Math.abs((by + bh) - GROUND_Y) < 1,
    life: WALL_LIFE * (inRun() && pl.index === 0 ? game.run.mods.wallLife : 1),
    hp: WALL_HP,
    hitCD: 0,               // gap between ball impacts
    born: 0,                // grows out of the ground when raised
  };
  game.walls.push(w);
  pl.wallCharges--;
  pl.wallCD = WALL_COOLDOWN;
  burst(x + bw / 2, by + bh, asPlatform ? "#7dd3fc" : "#94a3b8", 12);
  game.shake = Math.max(game.shake, 0.12);
  return w;
}

function updateWalls(dt) {
  for (let i = game.walls.length - 1; i >= 0; i--) {
    const w = game.walls[i];
    w.born = Math.min(1, w.born + dt * 6);      // rise animation
    if (w.kickFlash > 0) w.kickFlash = Math.max(0, w.kickFlash - dt);
    if (w.hitCD > 0) w.hitCD = Math.max(0, w.hitCD - dt);
    w.life -= dt;
    if (w.life <= 0 || w.hp <= 0) {
      burst(w.x + w.w / 2, w.y + w.h / 2, "#64748b", 14);
      game.walls.splice(i, 1);
    }
  }
  // Recharge, per player.
  for (const pl of game.players) {
    if (!pl) continue;
    if (pl.wallCD > 0) pl.wallCD -= dt;
    if (pl.wallCharges < pl.wallMax) {
      pl.wallRecharge -= dt;
      if (pl.wallRecharge <= 0) {
        pl.wallCharges++;
        pl.wallRecharge = WALL_RECHARGE *
          (inRun() && pl.index === 0 ? game.run.mods.wallRecharge : 1);
      }
    } else {
      pl.wallRecharge = WALL_RECHARGE;
    }
  }
}

/** Ball vs. every standing wall. A hard hit costs the wall a hit point. */
function ballVsWalls(b) {
  for (let i = game.walls.length - 1; i >= 0; i--) {
    const w = game.walls[i];
    if (w.born < 0.5) continue;                 // still rising: not yet solid
    const speed = len(b.vx, b.vy);
    const side = resolvePlatform(b, w, ballRest * WALL_REST);
    if (!side) continue;

    limitSpeed(b, BALL_MAX_V);

    /*
      A ball striking a wall shortens its life, like a kick does — scaled by how
      hard it hit, so a firm shot costs the wall much more than a gentle roll.

      Two guards matter here. This runs every substep while the ball is touching,
      so without a hit COOLDOWN a ball resting against a wall would drain 120
      hits a second; and without a speed FLOOR a ball trickling along the top
      would erode it for free.
    */
    /*
      Your own wall is your defence, so you cannot break it yourself. Attributed
      by whoever last touched the ball: if that was the wall's owner, the ball
      bounces off harmlessly. An untouched ball (a mine blast, a stray rebound)
      damages nobody's wall either, which is the safe default.
    */
    if (w.owner === game.ballLastTouch) continue;
    if (game.ballLastTouch < 0) continue;

    if (w.hitCD > 0) continue;
    if (speed < WALL_BALL_MIN_V) continue;

    const over = (speed - WALL_BALL_MIN_V) / (WALL_BREAK_V - WALL_BALL_MIN_V);
    const cost = WALL_BALL_LIFE_MIN +
                 clamp(over, 0, 1.5) * (WALL_BALL_LIFE_MAX - WALL_BALL_LIFE_MIN);
    w.life -= cost;
    w.hitCD = WALL_HIT_CD;
    w.kickFlash = Math.max(w.kickFlash || 0, 0.2);

    // A really hard shot still costs a hit point on top, as before.
    if (speed > WALL_BREAK_V) {
      w.hp--;
      game.shake = Math.max(game.shake, 0.14);
    }
    burst(b.x, b.y, "#cbd5e1", 8);

    if (w.life <= 0 || w.hp <= 0) {
      burst(w.x + w.w / 2, w.y + w.h / 2, "#94a3b8", 16);
      game.walls.splice(i, 1);
    }
  }
}

/**
 * A kick that lands on a wall knocks time off it. Called during the kick swing,
 * so it costs the attacker a swing rather than being free — and it gives a
 * player without a fast shot a way to clear a wall in their path.
 * Returns the wall that was hit, or null.
 */
function kickVsWalls(pl) {
  if (pl.kickT <= 0 || pl.wallKicked) return null;
  const tip = pl.legTip;
  for (let i = game.walls.length - 1; i >= 0; i--) {
    const w = game.walls[i];
    if (w.born < 0.5) continue;
    if (w.owner === pl.index) continue;      // you cannot kick down your own wall
    // Nearest point on the slab to the leg tip.
    const cx = clamp(tip.x, w.x, w.x + w.w);
    const cy = clamp(tip.y, w.y, w.y + w.h);
    if (len(tip.x - cx, tip.y - cy) > tip.r + WALL_KICK_REACH) continue;

    w.life -= WALL_KICK_LIFE;
    w.kickFlash = 0.25;
    pl.wallKicked = true;              // one wall per swing
    burst(cx, cy, "#cbd5e1", 10);
    game.shake = Math.max(game.shake, 0.16);
    if (w.life <= 0) {
      burst(w.x + w.w / 2, w.y + w.h / 2, "#94a3b8", 16);
      game.walls.splice(i, 1);
    }
    return w;
  }
  return null;
}

/** Players stand on their own and each other's walls. */
function playerVsWalls(p) {
  for (const w of game.walls) {
    if (w.born < 0.5) continue;
    const withinX = p.x > w.x - p.r * 0.65 && p.x < w.x + w.w + p.r * 0.65;
    if (!withinX) continue;
    const feet = p.y + p.r;
    // A built platform is only 16px deep, so give it a usable landing band
    // rather than a fraction of its height.
    const band = w.platform ? w.h + 10 : w.h * 0.5;
    if (p.vy >= 0 && feet >= w.y - 1 && feet <= w.y + band) {
      p.y = w.y - p.r;
      p.vy = 0;
      p.onGround = true;
    }
  }
}

/*
  ROGUELIKE RUN (single player)

  A ladder of matches against escalating CPU opponents. Win one and you choose
  an upgrade that persists for the rest of the run; lose and the run ends.

  Design notes:
    - Upgrades are MULTIPLIERS applied on top of the team's own stats, held in
      `game.run.mods`. They are re-applied in Player.applyChaos, which already
      recomputes derived stats, so a mid-run power-up or chaos roll composes
      correctly instead of overwriting them.
    - Every stage is beatable by design: the CPU tier rises but the target score
      stays low, and the player keeps compounding advantages.
    - Losing forfeits the run's upgrades, not the leaderboard record.
*/
const RUN_STAGES = [
  { name: "WARM-UP",    cpu: 0, goals: 2, mode: "single", label: "friendly kickabout" },
  { name: "THE LOCALS", cpu: 0, goals: 3, mode: "single", label: "they mean it now" },
  { name: "BEACH DUEL", cpu: 1, goals: 3, mode: "volley", label: "sand and a high net" },
  { name: "COURT CLASH",cpu: 1, goals: 3, mode: "tennis", label: "one bounce per side" },
  { name: "THE ARENA",  cpu: 1, goals: 4, mode: "single", label: "platforms in play" },
  { name: "HARDWOOD",   cpu: 2, goals: 3, mode: "basket", label: "through the hoop" },
  { name: "CHAOS PIT",  cpu: 2, goals: 4, mode: "single", label: "every stat re-rolls" },
  { name: "THE FINAL",  cpu: 2, goals: 5, mode: "single", label: "beat the champion" },
];

/*
  Upgrade pool. `apply` mutates the run's modifier bag; nothing here touches a
  Player directly, so the same upgrade works for a player created later.
*/
const UPGRADES = [
  { id: "speed",   name: "FLEET FOOTED", desc: "+18% movement speed",
    apply: (m) => { m.speed *= 1.18; } },
  { id: "power",   name: "CANNON LEG",   desc: "+22% shot power",
    apply: (m) => { m.shot *= 1.22; } },
  { id: "jump",    name: "SPRING HEELS", desc: "+16% jump height",
    apply: (m) => { m.jump *= 1.16; } },
  { id: "size",    name: "BROAD SHOULDERS", desc: "+12% size and mass",
    apply: (m) => { m.size *= 1.12; } },
  { id: "small",   name: "NIMBLE",       desc: "-12% size, harder to hit",
    apply: (m) => { m.size *= 0.88; } },
  { id: "walls",   name: "MASON",        desc: "+1 wall charge",
    apply: (m) => { m.wallCharges += 1; } },
  { id: "wallLife",name: "REINFORCED",   desc: "walls last 50% longer",
    apply: (m) => { m.wallLife *= 1.5; } },
  { id: "recharge",name: "QUARRY",       desc: "walls recharge twice as fast",
    apply: (m) => { m.wallRecharge *= 0.5; } },
  { id: "ammo",    name: "GUNSLINGER",   desc: "start each match with a pistol",
    apply: (m) => { m.startAmmo += PISTOL_AMMO; } },
  { id: "keeper",  name: "LOYAL KEEPER", desc: "a goalkeeper joins every match",
    apply: (m) => { m.freeKeeper = true; } },
  { id: "striker", name: "STRIKE PARTNER", desc: "a striker joins every match",
    apply: (m) => { m.freeStriker = true; } },
  { id: "cooldown",name: "QUICK FEET",   desc: "kick cooldown cut by a third",
    apply: (m) => { m.kickCD *= 0.66; } },
];

const upgradeById = (id) => UPGRADES.find((u) => u.id === id) || null;

/** A fresh, neutral modifier bag. */
function freshMods() {
  return {
    speed: 1, shot: 1, jump: 1, size: 1,
    wallCharges: 0, wallLife: 1, wallRecharge: 1,
    startAmmo: 0, freeKeeper: false, freeStriker: false, kickCD: 1,
  };
}

/** Begin a new run at stage 0. */
function startRun() {
  game.run = {
    active: true,
    stage: 0,
    mods: freshMods(),
    taken: [],            // upgrade ids, in the order chosen
    offer: [],            // the three currently on offer
    offerRow: 0,
    lives: 1,
    bestStage: game.run ? game.run.bestStage : 0,
    teamIdx: null,          // set when the first match starts
    cpuTeamIdx: null,
  };
  loadRunBest();
  beginRunStage(true);      // only the opening stage shows team select
}

/**
 * Configure and launch the current stage.
 *
 * `firstStage` is true only for the opening match, which is the ONLY point a run
 * shows team select. Later stages drop straight into the countdown: returning to
 * select between every stage let the player re-pick a team, which silently
 * changed their speed and shot power and made the carried-over upgrades look
 * like they had been lost.
 */
function beginRunStage(firstStage) {
  const st = RUN_STAGES[game.run.stage];
  game.mode = st.mode;
  game.cpu = [false, true];
  game.cpuLevel = st.cpu;
  game.goalsToWin = st.goals;
  game.timeIdx = 0;                       // no clock: a run is decided on goals
  game.chaos = st.name === "CHAOS PIT";
  game.mapId = st.name === "THE ARENA" ? "terraces" : "classic";
  game.seats = [null, null];
  game.locked = [false, false];

  if (firstStage) {
    game.scene = SCENE.SELECT;            // pick your team once, at the start
    return;
  }

  /*
    Keep the team the player locked in at the start of the run, then go straight
    into the next match. `startMatch` rebuilds both Players, and the constructor
    calls applyChaos, so the run modifiers are re-applied to the fresh object.
  */
  game.sel = [game.run.teamIdx, game.run.cpuTeamIdx];
  startMatch();
}

/**
 * Pick three distinct upgrades to offer, never repeating one already taken
 * unless the pool is exhausted.
 */
function rollOffer() {
  const pool = UPGRADES.filter((u) => !game.run.taken.includes(u.id));
  const from = pool.length >= 3 ? pool : UPGRADES.slice();
  const picked = [];
  while (picked.length < 3 && picked.length < from.length) {
    const c = from[(Math.random() * from.length) | 0];
    if (!picked.includes(c)) picked.push(c);
  }
  game.run.offer = picked;
  game.run.offerRow = 0;
}

/** Take an upgrade and advance to the next stage. */
function takeUpgrade(u) {
  if (!u) return;
  u.apply(game.run.mods);
  game.run.taken.push(u.id);
  game.run.stage++;
  if (game.run.stage >= RUN_STAGES.length) {
    game.run.bestStage = RUN_STAGES.length;
    saveRunBest();
    game.scene = SCENE.RUNWIN;
    return;
  }
  game.run.bestStage = Math.max(game.run.bestStage, game.run.stage);
  saveRunBest();
  beginRunStage(false);     // straight into the next match
}

/** The run ends here. */
function endRun() {
  game.run.active = false;
  saveRunBest();
  game.scene = SCENE.RUNOVER;
}

function loadRunBest() {
  try {
    const v = parseInt(localStorage.getItem("headgame.runbest") || "0", 10);
    game.run.bestStage = Number.isFinite(v) ? clamp(v, 0, RUN_STAGES.length) : 0;
  } catch (e) { game.run.bestStage = 0; }
}

function saveRunBest() {
  try { localStorage.setItem("headgame.runbest", String(game.run.bestStage)); }
  catch (e) { /* not fatal */ }
}

const inRun = () => !!(game.run && game.run.active);

/*
  SPONSORS

  Logos are loaded from `img/sponsors/`, listed in `sponsors.json`. They appear
  on the pitch hoardings during play, along the bottom of the menu, and on the
  credits screen.

  Failure is always silent: a missing manifest, an unreadable image or a
  `file://` URL (where fetch is blocked) leaves `sponsors.list` empty and the
  game draws plain placeholder boards instead. Nothing here can stop the game
  from starting, which matters because these are optional third-party assets.
*/
const SPONSOR_DIR = "img/sponsors/";
const SPONSOR_TIERS = { gold: 1.0, silver: 0.78, bronze: 0.6 };

const sponsors = {
  list: [],            // { name, img, url, tier, ready }
  loaded: false,       // the manifest has been fetched (successfully or not)
  error: "",
  scroll: 0,           // hoarding marquee offset
};

/** Sanitise a manifest entry; returns null if unusable. */
function cleanSponsor(raw) {
  if (!raw || typeof raw !== "object") return null;
  const name = cleanName(raw.name, "");
  if (!name) return null;
  const file = String(raw.file || "").trim();
  // Refuse anything that tries to escape the sponsor folder.
  if (file.includes("..") || file.startsWith("/") || /^[a-z]+:/i.test(file)) return null;
  const tier = SPONSOR_TIERS[raw.tier] ? raw.tier : "silver";
  return { name, file, tier, url: typeof raw.url === "string" ? raw.url : "", img: null, ready: false };
}

/** Load the manifest and kick off the image loads. Never throws. */
function loadSponsors() {
  if (typeof fetch !== "function") { sponsors.loaded = true; return; }
  fetch(SPONSOR_DIR + "sponsors.json")
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error("no manifest"))))
    .then((data) => {
      const raw = Array.isArray(data) ? data : (data && data.sponsors) || [];
      sponsors.list = raw.map(cleanSponsor).filter(Boolean).slice(0, 12);
      for (const sp of sponsors.list) {
        if (!sp.file || typeof Image !== "function") continue;
        const im = new Image();
        im.onload = () => { sp.img = im; sp.ready = true; };
        im.onerror = () => { sp.ready = false; };   // skipped, not fatal
        im.src = SPONSOR_DIR + sp.file;
      }
      sponsors.loaded = true;
    })
    .catch((e) => {
      // file:// or a missing manifest: fall back to placeholder boards.
      sponsors.error = String(e && e.message || e);
      sponsors.loaded = true;
    });
}

/** Sponsors with a usable image, for drawing. */
const readySponsors = () => sponsors.list.filter((s) => s.ready && s.img);

/**
 * Draw a strip of sponsor boards. Falls back to lettered placeholder boards so
 * the hoardings never look broken when no images are present.
 */
function drawSponsorStrip(x, y, w, h, opts = {}) {
  const ready = readySponsors();
  const boards = ready.length ? ready : null;
  const count = boards ? boards.length : (opts.placeholders || 3);
  const gap = opts.gap === undefined ? 10 : opts.gap;
  const bw = (w - gap * (count - 1)) / count;
  if (bw <= 8) return;

  for (let i = 0; i < count; i++) {
    const bx = x + i * (bw + gap);
    const tier = boards ? SPONSOR_TIERS[boards[i].tier] : 0.8;
    const bh = h * tier;
    const by = y + (h - bh);

    // Board backing.
    ctx.fillStyle = opts.dark ? "rgba(8,15,28,0.85)" : "rgba(255,255,255,0.10)";
    roundRect(bx, by, bw, bh, 4);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.16)";
    ctx.lineWidth = 1;
    ctx.stroke();

    if (boards) {
      const sp = boards[i];
      // Fit the image inside the board, preserving its aspect ratio.
      const pad = 4;
      const availW = bw - pad * 2, availH = bh - pad * 2;
      const iw = sp.img.width || 1, ih = sp.img.height || 1;
      const scale = Math.min(availW / iw, availH / ih);
      const dw = iw * scale, dh = ih * scale;
      try {
        ctx.drawImage(sp.img, bx + (bw - dw) / 2, by + (bh - dh) / 2, dw, dh);
      } catch (e) {
        // A tainted or broken image: fall back to the name.
        text(sp.name, bx + bw / 2, by + bh / 2, Math.min(12, bh * 0.5),
             "#8fa3c0", "center", 800);
      }
    } else {
      text(opts.label || "YOUR LOGO HERE", bx + bw / 2, by + bh / 2,
           Math.min(11, bh * 0.45), "#5f7391", "center", 800);
    }
  }
}

/*
  MUSIC

  Synthesised with the Web Audio API rather than loaded from a file, because this
  game ships as one self-contained HTML document with no assets. A short chord
  progression with a bass line and an arpeggio, scheduled a bar ahead so it stays
  steady regardless of frame rate.

  Every entry point is wrapped: audio is unavailable in some environments, and
  browsers refuse to start a context until the user has interacted with the page.
  Failure is always silent — the game must never break because sound cannot play.
*/
const MUSIC_BPM = 104;
const MUSIC_LOOKAHEAD = 0.35;   // seconds of notes scheduled in advance

// Two moods: a driving menu loop and a lighter in-match loop.
const MUSIC_TRACKS = {
  menu: {
    // i - VI - III - VII in A minor, the standard "heroic menu" turn.
    chords: [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]],
    bass: [33, 29, 36, 31],
    arp: [0, 2, 1, 2],
    gain: 0.16,
  },
  play: {
    // Same key, brighter voicing, less busy so it sits under the action.
    chords: [[57, 61, 64], [59, 62, 66], [55, 59, 62], [52, 57, 60]],
    bass: [33, 35, 31, 28],
    arp: [0, 1, 2, 1],
    gain: 0.1,
  },
};

const music = {
  ctx: null,
  master: null,
  started: false,
  track: null,        // key into MUSIC_TRACKS
  step: 0,            // eighth-note counter
  nextTime: 0,
  failed: false,      // audio unavailable; stop trying
  live: 0,            // notes scheduled but not yet released, for the tests
};

const midiToHz = (n) => 440 * Math.pow(2, (n - 69) / 12);

/** Create the audio context on first use. Returns false if audio is unusable. */
function musicInit() {
  if (music.failed) return false;
  if (music.ctx) return true;
  try {
    const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!AC) { music.failed = true; return false; }
    music.ctx = new AC();
    music.master = music.ctx.createGain();
    music.master.gain.value = 0;
    music.master.connect(music.ctx.destination);
    return true;
  } catch (e) {
    music.failed = true;         // blocked or unsupported
    return false;
  }
}

/** One plucked note. `type` shapes the envelope for bass, chord or lead. */
function musicNote(midi, when, dur, level, type) {
  const c = music.ctx;
  if (!c) return;
  try {
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type === "bass" ? "triangle" : type === "lead" ? "square" : "sine";
    osc.frequency.value = midiToHz(midi);

    // Short attack, exponential decay: a pluck rather than a drone.
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(level, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    osc.connect(g);
    g.connect(music.master);
    osc.start(when);
    const endsAt = when + dur + 0.02;
    osc.stop(endsAt);

    /*
      RELEASE THE NODES when the note finishes.

      osc.stop() silences an oscillator but does not detach it: the gain node
      stays wired to the master for the life of the page. At ~230 notes a minute
      that left roughly 470 dead nodes per minute connected to a graph the audio
      thread walks every render quantum, so the page grew steadily more stuttery
      the longer it was open and only a reload cleared it.

      onended fires after stop(), which is the moment it is safe to unwire. The
      handler is also the only strong reference left, so both nodes become
      collectable as soon as it runs.
    */
    osc.onended = () => {
      try { osc.disconnect(); } catch (e) { /* already gone */ }
      try { g.disconnect(); } catch (e) { /* already gone */ }
      music.live = Math.max(0, music.live - 1);
    };
    music.live++;
  } catch (e) {
    // A scheduling failure must not take the game with it.
  }
}

/** Schedule any notes falling inside the lookahead window. */
function musicPump() {
  if (!music.started || !music.ctx || music.failed) return;
  const t = MUSIC_TRACKS[music.track];
  if (!t) return;

  const spb = 60 / MUSIC_BPM;
  const eighth = spb / 2;
  try {
    while (music.nextTime < music.ctx.currentTime + MUSIC_LOOKAHEAD) {
      const step = music.step;
      const bar = Math.floor(step / 8) % t.chords.length;
      const chord = t.chords[bar];
      const beat = step % 8;

      // Bass on the downbeat and the half-bar.
      if (beat === 0 || beat === 4) {
        musicNote(t.bass[bar], music.nextTime, spb * 0.9, 0.5, "bass");
      }
      // Chord pad on the downbeat.
      if (beat === 0) {
        for (const n of chord) {
          musicNote(n, music.nextTime, spb * 1.7, 0.16, "pad");
        }
      }
      // Arpeggio on the off-beats.
      if (beat % 2 === 1) {
        const idx = t.arp[(step / 2 | 0) % t.arp.length];
        musicNote(chord[idx % chord.length] + 12, music.nextTime, eighth * 0.8, 0.1, "lead");
      }

      music.nextTime += eighth;
      music.step++;
    }
  } catch (e) {
    music.failed = true;
  }
}

/** Start or switch the track. Safe to call every frame. */
function musicPlay(trackName) {
  if (!game.opt.music) { musicStop(); return; }
  if (!musicInit()) return;
  try {
    if (music.ctx.state === "suspended") music.ctx.resume();
  } catch (e) { /* the browser will allow it after a real interaction */ }

  if (music.track !== trackName) {
    music.track = trackName;
    music.step = 0;
    music.nextTime = music.ctx.currentTime + 0.05;
  }
  if (!music.started) {
    music.started = true;
    music.nextTime = music.ctx.currentTime + 0.05;
  }
  // Fade to the track's level.
  const target = (MUSIC_TRACKS[trackName] || {}).gain || 0.12;
  try {
    music.master.gain.cancelScheduledValues(music.ctx.currentTime);
    music.master.gain.linearRampToValueAtTime(target, music.ctx.currentTime + 0.6);
  } catch (e) { /* ignore */ }
}

/** Fade out and stop scheduling. */
function musicStop() {
  if (!music.ctx || !music.started) return;
  try {
    music.master.gain.cancelScheduledValues(music.ctx.currentTime);
    music.master.gain.linearRampToValueAtTime(0, music.ctx.currentTime + 0.4);
  } catch (e) { /* ignore */ }
  music.started = false;
  music.track = null;
  /*
    Notes already scheduled release themselves through their own onended, so
    nothing is force-disconnected here — cutting them off early would clip the
    fade. The counter is left alone for the same reason.
  */
}

/** Which track suits the current scene? */
function musicTrackForScene() {
  switch (game.scene) {
    case SCENE.PLAY:
    case SCENE.COUNTDOWN:
    case SCENE.CELEBRATE:
    case SCENE.ARENA3D:
      return "play";
    default:
      return "menu";
  }
}

const PU_MIN = 3.5, PU_MAX = 6;  // power-up spawn interval (seconds)
const PU_R = 18;
const PU_LIFE = 12;              // despawn if untouched
// Power-ups spawn in a low band near the grass: the bottom of it is walkable,
// the top needs a hop even from the worst jumper on the roster.
const PU_Y_LOW = GROUND_Y - 30;  // just clear of the grass
const PU_Y_HIGH = GROUND_Y - 150;

/* ------------------------------------------------------------- 2. MATH */

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const len = (x, y) => Math.hypot(x, y);

function limitSpeed(v, max) {
  const s = len(v.vx, v.vy);
  if (s > max) { const k = max / s; v.vx *= k; v.vy *= k; }
  return v;
}

/* ------------------------------------------------------- 2b. 3D MATH

   Pure vector and camera maths for the 3D arena mode. Everything here is a
   function of its arguments only — no globals, no canvas — so the self-test
   suite can drive it directly, exactly like the 2D physics kernel below.

   Coordinate system: right-handed, y UP. The arena floor is y = 0. This is
   deliberately NOT the canvas convention (where y grows downward): the flip
   happens once, inside project(), so every other piece of 3D code can think
   in ordinary world terms.
*/

const v3 = (x = 0, y = 0, z = 0) => ({ x, y, z });
const v3add = (a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z);
const v3sub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
const v3scale = (a, k) => v3(a.x * k, a.y * k, a.z * k);
const v3dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const v3cross = (a, b) => v3(a.y * b.z - a.z * b.y,
                             a.z * b.x - a.x * b.z,
                             a.x * b.y - a.y * b.x);
const v3len = (a) => Math.hypot(a.x, a.y, a.z);

/** Unit vector. A zero vector returns itself rather than NaN. */
function v3norm(a) {
  const l = v3len(a);
  return l > 1e-9 ? v3scale(a, 1 / l) : v3(0, 0, 0);
}

/*
  Anything nearer than this is treated as behind the camera. A perspective
  divide by a near-zero depth would fling a vertex thousands of pixels off
  screen, and a quad with one such corner smears across the whole viewport —
  so project() reports null instead and the renderer drops the face.
*/
const NEAR = 12;

/** Clamp for pitch: ±55°, so the camera can never tumble over the top. */
const PITCH_MAX = 0.96;

/**
 * The camera's orthonormal basis from its yaw and pitch.
 *
 * `fwd` is where the camera looks, `right` is screen-right, `up` is screen-up.
 * Computed once per viewport per frame and passed into every projection, since
 * recomputing six trig calls per vertex measurably dominated the frame.
 */
function camBasis(cam) {
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const fwd = v3(sy * cp, sp, cy * cp);
  // Right is horizontal by construction: yaw only. This keeps the horizon
  // level no matter how far the camera pitches, which is what stops the world
  // appearing to roll when you look up.
  const right = v3(cy, 0, -sy);
  /*
    Order matters: cross(fwd, right) points UP, and cross(right, fwd) points
    down. Getting it backwards flips the whole world vertically while leaving
    every orthonormality check passing, so the two directional assertions in
    the suite are the only thing that catches it.
  */
  const up = v3cross(fwd, right);
  return { fwd, right, up };
}

/**
 * World point -> camera space. `z` is depth along the view direction.
 * Pass the basis from camBasis(); it is not recomputed here.
 */
function worldToCam(p, cam, basis) {
  const d = v3sub(p, cam.pos);
  return v3(v3dot(d, basis.right), v3dot(d, basis.up), v3dot(d, basis.fwd));
}

/**
 * A viewport: where on the canvas it sits, and how strongly it foreshortens.
 * `focal` is derived from the vertical field of view so a taller viewport does
 * not silently widen the lens — split-screen halves the height, and without
 * this the two views would show different amounts of the world.
 */
function makeView(x, y, w, h, fov = 1.15) {
  return {
    x, y, w, h,
    cx: x + w / 2,
    cy: y + h / 2,
    focal: (h / 2) / Math.tan(fov / 2),
  };
}

/**
 * Project a world point into a viewport.
 *
 * Returns {x, y, s, z} where `s` is the scale factor at that depth (so a
 * sphere of radius r covers r*s pixels) and `z` is camera depth for sorting.
 * Returns null when the point is at or behind the near plane — see NEAR.
 */
function project(p, cam, view, basis) {
  const c = worldToCam(p, cam, basis);
  if (c.z < NEAR) return null;
  const s = view.focal / c.z;
  // Canvas y grows downward, world y grows upward: the single flip lives here.
  return { x: view.cx + c.x * s, y: view.cy - c.y * s, s, z: c.z };
}

/* -------------------------------------------------- 3. PURE PHYSICS KERNEL

   Everything here is a pure function of its arguments (bodies are plain
   {x,y,vx,vy,r,mass} records). The self-test suite drives these directly.   */

/**
 * Semi-implicit Euler integration with drag. Mutates and returns `b`.
 * `g` is passed in explicitly (rather than read from the module-level
 * `gravity`) to keep this function pure and directly testable.
 */
function integrate(b, dt, g, drag) {
  b.vy += g * dt;
  if (drag) {
    const d = 1 - drag * dt;
    b.vx *= d;
    b.vy *= d;
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  return b;
}

/**
 * Resolve a moving circle against a static circle (post, leg tip).
 * Returns true when contact occurred.
 */
function resolveStaticCircle(b, cx, cy, cr, restitution) {
  const dx = b.x - cx, dy = b.y - cy;
  const d = len(dx, dy);
  const min = b.r + cr;
  if (d >= min || d === 0) return false;

  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * min;              // depenetrate
  b.y = cy + ny * min;

  const vn = b.vx * nx + b.vy * ny; // reflect only the normal component
  if (vn < 0) {
    b.vx -= (1 + restitution) * vn * nx;
    b.vy -= (1 + restitution) * vn * ny;
  }
  return true;
}

/**
 * Elastic-ish collision between two circles with mass. Mutates both.
 * `restitution` 0 = perfectly inelastic, 1 = perfectly elastic.
 * Returns true when contact occurred.
 */
function resolveCircles(a, b, restitution) {
  const dx = b.x - a.x, dy = b.y - a.y;
  let d = len(dx, dy);
  const min = a.r + b.r;
  if (d >= min) return false;
  if (d === 0) { d = 0.001; }

  const nx = dx / d, ny = dy / d;
  const overlap = min - d;
  const ma = a.mass, mb = b.mass, total = ma + mb;

  // Positional correction, split by inverse mass.
  a.x -= nx * overlap * (mb / total);
  a.y -= ny * overlap * (mb / total);
  b.x += nx * overlap * (ma / total);
  b.y += ny * overlap * (ma / total);

  // Impulse along the normal.
  const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  const vn = rvx * nx + rvy * ny;
  if (vn > 0) return true;                 // already separating

  const j = (-(1 + restitution) * vn) / (1 / ma + 1 / mb);
  a.vx -= (j / ma) * nx;
  a.vy -= (j / ma) * ny;
  b.vx += (j / mb) * nx;
  b.vy += (j / mb) * ny;
  return true;
}

/**
 * Is the ball inside a goal mouth? Returns -1 (left goal), 1 (right goal)
 * or 0. The scorer is the OPPOSITE side: ball in the left goal scores for P2.
 */
/**
 * Is the ball inside a goal mouth? Returns -1 (left goal), 1 (right goal)
 * or 0. The scorer is the OPPOSITE side: ball in the left goal scores for P2.
 *
 * The mouth is the band [goalTop(side), goalTop(side) + goalHeight()] — the SAME
 * band drawGoal paints. Both edges move with the goal: nailing the lower edge to
 * the ground would let a raised goal score on empty air beneath its net, and
 * would refuse a legitimate goal when the frame dips below the grass line.
 */
function goalScored(ball) {
  if (ball.x - ball.r < WALL + 2) {
    const top = goalTop(0), bot = goalBottom(0);
    return (ball.y + ball.r >= top && ball.y - ball.r <= bot) ? -1 : 0;
  }
  if (ball.x + ball.r > W - WALL - 2) {
    const top = goalTop(1), bot = goalBottom(1);
    return (ball.y + ball.r >= top && ball.y - ball.r <= bot) ? 1 : 0;
  }
  return 0;
}


/**
 * Kick impulse: direction blends "away from body" with facing + upward bias.
 * `up` defaults to KICK_UP; a Power Shot passes a smaller value to fire flatter.
 */
function kickImpulse(dx, dy, facing, power, proximity, up = KICK_UP) {
  const d = len(dx, dy) || 1;
  let ux = dx / d, uy = dy / d;
  ux = ux * 0.55 + facing * 0.65;          // bias downfield
  uy = uy * 0.55 - up;                     // bias upward (canvas y grows down)
  const m = len(ux, uy) || 1;
  const mag = power * lerp(0.55, 1, proximity);
  return { ix: (ux / m) * mag, iy: (uy / m) * mag };
}

/** Map a 1..5 stat pip count onto a multiplier around 1.0. */
function statToMultiplier(pips, spread) {
  return 1 + (pips - 3) * spread;
}

/*
  Helpers (goalkeeper / striker) are simple AI circles owned by one player.
  A keeper patrols its owner's goal line and blocks; a striker chases the ball
  and boots it toward the opponent's goal. They collide with the ball only —
  never with players — so they cannot body-block a human.
*/
const HELP_R = 22;
const HELP_KEEP_SPD = 285;    // keeper vertical/horizontal tracking speed
const HELP_STRIKE_SPD = 250;  // striker chase speed
const HELP_KICK = 620;        // striker kick impulse
const HELP_KICK_CD = 0.55;    // striker kick cooldown
