        game.walls = [];
        const p = game.players[1];
        p.reset();
        p.x = W / 2;
        p.facing = 1;
        p.wallCharges = 3;
        p.wallCD = 0;
        const w = buildWall(p);
        w.born = 1;
        game.ballLastTouch = 0;         // P1 kicked it
        return w;
      };

      /** Fire the ball into a wall and report the life it cost. */
      const strike = (speed) => {
        const w = freshWall();
        game.ball = { x: w.x - BALL_R - 30, y: w.y + w.h / 2, vx: speed, vy: 0,
                      r: BALL_R, mass: BALL_MASS };
        const before = w.life;
        for (let i = 0; i < 60; i++) {
          integrate(game.ball, DT, 0, 0);
          ballVsWalls(game.ball);
        }
        return { cost: before - w.life, alive: game.walls.includes(w) };
      };

      const firm = strike(700);
      ok("a ball impact takes time off a wall", firm.cost > 0.2,
         `${firm.cost.toFixed(2)}s`);

      // Harder hits must cost more.
      const soft = strike(320), hard = strike(1400);
      ok("harder ball impacts cost more life", hard.cost > soft.cost * 1.5,
         `${soft.cost.toFixed(2)}s vs ${hard.cost.toFixed(2)}s`);

      // Below the floor, a ball just bounces.
      const trickle = strike(120);
      ok("a slow ball does not damage a wall", trickle.cost === 0,
         `${trickle.cost.toFixed(2)}s`);

      /*
        The guard that matters most: ballVsWalls runs every substep, so a ball
        RESTING against a wall would otherwise land 120 hits a second and
        vaporise it. Only natural decay may apply.
      */
      {
        const w = freshWall();
        game.ball = { x: w.x - BALL_R, y: w.y + w.h - BALL_R, vx: 0, vy: 0,
                      r: BALL_R, mass: BALL_MASS };
        const before = w.life;
        const secs = 3;
        for (let i = 0; i < secs / DT; i++) {
          ballVsWalls(game.ball);
          updateWalls(DT);
        }
        const expected = before - secs;          // decay only
        ok("a ball resting on a wall does not drain it",
           Math.abs(w.life - expected) < 0.15,
           `life ${w.life.toFixed(2)} vs decay-only ${expected.toFixed(2)}`);
      }

      // A per-wall cooldown stops one pass registering many hits.
      {
        const w = freshWall();
        // March it in rather than positioning by hand: placing the ball a few
        // pixels "away" repeatedly turned out to be outside its own radius.
        game.ball = { x: w.x - BALL_R - 20, y: w.y + w.h / 2, vx: 900, vy: 0,
                      r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 40; i++) {
          integrate(game.ball, DT, 0, 0);
          ballVsWalls(game.ball);
          if (w.life < WALL_LIFE) break;
        }
        const afterFirst = w.life;
        ok("the first impact registers", afterFirst < WALL_LIFE, `${afterFirst.toFixed(2)}`);
        // Immediately again: the cooldown must block it.
        ballVsWalls(game.ball);
        ok("a second impact inside the cooldown is ignored", w.life === afterFirst,
           `${afterFirst.toFixed(2)} -> ${w.life.toFixed(2)}`);
        // After the cooldown it can hit again.
        for (let i = 0; i < (WALL_HIT_CD + 0.05) / DT; i++) updateWalls(DT);
        game.ball.vx = 900;
        ballVsWalls(game.ball);
        ok("an impact after the cooldown registers again", w.life < afterFirst - 0.2,
           `${w.life.toFixed(2)}`);
      }

      // A wall that is still rising is immune, as with kicks.
      {
        const w = freshWall();
        w.born = 0.2;
        const before = w.life;
        game.ball = { x: w.x - BALL_R - 20, y: w.y + w.h / 2, vx: 900, vy: 0,
                      r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 40; i++) {
          integrate(game.ball, DT, 0, 0);
          ballVsWalls(game.ball);
        }
        ok("a rising wall takes no ball damage", w.life === before);
      }

      // Enough ball impacts destroy it, and it is removed cleanly.
      {
        const w = freshWall();
        let n = 0;
        while (game.walls.includes(w) && n < 12) {
          game.ball = { x: w.x - BALL_R - 30, y: w.y + w.h / 2, vx: 1300, vy: 0,
                        r: BALL_R, mass: BALL_MASS };
          w.hitCD = 0;
          for (let i = 0; i < 40; i++) {
            integrate(game.ball, DT, 0, 0);
            const before = w.life;
            ballVsWalls(game.ball);
            if (w.life < before) break;
          }
          n++;
        }
        ok("repeated ball impacts demolish a wall", !game.walls.includes(w), `${n} hits`);
        ok("demolition by ball takes several hits", n >= 2, `${n}`);
      }

      game.walls = [];
    }

    // ---- your own wall is immune to you ----
    {
      game.mode = MODE.SINGLE;
      game.sel = [0, 3];
      startMatch();

      /** Build a wall owned by `seat`, fully risen. */
      const wallFor = (seat) => {
        game.walls = [];
        const p = game.players[seat];
        p.reset();
        p.x = W / 2;
        p.facing = 1;
        p.wallCharges = 3;
        p.wallCD = 0;
        const w = buildWall(p);
        w.born = 1;
        return w;
      };

      /** Fire the ball into `w`, attributed to `toucher`. Returns life lost. */
      const ballInto = (w, toucher) => {
        game.ballLastTouch = toucher;
        w.hitCD = 0;
        game.ball = { x: w.x - BALL_R - 30, y: w.y + w.h / 2, vx: 1200, vy: 0,
                      r: BALL_R, mass: BALL_MASS };
        const before = w.life;
        for (let i = 0; i < 60; i++) {
          integrate(game.ball, DT, 0, 0);
          ballVsWalls(game.ball);
        }
        return before - w.life;
      };

      // The heart of it: own ball into own wall costs nothing.
      {
        const mine = wallFor(0);
        ok("your own ball does not damage your own wall", ballInto(mine, 0) === 0,
           `${ballInto(mine, 0).toFixed(2)}s`);
      }
      {
        const theirs = wallFor(1);
        ok("your ball does damage their wall", ballInto(theirs, 0) > 0.2,
           `${ballInto(theirs, 0).toFixed(2)}s`);
      }
      // And symmetrically, from the other seat.
      {
        const theirs = wallFor(1);
        ok("their own ball does not damage their own wall",
           ballInto(theirs, 1) === 0);
      }
      {
        const mine = wallFor(0);
        ok("their ball does damage your wall", ballInto(mine, 1) > 0.2,
           `${ballInto(mine, 1).toFixed(2)}s`);
      }

      // An unattributed ball (mine blast, stray rebound) harms nobody's wall.
      {
        const mine = wallFor(0);
        ok("an untouched ball damages no wall", ballInto(mine, -1) === 0);
      }

      // Same rule for kicks, both directions.
      {
        const kickInto = (w, seat) => {
          const p = game.players[seat];
          p.reset();
          p.x = w.x - p.r - 8;
          p.facing = 1;
          p.kickT = KICK_TIME * 0.5;
          p.wallKicked = false;
          const before = w.life;
          kickVsWalls(p);
          return before - w.life;
        };
        const mine = wallFor(0);
        ok("you cannot kick down your own wall", kickInto(mine, 0) === 0,
           `${kickInto(mine, 0).toFixed(2)}s`);
        const theirs = wallFor(1);
        ok("you can kick down their wall", kickInto(theirs, 0) > 0.5,
           `${kickInto(theirs, 0).toFixed(2)}s`);
      }

      // Your own wall must still be SOLID to your ball — immune, not intangible.
      {
        const mine = wallFor(0);
        game.ballLastTouch = 0;
        game.ball = { x: mine.x - BALL_R - 30, y: mine.y + mine.h / 2,
                      vx: 900, vy: 0, r: BALL_R, mass: BALL_MASS };
        let bounced = false;
        for (let i = 0; i < 60; i++) {
          integrate(game.ball, DT, 0, 0);
          ballVsWalls(game.ball);
          if (game.ball.vx < 0) { bounced = true; break; }
        }
        ok("your own wall still blocks your ball", bounced,
           `vx=${game.ball.vx.toFixed(0)}`);
        ok("and it survived the bounce", game.walls.includes(mine));
      }

      // Touching the ball must set the attribution, so this is not stale state.
      {
        const p0 = game.players[0];
        p0.reset();
        game.ballLastTouch = -1;
        game.ball = { x: p0.x + p0.r + BALL_R - 3, y: p0.y, vx: -200, vy: 0,
                      r: BALL_R, mass: BALL_MASS };
        ballVsPlayer(p0);
        ok("touching the ball records the toucher", game.ballLastTouch === 0,
           `${game.ballLastTouch}`);
      }

      game.walls = [];
      game.ballLastTouch = -1;
    }

    // ---- the build ability becomes a PLATFORM in the net and hoop modes ----
    {
      const buildIn = (mode, seat, atX, facing) => {
        game.mode = mode;
        game.cpu = [false, false];
        game.sel = [0, 3];
        startMatch();
        game.walls = [];
        const p = game.players[seat];
        p.reset();
        p.x = atX;
        p.facing = facing;
        p.wallCharges = 3;
        p.wallCD = 0;
        return buildWall(p);
      };

      // Soccer keeps the tall wall.
      {
        const w = buildIn(MODE.SINGLE, 0, W * 0.3, 1);
        ok("soccer still builds a tall wall", !w.platform && w.h > w.w,
           `${w.w}x${w.h}`);
        // Built from a standing position, so its base is on the grass. A wall
        // raised in mid-air follows the builder instead — see 19ap.
        ok("a wall built while standing reaches the ground",
           Math.abs(w.y + w.h - GROUND_Y) < 1, `${(w.y + w.h).toFixed(0)}`);
      }

      // The three sport modes build a wide, raised platform instead.
      for (const md of [MODE.VOLLEY, MODE.TENNIS, MODE.BASKET]) {
        const w = buildIn(md, 0, W * 0.3, 1);
        ok(`${md} builds a platform, not a wall`, w.platform === true);
        ok(`${md}'s build is wider than it is tall`, w.w > w.h * 3,
           `${w.w}x${w.h}`);
        ok(`${md}'s platform is off the ground`, w.y + w.h < GROUND_Y - 40,
           `bottom ${(w.y + w.h).toFixed(0)} vs ground ${GROUND_Y}`);
        ok(`${md}'s platform is inside the pitch`,
           w.x >= WALL && w.x + w.w <= W - WALL, `${w.x.toFixed(0)}`);
      }

      /*
        A platform built right at the net must land on the builder's own side —
        otherwise the ability would let you plant a step in your opponent's court.
      */
      for (const md of [MODE.VOLLEY, MODE.TENNIS]) {
        for (const seat of [0, 1]) {
          const atNet = seat === 0 ? W * 0.46 : W * 0.54;
          const w = buildIn(md, seat, atNet, seat === 0 ? 1 : -1);
          const ownSide = seat === 0 ? (w.x + w.w < W / 2) : (w.x > W / 2);
          ok(`${md}: seat ${seat} builds on its own side of the net`, ownSide,
             `x=${w.x.toFixed(0)}..${(w.x + w.w).toFixed(0)}`);
        }
      }

      // Basketball platforms must not sit in a hoop's drop path.
      {
        let bad = null;
        for (let x = WALL + 20; x < W - WALL - 20; x += 23) {
          for (const facing of [-1, 1]) {
            const w = buildIn(MODE.BASKET, 0, x, facing);
            for (const side of [0, 1]) {
              const h = hoopPos(side);
              const under = w.x < h.x + HOOP_R && w.x + w.w > h.x - HOOP_R;
              if (under && w.y > h.y && w.y < h.y + 90) {
                bad = `x=${x}: platform under hoop ${side}`;
                break;
              }
            }
            if (bad) break;
          }
          if (bad) break;
        }
        ok("a built platform never blocks a hoop", !bad, bad || "");
      }

      // It must be standable, and still take damage from the opponent.
      {
        const w = buildIn(MODE.BASKET, 1, W * 0.6, -1);
        w.born = 1;
        const p = game.players[0];
        p.reset();
        p.x = w.x + w.w / 2;
        p.y = w.y - p.r - 40;
        p.vy = 0;
        for (let i = 0; i < 240; i++) {
          p.update(DT, null);
          playerVsWalls(p);
          if (p.onGround && Math.abs(p.y + p.r - w.y) < 2) break;
        }
        ok("a player can stand on a built platform",
           p.onGround && Math.abs(p.y + p.r - w.y) < 2,
           `feet ${(p.y + p.r).toFixed(1)} vs top ${w.y}`);

        game.ballLastTouch = 0;
        w.hitCD = 0;
        game.ball = { x: w.x - BALL_R - 30, y: w.y + w.h / 2, vx: 1200, vy: 0,
                      r: BALL_R, mass: BALL_MASS };
        const before = w.life;
        for (let i = 0; i < 60; i++) {
          integrate(game.ball, DT, 0, 0);
          ballVsWalls(game.ball);
        }
        ok("a built platform still takes opponent damage", w.life < before,
           `${before.toFixed(2)} -> ${w.life.toFixed(2)}`);
      }

      game.walls = [];
      game.mode = MODE.SINGLE;
    }

    // ---- every mode has platforms, and they do not block play ----
    {
      let bad = null;
      for (const md of [MODE.VOLLEY, MODE.TENNIS, MODE.BASKET]) {
        game.mode = md;
        const pls = activePlatforms();
        if (!pls.length) { bad = `${md} has no platforms`; break; }

        for (const pl of pls) {
          // Inside the pitch.
          if (pl.x < WALL || pl.x + pl.w > W - WALL) {
            bad = `${md}: platform crosses a wall`; break;
          }
          if (pl.y < 40 || pl.y + pl.h > GROUND_Y - 20) {
            bad = `${md}: platform out of bounds at y=${pl.y}`; break;
          }
          // Net modes: nothing may sit in the net column.
          if (MODE_CFG[md].net > 0) {
            const netL = W / 2 - NET_W / 2 - 30, netR = W / 2 + NET_W / 2 + 30;
            if (pl.x < netR && pl.x + pl.w > netL) {
              bad = `${md}: platform blocks the net column`; break;
            }
          }
          // Basketball: nothing directly under a hoop's drop path.
          if (md === MODE.BASKET) {
            for (const side of [0, 1]) {
              const h = hoopPos(side);
              const under = pl.x < h.x + HOOP_R && pl.x + pl.w > h.x - HOOP_R;
              if (under && pl.y < h.y + 120 && pl.y > h.y) {
                bad = `${md}: platform under a hoop`; break;
              }
            }
          }
          if (bad) break;
        }
        if (bad) break;

        // Symmetric, so neither side is favoured.
        const mid = W / 2;
        const leftN = pls.filter((p) => p.x + p.w / 2 < mid).length;
        const rightN = pls.filter((p) => p.x + p.w / 2 > mid).length;
        if (leftN !== rightN) {
          bad = `${md}: asymmetric platforms (${leftN} vs ${rightN})`; break;
        }
      }
      ok("net and hoop modes have safe, symmetric platforms", !bad, bad || "");

      // The soccer modes still use the arena the player picked.
      game.mode = MODE.SINGLE;
      game.mapId = "towers";
      ok("soccer still uses the chosen arena",
         activePlatforms() === mapById("towers").platforms);
      game.mapId = "classic";
      ok("the classic arena is still empty in soccer", activePlatforms().length === 0);
    }

    // ---- tennis is hittable ----
    {
      const tc = MODE_CFG[MODE.TENNIS], sc = MODE_CFG[MODE.SINGLE];
      ok("the tennis ball is lighter than the soccer ball", tc.ballMass < sc.ballMass,
         `${tc.ballMass} vs ${sc.ballMass}`);
      ok("tennis gets a kick bonus", (tc.kickMul || 1) > 1, `${tc.kickMul}`);
      ok("tennis gets a wider contact window", (tc.reachMul || 1) > 1, `${tc.reachMul}`);

      // The measured contact window must now beat soccer's, not trail it.
      const win = (m) => {
        const c = MODE_CFG[m];
        return (LEG_R + c.ballR) * (c.reachMul || 1);
      };
      ok("tennis is easier to connect with than soccer", win(MODE.TENNIS) > win(MODE.SINGLE),
         `${win(MODE.TENNIS).toFixed(0)}px vs ${win(MODE.SINGLE).toFixed(0)}px`);

      // And a kick sends it further.
      const launch = (m) => {
        game.mode = m;
        const c = MODE_CFG[m];
        const q = new Player(0, TEAMS[0]);
        q.reset(); q.facing = 1;
        q.kickT = KICK_TIME * 0.5; q.kickConsumed = false;
        const tp = q.legTip;
        game.ball = { x: tp.x + 4, y: tp.y, vx: 0, vy: 0, r: c.ballR, mass: c.ballMass };
        ballVsPlayer(q);
        return len(game.ball.vx, game.ball.vy);
      };
      const tl = launch(MODE.TENNIS), sl = launch(MODE.SINGLE);
      ok("a tennis kick is stronger than a soccer kick", tl > sl * 1.2,
         `${tl.toFixed(0)} vs ${sl.toFixed(0)} px/s`);
    }

    // ---- basketball is scoreable ----
    {
      game.mode = MODE.BASKET;
      const c = MODE_CFG[MODE.BASKET];
      ok("the basketball is bouncier still", c.rest >= 1.15, `${c.rest}`);
      ok("the basketball is lighter", c.ballMass < 1, `${c.ballMass}`);

      /*
        Measure an AIMED shot, not a random one: a blind-velocity test mostly
        produces shots that were never on target, which hides whether the hoop
        itself is fair. Grid-search a scoring launch, then add aim error.
      */
      const h = hoopPos(1);
      const shoot = (vx, vy) => {
        game.ball = { x: 600, y: GROUND_Y - 40, vx, vy,
                      r: c.ballR, mass: c.ballMass, bounces: 0 };
        for (let i = 0; i < 900; i++) {
          const py = game.ball.y;
          stepBall(DT);
          ballVsHoops(game.ball);
          if (basketScored(game.ball, py) !== 0) return true;
          if (game.ball.x < 0 || game.ball.x > W) return false;
        }
        return false;
      };

      /*
        Count EVERY scoring launch on the grid, and keep the most robust one.

        This used to keep whichever cell the search happened to reach first,
        which measured the search order rather than the hoop: widening the ring
        added scoring shots (199 cells -> 271) yet made the first cell found a
        marginal steep lob, so a strictly better hoop reported a worse number and
        failed. The count is the honest measure of how scoreable the hoop is; the
        best cell is what a player who has found their shot experiences.
      */
      let solved = null, cells = 0, bestRate = -1;
      for (let vx = 200; vx <= 800; vx += 20) {
        for (let vy = -1200; vy <= -400; vy += 20) {
          if (!shoot(vx, vy)) continue;
          cells++;
          // Sample this launch's tolerance to a human-sized aim error.
          let k = 0;
          for (let i = 0; i < 40; i++) {
            if (shoot(vx * (1 + (Math.random() * 2 - 1) * 0.03),
                      vy * (1 + (Math.random() * 2 - 1) * 0.03))) k++;
          }
          if (k / 40 > bestRate) { bestRate = k / 40; solved = { vx, vy }; }
        }
      }
      ok("a scoring shot exists at all", !!solved,
         solved ? `vx=${solved.vx} vy=${solved.vy}` : "none found");
      // A wide spread of launches must work, or only one trick shot scores.
      ok("many different launches score", cells >= 150, `${cells} scoring launches`);

      if (solved) {
        ok("a perfectly aimed shot always scores", shoot(solved.vx, solved.vy));
        // A shot the player has grooved must survive a human-sized aim error.
        let n = 0;
        for (let i = 0; i < 300; i++) {
          const vx = solved.vx * (1 + (Math.random() * 2 - 1) * 0.03);
          const vy = solved.vy * (1 + (Math.random() * 2 - 1) * 0.03);
          if (shoot(vx, vy)) n++;
        }
        const pct = (n / 300) * 100;
        ok("a near-aimed shot scores often enough to feel fair", pct >= 60,
           `${pct.toFixed(1)}% with 3% aim error, best of ${cells} launches`);
      }

      /*
        The ring must be comfortably wider than the ball, and must NOT grow so
        wide that a ball clipping the outer rim is knocked sideways into the hoop
        and scores from outside it — measured to begin at HOOP_R 49.
      */
      ok("the ring is much wider than the ball", HOOP_R * 0.95 >= c.ballR * 2.5,
         `aperture ${(HOOP_R * 0.95).toFixed(1)}px vs ball r ${c.ballR}`);
      ok("the ring is not wide enough to score off the outer rim", HOOP_R <= 48,
         `${HOOP_R}`);

      /*
        A ball dropped straight down must score across a CONTIGUOUS band, and
        that band must match the ring rather than exceed it. A band wider than
        the aperture means rim deflections are scoring from outside the hoop.
      */
      {
        const dropIn = (off) => {
          game.ball = { x: h.x + off, y: h.y - 70, vx: 0, vy: 0,
                        r: c.ballR, mass: c.ballMass, bounces: 0 };
          for (let i = 0; i < 500; i++) {
            const py = game.ball.y;
            stepBall(DT);
            ballVsHoops(game.ball);
            if (basketScored(game.ball, py) !== 0) return true;
            if (game.ball.y - game.ball.r > GROUND_Y) return false;
          }
          return false;
        };
        let band = 0;
        for (let off = 0; off <= HOOP_R + c.ballR + 12; off += 0.5) {
          if (!dropIn(off)) break;
          band = off;
        }
        const aperture = HOOP_R * 0.95;
        ok("a straight drop scores across most of the ring", band >= aperture - 3,
           `${band.toFixed(1)}px of ${aperture.toFixed(1)}px`);
        ok("and never from outside it", band <= aperture + 2,
           `${band.toFixed(1)}px vs aperture ${aperture.toFixed(1)}px`);
        // In absolute terms the target must be several ball-widths wide.
        ok("the drop-in target is a usable width", band * 2 >= c.ballR * 5,
           `${(band * 2).toFixed(0)}px wide, ball is ${(c.ballR * 2).toFixed(0)}px`);
      }

      // A ball dropping cleanly through must not be rejected by the rim.
      {
        const through = { x: h.x, y: h.y - 4, vx: 0, vy: 400,
                          r: c.ballR, mass: c.ballMass };
        ballVsHoops(through);
        ok("the rim does not deflect a ball dropping through the ring",
           through.vy > 0, `vy=${through.vy.toFixed(0)}`);
      }

      // But the rim must still stop a ball coming in from the side.
      {
        const side = { x: h.x - HOOP_R - 40, y: h.y, vx: 800, vy: 0,
                       r: c.ballR, mass: c.ballMass };
        let deflected = false;
        for (let i = 0; i < 60; i++) {
          integrate(side, DT, 0, 0);
          if (ballVsHoops(side)) { deflected = true; break; }
        }
        ok("the rim still blocks a sideways ball", deflected);
      }

      // And a clear miss still misses.
      ok("a shot well wide still misses",
         basketScored({ x: h.x + HOOP_R + 40, y: h.y + 2, vx: 0, vy: 300,
                        r: c.ballR, mass: c.ballMass }, h.y - 2) === 0);
      ok("a rising ball still does not score",
         basketScored({ x: h.x, y: h.y - 2, vx: 0, vy: -300,
                        r: c.ballR, mass: c.ballMass }, h.y + 2) === 0);
    }

    game.walls = [];
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19af13. Music: it must never break the game, and must pick a sane track.
  {
    const saved = { scene: game.scene, music: game.opt.music };

    ok("there are at least two tracks", Object.keys(MUSIC_TRACKS).length >= 2);
    ok("every track is fully specified",
       Object.values(MUSIC_TRACKS).every((t) =>
         Array.isArray(t.chords) && t.chords.length &&
         Array.isArray(t.bass) && t.bass.length === t.chords.length &&
         Array.isArray(t.arp) && t.arp.length && t.gain > 0));
    ok("the tempo is musical", MUSIC_BPM >= 60 && MUSIC_BPM <= 200, `${MUSIC_BPM}`);

    // Chord and bass notes must be in a playable range.
    {
      let bad = null;
      for (const [name, t] of Object.entries(MUSIC_TRACKS)) {
        for (const ch of t.chords) {
          for (const n of ch) {
            if (n < 24 || n > 96) { bad = `${name}: note ${n} out of range`; break; }
          }
        }
        for (const n of t.bass) {
          if (n < 20 || n > 60) { bad = `${name}: bass ${n} out of range`; break; }
        }
        if (bad) break;
      }
      ok("all notes sit in a sensible register", !bad, bad || "");
      ok("midi 69 is concert A", Math.abs(midiToHz(69) - 440) < 0.01,
         `${midiToHz(69).toFixed(2)}Hz`);
      ok("an octave doubles the frequency",
         Math.abs(midiToHz(81) - 880) < 0.01, `${midiToHz(81).toFixed(2)}Hz`);
    }

    // Track choice follows the scene.
    {
      const pairs = [
        [SCENE.MENU, "menu"], [SCENE.CREDITS, "menu"], [SCENE.SETTINGS, "menu"],
        [SCENE.PLAY, "play"], [SCENE.COUNTDOWN, "play"], [SCENE.CELEBRATE, "play"],
      ];
      let bad = null;
      for (const [sc, want] of pairs) {
        game.scene = sc;
        if (musicTrackForScene() !== want) {
          bad = `${sc} chose ${musicTrackForScene()}, wanted ${want}`;
          break;
        }
      }
      ok("each scene picks a suitable track", !bad, bad || "");
      ok("every chosen track exists",
         pairs.every(([, w]) => !!MUSIC_TRACKS[w]));
    }

    /*
      The critical property: audio is unavailable in some environments and
      blocked in others until the user interacts. Every entry point must be safe
      to call regardless — the game must never fail because sound cannot play.
    */
    {
      let threw = null;
      try {
        game.opt.music = true;
        musicInit();
        musicPlay("menu");
        musicPump();
        musicPlay("play");
        for (let i = 0; i < 100; i++) musicPump();
        musicStop();
        musicPump();
        musicPlay("nonexistent-track");
        musicPump();
        musicStop();
        musicStop();                    // twice in a row
      } catch (e) { threw = e.message; }
      ok("the whole music path is safe to call without audio", !threw, threw || "");

      // With music off it must not start.
      game.opt.music = false;
      musicPlay("menu");
      ok("music does not start when the option is off", !music.started);
      game.opt.music = true;
    }

    Object.assign(game, saved);
    game.opt.music = saved.music;
  }

  // 19af14. Tournament entrants can be CPUs.
  {
    const saved = { mode: game.mode, entrantCount: game.entrantCount,
                    entrants: game.entrants, rosterCpu: [...(game.rosterCpu || [])],
                    rosterNames: [...(game.rosterNames || [])], cpu: [...game.cpu],
                    scene: game.scene, seats: [...game.seats], run: game.run };
    const savedNet = { ...net };
    net.active = false;
    game.run = null;
    game.mode = MODE.TOURNAMENT;

    const setup = (n, cpuFlags) => {
      game.entrantCount = n;
      game.rosterNames = Array.from({ length: n }, (_, i) => `P${i + 1}`);
      game.rosterCpu = cpuFlags;
      game.goalsToWin = 3;
      game.timeIdx = 0;
      startTournament();
    };

    // Marked seats become CPU-owned entrants.
    setup(4, [false, false, true, true]);
    ok("a marked entrant is owned by the CPU",
       game.entrants[2].owner === "cpu" && game.entrants[3].owner === "cpu",
       game.entrants.map((e) => e.owner).join(","));
    ok("unmarked entrants stay human",
       game.entrants[0].owner === "host" && game.entrants[1].owner === "host");
    ok("a CPU entrant is named as one", /CPU/.test(game.entrants[2].name),
       game.entrants[2].name);

    // Seat 0 can never be a CPU — somebody has to be playing.
    setup(4, [true, true, true, true]);
    ok("seat 1 is always human", game.entrants[0].owner !== "cpu",
       game.entrants[0].owner);
    ok("the others can all be CPUs",
       game.entrants.slice(1).every((e) => e.owner === "cpu"),
       game.entrants.map((e) => e.owner).join(","));

    /*
      The real fix: applyTieControl used to bail out unless a network match was
      running, so an offline bracket never handed a tie to the computer — an
      entrant marked CPU was still played by hand.
    */
    {
      setup(4, [false, false, true, true]);
      game.seats = [2, 3];
      game.cpu = [false, false];
      applyTieControl();
      ok("a CPU-vs-CPU tie puts both seats under CPU control",
         game.cpu[0] && game.cpu[1], `[${game.cpu}]`);

      game.seats = [0, 2];
      applyTieControl();
      ok("a human-vs-CPU tie only automates the CPU seat",
         !game.cpu[0] && game.cpu[1], `[${game.cpu}]`);

      game.seats = [0, 1];
      applyTieControl();
      ok("a human-vs-human tie automates neither seat",
         !game.cpu[0] && !game.cpu[1], `[${game.cpu}]`);
    }

    // A bracket full of CPUs must still resolve to one champion.
    {
      for (const n of [2, 4, 8]) {
        const flags = Array.from({ length: n }, (_, i) => i > 0);
        setup(n, flags);
        let ties = 0, cpuTies = 0, guard = 0, bad = null;
        while (game.scene !== SCENE.CHAMPION && guard++ < 200) {
          if (game.scene === SCENE.BRACKET) {
            if (aliveEntrants().length <= 1) beginRound(); else nextTie();
            continue;
          }
          if (game.scene === SCENE.SELECT) { startMatch(); continue; }
          if (game.scene === SCENE.COUNTDOWN || game.scene === SCENE.PLAY) {
            // Counted here, not at SELECT: a CPU tie in a later round skips the
            // select screen entirely now that its team is already locked in.
            if (game.cpu[0] && game.cpu[1]) cpuTies++;
            const w = game.seats[0] < game.seats[1] ? 0 : 1;
            game.score = w === 0 ? [3, 0] : [0, 3];
            finishMatch(w, false);
            ties++;
            game.scene = SCENE.BRACKET;
            continue;
          }
          bad = `stuck in ${game.scene}`;
          break;
        }
        ok(`a ${n}-player bracket of CPUs resolves`,
           !bad && game.scene === SCENE.CHAMPION, bad || game.scene);
        ok(`it plays all ${tiesRemaining(n)} ties`, ties === tiesRemaining(n), `${ties}`);
        if (n === 8) {
          ok("an 8-player CPU bracket includes CPU-vs-CPU ties", cpuTies >= 2,
             `${cpuTies}`);
        }
      }
    }

    // Online, the guest's seat must never be turned into a CPU.
    {
      net.active = true;
      net.role = "host";
      setup(4, [true, true, true, true]);
      ok("an online guest seat is not made a CPU",
         game.entrants[1].owner === "guest", game.entrants[1].owner);
      ok("the local seat is still human", game.entrants[0].owner === "host");
      net.active = false;
    }

    // The roster screen renders with any mix.
    {
      let drew = true, err = "";
      for (const n of [2, 4, 8]) {
        game.entrantCount = n;
        game.rosterNames = Array.from({ length: n }, (_, i) => `P${i + 1}`);
        for (const flags of [Array(n).fill(false), Array(n).fill(true),
                             Array.from({ length: n }, (_, i) => i % 2 === 0)]) {
          game.rosterCpu = flags;
          for (const cur of [0, 1, n]) {
            game.rosterCursor = cur;
            game.rosterEdit = -1;
            try { drawRoster(); } catch (e) { drew = false; err = e.message; }
          }
        }
      }
      ok("the roster renders with any human/CPU mix", drew, err);
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.rosterCpu = saved.rosterCpu;
    game.particles = [];
  }

  // 19af15. The bracket draw is randomised, and the tree renders at every size.
  {
    /*
      `cpu` and `seats` must be restored too: this block seats CPU entrants, and
      leaving that state behind made the select-screen tests further down see
      auto-locking CPU players instead of humans.
    */
    const saved = { mode: game.mode, entrantCount: game.entrantCount,
                    entrants: game.entrants, rosterCpu: [...(game.rosterCpu || [])],
                    rosterNames: [...(game.rosterNames || [])], scene: game.scene,
                    run: game.run, drawOrder: [...(game.drawOrder || [])],
                    bracket: game.bracket, cpu: [...game.cpu],
                    seats: [...game.seats], locked: [...game.locked],
                    sel: [...game.sel] };
    const savedNet = { ...net };
    net.active = false;
    game.run = null;
    game.mode = MODE.TOURNAMENT;

    const setup = (n) => {
      game.entrantCount = n;
      game.rosterNames = Array.from({ length: n }, (_, i) => `PLAYER ${i + 1}`);
      game.rosterCpu = Array.from({ length: n }, (_, i) => i > 0);
      game.goalsToWin = 3;
      game.timeIdx = 0;
      startTournament();
    };

    // ---- the shuffle itself ----
    {
      ok("a shuffle keeps every element",
         shuffled([0, 1, 2, 3, 4]).sort((a, b) => a - b).join(",") === "0,1,2,3,4");
      ok("a shuffle keeps the length", shuffled([1, 2, 3]).length === 3);
      ok("shuffling an empty list is safe", shuffled([]).length === 0);
      ok("a draw preserves every entrant",
         makeDraw([0, 1, 2, 3]).sort((a, b) => a - b).join(",") === "0,1,2,3");

      // All six permutations of three items must be reachable.
      const perms = new Set();
      for (let i = 0; i < 400; i++) perms.add(shuffled([0, 1, 2]).join(""));
      ok("the shuffle reaches every permutation", perms.size === 6, `${perms.size}`);
    }

    // ---- the draw actually varies, and is fair ----
    {
      const firstPairings = new Set();
      for (let t = 0; t < 40; t++) {
        setup(8);
        firstPairings.add(game.roundPairs.map((p) => p.join("v")).join("|"));
      }
      ok("the opening draw varies between tournaments", firstPairings.size > 20,
         `${firstPairings.size} distinct draws in 40`);

      // Seed 1 must be able to meet ANY other entrant, not just seed 2.
      const opponents = new Set();
      for (let t = 0; t < 400; t++) {
        setup(8);
        const pair = game.roundPairs.find((p) => p.includes(0));
        opponents.add(pair[0] === 0 ? pair[1] : pair[0]);
      }
      ok("seed 1 can draw any opponent", opponents.size >= 6,
         `${opponents.size} of 7 possible`);

      // Every entrant must appear exactly once in the opening round.
      let bad = null;
      for (let t = 0; t < 60; t++) {
        setup(8);
        const seen = game.roundPairs.flat().filter((x) => x !== null).sort((a, b) => a - b);
        if (seen.join(",") !== "0,1,2,3,4,5,6,7") { bad = seen.join(","); break; }
      }
      ok("every entrant is drawn exactly once", !bad, bad || "");

      // Odd counts still produce exactly one bye.
      for (const n of [3, 5, 7]) {
        setup(n);
        const byes = game.roundPairs.filter((p) => p[1] === null).length;
        ok(`a ${n}-player draw has exactly one bye`, byes === 1, `${byes}`);
      }
    }

    // ---- the recorded bracket history ----
    {
      setup(4);
      ok("the bracket records the opening round",
         Array.isArray(game.bracket[0]) && game.bracket[0].length === 2,
         `${game.bracket[0] && game.bracket[0].length}`);
      ok("a fresh tie has no winner yet", game.bracket[0][0].winner === null);

      // Play a tie and check the result is stamped in.
      nextTie();
      startMatch();
      const winSeat = 0;
      const winId = game.seats[winSeat];
      game.score = [3, 0];
      finishMatch(winSeat, false);
      ok("a decided tie records its winner", game.bracket[0][0].winner === winId,
         `${game.bracket[0][0].winner} vs ${winId}`);
      ok("a decided tie records its score",
         Array.isArray(game.bracket[0][0].score), JSON.stringify(game.bracket[0][0].score));

      // A bye is recorded as already won.
      setup(3);
      const byeTie = game.bracket[0].find((t) => t.b === null);
      ok("a bye is recorded as already decided", byeTie && byeTie.winner === byeTie.a);
    }

    // ---- the tree renders at every size, all the way through ----
    {
      let bad = null;
      for (const n of [2, 3, 4, 5, 6, 7, 8]) {
        setup(n);
        let guard = 0;
        while (game.scene !== SCENE.CHAMPION && guard++ < 200) {
          if (game.scene === SCENE.BRACKET) {
            try { drawBracket(); } catch (e) { bad = `${n} players: ${e.message}`; break; }
            if (aliveEntrants().length <= 1) beginRound(); else nextTie();
            continue;
          }
          // SELECT only appears while a team is still unchosen; later ties go
          // straight to COUNTDOWN with the entrant's locked-in team.
          if (game.scene === SCENE.SELECT) { startMatch(); continue; }
          if (game.scene === SCENE.COUNTDOWN || game.scene === SCENE.PLAY) {
            const w = game.seats[0] < game.seats[1] ? 0 : 1;
            game.score = w === 0 ? [3, 0] : [0, 3];
            finishMatch(w, false);
            game.scene = SCENE.BRACKET;
            continue;
          }
          break;
        }
        if (bad) break;
        if (game.scene !== SCENE.CHAMPION) { bad = `${n} players never resolved`; break; }
      }
      ok("the bracket tree renders through a whole tournament at every size",
         !bad, bad || "");
    }

  // 19ag0. Remappable controls and gamepad support.
  {
    const savedScheme = SCHEME.map((x) => ({ ...x }));
    const saved = { scene: game.scene, ctrlSeat: game.ctrlSeat, ctrlRow: game.ctrlRow,
                    ctrlBinding: game.ctrlBinding, cpu: [...game.cpu] };

    /*
      Every key in the default scheme must appear in ACTIONS, and vice versa —
      derived rather than a hardcoded count, which went stale twice as bindings
      were added. A binding missing from ACTIONS is unrebindable; an action
      missing from the scheme has nowhere to store its key.
    */
    {
      const actionKeys = ACTIONS.map((a) => a.key).sort();
      const schemeKeys = Object.keys(SCHEME_DEFAULTS[0]).sort();
      ok("every action is listed for rebinding",
         actionKeys.join(",") === schemeKeys.join(","),
         `actions [${actionKeys}] vs scheme [${schemeKeys}]`);
    }
    /*
      Every action needs a default EXCEPT the 3D aim keys for seat 0, which are
      deliberately blank: that seat aims with the mouse, and the controls screen
      renders an unbound action as an empty keycap the player can fill in.
    */
    const AIM_ACTIONS = ["aimUp", "aimDown", "aimLeft", "aimRight"];
    ok("both seats have a default for every action bar P1's mouse-driven aim",
       SCHEME_DEFAULTS.every((sc, seat) =>
         ACTIONS.every((a) => sc[a.key] ||
                              (seat === 0 && AIM_ACTIONS.includes(a.key)))));
    ok("and P1's aim keys are blank precisely because P1 uses the mouse",
       AIM_ACTIONS.every((k) => SCHEME_DEFAULTS[0][k] === ""));
    ok("while P2, who has no mouse, gets a full aim cluster",
       AIM_ACTIONS.every((k) => !!SCHEME_DEFAULTS[1][k]));
    ok("the two seats do not share a default key",
       ACTIONS.every((a) => !SCHEME_DEFAULTS[0][a.key] ||
                            SCHEME_DEFAULTS[0][a.key] !== SCHEME_DEFAULTS[1][a.key]));

    // Key labels must be readable, never blank.
    {
      let bad = null;
      for (const code of ["KeyA", "ArrowLeft", "Space", "Enter", "ShiftRight",
                          "Numpad0", "Digit3", "Semicolon", "", null]) {
        const l = keyLabel(code);
        if (!l || !l.length) { bad = `${code} produced no label`; break; }
      }
      ok("every key has a readable label", !bad, bad || "");
      ok("an unbound action shows a dash", keyLabel("") === "—");
    }

    // Rebinding, and the reserved keys that must be refused.
    {
      resetScheme();
      ok("reset restores the defaults",
         SCHEME[0].kick === SCHEME_DEFAULTS[0].kick, SCHEME[0].kick);

      SCHEME[0].kick = "KeyP";
      saveScheme();
      rebuildWatched();
      ok("a rebound key is watched", WATCHED.has("KeyP"));
      ok("the old key is no longer watched by that seat",
         SCHEME[0].kick === "KeyP", SCHEME[0].kick);

      ok("ESC can never be bound", RESERVED_KEYS.has("Escape"));
      ok("reload keys can never be bound",
         RESERVED_KEYS.has("F5") && RESERVED_KEYS.has("F12"));

      resetScheme();
      ok("reset restores every action",
         ACTIONS.every((a) => SCHEME[0][a.key] === SCHEME_DEFAULTS[0][a.key]));
    }

    // The watch list must always cover the UI keys plus every binding.
    {
      rebuildWatched();
      let bad = null;
      for (const seat of SCHEME) {
        for (const a of ACTIONS) {
          if (seat[a.key] && !WATCHED.has(seat[a.key])) { bad = seat[a.key]; break; }
        }
      }
      ok("every binding is in the watch list", !bad, bad || "");
      ok("the UI keys are watched",
         WATCHED.has("Enter") && WATCHED.has("Escape") && WATCHED.has("Space"));
    }

    // Gamepad polling must be safe when there is no API and no pad.
    {
      let threw = false;
      try { pollPads(true); } catch (e) { threw = true; }
      ok("polling pads is safe with no gamepad API", !threw);
      ok("no pad is reported active", !pads.active[0] && !pads.active[1]);

      // With a fake pad present, a seat must be driven and the keyboard skipped.
      const fakePad = {
        connected: true, id: "Test Pad",
        axes: [-1, 0],
        buttons: Array.from({ length: 16 }, (_, i) => ({ pressed: i === 0 })),
      };
      const realSource = padSource;
      setPadSource(() => [fakePad, null]);
      game.opt.gamepad = true;
      game.cpu = [false, false];
      for (const a of intent) {
        a.left = a.right = a.up = a.down = a.kick = a.kickEdge = a.wallEdge = false;
      }
      pads.prev[0] = {};
      const live = pollPads(true);
      ok("a connected pad is detected", live === 1 && pads.active[0], `${live}`);
      ok("the pad's stick drives movement", intent[0].left === true);
      ok("the pad's button presses kick", intent[0].kick === true);
      ok("a pad button edge-triggers once", intent[0].kickEdge === true);
      // Held, the edge must not fire again.
      pollPads(true);
      ok("a held pad button does not re-trigger", intent[0].kickEdge === false);
      ok("seat 1 is untouched with only one pad", !pads.active[1]);

      setPadSource(realSource);
      for (const a of intent) {
        a.left = a.right = a.up = a.down = a.kick = a.kickEdge = a.wallEdge = false;
      }
    }

    // The screen renders in every state.
    {
      let drew = true, err = "";
      for (const from of [SCENE.MENU, SCENE.PAUSE]) {
        game.ctrlFrom = from;
        for (let seat = 0; seat < 2; seat++) {
          game.ctrlSeat = seat;
          for (let r = 0; r < ACTIONS.length + 2; r++) {
            game.ctrlRow = r;
            game.ctrlBinding = null;
            try { drawControls(); } catch (e) { drew = false; err = e.message; }
            game.ctrlBinding = { seat, action: ACTIONS[Math.min(r, ACTIONS.length - 1)].key };
            try { drawControls(); } catch (e) { drew = false; err = `binding: ${e.message}`; }
          }
        }
      }
      game.ctrlBinding = null;
      // And with an action left unbound.
      SCHEME[0].wall = "";
      try { drawControls(); } catch (e) { drew = false; err = `unbound: ${e.message}`; }
      ok("the controls screen renders in every state", drew, err);
    }

    for (let i = 0; i < 2; i++) Object.assign(SCHEME[i], savedScheme[i]);
    rebuildWatched();
    Object.assign(game, saved);
  }

    {

      for (const from of [SCENE.MENU, SCENE.PAUSE]) {

        try { drawCredits(); } catch (e) { drew = false; err = e.message; }

      const all = creditProbe.lines.join(" | ");
      ok("the credits name the author", /João Novo/.test(all), all.slice(0, 60));

      ok("the play tester is credited as such", /Salvado — an amazing play tester/.test(all),

    game.particles = [];

  // 19ag. Kicks are a strike, not a touch.
  {
    const saved = { players: game.players, ball: game.ball, mode: game.mode };
    game.mode = MODE.SINGLE;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    /** Launch speed for a given team at a given point through the swing. */
    const kickAt = (team, frac, powered = false) => {
      const p = new Player(0, team);
      p.reset();
      p.facing = 1;
      if (powered) p.grant("powershot");
      p.kickT = KICK_TIME * (1 - frac);
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return len(game.ball.vx, game.ball.vy);
    };

    const mid = kickAt(TEAMS[0], 0.5);
    ok("a plain kick is genuinely strong", mid >= 1000, `${mid.toFixed(0)} px/s`);
    ok("the base kick constant was raised", KICK_BASE >= 1000, `${KICK_BASE}`);

    // Even the weakest team must not feel like a nudge.
    const weakest = TEAMS.reduce((a, t) => (t.shot < a.shot ? t : a), TEAMS[0]);
    const weakKick = kickAt(weakest, 0.5);
    ok(`even ${weakest.name} kicks hard`, weakKick >= 800, `${weakKick.toFixed(0)} px/s`);

    // Swing timing must be worth something.
    const early = kickAt(TEAMS[0], 0.05), late = kickAt(TEAMS[0], 0.95);
    ok("a late swing hits harder than an early one", late > early * 1.4,
       `${early.toFixed(0)} -> ${late.toFixed(0)}`);

    // A kicked ball must travel a useful distance across the pitch.
    {
      const p = new Player(0, TEAMS[0]);
      p.reset();
      p.facing = 1;
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS, bounces: 0 };
      ballVsPlayer(p);
      const x0 = game.ball.x;
      let far = x0;
      for (let i = 0; i < 400; i++) { stepBall(DT); far = Math.max(far, game.ball.x); }
      ok("one kick carries the ball a long way", far - x0 > 380,
         `${(far - x0).toFixed(0)}px`);
    }

    // The power shot must still be a clear step up, not lost in the clamp.
    {
      const plain = kickAt(TEAMS[0], 0.5, false);
      const power = kickAt(TEAMS[0], 0.5, true);
      ok("a power shot still clearly beats a normal kick", power > plain * 1.3,
         `${plain.toFixed(0)} -> ${power.toFixed(0)}`);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19ah. Basketball is actually scoreable.
  {
    const savedMode = game.mode, savedBall = game.ball;
    const c = MODE_CFG[MODE.BASKET];

    ok("the basketball is bouncier than before", c.rest >= 1.0, `${c.rest}`);
    ok("the basketball is no longer the least bouncy mode",
       c.rest > MODE_CFG[MODE.SINGLE].rest, `${c.rest} vs ${MODE_CFG[MODE.SINGLE].rest}`);

    // Bounce retention, and it must still decay.
    {
      game.mode = MODE.BASKET;
      game.ball = { x: W / 2, y: GROUND_Y - c.ballR - 300, vx: 0, vy: 0,
                    r: c.ballR, mass: c.ballMass, bounces: 0 };
      const out = [];
      let lastY = game.ball.y, rising = false, peak = game.ball.y;
      for (let i = 0; i < 4000 && out.length < 6; i++) {
        stepBall(DT);
        if (game.ball.y < lastY) { rising = true; peak = Math.min(peak, game.ball.y); }
        else if (rising && game.ball.y > lastY) { out.push(GROUND_Y - peak); rising = false; peak = game.ball.y; }
        lastY = game.ball.y;
      }
      ok("the basketball bounces several times", out.length >= 5, `${out.length}`);
      let decays = true;
      for (let i = 1; i < out.length; i++) if (out[i] > out[i - 1] + 1) decays = false;
      ok("basketball bounces still decay", decays, out.map((x) => x.toFixed(0)).join(" -> "));
    }

    // The measurable complaint: a blind shot should sometimes go in.
    {
      game.mode = MODE.BASKET;
      let scored = 0;
      const N = 500;
      for (let t = 0; t < N; t++) {
        game.ball = { x: 500 + Math.random() * 180, y: GROUND_Y - 60,
                      vx: 400 + Math.random() * 500, vy: -(600 + Math.random() * 450),
                      r: c.ballR, mass: c.ballMass, bounces: 0 };
        for (let i = 0; i < 900; i++) {
          const prevY = game.ball.y;
          stepBall(DT);
          ballVsHoops(game.ball);
          if (basketScored(game.ball, prevY) !== 0) { scored++; break; }
          if (game.ball.x < 0 || game.ball.x > W) break;
        }
      }
      const pct = (scored / N) * 100;
      ok("blind basketball shots score sometimes", pct >= 4, `${pct.toFixed(1)}%`);
      ok("but not trivially often", pct <= 45, `${pct.toFixed(1)}%`);
    }

    // The aperture must still reject a clear miss.
    {
      game.mode = MODE.BASKET;
      const h = hoopPos(1);
      const wide = { x: h.x + HOOP_R + 30, y: h.y + 2, vx: 0, vy: 300, r: c.ballR, mass: c.ballMass };
      ok("a shot well wide of the ring does not score",
         basketScored(wide, h.y - 2) === 0);
      const dead = { x: h.x, y: h.y + 2, vx: 0, vy: 300, r: c.ballR, mass: c.ballMass };
      ok("a shot through the middle scores", basketScored(dead, h.y - 2) === 1);
    }

    game.mode = savedMode;
    game.ball = savedBall;
  }

      game.scene = SCENE.SELECT;

      const tapSel = (code) => {

        edgeFrame = true;

      ok("down moves to the face row", game.lookRow[0] === 1);
      const face0 = game.looks[0].face;
      tapSel(SCHEME[0].right);

         JSON.stringify(back));

  // 20. Bigger/Smaller cancel instead of compounding.
  {
    const p = new Player(0, TEAMS[0]);
    const base = p.r;
    p.grant("bigger");
    const big = p.r;
    p.grant("smaller");
    ok("bigger enlarges", big > base);
    ok("smaller cancels bigger", near(p.r, base, 1e-9) && !p.effects.bigger && !p.effects.smaller);
    p.grant("smaller");
    ok("smaller shrinks", p.r < base);
  }

  // 21. Scoring attribution: left goal credits P2, right goal credits P1.
  {
    const saved = { players: game.players, score: game.score, scene: game.scene, ball: game.ball };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    game.score = [0, 0];
    game.ball = makeBall();
    scoreGoal(-1);
    ok("left goal credits P2", game.score[1] === 1 && game.score[0] === 0);
    game.score = [0, 0];
    scoreGoal(1);
    ok("right goal credits P1", game.score[0] === 1 && game.score[1] === 0);
    // Reaching the configured target ends the match.
    game.suddenDeath = false;
    game.score = [game.goalsToWin - 1, 0];
    scoreGoal(1);
    ok("the target-reaching goal wins", game.scene === SCENE.WIN && game.winner === 0);
    Object.assign(game, saved);
    game.particles = [];
  }

  // 21b. Body contact always launches the ball upward and shoves the player.
  {
    const saved = { players: game.players, ball: game.ball, scene: game.scene };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    const pl = game.players[0];

    // Ball rolling flat into the player's side.
    pl.reset();
    game.ball = { x: pl.x + pl.r + 4, y: pl.y, vx: -600, vy: 0, r: BALL_R, mass: BALL_MASS };
    const pvx0 = pl.vx;
    ballVsPlayer(pl);
    ok("side contact launches the ball upward", game.ball.vy <= -BODY_POP + 1e-6,
       `vy=${game.ball.vy.toFixed(1)}`);
    ok("ball shoves the player back", pl.vx < pvx0 - 1, `vx ${pvx0} -> ${pl.vx.toFixed(1)}`);

    // Ball dropping onto the top of the head: harder launch.
    pl.reset();
    game.ball = { x: pl.x, y: pl.y - pl.r - BALL_R + 3, vx: 0, vy: 500, r: BALL_R, mass: BALL_MASS };
    ballVsPlayer(pl);
    ok("header launches harder than a side touch",
       game.ball.vy <= -BODY_POP * HEAD_BOOST + 1e-6, `vy=${game.ball.vy.toFixed(1)}`);

    // Knockback is capped so a max-speed shot can't fling a player away.
    pl.reset();
    game.ball = { x: pl.x + pl.r + 4, y: pl.y, vx: -BALL_MAX_V, vy: 0, r: BALL_R, mass: BALL_MASS };
    ballVsPlayer(pl);
    // A fast ball now knocks players back much harder than a body bump, so the
    // ceiling is BALL_KNOCK_MAX rather than the gentle contact cap.
    ok("knockback is capped", Math.abs(pl.vx) <= BALL_KNOCK_MAX + 1e-6, `vx=${pl.vx.toFixed(1)}`);
    ok("player stays in bounds after knockback",
       pl.x >= WALL + pl.r - 1e-6 && pl.x <= W - WALL - pl.r + 1e-6);

    // Heavier teams are shoved less by the same shot.
    const shove = (team) => {
      const p = new Player(0, team);
      p.reset();
      game.ball = { x: p.x + p.r + 4, y: p.y, vx: -800, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return Math.abs(p.vx);
    };
    const light = TEAMS.find(t => t.size === 1);
    const heavy = TEAMS.find(t => t.size === 5);
    ok("heavier teams resist the ball better", shove(heavy) < shove(light),
       `${heavy.name} ${shove(heavy).toFixed(1)} vs ${light.name} ${shove(light).toFixed(1)}`);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 21c. Kicks always send the ball upward, from any contact angle.
  {
    const saved = { players: game.players, ball: game.ball };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    let allUp = true, worst = 0;

    // Try contact points all around the player: low, level, high, near, far.
    for (const dy of [-0.6, -0.3, 0, 0.3, 0.6]) {
      for (const dxMul of [0.9, 1.05, 1.2]) {
        const pl = game.players[0];
        pl.reset();
        pl.facing = 1;
        pl.kickT = KICK_TIME * 0.5;      // mid-swing
        pl.kickConsumed = false;
        const tip = pl.legTip;
        game.ball = {
          x: tip.x + BALL_R * dxMul * 0.6, y: tip.y + pl.r * dy,
          vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS,
        };
        ballVsPlayer(pl);
        if (pl.kickConsumed) {
          if (!(game.ball.vy < 0)) allUp = false;
          worst = Math.max(worst, game.ball.vy);
        }
      }
    }
    ok("kicks always have upward velocity", allUp, `worst vy=${worst.toFixed(1)}`);

    // A kicked ball must actually clear the ground, not skid along it.
    const pl = game.players[0];
    pl.reset();
    pl.facing = 1;
    pl.kickT = KICK_TIME * 0.5;
    pl.kickConsumed = false;
    const tip = pl.legTip;
    game.ball = { x: tip.x + 6, y: tip.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
    ballVsPlayer(pl);
    const startY = game.ball.y;
    let peak = startY;
    for (let i = 0; i < 240; i++) { stepBall(DT); peak = Math.min(peak, game.ball.y); }
    ok("kicked ball rises off the ground", startY - peak > 60,
       `rose ${(startY - peak).toFixed(1)}px`);

    // Measure a kick's rise and horizontal reach for a given team/power-up.
    const flight = (team, powershot) => {
      const p = new Player(0, team);
      p.reset();
      p.facing = 1;
      if (powershot) p.grant("powershot");
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      const y0 = game.ball.y, x0 = game.ball.x;
      let hi = y0, landed = null;
      for (let i = 0; i < 900; i++) {
        stepBall(DT);
        hi = Math.min(hi, game.ball.y);
        if (landed === null && i > 10 && game.ball.y + game.ball.r >= GROUND_Y - 1) {
          landed = game.ball.x;
        }
      }
      return { rise: y0 - hi, dist: (landed ?? game.ball.x) - x0 };
    };

    // Arc must be substantial, not a token loft.
    const mid = flight(TEAMS[0], false);
    ok("a normal kick arcs at least 80px high", mid.rise >= 80,
       `${mid.rise.toFixed(0)}px (gravity ${gravity.toFixed(0)}, jetpack ${game.jetpack.toFixed(2)}, drag ${ballDrag.toFixed(2)})`);

    // Shot Power shapes the arc: a 5-pip team must loft clearly higher than 2-pip.
    const weak = flight(TEAMS.find(t => t.shot === 2), false);
    const strong = flight(TEAMS.find(t => t.shot === 5), false);
    ok("higher Shot Power arcs higher", strong.rise > weak.rise * 1.3,
       `${weak.rise.toFixed(0)}px -> ${strong.rise.toFixed(0)}px`);

    // Compare LAUNCH SPEED, not distance-to-landing: every team's shot reaches
    // the far wall and rebounds, which caps any distance measurement.
    const launchVx = (team) => {
      const p = new Player(0, team);
      p.reset();
      p.facing = 1;
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return game.ball.vx;
    };
    const wv = launchVx(TEAMS.find(t => t.shot === 2));
    const sv = launchVx(TEAMS.find(t => t.shot === 5));
    ok("higher Shot Power launches the ball faster", sv > wv * 1.3,
       `${wv.toFixed(0)} -> ${sv.toFixed(0)} px/s`);

    // Power Shot must buy SPEED, not altitude. Measured as launch velocity
    // rather than distance-to-landing: a power shot crosses the whole pitch and
    // rebounds off the far wall, which would silently cap any distance metric.
    const launch = (powershot) => {
      const p = new Player(0, TEAMS[0]);
      p.reset();
      p.facing = 1;
      if (powershot) p.grant("powershot");
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return { vx: game.ball.vx, vy: game.ball.vy, hit: p.kickConsumed };
    };
    const ln = launch(false), lp = launch(true);
    ok("power shot connects as a forward shot, not a clearance", ln.hit && lp.hit && ln.vx > 0);
    ok("power shot is much faster forward", lp.vx > ln.vx * 1.5,
       `${ln.vx.toFixed(0)} -> ${lp.vx.toFixed(0)} px/s`);
    // Power Shot must not convert its extra force into ALTITUDE — its lift may
    // match a normal shot's but must never balloon with the added power.
    ok("power shot stays flat, not lofted", Math.abs(lp.vy) <= Math.abs(ln.vy) * 1.1,
       `lift ${ln.vy.toFixed(0)} -> ${lp.vy.toFixed(0)}`);
    ok("power shot puts its force into speed, not height",
       (Math.abs(lp.vx) / Math.abs(ln.vx)) > (Math.abs(lp.vy) / Math.abs(ln.vy)) * 1.5,
       `vx ratio ${(lp.vx / ln.vx).toFixed(2)} vs vy ratio ${(lp.vy / ln.vy).toFixed(2)}`);

    // And it must still travel further over ground it can actually cover.
    const norm = flight(TEAMS[0], false);
    ok("a normal shot lands inside the pitch", norm.dist > 100 && norm.dist < W,
       `${norm.dist.toFixed(0)}px`);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 21d. Edge-triggered input fires ONCE per keypress, at any substep count.
  //      Regression: physics runs 2+ substeps per rendered frame, and reading
  //      `pressed` directly made every menu press advance the cursor twice.
  {
    const saved = { scene: game.scene, sel: [...game.sel], locked: [...game.locked] };

    // Simulate one rendered frame that runs `n` physics substeps.
    const oneFrame = (code, n) => {
      pressed[code] = true;
      edgeFrame = true;
      for (let s = 0; s < n; s++) { step(DT); edgeFrame = false; }
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
    };

    let allSingle = true, detail = "";
    for (const n of [1, 2, 3, 4, 8]) {
      game.scene = SCENE.SELECT;
      game.locked = [false, false];
      game.sel = [0, 0];
      oneFrame("KeyD", n);
      if (game.sel[0] !== 1) { allSingle = false; detail = `${n} substeps advanced ${game.sel[0]}`; }
    }
    ok("one keypress advances the cursor exactly once", allSingle, detail);

    // Left/right must be true inverses.
    game.scene = SCENE.SELECT;
    game.locked = [false, false];
    game.sel = [3, 0];
    oneFrame("KeyD", 2);
    oneFrame("KeyA", 2);
    ok("left undoes right", game.sel[0] === 3, `ended on ${game.sel[0]}`);

    // Holding a key must NOT keep scrolling: only the initial press counts.
    game.sel = [0, 0];
    keys.KeyD = true;              // held, but never re-pressed
    for (let f = 0; f < 10; f++) {
      edgeFrame = true;
      for (let s = 0; s < 2; s++) { step(DT); edgeFrame = false; }
      edgeFrame = true;
    }
    keys.KeyD = false;
    ok("holding a key does not scroll the menu", game.sel[0] === 0, `drifted to ${game.sel[0]}`);

    // A locked player can unlock and pick a different team.
    game.scene = SCENE.SELECT;
    game.locked = [false, false];
    game.sel = [2, 5];
    oneFrame("KeyF", 2);
    ok("kick locks a player in", game.locked[0] === true);
    oneFrame("KeyD", 2);
    ok("moving unlocks a locked player", game.locked[0] === false);
    ok("unlocking still changes the team", game.sel[0] === 3, `sel ${game.sel[0]}`);
    oneFrame("KeyF", 2);
    oneFrame("KeyF", 2);
    ok("kick toggles lock off again", game.locked[0] === false);

    // Locking BOTH players must start the match exactly once.
    game.scene = SCENE.SELECT;
    game.locked = [false, false];
    game.sel = [1, 4];
    oneFrame("KeyF", 2);
    oneFrame("Enter", 2);
    ok("both locked starts the match", game.scene === SCENE.COUNTDOWN, game.scene);
    ok("chosen teams are the ones that were locked",
       !!game.players[0] && !!game.players[1] &&
       game.players[0].team === TEAMS[1] && game.players[1].team === TEAMS[4],
       game.players[0] ? `${game.players[0].team.name} / ${game.players[1].team.name}` : "no players");

    Object.assign(game, saved);
    game.particles = [];
  }

  // 22. Kick fires exactly once per press.
  {
    const p = new Player(0, TEAMS[0]);
    ok("kick starts", p.tryStartKick() === true);
    ok("kick cannot restart mid-swing", p.tryStartKick() === false);
  }

  // 19aj. A kick RESETS THE JUMP, so the ball can be juggled across the pitch.
  {
    const saved = { players: game.players, ball: game.ball, mode: game.mode,
                    scene: game.scene, cpu: [...game.cpu] };
    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();

    /** Put a player in mid-air, then swing — with the ball in reach or not. */
    const airSwing = (connects) => {
      const p = new Player(0, TEAMS[0]);
      p.reset();
      p.facing = 1;
      intent[0].up = true;
      p.update(DT, null);
      intent[0].up = false;
      for (let i = 0; i < 8; i++) p.update(DT, null);
      const airborne = !p.onGround;
      p.kickT = KICK_TIME * 0.5;
      p.kickConsumed = false;
      const tip = p.legTip;
      // In reach, or far across the pitch where the swing hits nothing.
      game.ball = connects
        ? { x: tip.x + 4, y: tip.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS }
        : { x: tip.x + 400, y: tip.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      const yBefore = p.y;
      ballVsPlayer(p);
      return { p, airborne, moved: Math.abs(p.y - yBefore) };
    };

    const hitIt = airSwing(true);
    ok("the test player really was airborne", hitIt.airborne);
    ok("a connecting mid-air kick restores the jump", hitIt.p.onGround === true);
    ok("the reset is flagged for the visual cue", hitIt.p.airKickReset === true);
    ok("the kick does not teleport the player to the ground", hitIt.moved < 2,
       `${hitIt.moved.toFixed(1)} px`);

    // The restored jump must be a REAL jump, not just a flag.
    {
      const p = hitIt.p;
      intent[0].up = true;
      p.update(DT, null);
      intent[0].up = false;
      ok("the restored jump actually launches", p.vy < -100, `vy ${p.vy.toFixed(0)}`);
      // ...and it is spent: no third jump without another touch.
      for (let i = 0; i < 6; i++) p.update(DT, null);
      ok("the restored jump is consumed, not permanent", p.onGround === false);
      const vyAir = p.vy;
      intent[0].up = true;
      p.update(DT, null);
      intent[0].up = false;
      ok("no free third jump", p.vy >= vyAir - 1, `vy ${p.vy.toFixed(0)}`);
      // And the player still falls back to the floor normally.
      for (let i = 0; i < 700; i++) p.update(DT, null);
      ok("the player still lands on the ground",
         near(p.y + p.r, GROUND_Y, 1.5), `${(p.y + p.r).toFixed(1)} vs ${GROUND_Y}`);
    }

    // Swinging at nothing must NOT hand back the jump — otherwise the kick key
    // would simply be a double jump.
    {
      const miss = airSwing(false);
      ok("a swing that connects with nothing gives no jump back",
         miss.p.onGround === false);
      ok("and sets no reset flag", !miss.p.airKickReset);
    }

    Object.assign(game, saved);
  }

  // 19ak. A tournament team is for the WHOLE tournament, and the draw can be
  // re-rolled until the first tie is played.
  {
    const saved = { mode: game.mode, scene: game.scene, entrants: game.entrants,
                    entrantCount: game.entrantCount, round: game.round,
                    roundPairs: game.roundPairs, tieIndex: game.tieIndex,
                    seats: [...game.seats], sel: [...game.sel],
                    locked: [...game.locked], cpu: [...game.cpu],
                    champion: game.champion, lastResult: game.lastResult,
                    bracket: game.bracket, drawOrder: [...(game.drawOrder || [])],
                    looks: game.looks.map((l) => ({ ...l })),
                    selFixed: [...game.selFixed], players: game.players,
                    goalsToWin: game.goalsToWin, timeIdx: game.timeIdx };
    const savedNet = { ...net };
    net.active = false; net.role = null;

    const setup = (n) => {
      game.mode = MODE.TOURNAMENT;
      game.entrantCount = n;
      game.rosterNames = Array.from({ length: n }, (_, i) => `E${i + 1}`);
      game.rosterCpu = Array.from({ length: n }, () => false);
      game.goalsToWin = 3;
      game.timeIdx = 0;
      startTournament();
    };

    /*
      Play a whole bracket, recording the team and character each ENTRANT used in
      every match they played. Each entrant picks something distinctive the first
      time they appear; if a choice were tied to the seat instead of the entrant,
      the record would show it change.
    */
    const playAll = (n, winSeat) => {
      setup(n);
      const chose = {}, used = {}, seatsUsed = {};
      const selectRounds = [];
      let pick = 0, guard = 0, ties = 0;
      while (game.scene !== SCENE.CHAMPION && guard++ < 300) {
        if (game.scene === SCENE.BRACKET) {
          if (aliveEntrants().length <= 1) beginRound(); else nextTie();
          continue;
        }
        if (game.scene === SCENE.SELECT) {
          selectRounds.push(game.round);
          for (let sSeat = 0; sSeat < 2; sSeat++) {
            if (game.selFixed[sSeat]) continue;   // already locked in: leave it
            const id = game.seats[sSeat];
            const face = FACES[pick % FACES.length].id;
            const hat = HATS[pick % HATS.length].id;
            const tIdx = (pick * 3 + 2) % TEAMS.length;
            pick++;
            chose[id] = { face, hat, team: TEAMS[tIdx].name };
            game.looks[sSeat] = { face, hat };
            game.lookOverride[sSeat] = null;
            game.sel[sSeat] = tIdx;
          }
          startMatch();
          continue;
        }
        if (game.scene === SCENE.COUNTDOWN || game.scene === SCENE.PLAY) {
          for (let sSeat = 0; sSeat < 2; sSeat++) {
            const id = game.seats[sSeat];
            const l = lookOf(game.players[sSeat]);
            (used[id] = used[id] || []).push({
              team: game.players[sSeat].team.name, face: l.face, hat: l.hat,
            });
            (seatsUsed[id] = seatsUsed[id] || []).push(sSeat);
          }
          const w = winSeat === "low" ? (game.seats[0] < game.seats[1] ? 0 : 1)
                                      : winSeat;
          game.score = w === 0 ? [3, 0] : [0, 3];
          finishMatch(w, false);
          ties++;
          game.scene = SCENE.BRACKET;
          continue;
        }
        break;
      }
      return { chose, used, seatsUsed, selectRounds, ties };
    };

    {
      const r = playAll(8, "low");
      ok("an 8-entrant bracket still resolves", game.scene === SCENE.CHAMPION,
         game.scene);
      ok("it still plays every tie", r.ties === tiesRemaining(8), `${r.ties}`);

      // Team select happens in round one ONLY. Later rounds reuse the choice.
      const later = r.selectRounds.filter((rd) => rd !== 1);
      ok("team select only ever appears in round one", later.length === 0,
         `also rounds ${later.join(",")}`);

      // Nobody's team or character changed between their matches.
      let mismatches = 0, multiMatch = 0;
      for (const id of Object.keys(r.used)) {
        const c = r.chose[id], list = r.used[id];
        if (list.length > 1) multiMatch++;
        for (const u of list) {
          if (u.team !== c.team || u.face !== c.face || u.hat !== c.hat) mismatches++;
        }
      }
      ok("some entrants played more than one tie", multiMatch >= 2, `${multiMatch}`);
      ok("every entrant kept one team and character all tournament",
         mismatches === 0, `${mismatches} mismatches`);
    }

    /*
      The real test of per-ENTRANT storage: always let seat 1 win, so a winner
      from seat 1 is reseated at seat 0 next round. A look stored per seat would
      follow the chair and break here.
    */
    {
      const r = playAll(8, 1);
      let movers = 0, mismatches = 0;
      for (const id of Object.keys(r.used)) {
        if (new Set(r.seatsUsed[id]).size > 1) movers++;
        const c = r.chose[id];
        for (const u of r.used[id]) {
          if (u.team !== c.team || u.face !== c.face || u.hat !== c.hat) mismatches++;
        }
      }
      ok("at least one entrant changed seats between rounds", movers >= 1,
         `${movers}`);
      ok("identity follows the entrant, not the seat", mismatches === 0,
         `${mismatches} mismatches`);
    }

    // A seat locked for the tournament ignores the select screen entirely.
    {
      setup(4);
      nextTie();
      game.scene = SCENE.SELECT;
      game.selFixed = [true, false];
      game.locked = [true, false];
      game.lookRow = [0, 0];
      game.sel = [2, 5];
      const before = game.sel[0];
      pressed[SCHEME[0].right] = true;
      edgeFrame = true;
      updateSelect(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
      ok("a locked seat cannot change team", game.sel[0] === before,
         `${before} -> ${game.sel[0]}`);
      ok("a locked seat stays ready", game.locked[0] === true);

      // Kick must not un-ready it either.
      pressed[SCHEME[0].kick] = true;
      edgeFrame = true;
      updateSelect(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
      ok("kick cannot un-ready a locked seat", game.locked[0] === true);

      // The other seat is still free to choose.
      const free = game.sel[1];
      pressed[SCHEME[1].right] = true;
      edgeFrame = true;
      updateSelect(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
      ok("the unlocked seat can still pick", game.sel[1] !== free,
         `${free} -> ${game.sel[1]}`);
    }

    // Both new states must actually PAINT — a green suite has hidden an unpainted
    // row before, so this asserts on real drawn text.
    {
      game.mode = MODE.TOURNAMENT;
      game.scene = SCENE.SELECT;
      game.selFixed = [true, false];
      game.locked = [true, false];
      game.cpu = [false, false];
      game.sel = [2, 5];
      game.seats = [0, 1];
      const shown = capturePaint(drawSelect).strings;
      ok("a locked seat is labelled LOCKED IN on screen", shown.includes("LOCKED IN"),
         shown.slice(0, 8).join("|"));
      ok("and it says why the seat cannot be changed",
         shown.some((t) => /locked for the tournament/i.test(t)));
      ok("the free seat still shows its own controls",
         shown.some((t) => /ENTER to lock/i.test(t)));

      // The bracket advertises the re-roll, and withdraws the offer once used up.
      game.scene = SCENE.BRACKET;
      game.round = 1; game.tieIndex = 0; game.lastResult = null;
      const fresh = capturePaint(drawBracket).strings;
      ok("the bracket offers the re-draw", fresh.some((t) => /re-draw/i.test(t)),
         fresh.slice(-4).join("|"));
      game.lastResult = { winnerId: 0, loserId: 1, score: [3, 0], byTime: false };
      const later = capturePaint(drawBracket).strings;
      ok("and withdraws it once the tournament is under way",
         !later.some((t) => /re-draw/i.test(t)));
      game.rerollDenied = 1;
      const denied = capturePaint(drawBracket).strings;
      ok("a refused re-draw says so on screen",
         denied.some((t) => /too late/i.test(t)));
      game.rerollDenied = 0;
      game.lastResult = null;
    }

    // A stale lock must never leak into a non-tournament match.
    {
      game.mode = MODE.SINGLE;
      game.selFixed = [true, true];
      game.lookOverride = [{ face: FACES[3].id, hat: HATS[3].id }, null];
      game.locked = [false, false];
      game.lookRow = [0, 0];
      game.sel = [1, 4];
      const before = game.sel[0];
      pressed[SCHEME[0].right] = true;
      edgeFrame = true;
      updateSelect(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
      ok("a leftover tournament lock never freezes a normal match",
         game.sel[0] !== before, `${before} -> ${game.sel[0]}`);
      game.looks[0] = { face: FACES[0].id, hat: HATS[0].id };
      ok("nor a leftover character override",
         lookForSeat(0).face === FACES[0].id, lookForSeat(0).face);
      game.selFixed = [false, false];
      game.lookOverride = [null, null];
    }

    // ---- the draw re-roll ------------------------------------------------
    {
      setup(8);
      const sig = () => JSON.stringify(game.roundPairs);
      let changed = 0, accepted = 0;
      for (let i = 0; i < 30; i++) {
        const b = sig();
        if (rerollDraw() === true) accepted++;
        if (sig() !== b) changed++;
      }
      ok("every re-roll before the first tie is allowed", accepted === 30,
         `${accepted}/30`);
      // A shuffle may land on the same pairing, so this is a floor, not equality.
      ok("re-rolling actually changes the draw", changed >= 20, `${changed}/30`);
      ok("the re-roll counter tracks the rolls", game.drawRolls === 30,
         `${game.drawRolls}`);
      ok("a re-roll does not advance the round", game.round === 1, `${game.round}`);
      ok("a re-roll eliminates nobody", aliveEntrants().length === 8,
         `${aliveEntrants().length}`);
      ok("the drawn tree matches the new pairings",
         JSON.stringify(game.bracket[0].map((t) => [t.a, t.b])) === sig());

      // Every entrant still appears exactly once in the new draw.
      const seen = game.roundPairs.flat().filter((x) => x !== null).sort((a, b) => a - b);
      ok("the re-rolled draw still includes every entrant once",
         JSON.stringify(seen) === JSON.stringify([0, 1, 2, 3, 4, 5, 6, 7]),
         JSON.stringify(seen));

      /*
        R on the bracket screen performs the roll. Asserted on the roll COUNTER,
        not on the pairings: a shuffle can legitimately land on the same order,
        so comparing pairings would be flaky — and an "or" escape hatch here let
        this pass once with the key unwired at all.
      */
      const rollsBefore = game.drawRolls;
      pressed.KeyR = true;
      edgeFrame = true;
      step(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
      ok("R re-draws from the bracket screen", game.drawRolls === rollsBefore + 1,
         `${rollsBefore} -> ${game.drawRolls}`);
      ok("R does not start a tie", game.scene === SCENE.BRACKET, game.scene);

      // Once a tie is played the draw is history and must not be reshuffled.
      nextTie();
      startMatch();
      game.score = [3, 0];
      finishMatch(0, false);
      game.scene = SCENE.BRACKET;
      const locked = sig();
      ok("a re-roll is refused once a tie has been played", rerollDraw() === false);
      ok("and the draw is untouched", sig() === locked);

      // The refusal is visible, not silent.
      game.rerollDenied = 0;
      pressed.KeyR = true;
      edgeFrame = true;
      step(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
      ok("the refusal shows an on-screen notice", game.rerollDenied > 0,
         `${game.rerollDenied}`);

      // Later rounds are never re-rollable either.
      game.round = 2; game.tieIndex = 0; game.lastResult = null;
      ok("a later round cannot be re-drawn", rerollDraw() === false);

      // Nor is it a general-purpose key outside a tournament.
      game.mode = MODE.SINGLE; game.round = 1; game.tieIndex = 0;
      ok("re-roll does nothing outside a tournament", rerollDraw() === false);
      game.mode = MODE.TOURNAMENT;

      // A guest never re-rolls: the host owns the bracket.
      net.active = true; net.role = "guest";
      game.round = 1; game.tieIndex = 0; game.lastResult = null;
      ok("a guest cannot re-roll the host's draw", rerollDraw() === false);
      net.active = false; net.role = null;

      // And the bracket still paints after a re-roll.
      setup(6);
      rerollDraw();
      let threw = null;
      try { drawBracket(); } catch (e) { threw = e.message; }
      ok("the bracket still renders after a re-roll", !threw, threw || "");
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19al. Versioning: one constant, shown consistently, checked on connect.
  {
    const saved = { scene: game.scene, mode: game.mode, remoteName: game.remoteName };
    const savedNet = { ...net };

    ok("the version is a plain dotted number", /^\d+(\.\d+)+$/.test(VERSION), VERSION);

    /*
      The tab title is derived from VERSION at boot, so it cannot drift. Asserted
      on the real document where there is one; the earlier form of this check was
      wrapped in a `typeof document` guard and so never ran in the harness at all,
      which let a hard-coded v1.4 title pass unnoticed.
    */
    if (typeof document !== "undefined" && "title" in document) {
      ok("the page title carries the current version",
         String(document.title).includes(`v${VERSION}`), String(document.title));
    }

    // The menu paints the badge, on screen.
    game.scene = SCENE.MENU;
    game.mode = MODE.SINGLE;
    game.editing = -1;
    {
      const shot = capturePaint(drawMenu);
      const badge = shot.lines.filter((l) => l.s === `v${VERSION}`);
      ok("the menu shows the version", badge.length === 1,
         `${badge.length} badges`);
      const b = badge[0];
      ok("the version badge is inside the canvas",
         b && b.x >= 0 && b.x <= W && b.y >= 0 && b.y <= H,
         b ? `(${b.x},${b.y})` : "none");
      // It must not have pushed anything off the bottom: this menu has overflowed
      // its canvas before.
      const off = shot.lines.filter((l) => l.y < 0 || l.y > H);
      ok("adding the badge kept the menu on screen", off.length === 0,
         off.map((o) => o.s).join("|"));
    }

    // The credits screen agrees, and still fits.
    {
      const shot = capturePaint(drawCredits);
      ok("the credits show the version", shot.strings.includes(`v${VERSION}`),
         shot.strings.slice(-4).join("|"));
      const over = shot.lines.filter((l) => l.y > H);
      ok("the credits still fit on screen", over.length === 0,
         over.map((o) => o.s).join("|"));
    }

    // ---- the handshake ---------------------------------------------------
    net.active = true; net.role = "host"; net.state = "live";
    net.localSeat = 0; net.remoteSeat = 1;

    netHandle({ t: "hi", n: "ZOE", v: VERSION });
    ok("a matching peer version raises no warning", net.versionMismatch === false);
    ok("the peer version is recorded", net.peerVersion === VERSION, net.peerVersion);

    netHandle({ t: "hi", n: "ZOE", v: "1.2" });
    ok("a differing peer version is flagged", net.versionMismatch === true);
    {
      const shot = capturePaint(drawOnline);
      ok("the mismatch is shown on the connection screen",
         shot.strings.some((t) => /their build is 1\.2/.test(t)),
         shot.strings.filter((t) => /build/.test(t)).join("|"));
    }

    // A peer too old to send a version at all is still a mismatch, and must not
    // print "undefined" at the player.
    netHandle({ t: "hi", n: "ZOE" });
    ok("a peer with no version is treated as a mismatch", net.versionMismatch === true);
    ok("and its version is empty, not undefined", net.peerVersion === "", net.peerVersion);
    {
      const shot = capturePaint(drawOnline);
      ok("an unknown build is described, not left blank",
         shot.strings.some((t) => /unknown/.test(t)));
