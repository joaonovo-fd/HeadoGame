    // Scoring must agree with the CURRENT goal position, not the resting one.
    {
      let agree = true, detail = "";
      for (let i = 0; i < 600; i++) {
        goalPhase = i * 0.021;
        const tL = goalTop(0), tR = goalTop(1);

        // Just inside each mouth scores; just above the bar does not.
        const inL = { x: WALL - 2, y: tL + 30, r: BALL_R };
        const hiAboveL = { x: WALL - 2, y: tL - BALL_R - 12, r: BALL_R };
        const inR = { x: W - WALL + 2, y: tR + 30, r: BALL_R };
        const hiAboveR = { x: W - WALL + 2, y: tR - BALL_R - 12, r: BALL_R };

        if (goalScored(inL) !== -1) { agree = false; detail = `missed left goal at top ${tL.toFixed(0)}`; }
        if (goalScored(hiAboveL) !== 0) { agree = false; detail = `false goal above left bar at ${tL.toFixed(0)}`; }
        if (goalScored(inR) !== 1) { agree = false; detail = `missed right goal at top ${tR.toFixed(0)}`; }
        if (goalScored(hiAboveR) !== 0) { agree = false; detail = `false goal above right bar at ${tR.toFixed(0)}`; }
        if (!agree) break;
      }
      ok("scoring tracks the moving goals", agree, detail);
    }

    // Each side is judged independently: a ball high on the left must not score
    // just because the RIGHT goal happens to be raised, and vice versa.
    {
      let independent = true, detail = "";
      for (let i = 0; i < 800; i++) {
        goalPhase = i * 0.017;
        const tL = goalTop(0), tR = goalTop(1);
        if (Math.abs(tL - tR) < 30) continue;      // only interesting when split
        const higher = tL < tR ? 0 : 1;            // the raised goal
        const lowerTop = Math.max(tL, tR);
        // A ball above the LOWER bar but below the HIGHER one, at the low side.
        const y = lowerTop - BALL_R - 8;
        const probe = higher === 0
          ? { x: W - WALL + 2, y, r: BALL_R }      // right goal is the low one
          : { x: WALL - 2, y, r: BALL_R };
        if (goalScored(probe) !== 0) {
          independent = false;
          detail = `phase ${goalPhase.toFixed(2)}: false goal at the lower side (tL=${tL.toFixed(0)} tR=${tR.toFixed(0)})`;
          break;
        }
      }
      ok("each goal is judged at its own height", independent, detail);
    }

    // The ball must not leak through a wall as the goals slide past it.
    {
      let escaped = null;
      const sb = game.ball;
      for (const startY of [80, 200, 340, 460]) {
        goalPhase = 0;
        game.ball = { x: W / 2, y: startY, vx: 1150, vy: -200, r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 2400; i++) {
          goalPhase += DT;
          stepBall(DT);
          const b = game.ball;
          if (!Number.isFinite(b.x)) { escaped = "NaN"; break; }
          if (b.x < WALL - GOAL_D - 30 || b.x > W - WALL + GOAL_D + 30) {
            escaped = `leaked to x=${b.x.toFixed(0)} from y0=${startY}`;
            break;
          }
          if (i % 500 === 0) { b.vx = rand(-1150, 1150); b.vy = rand(-700, 300); }
        }
        if (escaped) break;
      }
      game.ball = sb;
      ok("ball never leaks past a sliding goal", !escaped, escaped || "");
    }

    goalPhase = savedPhase;
  }

  // 19i. Jetpack: the BALL loses gravity.
  {
    const saved = { ball: game.ball, jetpack: game.jetpack, jetpackOwner: game.jetpackOwner,
                    players: game.players };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    // Fall distance over one second, with and without the jetpack.
    const fall = (jet) => {
      game.jetpack = jet ? 99 : 0;
      game.ball = { x: W / 2, y: 120, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      const y0 = game.ball.y;
      for (let i = 0; i < 120; i++) stepBall(DT);
      return game.ball.y - y0;
    };
    const normalFall = fall(false);
    const jetFall = fall(true);
    ok("jetpack makes the ball nearly weightless",
       Math.abs(jetFall) < Math.abs(normalFall) * 0.25,
       `${normalFall.toFixed(0)}px -> ${jetFall.toFixed(0)}px in 1s`);
    ok("a jetpack ball does not plummet", jetFall < normalFall, `${jetFall.toFixed(0)}px`);

    // The effect must expire on its own.
    game.jetpack = 0.5;
    game.ball = { x: W / 2, y: 200, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
    for (let i = 0; i < 200; i++) stepBall(DT);
    ok("jetpack expires", game.jetpack === 0, `${game.jetpack}`);

    // Granting it sets ball state, not a size change.
    {
      const p = game.players[0];
      p.reset();
      const r0 = p.r;
      game.jetpack = 0;
      p.grant("jetpack");
      ok("jetpack grant arms the ball effect", game.jetpack > 0);
      ok("jetpack does not resize the player", Math.abs(p.r - r0) < 1e-9);
      ok("jetpack is attributed to its owner", game.jetpackOwner === 0);
      ok("jetpack shows on the owner's HUD", !!p.effects.jetpack);
    }

    Object.assign(game, saved);
  }

  // 19j. Helpers: goalkeeper and striker.
  {
    const saved = { helpers: game.helpers, ball: game.ball, players: game.players };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    game.players[0].reset();
    game.players[1].reset();

    // Spawning, ownership, and no duplicate stacking.
    game.helpers = [];
    const k = spawnHelper(0, "keeper");
    ok("a keeper spawns", game.helpers.length === 1 && k.kind === "keeper" && k.owner === 0);
    spawnHelper(0, "keeper");
    ok("re-granting refreshes rather than stacking", game.helpers.length === 1);
    spawnHelper(0, "striker");
    ok("a striker is a separate helper", game.helpers.length === 2);
    spawnHelper(1, "keeper");
    ok("the other player gets their own keeper", game.helpers.length === 3);

    // Helpers expire.
    game.helpers = [];
    spawnHelper(0, "keeper");
    for (let i = 0; i < Math.ceil(POWERUPS.keeper.dur / DT) + 20; i++) updateHelpers(DT);
    ok("helpers expire", game.helpers.length === 0);

    // A keeper stays near its own goal and never wanders upfield.
    {
      game.helpers = [];
      spawnHelper(0, "keeper");
      const h = game.helpers[0];
      let maxX = -Infinity, offPitch = false;
      const sb = game.ball;
      for (let i = 0; i < 1200; i++) {
        goalPhase += DT;
        // Move the ball all over the pitch; the keeper must not chase it away.
        game.ball = { x: 200 + 700 * Math.abs(Math.sin(i * 0.01)), y: 120 + 300 * Math.abs(Math.cos(i * 0.013)),
                      vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        h.life = 99;
        updateHelpers(DT);
        maxX = Math.max(maxX, h.x);
        if (h.x < WALL || h.x > W - WALL || h.y > GROUND_Y || h.y < 0) offPitch = true;
      }
      game.ball = sb;
      ok("the keeper guards its own half", maxX < W * 0.45, `reached x=${maxX.toFixed(0)}`);
      ok("the keeper stays on the pitch", !offPitch);
    }

    // The keeper must TRACK the ball vertically, including above the crossbar.
    // Regression: clamping its target to the bar pinned it low, so high shots
    // sailed over an immobile keeper.
    {
      game.helpers = [];
      const kp = spawnHelper(0, "keeper");
      kp.life = 99;
      const sb = game.ball;
      const reached = [];
      for (const by of [90, 200, 320, 470]) {
        game.ball = { x: 60, y: by, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 260; i++) { kp.life = 99; updateHelpers(DT); }
        reached.push({ by, ky: kp.y });
      }
      game.ball = sb;
      const tracks = reached.every((r) => Math.abs(r.ky - r.by) < 25);
      ok("the keeper tracks the ball's height", tracks,
         reached.map((r) => `${r.by}->${r.ky.toFixed(0)}`).join(" "));
      const spread = Math.max(...reached.map(r => r.ky)) - Math.min(...reached.map(r => r.ky));
      ok("the keeper actually moves vertically", spread > 200, `spread ${spread.toFixed(0)}px`);

      // It must be able to get above the bar to save a high shot.
      goalPhase = 0;
      const top = goalTop(0);
      game.helpers = [];
      const kp2 = spawnHelper(0, "keeper");
      kp2.life = 99;
      game.ball = { x: 60, y: top + 6, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      for (let i = 0; i < 300; i++) { kp2.life = 99; updateHelpers(DT); }
      ok("the keeper can reach the top of its goal", kp2.y <= top + 30,
         `keeper y=${kp2.y.toFixed(0)} vs bar ${top.toFixed(0)}`);
    }

    // A keeper deflects a shot AWAY from its own goal.
    {
      game.helpers = [];
      const kp = spawnHelper(0, "keeper");
      kp.life = 99;
      game.ball = { x: kp.x, y: kp.y, vx: -900, vy: 0, r: BALL_R, mass: BALL_MASS };
      updateHelpers(DT);
      ok("the keeper deflects the ball away from its goal", game.ball.vx > 0,
         `vx=${game.ball.vx.toFixed(0)}`);
      ok("the keeper's clearance has lift", game.ball.vy < 0, `vy=${game.ball.vy.toFixed(0)}`);
    }

    // A striker chases the ball and shoots at the opponent's goal.
    {
      for (const owner of [0, 1]) {
        game.helpers = [];
        const st = spawnHelper(owner, "striker");
        st.life = 99;
        const sb = game.ball;
        game.ball = { x: W / 2, y: GROUND_Y - BALL_R, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        const d0 = Math.abs(st.x - game.ball.x);
        for (let i = 0; i < 60; i++) { st.life = 99; updateHelpers(DT); }
        const d1 = Math.abs(st.x - game.ball.x);
        ok(`P${owner + 1}'s striker closes on the ball`, d1 <= d0 + 1,
           `${d0.toFixed(0)} -> ${d1.toFixed(0)}`);

        // Put it right on the ball and confirm the shot direction.
        st.x = game.ball.x; st.y = game.ball.y; st.kickCD = 0;
        game.ball.vx = 0; game.ball.vy = 0;
        updateHelpers(DT);
        const attack = owner === 0 ? 1 : -1;
        ok(`P${owner + 1}'s striker shoots toward the opponent's goal`,
           Math.sign(game.ball.vx) === attack, `vx=${game.ball.vx.toFixed(0)}`);
        game.ball = sb;
      }
    }

    // Helpers must respect the ball speed clamp.
    {
      game.helpers = [];
      const st = spawnHelper(0, "striker");
      st.life = 99;
      game.ball = { x: st.x, y: st.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      updateHelpers(DT);
      ok("helper kicks respect the speed clamp",
         len(game.ball.vx, game.ball.vy) <= BALL_MAX_V + 1e-6);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19k. Power-ups spawn faster than before.
  {
    ok("power-ups spawn on a short interval", PU_MAX <= 6 && PU_MIN >= 1,
       `${PU_MIN}..${PU_MAX}s`);
    ok("the spawn window is still a range", PU_MAX > PU_MIN);
  }

  // 19l. Power Shot is substantially stronger than before.
  {
    const saved = { players: game.players, ball: game.ball };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    const launch = (ps) => {
      const p = new Player(0, TEAMS[0]);
      p.reset(); p.facing = 1;
      if (ps) p.grant("powershot");
      p.kickT = KICK_TIME * 0.5; p.kickConsumed = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return game.ball.vx;
    };
    const n = launch(false), p = launch(true);
    ok("power shot is much stronger than a normal shot", p > n * 2,
       `${n.toFixed(0)} -> ${p.toFixed(0)} px/s`);
    /*
      Assert the EFFECT, not the constant. The multiplier was reduced when the
      base kick got stronger; what matters is that a power shot still clearly
      outguns a normal one, which the ratio above already measures.
    */
    ok("the power shot multiplier is a real boost", POWERSHOT_MUL >= 1.5,
       `${POWERSHOT_MUL}`);

    // Shot Power must still separate teams DURING a power shot. If the speed
    // clamp swallows the multiplier, strong and average teams become identical
    // and the stat stops meaning anything at the moment it matters most.
    {
      const psLaunch = (team) => {
        const q = new Player(0, team);
        q.reset(); q.facing = 1;
        q.grant("powershot");
        q.kickT = KICK_TIME * 0.5; q.kickConsumed = false;
        const tp = q.legTip;
        game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
        ballVsPlayer(q);
        return len(game.ball.vx, game.ball.vy);
      };
      const weak = psLaunch(TEAMS.find((t) => t.shot === 2));
      const strong = psLaunch(TEAMS.find((t) => t.shot === 5));
      ok("Shot Power still separates teams on a power shot", strong > weak * 1.05,
         `2-pip ${weak.toFixed(0)} vs 5-pip ${strong.toFixed(0)} (clamp ${BALL_MAX_V})`);
      const atClamp = TEAMS.filter((t) => psLaunch(t) >= BALL_MAX_V - 1).length;
      ok("not every team saturates the speed clamp", atClamp < TEAMS.length,
         `${atClamp}/${TEAMS.length} teams at the clamp`);
    }
    Object.assign(game, saved);
  }

  // 19m. A shot ball knocks an opposing player back.
  {
    const saved = { players: game.players, ball: game.ball };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    // Fast ball vs. slow ball into the same player.
    const hit = (speed, team = TEAMS[0]) => {
      const p = new Player(1, team);
      p.reset();
      p.x = W / 2;
      game.ball = { x: p.x - p.r - BALL_R + 2, y: p.y, vx: speed, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return { vx: p.vx, stun: p.stun };
    };
    const slow = hit(120);
    const fast = hit(1100);
    ok("a fast ball knocks a player back harder than a slow one",
       Math.abs(fast.vx) > Math.abs(slow.vx) * 2,
       `${slow.vx.toFixed(0)} vs ${fast.vx.toFixed(0)}`);
    ok("a hard hit staggers the player", fast.stun > 0, `stun=${fast.stun}`);
    ok("a gentle touch does not stagger", slow.stun === 0, `stun=${slow.stun}`);
    ok("knockback pushes away from the ball", fast.vx > 0, `vx=${fast.vx.toFixed(0)}`);
    ok("knockback respects its cap",
       Math.abs(fast.vx) <= BALL_KNOCK_MAX + 1e-6, `${fast.vx.toFixed(0)}`);

    // Heavier teams resist a shot better than light ones.
    const light = hit(1100, TEAMS.find((t) => t.size === 1));
    const heavy = hit(1100, TEAMS.find((t) => t.size === 5));
    ok("heavy teams resist knockback", Math.abs(heavy.vx) < Math.abs(light.vx),
       `heavy ${heavy.vx.toFixed(0)} vs light ${light.vx.toFixed(0)}`);

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19n. Pistol: ammo, firing, bullet effects, no friendly fire.
  {
    const saved = { players: game.players, ball: game.ball, bullets: game.bullets };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    game.bullets = [];

    const p0 = game.players[0];
    p0.reset();
    ok("a player starts unarmed", p0.ammo === 0 && p0.tryFire() === null);

    p0.grant("pistol");
    ok("the pistol grants ammo", p0.ammo === PISTOL_AMMO, `${p0.ammo}`);
    p0.facing = 1;
    const b1 = p0.tryFire();
    ok("firing produces a bullet", !!b1 && game.bullets.length === 1);
    ok("the bullet travels the way the player faces", b1.vx > 0, `vx=${b1.vx}`);
    ok("firing consumes a round", p0.ammo === PISTOL_AMMO - 1, `${p0.ammo}`);
    ok("there is a cooldown between shots", p0.tryFire() === null);

    // Empty the magazine.
    p0.ammo = 1; p0.fireCD = 0;
    p0.tryFire();
    ok("an empty pistol cannot fire", p0.ammo === 0 && (p0.fireCD = 0) === 0 && p0.tryFire() === null);
    ok("the HUD chip clears when empty", !p0.effects.pistol);

    // A bullet shoves the ball.
    {
      game.bullets = [];
      p0.ammo = 5; p0.fireCD = 0; p0.facing = 1;
      p0.x = 200; p0.y = GROUND_Y - p0.r;
      game.ball = { x: 260, y: p0.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      p0.tryFire();
      let moved = false;
      for (let i = 0; i < 60; i++) { updateBullets(DT); if (game.ball.vx > 200) { moved = true; break; } }
      ok("a bullet shoves the ball forward", moved, `vx=${game.ball.vx.toFixed(0)}`);
      ok("the bullet is consumed on impact", game.bullets.length === 0);
    }

    // A bullet stuns the OPPONENT but never its owner.
    {
      game.bullets = [];
      const shooter = game.players[0], target = game.players[1];
      shooter.reset(); target.reset();
      shooter.x = 300; target.x = 380;
      shooter.y = target.y = GROUND_Y - shooter.r;
      game.ball = { x: -500, y: -500, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };  // out of the way
      shooter.ammo = 3; shooter.fireCD = 0; shooter.facing = 1;
      shooter.tryFire();
      for (let i = 0; i < 60 && game.bullets.length; i++) updateBullets(DT);
      ok("a bullet stuns the opponent", target.stun > 0, `stun=${target.stun}`);
      ok("a bullet knocks the opponent back", target.vx > 0, `vx=${target.vx.toFixed(0)}`);
      ok("the shooter is unharmed", shooter.stun === 0);

      // Friendly fire: a bullet passing over its owner must not stun them.
      game.bullets = [];
      shooter.stun = 0;
      game.bullets.push({ owner: 0, x: shooter.x, y: shooter.y, vx: BULLET_SPD, vy: 0,
                          r: BULLET_R, life: BULLET_LIFE });
      updateBullets(DT);
      ok("no friendly fire", shooter.stun === 0);
    }

    // Bullets expire rather than accumulating.
    {
      game.bullets = [{ owner: 0, x: 500, y: 100, vx: 0, vy: 0, r: BULLET_R, life: 0.05 }];
      for (let i = 0; i < 40; i++) updateBullets(DT);
      ok("bullets expire", game.bullets.length === 0);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19o. Goal resize power-up.
  {
    const savedScale = goalScale;
    const saved = { players: game.players, goalFx: game.goalFx, goalFxT: game.goalFxT };
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    goalScale = 1;
    const base = goalHeight();
    game.players[0].grant("bigGoals");
    const big = goalHeight();
    ok("BIG GOALS enlarges the mouth", big > base * 1.4, `${base.toFixed(0)} -> ${big.toFixed(0)}`);
    ok("the resize is recorded as a world effect", game.goalFx === "bigGoals" && game.goalFxT > 0);

    goalScale = 1;
    game.goalFxT = 0;
    game.players[0].grant("tinyGoals");
    const tiny = goalHeight();
    ok("TINY GOALS shrinks the mouth", tiny < base * 0.7, `${base.toFixed(0)} -> ${tiny.toFixed(0)}`);

    // Scoring must follow the resized mouth, and the mouth must stay usable.
    {
      let ok1 = true, detail = "";
      for (const sc of [GOAL_SIZE_SMALL, 1, GOAL_SIZE_BIG]) {
        goalScale = sc;
        for (let i = 0; i < 200; i++) {
          goalPhase = i * 0.03;
          const t = goalTop(0), hgt = goalHeight();
          if (hgt < 55) { ok1 = false; detail = `mouth ${hgt.toFixed(0)}px too small at scale ${sc}`; break; }
          if (t < 0 || t > GROUND_Y - 50) { ok1 = false; detail = `bar off-pitch at ${t.toFixed(0)}`; break; }
          // Just inside the mouth must score at every size.
          if (goalScored({ x: WALL - 2, y: t + 20, r: BALL_R }) !== -1) {
            ok1 = false; detail = `no goal inside a ${sc}x mouth`; break;
          }
          // Above the bar must not.
          if (goalScored({ x: WALL - 2, y: t - BALL_R - 12, r: BALL_R }) !== 0) {
            ok1 = false; detail = `false goal above a ${sc}x bar`; break;
          }
        }
        if (!ok1) break;
      }
      ok("scoring follows the resized goals", ok1, detail);
    }

    goalScale = savedScale;
    Object.assign(game, saved);
  }

  // 19p. Volleyball: net, confinement, and ground scoring.
  {
    const savedMode = game.mode;
    const saved = { players: game.players, ball: game.ball, score: [...game.score],
                    scene: game.scene, goalsToWin: game.goalsToWin };
    game.mode = MODE.VOLLEY;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    ok("volleyball is a selectable mode", MODE_ORDER.includes(MODE.VOLLEY));

    // Ground contact concedes to the OTHER side.
    ok("a ball landing left scores for P2",
       volleyGround({ x: W * 0.25, y: GROUND_Y - BALL_R + 2, r: BALL_R }) === 2);
    ok("a ball landing right scores for P1",
       volleyGround({ x: W * 0.75, y: GROUND_Y - BALL_R + 2, r: BALL_R }) === 1);
    ok("a ball in the air scores nothing",
       volleyGround({ x: W / 2, y: 200, r: BALL_R }) === 0);

    // The net blocks the ball.
    {
      const b = { x: W / 2 - 40, y: GROUND_Y - 40, vx: 700, vy: 0, r: BALL_R, mass: BALL_MASS };
      let crossed = false;
      for (let i = 0; i < 400; i++) {
        integrate(b, DT, 0, 0);
        ballVsNet(b);
        if (b.x > W / 2 + NET_W) { crossed = true; break; }
      }
      ok("the net blocks a low ball", !crossed, `reached x=${b.x.toFixed(0)}`);

      // A high ball must clear it.
      const hi = { x: W / 2 - 40, y: netTop() - 60, vx: 700, vy: 0, r: BALL_R, mass: BALL_MASS };
      let over = false;
      for (let i = 0; i < 200; i++) {
        integrate(hi, DT, 0, 0);
        ballVsNet(hi);
        if (hi.x > W / 2 + NET_W * 2) { over = true; break; }
      }
      ok("a high ball clears the net", over, `x=${hi.x.toFixed(0)} y=${hi.y.toFixed(0)}`);
    }

    // Players cannot cross the net.
    {
      const p0 = game.players[0], p1 = game.players[1];
      p0.reset(); p1.reset();
      p0.x = W * 0.9; confineToHalf(p0);
      p1.x = W * 0.1; confineToHalf(p1);
      ok("P1 is confined to the left half", p0.x < W / 2, `x=${p0.x.toFixed(0)}`);
      ok("P2 is confined to the right half", p1.x > W / 2, `x=${p1.x.toFixed(0)}`);

      // Confinement must survive a SHOVE. Regression: confining before ball
      // knockback / bullets / mine blasts let a hit push a player through
      // the net.
      p0.reset(); p1.reset();
      p0.vx = 4000; p1.vx = -4000;         // absurd shove toward the net
      for (let i = 0; i < 30; i++) {
        p0.update(DT, null); p1.update(DT, null);
        confineToHalf(p0); confineToHalf(p1);
      }
      ok("a shoved player cannot cross the net",
         p0.x < W / 2 && p1.x > W / 2,
         `p0=${p0.x.toFixed(0)} p1=${p1.x.toFixed(0)}`);
      ok("confinement leaves room for the net",
         p0.x + p0.r <= W / 2 - NET_W / 2 + 1e-6 && p1.x - p1.r >= W / 2 + NET_W / 2 - 1e-6);
    }

    // Points route through the same match-end machinery.
    {
      game.goalsToWin = 3;
      game.score = [2, 0];
      game.scene = SCENE.PLAY;
      game.suddenDeath = false;
      game.ball = makeBall();
      scoreVolleyPoint(0);
      ok("a volleyball point can win the match",
         game.scene === SCENE.WIN && game.winner === 0, `${game.scene}`);
    }

    // The ball must never escape in volleyball (walls are solid).
    {
      let escaped = null;
      const sb = game.ball;
      for (let t = 0; t < 3; t++) {
        game.ball = { x: W / 2 + 100, y: 120, vx: 1200, vy: -400, r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 2000; i++) {
          goalPhase += DT;
          stepBall(DT);
          ballVsNet(game.ball);
          const b = game.ball;
          if (!Number.isFinite(b.x)) { escaped = "NaN"; break; }
          if (b.x < 0 || b.x > W || b.y < -30 || b.y > H) {
            escaped = `${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
          }
          if (i % 400 === 0) { b.vx = rand(-1200, 1200); b.vy = rand(-800, 300); }
        }
        if (escaped) break;
      }
      game.ball = sb;
      ok("the ball never escapes in volleyball", !escaped, escaped || "");
    }

    game.mode = savedMode;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19q. Chaos mode: everything re-rolls, and everything stays playable.
  {
    const saved = { players: game.players, ball: game.ball, chaos: game.chaos,
                    chaosT: game.chaosT, chaosCount: game.chaosCount, mode: game.mode };
    game.mode = MODE.SINGLE;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    resetChaos();
    const before = getTunablesSnapshot();
    rollChaos();
    const after = getTunablesSnapshot();
    const changed = Object.keys(before).filter((k) => before[k] !== after[k]);
    ok("a chaos roll changes many tunables at once", changed.length >= 6,
       `${changed.length} changed: ${changed.join(",")}`);
    ok("a chaos roll announces itself", game.chaosAnnounce > 0);
    ok("chaos counts its rolls", game.chaosCount === 1, `${game.chaosCount}`);

    // Every roll must stay inside playable bounds, and players must remain
    // able to move and jump.
    {
      let bad = null;
      for (let i = 0; i < 500; i++) {
        rollChaos();
        const t = getTunablesSnapshot();
        if (!(t.ballRest > 0.2 && t.ballRest < 1)) bad = `ballRest ${t.ballRest}`;
        if (!(t.ballDrag >= 0 && t.ballDrag < 1)) bad = `ballDrag ${t.ballDrag}`;
        if (!(t.playerSpeedMul > 0.3 && t.playerSpeedMul < 3)) bad = `speed ${t.playerSpeedMul}`;
        if (!(t.playerSizeMul > 0.4 && t.playerSizeMul < 2)) bad = `size ${t.playerSizeMul}`;
        if (!(gravity > 0)) bad = `gravity ${gravity}`;
        const hgt = goalHeight();
        if (hgt < 55) bad = `goal mouth ${hgt.toFixed(0)}`;
        for (const side of [0, 1]) {
          for (let k = 0; k < 40; k++) {
            goalPhase = k * 0.1;
            const top = goalTop(side);
            if (top < 0 || top > GROUND_Y - 50) bad = `goal ${side} top ${top.toFixed(0)}`;
          }
        }
        // A player must still fit on the pitch and be able to jump.
        for (const pl of game.players) {
          if (pl.r * 2 >= W / 4) bad = `player radius ${pl.r.toFixed(0)} too big`;
          if (!(pl.jumpV > 100)) bad = `jumpV ${pl.jumpV.toFixed(0)} too weak`;
          if (!(pl.maxv > 50)) bad = `maxv ${pl.maxv.toFixed(0)} too slow`;
        }
        if (bad) break;
      }
      ok("500 chaos rolls all stay playable", !bad, bad || "");
    }

    // Chaos must not break the simulation.
    {
      let bad = null;
      const sb = game.ball;
      for (let r = 0; r < 40; r++) {
        rollChaos();
        game.ball = { x: W / 2, y: 150, vx: rand(-900, 900), vy: rand(-600, 200), r: BALL_R, mass: BALL_MASS };
        for (let i = 0; i < 600; i++) {
          goalPhase += DT;
          stepBall(DT);
          const b = game.ball;
          if (!Number.isFinite(b.x) || !Number.isFinite(b.y)) { bad = "ball NaN"; break; }
          if (b.x < -GOAL_D - 40 || b.x > W + GOAL_D + 40 || b.y < -40 || b.y > H + 40) {
            bad = `ball escaped to ${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
          }
        }
        if (bad) break;
      }
      game.ball = sb;
      ok("the ball stays sane through 40 chaos rolls", !bad, bad || "");
    }

    // Reset restores the authored values.
    resetChaos();
    const r = getTunablesSnapshot();
    ok("reset restores authored tunables",
       r.ballRest === BALL_REST && r.playerSpeedMul === 1 && r.goalTravel === GOAL_TRAVEL &&
       r.playerSizeMul === 1 && r.goalScale === 1,
       JSON.stringify(r));
    ok("reset clears the roll counter", game.chaosCount === 0);
    ok("reset restores gravity too", gravity === GRAVITY && game.gravMul === 1,
       `gravity ${gravity.toFixed(0)}`);

    resetChaos();                 // leave no rolled state for later cases
    goalPhase = 0;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19r. Knockback is a POWER SHOT weapon only.
  {
    const saved = { players: game.players, ball: game.ball, mode: game.mode,
                    ballPowered: game.ballPowered, ballPoweredBy: game.ballPoweredBy };
    game.mode = MODE.SINGLE;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    // A fast but UNCHARGED ball must not shove anyone.
    const hit = (powered, poweredBy = 0) => {
      const p = new Player(1, TEAMS[0]);
      p.reset(); p.x = W / 2;
      game.ballPowered = powered;
      game.ballPoweredBy = poweredBy;
      game.ball = { x: p.x - p.r - BALL_R + 2, y: p.y, vx: 1200, vy: 0,
                    r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      return { vx: p.vx, stun: p.stun };
    };

    const plain = hit(false);
    ok("a normal fast ball does NOT knock the player back",
       Math.abs(plain.vx) < 200, `vx=${plain.vx.toFixed(0)}`);
    ok("a normal ball does not stun", plain.stun === 0, `stun=${plain.stun}`);

    const charged = hit(true, 0);
    ok("a POWER SHOT ball does knock the player back",
       charged.vx > 300, `vx=${charged.vx.toFixed(0)}`);
    ok("a power shot staggers", charged.stun > 0);
    // Checked immediately: the charge is spent by the hit above.
    ok("the power charge is consumed on impact", game.ballPowered === false);

    // You cannot knock YOURSELF back with your own power shot. This case does
    // not consume the charge, because no knockback happened.
    const own = hit(true, 1);
    ok("your own power shot does not shove you",
       Math.abs(own.vx) < 200, `vx=${own.vx.toFixed(0)}`);
    ok("a non-hit leaves the charge live for the opponent", game.ballPowered === true);

    // A power shot actually sets the charge.
    {
      const p = new Player(0, TEAMS[0]);
      p.reset(); p.facing = 1;
      p.grant("powershot");
      p.kickT = KICK_TIME * 0.5; p.kickConsumed = false;
      game.ballPowered = false;
      const tp = p.legTip;
      game.ball = { x: tp.x + 6, y: tp.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(p);
      ok("a power shot charges the ball", game.ballPowered === true);
      ok("the charge is attributed to the kicker", game.ballPoweredBy === 0);

      // A NORMAL kick must not charge it.
      const q = new Player(0, TEAMS[0]);
      q.reset(); q.facing = 1;
      q.kickT = KICK_TIME * 0.5; q.kickConsumed = false;
      game.ballPowered = false;
      const tq = q.legTip;
      game.ball = { x: tq.x + 6, y: tq.y, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS };
      ballVsPlayer(q);
      ok("a normal kick does not charge the ball", game.ballPowered === false);
    }

    // Hitting the ground discharges it.
    {
      game.ballPowered = true;
      game.ballPoweredBy = 0;
      game.ball = { x: W / 2, y: GROUND_Y - BALL_R - 40, vx: 0, vy: 300,
                    r: BALL_R, mass: BALL_MASS, bounces: 0 };
      for (let i = 0; i < 80; i++) stepBall(DT);
      ok("a bounce discharges the power shot", game.ballPowered === false);
    }

    Object.assign(game, saved);
    game.particles = [];
  }

  // 19s. Per-mode ball: volleyball's must be bigger, lighter and floatier.
  {
    const savedMode = game.mode;
    const saved = { ball: game.ball, players: game.players };

    const soccer = MODE_CFG[MODE.SINGLE];
    const volley = MODE_CFG[MODE.VOLLEY];
    ok("the volleyball is bigger", volley.ballR > soccer.ballR,
       `${soccer.ballR} -> ${volley.ballR}`);
    ok("the volleyball is lighter", volley.ballMass < soccer.ballMass,
       `${soccer.ballMass} -> ${volley.ballMass}`);
    ok("the volleyball feels floatier", volley.grav < soccer.grav && volley.drag > soccer.drag,
       `grav ${volley.grav}, drag ${volley.drag}`);
    ok("volleyball has knockback disabled", volley.knockback === false);

    // makeBall must honour the mode.
    game.mode = MODE.VOLLEY;
    const vb = makeBall();
    ok("makeBall uses the mode's ball", vb.r === volley.ballR && vb.mass === volley.ballMass,
       `r=${vb.r} m=${vb.mass}`);

    // Measured fall: the volleyball must drop markedly slower.
    const fallIn = (mode) => {
      game.mode = mode;
      const c = MODE_CFG[mode];
      game.ball = { x: W / 2, y: 100, vx: 0, vy: 0, r: c.ballR, mass: c.ballMass, bounces: 0 };
      const y0 = game.ball.y;
      for (let i = 0; i < 90; i++) stepBall(DT);
      return game.ball.y - y0;
    };
    const soccerFall = fallIn(MODE.SINGLE);
    const volleyFall = fallIn(MODE.VOLLEY);
    ok("the volleyball falls much slower", volleyFall < soccerFall * 0.65,
       `${soccerFall.toFixed(0)}px vs ${volleyFall.toFixed(0)}px`);

    // Knockback must be off in volleyball even with a charged ball.
    game.mode = MODE.VOLLEY;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];
    {
      const p = new Player(1, TEAMS[0]);
      p.reset(); p.x = W * 0.75;
      game.ballPowered = true; game.ballPoweredBy = 0;
      game.ball = { x: p.x - p.r - volley.ballR + 2, y: p.y, vx: 1200, vy: 0,
                    r: volley.ballR, mass: volley.ballMass };
      ballVsPlayer(p);
      ok("volleyball never knocks a player back", Math.abs(p.vx) < 200,
         `vx=${p.vx.toFixed(0)}`);
      ok("volleyball never stuns", p.stun === 0);
    }

    game.mode = savedMode;
    Object.assign(game, saved);
    game.ballPowered = false;
    game.particles = [];
  }

  // 19t. Tennis: net, one bounce per side, and scoring.
  {
    const savedMode = game.mode;
    const saved = { ball: game.ball, players: game.players, score: [...game.score],
                    scene: game.scene, goalsToWin: game.goalsToWin };
    game.mode = MODE.TENNIS;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    ok("tennis is selectable", MODE_ORDER.includes(MODE.TENNIS));
    ok("tennis has a net", hasNet() && MODE_CFG[MODE.TENNIS].net > 0);
    ok("the tennis net is lower than the volleyball net",
       MODE_CFG[MODE.TENNIS].net < MODE_CFG[MODE.VOLLEY].net,
       `${MODE_CFG[MODE.TENNIS].net} vs ${MODE_CFG[MODE.VOLLEY].net}`);
    ok("the tennis ball is small and bouncy",
       MODE_CFG[MODE.TENNIS].ballR < MODE_CFG[MODE.SINGLE].ballR &&
       MODE_CFG[MODE.TENNIS].rest > MODE_CFG[MODE.SINGLE].rest * 0.9);
    ok("tennis has knockback disabled", MODE_CFG[MODE.TENNIS].knockback === false);

    // First bounce on a side is legal; a second on the SAME side concedes.
    {
      game.lastBounceSide = -1;
      game.ballSide = -1;
      const onGround = { x: W * 0.25, y: GROUND_Y - 5, r: 11 };
      ok("the first bounce is legal", tennisGround(onGround) === 0);
      ok("the bounce side is remembered", game.lastBounceSide === 0);
      ok("a second bounce on the same side concedes", tennisGround(onGround) === 2);

      // Crossing the net resets the count.
      game.lastBounceSide = 0;
      game.ballSide = 0;
      tennisTrackCrossing({ x: W * 0.75, y: 200, r: 11 });
      ok("crossing the net clears the bounce", game.lastBounceSide === -1);

      // And the mirror case scores for P1.
      game.lastBounceSide = 1;
      ok("a double bounce on the right concedes to P1",
         tennisGround({ x: W * 0.75, y: GROUND_Y - 5, r: 11 }) === 1);
    }

    // A ball in flight never scores.
    game.lastBounceSide = -1;
    ok("a ball in the air scores nothing in tennis",
       tennisGround({ x: W / 2, y: 200, r: 11 }) === 0);

    game.mode = savedMode;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19u. Basketball: hoops, downward-only scoring, rim collisions.
  {
    const savedMode = game.mode;
    const saved = { ball: game.ball, players: game.players, score: [...game.score],
                    scene: game.scene };
    game.mode = MODE.BASKET;
    game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[1])];

    ok("basketball is selectable", MODE_ORDER.includes(MODE.BASKET));
    ok("basketball has no soccer goals", MODE_CFG[MODE.BASKET].goals === false);
    ok("basketball has no net", !MODE_CFG[MODE.BASKET].net);

    const hl = hoopPos(0), hr = hoopPos(1);
    ok("the hoops are inside the pitch",
       hl.x > WALL && hl.x < W / 2 && hr.x < W - WALL && hr.x > W / 2,
       `${hl.x} / ${hr.x}`);
    ok("the hoops are above head height", hl.y < GROUND_Y - 100, `y=${hl.y}`);

    // Falling through a ring scores; the LEFT hoop is P2's.
    {
      const r = MODE_CFG[MODE.BASKET].ballR;
      const through = { x: hl.x, y: hl.y + 2, vx: 0, vy: 300, r, mass: 1 };
      ok("dropping through the left hoop scores for P2",
         basketScored(through, hl.y - 2) === 2);
      const throughR = { x: hr.x, y: hr.y + 2, vx: 0, vy: 300, r, mass: 1 };
      ok("dropping through the right hoop scores for P1",
         basketScored(throughR, hr.y - 2) === 1);

      // Rising through the ring must NOT score.
      const rising = { x: hl.x, y: hl.y - 2, vx: 0, vy: -300, r, mass: 1 };
      ok("rising through a hoop does not score",
         basketScored(rising, hl.y + 2) === 0);

      // Passing beside the ring must not score.
      const beside = { x: hl.x + HOOP_R + 40, y: hl.y + 2, vx: 0, vy: 300, r, mass: 1 };
      ok("passing beside a hoop does not score",
         basketScored(beside, hl.y - 2) === 0);

      // A ball nowhere near either hoop scores nothing.
      ok("midcourt scores nothing",
         basketScored({ x: W / 2, y: 300, vx: 0, vy: 400, r, mass: 1 }, 290) === 0);
    }

    // The rim is solid: a ball fired at it must be deflected, not pass through.
    {
      const r = MODE_CFG[MODE.BASKET].ballR;
      const b = { x: hl.x - HOOP_R, y: hl.y - 30, vx: 0, vy: 600, r, mass: 1 };
      let deflected = false;
      for (let i = 0; i < 60; i++) {
        integrate(b, DT, 0, 0);
        if (ballVsHoops(b)) { deflected = true; break; }
      }
      ok("the rim deflects the ball", deflected);
    }

    // The ball must stay in the court through a long chaotic run.
    {
      let escaped = null;
      const sb = game.ball;
      const r = MODE_CFG[MODE.BASKET].ballR;
      for (let t = 0; t < 3; t++) {
        game.ball = { x: W / 2, y: 150, vx: 1400, vy: -500, r, mass: 1.25, bounces: 0 };
        for (let i = 0; i < 2200; i++) {
          stepBall(DT);
          ballVsHoops(game.ball);
          const b = game.ball;
          if (!Number.isFinite(b.x)) { escaped = "NaN"; break; }
          if (b.x < 0 || b.x > W || b.y < -30 || b.y > H) {
            escaped = `${b.x.toFixed(0)},${b.y.toFixed(0)}`; break;
          }
          if (i % 400 === 0) { b.vx = rand(-1400, 1400); b.vy = rand(-900, 300); }
        }
        if (escaped) break;
      }
      game.ball = sb;
      ok("the ball never escapes the basketball court", !escaped, escaped || "");
    }

    game.mode = savedMode;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19v. CPU: three tiers, real key presses, and no cheating.
  {
    const savedMode = game.mode;
    const saved = { players: game.players, ball: game.ball, cpu: [...game.cpu],
                    cpuLevel: game.cpuLevel, scene: game.scene };
    game.mode = MODE.SINGLE;

    ok("there are three CPU levels", CPU_LEVELS.length === 3,
       `${CPU_LEVELS.length}`);
    ok("the levels are named easy / medium / hard",
       CPU_LEVELS.map((l) => l.name).join(",") === "EASY,MEDIUM,HARD",
       CPU_LEVELS.map((l) => l.name).join(","));
    ok("harder levels react faster",
       CPU_LEVELS[0].react > CPU_LEVELS[1].react && CPU_LEVELS[1].react > CPU_LEVELS[2].react);
    ok("harder levels aim more accurately",
       CPU_LEVELS[0].err > CPU_LEVELS[1].err && CPU_LEVELS[1].err > CPU_LEVELS[2].err);
    ok("harder levels are more aggressive",
       CPU_LEVELS[0].aggr < CPU_LEVELS[1].aggr && CPU_LEVELS[1].aggr < CPU_LEVELS[2].aggr);
    ok("harder levels idle less",
       CPU_LEVELS[0].idle > CPU_LEVELS[2].idle);

    // The tiers must differ in MEASURED play, not merely in their config: time
    // each one to close the same gap onto a stationary ball.
    {
      const closeTime = (lvl) => {
        game.cpuLevel = lvl;
        game.cpu = [false, true];
        game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[0])];
        const cpu = game.players[1];
        cpu.reset();
        cpu.ai = null;
        game.ball = { x: W * 0.2, y: GROUND_Y - BALL_R, vx: 0, vy: 0,
                      r: BALL_R, mass: BALL_MASS, bounces: 0 };
        let t = 0;
        for (let i = 0; i < 2400; i++) {
          updateCPU(cpu, DT);
          cpu.update(DT, null);
          t += DT;
          if (Math.abs(cpu.x - game.ball.x) < 40) return t;
        }
        return Infinity;
      };
      /*
        The AI is deliberately random (reaction jitter, idle rolls), so a single
        sample per level overlaps between tiers and made this test flake about
        one run in four. Average several runs: the MEANS separate cleanly.
      */
      const meanClose = (lvl, runs = 9) => {
        let total = 0;
        for (let r = 0; r < runs; r++) total += Math.min(closeTime(lvl), 12);
        return total / runs;
      };
      const te = meanClose(0), tm = meanClose(1), th = meanClose(2);
      ok("every level eventually reaches the ball",
         te < 12 && tm < 12 && th < 12, `${te} / ${tm} / ${th}`);
      ok("harder levels reach the ball faster on average", th < tm && tm < te,
         `easy ${te.toFixed(2)}s, medium ${tm.toFixed(2)}s, hard ${th.toFixed(2)}s`);
      ok("the tiers are meaningfully apart", te > th * 1.3,
         `easy ${te.toFixed(2)}s vs hard ${th.toFixed(2)}s`);
      ok("even easy is not hopeless", te < 6, `${te.toFixed(2)}s`);
    }

    // The CPU must actually press keys and move toward the ball.
    for (let lvl = 0; lvl < 3; lvl++) {
      game.cpuLevel = lvl;
      game.cpu = [false, true];
      game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[0])];
      const cpu = game.players[1];
      cpu.reset();
      cpu.ai = null;
      // Put the ball far to the LEFT so the CPU must walk left to reach it.
      game.ball = { x: W * 0.2, y: GROUND_Y - BALL_R, vx: 0, vy: 0,
                    r: BALL_R, mass: BALL_MASS, bounces: 0 };
      const x0 = cpu.x;
      for (let i = 0; i < 600; i++) {
        updateCPU(cpu, DT);
        cpu.update(DT, null);
      }
      ok(`${CPU_LEVELS[lvl].name} CPU moves toward the ball`, cpu.x < x0 - 20,
         `${x0.toFixed(0)} -> ${cpu.x.toFixed(0)}`);
      ok(`${CPU_LEVELS[lvl].name} CPU stays on the pitch`,
         cpu.x >= WALL && cpu.x <= W - WALL && cpu.y <= GROUND_Y);
    }

    // The CPU drives the SAME keys a human does — no teleporting.
    {
      game.cpuLevel = 2;
      game.cpu = [false, true];
      game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[0])];
      const cpu = game.players[1];
      cpu.reset();
      cpu.ai = null;
      game.ball = { x: W * 0.2, y: GROUND_Y - BALL_R, vx: 0, vy: 0,
                    r: BALL_R, mass: BALL_MASS, bounces: 0 };
      let pressedSomething = false;
      for (let i = 0; i < 200; i++) {
        updateCPU(cpu, DT);
        const a = intent[1];
        if (a.left || a.right || a.up || a.down) pressedSomething = true;
        cpu.update(DT, null);
      }
      // The AI drives the same intent channel a human keypress produces, so it
      // is bound by identical physics rather than being teleported about.
      ok("the CPU emits real input", pressedSomething);

      /*
        A stunned CPU must obey stun exactly as a human does: no INPUT is
        accepted. Existing momentum still carries (that is true of a stunned
        human too), so assert that it presses nothing and stops accelerating —
        not that it freezes in place.
      */
      cpu.reset();
      cpu.stun = 0.5;
      cpu.vx = 0;
      for (let i = 0; i < 20; i++) {
        updateCPU(cpu, DT);
        cpu.update(DT, null);
      }
      ok("a stunned CPU does not accelerate", Math.abs(cpu.vx) < 1,
         `vx=${cpu.vx.toFixed(2)}`);
      ok("a stunned CPU cannot kick", cpu.tryFire() === null || cpu.ammo === 0);
      cpu.stun = 0;

      // And it cannot kick faster than the cooldown allows.
      cpu.kickCD = 0; cpu.kickT = 0;
      ok("the CPU can start a kick", cpu.tryStartKick() === true);
      ok("the CPU respects the kick cooldown", cpu.tryStartKick() === false);

      game.cpu = [false, true];
      releaseCPUKeys();
      ok("releasing CPU input clears it",
         !intent[1].left && !intent[1].right && !intent[1].up && !intent[1].down);
    }

    // A CPU in a confined mode must not cross the net.
    {
      game.mode = MODE.TENNIS;
      game.cpuLevel = 2;
      game.cpu = [false, true];
      game.players = [new Player(0, TEAMS[0]), new Player(1, TEAMS[0])];
      const cpu = game.players[1];
      cpu.reset();
      cpu.ai = null;
      game.ball = { x: W * 0.1, y: GROUND_Y - 40, vx: 0, vy: 0, r: 11, mass: 0.7, bounces: 0 };
      let crossed = false;
      for (let i = 0; i < 900; i++) {
        updateCPU(cpu, DT);
        cpu.update(DT, null);
        confineToHalf(cpu);
        if (cpu.x < W / 2) crossed = true;
      }
      ok("a CPU never crosses the net", !crossed, `x=${cpu.x.toFixed(0)}`);
      game.mode = MODE.SINGLE;
    }

    // The menu exposes the CPU rows only when they apply.
    {
      game.mode = MODE.SINGLE;
      game.cpu = [false, false];
      ok("the CPU level row is hidden with a human opponent",
         !menuRows().includes("cpulevel"));
      game.cpu = [false, true];
      ok("the CPU level row appears with a CPU opponent",
         menuRows().includes("cpulevel"));
      game.mode = MODE.TOURNAMENT;
      ok("a tournament hides the opponent row", !menuRows().includes("opponent"));
      game.mode = MODE.SINGLE;
    }

    game.mode = savedMode;
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19w. The goal COLLIDERS must move with the drawn frame, both edges.
  //      Chaos is enabled here: it is the only mode where a frame lifts clear
  //      of the grass, which is what makes the lower edge testable.
  {
    const savedPhase = goalPhase, savedScale = goalScale;
    const savedBall = game.ball;
    const savedChaosW = game.chaos;
    game.chaos = true;

    // The collider band must equal the drawn band at every position.
    {
      let bad = null;
      for (let i = 0; i < 800; i++) {
        goalPhase = i * 0.017;
        for (const side of [0, 1]) {
          const top = goalTop(side), bot = goalBottom(side);
          if (!(bot > top)) { bad = `inverted band ${top.toFixed(0)}..${bot.toFixed(0)}`; break; }
          if (bot > GROUND_Y + 1e-6) { bad = `bottom ${bot.toFixed(0)} below the grass`; break; }
          // The band is the frame height unless the grass clips it.
          const want = Math.min(top + goalHeight(), GROUND_Y);
          if (Math.abs(bot - want) > 1e-6) { bad = `bottom ${bot} != ${want}`; break; }
        }
        if (bad) break;
      }
      ok("the goal band is well formed at every position", !bad, bad || "");
    }

    /*
      The bug this guards: the mouth's lower edge used to be pinned to the
      ground while the crossbar moved. A raised goal then scored on empty air
      BELOW its net — up to 74px of it.
    */
    {
      let leaked = null, checked = 0;
      for (let i = 0; i < 1200; i++) {
        goalPhase = i * 0.013;
        for (const side of [0, 1]) {
          const bot = goalBottom(side);
          if (bot >= GROUND_Y - 2) continue;      // frame is on the grass here
          checked++;
          const x = side === 0 ? WALL - 2 : W - WALL + 2;
          // A ball comfortably BELOW the frame must not score.
          const under = { x, y: bot + BALL_R + 10, r: BALL_R };
          if (goalScored(under) !== 0) {
            leaked = `phase ${goalPhase.toFixed(2)} side ${side}: scored ${(bot + BALL_R + 10).toFixed(0)}px under a frame ending at ${bot.toFixed(0)}`;
            break;
          }
          // ...while a ball inside the frame still does.
          const inside = { x, y: (goalTop(side) + bot) / 2, r: BALL_R };
          if (goalScored(inside) === 0) {
            leaked = `phase ${goalPhase.toFixed(2)} side ${side}: missed a goal inside the frame`;
            break;
          }
        }
        if (leaked) break;
      }
      ok("no goal is scored beneath a raised frame", !leaked, leaked || "");
      ok("raised frames were actually exercised", checked > 100, `${checked} samples`);
    }

    // Above the bar must never score, at any position or goal size.
    {
      let bad = null;
      for (const sc of [GOAL_SIZE_SMALL, 1, GOAL_SIZE_BIG]) {
        goalScale = sc;
        for (let i = 0; i < 300; i++) {
          goalPhase = i * 0.021;
          for (const side of [0, 1]) {
            const x = side === 0 ? WALL - 2 : W - WALL + 2;
            const above = { x, y: goalTop(side) - BALL_R - 10, r: BALL_R };
            if (goalScored(above) !== 0) {
              bad = `scale ${sc} phase ${goalPhase.toFixed(2)}: scored above the bar`;
              break;
            }
          }
          if (bad) break;
        }
        if (bad) break;
      }
      goalScale = savedScale;
      ok("nothing scores above a moving bar at any size", !bad, bad || "");
    }

    // The WALL must be solid below a raised frame: a ball rolling along the
    // grass into a lifted goal has to be stopped, not escape under the net.
    {
      let escaped = null;
      for (let i = 0; i < 400; i++) {
        goalPhase = i * 0.031;
        if (goalBottom(0) >= GROUND_Y - 30) continue;    // need a real gap
        game.ball = { x: 200, y: GROUND_Y - BALL_R, vx: -900, vy: 0,
                      r: BALL_R, mass: BALL_MASS, bounces: 0 };
        for (let k = 0; k < 200; k++) {
          stepBall(DT);
          if (goalScored(game.ball) !== 0) break;        // a legitimate goal
          if (game.ball.x < WALL - GOAL_D - 20) {
            escaped = `rolled out at x=${game.ball.x.toFixed(0)} with the frame ending at ${goalBottom(0).toFixed(0)}`;
            break;
          }
        }
        if (escaped) break;
      }
      ok("the wall is solid under a raised frame", !escaped, escaped || "");
    }

    // The underside of a raised frame is a bar: a ball driven up into it from
    // below must be deflected rather than passing through.
    {
      goalPhase = 0;
      // Find a phase where the left frame is clear of the grass.
      let found = -1;
      for (let i = 0; i < 2000; i++) {
        goalPhase = i * 0.01;
        if (goalBottom(0) < GROUND_Y - 40) { found = goalPhase; break; }
      }
      ok("a raised-frame phase exists to test", found >= 0);
      if (found >= 0) {
        const bot = goalBottom(0);
        game.ball = { x: WALL + POST_R, y: bot + BALL_R + 26, vx: 0, vy: -700,
                      r: BALL_R, mass: BALL_MASS, bounces: 0 };
        let deflected = false;
        for (let k = 0; k < 40; k++) {
          const before = game.ball.vy;
          stepBall(DT);
          if (before < 0 && game.ball.vy > 0) { deflected = true; break; }
        }
        ok("the underside of a raised frame deflects the ball", deflected);
      }
    }

    game.chaos = savedChaosW;

    goalPhase = savedPhase;
    goalScale = savedScale;
    game.ball = savedBall;
    game.particles = [];
  }

  // 19x. Online play: intent packing, signalling codes, and snapshot fidelity.
  {
    const savedNet = { ...net };
    const saved = { players: game.players, ball: game.ball, scene: game.scene,
                    score: [...game.score], mode: game.mode, cpu: [...game.cpu] };

    // ---- intent packs into one byte, losslessly ----
    {
      let allOk = true, bad = "";
      for (let m = 0; m < 64; m++) {
        const a = unpackIntent(m, { });
        const round = packIntent(a);
        if (round !== m) { allOk = false; bad = `${m} -> ${round}`; break; }
      }
      ok("intent survives a pack/unpack round trip", allOk, bad);
      ok("intent fits in six bits", packIntent({ left: 1, right: 1, up: 1, down: 1,
                                                 kick: 1, kickEdge: 1 }) === 63);
      const empty = packIntent({ left: 0, right: 0, up: 0, down: 0, kick: 0, kickEdge: 0 });
      ok("idle intent is zero", empty === 0, `${empty}`);
      // Each flag must be independent.
      const only = unpackIntent(4, {});
      ok("flags decode independently",
         only.up && !only.left && !only.right && !only.down && !only.kick);
    }

    // ---- signalling codes round-trip ----
    {
      const payload = { t: "o", sdp: "v=0\\r\\no=- 12345 2 IN IP4 127.0.0.1\\r\\na=x:ü" };
      const code = encodeSignal(payload);
      ok("a signalling code is plain text", /^[A-Za-z0-9+/]+$/.test(code), code.slice(0, 24));
      const back = decodeSignal(code);
      ok("the code round-trips exactly", back.t === payload.t && back.sdp === payload.sdp);
      ok("padding-stripped codes still decode", !code.includes("="));
      let threw = false;
      try { decodeSignal("not a real code!!"); } catch (e) { threw = true; }
      ok("a malformed code is rejected, not silently accepted", threw);
    }

    // ---- a snapshot captures everything the guest must draw ----
    {
      game.mode = MODE.SINGLE;
      game.cpu = [false, false];
      game.sel = [2, 5];
      startMatch();
      game.scene = SCENE.PLAY;
      game.score = [2, 1];
      game.ball.x = 421.5; game.ball.y = 233.25;
      game.players[0].x = 300; game.players[1].x = 700;
      game.players[0].ammo = 2;
      game.players[1].stun = 0.4;
      spawnPowerup();
      spawnMine();
      spawnHelper(0, "keeper");
      game.bullets.push({ owner: 0, x: 500, y: 300, vx: BULLET_SPD, vy: 0,
                          r: BULLET_R, life: 1 });

      const snap = netSnapshot();
      ok("a snapshot carries the scene and score",
         snap.sc === SCENE.PLAY && snap.sr[0] === 2 && snap.sr[1] === 1);
      ok("a snapshot carries the ball", snap.b.length === 3 && snap.b[0] > 420);
      ok("a snapshot carries both players", snap.p.length === 2 && snap.p[0] && snap.p[1]);
      ok("a snapshot carries the teams",
         snap.p[0][7] === 2 && snap.p[1][7] === 5, `${snap.p[0][7]}/${snap.p[1][7]}`);
      ok("a snapshot carries goal motion", typeof snap.gp === "number" && typeof snap.gs === "number");
      ok("a snapshot carries the entities",
         snap.pu.length === 1 && snap.mn.length === 1 &&
         snap.hp.length === 1 && snap.bl.length === 1,
         `pu${snap.pu.length} mn${snap.mn.length} hp${snap.hp.length} bl${snap.bl.length}`);

      // A snapshot must be small enough to send 30x a second.
      const bytes = JSON.stringify(snap).length;
      ok("a snapshot is compact", bytes < 1200, `${bytes} bytes`);
      ok("a snapshot survives JSON", JSON.parse(JSON.stringify(snap)).sr[0] === 2);
    }

    // ---- the guest reconstructs the host's world from a snapshot ----
    {
      // Capture a host world...
      game.mode = MODE.SINGLE;
      game.sel = [1, 6];
      startMatch();
      game.scene = SCENE.PLAY;
      game.score = [3, 4];
      game.ball.x = 612.5; game.ball.y = 180;
      game.players[0].x = 250; game.players[0].y = 400; game.players[0].facing = 1;
      game.players[1].x = 810; game.players[1].y = 300; game.players[1].facing = -1;
      game.jetpack = 3.5;
      goalScale = 1.2;
      const snap = JSON.parse(JSON.stringify(netSnapshot()));

      // ...wipe it, then rebuild as a guest would.
      net.active = true; net.role = "guest"; net.localSeat = 1; net.remoteSeat = 0;
      game.score = [0, 0];
      game.ball.x = 0; game.ball.y = 0;
      game.players = [null, null];
      game.jetpack = 0;
      goalScale = 1;

      netApplySnapshot(snap);

      ok("the guest restores the score", game.score[0] === 3 && game.score[1] === 4);
      ok("the guest restores the ball",
         Math.abs(game.ball.x - 612.5) < 0.2 && Math.abs(game.ball.y - 180) < 0.2,
         `${game.ball.x},${game.ball.y}`);
      ok("the guest restores both players", !!game.players[0] && !!game.players[1]);
      ok("the guest restores player positions",
         Math.abs(game.players[0].x - 250) < 0.2 && Math.abs(game.players[1].x - 810) < 0.2,
         `${game.players[0].x} / ${game.players[1].x}`);
      ok("the guest restores the correct teams",
         game.players[0].team === TEAMS[1] && game.players[1].team === TEAMS[6]);
      ok("the guest restores facing",
         game.players[0].facing === 1 && game.players[1].facing === -1);
      ok("the guest restores world effects",
         Math.abs(game.jetpack - 3.5) < 0.2 && Math.abs(goalScale - 1.2) < 0.01,
         `jet ${game.jetpack} scale ${goalScale}`);

      // The guest must render without throwing.
      let drew = true;
      try { draw(); } catch (e) { drew = false; }
      ok("the guest can draw a received world", drew);
    }

    // ---- a guest runs NO physics ----
    {
      net.active = true; net.role = "guest"; net.localSeat = 1; net.remoteSeat = 0;
      game.scene = SCENE.PLAY;
      game.ball.x = 500; game.ball.y = 100;
      game.ball.vx = 400; game.ball.vy = 0;
      const x0 = game.ball.x, y0 = game.ball.y;
      for (let i = 0; i < 120; i++) step(DT);
      ok("a guest does not simulate the ball",
         game.ball.x === x0 && game.ball.y === y0,
         `moved to ${game.ball.x},${game.ball.y}`);
      ok("a guest does not score on its own", game.scene === SCENE.PLAY);
    }

    // ---- the host maps a remote input byte onto the remote seat ----
    {
      net.active = true; net.role = "host"; net.localSeat = 0; net.remoteSeat = 1;
      // Clear both seats, then deliver a "hold right + kick" byte.
      for (const a of intent) {
        a.left = a.right = a.up = a.down = a.kick = a.kickEdge = false;
      }
      netHandle({ t: "i", b: packIntent({ left: false, right: true, up: false,
                                          down: false, kick: true, kickEdge: true }) });
      ok("a remote byte fills the remote seat",
         intent[1].right && intent[1].kick && intent[1].kickEdge);
      ok("a remote byte does not touch the local seat",
         !intent[0].right && !intent[0].kick);

      // gatherIntent must LEAVE the remote seat alone, or the network input
      // would be overwritten by this machine's (idle) keyboard every substep.
      intent[1].right = true;
      gatherIntent(true);
      ok("gatherIntent preserves the remote seat's input", intent[1].right === true);
    }

    // ---- a full simulated two-machine exchange stays in agreement ----
    {
      /*
        Model both ends in one process: HOST simulates and emits snapshots, GUEST
        consumes them. The guest's reconstructed ball must track the host's.
      */
      net.active = true; net.role = "host"; net.localSeat = 0; net.remoteSeat = 1;
      game.mode = MODE.SINGLE;
      game.cpu = [false, false];
      game.sel = [0, 3];
      startMatch();
      game.scene = SCENE.PLAY;

      const hostBall = [];
      const wire = [];
      for (let i = 0; i < 900; i++) {
        // The "guest" holds right; the host applies it to seat 1.
        netHandle({ t: "i", b: packIntent({ left: false, right: true, up: false,
                                            down: false, kick: false, kickEdge: false }) });
        gatherIntent(i % 2 === 0);
        step(DT);
        if (i % 4 === 0) wire.push(JSON.parse(JSON.stringify(netSnapshot())));
        hostBall.push([game.ball.x, game.ball.y]);
      }
      ok("the host produced a stream of snapshots", wire.length > 100, `${wire.length}`);
      ok("the remote seat actually moved under network input",
         game.players[1].x !== W * 0.73,
         `x=${game.players[1].x.toFixed(0)}`);

      // Replay the wire into a guest and compare the final position.
      const lastHost = hostBall[hostBall.length - 1];
      net.role = "guest"; net.localSeat = 1; net.remoteSeat = 0;
      for (const s of wire) netApplySnapshot(s);
      const drift = Math.abs(game.ball.x - wire[wire.length - 1].b[0]);
      ok("the guest ends up where the host said", drift < 0.2, `${drift.toFixed(2)}px`);
      ok("no snapshot in the stream was malformed",
         wire.every((s) => s.p.length === 2 && s.b.length === 3));
    }

    // ---- teardown is clean ----
    {
      net.active = true;
      net.role = "host";
      net.offerText = "xyz";
      net.paste = "abc";
      netReset();
      ok("netReset clears the connection",
         !net.active && net.role === null && net.state === "idle" &&
         net.offerText === "" && net.paste === "");
      ok("after reset neither role is claimed", !netIsHost() && !netIsGuest());
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.particles = [];
    goalScale = 1;
  }

  // 19y. Player names: sanitising, persistence, labels.
  {
    const saved = { names: [...game.names], cpu: [...game.cpu], mode: game.mode,
                    seats: [...game.seats], remoteName: game.remoteName,
                    entrants: game.entrants };
    const savedNet = { ...net };

    ok("a plain name passes through", cleanName("SAM", "X") === "SAM");
    ok("names are trimmed", cleanName("  ANA  ", "X") === "ANA");
    ok("an empty name falls back", cleanName("", "FALLBACK") === "FALLBACK");
    ok("a whitespace-only name falls back", cleanName("   ", "FALLBACK") === "FALLBACK");
    ok("null and undefined fall back",
       cleanName(null, "F") === "F" && cleanName(undefined, "F") === "F");
    ok("names are length-capped",
       cleanName("ABCDEFGHIJKLMNOPQRSTUVWXYZ", "X").length === NAME_MAX,
       `${cleanName("ABCDEFGHIJKLMNOPQRSTUVWXYZ", "X").length}`);

    // Hostile input must not survive: this string arrives from the network.
    {
      /*
        NOTE: the closing tag below is deliberately split across a concatenation.
        An HTML parser scans for that literal character sequence without caring
        that it sits inside a JS string or a comment, so spelling it out in full
        anywhere in this file would end the script block early and dump the rest
        of the source onto the page as visible text.
      */
      const nasty = cleanName('<scr' + 'ipt>alert(1)<\/scr' + 'ipt>', "X");
      ok("markup is stripped from names", !/[<>/]/.test(nasty), nasty);
      const emoji = cleanName("A\\u{1F600}B", "X");
      ok("non-printable characters are stripped", /^[A-Za-z0-9 _.\\-]*$/.test(emoji), emoji);
      ok("a name of only junk falls back", cleanName("<<>>", "FB") === "FB");
      ok("allowed punctuation survives", cleanName("A_B-C.D", "X") === "A_B-C.D");
    }

    // Labels reflect who is in the seat.
    {
      game.mode = MODE.SINGLE;
      game.entrants = [];
      game.seats = [null, null];
      game.cpu = [false, false];
      net.active = false;
      game.names = ["ANA", "BEN"];
      ok("seat labels use the typed names",
         seatLabel(0) === "ANA" && seatLabel(1) === "BEN",
         `${seatLabel(0)} / ${seatLabel(1)}`);

      game.cpu = [false, true];
      ok("a CPU seat is labelled as the CPU", /CPU/.test(seatLabel(1)), seatLabel(1));

      game.cpu = [false, false];
      net.active = true; net.role = "host"; net.localSeat = 0; net.remoteSeat = 1;
      game.remoteName = "ZOE";
      ok("a remote seat shows the peer's name", seatLabel(1) === "ZOE", seatLabel(1));
      game.remoteName = "";
      ok("an unknown peer gets a placeholder", seatLabel(1) === "OPPONENT", seatLabel(1));
    }

    // A hostile name off the wire is cleaned on arrival.
    {
      net.active = true; net.role = "guest"; net.localSeat = 1; net.remoteSeat = 0;
      netHandle({ t: "hi", n: '<b>BAD</b>' });
      ok("a name from the network is sanitised",
         !/[<>/]/.test(game.remoteName), game.remoteName);
      netHandle({ t: "hi", n: "" });
      ok("an empty network name falls back", game.remoteName === "OPPONENT", game.remoteName);
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
  }

  // 19z. Online tournament: ownership, which tie is online, and control.
  {
    const saved = { mode: game.mode, entrants: game.entrants, seats: [...game.seats],
                    cpu: [...game.cpu], entrantCount: game.entrantCount,
                    scene: game.scene, rosterNames: [...(game.rosterNames || [])],
                    names: [...game.names] };
    const savedNet = { ...net };

    // Offline: every entrant belongs to the local machine.
    net.active = false;
    game.mode = MODE.TOURNAMENT;
    game.entrantCount = 4;
    game.rosterNames = ["A", "B", "C", "D"];
    startTournament();
    ok("offline entrants take their roster names",
       game.entrants.map((e) => e.name).join(",") === "A,B,C,D",
       game.entrants.map((e) => e.name).join(","));
    ok("offline nothing is an online tie", !tieIsOnline());

    // Online: seed 1 is the host, seed 2 the guest, the rest local.
    net.active = true; net.role = "host"; net.state = "live";
    net.localSeat = 0; net.remoteSeat = 1;
    game.entrantCount = 4;
    game.rosterNames = ["HOSTY", "GUESTY", "C", "D"];
    startTournament();
    ok("the host owns seed 1", game.entrants[0].owner === "host");
    ok("the guest owns seed 2", game.entrants[1].owner === "guest");
    ok("the rest belong to the host machine",
       game.entrants.slice(2).every((e) => e.owner === "host"));

    // A host-vs-guest pairing is the online tie; others are local.
    {
      game.seats = [0, 1];
      ok("host vs guest is an online tie", tieIsOnline());
      game.seats = [1, 0];
      ok("the reverse pairing is also online", tieIsOnline());
      game.seats = [0, 2];
      ok("host vs a local entrant is NOT online", !tieIsOnline());
      game.seats = [2, 3];
      ok("two local entrants are NOT online", !tieIsOnline());
    }

    // Control assignment: each machine drives its own entrant in an online tie.
    {
      game.seats = [0, 1];
      net.role = "host";
      applyTieControl();
      ok("the host drives seat 0 in its own tie", net.localSeat === 0 && net.remoteSeat === 1);
      ok("the host is not spectating its own tie", net.spectating === false);

      net.role = "guest";
      applyTieControl();
      ok("the guest drives its own seat", net.localSeat === 1 && net.remoteSeat === 0,
         `local ${net.localSeat} remote ${net.remoteSeat}`);
      ok("the guest is not spectating its own tie", net.spectating === false);

      // A local tie: the guest watches, and receives nothing to drive.
      game.seats = [2, 3];
      net.role = "guest";
      applyTieControl();
      ok("the guest spectates a local tie", net.spectating === true);
      ok("a spectator has no remote seat to fill", net.remoteSeat === -1);

      net.role = "host";
      applyTieControl();
      ok("the host never spectates", net.spectating === false);
    }

    // gatherIntent must not be confused by remoteSeat = -1.
    {
      net.role = "guest"; net.remoteSeat = -1; net.localSeat = 0;
      for (const a of intent) {
        a.left = a.right = a.up = a.down = a.kick = a.kickEdge = false;
      }
      let threw = false;
      try { gatherIntent(true); } catch (e) { threw = true; }
      ok("gatherIntent survives a spectator with no remote seat", !threw);
    }

    // The bracket message round-trips to a guest.
    {
      net.active = true; net.role = "host";
      game.entrantCount = 4;
      game.rosterNames = ["HOSTY", "GUESTY", "CEE", "DEE"];
      startTournament();
      game.seats = [0, 1];
      const sent = [];
      const realSend = net.chan;
      net.chan = { readyState: "open", send: (d) => sent.push(JSON.parse(d)) };
      netSendBracket();
      net.chan = realSend;
      ok("the host emits a bracket message", sent.length === 1 && sent[0].t === "br");

      // Wipe, then adopt it as the guest.
      const msg = sent[0];
      net.role = "guest";
      game.entrants = [];
      game.roundPairs = [];
      netHandle(msg);
      ok("the guest rebuilds the entrant list", game.entrants.length === 4);
      ok("the guest gets the names",
         game.entrants.map((e) => e.name).join(",") === "HOSTY,GUESTY,CEE,DEE",
         game.entrants.map((e) => e.name).join(","));
      ok("the guest gets the ownership",
         game.entrants[0].owner === "host" && game.entrants[1].owner === "guest");
      ok("the guest gets the pairings", game.roundPairs.length === 2);
      ok("the guest can tell which tie is online",
         (() => { game.seats = [0, 1]; return tieIsOnline(); })());
    }

    // A full online bracket must still crown exactly one champion.
    {
      net.active = true; net.role = "host"; net.localSeat = 0; net.remoteSeat = 1;
      net.chan = null;                     // sends become no-ops
      for (const n of [2, 4, 5, 8]) {
        game.mode = MODE.TOURNAMENT;
        game.entrantCount = n;
        game.rosterNames = Array.from({ length: n }, (_, i) => `P${i + 1}`);
        game.goalsToWin = 3;
        game.timeIdx = 0;
        startTournament();

        let ties = 0, guard = 0, bad = null;
        while (game.scene !== SCENE.CHAMPION && guard++ < 200) {
          if (game.scene === SCENE.BRACKET) {
            if (aliveEntrants().length <= 1) beginRound(); else nextTie();
            continue;
          }
          if (game.scene === SCENE.SELECT) {
            startMatch();
            const w = game.seats[0] < game.seats[1] ? 0 : 1;
            game.score = w === 0 ? [3, 0] : [0, 3];
            finishMatch(w, false);
            ties++;
            game.scene = SCENE.BRACKET;
            continue;
          }
          bad = `stuck in ${game.scene}`;
          break;
        }
        ok(`an online ${n}-player bracket crowns one champion`,
           !bad && game.scene === SCENE.CHAMPION && aliveEntrants().length === 1,
           bad || `scene=${game.scene} alive=${aliveEntrants().length}`);
        ok(`an online ${n}-player bracket plays ${tiesRemaining(n)} ties`,
           ties === tiesRemaining(n), `${ties}`);
      }
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.particles = [];
  }

  // 19aa. Pause overlay and settings.
  {
    const saved = { scene: game.scene, players: game.players, ball: game.ball,
                    score: [...game.score], mode: game.mode, cpu: [...game.cpu],
                    pauseFrom: game.pauseFrom, pauseRow: game.pauseRow,
                    settingsFrom: game.settingsFrom, opt: { ...game.opt } };
    const savedNet = { ...net };
    net.active = false;

    // Menu-style helper: press one key for a whole frame.
    const tapIn = (code, fn) => {
      pressed[code] = true;
      edgeFrame = true;
      fn(DT);
      for (const k in pressed) delete pressed[k];
      edgeFrame = true;
    };

    game.mode = MODE.SINGLE;
    game.cpu = [false, false];
    game.sel = [0, 3];
    startMatch();
    game.scene = SCENE.PLAY;

    // ---- opening and resuming ----
    ok("PLAY is pausable", PAUSABLE.has(SCENE.PLAY));
    ok("the countdown is pausable", PAUSABLE.has(SCENE.COUNTDOWN));
    ok("the menu is NOT pausable", !PAUSABLE.has(SCENE.MENU));
    ok("the bracket is NOT pausable", !PAUSABLE.has(SCENE.BRACKET));

    openPause();
    ok("pause opens the overlay", game.scene === SCENE.PAUSE);
    ok("pause remembers what it interrupted", game.pauseFrom === SCENE.PLAY);
    ok("pause starts on RESUME", PAUSE_ITEMS[game.pauseRow] === "resume");

    // Held input must be dropped, or a key held while pausing keeps steering.
    ok("pausing clears held intent",
       intent.every((a) => !a.left && !a.right && !a.up && !a.down && !a.kick));

    closePause();
    ok("resume returns to the interrupted scene", game.scene === SCENE.PLAY);
    ok("resume clears the remembered scene", game.pauseFrom === null);

    // A pause from mid-celebration must resume there, not into PLAY.
    game.scene = SCENE.CELEBRATE;
    openPause();
    closePause();
    ok("resume restores CELEBRATE, not PLAY", game.scene === SCENE.CELEBRATE);
    game.scene = SCENE.PLAY;

    // ---- the world must not advance while paused ----
    {
      game.scene = SCENE.PLAY;
      game.ball.x = 400; game.ball.y = 200; game.ball.vx = 300; game.ball.vy = 0;
      openPause();
      const bx = game.ball.x, by = game.ball.y;
      const px = game.players[0].x;
      for (let i = 0; i < 240; i++) step(DT);
      ok("the ball does not move while paused",
         game.ball.x === bx && game.ball.y === by,
         `moved to ${game.ball.x.toFixed(1)},${game.ball.y.toFixed(1)}`);
      ok("players do not move while paused", game.players[0].x === px);
      ok("the clock does not run while paused", game.scene === SCENE.PAUSE);
      closePause();
    }

    // ---- ESC opens pause from live play, via the real key path ----
    {
      game.scene = SCENE.PLAY;
      game.pauseFrom = null;
      tapIn("Escape", step);
      ok("ESC opens the pause overlay", game.scene === SCENE.PAUSE, game.scene);
      // ...and ESC again closes it.
      tapIn("Escape", step);
      ok("ESC again resumes", game.scene === SCENE.PLAY, game.scene);
    }

    // ---- navigating the pause list ----
    {
      game.scene = SCENE.PLAY;
      openPause();
      const seen = [];
      for (let i = 0; i < PAUSE_ITEMS.length; i++) {
        seen.push(PAUSE_ITEMS[game.pauseRow]);
        tapIn(SCHEME[0].down, updatePause);
      }
      ok("every pause item is reachable",
         seen.length === PAUSE_ITEMS.length && new Set(seen).size === PAUSE_ITEMS.length,
         seen.join(","));
      ok("the pause list wraps around", PAUSE_ITEMS[game.pauseRow] === "resume");

      // Up from the top wraps to the bottom.
      tapIn(SCHEME[0].up, updatePause);
      ok("up wraps to the last item",
         PAUSE_ITEMS[game.pauseRow] === PAUSE_ITEMS[PAUSE_ITEMS.length - 1]);
    }

    // ---- each pause action does what it says ----
    {
      // SETTINGS.
      game.scene = SCENE.PLAY;
      openPause();
      game.pauseRow = PAUSE_ITEMS.indexOf("settings");
      tapIn("Enter", updatePause);
      ok("SETTINGS opens the settings screen", game.scene === SCENE.SETTINGS);
      ok("settings remembers it came from pause", game.settingsFrom === SCENE.PAUSE);
      tapIn("Escape", updateSettings);
      ok("leaving settings returns to pause", game.scene === SCENE.PAUSE);

      // RESTART: same rules, zeroed score, back into a countdown.
      game.score = [3, 2];
      game.pauseRow = PAUSE_ITEMS.indexOf("restart");
      tapIn("Enter", updatePause);
      ok("RESTART zeroes the score",
         game.score[0] === 0 && game.score[1] === 0, `${game.score}`);
      ok("RESTART begins a fresh countdown", game.scene === SCENE.COUNTDOWN, game.scene);
      ok("RESTART clears the pause memory", game.pauseFrom === null);

      // QUIT.
      game.scene = SCENE.PLAY;
      openPause();
      game.pauseRow = PAUSE_ITEMS.indexOf("quit");
      tapIn("Enter", updatePause);
      ok("QUIT returns to the setup menu", game.scene === SCENE.MENU, game.scene);
    }

    // ---- quitting an online match drops the connection ----
    {
      net.active = true;
      net.role = "host";
      net.state = "live";
      game.scene = SCENE.PLAY;
      openPause();
      game.pauseRow = PAUSE_ITEMS.indexOf("quit");
      tapIn("Enter", updatePause);
      ok("quitting online tears the link down", !net.active && net.state === "idle");
      ok("quitting online still reaches the menu", game.scene === SCENE.MENU);
      net.active = false;
    }

    // ---- settings toggles take effect and are readable ----
    {
      game.settingsFrom = SCENE.MENU;
      game.scene = SCENE.SETTINGS;
      for (const [row, key] of [["shake", "shake"], ["particles", "particles"],
                                ["flash", "flash"], ["sfxhint", "hints"]]) {
        game.settingsRow = SETTINGS_ITEMS.indexOf(row);
        const before = game.opt[key];
        tapIn(SCHEME[0].right, updateSettings);
        ok(`the ${row} setting toggles`, game.opt[key] === !before,
           `${before} -> ${game.opt[key]}`);
        tapIn(SCHEME[0].right, updateSettings);
        ok(`the ${row} setting toggles back`, game.opt[key] === before);
      }
      game.settingsRow = SETTINGS_ITEMS.indexOf("back");
      tapIn("Enter", updateSettings);
      ok("BACK from the menu path returns to the menu", game.scene === SCENE.MENU);
    }

    // ---- the effect gates actually honour the options ----
    {
      // Particles are suppressed at the source.
      game.particles = [];
      game.opt.particles = false;
      burst(500, 300, "#ffffff", 20);
      ok("particles off produces no particles", game.particles.length === 0,
         `${game.particles.length}`);
      game.opt.particles = true;
      burst(500, 300, "#ffffff", 20);
      ok("particles on produces particles", game.particles.length > 0);
      game.particles = [];

      // Shake and flash are gated at render time, so drawing with them off
      // must not throw and must not translate the canvas.
      game.opt.shake = false;
      game.opt.flash = false;
      game.shake = 1;
      game.flash = 1;
      game.scene = SCENE.PLAY;
      let drew = true;
      try { draw(); } catch (e) { drew = false; }
      ok("drawing with shake and flash off works", drew);
      game.opt.shake = true;
      game.opt.flash = true;
      try { draw(); } catch (e) { drew = false; }
      ok("drawing with shake and flash on works", drew);
      game.shake = 0;
      game.flash = 0;
    }

    // ---- options survive a save/load round trip ----
    {
      const target = { shake: false, particles: true, flash: false, hints: false };
      saveOpts(target);
      const loaded = loadOpts({ shake: true, particles: false, flash: true, hints: true });
      // In an environment with working storage this round-trips; where storage
      // is blocked, loadOpts must return the defaults rather than throwing.
      ok("options round-trip or fall back safely",
         typeof loaded.shake === "boolean" && typeof loaded.hints === "boolean",
         JSON.stringify(loaded));
      ok("a corrupt option value is ignored",
         typeof loadOpts({ shake: true }).shake === "boolean");
    }

    // ---- both new screens render in every configuration ----
    {
      let drew = true, err = "";
      for (const from of [SCENE.MENU, SCENE.PAUSE]) {
        game.settingsFrom = from;
        for (let r = 0; r < SETTINGS_ITEMS.length; r++) {
          game.settingsRow = r;
          try { drawSettings(); } catch (e) { drew = false; err = e.message; }
        }
      }
      ok("the settings screen renders from both entry points", drew, err);

      drew = true;
      for (const online of [false, true]) {
        net.active = online;
        for (const md of [MODE.SINGLE, MODE.VOLLEY, MODE.TOURNAMENT]) {
          game.mode = md;
          for (let r = 0; r < PAUSE_ITEMS.length; r++) {
            game.pauseRow = r;
            game.pauseFrom = SCENE.PLAY;
            try { drawPause(); } catch (e) { drew = false; err = e.message; }
          }
        }
      }
      net.active = false;
      ok("the pause screen renders in every mode, on and offline", drew, err);
    }

    Object.assign(net, savedNet);
    Object.assign(game, saved);
    game.opt = saved.opt;
    game.particles = [];
  }

  // 19ab. Menu layout must FIT ON SCREEN.
  //       Regression: the menu grew to 10 rows at a fixed pitch, pushing
  //       ONLINE, SETTINGS and START past the bottom of the canvas. Every
  //       drawMenu test passed because none of them checked geometry.
  {
    const saved = { mode: game.mode, cpu: [...game.cpu], menuRow: game.menuRow };
    let worst = null, missing = null, checked = 0;

    /*
      Actually RENDER the menu and inspect where the rows landed. An earlier
      version of this test re-derived the layout arithmetic, so it passed even
      with the bug present — it was only ever checking its own copy.
    */
    for (const md of MODE_ORDER) {
      for (const cpu of [false, true]) {
        for (const online of [false, true]) {
          game.mode = md;
          game.cpu = [false, cpu];
          const wasActive = net.active;
          net.active = online;
          game.menuRow = 0;
          layoutProbe.menu = null;
          // Capture the expected rows under the SAME conditions drawMenu sees,
          // before restoring net.active — otherwise the expectation is stale.
          const wantRows = menuRows();
          drawMenu();
          net.active = wasActive;

          const p = layoutProbe.menu;
          if (!p) { missing = `${md}: drawMenu recorded no geometry`; continue; }
          checked++;

          for (const key of wantRows) {
            const row = p.labels.find((l) => l.key === key);
            if (!row) { missing = `${md} cpu=${cpu}: row "${key}" was never drawn`; break; }
            if (row.bottom > H) {
              worst = `${md} cpu=${cpu}: row "${key}" ends at ${row.bottom.toFixed(0)} > ${H}`;
