/* ---- dash and superpowers ------------------------------------------------

   Both are shared by the 2D modes and the 3D arena. The charge bookkeeping and
   the power table live here, once, so the two simulations cannot drift on what a
   superpower means — only on how it is applied.
*/

/**
 * Which superpower a team carries.
 *
 * Looked up by roster position, so TEAM_SUPER reads as a table beside TEAMS. An
 * unknown team (a test fixture, say) falls back to the first power rather than
 * leaving a player with no ability at all.
 */
function superForTeam(team) {
  const i = TEAMS.indexOf(team);
  return (i >= 0 && TEAM_SUPER[i]) || TEAM_SUPER[0];
}

/** The power definition for a fighter or player, or null if it has none. */
function superDef(who) {
  return who && who.superId ? SUPERS[who.superId] || null : null;
}

/**
 * Add charge to a player or fighter, capped at full.
 *
 * Everything that charges the meter routes through here so the cap and the
 * "already firing" rule are enforced in one place: charge gained mid-power would
 * let a long ability roll straight into the next one.
 */
function superGain(who, amount) {
  if (!who || !game.rules.supers) return;
  if (who.superT > 0) return;
  who.superCharge = clamp(who.superCharge + amount, 0, SUPER_MAX);
}

/** Is this player's power charged and ready to fire? */
const superReady = (who) =>
  !!who && !!game.rules.supers && who.superT <= 0 && who.superCharge >= SUPER_MAX;

/** Fraction of the meter filled, for the HUD. */
const superFrac = (who) => (who ? clamp(who.superCharge / SUPER_MAX, 0, 1) : 0);

/**
 * Spend a full meter and start the power.
 *
 * Instantaneous powers (`dur === 0`) do their work here and leave `superT` at
 * zero; timed powers set `superT` and are finished by endSuper. Splitting it that
 * way means tickSuper only ever has to handle powers that are actually running.
 */
function fireSuper(pl) {
  const def = superDef(pl);
  if (!def) return false;
  pl.superCharge = 0;
  pl.superT = def.dur;
  game.superFx = { seat: pl.index, id: pl.superId, t: 1.1 };
  game.shake = Math.max(game.shake, 0.3);
  burst(pl.x, pl.y, def.color, 40);

  const b = game.ball;
  const foe = game.players[1 - pl.index];

  switch (pl.superId) {
    case "quake": {
      /*
        A ground slam. Only meaningful from the air, so it drives the player down
        first if they are not already grounded — otherwise the power would be
        wasted by pressing it at the wrong moment.
      */
      if (!pl.onGround) { pl.vy = Math.max(pl.vy, 1500); pl.quakePending = true; break; }
      quakeSlam(pl);
      break;
    }
    case "blink": {
      // Teleport to the ball, landing just short of it so the arrival does not
      // count as a kick the player never made.
      if (b) {
        const side = b.x < pl.x ? 1 : -1;
        pl.x = clamp(b.x + side * (pl.r + b.r + 2), WALL + pl.r, W - WALL - pl.r);
        pl.y = clamp(b.y, pl.r, GROUND_Y - pl.r);
        pl.vx = 0;
        pl.vy = 0;
        burst(pl.x, pl.y, SUPERS.blink.color, 26);
      }
      break;
    }
    case "volley": {
      // A fan of shots at once, regardless of ammo: the power IS the ammo.
      const n = 5;
      for (let i = 0; i < n; i++) {
        const spread = (i - (n - 1) / 2) * 0.16;
        game.bullets.push({
          x: pl.x + pl.facing * (pl.r + 6),
          y: pl.y - 4,
          vx: pl.facing * BULLET_SPD * Math.cos(spread),
          vy: BULLET_SPD * Math.sin(spread) * 0.5,
          r: BULLET_R, life: BULLET_LIFE, owner: pl.index,
        });
      }
      break;
    }
    case "freeze": {
      // Stun the opponent where they stand. Their gravity still applies, so they
      // fall rather than hanging in the air — the same rule a mine stun uses.
      if (foe) {
        foe.stun = Math.max(foe.stun, SUPERS.freeze.dur);
        burst(foe.x, foe.y, SUPERS.freeze.color, 30);
      }
      break;
    }
    case "sentinel":
      // Both helpers at once, which is the defensive team's whole identity.
      spawnHelper(pl.index, "keeper");
      spawnHelper(pl.index, "striker");
      break;
    case "bulwark":
      // Doubling size has to go through applySize, which owns `r` and massNow.
      pl.applySize();
      break;
    default:
      break;
  }
  return true;
}

/** A quake's actual effect: launch the ball, stun a grounded opponent. */
function quakeSlam(pl) {
  const b = game.ball;
  game.shake = Math.max(game.shake, 0.6);
  burst(pl.x, GROUND_Y - 6, SUPERS.quake.color, 44);
  if (b) {
    // Everything within reach is thrown up and away from the impact.
    const d = Math.abs(b.x - pl.x);
    if (d < 300) {
      const k = 1 - d / 300;
      b.vy = Math.min(b.vy, -720 * k);
      b.vx += Math.sign(b.x - pl.x || 1) * 420 * k;
      limitSpeed(b, BALL_MAX_V);
    }
  }
  const foe = game.players[1 - pl.index];
  // Only a GROUNDED opponent feels a ground slam, which makes jumping the
  // counter-play rather than leaving the power unanswerable.
  if (foe && foe.onGround && Math.abs(foe.x - pl.x) < 320) {
    foe.stun = Math.max(foe.stun, 0.85);
    foe.vy = -420;
    foe.vx += Math.sign(foe.x - pl.x || 1) * 300;
  }
}

/**
 * Clean up when a timed power expires.
 *
 * Deliberately does NOT clear game.superFx: the banner runs on its own short
 * timer, and a six-second power would otherwise keep its announcement on screen
 * for the whole duration.
 */
function endSuper(pl) {
  // Size is owned by applySize, so a power that changed it must hand it back.
  if (pl.superId === "bulwark") pl.applySize();
}

/**
 * Per-substep work for a power that is currently running.
 *
 * Only the continuous powers need anything here; the rest did their work at
 * fire time. Kept in one switch so what each power does over time is readable
 * in a single place.
 */
function tickSuper(pl, dt) {
  if (pl.superT <= 0) return;
  const b = game.ball;

  switch (pl.superId) {
    case "titan": {
      // Draw the ball toward the player, strongest when close.
      if (!b) break;
      const dx = pl.x - b.x, dy = pl.y - b.y;
      const d = Math.max(1, Math.hypot(dx, dy));
      if (d < 420) {
        const k = (1 - d / 420) * 1400 * dt;
        b.vx += (dx / d) * k;
        b.vy += (dy / d) * k;
        limitSpeed(b, BALL_MAX_V);
      }
      break;
    }
    case "livewire": {
      /*
        The ball sticks: held just ahead of the player, moving with them, until
        the power ends or they kick. Velocity is written rather than nudged, so
        it cannot drift away over several substeps.
      */
      if (!b) break;
      const tx = pl.x + pl.facing * (pl.r + b.r + 4);
      const ty = pl.y - 2;
      b.x += (tx - b.x) * clamp(dt * 14, 0, 1);
      b.y += (ty - b.y) * clamp(dt * 14, 0, 1);
      b.vx = pl.vx;
      b.vy = pl.vy;
      break;
    }
    case "venom": {
      // Curve the ball toward the opponent's goal once it is moving away.
      if (!b) break;
      const goalX = pl.index === 0 ? W - GOAL_D : GOAL_D;
      const goalY = goalTop(pl.index === 0 ? 1 : 0) + goalHeight() / 2;
      const movingRight = pl.index === 0 ? b.vx > 60 : b.vx < -60;
      if (movingRight) {
        const dy = goalY - b.y;
        b.vy += clamp(dy, -260, 260) * dt * 2.4;
        b.vx += Math.sign(goalX - b.x || 1) * 120 * dt;
        limitSpeed(b, BALL_MAX_V);
      }
      break;
    }
    case "cannon": {
      // A guided missile: while the power runs, the ball homes after a kick.
      if (!b) break;
      if (game.ballLastTouch === pl.index && Math.hypot(b.vx, b.vy) > 200) {
        const goalX = pl.index === 0 ? W - GOAL_D / 2 : GOAL_D / 2;
        const goalY = goalTop(pl.index === 0 ? 1 : 0) + goalHeight() / 2;
        const dx = goalX - b.x, dy = goalY - b.y;
        const d = Math.max(1, Math.hypot(dx, dy));
        b.vx += (dx / d) * 900 * dt;
        b.vy += (dy / d) * 900 * dt;
        limitSpeed(b, BALL_MAX_V);
      }
      break;
    }
    default:
      break;
  }
}

/**
 * Multipliers a running power applies to a player's stats.
 *
 * Read by applySize and the kick maths rather than mutating the player, so a
 * power can never leave a permanent change behind if it ends unexpectedly.
 */
function superSizeMul(pl) {
  if (!pl || pl.superT <= 0) return 1;
  if (pl.superId === "bulwark") return 2;
  return 1;
}
function superKickMul(pl) {
  if (!pl || pl.superT <= 0) return 1;
  if (pl.superId === "rocket") return 1.85;
  if (pl.superId === "cannon") return 1.5;
  if (pl.superId === "venom") return 1.3;
  return 1;
}
function superSpeedMul(pl) {
  if (!pl || pl.superT <= 0) return 1;
  if (pl.superId === "rocket") return 1.5;
  if (pl.superId === "panther") return 1.55;
  if (pl.superId === "charge") return 1.4;
  return 1;
}
/** Is this player immovable — unshoveable and unstunnable — right now? */
function superImmovable(pl) {
  return !!pl && pl.superT > 0 &&
         (pl.superId === "bulwark" || pl.superId === "charge");
}

/* --------------------------------------------------------------- 6. INPUT */

const keys = Object.create(null);
const pressed = Object.create(null);   // edge-triggered, cleared each frame

/*
  Keys the game consumes, so the browser does not also act on them (scrolling on
  arrows, for instance). Rebuilt whenever the bindings change, since a remapped
  key must be swallowed too.
*/
const WATCHED = new Set();
/*
  Keys the UI reads directly, outside the two players' rebindable schemes.
  KeyR is here for the tournament bracket's draw re-roll ONLY: it is deliberately
  not handled in PLAY, COUNTDOWN or CELEBRATE, so it can never restart a live
  match the way the old R hotkey did.
*/
const UI_KEYS = ["Enter", "Space", "Escape", "KeyH", "KeyJ", "KeyL", "KeyR", "Numpad0",
                 "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"];

function rebuildWatched() {
  WATCHED.clear();
  for (const k of UI_KEYS) WATCHED.add(k);
  for (const seat of SCHEME) {
    for (const a of ACTIONS) if (seat[a.key]) WATCHED.add(seat[a.key]);
  }
}
// Called at boot, once SCHEME and ACTIONS exist — not here, where they are
// still in their temporal dead zone.

addEventListener("keydown", (e) => {
  /*
    Name entry swallows the keyboard: while a field is active, letters type into
    it rather than steering the menu. Without this, typing "SAM" would be read
    as movement keys.
  */
  /*
    Rebinding swallows the very next key press. Handled first, and before
    preventDefault on WATCHED, so any key can be captured — including one that
    is not currently bound to anything.
  */
  if (game.ctrlBinding) {
    const { seat, action } = game.ctrlBinding;
    if (e.key === "Escape") {
      game.ctrlBinding = null;                 // cancelled
    } else if (!RESERVED_KEYS.has(e.code)) {
      // Clear this code from any other action on the SAME seat, so a key is
      // never bound twice for one player.
      for (const a of ACTIONS) {
        if (a.key !== action && SCHEME[seat][a.key] === e.code) SCHEME[seat][a.key] = "";
      }
      SCHEME[seat][action] = e.code;
      saveScheme();
      rebuildWatched();
      game.ctrlBinding = null;
    }
    e.preventDefault();
    return;
  }

  // Roster entry (tournament) uses the same swallow-the-keyboard rule.
  if (game.rosterEdit >= 0) {
    const i = game.rosterEdit;
    if (e.key === "Enter" || e.key === "Escape") {
      game.rosterNames[i] = cleanName(game.rosterNames[i], `PLAYER ${i + 1}`);
      game.rosterEdit = -1;
    } else if (e.key === "Backspace") {
      game.rosterNames[i] = game.rosterNames[i].slice(0, -1);
    } else if (e.key.length === 1 && NAME_OK.test(e.key) &&
               game.rosterNames[i].length < NAME_MAX) {
      game.rosterNames[i] += e.key.toUpperCase();
    }
    e.preventDefault();
    return;
  }

  /*
    RELAY TEXT ENTRY. The online screen lets you type a host address and a room
    code, which needs the keyboard for characters an address contains — dots,
    colons, slashes, dashes — rather than the letters-only name filter below.
    Handled first, and it swallows the keyboard while active so typing "1.2.3.4"
    is not also read as menu navigation.
  */
  if (net.editing) {
    const field = net.editing;                 // "addr" | "code"
    const cur = field === "addr" ? net.relayAddr : net.relayCode;
    if (e.key === "Enter") {
      net.editing = null;
      net.relayGo = field;                     // consumed by updateOnline
    } else if (e.key === "Escape") {
      net.editing = null;
    } else if (e.key === "Tab") {
      // Tab moves between the two fields, as it would in any form.
      net.editing = field === "addr" ? "code" : "addr";
    } else if (e.key === "Backspace") {
      const next = cur.slice(0, -1);
      if (field === "addr") net.relayAddr = next; else net.relayCode = next;
    } else if (e.key.length === 1 && cur.length < 120) {
      // A code is four letters; an address may contain URL punctuation.
      const ok2 = field === "code" ? /^[A-Za-z0-9]$/.test(e.key)
                                   : /^[\w.:/\-[\]@]$/.test(e.key);
      if (ok2) {
        const ch = field === "code" ? e.key.toUpperCase() : e.key;
        if (field === "addr") net.relayAddr += ch;
        else if (net.relayCode.length < 4) net.relayCode += ch;
      }
    }
    e.preventDefault();
    return;
  }

  if (game.editing >= 0) {
    const i = game.editing;
    if (e.key === "Enter" || e.key === "Escape") {
      game.names[i] = cleanName(game.names[i], DEFAULT_NAMES[i]);
      saveNames(game.names);
      game.editing = -1;
      netSendHello();
    } else if (e.key === "Backspace") {
      game.names[i] = game.names[i].slice(0, -1);
    } else if (e.key.length === 1 && NAME_OK.test(e.key) &&
               game.names[i].length < NAME_MAX) {
      game.names[i] += e.key.toUpperCase();
    }
    e.preventDefault();
    return;
  }

  if (WATCHED.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
}, { passive: false });

addEventListener("keyup", (e) => {
  if (WATCHED.has(e.code)) e.preventDefault();
  keys[e.code] = false;
}, { passive: false });

addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

/*
  Browsers refuse to start an AudioContext until the user has interacted with the
  page, so the first key press or click is what actually gets the music going.
*/
const kickAudio = () => {
  if (game.opt.music) musicPlay(musicTrackForScene());
};
addEventListener("keydown", kickAudio);
addEventListener("pointerdown", kickAudio);

/*
  The connection codes are far too long to type, so the online screen leans on
  the real clipboard: Cmd/Ctrl-V pastes the peer's code, Cmd/Ctrl-C copies your
  own. Both are ignored outside that screen.
*/
addEventListener("paste", (e) => {
  if (game.scene !== SCENE.ONLINE) return;
  const txt = (e.clipboardData && e.clipboardData.getData("text")) || "";
  if (txt) { net.paste = txt.trim(); net.error = ""; }
  e.preventDefault();
});

addEventListener("copy", (e) => {
  if (game.scene !== SCENE.ONLINE) return;
  const mine = net.role === "host" ? net.offerText : net.answerText;
  if (mine && e.clipboardData) {
    e.clipboardData.setData("text/plain", mine);
    net.copied = true;
    e.preventDefault();
  }
});

/*
  CONTROLS

  SCHEME is mutable so the bindings can be remapped, and the defaults are kept
  separately so RESET always works. Every action the game reads goes through
  `intent`, so a rebind or a gamepad needs no changes anywhere in the physics.
*/
const SCHEME_DEFAULTS = [
  { left: "KeyA", right: "KeyD", up: "KeyW", down: "KeyS", kick: "KeyF", wall: "KeyG",
    /*
      The 3D arena's aim keys. Blank for P1, who aims with the mouse — the
      CONTROLS screen already renders an unbound action as an empty keycap, so a
      player who prefers keys can simply bind them.
    */
    aimUp: "", aimDown: "", aimLeft: "", aimRight: "",
    dash: "ShiftLeft", super: "KeyQ", grab: "KeyE" },
  { left: "ArrowLeft", right: "ArrowRight", up: "ArrowUp", down: "ArrowDown",
    kick: "Enter", wall: "ShiftRight",
    // P2 has no mouse, so aim gets a key cluster beside the arrow keys.
    aimUp: "KeyI", aimDown: "KeyK", aimLeft: "KeyJ", aimRight: "KeyL",
    dash: "ControlRight", super: "Slash", grab: "Period" },
];
const SCHEME = SCHEME_DEFAULTS.map((s) => ({ ...s }));

// The actions a player can rebind, in the order they are listed on screen.
const ACTIONS = [
  { key: "left",  label: "MOVE LEFT" },
  { key: "right", label: "MOVE RIGHT" },
  { key: "up",    label: "JUMP" },
  { key: "down",  label: "FAST FALL" },
  { key: "kick",  label: "KICK / FIRE" },
  { key: "wall",  label: "BUILD WALL / JUMP" },
  // Dash and superpower work in every mode, so they sit with the 2D bindings.
  { key: "dash",  label: "DASH" },
  { key: "super", label: "SUPERPOWER" },
  { key: "grab",  label: "3D GRAB / THROW" },
  /*
    3D-only actions. They sit at the end so the bindings players already know
    keep their row order, and they are labelled "3D" so nobody hunts for their
    effect in a soccer match.
  */
  { key: "aimUp",    label: "3D AIM UP" },
  { key: "aimDown",  label: "3D AIM DOWN" },
  { key: "aimLeft",  label: "3D AIM LEFT" },
  { key: "aimRight", label: "3D AIM RIGHT" },
];

/** A readable name for a KeyboardEvent.code. */
function keyLabel(code) {
  if (!code) return "—";
  if (code.startsWith("Key")) return code.slice(3);
  if (code.startsWith("Digit")) return code.slice(5);
  if (code.startsWith("Numpad")) return "NUM " + code.slice(6);
  if (code.startsWith("Arrow")) return code.slice(5).toUpperCase();
  const named = {
    Space: "SPACE", Enter: "ENTER", ShiftLeft: "L-SHIFT", ShiftRight: "R-SHIFT",
    ControlLeft: "L-CTRL", ControlRight: "R-CTRL", AltLeft: "L-ALT", AltRight: "R-ALT",
    Tab: "TAB", Backslash: "\\", Slash: "/", Comma: ",", Period: ".",
    Semicolon: ";", Quote: "'", BracketLeft: "[", BracketRight: "]",
    Minus: "-", Equal: "=", Backquote: "`",
  };
  return named[code] || code.toUpperCase();
}

/** Keys the game must never let a player bind, to avoid trapping them. */
const RESERVED_KEYS = new Set(["Escape", "F5", "F11", "F12", "Tab"]);

function loadScheme() {
  try {
    const raw = localStorage.getItem("headgame.controls");
    if (!raw) return;
    const arr = JSON.parse(raw);
    for (let i = 0; i < 2; i++) {
      if (!arr || !arr[i]) continue;
      for (const a of ACTIONS) {
        const code = arr[i][a.key];
        if (typeof code === "string" && code && !RESERVED_KEYS.has(code)) {
          SCHEME[i][a.key] = code;
        }
      }
    }
    rebuildWatched();
  } catch (e) {
    // Corrupt or blocked storage: the defaults stand.
  }
}

function saveScheme() {
  try { localStorage.setItem("headgame.controls", JSON.stringify(SCHEME)); }
  catch (e) { /* not fatal */ }
}

function resetScheme() {
  for (let i = 0; i < 2; i++) Object.assign(SCHEME[i], SCHEME_DEFAULTS[i]);
  saveScheme();
  rebuildWatched();
}

/*
  GAMEPAD SUPPORT

  Polled once per frame and folded into the same `intent` a keyboard fills, so a
  controller is indistinguishable to the rest of the game. Pad 0 drives seat 0,
  pad 1 drives seat 1. A seat with a live pad ignores its keyboard bindings so
  the two cannot fight each other.
*/
const PAD_DEADZONE = 0.35;
const PAD_BTN = {
  kick: [0, 2],        // A / X on most pads
  wall: [1, 3],        // B / Y
  jump: [0, 12],       // A, or d-pad up
};
const pads = { active: [false, false], names: ["", ""], prev: [{}, {}] };

/** Is the Gamepad API usable here? */
/*
  Pads are read through this indirection rather than touching `navigator`
  directly: in some environments `navigator` is a read-only accessor, so a test
  cannot substitute a fake one. Overriding this single hook keeps the production
  path identical while remaining testable.
*/
let padSource = () => {
  if (typeof navigator === "undefined" || typeof navigator.getGamepads !== "function") {
    return null;
  }
  try { return navigator.getGamepads() || []; } catch (e) { return null; }
};

/** Replace the pad source. Used by the test suite to inject a fake gamepad. */
function setPadSource(fn) { padSource = fn; }

const padsAvailable = () => padSource() !== null;

/** Read connected pads into `intent`. Returns the number of live pads. */
function pollPads(edge) {
  pads.active[0] = pads.active[1] = false;
  if (!game.opt.gamepad) return 0;
  const list = padSource();
  if (!list) return 0;

  let live = 0;
  for (let seat = 0; seat < 2; seat++) {
    const gp = list[seat];
    if (!gp || !gp.connected) { pads.names[seat] = ""; continue; }
    live++;
    pads.active[seat] = true;
    pads.names[seat] = gp.id || "gamepad";

    // A remote seat is driven by the network, not by a local pad.
    if (net.active && net.remoteSeat === seat) continue;
    if (game.cpu[seat]) continue;

    const a = intent[seat];
    const ax = gp.axes && gp.axes.length > 0 ? gp.axes[0] : 0;
    const ay = gp.axes && gp.axes.length > 1 ? gp.axes[1] : 0;
    const btn = (i) => !!(gp.buttons && gp.buttons[i] && gp.buttons[i].pressed);
    const anyOf = (ids) => ids.some(btn);

    a.left = ax < -PAD_DEADZONE || btn(14);
    a.right = ax > PAD_DEADZONE || btn(15);
    a.up = ay < -PAD_DEADZONE || anyOf(PAD_BTN.jump);
    a.down = ay > PAD_DEADZONE || btn(13);

    const kick = anyOf(PAD_BTN.kick);
    const wall = anyOf(PAD_BTN.wall);
    a.kick = kick;
    // Edge-detect the buttons ourselves, since a pad has no keydown event.
    a.kickEdge = edge && kick && !pads.prev[seat].kick;
    a.wallEdge = edge && wall && !pads.prev[seat].wall;

    // Dash and superpower, in every mode: shoulder buttons, edge-detected here
    // because a pad has no keydown event of its own.
    const padDash = btn(6) || btn(4);
    const padSuper = btn(7) || btn(5);
    a.dashEdge = edge && padDash && !pads.prev[seat].dash;
    a.superEdge = edge && padSuper && !pads.prev[seat].super;
    if (edge) { pads.prev[seat].dash = padDash; pads.prev[seat].super = padSuper; }

    /*
      3D arena: the RIGHT stick aims, which is the layout every console shooter
      has trained players to expect. A pad seat therefore needs no keyboard at
      all, which is what makes split-screen work with one mouse between two
      players — see arenaMouseSeat.
    */
    a.aimX = 0;
    a.aimY = 0;
    a.jump = false;
    if (isArena3D()) {
      const rx = gp.axes && gp.axes.length > 2 ? gp.axes[2] : 0;
      const ry = gp.axes && gp.axes.length > 3 ? gp.axes[3] : 0;
      const dz = (v) => (Math.abs(v) < PAD_DEADZONE ? 0 : v);
      a.aimX = dz(rx) * STICK_SENS * DT;
      a.aimY = -dz(ry) * STICK_SENS * DT;      // stick down is aim down
      a.jump = anyOf(PAD_BTN.jump);
      // Grab/throw on a face button, edge-detected like the rest.
      const padGrab = btn(2) || btn(3);
      a.grabEdge = edge && padGrab && !pads.prev[seat].grab;
      if (edge) pads.prev[seat].grab = padGrab;
      /*
        In the arena the left stick must steer four-way movement, and jump has
        its own button — so `up` must NOT double as jump the way it does in the
        2D game, or pushing the stick forward would make the fighter hop.
      */
      const ay2 = gp.axes && gp.axes.length > 1 ? gp.axes[1] : 0;
      a.up = ay2 < -PAD_DEADZONE || btn(12);
      a.down = ay2 > PAD_DEADZONE || btn(13);
    }
    if (edge) { pads.prev[seat].kick = kick; pads.prev[seat].wall = wall; }
  }
  return live;
}

/*
  INTENT is the single input channel the simulation reads. Nothing inside the
  physics touches `keys` directly, because a seat may be driven by:
    - the local keyboard,
    - the CPU,
    - or a remote peer over the network.
  Each seat's intent is filled in once per substep by `gatherIntent()`, and
  `kickEdge` is a one-shot flag so a held button fires a single kick.
*/
const intent = [
  { left: false, right: false, up: false, down: false, kick: false, kickEdge: false,
    wallEdge: false,
    // Every mode: dash and superpower, both edge-triggered so one press is one use.
    dashEdge: false, superEdge: false,
    // 3D arena only: aim deltas in radians, the jump button, and grab/throw.
    aimX: 0, aimY: 0, jump: false, grabEdge: false },
  { left: false, right: false, up: false, down: false, kick: false, kickEdge: false,
    wallEdge: false,
    dashEdge: false, superEdge: false,
    aimX: 0, aimY: 0, jump: false, grabEdge: false },
];

/** Pack a seat's intent into one byte, for the network. */
/*
  The 3D arena's aim, jump and dash are deliberately NOT packed: that mode is
  local-only (see menuRows, which hides ONLINE for it), so spending wire bits on
  fields no networked match can produce would be dead weight. Should the 3D mode
  ever go online, aim needs more than a bit each and this wants a wider format
  rather than a squeezed one.
*/
function packIntent(a) {
  return (a.left ? 1 : 0) | (a.right ? 2 : 0) | (a.up ? 4 : 0) |
         (a.down ? 8 : 0) | (a.kick ? 16 : 0) | (a.kickEdge ? 32 : 0) |
         (a.wallEdge ? 64 : 0);
}

/** Unpack a byte into a seat's intent object (mutates and returns `out`). */
function unpackIntent(byte, out) {
  out.left  = !!(byte & 1);
  out.right = !!(byte & 2);
  out.up    = !!(byte & 4);
  out.down  = !!(byte & 8);
  out.kick  = !!(byte & 16);
  out.kickEdge = !!(byte & 32);
  out.wallEdge = !!(byte & 64);
  return out;
}

/**
 * Fill both seats' intent for this substep from whatever drives them.
 * `edge` is true only on the first substep of a rendered frame, so a keypress
 * produces exactly one kick regardless of how many substeps run.
 */
function gatherIntent(edge) {
  // A connected gamepad fills its own seat, so poll first and let the keyboard
  // pass over any seat a pad already owns.
  pollPads(edge);

  const mySeat = netLocalSeat();
  for (let i = 0; i < 2; i++) {
    const a = intent[i];
    if (net.active && net.remoteSeat === i && i >= 0) continue;  // filled by the network
    /*
      Only ever fill the seat this machine actually owns. A spectator owns none,
      and used to write seat 0 regardless — harmless with one peer because the
      host ignored it, but with a hub every watching machine would have been
      steering the match.
    */
    if (net.active && mySeat !== i) continue;
    if (game.cpu[i]) continue;                          // filled by updateCPU
    if (pads.active[i]) continue;                       // filled by pollPads
    const S = SCHEME[i];
    a.left  = !!keys[S.left];
    a.right = !!keys[S.right];
    a.up    = !!keys[S.up];
    a.down  = !!keys[S.down];
    a.kick  = kickDown(i);
    a.kickEdge = edge && kickHit(i);
    a.wallEdge = edge && hit(S.wall);
    // Dash and superpower are available in every mode, so they are read here
    // rather than inside either simulation.
    a.dashEdge = edge && hit(S.dash);
    a.superEdge = edge && hit(S.super);
    /*
      ON-SCREEN CONTROLS, folded in for seat 0 only — a phone has one screen and
      one pair of thumbs. Applied on top of the keyboard reads above rather than
      instead of them, so a tablet with a keyboard attached can use either.
    */
    if (i === 0 && touchPoints.size && touchControlsWanted()) touchIntent(a, edge);
    /*
      3D arena input. Read here rather than in the arena's own step so every
      seat — keyboard, pad or CPU — reaches the simulation through the same
      `intent` channel the 2D game established.

      Aim is a per-step DELTA, so it is scaled by dt: holding a key must turn at
      the same rate regardless of how many substeps a frame runs. The mouse is
      added on top, already in pixels and so already frame-rate independent.
    */
    a.aimX = 0;
    a.aimY = 0;
    if (isArena3D()) {
      const kx = (keys[S.aimRight] ? 1 : 0) - (keys[S.aimLeft] ? 1 : 0);
      const ky = (keys[S.aimUp] ? 1 : 0) - (keys[S.aimDown] ? 1 : 0);
      a.aimX = kx * STICK_SENS * DT;
      a.aimY = ky * STICK_SENS * DT;
      // Only the seat holding the pointer lock steers with the mouse, and only
      // on the first substep of a frame, so one mouse movement turns once.
      if (edge && mouse.locked && i === arenaMouseSeat()) {
        const d = takeMouseDelta();
        a.aimX += d.dx * MOUSE_SENS;
        a.aimY -= d.dy * MOUSE_SENS;      // screen down is aim down
      }
      /*
        Jump gets its own key here rather than reusing the wall binding: walls are
        buildable in this mode too, so the two cannot share. SPACE is the jump,
        matching every other third-person game.
      */
      a.jump = !!keys.Space;
      a.grabEdge = edge && hit(S.grab);
    } else {
      a.jump = false;
      a.grabEdge = false;
    }
  }
}

/**
 * Which seat owns the mouse in the 3D arena?
 *
 * There is one mouse, so exactly one seat can use it: the first seat that is
 * neither CPU-driven nor pad-driven. In split-screen that is P1, and P2 falls
 * back to the aim keys or a pad's right stick.
 */
function arenaMouseSeat() {
  for (let i = 0; i < 2; i++) {
    if (game.cpu[i]) continue;
    if (pads.active[i]) continue;
    return i;
  }
  return -1;
}

/*
  Edge-triggered input must fire exactly ONCE per keypress. Physics runs several
  substeps per rendered frame, so a naive `pressed[code]` read inside step() is
  seen by every substep — on a 60Hz display that advanced menus two at a time.
  `edgeFrame` is true only for the first substep of each frame; `hit()` is the
  only sanctioned way to read a press.
*/
let edgeFrame = true;
const hit = (code) => edgeFrame && !!pressed[code];

/*
  Set by any scene handler that consumes an ESC press, so the global pause
  shortcut later in the same step() does not act on it a second time.
*/
let escUsed = false;

// Numpad0 is an accepted alias for P2's kick.
const kickDown = (i) => keys[SCHEME[i].kick] || (i === 1 && keys.Numpad0);
const kickHit  = (i) => hit(SCHEME[i].kick) || (i === 1 && hit("Numpad0"));

/* ------------------------------------------------------------ 7. ENTITIES */

function makeBall() {
  const c = modeCfg();
  return { x: W / 2, y: 200, vx: 0, vy: 0, r: c.ballR, mass: c.ballMass, bounces: 0 };
}

class Player {
  constructor(index, team) {
    this.index = index;                 // 0 = left, 1 = right
    this.team = team;
    this.facing = index === 0 ? 1 : -1;
    this.baseR = PLAYER_R * statToMultiplier(team.size, 0.13);
    this.r = this.baseR;
    this.mass = 3 * statToMultiplier(team.size, 0.3);
    this.accel = PLAYER_ACCEL * statToMultiplier(team.speed, 0.16);
    this.maxv = PLAYER_MAXV * statToMultiplier(team.speed, 0.16);
    this.jumpV = PLAYER_JUMP * statToMultiplier(team.jump, 0.14);
    this.shotP = KICK_BASE * statToMultiplier(team.shot, 0.17);
    this.effects = Object.create(null); // type -> remaining seconds
    this.wallMax = WALL_CHARGES;        // raised by roguelike upgrades
    this.reset();
    this.applyChaos();                  // pick up any live chaos multipliers
  }

  reset() {
    // Volleyball starts each side deeper in its own half, clear of the net.
    this.x = modeCfg().confine
      ? (this.index === 0 ? W * 0.22 : W * 0.78)
      : (this.index === 0 ? W * 0.27 : W * 0.73);
    this.y = GROUND_Y - this.r;
    this.vx = 0; this.vy = 0;
    this.onGround = true;
    this.kickT = 0;                     // >0 while swinging
    this.kickCD = 0;
    this.kickConsumed = false;
    this.stun = 0;                      // >0 while disabled by a mine
    this.ammo = 0;                      // pistol rounds remaining
    this.fireCD = 0;
    this.wallKicked = false;
    this.airKickReset = false;
    this.wallCharges = this.wallMax === undefined ? WALL_CHARGES : this.wallMax;
    this.wallCD = 0;
    this.wallRecharge = WALL_RECHARGE;
    this.facing = this.index === 0 ? 1 : -1;
    this.effects = Object.create(null);
    /*
      Dash and superpower state. The dash is always available; the superpower
      charges through play. `super` deliberately carries over NOTHING between
      kickoffs except the charge itself, which is reset here — a meter that
      survived a goal would let a player bank a power across restarts.
    */
    this.dashCD = 0;
    this.dashT = 0;                     // >0 while the burst is active
    this.dashAir = 0;                   // dashes used since leaving the ground
    this.superCharge = 0;
    this.superT = 0;                    // >0 while the power is running
    this.superId = superForTeam(this.team);
    this.applySize();
  }

  applySize() {
    let s = playerSizeMul;                 // chaos mode scales everyone
    if (inRun() && this.index === 0) s *= game.run.mods.size;
    if (this.effects.bigger)  s *= 1.55;
    if (this.effects.smaller) s *= 0.62;
    // A running superpower may scale the player too. Read rather than baked in,
    // so the size returns on its own when the power expires.
    s *= superSizeMul(this);
    this.r = this.baseR * s;
    this.massNow = this.mass * s * s;

    /*
      Growing while grounded would leave the feet BELOW the floor by the size
      increase — measured at 12.2px after a BIGGER pickup, briefly showing the
      player buried in the pitch. Lift them back onto the surface here, at the
      moment the radius changes, rather than waiting for the next update.
    */
    if (this.y !== undefined) {
      const floor = GROUND_Y - this.r;
      if (this.y > floor) {
        this.y = floor;
        if (this.vy > 0) this.vy = 0;
        this.onGround = true;
      }
      // A ceiling case too, for a grow that would clip the top of the screen.
      if (this.y - this.r < 0) this.y = this.r;
    }
  }

  /**
   * Recompute stats that depend on the chaos multipliers. Called on every chaos
   * roll and on reset, so a re-roll is felt immediately without rebuilding
   * the player (which would lose their active power-ups and position).
   */
  applyChaos() {
    const t = this.team;
    /*
      Run upgrades apply only to the human seat, on top of the team stats and any
      chaos multipliers. Done here because this is the single place derived stats
      are recomputed, so upgrades survive a chaos roll or a power-up.
    */
    const m = (inRun() && this.index === 0) ? game.run.mods : null;
    const sMul = m ? m.speed : 1;
    const jMul = m ? m.jump : 1;

    this.accel = PLAYER_ACCEL * statToMultiplier(t.speed, 0.16) * playerSpeedMul * sMul;
    this.maxv  = PLAYER_MAXV  * statToMultiplier(t.speed, 0.16) * playerSpeedMul * sMul;
    this.jumpV = PLAYER_JUMP  * statToMultiplier(t.jump, 0.14)  * playerJumpMul * jMul;
    this.shotP = KICK_BASE * statToMultiplier(t.shot, 0.17) * (m ? m.shot : 1);
    this.wallMax = WALL_CHARGES + (m ? m.wallCharges : 0);
    this.applySize();
  }

  grant(type) {
    // Jetpack is a BALL effect, not a player buff — it lives on game state so
    // it keeps running regardless of what happens to whoever picked it up.
    if (type === "jetpack") {
      game.jetpack = POWERUPS.jetpack.dur;
      game.jetpackOwner = this.index;
      this.effects.jetpack = POWERUPS.jetpack.dur;   // for the HUD chip only
      return;
    }

    // Keeper / striker spawn an AI helper owned by this player. One of each
    // kind per player: re-grabbing refreshes rather than stacking a second.
    if (type === "keeper" || type === "striker") {
      spawnHelper(this.index, type);
      this.effects[type] = POWERUPS[type].dur;
      return;
    }

    // Pistol grants ammo rather than a timed buff. Picking up more tops it up.
    if (type === "pistol") {
      this.ammo = Math.min(this.ammo + PISTOL_AMMO, PISTOL_AMMO * 2);
      this.effects.pistol = POWERUPS.pistol.dur;
      return;
    }

    // Goal resize is a WORLD effect: it changes both goals for both players.
    if (type === "bigGoals" || type === "tinyGoals") {
      game.goalFx = type;
      game.goalFxT = POWERUPS[type].dur;
      goalScale = type === "bigGoals" ? GOAL_SIZE_BIG : GOAL_SIZE_SMALL;
      this.effects[type] = POWERUPS[type].dur;   // HUD attribution only
      return;
    }

    // Bigger and Smaller cancel rather than compounding.
    if (type === "bigger" && this.effects.smaller) { delete this.effects.smaller; this.applySize(); return; }
    if (type === "smaller" && this.effects.bigger) { delete this.effects.bigger; this.applySize(); return; }
    this.effects[type] = POWERUPS[type].dur;
    this.applySize();
  }

  get legTip() {
    // Leg swings from behind the body through to fully extended forward.
    const t = this.kickT > 0 ? 1 - this.kickT / KICK_TIME : 0;
    const ang = lerp(-0.9, 0.75, t);            // radians from horizontal
    const reach = this.r + LEG_LEN * lerp(0.45, 1, t);
    return {
      x: this.x + Math.cos(ang) * reach * this.facing,
      y: this.y + Math.sin(ang) * reach * 0.75 + this.r * 0.35,
      r: LEG_R,
      t,
    };
  }

  update(dt, other) {
    const act = intent[this.index];     // keyboard, CPU or remote — same shape
    const spdMul = (this.effects.speed ? 1.5 : 1) * superSpeedMul(this);
    const jmpMul = this.effects.powerjump ? 1.45 : 1;

    // Mine stun: no input is accepted, but gravity and collisions still apply
    // so the player falls and can be shoved while helpless.
    if (this.stun > 0) this.stun = Math.max(0, this.stun - dt);
    const stunned = this.stun > 0;

    let dir = 0;
    if (!stunned) {
      if (act.left)  dir -= 1;
      if (act.right) dir += 1;
      if (dir !== 0) this.facing = dir;
    }

    /*
      DASH. A burst along the current facing, spent and recharged.

      While `dashT` runs, the normal speed cap below is lifted — otherwise the
      cap would swallow the burst on the very next substep and the dash would do
      nothing at all. Air dashes are limited per airtime so it cannot be used to
      fly, and the counter resets on landing.
    */
    if (this.dashCD > 0) this.dashCD -= dt;
    if (this.dashT > 0) this.dashT = Math.max(0, this.dashT - dt);
    if (this.onGround) this.dashAir = 0;

    if (!stunned && act.dashEdge && game.rules.dash && this.dashCD <= 0 &&
        (this.onGround || this.dashAir < DASH_AIR)) {
      const boost = this.effects.panther || this.superT > 0 && this.superId === "panther"
        ? 1.4 : 1;
      this.vx = this.facing * DASH_V * boost;
      // A touch of lift, so a dash clears a low wall and feels like a move
      // rather than a slide. Only when grounded: an air dash stays flat.
      if (this.onGround) this.vy = Math.min(this.vy, -110);
      else this.dashAir++;
      this.dashCD = DASH_CD;
      this.dashT = DASH_T;
      burst(this.x, this.y + this.r * 0.4, this.team.accent, 12);
    }

    // SUPERPOWER. Fired on the edge, only at full charge.
    if (!stunned && act.superEdge && superReady(this)) fireSuper(this);
    if (this.superT > 0) {
      this.superT = Math.max(0, this.superT - dt);
      if (this.superT === 0) endSuper(this);
    }
    // Charge accrues with time so a quiet match still builds toward a power.
    if (game.scene === SCENE.PLAY) {
      superGain(this, SUPER_GAIN_TIME * (game.rules.superRate || 1) * dt);
    }
    tickSuper(this, dt);

    const ctl = this.onGround ? 1 : PLAYER_AIR_CTL;
    if (dir !== 0) {
      this.vx += dir * this.accel * spdMul * ctl * dt;
      // The dash burst is exempt from the cap while it lasts, or it would be
      // clamped away before the player ever moved.
      const mv = this.maxv * spdMul;
      if (this.dashT <= 0) this.vx = clamp(this.vx, -mv, mv);
    } else if (this.onGround && this.dashT <= 0) {
      this.vx -= this.vx * clamp(PLAYER_FRICTION * dt, 0, 1);
    }

    /*
      FLEA JUMP lets the jump fire in mid-air as well. Edge-triggered on the
      power's own latch rather than on `act.up` being held, so holding the key
      does not machine-gun the player into orbit.
    */
    const flea = this.superT > 0 && this.superId === "flea";
    const canJump = this.onGround || (flea && !this.fleaHeld);
    if (!stunned && act.up && canJump) {
      // Scaled by jumpScale() so jump HEIGHT survives a gravity re-roll while
      // airtime still changes — see the note by GRAV_MIN_MUL.
      this.vy = -this.jumpV * jmpMul * jumpScale();
      this.onGround = false;
      if (flea && !this.onGround) burst(this.x, this.y + this.r, "#fff2a0", 8);
    }
    this.fleaHeld = !!act.up;
    if (!stunned && act.down && !this.onGround) this.vy += gravity * 0.9 * dt;  // fast-fall

    // TUMBLE cancels gravity entirely, so the acrobat can fly for its duration.
    const flying = this.superT > 0 && this.superId === "tumble";
    this.vy += (flying ? gravity * 0.04 : gravity) * dt;
    if (flying && !stunned) {
      // With gravity gone, up/down become direct thrust — otherwise "flying"
      // would just mean hanging motionless in the air.
      if (act.up) this.vy -= 900 * dt;
      if (act.down) this.vy += 900 * dt;
      this.vy = clamp(this.vy, -380, 380);
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Ground + walls.
    if (this.y + this.r >= GROUND_Y) {
      const wasFalling = this.vy;
      this.y = GROUND_Y - this.r;
      if (this.vy > 0) this.vy = 0;
      this.onGround = true;
      /*
        A QUAKE fired in mid-air drives the player down and detonates on impact,
        so the slam lands where they land. `quakePending` is set at fire time and
        consumed here, which is why the power works from any height.
      */
      if (this.quakePending && wasFalling > 400) {
        this.quakePending = false;
        quakeSlam(this);
      }
    } else if (this.vy !== 0) {
      this.onGround = false;
    }
    this.x = clamp(this.x, WALL + this.r, W - WALL - this.r);
    if (this.y - this.r < 0) { this.y = this.r; if (this.vy < 0) this.vy = 0; }

    // Kick / fire timers.
    if (this.fireCD > 0) this.fireCD -= dt;
    if (this.kickCD > 0) this.kickCD -= dt;
    if (this.kickT > 0) {
      this.kickT -= dt;
      if (this.kickT <= 0) { this.kickT = 0; this.kickConsumed = false; this.wallKicked = false; }
    }

    // Effect timers.
    for (const k in this.effects) {
      this.effects[k] -= dt;
      if (this.effects[k] <= 0) { delete this.effects[k]; this.applySize(); }
    }

    // Body-vs-body shove.
    if (other) {
      const a = { x: this.x,  y: this.y,  vx: this.vx,  vy: this.vy,  r: this.r,  mass: this.massNow };
      const b = { x: other.x, y: other.y, vx: other.vx, vy: other.vy, r: other.r, mass: other.massNow };
      /*
        An IMMOVABLE player keeps its own position and velocity through the
        shove: the other is still pushed out, so nobody overlaps, but a bulwark
        cannot be barged off the goal line. Applied after resolveCircles rather
        than by faking a huge mass, so the separation itself stays exact.
      */
      const meFixed = superImmovable(this);
      const themFixed = superImmovable(other);
      const keepMe = { x: this.x, y: this.y, vx: this.vx, vy: this.vy };
      const keepThem = { x: other.x, y: other.y, vx: other.vx, vy: other.vy };
      if (resolveCircles(a, b, 0.25)) {
        this.x = a.x; this.y = a.y; this.vx = a.vx; this.vy = a.vy;
        other.x = b.x; other.y = b.y; other.vx = b.vx; other.vy = b.vy;
        // Both immovable is a stalemate: neither moves, so let the plain
        // separation stand rather than leaving them interpenetrating.
        if (meFixed && !themFixed) Object.assign(this, keepMe);
        if (themFixed && !meFixed) Object.assign(other, keepThem);
        this.x = clamp(this.x, WALL + this.r, W - WALL - this.r);
        other.x = clamp(other.x, WALL + other.r, W - WALL - other.r);

        /*
          A HEAD IS SOLID GROUND. Standing on the other player used to leave
          onGround false — only the floor and platforms ever set it — so you were
          stuck up there unable to jump off. Whoever is on top gets their jump
          back, exactly as if they had landed on a platform.

          Gated on being ABOVE the other player and not moving upward, so it is
          the one standing on top who gains the footing, not the one underneath,
          and a rising player passing through does not get a free extra jump.
        */
        const standingOn = (up, down) =>
          up.y < down.y - down.r * 0.35 && up.vy >= -1;
        if (standingOn(this, other)) this.onGround = true;
        if (standingOn(other, this)) other.onGround = true;
      }
    }
  }

  /**
   * Fire the pistol if armed. Returns the new bullet, or null.
   * Bullets travel flat in the facing direction.
   */
  tryFire() {
    if (this.stun > 0 || this.ammo <= 0 || this.fireCD > 0) return null;
    this.ammo--;
    this.fireCD = PISTOL_CD;
    if (this.ammo === 0) delete this.effects.pistol;
    const b = {
      owner: this.index,
      x: this.x + this.facing * (this.r + BULLET_R + 2),
      y: this.y - this.r * 0.15,
      vx: this.facing * BULLET_SPD,
      vy: 0,
      r: BULLET_R,
      life: BULLET_LIFE,
    };
    game.bullets.push(b);
    game.shake = Math.max(game.shake, 0.1);
    burst(b.x, b.y, "#fff7ed", 5);
    return b;
  }

  tryStartKick() {
    if (this.stun > 0) return false;
    if (this.kickT === 0 && this.kickCD <= 0) {
      this.kickT = KICK_TIME;
      this.wallKicked = false;        // one wall per swing
      this.kickCD = KICK_TIME + KICK_COOLDOWN *
        (inRun() && this.index === 0 ? game.run.mods.kickCD : 1);
      this.kickConsumed = false;
      return true;
    }
    return false;
  }
}

/*
  Per-mode ball and rule configuration. `modeCfg()` is the single source of
  truth: physics, rendering and scoring all read it rather than testing the mode
  by hand, so adding a mode does not mean hunting for every `if (mode === ...)`.

    ballR / ballMass  — size and weight of the ball
    grav / drag       — gravity and air-drag multipliers applied to the ball
    rest              — bounce restitution
    knockback         — whether a power-shot ball can shove players
    net               — net height above the grass, or 0 for none
    confine           — players locked to their own half
    goals             — soccer goals in play
*/
const MODE_CFG = {
  [MODE.SINGLE]:     { ballR: 14, ballMass: 1,    grav: 1,    drag: 1,   rest: 1,
                       knockback: true,  net: 0,   confine: false, goals: true,

  // Volleyball: big, light and springy — the ball should keep a rally alive.
  [MODE.VOLLEY]:     { ballR: 22, ballMass: 0.45, grav: 0.52, drag: 1.35, rest: 1.16,
                       knockback: false, net: 210, confine: true,  goals: false,
                       kickMul: 1, reachMul: 1 },
  /*
    Tennis: the ball was small AND light, which made the contact window only
    21px against soccer's 25px — you whiffed constantly. It is now a little
    bigger and much lighter, with a kick bonus, so a swing connects and sends it.
  */
  [MODE.TENNIS]:     { ballR: 13, ballMass: 0.35, grav: 1.3, drag: 0.4, rest: 1.04,
                       knockback: false, net: 110, confine: true,  goals: false,

    Basketball: a genuinely bouncy ball. It was the second-least bouncy mode in
    the game (0.78) while also needing the tightest aim, which made scoring
    rare. Smaller and springier, with lower gravity for a floatier arc.

  [MODE.BASKET]:     { ballR: 14, ballMass: 0.72, grav: 0.62, drag: 0.8,  rest: 1.18,

  [MODE.ARENA3D]:    { ballR: 14, ballMass: 1,    grav: 1,    drag: 1,   rest: 1,
                       knockback: false, net: 0,   confine: false, goals: false,

};

// Setup rows on the menu, navigated with either player's up/down.
/*
  Records the geometry the drawing code actually produced, so the test suite can
  assert that every row landed on screen instead of re-deriving the maths.
*/
const layoutProbe = { menu: null, pause: null, controls: null };

/*
  Counts what the renderer actually painted on the last frame. Assertions read
  this instead of merely calling a draw function and checking it did not throw —
  which is how an unpainted arena shipped once already.
*/
const drawProbe = { platforms: 0, faces: 0, walls: 0 };

/* ------------------------------------------------------- POINTER INPUT

   Mouse and touch. The game was keyboard-only, which is fine on a desktop and
   impossible on a phone, so every interactive screen now registers CLICK REGIONS
   as it draws and a tap is resolved against them.

   Regions are collected during the draw pass rather than declared separately:
   the rectangle you can click is by construction the rectangle that was painted,
   so the two can never drift apart. The list is rebuilt every frame, so a screen
   that stops drawing a button stops accepting clicks on it.
*/

/*
  Scenes that accept a tap anywhere, because they already accept any key: the win
  card, tournament standings, the champion, the credits and a finished run.
*/
const TAP_ANYWHERE = new Set(["win", "bracket", "champion", "credits",
                              "runover", "runwin"]);

/** Regions registered by the last draw pass: {x, y, w, h, act}. */
let clickRegions = [];
/** Regions being collected by the CURRENT draw pass. */
let nextRegions = [];

/**
 * Register a clickable rectangle.
 *
 * `act` is a function run when it is tapped, or a string naming a key to
 * synthesise — a string lets an existing keyboard handler serve the tap without
 * being restructured, which is how most of these screens are wired.
 */
function clickable(x, y, w, h, act) {
  nextRegions.push({ x, y, w, h, act });
}

/** Swap the collected regions in, at the end of a draw pass. */
function commitRegions() {
  clickRegions = nextRegions;
  nextRegions = [];
}

/** The region under a point, topmost (last drawn) first. */
function regionAt(x, y) {
  for (let i = clickRegions.length - 1; i >= 0; i--) {
    const r = clickRegions[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r;
  }
  return null;
}

/*
  Pointer state, in LOGICAL canvas coordinates. The canvas is letterboxed and
  scaled to fit the window, so a raw client position means nothing until it is
  mapped back through that transform — see toLogical.
*/
const pointer = { x: -1, y: -1, down: false, inside: false, hover: null };

/** Map a client (window) position into logical canvas coordinates. */
function toLogical(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return { x: -1, y: -1 };
  return { x: ((clientX - r.left) / r.width) * W,
           y: ((clientY - r.top) / r.height) * H };
}

/**
 * Act on a tap at a logical position. Returns true if something handled it.
 *
 * A string `act` is turned into a synthetic key press, which is then read by the
 * ordinary `hit()` path on the next update — so a tap and a key press travel
 * exactly the same route through the scene handlers and cannot diverge.
 */
/** Keys a tap synthesised this frame, released once the update has read them. */
const tapKeys = [];

function pointerActivate(x, y) {
  const r = regionAt(x, y);
  if (!r) return false;
  if (typeof r.act === "function") { r.act(); return true; }
  if (typeof r.act === "string") {
    pressed[r.act] = true;
    keys[r.act] = true;
    tapKeys.push(r.act);
    return true;
  }
  return false;
}

/** Captures the strings a draw pass paints; see capturePaint(). Off by default. */
const textProbe = { on: false, lines: [] };

/** What the credits screen last rendered, so the test suite can check names. */
const creditProbe = { lines: [] };

/*
  MENU ATTRACT SCENE

  A small self-contained simulation that plays behind the main menu: two idle
  characters knocking a ball about. It is deliberately separate from `game` so
  the menu can never disturb match state, and it runs on its own clock so the
  menu animates even before a match exists.
*/
const menuFx = {
  t: 0,
  ball: { x: 500, y: 140, vx: 150, vy: 0, r: 15 },
  heads: [
    { x: 200, y: 0, vy: 0, phase: 0.0, face: "grin", hat: "cap", team: 0 },
    { x: 800, y: 0, vy: 0, phase: 2.1, face: "cool", hat: "crown", team: 4 },
  ],
  confetti: [],
};

/** Advance the attract scene. Purely cosmetic; never touches `game`. */
function stepMenuFx(dt) {
  menuFx.t += dt;
  const floor = H - 96;

  // Ball: simple bounce inside the panel area.
  const b = menuFx.ball;
  b.vy += 900 * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  if (b.y + b.r > floor) { b.y = floor - b.r; b.vy = -Math.abs(b.vy) * 0.86; }
  if (b.vy > -40 && b.y + b.r >= floor - 1) b.vy = -560;      // keep it lively
  if (b.x - b.r < 40) { b.x = 40 + b.r; b.vx = Math.abs(b.vx); }
  if (b.x + b.r > W - 40) { b.x = W - 40 - b.r; b.vx = -Math.abs(b.vx); }

  // Heads bob, and hop when the ball comes near.
  for (const h of menuFx.heads) {
    h.phase += dt * 1.7;
    const rest = floor - 34;
    h.vy += 1500 * dt;
    h.y += h.vy * dt;
    if (h.y > rest) { h.y = rest; h.vy = 0; }
    if (h.y >= rest - 0.5 && Math.abs(b.x - h.x) < 150 && b.y < rest) h.vy = -430;
  }
}

/** The attract scene, drawn behind the menu chrome. */
function drawMenuBackdrop() {
  const floor = H - 96;

  // Deep gradient sky.
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#070c17");
  sky.addColorStop(0.55, "#0d1a2e");
  sky.addColorStop(1, "#122a3f");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stadium glow behind the title.
  const glow = ctx.createRadialGradient(W / 2, 90, 20, W / 2, 90, 420);
  glow.addColorStop(0, "rgba(125,211,252,0.20)");
  glow.addColorStop(1, "rgba(125,211,252,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, 400);

  // Crowd speckle.
  for (let i = 0; i < 150; i++) {
    const x = (i * 97.3) % W;
    const y = 18 + ((i * 53) % 120);
    ctx.fillStyle = i % 4 === 0 ? "rgba(56,102,150,0.55)" : "rgba(30,60,92,0.5)";
    ctx.fillRect(x, y, 5, 4);
  }

  // Grass strip along the bottom.
  ctx.fillStyle = "#14622b";
  ctx.fillRect(0, floor, W, H - floor);
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let x = 0; x < W; x += 90) ctx.fillRect(x, floor, 45, H - floor);
  ctx.strokeStyle = "rgba(255,255,255,0.18)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, floor);
  ctx.lineTo(W, floor);
  ctx.stroke();

  // The two idle characters, then the ball on top.
  for (const h of menuFx.heads) {
    const team = TEAMS[h.team];
    const r = 32 + Math.sin(h.phase) * 1.5;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(h.x, floor + 4, r * 0.9, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    const g = ctx.createRadialGradient(h.x - r * 0.3, h.y - r * 0.4, r * 0.2, h.x, h.y, r);
    g.addColorStop(0, team.accent);
    g.addColorStop(1, team.color);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 3;
    ctx.stroke();
    const facing = h.x < W / 2 ? 1 : -1;
    const mood = h.vy < -50 ? "kick" : "idle";
    drawFace(h.x, h.y, r, facing, h.face, mood, team);
    drawHat(h.x, h.y, r, facing, h.hat, team);
    ctx.globalAlpha = 1;
  }

  const b = menuFx.ball;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(b.x, floor + 3, b.r, b.r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fdfdfd";
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#243244";
  ctx.lineWidth = 2;
  ctx.stroke();
  const rot = b.x / b.r;
  ctx.fillStyle = "#243244";
  for (let i = 0; i < 5; i++) {
    const a = rot + (i * Math.PI * 2) / 5;
    ctx.beginPath();
    ctx.arc(b.x + Math.cos(a) * b.r * 0.5, b.y + Math.sin(a) * b.r * 0.5, b.r * 0.19, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Vignette so the chrome above stays legible.
  ctx.fillStyle = "rgba(6,11,20,0.55)";
  ctx.fillRect(0, 0, W, H);
}

/** The wordmark: layered, with a ball for the O. */
function drawLogo(cx, cy) {
  const pulse = 1 + Math.sin(menuFx.t * 2) * 0.012;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(pulse, pulse);

  const big = 54;
  ctx.font = `900 ${big}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // Drop shadow, then a coloured underlay, then the face.
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillText("HEAD GAME", 4, 5);
  ctx.fillStyle = "#0ea5e9";
  ctx.fillText("HEAD GAME", 0, 3);
  const grad = ctx.createLinearGradient(0, -big / 2, 0, big / 2);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(1, "#bae6fd");
  ctx.fillStyle = grad;
  ctx.fillText("HEAD GAME", 0, 0);
  ctx.restore();
}

/*
  Row order follows the VISUAL layout, not the order features were added. The
  left panel is walked top to bottom, then the right panel, then the button row,
  then START — so pressing down never jumps the cursor across the screen.
  A test asserts this stays true.
*/
const MENU_ROWS = [
  // left panel: match setup
  "mode", "map", "players", "goals", "time", "chaos",
  // right panel: who is playing
  "name1", "name2", "opponent", "cpulevel",
  // the button strip, then the primary action
  "rules", "online", "board", "controls", "credits", "settings",
  "roguelike", "start",
];

/**
 * Which setup rows are currently visible. PLAYERS only applies to a tournament;
 * OPPONENT is meaningless there (every seat is a human taking turns); and the
 * CPU level only matters once the CPU is switched on.
 */
function menuRows() {
  return MENU_ROWS.filter((r) => {
    if (r === "players") return game.mode === MODE.TOURNAMENT;
    if (r === "opponent") return game.mode !== MODE.TOURNAMENT;
    if (r === "cpulevel") return game.mode !== MODE.TOURNAMENT && game.cpu[1];
    /*
      Online play streams 2D snapshots, so the 3D arena cannot be played over
      the network — the row is hidden here rather than offering a link that
      would connect and then desync.
    */
    if (r === "online") return game.mode !== MODE.ARENA3D;
    if (r === "settings") return true;
    if (r === "board") return true;
    if (r === "roguelike") return true;
    if (r === "controls") return true;
    if (r === "credits") return true;
    if (r === "rules") return true;
    // The 3D arena builds its own cover layout and re-rolls nothing, so neither
    // the 2D maps nor the chaos tunables have any meaning there.
    if (r === "chaos") return game.mode !== MODE.ARENA3D;
    // Platforms would block a volleyball or tennis rally, so no map choice there.
    if (r === "map") return modeCfg().net === 0 && game.mode !== MODE.ARENA3D;
    // The second name only matters when a second human shares this keyboard.
    if (r === "name2") return game.mode !== MODE.TOURNAMENT && !game.cpu[1] && !net.active;
    return true;
  });
}

const game = {

  // A plain literal, not makeBall(): makeBall reads modeCfg(), which reads

  ball: { x: W / 2, y: 200, vx: 0, vy: 0, r: BALL_R, mass: BALL_MASS, bounces: 0 },

  remoteName: "",       // the peer's name, once they tell us

/* ---- tournament ---------------------------------------------------------- */

/**
 * Pair up the surviving entrants for a round. Returns [[a, b], ...] where the
 * second element is null for a bye (odd number of survivors).
 * Pure: takes and returns plain data.
 */
function buildPairs(aliveIds) {
  const pairs = [];
  for (let i = 0; i < aliveIds.length; i += 2) {
    pairs.push([aliveIds[i], aliveIds[i + 1] ?? null]);
  }
  return pairs;
}

/**
 * Fisher-Yates shuffle, returning a new array. Pure apart from Math.random, so
 * the draw can be asserted for fairness rather than just "it changed".
 */
function shuffled(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/**
 * Re-roll the draw. Only legal BEFORE the first tie of round one has been
 * played: once results exist, reshuffling would rewrite history. Returns
 * whether it actually happened, so the caller can say no.
 */
function rerollDraw() {
  if (game.mode !== MODE.TOURNAMENT) return false;
  if (netIsGuest()) return false;          // the host owns the bracket
  if (game.round !== 1 || game.tieIndex !== 0) return false;
  if (game.lastResult) return false;       // a tie has already been decided
  game.drawOrder = makeDraw(game.entrants.map((e) => e.id));
  // Rebuild round one from the new order. beginRound() would increment the
  // round counter, so the pairing work is repeated here instead.
  game.roundPairs = buildPairs(aliveInDrawOrder());
  game.tieIndex = 0;
  game.bracket[0] = game.roundPairs.map(([a, b]) => ({
    a, b, winner: b === null ? a : null,
  }));
  game.drawRolls = (game.drawRolls || 0) + 1;
  netSendBracket();
  return true;
}

/**
 * The DRAW: a randomised seeding order fixed once at the start of a tournament.
 * Without this, entrant 1 always met entrant 2 and the bracket was identical
 * every time. Held in `game.drawOrder` so later rounds keep the same side of the
 * bracket rather than re-shuffling as players are eliminated.
 */
function makeDraw(ids) {
  return shuffled(ids);
}

/**
 * Is this seat's team settled for the rest of the tournament? Gated on the mode
 * so a leftover flag can never lock the select screen in any other mode — every
 * screen that reaches select does NOT have to remember to clear it.
 */
function seatFixed(i) {
  return game.mode === MODE.TOURNAMENT && !!game.selFixed[i];
}

/** Alive entrants, ordered by the tournament draw rather than by id. */
function aliveInDrawOrder() {
  const alive = new Set(aliveEntrants().map((e) => e.id));
  const ordered = (game.drawOrder || []).filter((id) => alive.has(id));
  // Anything missing from the draw (shouldn't happen) still gets a place.
  for (const e of aliveEntrants()) if (!ordered.includes(e.id)) ordered.push(e.id);
  return ordered;
}

const aliveEntrants = () => game.entrants.filter((e) => e.alive);
const entrantById = (id) => game.entrants.find((e) => e.id === id) || null;

/** Total ties (byes excluded) needed to go from n entrants to a champion. */
function tiesRemaining(n) {
  return Math.max(0, n - 1);
}

function startTournament() {
  game.entrants = [];
  for (let i = 0; i < game.entrantCount; i++) {
    // Seats 0 and 1 inherit the names typed on the setup screen; the rest get
    // numbered defaults that can be renamed on the roster screen.
    const preset = game.rosterNames[i];
    /*
      Ownership decides who controls this entrant. Online, seed 1 belongs to the
      host and seed 2 to the guest, so their meeting is the online tie; the rest
      are local players on the host's keyboard (or CPUs if that was chosen).
    */
    /*
      OWNERSHIP. Entrant 0 is always this machine — the host plays too. Every
      other entrant belongs to whichever joined peer claimed that slot, and
      anything still unclaimed is a CPU.

      This used to read `i === 1 ? "guest" : "host"`, which is why an online
      bracket could only ever hold two humans: seed 2 was the one remote player
      and everybody else was played on the host's own keyboard.
    */
    let owner = "host";
    if (netIsHub()) {
      if (i === 0) owner = "host";
      else owner = peerByEntrant(i) ? "guest" : "cpu";
    } else if (net.active) {
      // Original two-machine session: seed 2 is the one remote human.
      owner = i === 1 ? "guest" : "host";
    }
    // A seat marked CPU on the roster is played by the computer. Never seat 0 —
    // somebody has to be playing — and never a remote seat in an online bracket.
    /*
      A slot a real person occupies is never a CPU, whatever the roster says —
      that is a joined peer in a hub session, or seed 2 in a two-machine one.
    */
    const claimed = netIsHub() ? !!peerByEntrant(i) : (net.active && i === 1);
    const isCpu = (!!(game.rosterCpu && game.rosterCpu[i]) && i > 0 && !claimed) ||
                  owner === "cpu";
    if (isCpu) owner = "cpu";
    game.entrants.push({
      id: i,
      name: isCpu ? `CPU ${i}`
                  : cleanName(preset || (i < 2 ? game.names[i] : ""), `PLAYER ${i + 1}`),
      teamIdx: null,          // chosen the first time this entrant plays
      look: null,             // ditto: face + hat, kept for the whole tournament
      alive: true,
      owner,
    });
  }
  game.round = 0;
  game.champion = null;
  game.lastResult = null;
  game.lookOverride = [null, null];
  game.selFixed = [false, false];
  // Randomise the draw once, so who meets whom is different every tournament.
  game.drawOrder = makeDraw(game.entrants.map((e) => e.id));
  game.bracket = [];
  beginRound();
}

function beginRound() {
  const alive = aliveInDrawOrder();
  if (alive.length <= 1) {
    game.champion = alive.length === 1 ? entrantById(alive[0]) : null;
    game.scene = SCENE.CHAMPION;
    netSendBracket();
    return;
  }
  game.round++;
  game.roundPairs = buildPairs(alive);
  game.tieIndex = 0;
  /*
    Record this round in the bracket history, so the screen can draw the whole
    tree rather than only the round in progress. `winner` is filled in as ties
    are decided.
  */
  game.bracket[game.round - 1] = game.roundPairs.map(([a, b]) => ({
    a, b, winner: b === null ? a : null,
  }));
  game.scene = SCENE.BRACKET;
  netSendBracket();
}

/**
 * Advance past any byes, then either seat the next tie or finish the round.
 * A bye advances its entrant without a match being played.
 */
function nextTie() {
  while (game.tieIndex < game.roundPairs.length) {
    const [a, b] = game.roundPairs[game.tieIndex];
    if (b === null) {                    // bye: `a` advances untouched
      game.tieIndex++;
      continue;
    }
    game.seats = [a, b];
    const ea = entrantById(a), eb = entrantById(b);
    game.sel = [ea.teamIdx ?? 0, eb.teamIdx ?? 3];
    /*
      A TEAM IS FOR THE WHOLE TOURNAMENT. Each entrant picks once, the first
      time they play, and carries that team and character to the end. So a seat
      whose entrant has already chosen is FIXED: it is pre-locked and the select
      screen will not let it be changed. When both seats are fixed there is
      nothing left to pick, so the select screen is skipped entirely and the tie
      kicks off straight away.
    */
    const fixed = [ea.teamIdx !== null, eb.teamIdx !== null];
    game.selFixed = fixed;
    game.lookOverride = [ea.look ? { ...ea.look } : null,
                         eb.look ? { ...eb.look } : null];
    game.locked = [...fixed];
    applyTieControl();
    if (fixed[0] && fixed[1]) {
      netSendBracket();       // let the guest see the seats before play starts
      startMatch();
      return;
    }
    game.scene = SCENE.SELECT;
    netSendBracket();
    return;
  }
  // Round complete: eliminate nobody further, just start the next round.
  beginRound();
}

/** Record a finished tie and move the bracket along. */
function resolveTie(winnerSeat, byTime) {
  const winId = game.seats[winnerSeat];
  const loseId = game.seats[1 - winnerSeat];
  const loser = entrantById(loseId);
  if (loser) loser.alive = false;

  // Remember each entrant's chosen team so it persists across rounds.
  for (let s = 0; s < 2; s++) {
    const e = entrantById(game.seats[s]);
    if (e && game.players[s]) e.teamIdx = TEAMS.indexOf(game.players[s].team);
  }

  game.lastResult = {
    winnerId: winId,
    loserId: loseId,
    score: [...game.score],
    byTime,
  };
  // Stamp the result into the bracket history for the tree view.
  const roundRec = game.bracket[game.round - 1];
  if (roundRec && roundRec[game.tieIndex]) {
    roundRec[game.tieIndex].winner = winId;
    roundRec[game.tieIndex].score = [...game.score];
  }
  game.tieIndex++;
  netSendBracket();
}

/* ---- match lifecycle ----------------------------------------------------- */

function startMatch() {
  game.players[0] = new Player(0, TEAMS[game.sel[0]]);
  game.players[1] = new Player(1, TEAMS[game.sel[1]]);
  game.score = [0, 0];
  game.powerups = [];
  game.mines = [];
  game.helpers = [];
  game.bullets = [];
  game.walls = [];
  game.jetpack = 0;
  game.jetpackOwner = -1;
  game.goalFx = null;
  game.goalFxT = 0;
  goalScale = 1;
  game.volleyT = 0;
  resetChaos();               // authored defaults; chaos re-rolls on its timer
  game.particles = [];
  game.puTimer = puInterval();
  game.mineTimer = mineInterval();
  game.matchSecs = TIME_OPTIONS[game.timeIdx];
  game.clock = game.matchSecs;

  /*
    Remember each tournament entrant's team and character as the match starts,
    so every later round reuses them instead of asking again. Recorded here
    rather than when the tie is resolved, because this is the moment the choice
    takes effect.
  */
  if (game.mode === MODE.TOURNAMENT) {
    for (let s = 0; s < 2; s++) {
      const e = entrantById(game.seats[s]);
      if (!e) continue;
      if (e.teamIdx === null) e.teamIdx = game.sel[s];
      if (!e.look) e.look = lookForSeat(s);
      game.lookOverride[s] = { ...e.look };
      game.selFixed[s] = true;
    }
  }

  // Remember the run's teams on the first match, so later stages can reuse them
  // without sending the player back to the select screen.
  if (inRun() && game.run.teamIdx === null) {
    game.run.teamIdx = game.sel[0];
    game.run.cpuTeamIdx = game.sel[1];
  }
  game.ballPowered = false;
  game.ballPoweredBy = -1;
  game.ballLastTouch = -1;
  game.lastBounceSide = -1;
  game.ballSide = -1;
  for (const pl of game.players) if (pl) pl.ai = null;   // fresh AI memory
  game.suddenDeath = false;

  /*
    The 3D arena runs its own simulation over its own state, so it takes over
    here rather than falling through to a kickoff it has no ball for. Everything
    above still applies: teams, the scoreline, the clock and the leaderboard are
    shared with every other mode.
  */
  if (game.mode === MODE.ARENA3D) {
    startArena3D();
    return;
  }
  game.arena = null;         // no stale 3D state behind a 2D match

  // kickoff() ends by calling applyRunPerks(), so the run's pistol and helpers
  // are granted there — after the reset that would otherwise wipe them.
  kickoff(0, false);          // opening kickoff: normal gravity
}

/*
  Grant the run's per-match perks.

  MUST run after `kickoff`, not before: kickoff calls player.reset(), which
  zeroes `ammo` and clears `effects`, and it empties `game.helpers`. Granting
  first meant the GUNSLINGER pistol and the free keeper/striker were handed out
  and then immediately wiped — the player started every stage empty-handed.

  Called from kickoff itself as well, so the perks survive each goal reset too.
*/
function applyRunPerks() {
  if (!inRun()) return;
  const m = game.run.mods;
  const pl = game.players[0];
  if (!pl) return;

  if (m.startAmmo > 0) {
    pl.ammo = m.startAmmo;
    pl.effects.pistol = POWERUPS.pistol.dur;
  }
  if (m.freeKeeper) spawnHelper(0, "keeper");
  if (m.freeStriker) spawnHelper(0, "striker");
}

/**
 * The clock ran out. Whoever leads wins. A draw in a single match is reported
 * as a draw; a draw in a tournament tie MUST produce a winner, so it goes to
 * sudden death (next goal wins, with its own time cap).
 */
function timeExpired() {
  const [a, b] = game.score;
  if (a !== b) {
    finishMatch(a > b ? 0 : 1, true);
    return;
  }
  if (game.mode === MODE.TOURNAMENT) {
    game.suddenDeath = true;
    game.clock = SUDDEN_DEATH_T;
    game.gravAnnounce = 0;
    kickoff(0, true);
    return;
  }
  finishMatch(-1, true);            // -1 = draw, single match only
}

/** End the current match. `winner` is 0, 1, or -1 for a draw. */
function finishMatch(winner, byTime) {
  game.winner = winner;
  game.byTime = !!byTime;
  game.scene = SCENE.WIN;
  game.timer = 0;
  /*
    Every route out of a match passes through here, so this is the one place that
    can guarantee the 3D mode is fully torn down — whether the match ended on
    frags, on the clock, or on a tournament tie being resolved. Clearing the
    arena here rather than at each call site is what stops a match that ended on
    time from leaving a live fighter behind for the next scene to render.
  */
  releaseArenaLock();
  game.arena = null;
  // A guest is only mirroring the host's world; the host records the result so
  // the same match is not counted twice on one machine.
  if (!netIsGuest()) recordResult(winner, game.score);
  if (game.mode === MODE.TOURNAMENT && winner >= 0) resolveTie(winner, byTime);

  /*
    A run stage is decided here. Winning offers an upgrade; anything else — a
    loss or a draw — ends the run. The WIN scene set above is replaced, so the
    player goes straight to the consequence.
  */
  if (inRun()) {
    if (winner === 0) {
      rollOffer();
      game.scene = SCENE.UPGRADE;
    } else {
      endRun();
    }
  }
}

/**
 * Reset for a kickoff. `reroll` is false for the opening kickoff of a match
 * (everyone starts on level terms) and true after a goal, where gravity is
 * re-rolled so each restart plays differently.
 */
function kickoff(towards, reroll = true) {
  if (reroll) {
    game.gravMul = rand(GRAV_MIN_MUL, GRAV_MAX_MUL);
    game.gravAnnounce = 2.6;      // seconds to show the new-gravity banner
  } else {
    game.gravMul = 1;
    game.gravAnnounce = 0;
  }
  gravity = GRAVITY * game.gravMul;

  game.ball = makeBall();
  game.ball.vx = towards * 40;
  if (hasNet()) {
    // Serve over the side that just conceded, well clear of the net, and high
    // enough that it never spawns inside the netting.
    const serveSide = towards <= 0 ? 0 : 1;
    game.ball.x = serveSide === 0 ? W * 0.25 : W * 0.75;
    game.ball.y = Math.min(150, netTop() - 60);
    game.ball.vx = 0;
  }
  game.players[0].reset();
  game.players[1].reset();
  game.powerups = [];
  game.mines = [];
  game.mineTimer = mineInterval();
  game.helpers = [];
  game.bullets = [];
  game.walls = [];
  game.jetpack = 0;
  game.jetpackOwner = -1;
  game.goalFx = null;
  game.goalFxT = 0;
  if (!game.chaos) goalScale = 1;    // chaos keeps its rolled goal size
  game.volleyT = 0;
  game.ballPowered = false;
  game.ballPoweredBy = -1;
  game.ballLastTouch = -1;
  game.lastBounceSide = -1;
  game.ballSide = -1;
  game.timer = COUNTDOWN_T;
  game.scene = SCENE.COUNTDOWN;

  /*
    Re-grant the run's perks: this function just reset both players and emptied
    the helper list, so without this a GUNSLINGER pistol or a free keeper would
    disappear the first time anyone scored.
  */
  applyRunPerks();
}

function burst(x, y, color, n = 34) {
  if (!game.opt.particles) return;      // honour the setting at the source
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(60, 420);
    game.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120,
      life: rand(0.5, 1.3), max: 1.3, color, r: rand(2, 5),
    });
  }
}

function scoreGoal(side) {
  // side === -1: ball entered the LEFT goal, so the right player (P2) scored.
  const scorer = side === -1 ? 1 : 0;
  game.score[scorer]++;
  game.lastScorer = scorer;
  /*
    Conceding is the biggest single charge in the game, so a player who is behind
    builds toward their power fastest. A comeback mechanic rather than a reward
    for winning: the leader would otherwise snowball.
  */
  superGain(game.players[1 - scorer], SUPER_GAIN_CONCEDE * (game.rules.superRate || 1));
  game.scene = SCENE.CELEBRATE;
  game.timer = CELEBRATE_T;
  game.shake = 0.45;
  game.flash = 0.4;
  burst(game.ball.x, game.ball.y, game.players[scorer].team.color, 46);

  // Sudden death: the first goal settles a drawn knockout tie immediately.
  if (game.suddenDeath) {
    finishMatch(scorer, false);
    return;
  }
  if (game.score[scorer] >= game.goalsToWin) finishMatch(scorer, false);
}

/**
 * Volleyball point. Shares the celebration/win path with scoreGoal so the
 * clock, sudden death and match-end rules behave identically.
 */
function scoreVolleyPoint(scorer) {
  game.score[scorer]++;
  game.lastScorer = scorer;
  game.scene = SCENE.CELEBRATE;
  game.timer = CELEBRATE_T;
  game.shake = 0.4;
  game.flash = 0.32;
  burst(game.ball.x, GROUND_Y - 10, game.players[scorer].team.color, 38);

  if (game.suddenDeath) { finishMatch(scorer, false); return; }
  if (game.score[scorer] >= game.goalsToWin) finishMatch(scorer, false);
}

/* ---- power-up lifecycle -------------------------------------------------- */

/* ---- mines ---------------------------------------------------------------- */

function spawnMine() {
  // Keep mines out of both goal mouths so they can't make a goal unavoidable.
  game.mines.push({
    x: rand(WALL + MINE_SAFE_X, W - WALL - MINE_SAFE_X),
    y: GROUND_Y - MINE_R,
    arm: MINE_ARM,          // counts down; not dangerous until 0
    life: MINE_LIFE,
    pulse: rand(0, Math.PI * 2),
  });
}

/** Detonate a mine: stun+fling any player, launch the ball. */
function detonateMine(m, i) {
  game.mines.splice(i, 1);
  game.shake = Math.max(game.shake, 0.5);
  burst(m.x, m.y, "#ff8a3d", 30);
  burst(m.x, m.y, "#ffd166", 18);
}

function updateMines(dt) {
  game.mineTimer -= dt;
  if (game.mineTimer <= 0) {
    if (game.rules.mineRate > 0 && game.mines.length < mineCap()) spawnMine();
    game.mineTimer = mineInterval();
  }

  for (let i = game.mines.length - 1; i >= 0; i--) {
    const m = game.mines[i];
    m.pulse += dt * 4;
    if (m.arm > 0) { m.arm -= dt; continue; }     // still arming: harmless
    m.life -= dt;
    if (m.life <= 0) { game.mines.splice(i, 1); continue; }

    // Player contact: stun and fling away from the blast.
    let blown = false;
    for (const pl of game.players) {
      if (len(pl.x - m.x, pl.y - m.y) < pl.r + MINE_R) {
        pl.stun = MINE_STUN;
        const away = pl.x >= m.x ? 1 : -1;
        pl.vx = away * MINE_KNOCK;
        pl.vy = -MINE_KNOCK * 0.8;
        pl.onGround = false;
        pl.kickT = 0;
        detonateMine(m, i);
        blown = true;
        break;
      }
    }
    if (blown) continue;

    // Ball contact: launch it violently, biased upward and away.
    const b = game.ball;
    if (len(b.x - m.x, b.y - m.y) < b.r + MINE_R) {
      const away = b.x >= m.x ? 1 : -1;
      b.vx = away * MINE_BALL_V * rand(0.5, 0.9);
      b.vy = -MINE_BALL_V * rand(0.75, 1);
      limitSpeed(b, BALL_MAX_V);
      detonateMine(m, i);
    }
  }
}

function spawnPowerup() {
  const type = PU_KEYS[(Math.random() * PU_KEYS.length) | 0];
  game.powerups.push({
    type,
    x: rand(W * 0.2, W * 0.8),
    y: rand(PU_Y_HIGH, PU_Y_LOW),
    life: puLifetime(),
    bob: rand(0, Math.PI * 2),
  });
}

function updatePowerups(dt) {
  game.puTimer -= dt;
  if (game.puTimer <= 0) {
    // Re-check the rule here: a timer armed before the player set the rate to
    // zero would otherwise fire one last time after spawning was turned off.
    if (game.rules.puRate > 0 && game.powerups.length < puCap()) spawnPowerup();
    game.puTimer = puInterval();
  }

  for (let i = game.powerups.length - 1; i >= 0; i--) {
    const p = game.powerups[i];
    p.life -= dt;
    p.bob += dt * 3;
    if (p.life <= 0) { game.powerups.splice(i, 1); continue; }

    for (const pl of game.players) {
      if (len(pl.x - p.x, pl.y - p.y) < pl.r + PU_R) {
        pl.grant(p.type);
        burst(p.x, p.y, POWERUPS[p.type].color, 18);
        game.powerups.splice(i, 1);
        break;
      }
    }
  }
}

/* ---- AI helpers (goalkeeper / striker) ----------------------------------- */

/**
 * Spawn (or refresh) a helper of `kind` owned by player `owner`.
 * Only one helper of each kind per player.
 */
function spawnHelper(owner, kind) {
  const existing = game.helpers.find((h) => h.owner === owner && h.kind === kind);
  if (existing) { existing.life = POWERUPS[kind].dur; return existing; }

  const ownGoalX = owner === 0 ? WALL : W - WALL;
  const h = {
    owner,
    kind,
    // Keeper starts on its own goal line; striker starts near its owner.
    x: kind === "keeper"
      ? (owner === 0 ? ownGoalX + HELP_KEEP_X : ownGoalX - HELP_KEEP_X)
      : clamp(game.players[owner].x + (owner === 0 ? 90 : -90), WALL + HELP_R, W - WALL - HELP_R),
    y: GROUND_Y - HELP_R,
    vx: 0,
    vy: 0,
