      const { ix, iy } = kickImpulse(offX, b.y - pl.y, dir, power, proximity, up);
      b.vx = ix + pl.vx * 0.3;
      b.vy = iy + pl.vy * 0.2;
      // Guarantee lift: a kick always sends the ball up, never along the floor.
      // The floor scales with the TEAM's shot power (so Shot still shapes the
      // arc) but ignores the Power Shot multiplier, which stays flat and fast.
      const lift = KICK_LIFT_MIN * (pl.shotP / KICK_BASE) * (hasPower ? 0.8 : 1);
      b.vy = Math.min(b.vy, -lift);
      limitSpeed(b, BALL_MAX_V);
      pl.kickConsumed = true;
      game.shake = Math.max(game.shake, 0.12 + proximity * 0.1);
      burst(b.x, b.y, "#ffffff", 8);
    }
  }
}

/* ------------------------------------------------------- 9. UPDATE + LOOP */

/**
 * Setup screen. Either player can drive it: up/down picks a row, left/right
 * changes that row's value, kick activates START.
 */
function updateMenu(dt) {
  stepMenuFx(dt);          // the attract scene animates while you browse

  const up = hit(SCHEME[0].up) || hit(SCHEME[1].up);
  const down = hit(SCHEME[0].down) || hit(SCHEME[1].down);
  const left = hit(SCHEME[0].left) || hit(SCHEME[1].left);
  const right = hit(SCHEME[0].right) || hit(SCHEME[1].right);
  const go = kickHit(0) || kickHit(1) || hit("Space");

  // Rows: the player count only applies to tournament mode, so skip it in single.
  const rows = menuRows();
  game.menuRow = clamp(game.menuRow, 0, rows.length - 1);
  if (up)   game.menuRow = (game.menuRow + rows.length - 1) % rows.length;
  if (down) game.menuRow = (game.menuRow + 1) % rows.length;

  const row = rows[game.menuRow];
  const step = (left ? -1 : right ? 1 : 0);

  /*
    The bottom four entries are drawn as a horizontal strip of buttons, so
    left/right must walk ALONG that strip rather than doing nothing. Without
    this the arrows felt dead exactly where the layout implies they should work.
  */
  const STRIP = ["rules", "online", "board", "settings"];
  if (step !== 0 && row === "start") {
    // Left from START steps back onto the strip; right stays put.
    if (step < 0) {
      const visible = STRIP.filter((k) => rows.includes(k));
      if (visible.length) game.menuRow = rows.indexOf(visible[visible.length - 1]);
    }
    return;
  }
  if (step !== 0 && STRIP.includes(row)) {
    const visible = STRIP.filter((k) => rows.includes(k));
    const at = visible.indexOf(row);
    const next = at + step;
    if (next >= 0 && next < visible.length) {
      game.menuRow = rows.indexOf(visible[next]);
    } else if (next >= visible.length) {
      game.menuRow = rows.indexOf("start");      // off the right end -> START
    }
    return;
  }

  if (step !== 0) {
    switch (row) {
      case "mode": {
        const i = MODE_ORDER.indexOf(game.mode);
        game.mode = MODE_ORDER[(i + step + MODE_ORDER.length) % MODE_ORDER.length];
        break;
      }
      case "chaos":
        game.chaos = !game.chaos;
        break;
      case "map": {
        const i = MAPS.findIndex((m) => m.id === game.mapId);
        game.mapId = MAPS[(i + step + MAPS.length) % MAPS.length].id;
        break;
      }
      case "opponent":
        // P2 is either a second human or the CPU. P1 is always human.
        game.cpu = [false, !game.cpu[1]];
        break;
      case "cpulevel":
        game.cpuLevel = clamp(game.cpuLevel + step, 0, CPU_LEVELS.length - 1);
        break;
      case "online":
        // Entering the online screen; the actual connect happens there.
        break;
      case "name1":
      case "name2":
        game.editing = row === "name1" ? 0 : 1;
        break;
      case "players":
        game.entrantCount = clamp(game.entrantCount + step, TOURN_MIN, TOURN_MAX);
        break;
      case "goals":
        game.goalsToWin = clamp(game.goalsToWin + step, GOALS_MIN, GOALS_MAX);
        break;
      case "time":
        game.timeIdx = clamp(game.timeIdx + step, 0, TIME_OPTIONS.length - 1);
        game.matchSecs = TIME_OPTIONS[game.timeIdx];
        break;
    }
  }

  if (go && (row === "name1" || row === "name2")) {
    game.editing = row === "name1" ? 0 : 1;
    return;
  }

  if (go && row === "rules") {
    game.rulesFrom = SCENE.MENU;
    game.rulesRow = 0;
    game.scene = SCENE.RULES;
    return;
  }

  if (go && row === "controls") {
    game.ctrlFrom = SCENE.MENU;
    game.ctrlSeat = 0;
    game.ctrlRow = 0;
    game.ctrlBinding = null;
    game.scene = SCENE.CONTROLS;
    return;
  }

  if (go && row === "credits") {
    game.creditsFrom = SCENE.MENU;
    game.creditsScroll = 0;
    game.scene = SCENE.CREDITS;
    return;
  }

  if (go && row === "roguelike") {
    startRun();
    return;
  }

  if (go && row === "board") {
    game.boardFrom = SCENE.MENU;
    game.boardScroll = 0;
    game.scene = SCENE.BOARD;
    return;
  }

  if (go && row === "settings") {
    game.settingsFrom = SCENE.MENU;
    game.settingsRow = 0;
    game.scene = SCENE.SETTINGS;
    return;
  }

  if (go && row === "online") {
    if (typeof RTCPeerConnection === "undefined") {
      net.error = "this browser has no WebRTC support";
    } else {
      netReset();
      game.scene = SCENE.ONLINE;
    }
    return;
  }

  if (go && row === "start") {
    if (game.mode === MODE.TOURNAMENT) {
      // Name everyone first, so the bracket is readable.
      game.rosterNames = [];
      game.rosterCpu = [];
      for (let i = 0; i < game.entrantCount; i++) {
        game.rosterNames.push(i < 2 ? cleanName(game.names[i], `PLAYER ${i + 1}`)
                                    : `PLAYER ${i + 1}`);
        // Default: seats beyond the first two are CPUs, so a big bracket is
        // playable straight away without naming eight people.
        game.rosterCpu.push(i >= 2);
      }
      game.rosterEdit = -1;
      game.rosterCursor = 0;
      game.scene = SCENE.ROSTER;
      return;
    }
    // SINGLE, VOLLEY, TENNIS and BASKET all go straight to team selection.
    game.seats = [null, null];
    game.sel = [0, 3];
    game.locked = [false, false];
    game.lookOverride = [null, null];
    game.selFixed = [false, false];
    game.scene = SCENE.SELECT;
  }
}

/**
 * Connection screen. Deliberately keyboard-only so it matches the rest of the
 * game: H hosts, J joins, V pastes from the clipboard, C copies your code,
 * ENTER accepts a pasted code, ESC backs out.
 */
function updateOnline(dt) {
  if (hit("Escape")) { escUsed = true; netReset(); game.scene = SCENE.MENU; return; }

  /*
    RELAY entry. A field having the keyboard means ENTER submits it, so the two
    address-based actions are driven from here rather than from a hotkey the
    player would have to know about while typing.
  */
  if (net.relayGo) {
    const which = net.relayGo;
    net.relayGo = null;
    if (net.relayIntent === "host") { relayHost(net.relayAddr); return; }
    if (net.relayIntent === "join") {
      // Address first, then the code: submitting the address moves the cursor on
      // rather than trying to join a room the player has not named yet.
      if (which === "addr" && !net.relayCode) { net.editing = "code"; return; }
      relayJoin(net.relayAddr, net.relayCode);
      return;
    }
  }
  if (net.editing) return;               // the keyboard belongs to the field

  if (net.state === "idle" || net.state === "failed") {
    if (hit("KeyH")) { netHost(); return; }
    if (hit("KeyJ")) { net.state = "await-offer"; net.paste = ""; return; }
    // A — host by address. S — join by address. Both use the relay.
    if (hit("KeyA")) {
      net.relayIntent = "host";
      net.relayAddr = net.relayAddr || `localhost:${RELAY_PORT_DEFAULT}`;
      net.editing = "addr";
      net.error = "";
      return;
    }
    if (hit("KeyS")) {
      net.relayIntent = "join";
      net.relayCode = "";
      net.editing = "addr";
      net.error = "";
      return;
    }
    // A lobby hosts a whole tournament rather than a single opponent.
    if (hit("KeyL")) {
      net.role = "host";
      net.active = true;
      net.localSeat = 0;
      net.remoteSeat = 1;
      net.myEntrant = 0;
      game.mode = MODE.TOURNAMENT;
      netOpenSlot();
      return;
    }
  }

  /*
    LOBBY. The host pastes each joiner's answer as it arrives; every accepted
    answer seats that player and rolls the code on for the next one. START is
    host-only — a joiner pressing it would build a rival bracket of its own.
  */
  if (net.state === "lobby" && netIsHost()) {
    if (net.paste && hit("Enter")) { netAcceptJoiner(net.paste); net.paste = ""; return; }
    if (kickHit(0) || hit("Space")) {
      if (net.peers.length === 0) {
        net.error = "nobody has joined yet";
        return;
      }
      startLobbyTournament();
      return;
    }
  }

  // Waiting for the user to paste the other side's code.
  if (net.state === "await-offer" && net.paste && hit("Enter")) {
    netJoin(net.paste);
    return;
  }
  if (net.state === "offer" && net.paste && hit("Enter")) {
    netAcceptAnswer(net.paste);
    return;
  }

  // Once live, the host starts the match for both machines.
  if (net.state === "live" && netIsHost() && (kickHit(0) || hit("Space"))) {
    netSendConfig();
    if (game.mode === MODE.TOURNAMENT) {
      // Name the field first; the bracket then syncs to the guest.
      game.rosterNames = [];
      game.rosterCpu = [];
      for (let i = 0; i < game.entrantCount; i++) {
        game.rosterNames.push(i === 0 ? cleanName(game.names[0], "PLAYER 1")
                            : i === 1 ? (game.remoteName || "PLAYER 2")
                            : `PLAYER ${i + 1}`);
        // Seats 0 and 1 are the two humans online; the rest default to CPUs.
        game.rosterCpu.push(i >= 2);
      }
      game.rosterEdit = -1;
      game.rosterCursor = 0;
      game.scene = SCENE.ROSTER;
      return;
    }
    game.cpu = [false, false];
    startMatch();
    netSendConfig();
    return;
  }
}

/**
 * HOST: begin the tournament with whoever is in the lobby.
 *
 * The bracket is sized to the people present, rounded up to leave room for the
 * CPUs that fill any unclaimed slot, so a half-full lobby still plays.
 */
function startLobbyTournament() {
  if (!netIsHost()) return;                 // host-authoritative, always
  game.mode = MODE.TOURNAMENT;
  /*
    BRACKET SIZE. Two real people are enough to start; the rest of the bracket is
    filled with CPUs so a small turnout still plays a proper tournament instead of
    a single tie.

    The player's chosen BRACKET SIZE from the setup menu is honoured whenever it
    is large enough to seat everyone who actually turned up — so a host who asked
    for eight gets eight, with computers making up the numbers.
  */
  const human = net.peers.length + 1;
  game.entrantCount = clamp(Math.max(game.entrantCount, human, TOURN_MIN),
                            TOURN_MIN, TOURN_MAX);
  game.rosterNames = [];
  game.rosterCpu = [];
  for (let i = 0; i < game.entrantCount; i++) {
    if (i === 0) {
      game.rosterNames.push(cleanName(game.names[0], "PLAYER 1"));
      game.rosterCpu.push(false);
    } else {
      const peer = peerByEntrant(i);
      game.rosterNames.push(peer ? cleanName(peer.name, `PLAYER ${i + 1}`)
                                 : `CPU ${i}`);
      game.rosterCpu.push(!peer);
    }
  }
  netSendConfig();
  startTournament();
}

/** Roster screen: name every tournament entrant before the bracket begins. */
function updateRoster(dt) {
  if (game.rosterEdit >= 0) return;            // keydown handles typing

  if (hit("Escape")) { escUsed = true; game.scene = SCENE.MENU; return; }

  const n = game.entrantCount;
  if (hit(SCHEME[0].down) || hit(SCHEME[1].down)) game.rosterCursor = (game.rosterCursor + 1) % (n + 1);
  if (hit(SCHEME[0].up) || hit(SCHEME[1].up)) game.rosterCursor = (game.rosterCursor + n) % (n + 1);

  /*
    Left/right marks the highlighted entrant as a human or the computer, so a
    bracket can be filled out without needing a person for every seat.
    Seat 1 is pinned human: somebody has to be playing.
  */
  const i = game.rosterCursor;
  if (i < n && i > 0 && (hit(SCHEME[0].left) || hit(SCHEME[0].right) ||
                         hit(SCHEME[1].left) || hit(SCHEME[1].right))) {
    game.rosterCpu[i] = !game.rosterCpu[i];
  }

  if (kickHit(0) || kickHit(1) || hit("Space") || hit("Enter")) {
    if (game.rosterCursor === n) {              // the START row
      startTournament();
    } else if (game.rosterCpu[game.rosterCursor]) {
      // A CPU entrant has no name to type; toggle it back to human instead.
      game.rosterCpu[game.rosterCursor] = false;
    } else {
      game.rosterEdit = game.rosterCursor;
    }
  }
}

/** Scenes during which ESC should open the pause overlay. */
const PAUSABLE = new Set([SCENE.COUNTDOWN, SCENE.PLAY, SCENE.CELEBRATE,
                          SCENE.ARENA3D]);

/**
 * Open the pause overlay, remembering what it interrupted.
 * Online play cannot truly be frozen — the peer keeps simulating — so there it
 * behaves as a non-blocking overlay and says so rather than pretending.
 */
function openPause() {
  game.pauseFrom = game.scene;
  game.pauseRow = 0;
  game.scene = SCENE.PAUSE;
  releaseCPUKeys();
  /*
    Hand the mouse back the moment the game is paused. A pause overlay the player
    cannot click away from, with the cursor still captured, is indistinguishable
    from a frozen game — the single worst failure this mode could ship.
  */
  releaseArenaLock();
  // Drop any held input so a key held at the moment of pausing doesn't
  // keep steering when play resumes.
  for (const a of intent) {
    a.left = a.right = a.up = a.down = a.kick = a.kickEdge = false;
    a.aimX = a.aimY = 0;
    a.jump = a.dashEdge = false;
  }
}

function closePause() {
  game.scene = game.pauseFrom || SCENE.PLAY;
  game.pauseFrom = null;
}

/**
 * Flip the music on or off: silence it now, and remember the choice.
 *
 * Shared by the pause row and the settings row so the two can never disagree.
 * Turning it back on does NOT start a track here — the frame loop picks the
 * right one for the current scene on its next pass.
 */
function toggleMusic() {
  game.opt.music = !game.opt.music;
  saveOpts(game.opt);
  if (!game.opt.music) musicStop();
}

/** Leave a match entirely and return to the setup menu. */
function quitToMenu() {
  game.scene = SCENE.MENU;
  game.pauseFrom = null;
  game.locked = [false, false];
  game.suddenDeath = false;
  game.editing = -1;
  // Quitting is an exit from the 3D mode too: drop the arena and the mouse.
  game.arena = null;
  releaseArenaLock();
  if (net.active) netReset();      // a match abandoned online drops the link
}

function updatePause(dt) {
  const up = hit(SCHEME[0].up) || hit(SCHEME[1].up);
  const down = hit(SCHEME[0].down) || hit(SCHEME[1].down);
  const left = hit(SCHEME[0].left) || hit(SCHEME[1].left);
  const right = hit(SCHEME[0].right) || hit(SCHEME[1].right);
  const go = kickHit(0) || kickHit(1) || hit("Space") || hit("Enter");

  if (hit("Escape")) { escUsed = true; closePause(); return; }
  if (up) game.pauseRow = (game.pauseRow + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length;
  if (down) game.pauseRow = (game.pauseRow + 1) % PAUSE_ITEMS.length;

  /*
    The MUSIC row is a toggle, so left/right work on it as well as kick — an
    ON/OFF pill that only answered to one of the two would read as broken.
  */
  if (PAUSE_ITEMS[game.pauseRow] === "music" && (left || right)) {
    toggleMusic();
    return;
  }

  if (!go) return;
  switch (PAUSE_ITEMS[game.pauseRow]) {
    case "resume":
      closePause();
      break;
    case "music":
      toggleMusic();
      break;
    case "settings":
      game.settingsFrom = SCENE.PAUSE;
      game.settingsRow = 0;
      game.scene = SCENE.SETTINGS;
      break;
    case "board":
      game.boardFrom = SCENE.PAUSE;
      game.boardScroll = 0;
      game.scene = SCENE.BOARD;
      break;
    case "restart":
      // Same rules and teams, fresh scoreline.
      game.pauseFrom = null;
      startMatch();
      break;
    case "quit":
      quitToMenu();
      break;
  }
}

function updateSettings(dt) {
  const up = hit(SCHEME[0].up) || hit(SCHEME[1].up);
  const down = hit(SCHEME[0].down) || hit(SCHEME[1].down);
  const left = hit(SCHEME[0].left) || hit(SCHEME[1].left);
  const right = hit(SCHEME[0].right) || hit(SCHEME[1].right);
  const go = kickHit(0) || kickHit(1) || hit("Space") || hit("Enter");

  const leave = () => {
    saveOpts(game.opt);
    game.scene = game.settingsFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.settingsFrom = null;
  };

  if (hit("Escape")) { escUsed = true; leave(); return; }
  if (up) game.settingsRow = (game.settingsRow + SETTINGS_ITEMS.length - 1) % SETTINGS_ITEMS.length;
  if (down) game.settingsRow = (game.settingsRow + 1) % SETTINGS_ITEMS.length;

  const row = SETTINGS_ITEMS[game.settingsRow];
  const toggled = go || left || right;
  if (!toggled) return;

  switch (row) {
    case "music":
      toggleMusic();
      break;
    case "gamepad":   game.opt.gamepad = !game.opt.gamepad; saveOpts(game.opt); break;
    case "shake":     game.opt.shake = !game.opt.shake; saveOpts(game.opt); break;
    case "particles": game.opt.particles = !game.opt.particles; saveOpts(game.opt); break;
    case "flash":     game.opt.flash = !game.opt.flash; saveOpts(game.opt); break;
    case "sfxhint":   game.opt.hints = !game.opt.hints; saveOpts(game.opt); break;
    case "back":      if (go) leave(); break;
  }
}

const LB_ROWS_VISIBLE = 9;

function updateBoard(dt) {
  const ranked = rankBoard(game.board);
  const maxScroll = Math.max(0, ranked.length - LB_ROWS_VISIBLE);
  // Clamp unconditionally: the table can shrink between visits (or be set from
  // elsewhere), so a stale scroll offset must correct itself immediately.
  game.boardScroll = clamp(game.boardScroll, 0, maxScroll);

  if (hit("Escape")) {
    escUsed = true;
    game.scene = game.boardFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.boardFrom = null;
    return;
  }
  if (hit(SCHEME[0].down) || hit(SCHEME[1].down)) {
    game.boardScroll = Math.min(maxScroll, game.boardScroll + 1);
  }
  if (hit(SCHEME[0].up) || hit(SCHEME[1].up)) {
    game.boardScroll = Math.max(0, game.boardScroll - 1);
  }
  // Kick or ENTER also leaves, so the screen is never a dead end.
  if (kickHit(0) || kickHit(1) || hit("Enter") || hit("Space")) {
    game.scene = game.boardFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.boardFrom = null;
  }
}

/** Spawn-rate screen. Every row is driven by RULE_DEFS, including its range. */
function updateRules(dt) {
  const rowsN = RULE_DEFS.length + 2;           // + RESET + BACK
  const up = hit(SCHEME[0].up) || hit(SCHEME[1].up);
  const down = hit(SCHEME[0].down) || hit(SCHEME[1].down);
  const left = hit(SCHEME[0].left) || hit(SCHEME[1].left);
  const right = hit(SCHEME[0].right) || hit(SCHEME[1].right);
  const go = kickHit(0) || kickHit(1) || hit("Enter") || hit("Space");

  const leave = () => {
    saveRules(game.rules);
    game.scene = game.rulesFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.rulesFrom = null;
  };

  if (hit("Escape")) { escUsed = true; leave(); return; }
  if (up) game.rulesRow = (game.rulesRow + rowsN - 1) % rowsN;
  if (down) game.rulesRow = (game.rulesRow + 1) % rowsN;

  const i = game.rulesRow;
  if (i === RULE_DEFS.length) {                 // RESET
    if (go) { game.rules = { ...RULE_DEFAULTS }; saveRules(game.rules); }
    return;
  }
  if (i === RULE_DEFS.length + 1) {             // BACK
    if (go) leave();
    return;
  }

  const d = RULE_DEFS[i];
  if (d.type === "flag") {
    if (left || right || go) {
      game.rules[d.key] = !game.rules[d.key];
      saveRules(game.rules);
    }
    return;
  }
  const step = (right ? d.step : left ? -d.step : 0);
  if (step) {
    game.rules[d.key] = clampRule(d.key, game.rules[d.key] + step);
    saveRules(game.rules);
  }
}

/** Upgrade choice between run stages. */
function updateUpgrade(dt) {
  const n = game.run.offer.length;
  if (!n) { beginRunStage(false); return; }
  if (hit(SCHEME[0].left) || hit(SCHEME[0].up)) {
    game.run.offerRow = (game.run.offerRow + n - 1) % n;
  }
  if (hit(SCHEME[0].right) || hit(SCHEME[0].down)) {
    game.run.offerRow = (game.run.offerRow + 1) % n;
  }
  if (kickHit(0) || hit("Enter") || hit("Space")) {
    takeUpgrade(game.run.offer[game.run.offerRow]);
  }
}

/** Run over, or run cleared. Either way, back to the menu. */
function updateRunEnd(dt) {
  if (kickHit(0) || hit("Enter") || hit("Space") || hit("Escape")) {
    escUsed = true;
    game.run = null;
    game.cpu = [false, false];
    game.scene = SCENE.MENU;
  }
}

/** Controls screen: choose a seat, rebind an action, or reset. */
function updateControls(dt) {
  if (game.ctrlBinding) return;                // the keydown handler owns input

  const rowsN = ACTIONS.length + 2;            // + RESET + BACK
  const leave = () => {
    saveScheme();
    game.scene = game.ctrlFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.ctrlFrom = null;
  };

  if (hit("Escape")) { escUsed = true; leave(); return; }
  if (hit("ArrowDown") || hit("KeyS")) game.ctrlRow = (game.ctrlRow + 1) % rowsN;
  if (hit("ArrowUp") || hit("KeyW")) game.ctrlRow = (game.ctrlRow + rowsN - 1) % rowsN;
  // Left/right switches which player is being edited.
  if (hit("ArrowLeft") || hit("ArrowRight") || hit("KeyA") || hit("KeyD")) {
    game.ctrlSeat = 1 - game.ctrlSeat;
  }

  const go = hit("Enter") || hit("Space");
  if (!go) return;

  if (game.ctrlRow === ACTIONS.length) { resetScheme(); return; }      // RESET
  if (game.ctrlRow === ACTIONS.length + 1) { leave(); return; }        // BACK
  game.ctrlBinding = { seat: game.ctrlSeat, action: ACTIONS[game.ctrlRow].key };
}

/** Credits screen. */
function updateCredits(dt) {
  game.creditsScroll += dt;
  if (hit("Escape") || hit("Enter") || hit("Space") || kickHit(0) || kickHit(1)) {
    escUsed = true;
    game.scene = game.creditsFrom === SCENE.PAUSE ? SCENE.PAUSE : SCENE.MENU;
    game.creditsFrom = null;
  }
}

function updateSelect(dt) {
  /*
    ESC returns to the setup menu. This screen had no way out at all — a keyboard
    player was stuck here until both seats locked in, and on a touch device there
    is no ESC key to press, which is why the BACK button exists too.
  */
  if (hit("Escape")) {
    escUsed = true;
    game.locked = [false, false];
    if (game.mode === MODE.TOURNAMENT) { game.scene = SCENE.BRACKET; return; }
    game.scene = SCENE.MENU;
    return;
  }

  // A CPU seat picks a team for itself and locks in, so the human only chooses
  // once. Re-rolled each time the screen is entered for variety.
  for (let i = 0; i < 2; i++) {
    if (game.cpu[i] && !game.locked[i]) {
      game.sel[i] = (Math.random() * TEAMS.length) | 0;
      game.locked[i] = true;
    }
  }

  for (let i = 0; i < 2; i++) {
    if (game.cpu[i]) continue;          // CPU seats are already locked
    /*
      A seat FIXED by the tournament has already had its team and character
      chosen in an earlier round and keeps them to the end, so it ignores the
      keyboard here entirely — it cannot be moved, and kick cannot un-ready it.
    */
    if (seatFixed(i)) { game.locked[i] = true; continue; }
    const S = SCHEME[i];

    // A locked player can change their mind: kick un-readies, and a direction
    // both un-readies AND moves the cursor, so one press does what it looks like.
    if (game.locked[i]) {
      const moved = hit(S.left) || hit(S.right) || hit(S.up) || hit(S.down);
      if (moved || kickHit(i)) game.locked[i] = false;
      if (!moved) continue;        // fall through so the move applies below
    }

    /*
      Three rows per player: TEAM, FACE, HAT. Up/down changes row, left/right
      changes the value on that row. Kick locks in. The team row keeps its
      original wrap-by-4 feel by stepping a whole row of the team grid.
    */
    if (hit(S.up))   game.lookRow[i] = (game.lookRow[i] + 2) % 3;
    if (hit(S.down)) game.lookRow[i] = (game.lookRow[i] + 1) % 3;

    const step = hit(S.left) ? -1 : hit(S.right) ? 1 : 0;
    if (step !== 0) {
      if (game.lookRow[i] === 0) {
        game.sel[i] = (game.sel[i] + step + TEAMS.length) % TEAMS.length;
      } else if (game.lookRow[i] === 1) {
        const k = FACES.findIndex((f) => f.id === lookForSeat(i).face);
        game.looks[i].face = FACES[(k + step + FACES.length) % FACES.length].id;
        saveLooks(game.looks);
      } else {
        const k = HATS.findIndex((h) => h.id === lookForSeat(i).hat);
        game.looks[i].hat = HATS[(k + step + HATS.length) % HATS.length].id;
        saveLooks(game.looks);
      }
      // Editing a look drops any inherited override: this seat is choosing now.
      if (game.lookRow[i] !== 0) game.lookOverride[i] = null;
    }
    if (kickHit(i)) game.locked[i] = true;
  }

  if (game.locked[0] && game.locked[1]) {
    game.locked = [false, false];
    startMatch();
  }
}

function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    p.vy += GRAVITY * 0.35 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

/* ------------------------------------------------- 8b. 3D ARENA MODE

   A third-person deathmatch. Entirely separate from the 2D simulation above:
   it owns `game.arena` and never touches the ball, the pitch or the walls.

   Everything is in world units, y UP, floor at y = 0. The 2D game's px/s
   feel is deliberately kept — a fighter runs at a similar pace to a 2D
   player, so the two halves of the game are recognisably the same game.
*/

/*
  The pitch. Longer than it is wide, like a real one: goals face each other down
  the z axis, so "downfield" is +z for one player and -z for the other.
*/
const ARENA_HW = 520;         // half-width  (x from -520 to 520)
const ARENA_HD = 760;         // half-depth  (z from -760 to 760) — the long axis
const ARENA_WALL_H = 210;     // enclosing wall height

/*
  3D GOALS. One at each end of the long axis, recessed into the end wall so the
  ball has somewhere to go rather than merely crossing a line.

  A goal is scored when the ball's CENTRE passes the goal line between the posts
  and under the bar — the same rule the 2D game uses, so the two modes agree on
  what a goal is.
*/
const A_GOAL_W = 300;         // mouth width  (x from -150 to 150)
const A_GOAL_H = 150;         // crossbar height
const A_GOAL_D = 90;          // how deep the net is recessed
const A_POST_R = 8;           // post and crossbar radius
const A_BALL_R = 26;          // the ball is big enough to see at a distance
const A_BALL_REST = 0.62;     // bounce off the floor
const A_BALL_DRAG = 0.42;     // air drag, so a shot slows realistically
const A_BALL_GRAV = 1250;     // a little floatier than the players
const A_BALL_MAX_V = 1900;
const A_KICK_V = 1050;        // base kick speed
const A_KICK_UP = 0.34;       // fraction of a kick directed upward
const A_KICK_REACH = 62;      // how far in front of the player a kick connects
const A_KICK_CD = 0.32;
const A_BALL_SPIN = 0.86;     // how much of the kicker's motion the ball carries

/*
  GRAB. Holding the ball rather than kicking it: it locks to a point ahead of the
  chest and travels with you until you throw it, are knocked down, or the hold
  timer runs out.

  Deliberately time-limited. An unlimited carry turns 3D soccer into rugby and
  removes any reason to pass, so a hold expires and the ball drops. The cooldown
  after a throw stops grab-throw-grab being a faster dribble than dribbling.
*/
const A_GRAB_T = 3.2;         // seconds you may hold the ball
const A_GRAB_CD = 1.1;        // before you may grab again
const A_GRAB_REACH = 46;      // how close the ball must be to take hold
const A_GRAB_FWD = 40;        // how far ahead of the chest it is carried
const A_THROW_V = 1150;       // a thrown ball is faster than a kicked one
const A_THROW_UP = 0.3;

/*
  JETPACK. Held thrust while fuel lasts, refilling on the ground. Its purpose in
  a soccer mode is vertical reach — heading a high ball, or defending a lofted
  shot — rather than flight, which is why fuel is short and thrust barely beats
  gravity.
*/
const A_JET_MAX = 2.4;        // seconds of fuel
const A_JET_THRUST = 2350;    // upward acceleration while held
const A_JET_REFILL = 0.85;    // fuel per second, on the ground
const A_JET_VMAX = 470;       // upward speed cap, so it cannot be ridden to orbit

/*
  WALLS. The 2D build mechanic, brought across: a slab raised in front of you that
  blocks the ball and the opponent, decays on a timer and can be broken by a hard
  shot. Charges recharge, so it is a rationed defensive tool rather than a way to
  brick up your own goal — see arenaCanBuild for the goalmouth rule.
*/
const A_WALL_W = 190;         // across
const A_WALL_H = 130;         // tall
const A_WALL_D = 22;          // thick
const A_WALL_LIFE = 9;        // seconds before it fades
const A_WALL_HP = 3;          // hard hits it survives
const A_WALL_CHARGES = 2;     // walls you may have standing at once
const A_WALL_CD = 0.7;        // between builds
const A_WALL_RECHARGE = 6;    // seconds to earn a charge back
const A_WALL_AHEAD = 105;     // how far in front of the builder it stands
const A_WALL_REST = 0.7;      // how bouncy it is
const A_WALL_GOAL_GAP = 210;  // no wall closer than this to a goal line
const FIGHTER_R = 26;         // collision radius
const FIGHTER_H = 74;         // standing height, feet at y=0
const EYE_H = 58;             // eye/muzzle height above the feet

const F_ACCEL = 2100;         // ground acceleration (units/s^2)
const F_MAXV = 330;           // ground top speed
const F_AIRACCEL = 640;       // reduced control while airborne
const F_FRICTION = 9.2;       // ground damping when not pressing a direction
const F_JUMP = 560;           // jump impulse
const F_GRAV = 1750;          // gravity in the arena, a touch snappier than 2D
const F_DASH = 780;           // dash impulse along the current facing
const F_DASH_CD = 1.5;        // dash cooldown (seconds)

const HP_MAX = 100;
const SHOT_DMG = 25;          // four hits kill
const SHOT_SPD = 1750;        // projectile speed (units/s)
const SHOT_R = 6;
const SHOT_LIFE = 1.6;
const FIRE_CD = 0.22;         // between shots
const RESPAWN_T = 2;          // seconds dead before respawning

// Camera: behind and above the fighter's eye line.
const CAM_DIST = 165;
const CAM_LIFT = 34;
const CAM_MIN_DIST = 46;      // when geometry crowds the camera in
const MOUSE_SENS = 0.0026;    // radians per pixel of mouse movement
const STICK_SENS = 2.4;       // radians per second at full stick deflection

/** Is the 3D arena the live scene? */
const isArena3D = () => game.scene === SCENE.ARENA3D && !!game.arena;

/*
  Cover layout. Low obstacles only, set off the centre line: they break up a run
  and give the ball something to bounce off, without walling off the middle of the
  pitch the way the old deathmatch pillar did.

  Nothing is tall enough to hide a goal, because a soccer mode needs sight of
  what you are shooting at. Boxes are axis-aligned and never overlap, which is
  what lets collision be a per-axis rejection and lets face sorting ignore
  interpenetration.
*/
function arenaCover() {
  const c = [];
  const crate = (x, z, w, h, d) => c.push({ x, y: h / 2, z, hw: w / 2, hh: h / 2, hd: d / 2 });
  // Four low blocks in the quarters, to bounce the ball off and duck behind.
  crate(-300, -330, 130, 70, 130);
  crate(300, -330, 130, 70, 130);
  crate(-300, 330, 130, 70, 130);
  crate(300, 330, 130, 70, 130);
  // Two waist-high walls flanking the centre circle, leaving the middle open.
  crate(-390, 0, 80, 62, 300);
  crate(390, 0, 80, 62, 300);
  return c;
}

/** The goal line z for a side: 0 defends -z, 1 defends +z. */
const aGoalLineZ = (side) => (side === 0 ? -ARENA_HD : ARENA_HD);

/**
 * Which goal has the ball gone into, if any?
 *
 * Returns the side that CONCEDED (0 or 1), or -1. Mirrors the 2D goalScored
 * contract: inside the mouth and under the bar scores, everything else does not.
 */
function arenaGoalScored(b) {
  if (!b) return -1;
  if (Math.abs(b.x) > A_GOAL_W / 2) return -1;      // wide of the posts
  if (b.y > A_GOAL_H) return -1;                    // over the bar
  if (b.z <= aGoalLineZ(0)) return 0;               // into side 0's net
  if (b.z >= aGoalLineZ(1)) return 1;               // into side 1's net
  return -1;
}

/** A fresh ball on the centre spot. */
function makeArenaBall() {
  return { x: 0, y: A_BALL_R + 40, z: 0, vx: 0, vy: 0, vz: 0, r: A_BALL_R,
           lastTouch: -1 };
}

/**
 * Advance the ball: gravity, drag, the floor, the walls, cover and the posts.
 *
 * Substepped like everything else, so a hard shot cannot tunnel through a post
 * or the back of the net.
 */
function stepArenaBall(dt) {
  const b = game.arena.ball;
  if (!b) return;

  b.vy -= A_BALL_GRAV * dt;
  const d = 1 - A_BALL_DRAG * dt;
  b.vx *= d; b.vz *= d; b.vy *= d;

  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.z += b.vz * dt;

  // Floor.
  if (b.y < b.r) {
    b.y = b.r;
    if (b.vy < 0) b.vy = -b.vy * A_BALL_REST;
    // Rolling friction, so the ball settles instead of sliding forever.
    b.vx *= 0.985;
    b.vz *= 0.985;
    if (Math.abs(b.vy) < 30) b.vy = 0;
  }
  // Ceiling.
  if (b.y > ARENA_WALL_H - b.r) {
    b.y = ARENA_WALL_H - b.r;
    if (b.vy > 0) b.vy = -b.vy * A_BALL_REST;
  }

  // Side walls always bounce.
  const lx = ARENA_HW - b.r;
  if (b.x < -lx) { b.x = -lx; b.vx = Math.abs(b.vx) * A_BALL_REST; }
  if (b.x > lx) { b.x = lx; b.vx = -Math.abs(b.vx) * A_BALL_REST; }

  /*
    The end walls bounce EXCEPT through the goal mouth, which is what makes a
    goal possible at all. Inside the mouth the ball carries on into the net and
    is stopped by the back of it, so a goal visibly ends with the ball in the net
    rather than vanishing at the line.
  */
  const inMouth = Math.abs(b.x) < A_GOAL_W / 2 - b.r * 0.2 && b.y < A_GOAL_H;
  const lz = ARENA_HD - b.r;
  if (b.z < -lz) {
    if (inMouth) {
      // Back of the net.
      const back = -ARENA_HD - A_GOAL_D + b.r;
      if (b.z < back) { b.z = back; b.vz = Math.abs(b.vz) * 0.2; }
    } else {
      b.z = -lz; b.vz = Math.abs(b.vz) * A_BALL_REST;
    }
  }
  if (b.z > lz) {
    if (inMouth) {
      const back = ARENA_HD + A_GOAL_D - b.r;
      if (b.z > back) { b.z = back; b.vz = -Math.abs(b.vz) * 0.2; }
    } else {
      b.z = lz; b.vz = -Math.abs(b.vz) * A_BALL_REST;
    }
  }

  // Posts and crossbar: a shot off the woodwork must rebound, not pass through.
  for (const side of [0, 1]) {
    const gz = aGoalLineZ(side);
    if (Math.abs(b.z - gz) > b.r + A_POST_R) continue;
    // Uprights.
    for (const px of [-A_GOAL_W / 2, A_GOAL_W / 2]) {
      if (b.y < A_GOAL_H && Math.abs(b.x - px) < b.r + A_POST_R) {
        b.x = px + Math.sign(b.x - px || 1) * (b.r + A_POST_R);
        b.vx = Math.sign(b.x - px || 1) * Math.abs(b.vx) * A_BALL_REST;
        b.vz *= 0.7;
      }
    }
    // Crossbar.
    if (Math.abs(b.x) < A_GOAL_W / 2 && Math.abs(b.y - A_GOAL_H) < b.r + A_POST_R) {
      b.y = A_GOAL_H + Math.sign(b.y - A_GOAL_H || 1) * (b.r + A_POST_R);
      b.vy = Math.sign(b.y - A_GOAL_H || 1) * Math.abs(b.vy) * A_BALL_REST;
    }
  }

  ballVsArenaCover(b);
  ballVsArenaWalls(b);
}

/** Bounce the ball off cover boxes, along the axis of least penetration. */
function ballVsArenaCover(b) {
  for (const c of game.arena.cover) {
    const dx = b.x - c.x, dy = b.y - c.y, dz = b.z - c.z;
    const ox = c.hw + b.r - Math.abs(dx);
    const oy = c.hh + b.r - Math.abs(dy);
    const oz = c.hd + b.r - Math.abs(dz);
    if (ox <= 0 || oy <= 0 || oz <= 0) continue;
    // Push out the shallow way and reflect that component.
    if (oy <= ox && oy <= oz) {
      b.y += dy >= 0 ? oy : -oy;
      b.vy = (dy >= 0 ? 1 : -1) * Math.abs(b.vy) * A_BALL_REST;
    } else if (ox <= oz) {
      b.x += dx >= 0 ? ox : -ox;
      b.vx = (dx >= 0 ? 1 : -1) * Math.abs(b.vx) * A_BALL_REST;
    } else {
      b.z += dz >= 0 ? oz : -oz;
      b.vz = (dz >= 0 ? 1 : -1) * Math.abs(b.vz) * A_BALL_REST;
    }
  }
}

/**
 * Body contact between a fighter and the ball: a shove, not a kick.
 *
 * Dribbling falls out of this — walking into the ball nudges it along ahead of
 * you, so a player can carry it upfield without pressing anything.
 */
function fighterVsArenaBall(f) {
  const b = game.arena.ball;
  if (!b || f.dead) return;
  const dx = b.x - f.x, dz = b.z - f.z;
  const dy = b.y - (f.y + FIGHTER_H * 0.5);
  /*
    A generous contact radius. At exactly FIGHTER_R + ball radius the two only
    touch when already interpenetrating, which made dribbling feel dead — the
    ball slipped past the player instead of being pushed. The extra reach means a
    player running at the ball reliably makes contact with it.
  */
  const rr = FIGHTER_R + b.r + 16;
  const flat = Math.hypot(dx, dz);
  if (flat > rr || Math.abs(dy) > FIGHTER_H * 0.75) return;

  const nx = flat > 1e-6 ? dx / flat : 1;
  const nz = flat > 1e-6 ? dz / flat : 0;
  // Separate, then push the ball away with some of the player's momentum.
  b.x = f.x + nx * rr;
  b.z = f.z + nz * rr;
  const along = f.vx * nx + f.vz * nz;
  b.vx += nx * 190 + f.vx * 0.42 + nx * Math.max(0, along) * 0.4;
  b.vz += nz * 190 + f.vz * 0.42 + nz * Math.max(0, along) * 0.4;
  if (b.y < b.r * 1.2) b.vy = Math.max(b.vy, 120);   // pops off the ground
  limitArenaBall(b);
  b.lastTouch = f.seat;
}

/** Cap the ball's speed in 3D. */
function limitArenaBall(b) {
  const s = Math.hypot(b.vx, b.vy, b.vz);
  if (s > A_BALL_MAX_V) {
    const k = A_BALL_MAX_V / s;
    b.vx *= k; b.vy *= k; b.vz *= k;
  }
  return b;
}

/**
 * Kick the ball, if it is within reach ahead of the fighter.
 *
 * Aimed along the fighter's look direction rather than merely forward, so pitch
 * decides whether a shot is driven low or lofted — the crosshair means the same
 * thing here as it did when this mode was a shooter.
 */
function kickArenaBall(f) {
  const A = game.arena;
  const b = A.ball;
  if (!b || f.dead || f.kickCD > 0) return false;
  f.kickCD = A_KICK_CD;
  f.kickT = 0.18;                       // for the leg animation

  const dir = aimRay(f);
  const eye = fighterEye(f);
  // Reach is measured from a point just ahead of the player, so a kick connects
  // with what is in front of them rather than what is inside them.
  const ahead = v3(f.x + dir.x * A_KICK_REACH * 0.5, f.y + FIGHTER_H * 0.4,
                   f.z + dir.z * A_KICK_REACH * 0.5);
  const d = Math.hypot(b.x - ahead.x, (b.y - ahead.y) * 0.7, b.z - ahead.z);
  if (d > FIGHTER_R + b.r + A_KICK_REACH) return false;

  const power = A_KICK_V * superKickMul(f);
  b.vx = dir.x * power + f.vx * A_BALL_SPIN;
  b.vz = dir.z * power + f.vz * A_BALL_SPIN;
  // Always some lift, plus whatever the player is aiming at.
  b.vy = Math.max(dir.y * power, 0) + power * A_KICK_UP;
  limitArenaBall(b);
  b.lastTouch = f.seat;
  superGain(f, SUPER_GAIN_KICK * (game.rules.superRate || 1));
  A.hitFx.push({ x: b.x, y: b.y, z: b.z, life: 0.18 });
  game.shake = Math.max(game.shake, 0.12);
  void eye;
  return true;
}

/* ---- grab and throw --------------------------------------------------- */

/** Where a carried ball rides: ahead of the chest, along the look direction. */
function carryPoint(f) {
  const dir = aimRay(f);
  return v3(f.x + dir.x * A_GRAB_FWD,
            f.y + FIGHTER_H * 0.55 + dir.y * A_GRAB_FWD * 0.5,
            f.z + dir.z * A_GRAB_FWD);
}

/** Is this fighter holding the ball? */
const isCarrying = (f) => !!f && !!game.arena && game.arena.carriedBy === f.seat;

/**
 * Take hold of the ball if it is close enough. Returns true on success.
 *
 * Refused while the ball is already held — including by yourself — so grab is
 * never a way to re-seat the ball into a better position for free.
 */
function grabBall(f) {
  const A = game.arena;
  if (!A || !A.ball || f.dead || f.grabCD > 0) return false;
  if (!game.rules.grab) return false;
  if (A.carriedBy >= 0) return false;
  const b = A.ball;
  const p = carryPoint(f);
  // Measured from the carry point, so the ball you can see in front of you is the
  // ball you can pick up.
  if (Math.hypot(b.x - p.x, b.y - p.y, b.z - p.z) > A_GRAB_REACH + b.r) return false;

  A.carriedBy = f.seat;
  f.grabT = A_GRAB_T;
  b.vx = b.vy = b.vz = 0;
  b.lastTouch = f.seat;
  superGain(f, SUPER_GAIN_TOUCH * (game.rules.superRate || 1));
  A.hitFx.push({ x: b.x, y: b.y, z: b.z, life: 0.2 });
  return true;
}

/**
 * Release the ball. `thrown` sends it along the look direction; otherwise it is
 * simply dropped, which is what a knockdown or an expired hold does.
 */
function releaseBall(f, thrown) {
  const A = game.arena;
  if (!A || !isCarrying(f)) return false;
  const b = A.ball;
  A.carriedBy = -1;
  f.grabT = 0;
  f.grabCD = A_GRAB_CD;

  if (!thrown) {
    // Dropped at the carry point with the carrier's momentum, so it falls
    // naturally rather than stopping dead in the air.
    b.vx = f.vx * 0.5;
    b.vz = f.vz * 0.5;
    b.vy = Math.min(0, f.vy);
    return true;
  }
  const dir = aimRay(f);
  const power = A_THROW_V * superKickMul(f);
  b.vx = dir.x * power + f.vx * A_BALL_SPIN;
  b.vz = dir.z * power + f.vz * A_BALL_SPIN;
  b.vy = Math.max(dir.y * power, 0) + power * A_THROW_UP;
  limitArenaBall(b);
  b.lastTouch = f.seat;
  superGain(f, SUPER_GAIN_KICK * (game.rules.superRate || 1));
  game.shake = Math.max(game.shake, 0.14);
  A.hitFx.push({ x: b.x, y: b.y, z: b.z, life: 0.2 });
  return true;
}

/** Keep a held ball glued to its carrier, and expire the hold. */
function stepCarry(dt) {
  const A = game.arena;
  if (!A || A.carriedBy < 0) return;
  const f = A.fighters[A.carriedBy];
  const b = A.ball;
  if (!f || !b) { A.carriedBy = -1; return; }
  // A knocked-down carrier loses the ball, which is what makes shooting useful.
  if (f.dead) { releaseBall(f, false); return; }

  f.grabT -= dt;
  if (f.grabT <= 0) { releaseBall(f, false); return; }

  const p = carryPoint(f);
  b.x = p.x;
  b.y = Math.max(b.r, p.y);
  b.z = p.z;
  b.vx = f.vx;
  b.vy = f.vy;
  b.vz = f.vz;
}

/* ---- jetpack ---------------------------------------------------------- */

/**
 * Burn fuel for upward thrust, or refill on the ground.
 *
 * Thrust is capped rather than accumulated, so holding it produces a steady climb
 * to a ceiling speed instead of an ever-faster ascent — a jetpack you can ride
 * out of the arena is not a jetpack, it is an exit.
 */
function stepJetpack(f, held, dt) {
  if (f.dead) return;
  if (held && f.jet > 0 && game.rules.jetpack) {
    f.jet = Math.max(0, f.jet - dt);
    f.vy = Math.min(f.vy + A_JET_THRUST * dt, A_JET_VMAX);
    f.onGround = false;
    f.jetFx = 0.12;
  } else if (f.onGround) {
    f.jet = Math.min(A_JET_MAX, f.jet + A_JET_REFILL * dt);
  }
  if (f.jetFx > 0) f.jetFx -= dt;
}

/* ---- walls ------------------------------------------------------------ */

/**
 * May this fighter raise a wall?
 *
 * The goalmouth rule matters: a wall planted on a goal line would make that goal
 * unscoreable, so builds near either line are refused outright rather than
 * nudged — a wall that silently appears somewhere else is more confusing than one
 * that does not appear.
 */
function arenaCanBuild(f) {
  if (!game.arena || !game.rules.walls3d) return false;
  if (f.dead || f.wallCD > 0 || f.wallCharges <= 0) return false;
  const mine = game.arena.walls.filter((w) => w.owner === f.seat).length;
  if (mine >= A_WALL_CHARGES) return false;
  const dir = aimRay(f);
  const wz = f.z + dir.z * A_WALL_AHEAD;
  // Too close to either goal line, whichever end.
  return Math.abs(Math.abs(wz) - ARENA_HD) > A_WALL_GOAL_GAP;
}

/** Raise a wall in front of `f`. Returns it, or null if refused. */
function arenaBuildWall(f) {
  if (!arenaCanBuild(f)) return null;
  const dir = aimRay(f);
  /*
    Axis-aligned, oriented by whichever way the builder is mostly facing: a
    freely-rotated slab would need a rotated collider, and every collider in this
    mode is axis-aligned by design.
  */
  const alongZ = Math.abs(dir.z) >= Math.abs(dir.x);
  const wx = clamp(f.x + dir.x * A_WALL_AHEAD,
                   -ARENA_HW + A_WALL_W / 2, ARENA_HW - A_WALL_W / 2);
  const wz = clamp(f.z + dir.z * A_WALL_AHEAD,
                   -ARENA_HD + A_WALL_W / 2, ARENA_HD - A_WALL_W / 2);
  const wall = {
    owner: f.seat,
    x: wx, y: A_WALL_H / 2, z: wz,
    hw: alongZ ? A_WALL_W / 2 : A_WALL_D / 2,
    hh: A_WALL_H / 2,
    hd: alongZ ? A_WALL_D / 2 : A_WALL_W / 2,
    life: A_WALL_LIFE,
    hp: A_WALL_HP,
    born: 0,                  // grows from 0 to 1, for the rise animation
    hitCD: 0,
  };
  game.arena.walls.push(wall);
  f.wallCharges--;
  f.wallCD = A_WALL_CD;
  game.shake = Math.max(game.shake, 0.14);
  return wall;
}

/** Age walls, recharge builders, and drop what has expired. */
function stepArenaWalls(dt) {
  const A = game.arena;
  for (let i = A.walls.length - 1; i >= 0; i--) {
    const w = A.walls[i];
    w.born = Math.min(1, w.born + dt * 5);
    w.life -= dt;
    if (w.hitCD > 0) w.hitCD -= dt;
    if (w.life <= 0 || w.hp <= 0) A.walls.splice(i, 1);
  }
  for (const f of A.fighters) {
    if (f.wallCD > 0) f.wallCD -= dt;
    if (f.wallCharges < A_WALL_CHARGES) {
      f.wallRecharge -= dt;
      if (f.wallRecharge <= 0) { f.wallCharges++; f.wallRecharge = A_WALL_RECHARGE; }
    }
  }
}

/** A wall as a box, for the shared collision helpers. */
const wallBox = (w) => ({ x: w.x, y: w.y, z: w.z, hw: w.hw, hh: w.hh, hd: w.hd });

/** Bounce the ball off standing walls, damaging them on a hard hit. */
function ballVsArenaWalls(b) {
  for (const w of game.arena.walls) {
    const dx = b.x - w.x, dy = b.y - w.y, dz = b.z - w.z;
    const ox = w.hw + b.r - Math.abs(dx);
    const oy = w.hh + b.r - Math.abs(dy);
    const oz = w.hd + b.r - Math.abs(dz);
    if (ox <= 0 || oy <= 0 || oz <= 0) continue;

    const speed = Math.hypot(b.vx, b.vy, b.vz);
    if (oy <= ox && oy <= oz) {
      b.y += dy >= 0 ? oy : -oy;
      b.vy = (dy >= 0 ? 1 : -1) * Math.abs(b.vy) * A_WALL_REST;
    } else if (ox <= oz) {
      b.x += dx >= 0 ? ox : -ox;
      b.vx = (dx >= 0 ? 1 : -1) * Math.abs(b.vx) * A_WALL_REST;
    } else {
      b.z += dz >= 0 ? oz : -oz;
      b.vz = (dz >= 0 ? 1 : -1) * Math.abs(b.vz) * A_WALL_REST;
    }
    // A hard shot damages it, on a cooldown so one contact is one hit.
    if (speed > 700 && w.hitCD <= 0) {
      w.hp--;
      w.hitCD = 0.2;
      game.arena.hitFx.push({ x: b.x, y: b.y, z: b.z, life: 0.25 });
    }
  }
}

/**
 * A goal was scored. `conceded` is the side whose net it went into.
 *
 * Routes through the same finishMatch and recordResult as every other mode, so
 * the scoreboard, leaderboard and win screen need no special case.
 */
function arenaGoal(conceded) {
  const A = game.arena;
  const scorer = 1 - conceded;
  A.goals[scorer]++;
  game.score[scorer] = A.goals[scorer];
  game.lastScorer = scorer;
  game.shake = Math.max(game.shake, 0.5);
  game.flash = Math.max(game.flash, 0.4);
  A.celebrate = 2.2;
  A.hitFx.push({ x: A.ball.x, y: A.ball.y, z: A.ball.z, life: 0.9 });
  // Conceding charges the loser's superpower, exactly as in the 2D game.
  const victim = A.fighters[conceded];
  superGain(victim, SUPER_GAIN_CONCEDE * (game.rules.superRate || 1));

  if (A.goals[scorer] >= game.goalsToWin) {
    finishMatch(scorer, false);
    return;
  }
  arenaKickoff(scorer);
}

/** Reset for a kickoff. The side that CONCEDED gets the advantage of position. */
function arenaKickoff(lastScorer) {
  const A = game.arena;
  A.ball = makeArenaBall();
  A.shots.length = 0;
  for (const f of A.fighters) {
    const sp = arenaSpawns()[f.seat === 0 ? 0 : 3];
    f.x = sp.x; f.y = 0; f.z = sp.z;
    f.vx = f.vy = f.vz = 0;
    f.yaw = sp.yaw;
    f.pitch = 0;
    f.kickCD = 0;
    f.kickT = 0;
    f.hp = HP_MAX;
    f.dead = false;
    f.respawn = 0;
    // Abilities are restored at a kickoff: a fresh restart should not punish
    // whoever happened to spend a wall charge just before the goal.
    f.grabT = 0;
    f.grabCD = 0;
    f.jet = A_JET_MAX;
    f.wallCharges = A_WALL_CHARGES;
    f.wallCD = 0;
    f.wallRecharge = A_WALL_RECHARGE;
  }
  A.walls.length = 0;
  A.carriedBy = -1;
  void lastScorer;
  updateArenaCameras();
}

/*
  Spawn points, one per corner of the arena, inset clear of the crates. Two
  fighters and four spawns means a death can always be answered with a spawn
  away from the killer — see respawnFighter.

  Each yaw faces the middle of the room: camBasis builds forward as
  (sin yaw, ·, cos yaw), so the yaw that looks from a spawn toward the origin is
  atan2(-x, -z). Spawning with your back to the fight is disorienting, and the
  first version of this table had every corner facing the wall behind it.
*/
function arenaSpawns() {
  const facingCentre = (x, z) => Math.atan2(-x, -z);
  /*
    Set back in each half, on the long axis, so a kickoff starts each player in
    front of their own goal facing the centre spot — where the ball is. Off the
    exact centre line so neither has a straight run at it.
  */
  return [
    { x: -130, z: -470, yaw: facingCentre(-130, -470) },
    { x: 130, z: -470, yaw: facingCentre(130, -470) },
    { x: -130, z: 470, yaw: facingCentre(-130, 470) },
    { x: 130, z: 470, yaw: facingCentre(130, 470) },
  ];
}

/** A fighter for one seat, at the seat's opening spawn. */
function makeFighter(seat, team) {
  const sp = arenaSpawns()[seat === 0 ? 0 : 3];
  return {
    seat,
    team,
    x: sp.x, y: 0, z: sp.z,
    vx: 0, vy: 0, vz: 0,
    yaw: sp.yaw,
    pitch: 0,
    hp: HP_MAX,
    onGround: true,
    fireCD: 0,
    dashCD: 0,
    dead: false,
    respawn: 0,
    hurt: 0,             // >0 briefly after taking a hit, for the HUD flash
    kickCD: 0,           // between kicks
    kickT: 0,            // >0 while the leg is swinging, for the animation
    // Grab, jetpack and wall building, all shared with the 2D game in spirit.
    grabT: 0,            // >0 while holding the ball; counts the hold down
    grabCD: 0,           // before another grab is allowed
    jet: A_JET_MAX,      // jetpack fuel, in seconds
    jetFx: 0,            // >0 briefly after thrusting, for the flame
    wallCharges: A_WALL_CHARGES,
    wallCD: 0,
    wallRecharge: A_WALL_RECHARGE,
    /*
      Superpower state, sharing the meter, table and charge rules with the 2D
      game — so a team's identity is the same in both halves. What each power
      DOES differs, since there is no ball here: see fireArenaSuper.
    */
    superCharge: 0,
    superT: 0,
    superId: superForTeam(team),
    superSpeed: 1,       // multiplier while a movement power runs
    shield: 0,           // >0 while damage is being absorbed
    rapid: 0,            // >0 while the fire rate is boosted
    // Bot memory, only used when this seat is CPU-driven.
    ai: null,
  };
}

/**
 * Fire a fighter's superpower in the 3D arena.
 *
 * The team's power is the same; its effect is translated into deathmatch terms,
 * because half the 2D powers act on a ball that does not exist here. The mapping
 * is deliberately thematic rather than literal — a Bulwark still turns you into a
 * wall, it just absorbs bullets instead of shoves.
 */
function fireArenaSuper(f) {
  const def = superDef(f);
  if (!def) return false;
  f.superCharge = 0;
  f.superT = def.dur || 0;
  game.shake = Math.max(game.shake, 0.3);
  game.arena.hitFx.push({ x: f.x, y: f.y + EYE_H, z: f.z, life: 0.5 });

  const foe = game.arena.fighters.find((o) => o.seat !== f.seat);

  switch (f.superId) {
    case "rocket":
    case "panther":
    case "charge":
      // Movement powers: raw speed for the duration.
      f.superSpeed = f.superId === "panther" ? 1.6 : 1.45;
      break;
    case "bulwark":
    case "sentinel":
      // Defensive powers absorb damage rather than resisting a shove.
      f.shield = def.dur;
      break;
    case "volley":
    case "cannon":
    case "venom":
      // Offensive powers become rapid fire, which is what "more shots" means here.
      f.rapid = def.dur;
      break;
    case "flea":
    case "tumble":
      // Air powers: a large upward launch, and reduced gravity handled in
      // stepFighter via superT.
      f.vy = Math.max(f.vy, F_JUMP * 1.35);
      f.onGround = false;
      break;
    case "blink": {
      // Teleport behind the opponent — the deathmatch reading of "get to the
      // ball instantly" is "get to the fight instantly".
      if (foe) {
        const away = v3norm(v3(f.x - foe.x, 0, f.z - foe.z));
        f.x = clamp(foe.x - away.x * 90, -ARENA_HW + FIGHTER_R, ARENA_HW - FIGHTER_R);
        f.z = clamp(foe.z - away.z * 90, -ARENA_HD + FIGHTER_R, ARENA_HD - FIGHTER_R);
        f.yaw = Math.atan2(foe.x - f.x, foe.z - f.z);
        f.vx = f.vz = 0;
        fighterVsCover(f);
      }
      break;
    }
    case "quake": {
      // A shockwave: damages and launches a grounded opponent nearby.
      if (foe && !foe.dead) {
        const d = Math.hypot(foe.x - f.x, foe.z - f.z);
        if (d < 320 && foe.onGround) {
          applyDamage(foe, SHOT_DMG, f.seat);
          if (game.arena) { foe.vy = F_JUMP * 0.9; foe.onGround = false; }
        }
      }
      break;
    }
    case "freeze": {
      // Root the opponent: their movement is disabled while this runs.
      if (foe) foe.frozen = def.dur;
      break;
    }
    case "titan":
    case "livewire":
    case "owl":
      // Control powers all read as "slow the other side down" here.
      if (foe) foe.slowed = def.dur;
      break;
    default:
      break;
  }
  return true;
}

/**
 * Put a fighter back in play at whichever spawn is furthest from the enemy.
 *
 * Respawning next to your killer is the fastest way to make a deathmatch feel
 * unfair, so the spawn is chosen by distance rather than at random.
 */
function respawnFighter(f) {
  // A fighter can be mid-respawn when the match ends; without the arena there is
  // no opponent to spawn away from, so any spawn will do.
  const foe = game.arena
    ? game.arena.fighters.find((o) => o.seat !== f.seat)
    : null;
  const spawns = arenaSpawns();
  let best = spawns[0], bestD = -1;
  for (const s of spawns) {
    // A dead opponent exerts no pressure, so any spawn will do; guard anyway
    // so this never depends on the order deaths are resolved in.
    const d = foe && !foe.dead ? Math.hypot(s.x - foe.x, s.z - foe.z) : 1;
    if (d > bestD) { bestD = d; best = s; }
  }
  f.x = best.x; f.y = 0; f.z = best.z;
  f.vx = f.vy = f.vz = 0;
  f.yaw = best.yaw;
  f.pitch = 0;
  f.hp = HP_MAX;
  f.dead = false;
  f.respawn = 0;
  f.onGround = true;
  f.fireCD = 0;
  f.dashCD = 0;
  /*
    Death cancels a running power but KEEPS the charge meter. Losing the charge
    too would punish the player twice for one death, and the meter is meant to be
    a comeback mechanic.
  */
  f.superT = 0;
  f.superSpeed = 1;
  f.shield = 0;
  f.rapid = 0;
  f.frozen = 0;
  f.slowed = 0;
}

/**
 * Begin a 3D deathmatch. Called from startMatch in place of kickoff.
 *
 * Builds `game.arena` from scratch every time: leaving state between matches is
 * how a stale fighter or a live projectile from the previous round leaks into
 * the next one.
 */
function startArena3D() {
  const fighters = [makeFighter(0, TEAMS[game.sel[0]]), makeFighter(1, TEAMS[game.sel[1]])];
  game.arena = {
    fighters,
    // One camera per seat, so split-screen is two independent views.
    cam: [
      { yaw: fighters[0].yaw, pitch: 0.06, dist: CAM_DIST, pos: v3(0, 0, 0) },
      { yaw: fighters[1].yaw, pitch: 0.06, dist: CAM_DIST, pos: v3(0, 0, 0) },
    ],
    shots: [],
    /*
      GOALS are the win condition, not frags. `frags` is kept alongside as a
      secondary statistic — shooting still stuns an opponent and is worth doing —
      but only `goals` decides the match.
    */
    ball: makeArenaBall(),
    goals: [0, 0],
    frags: [0, 0],
    celebrate: 0,           // >0 briefly after a goal, for the banner
    cover: arenaCover(),
    walls: [],              // player-built walls, as in the 2D game
    carriedBy: -1,          // seat holding the ball, or -1
    hitFx: [],
    // Two humans share the screen; one human plus a bot does not.
    split: !game.cpu[0] && !game.cpu[1],
  };
  game.score = [0, 0];
  game.particles = [];
  game.scene = SCENE.ARENA3D;
  game.suddenDeath = false;
  game.clock = game.matchSecs;
  // Cameras must be correct on the very first rendered frame, before any
  // simulation step has run, or the match opens on a black screen.
  updateArenaCameras();
}

/** Tear the arena down, so no other scene can read stale 3D state. */
function endArena3D() {
  game.arena = null;
  releaseArenaLock();
}

/**
 * Does the segment from `a` to `b` pass through any cover box?
 *
 * Used both to pull the camera in when a crate would hide the fighter, and by
 * the bot to decide whether it has a clear shot. A slab test per box: cheap,
 * exact for axis-aligned boxes, and it needs no square roots.
 */
function segmentHitsCover(a, b, pad = 0) {
  /*
    A frag can end the match — and tear the arena down — part-way through a step
    that still has projectiles and a bot decision left to resolve. Treating a
    torn-down arena as "nothing to hit" is correct: there is no world left to
    collide with, and the alternative is a crash on the winning shot.
  */
  if (!game.arena) return false;
  const d = v3sub(b, a);
  // Built walls block sight, shots and the camera just as fixed cover does.
  const boxes = game.arena.walls && game.arena.walls.length
    ? game.arena.cover.concat(game.arena.walls.map(wallBox))
    : game.arena.cover;
  for (const c of boxes) {
    const lo = [c.x - c.hw - pad, c.y - c.hh - pad, c.z - c.hd - pad];
    const hi = [c.x + c.hw + pad, c.y + c.hh + pad, c.z + c.hd + pad];
    const o = [a.x, a.y, a.z], dir = [d.x, d.y, d.z];
    let t0 = 0, t1 = 1, miss = false;
    for (let i = 0; i < 3; i++) {
      if (Math.abs(dir[i]) < 1e-9) {
        // Parallel to this slab: either wholly inside it or it cannot be hit.
        if (o[i] < lo[i] || o[i] > hi[i]) { miss = true; break; }
        continue;
      }
      let ta = (lo[i] - o[i]) / dir[i];
      let tb = (hi[i] - o[i]) / dir[i];
      if (ta > tb) { const s = ta; ta = tb; tb = s; }
      t0 = Math.max(t0, ta);
      t1 = Math.min(t1, tb);
      if (t0 > t1) { miss = true; break; }
    }
    if (!miss) return true;
  }
  return false;
}

/**
 * Place each seat's camera behind and above its fighter.
 *
 * The camera is pulled in when a wall or crate would come between it and the
 * fighter: a third-person camera that clips into geometry hides the player from
 * themselves, which is worse than being a little close.
 */
function updateArenaCameras() {
  const A = game.arena;
  for (let s = 0; s < A.fighters.length; s++) {
    const f = A.fighters[s];
    const cam = A.cam[s];
    cam.yaw = f.yaw;
    cam.pitch = clamp(f.pitch, -PITCH_MAX, PITCH_MAX);

    const eye = v3(f.x, f.y + EYE_H, f.z);
    const b = camBasis(cam);
    // Ideal seat: straight back along the view axis, lifted a little.
    let dist = CAM_DIST;
    const wanted = v3add(v3sub(eye, v3scale(b.fwd, dist)), v3(0, CAM_LIFT, 0));

    /*
      Step the camera in until the sight line is clear. Eight samples is enough
      to look smooth at this speed and costs far less than a true swept test.
    */
    if (segmentHitsCover(eye, wanted, 8) || outsideArena(wanted)) {
      for (let i = 1; i <= 8; i++) {
        const t = 1 - i / 9;
        const d = CAM_MIN_DIST + (CAM_DIST - CAM_MIN_DIST) * t;
        const p = v3add(v3sub(eye, v3scale(b.fwd, d)), v3(0, CAM_LIFT * t, 0));
        if (!segmentHitsCover(eye, p, 8) && !outsideArena(p)) { dist = d; break; }
        dist = CAM_MIN_DIST;
      }
    }
    cam.dist = dist;
    const bb = camBasis(cam);
    cam.pos = v3add(v3sub(eye, v3scale(bb.fwd, dist)),
                    v3(0, CAM_LIFT * (dist / CAM_DIST), 0));
  }
}

/** Is this point outside the sealed arena box? Keeps the camera indoors. */
function outsideArena(p) {
  return p.x < -ARENA_HW + 6 || p.x > ARENA_HW - 6 ||
         p.z < -ARENA_HD + 6 || p.z > ARENA_HD - 6 ||
         p.y < 8 || p.y > ARENA_WALL_H - 6;
}

/**
 * Is `p` hidden from the camera by cover?
 *
 * THE WALLHACK FIX. The renderer is a painter's-algorithm rasteriser with no
 * depth buffer, so anything drawn after the world — fighters, the ball, tracers,
 * impacts — appeared straight through solid crates. Cover you can see through is
 * not cover, and it made the pillar in the middle of the arena pointless.
 *
 * Sprites therefore test their own visibility here before drawing. It is a
 * per-object test rather than per-pixel, so a fighter half behind a crate either
 * shows whole or not at all; at these object sizes that reads as intended
 * occlusion, and it costs one slab test per box instead of a depth buffer.
 */
function occludedFromCam(p, cam) {
  if (!game.arena) return false;
  // A small pad, so a sprite grazing the edge of a crate is still considered
  // visible — popping out at the exact silhouette is more distracting than a
  // pixel of overlap.
  return segmentHitsCover(cam.pos, p, -2);
}

/* ---- mouse look ----------------------------------------------------------

   Pointer lock is the only way to get unbounded mouse movement in a browser,
   and a lock the player cannot escape looks exactly like a frozen game. So the
   rules here are strict: the lock is only ever requested by a deliberate click
   inside the arena, and it is released on EVERY path out of the mode — pause,
   quit, match end, or any scene change at all.

   The mode stays fully playable if the lock is refused (some browsers refuse it
   outside a user gesture), because aim also has key bindings.
*/

const mouse = { dx: 0, dy: 0, locked: false, wantLock: false, fireHeld: false };

/** True when this environment can lock the pointer at all. */
const pointerLockSupported = () =>
  typeof document !== "undefined" && typeof document.exitPointerLock === "function";

function requestArenaLock() {
  mouse.wantLock = true;
  try {
    if (cv && cv.requestPointerLock) cv.requestPointerLock();
  } catch (e) { /* refused: the key bindings still work */ }
}

function releaseArenaLock() {
  mouse.wantLock = false;
  mouse.dx = 0;
  mouse.dy = 0;
  try {
    if (typeof document !== "undefined" && document.exitPointerLock) {
      document.exitPointerLock();
    }
  } catch (e) { /* nothing to release */ }
  mouse.locked = false;
}

/**
 * Consume the mouse movement accumulated since the last frame.
 *
 * Accumulated in the listener and drained exactly once per frame, so aim
 * sensitivity does not vary with frame rate or with how many physics substeps
 * a frame happens to run.
 */
function takeMouseDelta() {
  const d = { dx: mouse.dx, dy: mouse.dy };
  mouse.dx = 0;
  mouse.dy = 0;
  return d;
}

/* ---- movement -------------------------------------------------------- */

/**
 * The horizontal movement basis for a camera yaw.
 *
 * `fwd` is where the camera looks, flattened onto the floor; `right` is
 * screen-right. WASD is expressed in these, which is what makes W mean "away
 * from the camera" rather than "toward world north" — the third-person
 * convention every player already expects.
 */
function moveBasis(yaw) {
  return {
    fwd: v3(Math.sin(yaw), 0, Math.cos(yaw)),
    right: v3(Math.cos(yaw), 0, -Math.sin(yaw)),
  };
}

/**
 * Clamp a fighter inside the arena walls.
 *
 * Position only, plus killing the velocity into the wall: letting the velocity
 * survive means a player holding a direction against a wall accumulates speed
 * they then carry away from it, which feels like the wall spat them out.
 */
function arenaBounds(f) {
  const lim = ARENA_HW - FIGHTER_R;
  const limZ = ARENA_HD - FIGHTER_R;
  if (f.x < -lim) { f.x = -lim; if (f.vx < 0) f.vx = 0; }
  if (f.x > lim) { f.x = lim; if (f.vx > 0) f.vx = 0; }
  if (f.z < -limZ) { f.z = -limZ; if (f.vz < 0) f.vz = 0; }
  if (f.z > limZ) { f.z = limZ; if (f.vz > 0) f.vz = 0; }
  if (f.y < 0) { f.y = 0; f.vy = 0; f.onGround = true; }
  // A ceiling, so a dash up a wall cannot escape the room.
  const ceil = ARENA_WALL_H - FIGHTER_H;
  if (f.y > ceil) { f.y = ceil; if (f.vy > 0) f.vy = 0; }
}

/**
 * Push a fighter out of any cover box it has entered.
 *
 * Resolved along the axis of LEAST penetration, which for axis-aligned boxes is
 * both correct and stable: it is the shortest way out, so a fighter pressed
 * into a corner slides along the box rather than popping through it.
 *
 * The vertical case is handled first and separately, because landing on top of
 * a crate is a distinct outcome from bumping into its side — it grounds the
 * fighter, which is what makes crates climbable and worth using as cover.
 */
function fighterVsCover(f) {
  /*
    Built walls are solid to players exactly as cover is, so they share this
    resolver rather than having a near-identical copy — a wall you can walk
    through would be decoration, not a defensive tool.
  */
  const boxes = game.arena.walls && game.arena.walls.length
    ? game.arena.cover.concat(game.arena.walls.map(wallBox))
    : game.arena.cover;
  for (const c of boxes) {
    // The fighter is a box for this test: a capsule would be more accurate but
    // reads no differently at this speed, and this is exact and cheap.
    const dx = f.x - c.x;
    const dz = f.z - c.z;
    const fy0 = f.y, fy1 = f.y + FIGHTER_H;
    const cy0 = c.y - c.hh, cy1 = c.y + c.hh;

    const ox = c.hw + FIGHTER_R - Math.abs(dx);
    const oz = c.hd + FIGHTER_R - Math.abs(dz);
    if (ox <= 0 || oz <= 0) continue;              // clear horizontally
    if (fy0 >= cy1 || fy1 <= cy0) continue;        // clear vertically

    const oyTop = cy1 - fy0;                        // to stand on top
    const oyBot = fy1 - cy0;                        // to duck underneath

    /*
      Landing: falling, and the feet are near the top face. Checked before the
      horizontal push so a fighter descending onto a crate lands on it instead
      of being shoved out sideways at the last moment.
    */
    if (f.vy <= 0 && oyTop <= Math.min(ox, oz) && oyTop <= FIGHTER_H * 0.6) {
      f.y = cy1;
      f.vy = 0;
      f.onGround = true;
      continue;
    }
    // Hitting the underside while rising.
    if (f.vy > 0 && oyBot <= Math.min(ox, oz)) {
      f.y = cy0 - FIGHTER_H;
      f.vy = 0;
      continue;
    }
    // Otherwise push out along whichever horizontal axis is shallower.
    if (ox < oz) {
      f.x += dx >= 0 ? ox : -ox;
      if ((dx >= 0 && f.vx < 0) || (dx < 0 && f.vx > 0)) f.vx = 0;
    } else {
      f.z += dz >= 0 ? oz : -oz;
      if ((dz >= 0 && f.vz < 0) || (dz < 0 && f.vz > 0)) f.vz = 0;
    }
  }
}

/**
 * Advance one fighter by `dt` under its intent.
 *
 * `a` is the seat's intent record: left/right/up/down for movement, plus the
 * aim, jump and dash fields the 3D mode adds.
 */
function stepFighter(f, a, dt) {
  if (f.dead) {
    f.respawn -= dt;
    if (f.respawn <= 0) respawnFighter(f);
    return;
  }

  if (f.fireCD > 0) f.fireCD -= dt;
  if (f.dashCD > 0) f.dashCD -= dt;
  if (f.hurt > 0) f.hurt -= dt;
  if (f.shield > 0) f.shield = Math.max(0, f.shield - dt);
  if (f.rapid > 0) f.rapid = Math.max(0, f.rapid - dt);
  if (f.frozen > 0) f.frozen = Math.max(0, f.frozen - dt);
  if (f.slowed > 0) f.slowed = Math.max(0, f.slowed - dt);

  // Aim. Yaw wraps freely; pitch is clamped so the camera cannot tumble.
  // A frozen fighter cannot even look around, which is what makes the power
  // frightening rather than a mild inconvenience.
  if (!(f.frozen > 0)) {
    f.yaw += a.aimX || 0;
    f.pitch = clamp(f.pitch + (a.aimY || 0), -PITCH_MAX, PITCH_MAX);
  }

  // Movement, in the camera's frame rather than the world's.
  const frozen = f.frozen > 0;
  const b = moveBasis(f.yaw);
  let wx = 0, wz = 0;
  if (!frozen) {
    if (a.up) { wx += b.fwd.x; wz += b.fwd.z; }
    if (a.down) { wx -= b.fwd.x; wz -= b.fwd.z; }
    if (a.right) { wx += b.right.x; wz += b.right.z; }
    if (a.left) { wx -= b.right.x; wz -= b.right.z; }
  }

  const wl = Math.hypot(wx, wz);
  if (wl > 1e-6) {
    // Normalised, so pressing two keys is not faster than pressing one.
    wx /= wl; wz /= wl;
    const acc = (f.onGround ? F_ACCEL : F_AIRACCEL) * dt;
    f.vx += wx * acc;
    f.vz += wz * acc;
  } else if (f.onGround) {
    // Friction only on the ground: air control should not brake you.
    const k = Math.max(0, 1 - F_FRICTION * dt);
    f.vx *= k;
    f.vz *= k;
  }

  /*
    Ground speed cap, on the horizontal plane only so a jump's vertical speed is
    never clipped. A movement superpower raises the cap; being slowed by an
    opponent's power lowers it — both scale the same number, so the two can
    cancel rather than one silently winning.
  */
  const cap = F_MAXV * (f.superSpeed || 1) * (f.slowed > 0 ? 0.45 : 1);
  const sp = Math.hypot(f.vx, f.vz);
  if (sp > cap) { const k = cap / sp; f.vx *= k; f.vz *= k; }

  // FLEA JUMP and TUMBLE both allow a mid-air jump while they run.
  const airJump = f.superT > 0 && (f.superId === "flea" || f.superId === "tumble");
  if (a.jump && !frozen && (f.onGround || airJump)) {
    f.vy = F_JUMP;
    f.onGround = false;
  }

  // Dash: a burst along the current facing, on a cooldown. Deliberately
  // horizontal — a dash that also launched you would replace jumping.
  if (a.dashEdge && game.rules.dash && f.dashCD <= 0) {
    const boost = f.superT > 0 && f.superId === "panther" ? 1.4 : 1;
    f.vx += b.fwd.x * F_DASH * boost;
    f.vz += b.fwd.z * F_DASH * boost;
    f.dashCD = F_DASH_CD;
  }

  // SUPERPOWER, on the same key and the same meter as the 2D game.
  if (a.superEdge && superReady(f)) fireArenaSuper(f);
  if (f.superT > 0) {
    f.superT = Math.max(0, f.superT - dt);
    if (f.superT === 0) f.superSpeed = 1;
  }
  superGain(f, SUPER_GAIN_TIME * (game.rules.superRate || 1) * dt);

  // TUMBLE lightens gravity, so the acrobat genuinely floats rather than merely
  // jumping higher.
  const floaty = f.superT > 0 && f.superId === "tumble";
  f.vy -= F_GRAV * (floaty ? 0.28 : 1) * dt;

  f.x += f.vx * dt;
  f.y += f.vy * dt;
  f.z += f.vz * dt;

  // onGround is recomputed every step: it is only true if something is holding
  // the fighter up right now, which bounds and cover decide below.
  f.onGround = false;
  fighterVsCover(f);
  arenaBounds(f);
}

/* ---- shooting -------------------------------------------------------- */

/** Muzzle position: the fighter's eye line. */
const fighterEye = (f) => v3(f.x, f.y + EYE_H, f.z);

/**
 * The unit direction a fighter is aiming.
 *
 * Yaw and pitch together, so shots go where the crosshair is — the crosshair
 * sits at the viewport centre and the camera looks along this same vector, which
 * is what makes the aim honest.
 */
function aimRay(f) {
  const cp = Math.cos(f.pitch);
  return v3(Math.sin(f.yaw) * cp, Math.sin(f.pitch), Math.cos(f.yaw) * cp);
}

/** Fire, if the cooldown allows. Returns true when a shot was created. */
function fireShot(f) {
  // The arena can be torn down mid-step by a winning frag; a queued fire request
  // from the same step must then simply do nothing.
  if (!game.arena || f.dead || f.fireCD > 0) return false;
  const dir = aimRay(f);
  const eye = fighterEye(f);
  game.arena.shots.push({
    // Spawned slightly ahead of the eye so a shot never starts inside its owner.
    x: eye.x + dir.x * (FIGHTER_R + 2),
    y: eye.y + dir.y * (FIGHTER_R + 2),
    z: eye.z + dir.z * (FIGHTER_R + 2),
    vx: dir.x * SHOT_SPD,
    vy: dir.y * SHOT_SPD,
    vz: dir.z * SHOT_SPD,
    life: SHOT_LIFE,
    owner: f.seat,
  });
  // Rapid fire, from an offensive superpower.
  f.fireCD = FIRE_CD * (f.rapid > 0 ? 0.32 : 1);
  return true;
}

/*
  How hard a bullet shoves the ball. Well below a kick: shooting the ball is for
  nudging a loose one goalward or clearing your own line, not a replacement for
  getting to it — otherwise there would be no reason to run at the ball at all.
*/
const A_SHOT_PUSH = 620;

/**
 * Does a shot's travel this step touch the ball?
 *
 * Swept, like the fighter test, and for the same reason: at SHOT_SPD a bullet
 * crosses the ball in a fraction of one substep, so a point-in-sphere test would
 * miss nearly every hit.
 */
function shotVsBall(s, b, dt) {
  const ax = s.x, ay = s.y, az = s.z;
  const dx = s.vx * dt, dy = s.vy * dt, dz = s.vz * dt;
  const rr = (b.r + SHOT_R) * (b.r + SHOT_R);
  // Closest approach of the segment to the ball centre, clamped to the segment.
  const dd = dx * dx + dy * dy + dz * dz;
  let t = 0;
  if (dd > 1e-9) {
    t = ((b.x - ax) * dx + (b.y - ay) * dy + (b.z - az) * dz) / dd;
    t = clamp(t, 0, 1);
  }
  const px = ax + dx * t, py = ay + dy * t, pz = az + dz * t;
  const ex = px - b.x, ey = py - b.y, ez = pz - b.z;
  return ex * ex + ey * ey + ez * ez <= rr;
}

/**
 * Does a shot's travel this step touch a fighter?
 *
 * Tested as a swept segment against the fighter's capsule rather than a point
 * against a sphere: at 1750 units/s a shot crosses a 26-unit fighter in well
 * under one substep, so a point test would miss most hits outright.
 */
function shotVsFighter(s, f, dt) {
  if (f.dead) return false;
  const a = v3(s.x, s.y, s.z);
  const b = v3(s.x + s.vx * dt, s.y + s.vy * dt, s.z + s.vz * dt);
  const d = v3sub(b, a);
  const dd = v3dot(d, d);

  // The fighter's body as a vertical segment, foot to head.
  const c0 = v3(f.x, f.y + FIGHTER_R, f.z);
  const c1 = v3(f.x, f.y + FIGHTER_H - FIGHTER_R, f.z);
  const rr = (FIGHTER_R + SHOT_R) * (FIGHTER_R + SHOT_R);

  // Sample the swept segment against the body segment. Closed-form
  // segment-segment distance would be exact, but the shot is a straight line
  // over a hair of a second: sampling is simpler to read and its error is far
  // below the radii involved.
  const N = 6;
  for (let i = 0; i <= N; i++) {
    const t = dd > 0 ? i / N : 0;
    const p = v3(a.x + d.x * t, a.y + d.y * t, a.z + d.z * t);
    // Closest point on the body segment to p, clamped to the segment.
    const bv = v3sub(c1, c0);
    const bl = v3dot(bv, bv);
    const u = bl > 0 ? clamp(v3dot(v3sub(p, c0), bv) / bl, 0, 1) : 0;
    const q = v3add(c0, v3scale(bv, u));
    const diff = v3sub(p, q);
    if (v3dot(diff, diff) <= rr) return true;
    if (dd === 0) break;
  }
  return false;
}

/**
 * Apply damage, and resolve a death if it kills.
 *
 * `bySeat` is the shooter, so the frag is credited to them and never to the
 * victim. Returns true when this hit was fatal.
 */
function applyDamage(f, dmg, bySeat) {
  if (!game.arena || f.dead) return false;
  /*
    A shield absorbs the hit entirely rather than reducing it. Partial reduction
    would still let four shots kill through a defensive power, which would make it
    the weakest ability in the game instead of the sturdiest.
  */
  if (f.shield > 0) {
    f.hurt = 0.18;
    game.arena.hitFx.push({ x: f.x, y: f.y + EYE_H, z: f.z, life: 0.25 });
    superGain(f, SUPER_GAIN_DAMAGE * (game.rules.superRate || 1));
    return false;
  }
  f.hp -= dmg;
  f.hurt = 0.25;
  // Taking damage charges the victim's meter, so a losing fight builds a comeback.
  superGain(f, SUPER_GAIN_DAMAGE * (game.rules.superRate || 1));
  if (f.hp > 0) return false;

  f.hp = 0;
  f.dead = true;
  f.respawn = RESPAWN_T;
  f.vx = f.vy = f.vz = 0;
  const killer = game.arena.fighters.find((o) => o.seat === bySeat);
  if (killer && killer !== f) arenaFrag(killer, f);
  return true;
}

/**
 * Credit a frag and check whether that ends the match.
 *
 * The scoreline mirrors the frag count so the shared scoreboard, leaderboard and
 * win handling all work unchanged — `finishMatch` and `recordResult` are the
 * same ones every other mode uses.
 */
/**
 * Credit a knockdown.
 *
 * GOALS decide the match, so this no longer ends anything: a knockdown removes
 * the opponent from play for a couple of seconds, which is a chance to score
 * rather than a score in itself. The count is kept and shown as a secondary
 * statistic so shooting still visibly does something.
 */
function arenaFrag(killer, victim) {
  game.arena.frags[killer.seat]++;
  superGain(killer, SUPER_GAIN_FRAG * (game.rules.superRate || 1));
  game.shake = Math.max(game.shake, 0.3);
  game.arena.hitFx.push({ x: victim.x, y: victim.y + EYE_H, z: victim.z, life: 0.6 });
}

/** Advance every projectile, resolving hits and expiry. */
function stepShots(dt) {
  const A = game.arena;
  if (!A) return;
  for (let i = A.shots.length - 1; i >= 0; i--) {
    const s = A.shots[i];
    s.life -= dt;
    if (s.life <= 0) { A.shots.splice(i, 1); continue; }

    let done = false;

    /*
      THE BALL IS A TARGET. Shots used to test only against fighters and passed
      straight through the ball, which made the gun useless in a mode won on
      goals — you could not blast a loose ball toward the net or clear one off
      your own line. Checked BEFORE fighters so a shot along a line that touches
      both hits whichever is nearer, and a carried ball is skipped because it is
      the carrier who gets hit instead.
    */
    if (A.ball && A.carriedBy < 0 && shotVsBall(s, A.ball, dt)) {
      const dir = v3norm(v3(s.vx, s.vy, s.vz));
      A.ball.vx += dir.x * A_SHOT_PUSH;
      A.ball.vz += dir.z * A_SHOT_PUSH;
      // Always some lift, so a shot along the floor still pops the ball up
      // rather than merely scuffing it along.
      A.ball.vy += Math.max(dir.y * A_SHOT_PUSH, A_SHOT_PUSH * 0.3);
      limitArenaBall(A.ball);
      A.ball.lastTouch = s.owner;
      A.hitFx.push({ x: s.x, y: s.y, z: s.z, life: 0.25 });
      game.shake = Math.max(game.shake, 0.14);
      const shooter = A.fighters[s.owner];
      if (shooter) superGain(shooter, SUPER_GAIN_KICK * (game.rules.superRate || 1));
      A.shots.splice(i, 1);
      continue;
    }

    for (const f of A.fighters) {
      // Never friendly fire: a shot cannot hit the seat that fired it.
      if (f.seat === s.owner) continue;
      if (shotVsFighter(s, f, dt)) {
        applyDamage(f, SHOT_DMG, s.owner);
        A.hitFx.push({ x: s.x, y: s.y, z: s.z, life: 0.3 });
        done = true;
        break;
      }
    }
    /*
      A hit may have been the winning frag, which ends the match and clears
      game.arena. `A` is still a valid object to finish tidying, but nothing
      further should be simulated.
    */
    if (done) { A.shots.splice(i, 1); if (!game.arena) return; continue; }

    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.z += s.vz * dt;

    // Cover and walls stop a shot dead: no ricochets, so cover is dependable.
    if (s.y <= 0 || outsideArena(v3(s.x, s.y, s.z)) ||
        segmentHitsCover(v3(s.x, s.y, s.z), v3(s.x, s.y, s.z))) {
      A.hitFx.push({ x: s.x, y: s.y, z: s.z, life: 0.22 });
      A.shots.splice(i, 1);
    }
  }

  for (let i = A.hitFx.length - 1; i >= 0; i--) {
    A.hitFx[i].life -= dt;
    if (A.hitFx[i].life <= 0) A.hitFx.splice(i, 1);
  }
}

/* ---- the bot --------------------------------------------------------- */

/**
 * Decide what a CPU-driven fighter wants, and write it into that seat's intent.
 *
 * Reuses CPU_LEVELS — the same easy/medium/hard tuning the 2D game uses — so the
 * menu's difficulty row means the same thing in both halves of the game:
 *   react  how long it takes to respond to a new situation
 *   err    how far off its aim is
 *   aggr   how willing it is to close distance
 *   idle   how often it simply does nothing
 *   speed  a cap on how much of its movement it actually uses
 */
function updateArenaCPU(f, dt) {
  const a = intent[f.seat];
  const lvl = cpuCfg();
  const A = game.arena;
  const foe = A && A.fighters.find((o) => o.seat !== f.seat);

  a.left = a.right = a.up = a.down = false;
  a.jump = false;
